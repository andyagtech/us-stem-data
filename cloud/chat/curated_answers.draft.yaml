  - group: wages
    question: "Do H-1B employers pay below market rates?"
    skip: false
    answer: |-
      Yes, a significant proportion of H-1B employers pay below market rates. Specifically, **84.0%** of certified H-1B filings promise wages below the median for their occupation in their own metropolitan area. When compared against the national occupational median, **70.8%** of filings are below that benchmark. 

      These figures are based on the wages promised in the labor condition applications, not the actual pay received. The metropolitan comparison is more precise because it accounts for local cost variations, whereas the national comparison tends to understate the gap due to the concentration of filings in high-cost metropolitan areas.

  - group: wages
    question: "What wage level do most H-1B filings use?"
    skip: false
    answer: |-
      Most H-1B filings promise wages below the median for their occupation in their own metropolitan area. Specifically, **84.0%** of certified H-1B filings promise less than the median wage for their occupation in their metropolitan area. When compared against the national occupational median, **70.8%** of filings promise below that level.

      These figures reflect the promised wage on the labor condition application, not the actual pay received. The metropolitan comparison is higher because filings concentrate in high-cost metros, making the national comparison understate the gap.
