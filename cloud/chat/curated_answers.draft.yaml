  - group: method
    question: "What are the limitations of this data?"
    skip: false
    answer: |-
      The data on this site has several known limitations, which are important to understand when interpreting the findings:

      1. **Award Dates**: Some universities have unreliable award dates because their repositories captured the date a record was ingested rather than the actual award date. This affects the year distributions drawn from dissertation records, not the IPEDS-derived NRA shares.

      2. **Degree Labels**: Degree-level labels (PhD vs master's) are incomplete for some repositories. Coverage is near-complete for most, but substantially incomplete for a few, such as George Mason and Oregon. Montana State has no degree-enrichment configuration at all.

      3. **Record Counts**: The dissertation record count reflects what a repository publishes and what the harvest reached. It is not a census of degrees awarded. For counts of degrees, IPEDS completions are the authority.

      4. **Small Cohorts**: A 100% NRA share on a cohort of 3 is noise. Cohort floors default to 20 and must never go below 10. When a result rests on a small cohort, it should be noted as such.

      5. **Federal Employment Data**: This data is employer-matched, not person-matched. Name matching is imperfect, so these figures are indicators of scale, not exact counts of individuals.

      6. **Degree-Level Coverage**: Coverage varies by institution. Some institutions have low coverage for degree-level labels, affecting the accuracy of the master's/doctoral split.

      7. **Two Independent Measurements**: The site carries IPEDS-derived NRA shares and corpus-derived department and name analysis. These are different measurements and should not be confused.

      8. **Federal Money and Citizenship**: No federal source records who applied or who was admitted, so "prioritised" remains an inference from outcomes.

      For more detailed information on data quality and known gaps, you can visit the [[nav:/quality.html|Data Quality]] page.

