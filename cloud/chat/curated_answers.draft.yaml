  - group: visas
    question: "What is OPT?"
    skip: false
    answer: |-
      OPT, or Optional Practical Training, is a program that allows international students in the United States on F-1 visas to work temporarily in their field of study. It provides an opportunity for students to gain practical experience related to their academic program. 

      Key points about OPT include:
      - **Duration**: Standard OPT is available for up to 12 months. Students in STEM (Science, Technology, Engineering, and Mathematics) fields may be eligible for a 24-month extension, known as STEM OPT, allowing for a total of 36 months.
      - **Eligibility**: To be eligible, students must have been enrolled full-time for at least one academic year and must apply for OPT before completing their studies.
      - **Employment**: OPT employment can be paid or unpaid, and it must be directly related to the student's major area of study.

      OPT is a significant part of the immigration pipeline for international students, as it allows them to gain work experience in the U.S. after completing their studies.

  - group: visas
    question: "How does the student visa to green card pipeline work?"
    skip: false
    answer: |-
      The student visa to green card pipeline involves several stages, each with its own visa category and requirements. Here's a general overview of the process:

      1. **F-1 Student Visa**: International students typically begin their journey in the U.S. on an F-1 student visa, which allows them to study at an accredited institution. This visa is non-immigrant and does not directly lead to permanent residency.

      2. **Optional Practical Training (OPT)**: After completing their studies, F-1 visa holders can apply for OPT, which allows them to work in their field of study for up to 12 months. STEM graduates can extend this period by an additional 24 months under STEM OPT.

      3. **H-1B Visa**: Many graduates transition to an H-1B visa, a non-immigrant work visa that allows U.S. companies to employ foreign workers in specialty occupations. The H-1B is capped at 85,000 new petitions annually, but certain employers, like universities, are exempt from this cap.

      4. **Permanent Residency (Green Card)**: The transition from an H-1B visa to a green card typically involves employer sponsorship through the PERM labor certification process. This process certifies that there are no qualified U.S. workers for the position. Once approved, the employer can file an I-140 petition for an employment-based green card. 

      5. **Adjustment of Status**: If a visa number is available, the individual can apply for adjustment of status to become a permanent resident without leaving the U.S. This step is often subject to long waiting periods, especially for nationals from countries with high demand, like India and China.

      Each stage has its own requirements and limitations, and the process can take several years, especially due to backlogs in green card processing. For more detailed information on each stage, you can visit the [[nav:/pipeline.html|Immigration Pipeline Analysis]] page on this site.

  - group: method
    question: "Where does this data come from?"
    skip: false
    answer: |-
      The data on this site comes from a variety of sources, including:

      - **IPEDS Completions** (NCES): Degrees conferred by institution, CIP code, award level, and residency status.
      - **NSF NCSES**: Federal science and engineering support and obligations.
      - **DOL LCA disclosure data**: H-1B labor condition applications.
      - **SEVIS / DHS**: Student visa and OPT participation.
      - **NSF Survey of Doctorate Recipients (SDR)**: Labor force status, field of doctorate, citizenship, salary, and job-relatedness for US doctorate holders.
      - **Institutional repositories**: Dissertation and thesis records harvested over OAI-PMH from 105 universities.

      For a detailed list of all data sources and methodology, you can visit the [[nav:/data_sources.html|Data Sources & Methodology]] page.

  - group: method
    question: "What does non-resident alien mean?"
    skip: false
    answer: |-
      "Non-resident alien" (NRA) is a term used in the IPEDS data to describe a reported residency or visa status at the time a degree is awarded. It indicates that the individual is not a U.S. citizen or permanent resident at that time. It is important to note that this classification is based on visa status, not ethnicity or country of origin. A U.S.-born citizen of any background is never classified as NRA, and a permanent resident is also never classified as NRA.

  - group: method
    question: "How is STEM defined here?"
    skip: false
    answer: |-
      STEM is defined in two ways on this site, and they differ slightly:

      1. **Narrow Definition (8 CIP Families):** This includes the following CIP families:
         - 11: Computer and Information Sciences
         - 14: Engineering
         - 15: Engineering Technologies
         - 26: Biological and Biomedical Sciences
         - 27: Mathematics and Statistics
         - 30: Multi/Interdisciplinary Studies
         - 40: Physical Sciences
         - 42: Psychology

         This narrow definition is used for every **headline NRA share** on the site and on the share cards.

      2. **Broad Definition (16 CIP Families):** This adds the following CIP families:
         - 01: Agriculture, Agriculture Operations, and Related Sciences
         - 03: Natural Resources and Conservation
         - 04: Architecture and Related Services
         - 10: Communications Technologies/Technicians and Support Services
         - 29: Military Technologies and Applied Sciences
         - 41: Science Technologies/Technicians
         - 45: Social Sciences
         - 51: Health Professions and Related Programs

         This broad definition is used for the **per-university completions chart**.

      When quoting a number, it's important to specify which STEM definition it uses, as the two definitions can lead to different interpretations. "Non-STEM" on this site refers to the complement of the broad set, which includes education, humanities, and social sciences.

