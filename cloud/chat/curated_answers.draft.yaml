answers:
  - group: finding
    question: "What is the main finding of this site?"
    skip: false
    answer: |-
      The main finding of this site is about the concentration of non-resident alien (NRA) doctorates in the U.S. higher education system. While the national NRA share of U.S. research doctorates has remained roughly flat post-2010, the concentration of non-resident aliens has increased significantly in certain departments. The number of departments awarding 20 or more doctorates that are majority non-resident has more than doubled, and the share of all U.S. doctorates awarded within those departments has risen substantially. This effect is particularly strong in STEM fields.

  - group: finding
    question: "Is the share of foreign students in US PhD programs rising?"
    skip: false
    answer: |-
      The share of non-resident aliens (NRA) in US STEM PhD programs has remained relatively stable over the past decade, with a slight downward trend. From 2010 to 2024, the NRA share fluctuated around 34%, peaking at 35.1% in 2022 before declining to 32.3% in 2024.

      However, the distribution of these shares across departments has changed significantly. In 2010, 49 departments had a majority of non-resident aliens, while by 2025, this number had increased to 135. This indicates a concentration effect where more departments are becoming majority non-resident, even though the national average remains stable.

      For a deeper understanding of these trends, you can explore the [[nav:/distributions.html|distribution charts]] that illustrate how the concentration of non-resident aliens varies across different departments and fields.

  - group: finding
    question: "What is the concentration effect?"
    skip: false
    answer: |-
      The concentration effect refers to the phenomenon where the distribution of non-resident alien (NRA) doctorate recipients in the United States has become more concentrated in certain departments and fields, even though the national average NRA share has remained roughly flat post-2010. 

      Here's the shape of the finding:

      - **Nationally flat NRA share**: The overall share of non-resident aliens among US research doctorates has been roughly stable, with a slight downward drift since 2010.
      - **Increased concentration**: The number of departments awarding 20 or more doctorates that are majority non-resident has more than doubled. The share of all US doctorates awarded within these departments has risen significantly.
      - **Stronger in STEM**: This concentration effect is more pronounced in STEM fields compared to non-STEM fields.

      The key insight is that while the national average hasn't changed much, the distribution has shifted significantly, with certain departments becoming predominantly non-resident. This is a distributional change rather than a change in volume.

