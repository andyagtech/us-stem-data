  - group: hard
    question: "Does this prove foreign students are prioritized?"
    skip: false
    answer: |-
      The data on this site shows that international students are more likely to be supported by assistantships during their doctoral studies compared to domestic students. Specifically, the NSF Survey of Earned Doctorates indicates that 76.0% of international science and engineering doctorate recipients are supported by assistantships, compared to 53.1% of US citizens and permanent residents. Additionally, Americans are about four and a half times more likely to be paying their own way.

      However, this data does not establish intent or show that any individual citizen was refused a funded place. Departments fund the students they admit, and this measures the result, not the decision. There is no public data on who applied or who was admitted, so "prioritized" remains an inference from outcomes.

      If you are interested in more details about funding and support for international students, you can explore the relevant sections on the site, such as [[nav:/who-pays|Who pays for a doctorate]].

