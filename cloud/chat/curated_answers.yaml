answers:
- group: finding
  question: What is the main finding of this site?
  skip: false
  answer: The main finding of this site is that while the national non-resident alien (NRA) share of US
    research doctorates has remained roughly flat post-2010, there has been a significant concentration
    effect. The number of departments awarding 20 or more doctorates that are majority non-resident has
    more than doubled, and the share of all US doctorates awarded inside those departments has risen substantially.
    This effect is notably stronger in STEM fields compared to all fields. The site's argument is about
    the distribution of doctorates, not the overall volume.
- group: finding
  question: Is the share of foreign students in US PhD programs rising?
  skip: false
  answer: 'The national share of non-resident aliens in STEM PhD completions has remained relatively stable
    from 2010 to 2024, hovering around 34%. However, the distribution of non-resident alien shares across
    departments has shifted significantly. In 2010, 49 departments had a majority of non-resident aliens,
    which increased to 135 departments by 2025. This indicates a growing concentration of non-resident
    students in specific departments, even though the overall national share hasn''t risen substantially.


    The charts illustrate these trends: the line chart shows the stable national share, while the bar
    chart highlights the increased concentration of non-resident aliens in certain departments over time.


    Would you like to explore specific fields or universities, or learn more about the implications of
    these trends?'
- group: finding
  question: What is the concentration effect?
  skip: false
  answer: "The concentration effect refers to the phenomenon where the distribution of non-resident alien\
    \ (NRA) doctorates has become more concentrated in certain departments, even though the national average\
    \ NRA share of US research doctorates has remained roughly flat post-2010. \n\nHere's the shape of\
    \ the finding:\n\n- The national NRA share of US research doctorates is roughly flat across the post-2010\
    \ period, with a slight downward drift.\n- The concentration effect is observed as the number of departments\
    \ awarding 20 or more doctorates that are majority non-resident has more than doubled. Consequently,\
    \ the share of all US doctorates awarded within these departments has risen substantially.\n- This\
    \ effect is notably stronger in STEM fields compared to all fields.\n\nThe concentration effect highlights\
    \ a shift in distribution rather than an increase in the overall volume of non-resident alien doctorates.\
    \ Whole departments have become majority non-resident, while the national average has remained stable.\n\
    \nFor more detailed information, you can explore the [[nav:/concentration.html|concentration effect\
    \ slide deck]]."
