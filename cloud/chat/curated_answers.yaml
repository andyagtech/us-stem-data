- group: method
  question: What are the limitations of this data?
  skip: false
  answer: 'The ones that would change how you read a figure:


    1. **Name origin is not citizenship.** Where the site estimates origin from a surname, it detects
    seven origin groups — Chinese, Indian, Korean, Vietnamese, Iranian, Turkish, Arabic. Everything else,
    including all European, Hispanic, Portuguese, Japanese and African names, is counted on the domestic
    side. So a name-based international share is a floor, not an estimate. It is never used for a headline
    figure.


    2. **Award dates.** Many repositories published the date a librarian uploaded a record rather than
    the date the degree was awarded — one 1900 thesis was listed as 2024. A re-harvest of 42 repositories
    fixed 283,642 records. Four repositories still publish upload dates: NC State, Penn State, Carnegie
    Mellon and George Mason, about 7.6% of the corpus.


    3. **Degree labels.** Some repositories do not publish a degree level, so the PhD/master''s split
    is unknown for those records. Ohio State publishes none at all. The records still count; only their
    split is unknown.


    4. **H-1B legal representation covers 5.9% of filings.** DOL only added the law-firm field in FY2020
    and the attorney name in FY2015.


    5. **A share is not a displacement claim.** The site reports what was awarded and who funded it. It
    does not observe any individual admission decision, and nothing here identifies a student who was
    turned away.'
- group: finding
  skip: false
  question: How far back does the data go?
  answer: 'Further than most comparable work, and the length matters because a ten-year window can make
    a long trend look flat.


    - **NSF Survey of Earned Doctorates: 1979-2024.** A census of every US research doctorate, by citizenship.
    Five-yearly before 2009, annual after.

    - **IPEDS Completions: 1995-2025**, annual, and the only source with per-institution detail. Earlier
    IPEDS files exist but publish no citizenship breakdown, so 1995 is a hard floor rather than a choice.

    - **DOL Labor Condition Applications: FY2008-FY2026.**

    - **Thesis and dissertation records: 2010-2026.**


    The 1990 and 1999 IPEDS years are missing from NCES itself, not from this copy.'
- group: visas
  skip: false
  question: Who files the H-1B paperwork for universities?
  answer: 'Mostly the universities themselves, and where they do use a law firm the work is remarkably
    concentrated.


    Most large public universities file in-house through their own international offices. Ole Miss files
    98.1% of its own applications, Purdue 62%, Duke 65%.


    Among filings that do name a firm, 177 firms appear, and **Fragomen, Del Rey, Bernsen & Loewy accounts
    for 22.9%** — more than the next four combined. Ten firms handle half of all firm-named filings. Two
    Fragomen attorneys alone account for about 2,800.


    Geographically the work does not sit near the campuses it serves: Miami and Coral Gables, eight miles
    apart, account for over 3,000 filings from five people.


    One caveat that matters: DOL only began disclosing the law firm in FY2020, so this describes 5.9%
    of matched filings. It is a real sample, not a census.'
- group: method
  skip: false
  question: Why should I trust these numbers?
  answer: 'Because the ones in the headline are not estimates, and the ones that are estimates are labelled.


    Every headline figure comes from a collection an institution was required by law to file — IPEDS Completions
    and the NSF Survey of Earned Doctorates. Neither is a poll, a sample, or a model. The site states
    which source each figure comes from.


    Where the work is estimated — department classification, name-origin analysis — it sits behind a heading
    that says so, and never carries a headline claim.


    The pipeline is also checked against itself: every number quoted in the documentation is re-derived
    from the built data on each run, and the build fails if any of them has drifted. Known defects are
    recorded openly rather than quietly fixed, including the ones found in this project''s own code.'
