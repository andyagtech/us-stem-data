- group: visas
  question: What is OPT?
  skip: false
  answer: 'OPT, or Optional Practical Training, is a program that allows international students in the
    United States on F-1 visas to work temporarily in their field of study. It provides an opportunity
    for students to gain practical experience related to their academic program. There are two types of
    OPT:


    1. **Pre-completion OPT**: This can be used while the student is still completing their degree. It
    allows part-time work during the academic year and full-time work during breaks.


    2. **Post-completion OPT**: This is used after the student has completed their degree. It allows full-time
    work for up to 12 months.


    Additionally, students in STEM (Science, Technology, Engineering, and Mathematics) fields may be eligible
    for a 24-month extension of their post-completion OPT, known as the STEM OPT extension. This extension
    allows them to work for a total of up to 36 months after graduation.'
- group: visas
  question: How does the student visa to green card pipeline work?
  skip: false
  answer: "The student visa to green card pipeline involves several stages that international students\
    \ in the United States typically navigate if they wish to transition from studying to permanent residency.\
    \ Here's a general overview of the process:\n\n1. **Student Visa (F-1 Visa):** \n   - International\
    \ students usually begin their journey in the U.S. on an F-1 visa, which allows them to study at an\
    \ accredited institution.\n\n2. **Optional Practical Training (OPT):**\n   - After completing their\
    \ degree, F-1 students can apply for OPT, which allows them to work in their field of study for up\
    \ to 12 months. STEM graduates may extend this period by an additional 24 months under the STEM OPT\
    \ extension.\n\n3. **H-1B Visa:**\n   - Many graduates transition to an H-1B visa, a non-immigrant\
    \ work visa that allows U.S. companies to employ foreign workers in specialty occupations. This visa\
    \ is typically valid for three years and can be extended to six years.\n\n4. **PERM Labor Certification:**\n\
    \   - Employers may sponsor H-1B visa holders for a green card through the PERM labor certification\
    \ process, which involves proving that there are no qualified U.S. workers available for the position.\n\
    \n5. **Employment-Based Green Card (EB-2 or EB-3):**\n   - After obtaining PERM certification, the\
    \ employer can file an I-140 petition for an employment-based green card. The EB-2 category is for\
    \ advanced degree professionals, while EB-3 is for bachelor's degree holders.\n\n6. **Adjustment of\
    \ Status (I-485):**\n   - Once the priority date is current, the individual can apply for adjustment\
    \ of status to become a permanent resident (green card holder) using Form I-485.\n\nEach stage has\
    \ its own requirements and timelines, and the process can be lengthy, especially due to backlogs in\
    \ certain visa categories. For more detailed information, you can explore [[nav:/pipeline.html#eb-chart-section|the\
    \ EB bottleneck]] on this site."
- group: method
  question: Where does this data come from?
  skip: false
  answer: 'Everything here is a federal collection that an institution was legally required to file, not
    a survey of opinion:


    - **IPEDS Completions** (NCES) — degrees conferred by institution, CIP code, award level and residency.
    The ground truth for every NRA share. Citizenship is available 1995-2025; the 1984-1994 files exist
    but carry no citizenship breakdown at all.

    - **NSF Survey of Earned Doctorates** — a census of every research doctorate awarded in the US, by
    citizenship, 1979-2024. The longest series on the site.

    - **NSF NCSES federal support**, **NSF Awards**, **NIH RePORTER** — research funding by institution.

    - **DOL Labor Condition Applications** — H-1B filings matched to universities by employer name, FY2008-FY2026,
    deduplicated on case number.

    - **DOL PERM** — permanent labour certification.

    - **University repositories** (OAI-PMH) — thesis and dissertation metadata, 2010-2026, used for department
    and name-origin analysis only.


    The headline figures come from the first two. The repository data is supporting detail and is labelled
    as estimated wherever it appears.'
- group: method
  question: What does non-resident alien mean?
  skip: false
  answer: "The term \"non-resident alien\" (NRA) refers to a reported residency or visa status at the\
    \ time a degree is awarded, as recorded in the IPEDS (Integrated Postsecondary Education Data System).\
    \ It indicates that the individual is not a U.S. citizen or permanent resident at the time of the\
    \ award. This classification is based on visa status and does not reflect ethnicity, ancestry, or\
    \ country of origin. \n\nIf you have more questions about international student data or visa programs,\
    \ feel free to ask!"
