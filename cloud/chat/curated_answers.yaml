- group: fields
  question: Show me the trend in STEM doctorates over time
  skip: false
  answer: 'There are two ways to see it, and they disagree in an interesting way.


    **The count rose steeply.** Non-resident STEM doctorates went from 7,209 in 1995 to 15,480 in 2025
    — more than double. But domestic awards rose too, 14,809 to 25,794.


    **The share did not.** Because both grew, the non-resident share has moved far less than the count:
    32.7% in 1995, a trough of 29.9% in 1998, roughly 37% through the 2010s, a peak of 40.1% in 2021-22,
    and 37.5% in 2025.


    Over a longer run the rise is unmistakable. NSF''s Survey of Earned Doctorates, a census of every
    US research doctorate, puts temporary-visa recipients at 11.6% of all fields in 1979 and 33.3% in
    2024 — close to tripling in 45 years.


    So a claim that the foreign share is ''flat'' is true only of the last decade and only as a share.
    Over thirty years, and in absolute numbers, it is not flat at all.'
