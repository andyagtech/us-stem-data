ood industry. My work is rooted in developing new technologies and procedures that improve systems, analyzing data to establish effective quality control measures, and conducting research to create or enhance technologies that prevent food spoilage, preserve nutrients, enhance flavors—or ideally, accomplish all of the above. Additionally, I apply and maintain quality control and management systems, conducting proper audits to monitor and prevent failures in both existing and newly implemented systems within the industry.\n\nHe holds a degree in Chemistry \n\nA fun fact about Juan Navarro is that I enjoy and love playing volleyball every time I got the chance. \n"])</script><script>self.__next_f.push([1,"b:[\"$\",\"$L19\",null,{\"project\":{\"id\":\"0d665b15-4659-4939-94a5-5c414528492b\",\"title\":\"Smart Safety: Unlocking Food Quality Secrets\",\"slug\":\"smart-safety-unlocking-food-quality-secrets-1-1\",\"summary\":{\"type\":\"doc\",\"content\":[{\"type\":\"paragraph\",\"content\":[{\"text\":\"Develop a food safety quality control system in commercial kitchens and other food preparation/service environments.\",\"type\":\"text\"}]}]},\"description\":{\"type\":\"doc\",\"content\":[{\"type\":\"paragraph\",\"content\":[{\"text\":\"As the food industry needs systems that improve the profits, maintaining the food quality or even increasing it is on the top of mind of all types of companies, from local bistros to international corporations. In this Build Project, you will wear the hat of a food scientist and develop a quality control system for food safety in commercial kitchens. Your goal is to develop a deep understanding of the importance of food quality systems, based on principles of science and statistics. Under the supervision of an experienced industry expert, you will define what are the critical points in your project, collect data, analyze it, and define the parameters for your system. You will become familiar with sampling techniques, collecting and analyzing data and using those variables like inferential statistics, randomized sampling, using ANOVA, normal distribution, etcetera. All this will happen in an environment that simulates the operations of a real food industry team.\",\"type\":\"text\"}]}]},\"project_area\":[\"Biology \u0026 Healthcare\"],\"level\":\"Beginner\",\"levelDescription\":\"No prior experience required\",\"prerequisites\":{\"type\":\"doc\",\"content\":[{\"type\":\"paragraph\",\"content\":[{\"text\":\"Experience with Excel (use of formulas, creation of variety of plots, data analysis, descriptive and inferential statistics.\",\"type\":\"text\"}]},{\"type\":\"paragraph\",\"content\":[{\"text\":\"Experience with PowerPoint (creation of immersive and interactive slides)\",\"type\":\"text\"}]},{\"type\":\"paragraph\",\"content\":[{\"text\":\"Understanding of microorganisms and their relationship with human life.\",\"type\":\"text\"}]},{\"type\":\"paragraph\",\"content\":[{\"text\":\"Critical thinking skills\",\"type\":\"text\"}]}]},\"goals\":{\"type\":\"doc\",\"content\":[{\"type\":\"paragraph\",\"content\":[{\"text\":\"Understand the principles behind food safety and preservation, how different variables can affect the food processing and service, and how to prevent negative results.\",\"type\":\"text\"}]},{\"type\":\"paragraph\",\"content\":[{\"text\":\"Explain the main microorganisms that can affect the food process and how so; form the molecular perspective to a holistic view.\",\"type\":\"text\"}]},{\"type\":\"paragraph\",\"content\":[{\"text\":\"Understand the importance of science-based food quality systems and their use in the food industry to optimize any process.\",\"type\":\"text\"}]},{\"type\":\"paragraph\",\"content\":[{\"text\":\"Implement a quality control system.\",\"type\":\"text\"}]}]},\"schedule\":\"Tuesdays, 3:00 P.M. ET / 12:00 P.M. PT\",\"status\":\"active\",\"duration\":\"8 weeks, 2-3 hours per week\",\"workshops\":{\"sessions\":[{\"name\":\"Understanding Food Processing: A Genera
