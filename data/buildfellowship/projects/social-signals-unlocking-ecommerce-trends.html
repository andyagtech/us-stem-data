9eW7AtxES\",\"4420\",\"static/chunks/4420-baa8329e5076733c.js?dpl=dpl_A9QRwtuL4hrMD2RZGqb9eW7AtxES\",\"2169\",\"static/chunks/2169-1d13735e35f16c75.js?dpl=dpl_A9QRwtuL4hrMD2RZGqb9eW7AtxES\",\"419\",\"static/chunks/419-9f9e6d455ee0ae85.js?dpl=dpl_A9QRwtuL4hrMD2RZGqb9eW7AtxES\",\"5288\",\"static/chunks/5288-5d7819e0848b1b1a.js?dpl=dpl_A9QRwtuL4hrMD2RZGqb9eW7AtxES\",\"6874\",\"static/chunks/6874-67c719d6db2b17af.js?dpl=dpl_A9QRwtuL4hrMD2RZGqb9eW7AtxES\",\"6766\",\"static/chunks/6766-7fcc7eadc8fee52b.js?dpl=dpl_A9QRwtuL4hrMD2RZGqb9eW7AtxES\",\"9435\",\"static/chunks/9435-28f947009b0f7d38.js?dpl=dpl_A9QRwtuL4hrMD2RZGqb9eW7AtxES\",\"2206\",\"static/chunks/2206-42291f248e6bf19d.js?dpl=dpl_A9QRwtuL4hrMD2RZGqb9eW7AtxES\",\"5782\",\"static/chunks/5782-04eaa6c475f5c3f2.js?dpl=dpl_A9QRwtuL4hrMD2RZGqb9eW7AtxES\",\"8419\",\"static/chunks/app/projects/%5Bslug%5D/page-7f8129194c3557a1.js?dpl=dpl_A9QRwtuL4hrMD2RZGqb9eW7AtxES\"],\"default\"]\n1a:T44a,\"Shubham is a Data Science Build Fellow at Open Avenues, where he works with students leading projects in data engineering.\nShubham is a data engineer at Covetrus, where he focuses on designing and implementing scalable data pipelines, optimizing ETL processes, and developing event-driven data management systems. He works extensively with technologies like Apache Kafka, DBT, and cloud platforms to ensure efficient data flow and analysis across the organization.\nShubham has over 4+ years of experience in the data engineering field. His career journey has taken him through impactful roles at leading organizations like Pfizer and NJIT, where he honed his skills in data optimization and analytics. He's particularly passionate about leveraging data to enhance efficiency and support s"])</script><script>self.__next_f.push([1,"trategic decision-making.\nHe holds a master's in computer science from the New Jersey Institute of Technology.\nA fun fact about Shubham is that he's an avid Formula 1 fan who loves to travel to different countries to watch races live, combining his passion for data with the thrill of high-speed motorsports.\""])</script><script>self.__next_f.push([1,"b:[\"$\",\"$L19\",null,{\"project\":{\"id\":\"4677e96d-0c16-4732-95ba-393450879b7a\",\"title\":\"Social Signals: Unlocking E-commerce Trends\",\"slug\":\"social-signals-unlocking-ecommerce-trends\",\"summary\":{\"type\":\"doc\",\"content\":[{\"type\":\"paragraph\",\"content\":[{\"text\":\"Build a data pipeline that aggregates and analyzes e-commerce and social media data to provide actionable insights for AI startups, empowering them to enhance customer engagement and drive strategic growth.\",\"type\":\"text\"}]}]},\"description\":{\"type\":\"doc\",\"content\":[{\"type\":\"paragraph\",\"content\":[{\"text\":\"As e-commerce and social media become increasingly intertwined, startups face the challenge of extracting meaningful insights from vast amounts of data to inform their strategies. In this Build Project, you'll step into the role of a Data Engineer, tasked with building a comprehensive data pipeline that aggregates and analyzes customer behavior and market trends. Under the guidance of an experienced industry expert, you’ll develop Python scripts for data extraction, transform data for analysis, and load it into a structured database. You’ll become familiar with essential industry tools and methodologies like SQL and data visualization techniques, all within an environment that simulates the operations of a real data analytics team. This hands-on experience will equip you with valuable skills that are highly sought after in today’s data-driven landscape, making you a standout candidate for future roles in data engineering and analytics.\",\"type\":\"text\"}]}]},\"project_area\":[\"Computer Science\"],\"level\":\"Expert\",\"levelDescription\":\"Advanced experience required\",\"prerequisites\":{\"type\":\"doc\",\"content\":[{\"type\":\"paragraph\",\"content\":[{\"text\":\"Basic knowledge of Python programming: You should be comfortable writing loops, conditionals, functions, and using libraries such as Pandas for data manipulation.\",\"type\":\"text\"}]},{\"type\":\"paragraph\",\"content\":[{\"text\":\"Basic understanding of SQL: You should be able to write simple queries to interact with relational databases (e.g., SELECT, JOIN, and WHERE statements).\",\"type\":\"text\"}]},{\"type\":\"paragraph\",\"content\":[{\"text\":\"Familiarity with APIs and data extraction: You should understand how to retrieve data from web APIs and perform basic web scraping.\",\"type\":\"text\"}]},{\"type\":\"paragraph\",\"content\":[{\"text\":\"Some exposure to data visualization tools: You should have experience using libraries like Matplotlib or Seaborn to create basic plots and graphs.\",\"type\":\"text\"}]},{\"type\":\"paragraph\",\"content\":[{\"text\":\"Good communication skills: You will need to effectively explain your findings and present your project both in written and verbal form.\",\"type\":\"text\"}]}]},\"goals\":{\"type\":\"doc\",\"content\":[{\"type\":\"paragraph\",\"content\":[{\"text\":\"Build a robust data pipeline that integrates e-commerce and social media data for comprehensive analysis.\",\"type\":\"text\"}]},{\"type\":\"paragraph\",\"content\":[{\"text\":\"Analyze customer behavior and product trends using SQL queries and data visualization techniques.\",\"type\":\"text\"}]},{\"type\":\"paragraph\",\"content\":[{\"text\":\"Implement Python scripts for data extraction, transformation, and loading (ETL) processes from multiple sources.\",\"type\":\"text\"}]},{\"type\":\"paragraph\",\"content\":[{\"text\":\"Evaluate insights derived from the data to make strategic recommendations for AI startups.\",\"type\":\"text\"}]},{\"type\":\"paragraph\",\"content\":[{\"text\":\"Document your findings and methodologies in a professional GitHub repository and a compelling Medium article.\",\"type\":\"text\"}]}]},\"schedule\":\"Wednesdays, 6:00 P.M. ET / 3:00 P.M. PT\",\"status\":\"archived\",\"duration\":\"8 weeks, 2-3 hours per week\",\"workshops\":{\"sessions\":[{\"name\":\"Project Kickoff\",\"order\":1,\"description\":{\"type\":\"doc\",\"content\":[{\"type\":\"paragraph\",\"content\":[{\"text\":\"Introduce the project, discuss e-commerce and social media data's significance, and review the main deliverables. Each individual will brainstorm potential data sources.\",\"type\":\"text\"}]}]}},{\"name\":\"Data Source Exploration\",\"order\":2,\"description\":{\"type\":\"doc\",\"content\":[{\"type\":\"paragraph\",\"content\":[{\"text\":\"Identify and evaluate relevant data sources for e-commerce and social media analytics. You will choose datasets to use for your project such as Amazon Customer Behavior \u0026 Product Reviews, Social Media Influencers Dataset and E-commerce Behavior Data from Multi-Category Store.\",\"type\":\"text\"}]}]}},{\"name\":\"Data Extraction Techniques\",\"order\":3,\"description\":{\"type\":\"doc\",\"content\":[{\"type\":\"paragraph\",\"content\":[{\"text\":\"Learn how to extract data using APIs and web scraping methods. You'll write your first scripts to collect data from selected sources.\",\"type\":\"text\"}]}]}},{\"name\":\"Data Cleaning and Transformation\",\"order\":4,\"description\":{\"type\":\"doc\",\"content\":[{\"type\":\"paragraph\",\"content\":[{\"text\":\"Use Python and Pandas to clean and preprocess your extracted data. You'll prepare the data for analysis, ensuring it's in the correct format.\",\"type\":\"text\"}]}]}},{\"name\":\"Database Setup\",\"order\":5,\"description\":{\"type\":\"doc\",\"content\":[{\"type\":\"paragraph\",\"content\":[{\"text\":\"Set up a relational database using SQL to store your cleaned data. You'll design the database schema and load your data into it.\",\"type\":\"text\"}]}]}},{\"name\":\"Data Analysis\",\"order\":6,\"description\":{\"type\":\"doc\",\"content\":[{\"type\":\"paragraph\",\"content\":[{\"text\":\"Write SQL queries to analyze customer behavior and product trends. You’ll generate insights and begin visualizing your findings.\",\"type\":\"text\"}]}]}},{\"name\":\"Build the ETL Pipeline\",\"order\":7,\"description\":{\"type\":\"doc\",\"content\":[{\"type\":\"paragraph\",\"content\":[{\"text\":\"Create a complete ETL pipeline that automates the extraction, transformation, and loading processes. You’ll ensure the pipeline is efficient and reliable.\",\"type\":\"text\"}]}]}},{\"name\":\"Final Presentation\",\"order\":8,\"description\":{\"type\":\"doc\",\"content\":[{\"type\":\"paragraph\",\"content\":[{\"text\":\"Create a complete ETL pipeline that automates the extraction, transformation, and loading processes. You’ll ensure the pipeline is efficient and reliable.\",\"type\":\"text\"}]}]}}]},\"fellows\":[{\"id\":\"ddbd7abb-e381-450d-9e20-3341fc6b0d3b\",\"name\":\"Shubham Dubey\",\"role\":\"Data Science Fellow\",\"organization\":\"Open Avenues Foundation\",\"organizationLogoUrl\":\"/images/organizations/oaf-logo.png\",\"photoUrl\":\"https://avgkrhojcamcagufngrr.supabase.co/storage/v1/object/public/fellow-headshots/ddbd7abb-e381-450d-9e20-3341fc6b0d3b.webp\",\"bio\":\"$1a\",\"linkedinUrl\":\"https://www.linkedin.com/in/dubshubham/\"}],\"categories\":[\"Data Engineering\",\"E-commerce Analytics\",\"Social Media Insights\",\"Python Programming\"],\"applicationTimeline\":[{\"label\":\"Applications open\",\"value\":\"May 9, 2025\"},{\"label\":\"Applications deadline\",\"value\":\"June 8, 2025\"},{\"label\":\"Application results released\",\"value\":\"Week of June 23, 2025\"},{\"label\":\"Project start date\",\"value\":\"Week of July 7, 2025\"},{\"label\":\"Project end date\",\"value\":\"Week of August 25, 2025\"}],\"cycle_id\":\"77065a20-2032-46f1-b3cf-d435314c7011\"},\"error\":\"$undefined\"}]\n"])</script></body></html>
