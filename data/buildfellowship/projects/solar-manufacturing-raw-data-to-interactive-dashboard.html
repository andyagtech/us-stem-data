509a4.js?dpl=dpl_A9QRwtuL4hrMD2RZGqb9eW7AtxES\",\"4420\",\"static/chunks/4420-baa8329e5076733c.js?dpl=dpl_A9QRwtuL4hrMD2RZGqb9eW7AtxES\",\"2169\",\"static/chunks/2169-1d13735e35f16c75.js?dpl=dpl_A9QRwtuL4hrMD2RZGqb9eW7AtxES\",\"419\",\"static/chunks/419-9f9e6d455ee0ae85.js?dpl=dpl_A9QRwtuL4hrMD2RZGqb9eW7AtxES\",\"5288\",\"static/chunks/5288-5d7819e0848b1b1a.js?dpl=dpl_A9QRwtuL4hrMD2RZGqb9eW7AtxES\",\"6874\",\"static/chunks/6874-67c719d6db2b17af.js?dpl=dpl_A9QRwtuL4hrMD2RZGqb9eW7AtxES\",\"6766\",\"static/chunks/6766-7fcc7eadc8fee52b.js?dpl=dpl_A9QRwtuL4hrMD2RZGqb9eW7AtxES\",\"9435\",\"static/chunks/9435-28f947009b0f7d38.js?dpl=dpl_A9QRwtuL4hrMD2RZGqb9eW7AtxES\",\"2206\",\"static/chunks/2206-42291f248e6bf19d.js?dpl=dpl_A9QRwtuL4hrMD2RZGqb9eW7AtxES\",\"5782\",\"static/chunks/5782-04eaa6c475f5c3f2.js?dpl=dpl_A9QRwtuL4hrMD2RZGqb9eW7AtxES\",\"8419\",\"static/chunks/app/projects/%5Bslug%5D/page-7f8129194c3557a1.js?dpl=dpl_A9QRwtuL4hrMD2RZGqb9eW7AtxES\"],\"default\"]\n"])</script><script>self.__next_f.push([1,"b:[\"$\",\"$L19\",null,{\"project\":{\"id\":\"6e32691d-1375-4837-a92e-84a47dbf7d85\",\"title\":\"Solar Manufacturing: Raw Data to Interactive Dashboard\",\"slug\":\"solar-manufacturing-raw-data-to-interactive-dashboard\",\"summary\":{\"type\":\"doc\",\"content\":[{\"type\":\"paragraph\",\"content\":[{\"text\":\"Develop a manufacturing data pipeline and interactive dashboard that transforms raw production data into insights used by engineers to monitor and improve industrial processes.\",\"type\":\"text\"}]}]},\"description\":{\"type\":\"doc\",\"content\":[{\"type\":\"paragraph\",\"content\":[{\"text\":\"Modern manufacturing relies heavily on data to monitor production, identify defects, and improve efficiency. In this Build Project, you will step into the role of a process engineer in a solar cell manufacturing facility, where production data from equipment and inspection systems must be analyzed to support engineering decisions. Under the guidance of an industry professional, you will build a simple data pipeline and interactive dashboard to process and visualize manufacturing datasets, revealing trends, correlations, and potential process inefficiencies. You will gain hands-on experience with Python, ETL workflows, and data visualization tools while working in a simulated environment that reflects how real manufacturing engineering teams use data to optimize production.\",\"type\":\"text\"}]}]},\"project_area\":[\"Engineering\"],\"level\":\"Intermediate\",\"levelDescription\":\"Some experience recommended\",\"prerequisites\":{\"type\":\"doc\",\"content\":[{\"type\":\"paragraph\",\"content\":[{\"text\":\"Basic Programming Experience: Some exposure to any programming language including basic concepts such as variables, loops, and simple scripts. Step-by-step guidance and starter code will be provided during sessions.\",\"type\":\"text\"}]},{\"type\":\"paragraph\",\"content\":[{\"text\":\"Statistical Analysis: Understanding of descriptive statistics (mean, median, standard deviation) and correlation analysis to interpret manufacturing metrics.\",\"type\":\"text\"}]},{\"type\":\"paragraph\",\"content\":[{\"text\":\"Problem-Solving Aptitude: Ability to break down complex problems into smaller components and think analytically about process-related challenges\",\"type\":\"text\"}]}]},\"goals\":{\"type\":\"doc\",\"content\":[{\"type\":\"paragraph\",\"content\":[{\"text\":\"Examine how manufacturing data flows through industrial systems, including how process data from equipment and sensors is collected and stored in databases and MES platforms.\",\"type\":\"text\"}]},{\"type\":\"paragraph\",\"content\":[{\"text\":\"Build a basic ETL (Extract, Transform, Load) pipeline to extract raw manufacturing data, clean and structure it, and prepare it for engineering analysis.\",\"type\":\"text\"}]},{\"type\":\"paragraph\",\"content\":[{\"text\":\"Analyze production data and identify process trends or inefficiencies using statistical methods and visualization techniques commonly used by process engineers.\",\"type\":\"text\"}]},{\"type\":\"paragraph\",\"content\":[{\"text\":\"Create interactive dashboards using Python tools such as Plotly/Dash and PowerBI to visualize manufacturing metrics and process performance.\",\"type\":\"text\"}]}]},\"schedule\":\"Wednesdays, 7:00 P.M. ET / 4:00 P.M. PT\",\"status\":\"archived\",\"duration\":\"8 weeks, 2-3 hours per week\",\"workshops\":{\"sessions\":[{\"name\":\"Introduction to Digital Manufacturing\",\"order\":1,\"description\":{\"type\":\"doc\",\"content\":[{\"type\":\"paragraph\",\"content\":[{\"text\":\"You will be introduced to the project goals, final deliverable, and the role of data in modern manufacturing. We will review how engineers use production data to monitor and improve processes.\",\"type\":\"text\"}]}]}},{\"name\":\"Manufacturing Data Systems\",\"order\":2,\"description\":{\"type\":\"doc\",\"content\":[{\"type\":\"paragraph\",\"content\":[{\"text\":\"You will explore how manufacturing data is generated and collected from equipment and sensors. We will discuss common industrial systems such as MES and basic communication protocols used in manufacturing environments.\",\"type\":\"text\"}]}]}},{\"name\":\"Data Extraction (ETL Basics)\",\"order\":3,\"description\":{\"type\":\"doc\",\"content\":[{\"type\":\"paragraph\",\"content\":[{\"text\":\"You will begin building a simple ETL pipeline by extracting manufacturing datasets from different sources and learning how engineers organize raw production data.\",\"type\":\"text\"}]}]}},{\"name\":\"Data Cleaning and Transformation\",\"order\":4,\"description\":{\"type\":\"doc\",\"content\":[{\"type\":\"paragraph\",\"content\":[{\"text\":\"You will transform raw datasets into structured data suitable for analysis. This includes cleaning data, handling missing values, and preparing process parameters for visualization.\",\"type\":\"text\"}]}]}},{\"name\":\"Data Visualization\",\"order\":5,\"description\":{\"type\":\"doc\",\"content\":[{\"type\":\"paragraph\",\"content\":[{\"text\":\"You will create visualizations to explore manufacturing data and identify patterns, correlations, and possible process inefficiencies.\",\"type\":\"text\"}]}]}},{\"name\":\"Process Analysis \u0026 Defect Investigation\",\"order\":6,\"description\":{\"type\":\"doc\",\"content\":[{\"type\":\"paragraph\",\"content\":[{\"text\":\"You will explore how engineers use production data to identify patterns and investigate potential causes of defects in manufacturing processes. Using sample datasets, you will analyze relationships between process parameters and product quality, and highlight possible sources of variation.\",\"type\":\"text\"}]}]}},{\"name\":\"Intro to Machine Learning for Process Data\",\"order\":7,\"description\":{\"type\":\"doc\",\"content\":[{\"type\":\"paragraph\",\"content\":[{\"text\":\"You will learn how simple machine learning models can help identify patterns in manufacturing data. Using basic classification techniques, you will explore how engineers can detect process anomalies or predict product quality based on production parameters.\",\"type\":\"text\"}]}]}},{\"name\":\"Automation \u0026 Final Project Presentation\",\"order\":8,\"description\":{\"type\":\"doc\",\"content\":[{\"type\":\"paragraph\",\"content\":[{\"text\":\"You will present a demo of your dashboard, showcasing your data pipeline, visualizations, and analysis. You will explain your insights and discuss how automation and data analytics can support process optimization in manufacturing environments.\",\"type\":\"text\"}]}]}}]},\"fellows\":[{\"id\":\"ef9dc28e-e923-4b84-84bb-51515e8d5c6e\",\"name\":\"Dennis  Ting\",\"role\":\"Engineering Management Fellow\",\"organization\":\"Open Avenues Foundation\",\"organizationLogoUrl\":\"/images/organizations/oaf-logo.png\",\"photoUrl\":\"https://avgkrhojcamcagufngrr.supabase.co/storage/v1/object/public/fellow-headshots/ef9dc28e-e923-4b84-84bb-51515e8d5c6e.webp\",\"bio\":\"Dennis Ting is a Chemical Engineering Build Fellow at Open Avenues, where he works with students leading projects in Chemical Engineering.\\n\\nDennis is the Integration Manager at ES Foundry, where he focuses on data-driven initiatives to improve solar cell efficiency, production yield, and overall manufacturing quality through advanced analytics and structured problem-solving\\n\\nDennis has over 10 years of experience in solar cell manufacturing, specializing in yield improvement, process optimization, and cost reduction. He has built and trained engineering teams, and driven plant-wide efficiency through data-driven problem-solving and root cause analysis.\\n\\nHe holds a master’s degree in chemical engineering.\\n\\nA fun fact about Dennis is that he enjoys learning programming and exploring ways to apply it in his work.\\n\",\"linkedinUrl\":\"https://www.linkedin.com/in/ting-dennis-495533265\"}],\"categories\":[\"Solar Cell Manufacturing\",\"Data Analytics\",\"Python\",\"Manufacturing Data Engineering\"],\"applicationTimeline\":[{\"label\":\"Applications open\",\"value\":\"April 13, 2026\"},{\"label\":\"Applications deadline\",\"value\":\"May 20, 2026\"},{\"label\":\"Application results released\",\"value\":\"Week of May 26, 2026\"},{\"label\":\"Project start date\",\"value\":\"Week of June 8, 2026\"},{\"label\":\"Project end date\",\"value\":\"Week of July 27, 2026\"}],\"cycle_id\":\"ae26a648-44bc-4fab-bbb0-7f9c0f6b18d9\"},\"error\":\"$undefined\"}]\n"])</script></body></html>
