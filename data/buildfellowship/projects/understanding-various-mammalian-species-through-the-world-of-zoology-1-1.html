b9eW7AtxES\",\"277\",\"static/chunks/54a60aa6-294bb7e111b509a4.js?dpl=dpl_A9QRwtuL4hrMD2RZGqb9eW7AtxES\",\"4420\",\"static/chunks/4420-baa8329e5076733c.js?dpl=dpl_A9QRwtuL4hrMD2RZGqb9eW7AtxES\",\"2169\",\"static/chunks/2169-1d13735e35f16c75.js?dpl=dpl_A9QRwtuL4hrMD2RZGqb9eW7AtxES\",\"419\",\"static/chunks/419-9f9e6d455ee0ae85.js?dpl=dpl_A9QRwtuL4hrMD2RZGqb9eW7AtxES\",\"5288\",\"static/chunks/5288-5d7819e0848b1b1a.js?dpl=dpl_A9QRwtuL4hrMD2RZGqb9eW7AtxES\",\"6874\",\"static/chunks/6874-67c719d6db2b17af.js?dpl=dpl_A9QRwtuL4hrMD2RZGqb9eW7AtxES\",\"6766\",\"static/chunks/6766-7fcc7eadc8fee52b.js?dpl=dpl_A9QRwtuL4hrMD2RZGqb9eW7AtxES\",\"9435\",\"static/chunks/9435-28f947009b0f7d38.js?dpl=dpl_A9QRwtuL4hrMD2RZGqb9eW7AtxES\",\"2206\",\"static/chunks/2206-42291f248e6bf19d.js?dpl=dpl_A9QRwtuL4hrMD2RZGqb9eW7AtxES\",\"5782\",\"static/chunks/5782-04eaa6c475f5c3f2.js?dpl=dpl_A9QRwtuL4hrMD2RZGqb9eW7AtxES\",\"8419\",\"static/chunks/app/projects/%5Bslug%5D/page-7f8129194c3557a1.js?dpl=dpl_A9QRwtuL4hrMD2RZGqb9eW7AtxES\"],\"default\"]\n1a:T500,Welcome to the extraordinary world of mammals. From the echolocation of bats to the beautiful songs of whales across the oceans, to small nocturnal creatures and the social lives of primates or lions, mammals reveal nature through a complex and captivating lens. Through years of evolution, survival, intelligence, and adaptation - we will explore not only how mammals live but why they thrive in such astonishing diversity. In this Build Project, you will explore mammalian ecology and the diverse biomes these species inhabit across the globe. You will learn to identify these biomes as the ecological context shaping your chosen species and its survival strategies. The project examines interspecies relationships, phenotypic and genotypic adaptations, and real-world human–wildlife c"])</script><script>self.__next_f.push([1,"onflict, highlighting the impacts of human activity on mammalian species. You will also address the care of mammals in captive environments. Through eight guided virtual workshops and the instructor’s hands-on field experience in the African bushfield, you will develop a professional APA- or MLA-style research paper focused on a species of your choice. By the end of the project, you will gain a strong, applied understanding of your chosen species in both captive and natural settings. "])</script><script>self.__next_f.push([1,"b:[\"$\",\"$L19\",null,{\"project\":{\"id\":\"83686049-56a4-4b3d-98bd-b392a8684127\",\"title\":\"Understanding Various Mammalian Species Through the World of Zoology\",\"slug\":\"understanding-various-mammalian-species-through-the-world-of-zoology-1-1\",\"summary\":{\"type\":\"doc\",\"content\":[{\"type\":\"paragraph\",\"content\":[{\"text\":\"Investigate the Zoology world through various mammalian species and apply it to the species of your choice by writing an academic paper and presenting your work to your peers. \",\"type\":\"text\"}]}]},\"description\":{\"type\":\"doc\",\"content\":[{\"type\":\"paragraph\",\"content\":[{\"text\":\"$1a\",\"type\":\"text\"}]}]},\"project_area\":[\"Biology \u0026 Healthcare\"],\"level\":\"Beginner\",\"levelDescription\":\"No prior experience required\",\"prerequisites\":{\"type\":\"doc\",\"content\":[{\"type\":\"paragraph\",\"content\":[{\"text\":\"Earned strong grades in their introductory biology courses, ensuring a foundational understanding of the principles of biology and their applications in wildlife management and zoology.\",\"type\":\"text\"}]},{\"type\":\"paragraph\",\"content\":[{\"text\":\"Be prepared to identify and address complex ecological issues, such as poaching, habitat degradation, and biodiversity loss, both locally and globally.\",\"type\":\"text\"}]},{\"type\":\"paragraph\",\"content\":[{\"text\":\"Proficiency in ecology will be essential for recognizing and explaining the interdependence within ecosystems, while skills in mammalogy and invertebrate zoology will aid in distinguishing between species and understanding their ecological niches.\",\"type\":\"text\"}]},{\"type\":\"paragraph\",\"content\":[{\"text\":\"Apply evolutionary biology to evaluate species adaptations, identify pressing conservation challenges, and propose scientifically sound solutions.\",\"type\":\"text\"}]},{\"type\":\"paragraph\",\"content\":[{\"text\":\"This project is suited for a beginner striving Zoologist entering the field. However, all students with an interest in conversation and animal wellbeing can thrive within this project.\",\"type\":\"text\"}]}]},\"goals\":{\"type\":\"doc\",\"content\":[{\"type\":\"paragraph\",\"content\":[{\"text\":\"Identify key biomes including biomes found within Southern Africa\",\"type\":\"text\"}]},{\"type\":\"paragraph\",\"content\":[{\"text\":\"Troubleshoot and address conservation issues\",\"type\":\"text\"}]},{\"type\":\"paragraph\",\"content\":[{\"text\":\"Gain extensive knowledge on the honey badger and your own species of study\",\"type\":\"text\"}]},{\"type\":\"paragraph\",\"content\":[{\"text\":\"Understand the ecology of the African “bushveld” including key ecological factors of your own species of study\",\"type\":\"text\"}]},{\"type\":\"paragraph\",\"content\":[{\"text\":\"Write an academic paper of your own and learn how to present it in an academic setting\",\"type\":\"text\"}]},{\"type\":\"paragraph\",\"content\":[{\"text\":\"Know how to secure a future in the Zoological field\",\"type\":\"text\"}]}]},\"schedule\":\"Tuesdays, 5:00 P.M. ET / 2:00 P.M. PT\",\"status\":\"applications_open\",\"duration\":\"8 weeks, 2-3 hours per week\",\"workshops\":{\"sessions\":[{\"name\":\"Pick Your Animal of Choice\",\"order\":1,\"description\":{\"type\":\"doc\",\"content\":[{\"type\":\"paragraph\",\"content\":[{\"text\":\"In this workshop we will get to know one another, discuss your career interests and goals, and identify which aspects of the filed you are most interested in. In this workshop, you will pick your own species of study for the remainder of this course. \",\"type\":\"text\"}]}]}},{\"name\":\"Get to Know Your Animal\",\"order\":2,\"description\":{\"type\":\"doc\",\"content\":[{\"type\":\"paragraph\",\"content\":[{\"text\":\"In this workshop we will investigate species' phenotypic and genotypic makeup, as well as its specific traits that contribute to its success and adaptability in the wild. This will help you understand your species' role within multiple biomes. Information from this workshop will guide your research throughout the rest of the project.\",\"type\":\"text\"}]}]}},{\"name\":\"Assessing Human-Wildlife Conflict\",\"order\":3,\"description\":{\"type\":\"doc\",\"content\":[{\"type\":\"paragraph\",\"content\":[{\"text\":\"You will analyze various human-wildlife conflict scenarios and the broader ecological consequences on your specific species.\",\"type\":\"text\"}]}]}},{\"name\":\"Relationships to the Natural Environment\",\"order\":4,\"description\":{\"type\":\"doc\",\"content\":[{\"type\":\"paragraph\",\"content\":[{\"text\":\"In this workshop we will discuss relationships between various mammalians and other species (mutualism, commensalism, etc.). We will use the example of the honeybee with the honey badger to help you identify what kind of relationship your specific species has with others. \",\"type\":\"text\"}]}]}},{\"name\":\"Where is Home?\",\"order\":5,\"description\":{\"type\":\"doc\",\"content\":[{\"type\":\"paragraph\",\"content\":[{\"text\":\"You will explore the various biomes where the honey badger is found within South Africa and other parts of the world, and gain an understanding of the differences and similarities found between them. Using this information, you will explore the various worlds in which your species finds itself in.\",\"type\":\"text\"}]}]}},{\"name\":\"Fearless in Captivity\",\"order\":6,\"description\":{\"type\":\"doc\",\"content\":[{\"type\":\"paragraph\",\"content\":[{\"text\":\"You will explore the cognitive ability, problem solving behavior and the welfare needs of captive honey badgers drawing from case studies of well know subjects (like the famous captive honey badger Stoffel). What does your species look like in captive settings?\",\"type\":\"text\"}]}]}},{\"name\":\"Questions for a Zoologist\",\"order\":7,\"description\":{\"type\":\"doc\",\"content\":[{\"type\":\"paragraph\",\"content\":[{\"text\":\"In this workshop you will have the opportunity to ask a zoologist questions you would like to know. This can include a wide variety of questions, including questions on various mammalian species, job search, personal questions which are in line with the work the fellow does, and more. \",\"type\":\"text\"}]}]}},{\"name\":\"The Final Standoff\",\"order\":8,\"description\":{\"type\":\"doc\",\"content\":[{\"type\":\"paragraph\",\"content\":[{\"text\":\"In this workshop you will present your final PowerPoint, discuss major learnings from the course, and explore what lies next for your career.  \",\"type\":\"text\"}]}]}}]},\"fellows\":[{\"id\":\"21ab91a0-b3c7-46f3-8a08-c587a7977d91\",\"name\":\"Hijke Pretorius\",\"role\":\"Zoologist Fellow\",\"organization\":\"Open Avenues Foundation\",\"organizationLogoUrl\":\"/images/organizations/oaf-logo.png\",\"photoUrl\":\"https://avgkrhojcamcagufngrr.supabase.co/storage/v1/object/public/fellow-headshots/21ab91a0-b3c7-46f3-8a08-c587a7977d91.webp\",\"bio\":\"Hijke Pretorius is a Zoologist Build Fellow at Open Avenues, where she works with students leading projects in Zoology. \\n\\nHijke is a Zoologist at Buckeye Honey Badgers, where she focuses on the care and well-being of captive honey badgers and conservation of wild populations of honey badgers in South Africa. \\n\\nHijke has over 3 years of experience in the Zoology field.  She has received her degree in the United States in Wildlife Management and has participated in various internships across the zoological field and has also taken part at a volunteer program at Moholoholo Rehabilitation Centre in the Limpopo Province of South Africa. \\n\\nShe holds a degree in Wildlife, Fish and Wildlands Science and Management – Bachelor of Science.\\n\\nA fun fact about Hijke is that she is a lover of all the world’s ugliest and most dangerous mammals across the world. She loves to play golf and came over to the United States on a golf scholarship from South Africa. \\n\",\"linkedinUrl\":\"https://www.linkedin.com/in/hijke-pretorius-5b5243340?utm_source=share\u0026utm_campaign=share_via\u0026utm_content=profile\u0026utm_medium=ios_app\"}],\"categories\":[\"Zoology\",\"Wildlife Conservation\",\"Ecosystem Ecology\",\"Phenotyping\"],\"applicationTimeline\":[{\"label\":\"Applications open\",\"value\":\"August 3, 2026\"},{\"label\":\"Applications deadline\",\"value\":\"September 3, 2026\"},{\"label\":\"Application results released\",\"value\":\"Week of September 14, 2026\"},{\"label\":\"Project start date\",\"value\":\"Week of September 28, 2026\"},{\"label\":\"Project end date\",\"value\":\"Week of November 16, 2026\"}],\"cycle_id\":\"6e8885e5-3870-4327-a19c-d88c867fa48f\"},\"error\":\"$undefined\"}]\n"])</script></body></html>
