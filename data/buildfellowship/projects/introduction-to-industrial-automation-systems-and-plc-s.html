7e111b509a4.js?dpl=dpl_A9QRwtuL4hrMD2RZGqb9eW7AtxES\",\"4420\",\"static/chunks/4420-baa8329e5076733c.js?dpl=dpl_A9QRwtuL4hrMD2RZGqb9eW7AtxES\",\"2169\",\"static/chunks/2169-1d13735e35f16c75.js?dpl=dpl_A9QRwtuL4hrMD2RZGqb9eW7AtxES\",\"419\",\"static/chunks/419-9f9e6d455ee0ae85.js?dpl=dpl_A9QRwtuL4hrMD2RZGqb9eW7AtxES\",\"5288\",\"static/chunks/5288-5d7819e0848b1b1a.js?dpl=dpl_A9QRwtuL4hrMD2RZGqb9eW7AtxES\",\"6874\",\"static/chunks/6874-67c719d6db2b17af.js?dpl=dpl_A9QRwtuL4hrMD2RZGqb9eW7AtxES\",\"6766\",\"static/chunks/6766-7fcc7eadc8fee52b.js?dpl=dpl_A9QRwtuL4hrMD2RZGqb9eW7AtxES\",\"9435\",\"static/chunks/9435-28f947009b0f7d38.js?dpl=dpl_A9QRwtuL4hrMD2RZGqb9eW7AtxES\",\"2206\",\"static/chunks/2206-42291f248e6bf19d.js?dpl=dpl_A9QRwtuL4hrMD2RZGqb9eW7AtxES\",\"5782\",\"static/chunks/5782-04eaa6c475f5c3f2.js?dpl=dpl_A9QRwtuL4hrMD2RZGqb9eW7AtxES\",\"8419\",\"static/chunks/app/projects/%5Bslug%5D/page-7f8129194c3557a1.js?dpl=dpl_A9QRwtuL4hrMD2RZGqb9eW7AtxES\"],\"default\"]\n"])</script><script>self.__next_f.push([1,"b:[\"$\",\"$L19\",null,{\"project\":{\"id\":\"4590713b-6e83-46f6-b104-da499a384707\",\"title\":\"Introduction to Industrial Automation Systems and PLC’s\",\"slug\":\"introduction-to-industrial-automation-systems-and-plc-s\",\"summary\":{\"type\":\"doc\",\"content\":[{\"type\":\"paragraph\",\"content\":[{\"text\":\"Design and simulate a basic industrial automation system using Programmable Logic Controller “ PLC” to understand how smart factories streamline real-world operations.\",\"type\":\"text\"}]}]},\"description\":{\"type\":\"doc\",\"content\":[{\"type\":\"paragraph\",\"content\":[{\"text\":\"In this hands-on Build Project, you will dive into the exciting world of industrial automation by designing and developing a real-world automation and control system. Through research-based learning, you will explore cutting-edge tools like Programmable Logic Controllers (PLCs), sensors, and actuators, while using simulation software to test and validate their designs. Guided by industry-relevant scenarios, students will solve complex challenges, such as optimizing manufacturing processes or ensuring system safety. By the end of the project, they will gain practical experience in system design, troubleshooting, and technical communication skills highly sought after in entry-level roles such as automation engineers, control system designers, and manufacturing specialists in today’s rapidly evolving U.S. workforce.\",\"type\":\"text\"}]}]},\"project_area\":[\"Engineering\"],\"level\":\"Intermediate\",\"levelDescription\":\"Some experience recommended\",\"prerequisites\":{\"type\":\"doc\",\"content\":[{\"type\":\"paragraph\",\"content\":[{\"text\":\"Excellent verbal and written communication skills\",\"type\":\"text\"}]},{\"type\":\"paragraph\",\"content\":[{\"text\":\"Strong problem-solving.\",\"type\":\"text\"}]},{\"type\":\"paragraph\",\"content\":[{\"text\":\"A professional, hands-on style with the ability to work independently and as a team player, to take initiative, and manage multiple tasks and projects at a time.\",\"type\":\"text\"}]},{\"type\":\"paragraph\",\"content\":[{\"text\":\"Basic Understanding of Electrical Engineering Principles: Familiarity with circuit design, basis- level coding, control systems, and electrical components.\",\"type\":\"text\"}]},{\"type\":\"paragraph\",\"content\":[{\"text\":\"Willingness to Learn: A proactive mindset to explore new tools, techniques, and concepts relevant to the project.\",\"type\":\"text\"}]}]},\"goals\":{\"type\":\"doc\",\"content\":[{\"type\":\"paragraph\",\"content\":[{\"text\":\"Utilize Simulation Tools: Apply software such as MATLAB, Simulink, or TIA Portal to simulate, test, and validate automation system designs.\",\"type\":\"text\"}]},{\"type\":\"paragraph\",\"content\":[{\"text\":\"Integrate Sensors and Actuators: Demonstrate the ability to select, integrate, and troubleshoot sensors, actuators, and other control system components for industrial applications.\",\"type\":\"text\"}]},{\"type\":\"paragraph\",\"content\":[{\"text\":\"Apply Problem-Solving Techniques: Diagnose and resolve challenges in control system design, utilizing systematic troubleshooting and optimization methods.\",\"type\":\"text\"}]},{\"type\":\"paragraph\",\"content\":[{\"text\":\"Communicate Technical Solutions: Prepare and present professional documentation, schematics, and project findings to effectively convey technical designs and their real-world applications.\",\"type\":\"text\"}]},{\"type\":\"paragraph\",\"content\":[{\"text\":\"Design Functional Control Systems: Create and document automation solutions using Programmable Logic Controllers (PLCs) with Ladder Logic or other industry-relevant programming languages.\",\"type\":\"text\"}]}]},\"schedule\":\"Thursdays, 5:00 P.M. ET / 2:00 P.M. PT\",\"status\":\"archived\",\"duration\":\"8 weeks, 2-3 hours per week\",\"workshops\":{\"sessions\":[{\"name\":\"Introduction\",\"order\":1,\"description\":{\"type\":\"doc\",\"content\":[{\"type\":\"paragraph\",\"content\":[{\"text\":\"Meet your teammates and explore key components like PLCs, sensors, and controllers that power modern industries. Get introduced to industrial automation systems and understand where and how they're used in the real world.\",\"type\":\"text\"}]}]}},{\"name\":\"Program Your First PLC\",\"order\":2,\"description\":{\"type\":\"doc\",\"content\":[{\"type\":\"paragraph\",\"content\":[{\"text\":\"Dive into the world of PLCs and learn the basics of Ladder Logic programming. You’ll write your first program using a simulation tool and explore how logic drives machines.\",\"type\":\"text\"}]}]}},{\"name\":\"Connect Sensors \u0026 Actuators\",\"order\":3,\"description\":{\"type\":\"doc\",\"content\":[{\"type\":\"paragraph\",\"content\":[{\"text\":\"Learn how to integrate sensors and actuators with a PLC. You’ll create logic to read inputs and control outputs, and understand how real systems sense and respond to the world.\",\"type\":\"text\"}]}]}},{\"name\":\"Human-Machine Interface (HMI) Introduction\",\"order\":4,\"description\":{\"type\":\"doc\",\"content\":[{\"type\":\"paragraph\",\"content\":[{\"text\":\"Explore how operators interact with machines through HMI (Human-Machine Interfaces).\",\"type\":\"text\"}]}]}},{\"name\":\"Control with Feedback\",\"order\":5,\"description\":{\"type\":\"doc\",\"content\":[{\"type\":\"paragraph\",\"content\":[{\"text\":\"Discover how feedback control works using PID controllers. Discuss tuning outcomes and optimization.\",\"type\":\"text\"}]}]}},{\"name\":\"Troubleshoot \u0026 Optimize\",\"order\":6,\"description\":{\"type\":\"doc\",\"content\":[{\"type\":\"paragraph\",\"content\":[{\"text\":\"Learn how to identify and fix issues in automation systems. You’ll practice troubleshooting real-world scenarios and explore ways to make systems more efficient and reliable.\",\"type\":\"text\"}]}]}},{\"name\":\"Build \u0026 Test Your System\",\"order\":7,\"description\":{\"type\":\"doc\",\"content\":[{\"type\":\"paragraph\",\"content\":[{\"text\":\"Pull everything together into a complete automation system. You’ll test your program and hardware integration, fix issues, and get your solution ready for presentation.\",\"type\":\"text\"}]}]}},{\"name\":\"Present \u0026 Reflect\",\"order\":8,\"description\":{\"type\":\"doc\",\"content\":[{\"type\":\"paragraph\",\"content\":[{\"text\":\"Showcase your final project! Present your automation solution, reflect on what you learned, and discuss how these skills connect to real-world engineering careers.\",\"type\":\"text\"}]}]}}]},\"fellows\":[{\"id\":\"e18b664c-33a1-409a-9168-8b5d3c3ff2e2\",\"name\":\"Kareem Alshomaly\",\"role\":\"Electrical Engineering Fellow\",\"organization\":\"DREAM Venture Labs\",\"organizationLogoUrl\":\"/images/organizations/dv-logo.png\",\"photoUrl\":\"https://avgkrhojcamcagufngrr.supabase.co/storage/v1/object/public/fellow-headshots/e18b664c-33a1-409a-9168-8b5d3c3ff2e2.webp\",\"bio\":\"Kareem is an Electrical Engineer Build Fellow at DREAM Venture Labs, where he works with students leading projects in Electrical Engineering.\\n\\nKareem is an Engineering Manager at Connected Solutions Group, where he focuses on leading IoT engineering projects, managing cross-functional teams, developing innovative solutions for client needs, and ensuring the successful deployment of connected technologies. His responsibilities include overseeing project timelines, coordinating with stakeholders, optimizing engineering processes, and driving product development to meet customer requirements.\\n\\nKareem has over 4 years of experience in the fields of automation systems and networking.\\n\\nHe holds a bachelor's degree in Electrical Engineering and a Master's degree in Business Administration.\\n\\n\\nA fun fact about Kareem is that he enjoys hiking and camping, often exploring scenic trails and nature spots during his free time.\",\"linkedinUrl\":\"www.linkedin.com/in/kareem-alshomaly\"}],\"categories\":[\"Industrial Automation\",\"PLC Programming\",\"Electrical Engineering\",\"Manufacturing Systems\"],\"applicationTimeline\":[{\"label\":\"Applications open\",\"value\":\"July 15, 2025\"},{\"label\":\"Applications deadline\",\"value\":\"August 10, 2025\"},{\"label\":\"Application results released\",\"value\":\"Week of August 25, 2025\"},{\"label\":\"Project start date\",\"value\":\"Week of September 8, 2025\"},{\"label\":\"Project end date\",\"value\":\"Week of October 27, 2025\"}],\"cycle_id\":\"edaee5d1-0a25-4398-8a57-8b642ce5330b\"},\"error\":\"$undefined\"}]\n"])</script></body></html>
