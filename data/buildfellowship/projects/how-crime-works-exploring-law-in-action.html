xES\",\"4420\",\"static/chunks/4420-baa8329e5076733c.js?dpl=dpl_A9QRwtuL4hrMD2RZGqb9eW7AtxES\",\"2169\",\"static/chunks/2169-1d13735e35f16c75.js?dpl=dpl_A9QRwtuL4hrMD2RZGqb9eW7AtxES\",\"419\",\"static/chunks/419-9f9e6d455ee0ae85.js?dpl=dpl_A9QRwtuL4hrMD2RZGqb9eW7AtxES\",\"5288\",\"static/chunks/5288-5d7819e0848b1b1a.js?dpl=dpl_A9QRwtuL4hrMD2RZGqb9eW7AtxES\",\"6874\",\"static/chunks/6874-67c719d6db2b17af.js?dpl=dpl_A9QRwtuL4hrMD2RZGqb9eW7AtxES\",\"6766\",\"static/chunks/6766-7fcc7eadc8fee52b.js?dpl=dpl_A9QRwtuL4hrMD2RZGqb9eW7AtxES\",\"9435\",\"static/chunks/9435-28f947009b0f7d38.js?dpl=dpl_A9QRwtuL4hrMD2RZGqb9eW7AtxES\",\"2206\",\"static/chunks/2206-42291f248e6bf19d.js?dpl=dpl_A9QRwtuL4hrMD2RZGqb9eW7AtxES\",\"5782\",\"static/chunks/5782-04eaa6c475f5c3f2.js?dpl=dpl_A9QRwtuL4hrMD2RZGqb9eW7AtxES\",\"8419\",\"static/chunks/app/projects/%5Bslug%5D/page-7f8129194c3557a1.js?dpl=dpl_A9QRwtuL4hrMD2RZGqb9eW7AtxES\"],\"default\"]\n1a:T4a5,Ever wondered what it takes to build a criminal case from start to finish? In this Build project, you'll step into the role of a legal analyst to dissect and build a comprehensive case portfolio on a mock criminal case, mirroring the analytical work common in law firms and public defender offices. Under the guidance of an experienced industry professional, you'll analyze key elements of the case, assess possible defenses, map out trial procedures, and craft a verdict and sentencing recommendation based on criminal law principles. You’ll gain hands-on experience with fundamental legal techniques like case classification, evidence assessment, and procedural mapping, all within a simulated judicial process.  \n\nBy the end of the project, you’ll develop a case analysis portfolio "])</script><script>self.__next_f.push([1,"covering each stage of a criminal case, from classification to sentencing recommendations. You’ll present your findings in a legal brief format, simulating the concise and persuasive style of professional legal writing. \n \nThis project offers a valuable, real-world experience for anyone interested in understanding the building blocks of criminal justice and applying legal concepts in practice. \n"])</script><script>self.__next_f.push([1,"b:[\"$\",\"$L19\",null,{\"project\":{\"id\":\"1a891d29-c4e2-4f5d-9f83-f284deccc308\",\"title\":\"How Crime Works: Exploring Law in Action\",\"slug\":\"how-crime-works-exploring-law-in-action\",\"summary\":{\"type\":\"doc\",\"content\":[{\"type\":\"paragraph\",\"content\":[{\"text\":\"Examine criminal theory, legal principles, defense strategies, and societal impacts through case studies and discussions. \\n\",\"type\":\"text\"}]}]},\"description\":{\"type\":\"doc\",\"content\":[{\"type\":\"paragraph\",\"content\":[{\"text\":\"$1a\",\"type\":\"text\"}]}]},\"project_area\":[\"Business\"],\"level\":\"Beginner\",\"levelDescription\":\"No prior experience required\",\"prerequisites\":{\"type\":\"doc\",\"content\":[{\"type\":\"paragraph\",\"content\":[{\"text\":\"Basic Knowledge of Criminal Law Principles: Understand key concepts such as crime classification, the elements of a crime (actus reus and mens rea), and the roles within the criminal justice system.\",\"type\":\"text\"}]},{\"type\":\"paragraph\",\"content\":[{\"text\":\"Analytical Thinking Skills: Critically examine case details, identify relevant legal issues, and logically piece together elements to form a coherent analysis.\",\"type\":\"text\"}]},{\"type\":\"paragraph\",\"content\":[{\"text\":\"Clear, Concise Writing Skills: Write in a structured, professional style suitable for legal briefs and formal analysis.\",\"type\":\"text\"}]},{\"type\":\"paragraph\",\"content\":[{\"text\":\"Attention to Detail: Carefully review facts and legal principles to produce accurate and persuasive case analyses.\",\"type\":\"text\"}]}]},\"goals\":{\"type\":\"doc\",\"content\":[{\"type\":\"paragraph\",\"content\":[{\"text\":\"Analyze Criminal Cases: Identify key facts, relevant legal principles, and elements of the crime.\",\"type\":\"text\"}]},{\"type\":\"paragraph\",\"content\":[{\"text\":\"Differentiate Types of Crimes: Understand and classify various types of crimes within the criminal justice system.\",\"type\":\"text\"}]},{\"type\":\"paragraph\",\"content\":[{\"text\":\"Interpret Roles in the Judicial Process: Explain the responsibilities of the prosecution, defense, and judiciary.\",\"type\":\"text\"}]},{\"type\":\"paragraph\",\"content\":[{\"text\":\"Apply Criminal Procedure: Understand and outline the procedural steps from arrest to sentencing, including trial flow and legal requirements.\",\"type\":\"text\"}]},{\"type\":\"paragraph\",\"content\":[{\"text\":\"Construct a Case Analysis Portfolio: Develop a structured portfolio that includes legal defenses, potential verdicts, and sentencing outcomes.\",\"type\":\"text\"}]}]},\"schedule\":\"Fridays, 6:00 P.M. ET / 3:00 P.M. PT\",\"status\":\"archived\",\"duration\":\"8 weeks, 2-3 hours per week\",\"workshops\":{\"sessions\":[{\"name\":\"Introduction to Criminal Law \u0026 Case Introduction\",\"order\":1,\"description\":{\"type\":\"doc\",\"content\":[{\"type\":\"paragraph\",\"content\":[{\"text\":\"In this session, you’ll be introduced to the basics of criminal law, including its purpose and role in society. You’ll also get your mock case scenario, which you’ll be analyzing throughout the course. This week, you'll focus on identifying key facts, establishing context, and understanding the framework within which your analysis will unfold.\",\"type\":\"text\"}]}]}},{\"name\":\"Players in the Criminal Justice System\",\"order\":2,\"description\":{\"type\":\"doc\",\"content\":[{\"type\":\"paragraph\",\"content\":[{\"text\":\"This week, you’ll dive into the main players in the criminal justice system, including the prosecution, defense, judge, jury, and defendant. You’ll learn about the roles and responsibilities of each party and how they interact within a trial setting.\",\"type\":\"text\"}]}]}},{\"name\":\"Types of Crimes\",\"order\":3,\"description\":{\"type\":\"doc\",\"content\":[{\"type\":\"paragraph\",\"content\":[{\"text\":\"In this session, you’ll explore the different classifications of crimes, such as felonies, misdemeanors, and infractions. You’ll learn how to categorize crimes and why classifications matter for penalties and legal procedures.\",\"type\":\"text\"}]}]}},{\"name\":\"Elements of a Crime\",\"order\":4,\"description\":{\"type\":\"doc\",\"content\":[{\"type\":\"paragraph\",\"content\":[{\"text\":\"You’ll examine the two fundamental elements of most crimes: actus reus (the criminal act) and mens rea (the mental intent). You’ll explore how these elements are proven in court and how they apply to your case scenario.\",\"type\":\"text\"}]}]}},{\"name\":\"Defenses\",\"order\":5,\"description\":{\"type\":\"doc\",\"content\":[{\"type\":\"paragraph\",\"content\":[{\"text\":\"You’ll learn about common legal defenses, such as self-defense, insanity, duress, and alibi. This session emphasizes how defenses are used to refute criminal liability and introduces the requirements for establishing each defense.\",\"type\":\"text\"}]}]}},{\"name\":\"Procedure\",\"order\":6,\"description\":{\"type\":\"doc\",\"content\":[{\"type\":\"paragraph\",\"content\":[{\"text\":\"This session covers the procedural stages leading up to a trial, including arrest, arraignment, bail, plea bargaining, and preliminary hearings. You’ll gain insight into the legal safeguards and steps required before a case reaches trial.\",\"type\":\"text\"}]}]}},{\"name\":\"Trial\",\"order\":7,\"description\":{\"type\":\"doc\",\"content\":[{\"type\":\"paragraph\",\"content\":[{\"text\":\"You’ll examine the trial process, including opening statements, evidence presentation, witness examination, closing arguments, and jury instructions. You’ll learn the importance of each step in ensuring a fair trial.\",\"type\":\"text\"}]}]}},{\"name\":\"Verdict, Sentencing, and Final Case Reflection\",\"order\":8,\"description\":{\"type\":\"doc\",\"content\":[{\"type\":\"paragraph\",\"content\":[{\"text\":\"In the final session, you’ll learn about the outcomes of criminal cases, including potential verdicts, sentencing guidelines, and post-conviction options like appeals. Reflect on the entirety of your case, incorporating everything you’ve learned over the course.\",\"type\":\"text\"}]}]}}]},\"fellows\":[{\"id\":\"6d922771-1907-494a-bf4c-67494ef2789f\",\"name\":\"Hetali Sheth\",\"role\":\"Law Fellow\",\"organization\":\"Open Avenues Foundation\",\"organizationLogoUrl\":\"/images/organizations/oaf-logo.png\",\"photoUrl\":\"https://avgkrhojcamcagufngrr.supabase.co/storage/v1/object/public/fellow-headshots/6d922771-1907-494a-bf4c-67494ef2789f.webp\",\"bio\":\"Hetali is a Law Fellow at Open Avenues, where she works with students leading projects in criminal law.\\nHetali is an International Associate at Harris St. Laurent Wechsler, where she focuses on commercial and white-collar litigation. \\nHetali has over 5 years of experience in the legal field. Her experience is in trials and appellate litigation, including criminal, human rights, and international law. She also focused on rights-based advocacy, representing clients in wrongful conviction cases before appellate courts. Notably, some of these individuals had spent decades incarcerated.\\nShe holds a Master of Laws from Cornell Law School. \\nA fun fact about Hetali is that she is learning how to play the piano. \\n\",\"linkedinUrl\":\"https://www.linkedin.com/in/hetali-sheth-951427109/\"}],\"categories\":[\"Criminal Law\",\"Judicial Process\",\"Case Study\",\"Legal Analysis\"],\"applicationTimeline\":[{\"label\":\"Applications open\",\"value\":\"May 9, 2025\"},{\"label\":\"Applications deadline\",\"value\":\"June 8, 2025\"},{\"label\":\"Application results released\",\"value\":\"Week of June 23, 2025\"},{\"label\":\"Project start date\",\"value\":\"Week of July 7, 2025\"},{\"label\":\"Project end date\",\"value\":\"Week of August 25, 2025\"}],\"cycle_id\":\"77065a20-2032-46f1-b3cf-d435314c7011\"},\"error\":\"$undefined\"}]\n"])</script></body></html>
