xES\",\"4420\",\"static/chunks/4420-baa8329e5076733c.js?dpl=dpl_A9QRwtuL4hrMD2RZGqb9eW7AtxES\",\"2169\",\"static/chunks/2169-1d13735e35f16c75.js?dpl=dpl_A9QRwtuL4hrMD2RZGqb9eW7AtxES\",\"419\",\"static/chunks/419-9f9e6d455ee0ae85.js?dpl=dpl_A9QRwtuL4hrMD2RZGqb9eW7AtxES\",\"5288\",\"static/chunks/5288-5d7819e0848b1b1a.js?dpl=dpl_A9QRwtuL4hrMD2RZGqb9eW7AtxES\",\"6874\",\"static/chunks/6874-67c719d6db2b17af.js?dpl=dpl_A9QRwtuL4hrMD2RZGqb9eW7AtxES\",\"6766\",\"static/chunks/6766-7fcc7eadc8fee52b.js?dpl=dpl_A9QRwtuL4hrMD2RZGqb9eW7AtxES\",\"9435\",\"static/chunks/9435-28f947009b0f7d38.js?dpl=dpl_A9QRwtuL4hrMD2RZGqb9eW7AtxES\",\"2206\",\"static/chunks/2206-42291f248e6bf19d.js?dpl=dpl_A9QRwtuL4hrMD2RZGqb9eW7AtxES\",\"5782\",\"static/chunks/5782-04eaa6c475f5c3f2.js?dpl=dpl_A9QRwtuL4hrMD2RZGqb9eW7AtxES\",\"8419\",\"static/chunks/app/projects/%5Bslug%5D/page-7f8129194c3557a1.js?dpl=dpl_A9QRwtuL4hrMD2RZGqb9eW7AtxES\"],\"default\"]\n"])</script><script>self.__next_f.push([1,"b:[\"$\",\"$L19\",null,{\"project\":{\"id\":\"bf723441-51e5-4517-a4eb-7df46e669f62\",\"title\":\"Law in Events Planning: Build the Legal Strategy for a Major Cybersecurity Conference\",\"slug\":\"legal-foundations-of-event-planning-1-1\",\"summary\":{\"type\":\"doc\",\"content\":[{\"type\":\"paragraph\",\"content\":[{\"text\":\"Get introduced to the role of lawyers advising event organizers by examining key legal issues involved in planning and managing live, virtual, and hybrid events while applying legal principles through practical simulations.\",\"type\":\"text\"}]}]},\"description\":{\"type\":\"doc\",\"content\":[{\"type\":\"paragraph\",\"content\":[{\"text\":\"This 8-week Build Project provides a comprehensive introduction to the legal principles that govern the planning and management of modern events. Students will explore the legal framework surrounding event operations and examine how legal professionals help organizations navigate regulatory requirements, manage risk, protect stakeholders, and ensure compliance throughout the event lifecycle.\",\"type\":\"text\"}]},{\"type\":\"paragraph\",\"content\":[{\"text\":\"Throughout the project, you will step into the role of legal counsel by developing a comprehensive legal strategy for a large-scale cybersecurity conference involving industry experts, sponsors, vendors, and government representatives. The simulated event includes keynote presentations, breakout sessions, live demonstrations, and networking receptions, providing realistic scenarios through which to apply legal concepts in a practical context.\",\"type\":\"text\"}]},{\"type\":\"paragraph\",\"content\":[{\"text\":\"As the project progresses, you will connect legal theory with professional practice by examining topics such as contracts, permits and licensing, liability and risk management, insurance, intellectual property, and crisis management. You will also explore emerging legal issues affecting today's events, including cybersecurity incident liability, vendor data management, public safety obligations, and content and branding rights.\",\"type\":\"text\"}]},{\"type\":\"paragraph\",\"content\":[{\"text\":\"By completing weekly exercises and assignments, you will develop a comprehensive legal event plan that demonstrates how legal analysis, risk assessment, regulatory compliance, and strategic decision-making contribute to the successful planning and execution of complex live, virtual, and hybrid events.\",\"type\":\"text\"}]}]},\"project_area\":[\"Law\"],\"level\":\"Beginner\",\"levelDescription\":\"No prior experience required\",\"prerequisites\":{\"type\":\"doc\",\"content\":[{\"type\":\"paragraph\",\"content\":[{\"text\":\"Contract Law: Basic structure of a contract (offer, acceptance, consideration, terms)\",\"type\":\"text\"}]},{\"type\":\"paragraph\",\"content\":[{\"text\":\"Legal Terminology: common legal terms used in contracts, waivers, and public compliance (e.g., indemnity, liability, license)\",\"type\":\"text\"}]},{\"type\":\"paragraph\",\"content\":[{\"text\":\"Purpose of Legal Documents: understanding why events use contracts, waivers, and permits\",\"type\":\"text\"}]},{\"type\":\"paragraph\",\"content\":[{\"text\":\"Legal System Awareness: a general sense of local/state regulations and the role of law in public safety and regulation\",\"type\":\"text\"}]},{\"type\":\"paragraph\",\"content\":[{\"text\":\"Legal Risk Awareness: ability to think about what can go wrong legally at public events (e.g., injuries, IP misuse, unauthorized vendors)\",\"type\":\"text\"}]}]},\"goals\":{\"type\":\"doc\",\"content\":[{\"type\":\"paragraph\",\"content\":[{\"text\":\"Apply legal theory to real-world event scenarios\",\"type\":\"text\"}]},{\"type\":\"paragraph\",\"content\":[{\"text\":\"Draft and analyze key legal documents\",\"type\":\"text\"}]},{\"type\":\"paragraph\",\"content\":[{\"text\":\"Understand regulatory and compliance requirements\",\"type\":\"text\"}]},{\"type\":\"paragraph\",\"content\":[{\"text\":\"Assess and mitigate legal risks\",\"type\":\"text\"}]},{\"type\":\"paragraph\",\"content\":[{\"text\":\"Think critically about the intersection of law, business, entertainment, and public policy.\",\"type\":\"text\"}]}]},\"schedule\":\"Fridays, 5:00 P.M. ET / 2:00 P.M. PT\",\"status\":\"applications_open\",\"duration\":\"8 weeks, 2-3 hours per week\",\"workshops\":{\"sessions\":[{\"name\":\"Introduction to Legal Foundations in Event Planning\",\"order\":1,\"description\":{\"type\":\"doc\",\"content\":[{\"type\":\"paragraph\",\"content\":[{\"text\":\"An overview of the legal landscape surrounding event planning, including the role of laws, regulations, and common legal issues faced by planners.\",\"type\":\"text\"}]}]}},{\"name\":\"Contracts and Agreements in Event Planning\",\"order\":2,\"description\":{\"type\":\"doc\",\"content\":[{\"type\":\"paragraph\",\"content\":[{\"text\":\"Study contract law fundamentals, essential clauses, breach consequences, and negotiation strategies.\",\"type\":\"text\"}]}]}},{\"name\":\"Permits, Licenses, and Regulatory Compliance\",\"order\":3,\"description\":{\"type\":\"doc\",\"content\":[{\"type\":\"paragraph\",\"content\":[{\"text\":\"Explore the permit application process, local regulations, and compliance requirements.\",\"type\":\"text\"}]}]}},{\"name\":\"Liability and Risk Management\",\"order\":4,\"description\":{\"type\":\"doc\",\"content\":[{\"type\":\"paragraph\",\"content\":[{\"text\":\"Learn about different types of liability, indemnification, waivers, and how to assess and mitigate risks.\",\"type\":\"text\"}]}]}},{\"name\":\"Insurance for Event Planning\",\"order\":5,\"description\":{\"type\":\"doc\",\"content\":[{\"type\":\"paragraph\",\"content\":[{\"text\":\"Discuss general liability, cancellation, property, and worker’s compensation insurance policies.\",\"type\":\"text\"}]}]}},{\"name\":\"Intellectual Property and Licensing in Events\",\"order\":6,\"description\":{\"type\":\"doc\",\"content\":[{\"type\":\"paragraph\",\"content\":[{\"text\":\"Examine copyright, trademarks, music licensing, and the use of images and logos.\",\"type\":\"text\"}]}]}},{\"name\":\"Crisis Management and Legal Responses\",\"order\":7,\"description\":{\"type\":\"doc\",\"content\":[{\"type\":\"paragraph\",\"content\":[{\"text\":\"Plan for incidents such as accidents, cancellations, or legal disputes, including communication and documentation.\",\"type\":\"text\"}]}]}},{\"name\":\"Final Project Presentation and Review\",\"order\":8,\"description\":{\"type\":\"doc\",\"content\":[{\"type\":\"paragraph\",\"content\":[{\"text\":\"Presentation of a comprehensive event plan covering contracts, permits, liability, insurance, IP, and crisis management.\",\"type\":\"text\"}]}]}}]},\"fellows\":[{\"id\":\"f3a0db4e-048f-4635-834c-c4cdd2ac4ec8\",\"name\":\"Iryna Konstantinova\",\"role\":\"Law Fellow\",\"organization\":\"Open Avenues Foundation\",\"organizationLogoUrl\":\"/images/organizations/oaf-logo.png\",\"photoUrl\":\"https://avgkrhojcamcagufngrr.supabase.co/storage/v1/object/public/fellow-headshots/f3a0db4e-048f-4635-834c-c4cdd2ac4ec8.webp\",\"bio\":\"Iryna is a Law Fellow at The Build Fellowship, where she works with students leading projects focused on the legal foundations of event planning.\\n\\nIryna is a Contracts and Events manager at ThreatLocker, where she focuses on supporting legal and event operations by reviewing contracts, ensuring compliance, coordinating vendors, and managing CRM documentation. She helps facilitate over 800 events annually, aligning all agreements with ThreatLocker’s legal and financial standards.\\n\\nIryna has over 3 years of experience in the law field. \\n\\nShe holds both a bachelor’s and a master’s degree in law.\\n\\nA fun fact about Iryna: after completing her law degree, she pursued her passion for pastry and worked as a pastry chef for several years before resuming her legal career.\",\"linkedinUrl\":\"https://www.linkedin.com/in/iryna-konstantinova-b2979a2b0\"}],\"categories\":[\"Event Law\",\"Contract Law\",\"Liability \u0026 Risk Management\",\"Permits and Licensing\"],\"applicationTimeline\":[{\"label\":\"Applications open\",\"value\":\"August 3, 2026\"},{\"label\":\"Applications deadline\",\"value\":\"September 3, 2026\"},{\"label\":\"Application results released\",\"value\":\"Week of September 14, 2026\"},{\"label\":\"Project start date\",\"value\":\"Week of September 28, 2026\"},{\"label\":\"Project end date\",\"value\":\"Week of November 16, 2026\"}],\"cycle_id\":\"6e8885e5-3870-4327-a19c-d88c867fa48f\"},\"error\":\"$undefined\"}]\n"])</script></body></html>
