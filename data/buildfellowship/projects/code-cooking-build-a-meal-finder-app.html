420\",\"static/chunks/4420-baa8329e5076733c.js?dpl=dpl_A9QRwtuL4hrMD2RZGqb9eW7AtxES\",\"2169\",\"static/chunks/2169-1d13735e35f16c75.js?dpl=dpl_A9QRwtuL4hrMD2RZGqb9eW7AtxES\",\"419\",\"static/chunks/419-9f9e6d455ee0ae85.js?dpl=dpl_A9QRwtuL4hrMD2RZGqb9eW7AtxES\",\"5288\",\"static/chunks/5288-5d7819e0848b1b1a.js?dpl=dpl_A9QRwtuL4hrMD2RZGqb9eW7AtxES\",\"6874\",\"static/chunks/6874-67c719d6db2b17af.js?dpl=dpl_A9QRwtuL4hrMD2RZGqb9eW7AtxES\",\"6766\",\"static/chunks/6766-7fcc7eadc8fee52b.js?dpl=dpl_A9QRwtuL4hrMD2RZGqb9eW7AtxES\",\"9435\",\"static/chunks/9435-28f947009b0f7d38.js?dpl=dpl_A9QRwtuL4hrMD2RZGqb9eW7AtxES\",\"2206\",\"static/chunks/2206-42291f248e6bf19d.js?dpl=dpl_A9QRwtuL4hrMD2RZGqb9eW7AtxES\",\"5782\",\"static/chunks/5782-04eaa6c475f5c3f2.js?dpl=dpl_A9QRwtuL4hrMD2RZGqb9eW7AtxES\",\"8419\",\"static/chunks/app/projects/%5Bslug%5D/page-7f8129194c3557a1.js?dpl=dpl_A9QRwtuL4hrMD2RZGqb9eW7AtxES\"],\"default\"]\n"])</script><script>self.__next_f.push([1,"b:[\"$\",\"$L19\",null,{\"project\":{\"id\":\"dea72d8a-7397-4f0c-a741-8f5d3f07f78a\",\"title\":\"Code \u0026 Cooking: Build a Meal Finder App\",\"slug\":\"code-cooking-build-a-meal-finder-app\",\"summary\":{\"type\":\"doc\",\"content\":[{\"type\":\"paragraph\",\"content\":[{\"text\":\"Go from a blank screen to a live meal finder app you can share and see how a real web app gets built and shipped in just 8 weeks.\",\"type\":\"text\"}]}]},\"description\":{\"type\":\"doc\",\"content\":[{\"type\":\"paragraph\",\"content\":[{\"text\":\"Software isn’t just about writing code: it’s planning, building in small steps, and making sure what you built works for real people. In this project, you’ll build a meal-finder web app that suggests meal ideas based on your input. You’ll practice how teams work day-to-day by turning a request into a clear plan, building features step by step, and improving the app based on what you learn. You’ll also learn the basics of working with real data, handling common edge cases, and adding simple checks, so changes don’t break the main flow. By the end, you’ll have a live app you can share and a clear walkthrough of how you built it.\",\"type\":\"text\"}]}]},\"project_area\":[\"Computer Science\"],\"level\":\"Beginner\",\"levelDescription\":\"No prior experience required\",\"prerequisites\":{\"type\":\"doc\",\"content\":[{\"type\":\"paragraph\",\"content\":[{\"text\":\"Know how to build and style a web page with HTML and CSS: you can create a basic page structure with elements like headings, buttons, and forms, and use CSS to control how they look. You do not need to be an expert, but you should not be seeing HTML or CSS for the first time.\",\"type\":\"text\"}]},{\"type\":\"paragraph\",\"content\":[{\"text\":\"Write basic JavaScript: you have used variables, functions, and conditionals before and can follow along when someone explains what a piece of code does.\",\"type\":\"text\"}]},{\"type\":\"paragraph\",\"content\":[{\"text\":\"Use Git and GitHub at a basic level: you can clone a repository, make a commit, and push changes.\",\"type\":\"text\"}]},{\"type\":\"paragraph\",\"content\":[{\"text\":\"Run a project from the terminal: you can open a terminal, navigate to a folder, and run commands like npm install and npm run dev.\",\"type\":\"text\"}]}]},\"goals\":{\"type\":\"doc\",\"content\":[{\"type\":\"paragraph\",\"content\":[{\"text\":\"Describe how a software team moves work from idea to release, including roles, ceremonies, and day-to-day communication.\",\"type\":\"text\"}]},{\"type\":\"paragraph\",\"content\":[{\"text\":\"Use React to break down a UI into reusable and functional components and use Tailwind CSS to style and layout the application.\",\"type\":\"text\"}]},{\"type\":\"paragraph\",\"content\":[{\"text\":\"Explore and navigate a real codebase, understanding how pages, components, and data flow connect to each other.\",\"type\":\"text\"}]},{\"type\":\"paragraph\",\"content\":[{\"text\":\"Implement a connection to an external API and identify how data moves from a server response to what a user sees on screen.\",\"type\":\"text\"}]},{\"type\":\"paragraph\",\"content\":[{\"text\":\"Recognize the role of automated testing, continuous integration, and deployment in the software release process, from catching bugs to getting an app live.\",\"type\":\"text\"}]}]},\"schedule\":\"Mondays, 5:00 P.M. ET / 2:00 P.M. PT\",\"status\":\"archived\",\"duration\":\"8 weeks, 2-3 hours per week\",\"workshops\":{\"sessions\":[{\"name\":\"Introductions + How Software Teams Work\",\"order\":1,\"description\":{\"type\":\"doc\",\"content\":[{\"type\":\"paragraph\",\"content\":[{\"text\":\"Get to know the Build Fellow and other students, preview what we’ll build over 8 weeks, and learn how software teams work by using this project as the example. Get ready to start building next week!\",\"type\":\"text\"}]}]}},{\"name\":\"Project Kickoff + Build Starts\",\"order\":2,\"description\":{\"type\":\"doc\",\"content\":[{\"type\":\"paragraph\",\"content\":[{\"text\":\"Review the project plan and set up the app locally, learn the fundamentals of React, understand how pages and components fit together, and build the first version of the main screen using accessible HTML.\",\"type\":\"text\"}]}]}},{\"name\":\"Make It Feel Real\",\"order\":3,\"description\":{\"type\":\"doc\",\"content\":[{\"type\":\"paragraph\",\"content\":[{\"text\":\"Finish the UI by connecting components and adding the details users expect: clean layout, responsive behavior, empty states, and a quick accessibility check so the app is usable before real data is connected.\",\"type\":\"text\"}]}]}},{\"name\":\"Bring Real Data Into the App\",\"order\":4,\"description\":{\"type\":\"doc\",\"content\":[{\"type\":\"paragraph\",\"content\":[{\"text\":\"Connect your app to an external API, make your first request, and show the returned data on the page.\",\"type\":\"text\"}]}]}},{\"name\":\"User Flow and Edge Cases\",\"order\":5,\"description\":{\"type\":\"doc\",\"content\":[{\"type\":\"paragraph\",\"content\":[{\"text\":\"Improve the API feature so it feels ready to go live by handling common cases like no results, invalid input, and failed requests. Polish the main flow so it’s smooth and consistent for users.\",\"type\":\"text\"}]}]}},{\"name\":\"End-to-End Testing + GitHub Actions\",\"order\":6,\"description\":{\"type\":\"doc\",\"content\":[{\"type\":\"paragraph\",\"content\":[{\"text\":\"Add an end-to-end test that checks the full user flow in the browser, then set up GitHub Actions to run checks automatically on every pull request so quality is enforced before changes are merged.\",\"type\":\"text\"}]}]}},{\"name\":\"Deployment + Monitoring Basics\",\"order\":7,\"description\":{\"type\":\"doc\",\"content\":[{\"type\":\"paragraph\",\"content\":[{\"text\":\"Deploy the app so it has a live link, verify it works in production, and learn what teams watch for after release.\",\"type\":\"text\"}]}]}},{\"name\":\"Final Demo + Interview-Style Presentation\",\"order\":8,\"description\":{\"type\":\"doc\",\"content\":[{\"type\":\"paragraph\",\"content\":[{\"text\":\"Present your app like a junior engineer! Explain what you built and why, walk through your code and decisions, and share what you would build next.\",\"type\":\"text\"}]}]}}]},\"fellows\":[{\"id\":\"7a373896-5c06-4bee-921d-38da13f70346\",\"name\":\"Raphael Fabeni\",\"role\":\"Computer Science Fellow\",\"organization\":\"Open Avenues Foundation\",\"organizationLogoUrl\":\"/images/organizations/oaf-logo.png\",\"photoUrl\":\"https://avgkrhojcamcagufngrr.supabase.co/storage/v1/object/public/fellow-headshots/7a373896-5c06-4bee-921d-38da13f70346.webp\",\"bio\":\"Raphael Fabeni is a Computer Science Global Talent Fellow at Open Avenues, where he works with students leading projects in computer science and software development.\\n\\nRaphael is a Director of Engineering at Red Ventures with 12+ years of experience in software engineering and engineering leadership. He leads multiple engineering teams and focuses on building strong organizations, setting technical direction, and developing engineers into confident, high-impact leaders. Across his work, he has experience delivering partner integrations, public-sector initiatives, owned-and-operated products, and internal tools. Earlier in his career, he worked across design, user experience, and infographics before moving fully into engineering and leadership.\\n\\nA fun fact about Raphael is that he trains for triathlons, and he brings that same discipline into leadership: consistency, smart planning, and steady execution over time.\",\"linkedinUrl\":\"https://www.linkedin.com/in/raphaelfabeni\"}],\"categories\":[\"Web Development\",\"React\",\"APIs\",\"Development Lifecycle\"],\"applicationTimeline\":[{\"label\":\"Applications open\",\"value\":\"April 13, 2026\"},{\"label\":\"Applications deadline\",\"value\":\"May 20, 2026\"},{\"label\":\"Application results released\",\"value\":\"Week of May 26, 2026\"},{\"label\":\"Project start date\",\"value\":\"Week of June 8, 2026\"},{\"label\":\"Project end date\",\"value\":\"Week of July 27, 2026\"}],\"cycle_id\":\"ae26a648-44bc-4fab-bbb0-7f9c0f6b18d9\"},\"error\":\"$undefined\"}]\n"])</script></body></html>
