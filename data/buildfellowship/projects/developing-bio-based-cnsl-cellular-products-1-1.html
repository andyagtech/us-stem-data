9QRwtuL4hrMD2RZGqb9eW7AtxES\",\"4420\",\"static/chunks/4420-baa8329e5076733c.js?dpl=dpl_A9QRwtuL4hrMD2RZGqb9eW7AtxES\",\"2169\",\"static/chunks/2169-1d13735e35f16c75.js?dpl=dpl_A9QRwtuL4hrMD2RZGqb9eW7AtxES\",\"419\",\"static/chunks/419-9f9e6d455ee0ae85.js?dpl=dpl_A9QRwtuL4hrMD2RZGqb9eW7AtxES\",\"5288\",\"static/chunks/5288-5d7819e0848b1b1a.js?dpl=dpl_A9QRwtuL4hrMD2RZGqb9eW7AtxES\",\"6874\",\"static/chunks/6874-67c719d6db2b17af.js?dpl=dpl_A9QRwtuL4hrMD2RZGqb9eW7AtxES\",\"6766\",\"static/chunks/6766-7fcc7eadc8fee52b.js?dpl=dpl_A9QRwtuL4hrMD2RZGqb9eW7AtxES\",\"9435\",\"static/chunks/9435-28f947009b0f7d38.js?dpl=dpl_A9QRwtuL4hrMD2RZGqb9eW7AtxES\",\"2206\",\"static/chunks/2206-42291f248e6bf19d.js?dpl=dpl_A9QRwtuL4hrMD2RZGqb9eW7AtxES\",\"5782\",\"static/chunks/5782-04eaa6c475f5c3f2.js?dpl=dpl_A9QRwtuL4hrMD2RZGqb9eW7AtxES\",\"8419\",\"static/chunks/app/projects/%5Bslug%5D/page-7f8129194c3557a1.js?dpl=dpl_A9QRwtuL4hrMD2RZGqb9eW7AtxES\"],\"default\"]\n1a:T4b9,In the rapidly evolving field of sustainable materials, addressing environmental impact through innovative solutions is crucial. In this Build Project, you'll wear the hat of a Materials Engineer and develop bio-based cellular products using cashew nutshell liquid as a key component. Under the supervision of an experienced industry expert, you'll prepare and test various sustainable materials, learning to apply cutting-edge analytical methods like FTIR and Karl Fischer. \n\nYou'll become familiar with industry-standard techniques for material characterization and production, all within an environment that simulates real-world engineering challenges and team dynamics. Important Details: No Physical Materials Required: Students will not need to purchase any materials or conduct phys"])</script><script>self.__next_f.push([1,"ical manipulations during the project; everything will be conducted online. Free Software: All analyses will utilize free, readily available software tools, ensuring no additional costs for participants. Project Format: The project will include a mix of pre-recorded instructional videos, live webinars for Q\u0026A sessions, and interactive online discussions, alongside access to digital resources to support your learning."])</script><script>self.__next_f.push([1,"b:[\"$\",\"$L19\",null,{\"project\":{\"id\":\"8d1f88c7-59c6-4794-a4c3-a303d4dfa0cf\",\"title\":\"From Cashew Waste to Sustainable Bio-Based Cellular Products\",\"slug\":\"developing-bio-based-cnsl-cellular-products-1-1\",\"summary\":{\"type\":\"doc\",\"content\":[{\"type\":\"paragraph\",\"content\":[{\"text\":\"Transform cashew nutshell byproducts into sustainable cellular materials that address environmental needs while showcasing innovative uses in various industries.\",\"type\":\"text\"}]}]},\"description\":{\"type\":\"doc\",\"content\":[{\"type\":\"paragraph\",\"content\":[{\"text\":\"$1a\",\"type\":\"text\"}]}]},\"project_area\":[\"Engineering\"],\"level\":\"Intermediate\",\"levelDescription\":\"Some experience recommended\",\"prerequisites\":{\"type\":\"doc\",\"content\":[{\"type\":\"paragraph\",\"content\":[{\"text\":\"Intermediate Knowledge of Materials Science: You should understand the fundamentals of materials science, particularly in polymers and cellular plastics, as covered in classes like “Introduction to Materials Science” or “Polymer Chemistry.” You should be comfortable with concepts like material properties, polymerization, and the role of additives in polymer formulation.\",\"type\":\"text\"}]},{\"type\":\"paragraph\",\"content\":[{\"text\":\"Basic Analytical Skills: You need to be able to use and interpret results from various analytical instruments such as Fourier-transform infrared spectroscopy (FTIR), Karl Fischer titration, and viscometers. Experience with these tools, or coursework in “Analytical Chemistry” or “Instrumental Analysis,” will be essential for evaluating material properties.\",\"type\":\"text\"}]},{\"type\":\"paragraph\",\"content\":[{\"text\":\"Proficiency in Data Analysis: You should be skilled in using software tools like MS Excel for data analysis and visualization. Familiarity with statistical methods and data interpretation is crucial, as you will be analyzing experimental results and preparing reports based on your findings.\",\"type\":\"text\"}]},{\"type\":\"paragraph\",\"content\":[{\"text\":\"Effective Communication Skills: You need to be able to clearly communicate your findings and project progress through written reports and presentations. This includes creating clear, concise PowerPoint slides and presenting complex information in an understandable manner. Experience in public speaking or coursework in “Technical Writing” will be beneficial.\",\"type\":\"text\"}]},{\"type\":\"paragraph\",\"content\":[{\"text\":\"Team Collaboration and Problem-Solving Abilities: The project involves collaborative tasks, so being able to work effectively in a team, manage time, and resolve issues as they arise is important. Skills in team projects or experience from group assignments in previous classes will help you contribute to and lead project efforts successfully.\",\"type\":\"text\"}]}]},\"goals\":{\"type\":\"doc\",\"content\":[{\"type\":\"paragraph\",\"content\":[{\"text\":\"Apply analytical methods such as FTIR, Karl Fischer, and viscometer techniques to assess the physical and chemical properties of bio-based materials.\",\"type\":\"text\"}]},{\"type\":\"paragraph\",\"content\":[{\"text\":\"Evaluate the effectiveness of sustainable materials, including cashew nutshell liquid-based foams, through comprehensive testing and data analysis.\",\"type\":\"text\"}]},{\"type\":\"paragraph\",\"content\":[{\"text\":\"Develop and optimize resin preparation and foam production processes, incorporating best practices and troubleshooting techniques.\",\"type\":\"text\"}]},{\"type\":\"paragraph\",\"content\":[{\"text\":\"Collaborate effectively in a team setting to design, execute, and present findings from experimental projects focused on eco-friendly material innovations.\",\"type\":\"text\"}]}]},\"schedule\":\"Tuesdays, 9:00 P.M. ET / 6:00 P.M. PT\",\"status\":\"archived\",\"duration\":\"8 weeks, 2-3 hours per week\",\"workshops\":{\"sessions\":[{\"name\":\"Kickoff and Overview\",\"order\":1,\"description\":{\"type\":\"doc\",\"content\":[{\"type\":\"paragraph\",\"content\":[{\"text\":\"Meet with the team to introduce the project, discuss the curriculum, and set expectations for collaboration. Design initial slides outlining project objectives and working methods.\",\"type\":\"text\"}]}]}},{\"name\":\"Exploring CNSL and Work Environment\",\"order\":2,\"description\":{\"type\":\"doc\",\"content\":[{\"type\":\"paragraph\",\"content\":[{\"text\":\"Learn about the role of a Materials Engineer and the use of Cashew Nutshell Liquid (CNSL) as a sustainable alternative to petroleum-based polyols. Set up the working environment and familiarize with project resources.\",\"type\":\"text\"}]}]}},{\"name\":\"ISO Index Calculation and Material Selection\",\"order\":3,\"description\":{\"type\":\"doc\",\"content\":[{\"type\":\"paragraph\",\"content\":[{\"text\":\"Dive into ISO Index calculations through video tutorials and examples, culminating in a short report. Discuss mechanical properties of cellular plastics and select appropriate materials, using publicly available data.\",\"type\":\"text\"}]}]}},{\"name\":\"Resin Preparation and Analytical Methods\",\"order\":4,\"description\":{\"type\":\"doc\",\"content\":[{\"type\":\"paragraph\",\"content\":[{\"text\":\"Watch videos on resin preparation, tackling common challenges, and discussing lab practices. Get an overview of analytical instruments like FTIR and Karl Fischer and prepare samples for analysis.\",\"type\":\"text\"}]}]}},{\"name\":\"Foam Sample Production\",\"order\":5,\"description\":{\"type\":\"doc\",\"content\":[{\"type\":\"paragraph\",\"content\":[{\"text\":\"Learn to prepare and create foam samples, analyzing reactivity data and collaborating on overcoming challenges.\",\"type\":\"text\"}]}]}},{\"name\":\"Physical Properties Analysis\",\"order\":6,\"description\":{\"type\":\"doc\",\"content\":[{\"type\":\"paragraph\",\"content\":[{\"text\":\"Analyze physical properties (water content, viscosity) and test properties (density, compression strength). Watch tutorials, practice data collection, and work as a team to interpret results.\",\"type\":\"text\"}]}]}},{\"name\":\"Evaluate Analytical Methods and Prepare Final Presentation\",\"order\":7,\"description\":{\"type\":\"doc\",\"content\":[{\"type\":\"paragraph\",\"content\":[{\"text\":\"Assess the effectiveness of different analytical methods and compile findings into a report. Create PowerPoint slides for the final presentation, receiving feedback for refinement.\",\"type\":\"text\"}]}]}},{\"name\":\"Present and Review\",\"order\":8,\"description\":{\"type\":\"doc\",\"content\":[{\"type\":\"paragraph\",\"content\":[{\"text\":\"Assess the effectiveness of different analytical methods and compile findings into a report. Create PowerPoint slides for the final presentation, receiving feedback for refinement.\",\"type\":\"text\"}]}]}}]},\"fellows\":[{\"id\":\"3df5cac7-1975-44f1-a6ee-07d390cbf337\",\"name\":\"Abdul Aziz Al Alawi\",\"role\":\"Materials Engineering Fellow\",\"organization\":\"Open Avenues Foundation\",\"organizationLogoUrl\":\"/images/organizations/oaf-logo.png\",\"photoUrl\":\"https://avgkrhojcamcagufngrr.supabase.co/storage/v1/object/public/fellow-headshots/3df5cac7-1975-44f1-a6ee-07d390cbf337.webp\",\"bio\":\"\\\"I am a Specialist Materials Engineer at Ambit Polyurethane, where my role encompasses a range of exciting and impactful responsibilities. I am specifically responsible for the development of polyurethane systems designed for 3D printing applications in the construction of buildings and residential structures. This involves conducting chemical synthesis of recycled plastic bottles, polyethylene terephthalate (PET). \\n\\nI hold a Bachelor’s degree in Material Science and Engineering from University of North Texas.\\\"\",\"linkedinUrl\":\"\"}],\"categories\":[\"Sustainable Materials\",\"Materials Processing\",\"Polymer Engineering\",\"Material Science\"],\"applicationTimeline\":[{\"label\":\"Applications open\",\"value\":\"April 13, 2026\"},{\"label\":\"Applications deadline\",\"value\":\"May 20, 2026\"},{\"label\":\"Application results released\",\"value\":\"Week of May 26, 2026\"},{\"label\":\"Project start date\",\"value\":\"Week of June 8, 2026\"},{\"label\":\"Project end date\",\"value\":\"Week of July 27, 2026\"}],\"cycle_id\":\"ae26a648-44bc-4fab-bbb0-7f9c0f6b18d9\"},\"error\":\"$undefined\"}]\n"])</script></body></html>
