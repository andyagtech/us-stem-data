a4.js?dpl=dpl_A9QRwtuL4hrMD2RZGqb9eW7AtxES\",\"4420\",\"static/chunks/4420-baa8329e5076733c.js?dpl=dpl_A9QRwtuL4hrMD2RZGqb9eW7AtxES\",\"2169\",\"static/chunks/2169-1d13735e35f16c75.js?dpl=dpl_A9QRwtuL4hrMD2RZGqb9eW7AtxES\",\"419\",\"static/chunks/419-9f9e6d455ee0ae85.js?dpl=dpl_A9QRwtuL4hrMD2RZGqb9eW7AtxES\",\"5288\",\"static/chunks/5288-5d7819e0848b1b1a.js?dpl=dpl_A9QRwtuL4hrMD2RZGqb9eW7AtxES\",\"6874\",\"static/chunks/6874-67c719d6db2b17af.js?dpl=dpl_A9QRwtuL4hrMD2RZGqb9eW7AtxES\",\"6766\",\"static/chunks/6766-7fcc7eadc8fee52b.js?dpl=dpl_A9QRwtuL4hrMD2RZGqb9eW7AtxES\",\"9435\",\"static/chunks/9435-28f947009b0f7d38.js?dpl=dpl_A9QRwtuL4hrMD2RZGqb9eW7AtxES\",\"2206\",\"static/chunks/2206-42291f248e6bf19d.js?dpl=dpl_A9QRwtuL4hrMD2RZGqb9eW7AtxES\",\"5782\",\"static/chunks/5782-04eaa6c475f5c3f2.js?dpl=dpl_A9QRwtuL4hrMD2RZGqb9eW7AtxES\",\"8419\",\"static/chunks/app/projects/%5Bslug%5D/page-7f8129194c3557a1.js?dpl=dpl_A9QRwtuL4hrMD2RZGqb9eW7AtxES\"],\"default\"]\n1a:T44b,Embark on an exciting journey into 3D computer vision, where you'll learn to transform 2D images into fascinating 3D point clouds. This Build Project is designed to introduce you to the world of 3D vision, regardless of your programming background. Over eight interactive workshops, you'll construct a 3D vision pipeline step by step, with all the necessary code structures provided. You'll use Python and Jupyter notebooks, you’ll receive guidance if you're new to these. Each workshop will include prepared code segments where you'll fill in key functions, supported by built-in tests to verify your solutions. You'll explore concepts like camera models, image processing, and stereo vision through hands-on exercises. By the project's end, you'll have contributed to a working 3D reco"])</script><script>self.__next_f.push([1,"nstruction tool, gaining insights into computer vision, basic Python programming, and 3D data visualization. This project offers a gentle introduction to technologies used in exciting fields like robotics and augmented reality, providing you with a unique learning experience regardless of your starting point."])</script><script>self.__next_f.push([1,"b:[\"$\",\"$L19\",null,{\"project\":{\"id\":\"c070e737-afb9-4b9b-8a72-184c3f259edd\",\"title\":\"Pixel to Point Cloud: Building a 3D Vision Pipeline\",\"slug\":\"pixel-to-point-cloud-building-a-3d-vision-pipeline-1\",\"summary\":{\"type\":\"doc\",\"content\":[{\"type\":\"paragraph\",\"content\":[{\"text\":\"Develop a comprehensive 3D vision pipeline, transforming 2D images into 3D point clouds using Python and computer vision techniques.\",\"type\":\"text\"}]}]},\"description\":{\"type\":\"doc\",\"content\":[{\"type\":\"paragraph\",\"content\":[{\"text\":\"$1a\",\"type\":\"text\"}]}]},\"project_area\":[\"Computer Science\"],\"level\":\"Intermediate\",\"levelDescription\":\"Some experience recommended\",\"prerequisites\":{\"type\":\"doc\",\"content\":[{\"type\":\"paragraph\",\"content\":[{\"text\":\"Basic computer literacy: You should be comfortable using a computer, navigating file systems, and using web browsers.\",\"type\":\"text\"}]},{\"type\":\"paragraph\",\"content\":[{\"text\":\"Familiarity with basic mathematical concepts: Understanding of high school level algebra and geometry will be helpful. You should be comfortable with concepts like coordinates, vectors, and simple equations.\",\"type\":\"text\"}]},{\"type\":\"paragraph\",\"content\":[{\"text\":\"Curiosity about computer vision and 3D imaging: While no prior knowledge is required, an interest in how computers interpret visual information will greatly enhance your learning experience.\",\"type\":\"text\"}]},{\"type\":\"paragraph\",\"content\":[{\"text\":\"Willingness to learn basic programming concepts: You don't need prior programming experience, but you should be open to learning simple Python syntax and logic as we go along.\",\"type\":\"text\"}]}]},\"goals\":{\"type\":\"doc\",\"content\":[{\"type\":\"paragraph\",\"content\":[{\"text\":\"Understand the fundamental principles of how computers interpret visual information.\",\"type\":\"text\"}]},{\"type\":\"paragraph\",\"content\":[{\"text\":\"Grasp the connection between 2D images and 3D space in computer vision.\",\"type\":\"text\"}]},{\"type\":\"paragraph\",\"content\":[{\"text\":\"Explore the mathematical foundations underlying 3D reconstruction from images.\",\"type\":\"text\"}]},{\"type\":\"paragraph\",\"content\":[{\"text\":\"Appreciate the challenges and solutions in creating accurate 3D models from 2D data.\",\"type\":\"text\"}]},{\"type\":\"paragraph\",\"content\":[{\"text\":\"Recognize the applications and potential of 3D vision in various industries.\",\"type\":\"text\"}]}]},\"schedule\":\"Wednesdays, 5:00 P.M. ET / 2:00 P.M. PT\",\"status\":\"archived\",\"duration\":\"8 weeks, 2-3 hours per week\",\"workshops\":{\"sessions\":[{\"name\":\"Introduction to 3D Vision\",\"order\":1,\"description\":{\"type\":\"doc\",\"content\":[{\"type\":\"paragraph\",\"content\":[{\"text\":\"Explore the course overview, set up your development environment, and learn how to compile and use Jupyter Book for your project deliverable.\",\"type\":\"text\"}]}]}},{\"name\":\"Understanding Camera Models\",\"order\":2,\"description\":{\"type\":\"doc\",\"content\":[{\"type\":\"paragraph\",\"content\":[{\"text\":\"Dive into how cameras work, focusing on the OpenCV pinhole camera model and lens distortion. You'll program a distortion function to see these concepts in action.\",\"type\":\"text\"}]}]}},{\"name\":\"Image Undistortion Techniques\",\"order\":3,\"description\":{\"type\":\"doc\",\"content\":[{\"type\":\"paragraph\",\"content\":[{\"text\":\"Learn about undistortion and image remapping. You'll implement an undistort function and apply it to real images.\",\"type\":\"text\"}]}]}},{\"name\":\"3D-2D Projections and PnP\",\"order\":4,\"description\":{\"type\":\"doc\",\"content\":[{\"type\":\"paragraph\",\"content\":[{\"text\":\"Explore how to project 3D points onto 2D images and solve the Perspective-n-Point (PnP) problem. You'll write part of a PnP solver function.\",\"type\":\"text\"}]}]}},{\"name\":\"Dual Camera Setups\",\"order\":5,\"description\":{\"type\":\"doc\",\"content\":[{\"type\":\"paragraph\",\"content\":[{\"text\":\"Understand how to work with two cameras simultaneously and perform triangulation. You'll implement a triangulation function to reconstruct 3D points.\",\"type\":\"text\"}]}]}},{\"name\":\"Stereo Matching Fundamentals\",\"order\":6,\"description\":{\"type\":\"doc\",\"content\":[{\"type\":\"paragraph\",\"content\":[{\"text\":\"Discover the basics of stereo matching and its role in 3D vision. You'll implement a simple stereo matching algorithm.\",\"type\":\"text\"}]}]}},{\"name\":\"From Disparity to 3D\",\"order\":7,\"description\":{\"type\":\"doc\",\"content\":[{\"type\":\"paragraph\",\"content\":[{\"text\":\"Learn how to convert disparity maps to depth information and create basic point clouds. You'll write a function to generate a point cloud from disparity data.\",\"type\":\"text\"}]}]}},{\"name\":\"Building Your 3D Vision Pipeline\",\"order\":8,\"description\":{\"type\":\"doc\",\"content\":[{\"type\":\"paragraph\",\"content\":[{\"text\":\"Integrate all components into a complete 3D reconstruction pipeline. You'll present your final project, demonstrating your 3D vision tool and discussing your learning journey.\",\"type\":\"text\"}]}]}}]},\"fellows\":[{\"id\":\"74dcc5fb-68e7-47d7-8d34-dce33221e4d7\",\"name\":\"Martin Ingvaldsen\",\"role\":\"Mechanical Engineering Fellow\",\"organization\":\"Open Avenues Foundation\",\"organizationLogoUrl\":\"/images/organizations/oaf-logo.png\",\"photoUrl\":\"https://avgkrhojcamcagufngrr.supabase.co/storage/v1/object/public/fellow-headshots/74dcc5fb-68e7-47d7-8d34-dce33221e4d7.webp\",\"bio\":\"Martin Ingvaldsen is a Mechanical Engineering Fellow at Open Avenues Foundation based in Silicon Valley, California.\\n\\nHe currently works as Head of 3D Vision at UnitX.\",\"lin
