rMD2RZGqb9eW7AtxES\",\"4420\",\"static/chunks/4420-baa8329e5076733c.js?dpl=dpl_A9QRwtuL4hrMD2RZGqb9eW7AtxES\",\"2169\",\"static/chunks/2169-1d13735e35f16c75.js?dpl=dpl_A9QRwtuL4hrMD2RZGqb9eW7AtxES\",\"419\",\"static/chunks/419-9f9e6d455ee0ae85.js?dpl=dpl_A9QRwtuL4hrMD2RZGqb9eW7AtxES\",\"5288\",\"static/chunks/5288-5d7819e0848b1b1a.js?dpl=dpl_A9QRwtuL4hrMD2RZGqb9eW7AtxES\",\"6874\",\"static/chunks/6874-67c719d6db2b17af.js?dpl=dpl_A9QRwtuL4hrMD2RZGqb9eW7AtxES\",\"6766\",\"static/chunks/6766-7fcc7eadc8fee52b.js?dpl=dpl_A9QRwtuL4hrMD2RZGqb9eW7AtxES\",\"9435\",\"static/chunks/9435-28f947009b0f7d38.js?dpl=dpl_A9QRwtuL4hrMD2RZGqb9eW7AtxES\",\"2206\",\"static/chunks/2206-42291f248e6bf19d.js?dpl=dpl_A9QRwtuL4hrMD2RZGqb9eW7AtxES\",\"5782\",\"static/chunks/5782-04eaa6c475f5c3f2.js?dpl=dpl_A9QRwtuL4hrMD2RZGqb9eW7AtxES\",\"8419\",\"static/chunks/app/projects/%5Bslug%5D/page-7f8129194c3557a1.js?dpl=dpl_A9QRwtuL4hrMD2RZGqb9eW7AtxES\"],\"default\"]\n1a:T46d,Rural communities and remote locations present a unique challenge for electric utilities because the costs and hazards associated with extending and maintaining electric grid infrastructure to remote locations are often higher than they would be in urban areas. Solutions such as standalone power systems which utilize renewable energy sources like solar and wind, offer localized solutions that reduce reliance on centralized grid infrastructure.  \n\nIn this Build Project, you will step into the role of an electrical engineer and develop a tool to assist with preliminary sizing of the electrical equipment for a remote microgrid system. Under the supervision of an experienced industry expert, you will develop an understanding of the requirements and considerations that apply to each "])</script><script>self.__next_f.push([1,"of the major microgrid components, and you will create a Python script that aggregates those system requirements in order to recommend an appropriately sized microgrid system. All this will happen in an environment that exposes you to the decisions that electrical engineers have to make, and the thought processes that go into every decision. "])</script><script>self.__next_f.push([1,"b:[\"$\",\"$L19\",null,{\"project\":{\"id\":\"9e5a803a-c89f-4396-af47-740e0931baae\",\"title\":\"Designing Remote Solar Microgrid Systems\",\"slug\":\"designing-remote-solar-microgrid-systems-1-1\",\"summary\":{\"type\":\"doc\",\"content\":[{\"type\":\"paragraph\",\"content\":[{\"text\":\"Develop a tool to aid with preliminary microgrid system design, then utilize the tool to recommend equipment sizes for a hypothetical remote solar microgrid system.\",\"type\":\"text\"}]}]},\"description\":{\"type\":\"doc\",\"content\":[{\"type\":\"paragraph\",\"content\":[{\"text\":\"$1a\",\"type\":\"text\"}]}]},\"project_area\":[\"Engineering\"],\"level\":\"Intermediate\",\"levelDescription\":\"Some experience recommended\",\"prerequisites\":{\"type\":\"doc\",\"content\":[{\"type\":\"paragraph\",\"content\":[{\"text\":\"Understanding of core electricity concepts: voltage, current (AC and DC), resistance, power and energy.\",\"type\":\"text\"}]},{\"type\":\"paragraph\",\"content\":[{\"text\":\"Familiarity with Microsoft Excel formulas: we will be using Excel to perform electric load/demand calculations.\",\"type\":\"text\"}]},{\"type\":\"paragraph\",\"content\":[{\"text\":\"Experience with basic Python (loops, conditions, functions, libraries, simple algorithms)\",\"type\":\"text\"}]}]},\"goals\":{\"type\":\"doc\",\"content\":[{\"type\":\"paragraph\",\"content\":[{\"text\":\"Understand the interactions between major components of a solar microgrid system\",\"type\":\"text\"}]},{\"type\":\"paragraph\",\"content\":[{\"text\":\"Generate a load profile for a remote microgrid site based on customer device time-of-use data\",\"type\":\"text\"}]},{\"type\":\"paragraph\",\"content\":[{\"text\":\"Recommend appropriate equipment sizes for a microgrid system based on customer location and load profile\",\"type\":\"text\"}]}]},\"schedule\":\"Wednesdays, 9:00 P.M. ET / 6:00 P.M. PT\",\"status\":\"archived\",\"duration\":\"8 weeks, 2-3 hours per week\",\"workshops\":{\"sessions\":[{\"name\":\"Introductions\",\"order\":1,\"description\":{\"type\":\"doc\",\"content\":[{\"type\":\"paragraph\",\"content\":[{\"text\":\"Who are we? What will the project look like? What will the sessions and final deliverable look like? What is a remote microgrid?\",\"type\":\"text\"}]}]}},{\"name\":\"Creating a Load Profile\",\"order\":2,\"description\":{\"type\":\"doc\",\"content\":[{\"type\":\"paragraph\",\"content\":[{\"text\":\"What is an Energy Audit Questionnaire? What is time-of-use? What is a Load Profile? How do we create load profiles and why are they relevant?\",\"type\":\"text\"}]}]}},{\"name\":\"Battery Energy Storage\",\"order\":3,\"description\":{\"type\":\"doc\",\"content\":[{\"type\":\"paragraph\",\"content\":[{\"text\":\"What is a battery? What are the different kinds of batteries? How does the load profile affect battery sizing? Can you estimate how much battery energy storage you need based on a load profile?\",\"type\":\"text\"}]}]}},{\"name\":\"Solar Photovoltaic (PV) System\",\"order\":4,\"description\":{\"type\":\"doc\",\"content\":[{\"type\":\"paragraph\",\"content\":[{\"text\":\"What is a Solar PV system? What are the characteristics of a solar PV system? How are PV modules connected? How do environmental factors affect PV system sizing? Can you use the number of solar panels and weather conditions to estimate PV production?\",\"type\":\"text\"}]}]}},{\"name\":\"Microgrid Sizing Tool Overview\",\"order\":5,\"description\":{\"type\":\"doc\",\"content\":[{\"type\":\"paragraph\",\"content\":[{\"text\":\"How do the separate aspects of a microgrid interact with each other? What is the impact of the customer load profile on each microgrid component?  You will start working on a Python script that takes all these into consideration then recommends equipment sizes for a remote microgrid system.\",\"type\":\"text\"}]}]}},{\"name\":\"Microgrid Sizing Tool Working Session\",\"order\":6,\"description\":{\"type\":\"doc\",\"content\":[{\"type\":\"paragraph\",\"content\":[{\"text\":\"In addition to electricity consumption patterns, what other considerations from the customer can affect your system design? Bring any questions you have about the microgrid sizing tool, or about remote microgrids in general.\",\"type\":\"text\"}]}]}},{\"name\":\"Microgrid Sizing Tool Submission\",\"order\":7,\"description\":{\"type\":\"doc\",\"content\":[{\"type\":\"paragraph\",\"content\":[{\"text\":\"Submit your python script and demonstrate its functionality. Analyze the outputs of your tool to determine its consistency with guidelines from earlier discussions. Start working on final presentation.\",\"type\":\"text\"}]}]}},{\"name\":\"Presentation\",\"order\":8,\"description\":{\"type\":\"doc\",\"content\":[{\"type\":\"paragraph\",\"content\":[{\"text\":\"Apply your sizing tool to a location of your choice. Provide explanations for why the recommended system differs from the earlier test case. Present your findings and opinions to others.\",\"type\":\"text\"}]}]}}]},\"fellows\":[{\"id\":\"af650062-8243-4906-9fe5-f613926d1281\",\"name\":\"Blaise Umeh\",\"role\":\"Electrical Engineering Fellow\",\"organization\":\"Open Avenues Foundation\",\"organizationLogoUrl\":\"/images/organizations/oaf-logo.png\",\"photoUrl\":\"https://avgkrhojcamcagufngrr.supabase.co/storage/v1/object/public/fellow-headshots/af650062-8243-4906-9fe5-f613926d1281.webp\",\"bio\":\"Obinna Umeh is an Electrical Engineering Build Fellow at Open Avenues, where he works with students leading projects in Electrical Engineering.\\n\\nObinna is a Product Engineer at BoxPower Inc., where he focuses on designing off-grid solar microgrid systems for remote areas, creating and maintaining electrical documentation, and specifying power and controls equipment used in BoxPower products.\\n\\nObinna has over four years
