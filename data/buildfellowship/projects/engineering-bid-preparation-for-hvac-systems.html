rMD2RZGqb9eW7AtxES\",\"4420\",\"static/chunks/4420-baa8329e5076733c.js?dpl=dpl_A9QRwtuL4hrMD2RZGqb9eW7AtxES\",\"2169\",\"static/chunks/2169-1d13735e35f16c75.js?dpl=dpl_A9QRwtuL4hrMD2RZGqb9eW7AtxES\",\"419\",\"static/chunks/419-9f9e6d455ee0ae85.js?dpl=dpl_A9QRwtuL4hrMD2RZGqb9eW7AtxES\",\"5288\",\"static/chunks/5288-5d7819e0848b1b1a.js?dpl=dpl_A9QRwtuL4hrMD2RZGqb9eW7AtxES\",\"6874\",\"static/chunks/6874-67c719d6db2b17af.js?dpl=dpl_A9QRwtuL4hrMD2RZGqb9eW7AtxES\",\"6766\",\"static/chunks/6766-7fcc7eadc8fee52b.js?dpl=dpl_A9QRwtuL4hrMD2RZGqb9eW7AtxES\",\"9435\",\"static/chunks/9435-28f947009b0f7d38.js?dpl=dpl_A9QRwtuL4hrMD2RZGqb9eW7AtxES\",\"2206\",\"static/chunks/2206-42291f248e6bf19d.js?dpl=dpl_A9QRwtuL4hrMD2RZGqb9eW7AtxES\",\"5782\",\"static/chunks/5782-04eaa6c475f5c3f2.js?dpl=dpl_A9QRwtuL4hrMD2RZGqb9eW7AtxES\",\"8419\",\"static/chunks/app/projects/%5Bslug%5D/page-7f8129194c3557a1.js?dpl=dpl_A9QRwtuL4hrMD2RZGqb9eW7AtxES\"],\"default\"]\n"])</script><script>self.__next_f.push([1,"b:[\"$\",\"$L19\",null,{\"project\":{\"id\":\"943453e5-528f-407a-b27a-91ade5e3c116\",\"title\":\"Engineering Bid Preparation for HVAC Systems\",\"slug\":\"engineering-bid-preparation-for-hvac-systems\",\"summary\":{\"type\":\"doc\",\"content\":[{\"type\":\"paragraph\",\"content\":[{\"text\":\"You will be exposed to the process of preparing an engineering bid for HVAC systems, emphasizing the technical data analysis needed to create accurate project scopes, costs, and timelines.\",\"type\":\"text\"}]}]},\"description\":{\"type\":\"doc\",\"content\":[{\"type\":\"paragraph\",\"content\":[{\"text\":\"Engineering bidding is a multidisciplinary process that involves various fields of Engineers and other experts, each coming together to the development and submission of a bid. The Mechanical Engineer designs and analyzes all mechanical systems, including HVAC (heating, ventilation, and air conditioning) and plumbing. In our Build Project, we will review building plans (architectural, mechanical \u0026amp; plumbing drawings) and specifications, learn to identify HVAC mechanical equipment requirements, evaluate specific HVAC product design, and lastly, generate cost estimations.\",\"type\":\"text\"}]}]},\"project_area\":[\"Engineering\"],\"level\":\"Intermediate\",\"levelDescription\":\"Some experience recommended\",\"prerequisites\":{\"type\":\"doc\",\"content\":[{\"type\":\"paragraph\",\"content\":[{\"text\":\"Ability to read engineering drawings and specifications. You’ll need to review and analyze different types of engineering drawings, including schematic diagrams, orthographic projections, and isometric views, as well as understand the importance of scale and how to convert measurements from scale to real-world dimensions.\",\"type\":\"text\"}]},{\"type\":\"paragraph\",\"content\":[{\"text\":\"Familiarity with 2D (AutoCAD), and 3D (SolidWorks/Creo etc.) CAD software. You should understand how to prepare CAD models for manufacturing, including using SolidWorks or other 3D platforms.\",\"type\":\"text\"}]},{\"type\":\"paragraph\",\"content\":[{\"text\":\"Other skills: Project management, technical reading \u0026 writing\",\"type\":\"text\"}]},{\"type\":\"paragraph\",\"content\":[{\"text\":\"Other Software: Excel, Bluebeam or Adobe\",\"type\":\"text\"}]}]},\"goals\":{\"type\":\"doc\",\"content\":[{\"type\":\"paragraph\",\"content\":[{\"text\":\"By the end of the project, you will be able to:\",\"type\":\"text\"}]},{\"type\":\"paragraph\",\"content\":[{\"text\":\"Read and evaluate architectural, mechanical \u0026 plumbing drawings. You will gain the ability to accurately read and interpret architectural, mechanical, and plumbing blueprints, identifying key symbols, scales, dimensions, and annotations.\",\"type\":\"text\"}]},{\"type\":\"paragraph\",\"content\":[{\"text\":\"Review and understand complex engineering project RFPs. You will become proficient in assessing the scope of a project outlined in the RFP, identifying key deliverables, milestones, and specific project needs, such as design requirements, performance specifications, and quality standards.\",\"type\":\"text\"}]},{\"type\":\"paragraph\",\"content\":[{\"text\":\"Conduct a product design review: Cost analysis and BOM creation. You will learn to critically assess product designs to identify potential areas of improvement, cost-saving opportunities, and areas that may affect manufacturability or quality.\",\"type\":\"text\"}]},{\"type\":\"paragraph\",\"content\":[{\"text\":\"Understand how different engineering practices work together on new construction projects. You will develop the ability to collaborate with other professionals (architects, engineers, contractors) in evaluating and modifying drawings. You will also learn how to identify discrepancies or potential conflicts between different building systems.\",\"type\":\"text\"}]}]},\"schedule\":\"Mondays, 5:00 P.M. ET / 2:00 P.M. PT\",\"status\":\"archived\",\"duration\":\"8 weeks, 2-3 hours per week\",\"workshops\":{\"sessions\":[{\"name\":\"Introduction to Engineering Bids\",\"order\":1,\"description\":{\"type\":\"doc\",\"content\":[{\"type\":\"paragraph\",\"content\":[{\"text\":\"Get to know the Project Leader. Familiarize with technical terms specific to the project.\",\"type\":\"text\"}]}]}},{\"name\":\"Understanding drawings and Specifications\",\"order\":2,\"description\":{\"type\":\"doc\",\"content\":[{\"type\":\"paragraph\",\"content\":[{\"text\":\"You will learn how to read bid contract drawings.\",\"type\":\"text\"}]}]}},{\"name\":\"Design Review\",\"order\":3,\"description\":{\"type\":\"doc\",\"content\":[{\"type\":\"paragraph\",\"content\":[{\"text\":\"You will learn the importance of 2D and 3D CAD software specific to the project application.\",\"type\":\"text\"}]}]}},{\"name\":\"Create Takeoffs\",\"order\":4,\"description\":{\"type\":\"doc\",\"content\":[{\"type\":\"paragraph\",\"content\":[{\"text\":\"You will need to identify the HVAC equipment from drawings and create quantity takeoffs.\",\"type\":\"text\"}]}]}},{\"name\":\"Cost Analysis: BOM and Routings\",\"order\":5,\"description\":{\"type\":\"doc\",\"content\":[{\"type\":\"paragraph\",\"content\":[{\"text\":\"You will learn about BOM’s. Good BOM vs. Bad BOM and their significance on the overall project.\",\"type\":\"text\"}]}]}},{\"name\":\"Bid Optimization and Proposal Drafting\",\"order\":6,\"description\":{\"type\":\"doc\",\"content\":[{\"type\":\"paragraph\",\"content\":[{\"text\":\"You will identify areas for cost savings and create a mock proposal.\",\"type\":\"text\"}]}]}},{\"name\":\"Final Submission\",\"order\":7,\"description\":{\"type\":\"doc\",\"content\":[{\"type\":\"paragraph\",\"content\":[{\"text\":\"Revisit mock proposal and provide feedback for final submission.\",\"type\":\"text\"}]}]}},{\"name\":\"Presentation and feedback\",\"order\":8,\"description\":{\"type\":\"doc\",\"content\":[{\"type\":\"paragraph\",\"content\":[{\"text\":\"Revisit mock proposal and provide feedback for final submission. \",\"type\":\"text\"}]}]}}]},\"fellows\":[{\"id\":\"e9c1d155-3f0a-451b-99ec-20f90a6709ff\",\"name\":\"Alsten Lobo\",\"role\":\"Mechanical Engineering Fellow\",\"organization\":\"Open Avenues Foundation\",\"organizationLogoUrl\":\"/images/organizations/oaf-logo.png\",\"photoUrl\":\"https://avgkrhojcamcagufngrr.supabase.co/storage/v1/object/public/fellow-headshots/e9c1d155-3f0a-451b-99ec-20f90a6709ff.webp\",\"bio\":\"Alsten is a Mechanical Engineering Build Fellow at Open Avenues, where he works with students leading projects in Mechanical Engineering.\\n\\nAlsten is a Product and Sales Engineer at Zehnder Rittling, where he focuses on designing and improving HVAC systems. His role involves product development, prototyping, testing, and ensuring products meet regulatory standards and customer needs. \\n\\nAlsten has over 5 years of experience in the Mechanical Engineering field. He has primarily worked in the manufacturing industry but also has experience in civil and construction as well. \\n\\nHe holds a Dual B.S in Mechanical and Aerospace Engineering and an M.E Engineering Management.\\n\\nA fun fact about Alsten is he enjoys playing team sports and is a regular in the local soccer leagues.\",\"linkedinUrl\":\"www.linkedin.com/in/alsten-lobo\"}],\"categories\":[\"HVAC Systems – Heating\",\"Ventilation\",\"And Air Conditioning\",\"Request For Proposal (RFP)\",\"Takeoffs\"],\"applicationTimeline\":[{\"label\":\"Applications open\",\"value\":\"May 9, 2025\"},{\"label\":\"Applications deadline\",\"value\":\"June 8, 2025\"},{\"label\":\"Application results released\",\"value\":\"Week of June 23, 2025\"},{\"label\":\"Project start date\",\"value\":\"Week of July 7, 2025\"},{\"label\":\"Project end date\",\"value\":\"Week of August 25, 2025\"}],\"cycle_id\":\"77065a20-2032-46f1-b3cf-d435314c7011\"},\"error\":\"$undefined\"}]\n"])</script></body></html>
