uL4hrMD2RZGqb9eW7AtxES\",\"277\",\"static/chunks/54a60aa6-294bb7e111b509a4.js?dpl=dpl_A9QRwtuL4hrMD2RZGqb9eW7AtxES\",\"4420\",\"static/chunks/4420-baa8329e5076733c.js?dpl=dpl_A9QRwtuL4hrMD2RZGqb9eW7AtxES\",\"2169\",\"static/chunks/2169-1d13735e35f16c75.js?dpl=dpl_A9QRwtuL4hrMD2RZGqb9eW7AtxES\",\"419\",\"static/chunks/419-9f9e6d455ee0ae85.js?dpl=dpl_A9QRwtuL4hrMD2RZGqb9eW7AtxES\",\"5288\",\"static/chunks/5288-5d7819e0848b1b1a.js?dpl=dpl_A9QRwtuL4hrMD2RZGqb9eW7AtxES\",\"6874\",\"static/chunks/6874-67c719d6db2b17af.js?dpl=dpl_A9QRwtuL4hrMD2RZGqb9eW7AtxES\",\"6766\",\"static/chunks/6766-7fcc7eadc8fee52b.js?dpl=dpl_A9QRwtuL4hrMD2RZGqb9eW7AtxES\",\"9435\",\"static/chunks/9435-28f947009b0f7d38.js?dpl=dpl_A9QRwtuL4hrMD2RZGqb9eW7AtxES\",\"2206\",\"static/chunks/2206-42291f248e6bf19d.js?dpl=dpl_A9QRwtuL4hrMD2RZGqb9eW7AtxES\",\"5782\",\"static/chunks/5782-04eaa6c475f5c3f2.js?dpl=dpl_A9QRwtuL4hrMD2RZGqb9eW7AtxES\",\"8419\",\"static/chunks/app/projects/%5Bslug%5D/page-7f8129194c3557a1.js?dpl=dpl_A9QRwtuL4hrMD2RZGqb9eW7AtxES\"],\"default\"]\n1a:T42a,This project is designed for students who aspire to work in the legal industry. Practicing law has its unique features that students cannot know until they get a hands-on experience of what it’s like. How is “legal writing” different from writing any other essays or research papers? How is reading case law and court decisions different from any other papers? What does \"legal analysis\" look like? Law Students spend an entire year (or more) to learn these skills. The project allows you to get a head start in gaining these skills, in a more simplified, beginner-friendly way. You will develop a legal memo as a final deliverable, which will include your analysis of cases, and its application to the matter at hand, and your position in advocating for your client. It can be used "])</script><script>self.__next_f.push([1,"as a writing sample which will be handy in applying for law schools and/or internships or other law office positions that do not require an attorney license. At the end of the 8-weeks session, you will feel more confident applying for law schools or jobs in the legal industry."])</script><script>self.__next_f.push([1,"b:[\"$\",\"$L19\",null,{\"project\":{\"id\":\"4699c8e9-2e01-432f-b58c-b0626d895f1d\",\"title\":\"Inside the Legal Mind: Build Your First Case Analysis and Legal Memo\",\"slug\":\"law-101-primer-to-practicing-law-analytical-thinking-and-legal-writing-1-1-1\",\"summary\":{\"type\":\"doc\",\"content\":[{\"type\":\"paragraph\",\"content\":[{\"text\":\"Learn how lawyers think by breaking down judicial opinions, interpreting the law, and using your analysis to craft a clear, well‑structured memo that demonstrates your ability to advocate effectively. \",\"type\":\"text\"}]}]},\"description\":{\"type\":\"doc\",\"content\":[{\"type\":\"paragraph\",\"content\":[{\"text\":\"$1a\",\"type\":\"text\"}]}]},\"project_area\":[\"Law\"],\"level\":\"Beginner\",\"levelDescription\":\"No prior experience required\",\"prerequisites\":{\"type\":\"doc\",\"content\":[{\"type\":\"paragraph\",\"content\":[{\"text\":\"For you to be successful in this project, you will need:  Interest in the legal industry and the willingness to learn about the skills and techniques needed to work in the industry.\",\"type\":\"text\"}]},{\"type\":\"paragraph\",\"content\":[{\"text\":\"Past experience in reading and interpreting complex written work, and the ability to point out the relevant issues.\",\"type\":\"text\"}]},{\"type\":\"paragraph\",\"content\":[{\"text\":\"Some exposure to conducting research, including how to utilize key words.\",\"type\":\"text\"}]},{\"type\":\"paragraph\",\"content\":[{\"text\":\"Oral and written communication skills, being able to articulate your thoughts.\",\"type\":\"text\"}]},{\"type\":\"paragraph\",\"content\":[{\"text\":\"Desire to communicate with others, to share your thoughts, discuss, and debate.\",\"type\":\"text\"}]}]},\"goals\":{\"type\":\"doc\",\"content\":[{\"type\":\"paragraph\",\"content\":[{\"text\":\"By the end of the project, you will be able to:   Understand what it is like to be a law student and the daily work of an attorney working in different areas of the legal industry.\",\"type\":\"text\"}]},{\"type\":\"paragraph\",\"content\":[{\"text\":\"Analyze case law and interpret the Court’s decisions and underlying reasonings.\",\"type\":\"text\"}]},{\"type\":\"paragraph\",\"content\":[{\"text\":\"Prepare a legal brief/memo by applying your legal analysis to the factual matters at hand.\",\"type\":\"text\"}]},{\"type\":\"paragraph\",\"content\":[{\"text\":\"Advocate for your client based on your legal research and analysis.\",\"type\":\"text\"}]}]},\"schedule\":\"Thursdays, 7:00 P.M. ET / 4:00 P.M. PT\",\"status\":\"applications_open\",\"duration\":\"8 weeks, 2-3 hours per week\",\"workshops\":{\"sessions\":[{\"name\":\"Demystifying Law School Success and Practicing Law\",\"order\":1,\"description\":{\"type\":\"doc\",\"content\":[{\"type\":\"paragraph\",\"content\":[{\"text\":\"Entering the legal industry whether it being applying for law schools or finding a job in the legal market is somewhat intimidating. Let’s discuss your interests. What brought you to this project? Is there a specific area of law you would like to practice in? Did you know that you don’t need to be barred (licensed attorney) or need a law degree to work in the legal industry?\",\"type\":\"text\"}]}]}},{\"name\":\"The Roles of Three Branches in the United States\",\"order\":2,\"description\":{\"type\":\"doc\",\"content\":[{\"type\":\"paragraph\",\"content\":[{\"text\":\"Understanding case law is one of the most basic and important skills your need to be in the legal industry. But before we get there, you would be surprised to know how the structure of the government system affects the reasoning behind the judge’s decisions. We will also cover the underlying concepts of the foundational legal subjects.\",\"type\":\"text\"}]}]}},{\"name\":\"Interpreting Case Law and the Black Letter Law\",\"order\":3,\"description\":{\"type\":\"doc\",\"content\":[{\"type\":\"paragraph\",\"content\":[{\"text\":\"This workshop will focus on interpreting the legal decisions made by reading through decisions. Interpreting case law, which incorporates review of the black letter law, its legislative history, and analysis of other cases is very important in conducting your own legal analysis. You will learn how to read the cases.\",\"type\":\"text\"}]}]}},{\"name\":\"The Basics of Legal Writing I: Basic Structure and Type\",\"order\":4,\"description\":{\"type\":\"doc\",\"content\":[{\"type\":\"paragraph\",\"content\":[{\"text\":\"Legal writing is different from other writings. It requires you to utilize the skills you have already acquired in writing essays or any other papers, but in a different structure and tone. There are different types of legal writing. Who is your audience? How should your final written work look like in different situations?\",\"type\":\"text\"}]}]}},{\"name\":\"The Basics of Legal Writing II: Facts\",\"order\":5,\"description\":{\"type\":\"doc\",\"content\":[{\"type\":\"paragraph\",\"content\":[{\"text\":\"Read the materials provided, which may be in the form of contracts, emails, etc., and interview your client (and possibly depose a witness) to understand the facts of the case. What happened, what was the relationship between the client and the potential defendant, and what is your client asking for?\",\"type\":\"text\"}]}]}},{\"name\":\"The Basics of Legal Writing III: Analysis \u0026 Application\",\"order\":6,\"description\":{\"type\":\"doc\",\"content\":[{\"type\":\"paragraph\",\"content\":[{\"text\":\"For our project, we will focus on preparing a legal memorandum for a hypothetical Partner Attorney in a law office. This is the time to utilize the skills you acquired during Workshop 3 to 5. You will be given several cases that you will utilize for your final memo and analyze the issue at hand. What position are you trying to argue, and how would you incorporate the facts you found with the case law you analyzed?\",\"type\":\"text\"}]}]}},{\"name\":\"Time to Advocate for Your Client!\",\"order\":7,\"description\":{\"type\":\"doc\",\"content\":[{\"type\":\"paragraph\",\"content\":[{\"text\":\"Now that you have fully drafted your legal memo, it is time to argue in front of the Court. This session is prepared so that you can gain the confidence of being able to speak in front of an audience, on a legal matter that you have spent time and effort to analyze.\",\"type\":\"text\"}]}]}},{\"name\":\"Conversation with Attorneys \u0026 Closing Thoughts\",\"order\":8,\"description\":{\"type\":\"doc\",\"content\":[{\"type\":\"paragraph\",\"content\":[{\"text\":\"Now that you have fully drafted your legal memo, it is time to argue in front of the Court. This session is prepared so that you can gain the confidence of being able to speak in front of an audience, on a legal matter that you have spent time and effort to analyze.\",\"type\":\"text\"}]}]}}]},\"fellows\":[{\"id\":\"4306f728-0c81-4b3c-b7df-2150089640cd\",\"name\":\"Joo Hee Park\",\"role\":\"Law Fellow\",\"organization\":\"Open Avenues Foundation\",\"organizationLogoUrl\":\"/images/organizations/oaf-logo.png\",\"photoUrl\":\"https://avgkrhojcamcagufngrr.supabase.co/storage/v1/object/public/fellow-headshots/4306f728-0c81-4b3c-b7df-2150089640cd.webp\",\"bio\":\"Joo Hee is a Law Fellow at Open Avenues Foundation, where she works with students leading projects in legal writing and introduction law classes.\\n\\nJoo Hee is an associate attorney at ASK LLP, where she focuses on representing clients involved in bankruptcy cases.\\n\\nJoo Hee has a year of experience in the legal field. During law school, she represented clients as a certified student attorney and externed for a Bankruptcy Court judge.\\n\\nShe holds a JD and is licensed to practice in the State of New York and Minnesota.\",\"linkedinUrl\":\"https://www.linkedin.com/in/jooheepark1211/\"}],\"categories\":[\"Law\",\"Legal Writing\"],\"applicationTimeline\":[{\"label\":\"Applications open\",\"value\":\"August 3, 2026\"},{\"label\":\"Applications deadline\",\"value\":\"September 3, 2026\"},{\"label\":\"Application results released\",\"value\":\"Week of September 14, 2026\"},{\"label\":\"Project start date\",\"value\":\"Week of September 28, 2026\"},{\"label\":\"Project end date\",\"value\":\"Week of November 16, 2026\"}],\"cycle_id\":\"6e8885e5-3870-4327-a19c-d88c867fa48f\"},\"error\":\"$undefined\"}]\n"])</script></body></html>
