S\",\"1194\",\"static/chunks/22747d63-b78dbc5d907b1f14.js?dpl=dpl_A9QRwtuL4hrMD2RZGqb9eW7AtxES\",\"277\",\"static/chunks/54a60aa6-294bb7e111b509a4.js?dpl=dpl_A9QRwtuL4hrMD2RZGqb9eW7AtxES\",\"4420\",\"static/chunks/4420-baa8329e5076733c.js?dpl=dpl_A9QRwtuL4hrMD2RZGqb9eW7AtxES\",\"2169\",\"static/chunks/2169-1d13735e35f16c75.js?dpl=dpl_A9QRwtuL4hrMD2RZGqb9eW7AtxES\",\"419\",\"static/chunks/419-9f9e6d455ee0ae85.js?dpl=dpl_A9QRwtuL4hrMD2RZGqb9eW7AtxES\",\"5288\",\"static/chunks/5288-5d7819e0848b1b1a.js?dpl=dpl_A9QRwtuL4hrMD2RZGqb9eW7AtxES\",\"6874\",\"static/chunks/6874-67c719d6db2b17af.js?dpl=dpl_A9QRwtuL4hrMD2RZGqb9eW7AtxES\",\"6766\",\"static/chunks/6766-7fcc7eadc8fee52b.js?dpl=dpl_A9QRwtuL4hrMD2RZGqb9eW7AtxES\",\"9435\",\"static/chunks/9435-28f947009b0f7d38.js?dpl=dpl_A9QRwtuL4hrMD2RZGqb9eW7AtxES\",\"2206\",\"static/chunks/2206-42291f248e6bf19d.js?dpl=dpl_A9QRwtuL4hrMD2RZGqb9eW7AtxES\",\"5782\",\"static/chunks/5782-04eaa6c475f5c3f2.js?dpl=dpl_A9QRwtuL4hrMD2RZGqb9eW7AtxES\",\"8419\",\"static/chunks/app/projects/%5Bslug%5D/page-7f8129194c3557a1.js?dpl=dpl_A9QRwtuL4hrMD2RZGqb9eW7AtxES\"],\"default\"]\n"])</script><script>self.__next_f.push([1,"b:[\"$\",\"$L19\",null,{\"project\":{\"id\":\"acffdae7-abb1-459d-afd6-047e53bf8ab7\",\"title\":\"Mechanical Engineering in the Pharmaceutical Industry: Filling Station for Liquid Drug Substances\",\"slug\":\"mechanical-engineering-in-the-pharmaceutical-industry-filling-station-for-liquid-drug-substances-1-1\",\"summary\":{\"type\":\"doc\",\"content\":[{\"type\":\"paragraph\",\"content\":[{\"text\":\"Utilize Mechanical Engineering principles to conceptualize, design and conduct failure analysis on a filling station for liquid drug substances.\",\"type\":\"text\"}]}]},\"description\":{\"type\":\"doc\",\"content\":[{\"type\":\"paragraph\",\"content\":[{\"text\":\"In the biopharmaceutical industry, ensuring precise and sterile filling processes is crucial, making it a central task for many entry-level roles. In this Build Project, you'll take on the role of a Mechanical Engineer, where you'll conceptualize, design, and conduct failure analysis for a cutting-edge mechanical filling station. Under the guidance of a seasoned industry expert, you'll tackle real-world challenges related to fluid dynamics, precision engineering, and regulatory compliance. You'll gain hands-on experience with industry-standard tools and methodologies such as Failure Mode and Effects Analysis (FMEA), all within a simulated biopharma team environment that mirrors industry operations.\",\"type\":\"text\"}]}]},\"project_area\":[\"Engineering\"],\"level\":\"Beginner\",\"levelDescription\":\"No prior experience required\",\"prerequisites\":{\"type\":\"doc\",\"content\":[{\"type\":\"paragraph\",\"content\":[{\"text\":\"Basic understanding of mechanical engineering and design principles: You should be able to conceptualize and detail mechanical systems, including knowledge of component selection and system integration. Familiarity with concepts covered in classes like Introduction to Mechanical Engineering or Mechanical Design is expected.\",\"type\":\"text\"}]},{\"type\":\"paragraph\",\"content\":[{\"text\":\"Experience with mechanical engineering based failure analysis techniques: You should be comfortable performing Failure Mode and Effects Analysis (FMEA), identifying potential failure points in mechanical systems, and suggesting improvements. Knowledge from classes such as Engineering Risk Analysis or Reliability Engineering will be beneficial.\",\"type\":\"text\"}]},{\"type\":\"paragraph\",\"content\":[{\"text\":\"Familiarity with CAD or mechanical engineering design. You may use any tool to prepare your design, but you should have some familiarity with mechanical design concepts.\",\"type\":\"text\"}]},{\"type\":\"paragraph\",\"content\":[{\"text\":\"Strong technical writing and presentation skills: You should be able to clearly document your design process, analysis, and recommendations in a comprehensive report. Additionally, you should be able to effectively present your findings and engage with a professional audience, skills typically covered in Technical Communication or Presentation Skills courses.\",\"type\":\"text\"}]},{\"type\":\"paragraph\",\"content\":[{\"text\":\"Problem-solving and critical thinking abilities: You should be able to approach complex design challenges analytically, think creatively about solutions, and troubleshoot issues that arise during the project. This involves skills often developed in Mechanical Engineering, Engineering Problem-Solving or Applied Mechanics courses.\",\"type\":\"text\"}]}]},\"goals\":{\"type\":\"doc\",\"content\":[{\"type\":\"paragraph\",\"content\":[{\"text\":\"Understand how mechanical engineering and design intersects with regulatory and quality control standards specific to the pharmaceutical industry.\",\"type\":\"text\"}]},{\"type\":\"paragraph\",\"content\":[{\"text\":\"Leverage principles of mechanical engineering to perform failure analysis and risk assessments.\",\"type\":\"text\"}]},{\"type\":\"paragraph\",\"content\":[{\"text\":\"Explore sterile systems and aseptic design.\",\"type\":\"text\"}]}]},\"schedule\":\"Wednesdays, 4:00 P.M. ET / 1:00 P.M. PT\",\"status\":\"archived\",\"duration\":\"8 weeks, 2-3 hours per week\",\"workshops\":{\"sessions\":[{\"name\":\"Introduction\",\"order\":1,\"description\":{\"type\":\"doc\",\"content\":[{\"type\":\"paragraph\",\"content\":[{\"text\":\"Getting to know each other. A basic introduction to mechanical engineering and how it is useful in the pharmaceutical industry.\",\"type\":\"text\"}]}]}},{\"name\":\"Concept Development\",\"order\":2,\"description\":{\"type\":\"doc\",\"content\":[{\"type\":\"paragraph\",\"content\":[{\"text\":\"Introduction to pharmaceutical regulations (FDA vs USDA vs EMEA), equipment I/OQ (Installation/Operational Qualification) and cGMP (current good manufacturing practices). An overview of how drug substance (DS) is manufactured at Akston.\",\"type\":\"text\"}]}]}},{\"name\":\"Design and Component Selection\",\"order\":3,\"description\":{\"type\":\"doc\",\"content\":[{\"type\":\"paragraph\",\"content\":[{\"text\":\"Understanding the role of a filling station in converting a DS into a DP (Drug Product). Learning sketching and design fundamentals.\",\"type\":\"text\"}]}]}},{\"name\":\"Failure Mode and Effects Analysis (FMEA)\",\"order\":4,\"description\":{\"type\":\"doc\",\"content\":[{\"type\":\"paragraph\",\"content\":[{\"text\":\"Introduction to FMEA and risk assessment tools used in the industry. Introduction to lean manufacturing ideologies.\",\"type\":\"text\"}]}]}},{\"name\":\"Presentation I: Preliminary design and peer review\",\"order\":5,\"description\":{\"type\":\"doc\",\"content\":[{\"type\":\"paragraph\",\"content\":[{\"text\":\"Students will present their projects in front of their peers. Students will implement the FMEA concepts from earlier to review their peers’ projects and suggest improvements.\",\"type\":\"text\"}]}]}},{\"name\":\"Presentation II: Final presentation\",\"order\":6,\"description\":{\"type\":\"doc\",\"content\":[{\"type\":\"paragraph\",\"content\":[{\"text\":\"Students will implement the suggestions and make a final presentation.\",\"type\":\"text\"}]}]}},{\"name\":\"Final report development\",\"order\":7,\"description\":{\"type\":\"doc\",\"content\":[{\"type\":\"paragraph\",\"content\":[{\"text\":\"Preparing mock documentation (brochure/manual) for your report.\",\"type\":\"text\"}]}]}},{\"name\":\"Career exploration\",\"order\":8,\"description\":{\"type\":\"doc\",\"content\":[{\"type\":\"paragraph\",\"content\":[{\"text\":\"Explore various career pathways for mechanical engineers. Tips on developing a profile to get the attention of an employer. Simulated job interviews, etc.\",\"type\":\"text\"}]}]}}]},\"fellows\":[{\"id\":\"32904bba-0b68-4980-9cc9-687bf177adf7\",\"name\":\"Krishna Hemanth\",\"role\":\"Mechanical Engineering Fellow\",\"organization\":\"DREAM Venture Labs\",\"organizationLogoUrl\":\"/images/organizations/dv-logo.png\",\"photoUrl\":\"https://avgkrhojcamcagufngrr.supabase.co/storage/v1/object/public/fellow-headshots/32904bba-0b68-4980-9cc9-687bf177adf7.webp\",\"bio\":\"Krishna Hemanth is a Mechanical Engineering Build Fellow at Dream Venture Labs, where he works with students leading projects in pharmaceutical drug substance manufacture.\\n\\nKrishna is a Manufacturing Compliance Engineer at Akston Bioscience Corporation, where he focuses on failure analysis, risk assessments and quality management of veterinary drug substances, associated processes and assemblies.\\n\\nKrishna has over four years of experience in pharmaceutical manufacturing, having previously worked with the manufacture of multiple Fc-fusion protein-based human/veterinary drug substances.\\n\\nHe holds a Masters degree in Mechanical Engineering with a concentration in Material Science and a Bachelors in Chemical Engineering.\\n\\nA fun fact about Krishna is that he is very good at soccer/sports trivia.\",\"linkedinUrl\":\"https://www.linkedin.com/in/krishna-hemanth\"}],\"categories\":[\"Pharmaceuticals\",\"Failure Mode and Effects Analysis (FMEA)\",\"Risk Assessment\",\"Quality Management\"],\"applicationTimeline\":[{\"label\":\"Applications open\",\"value\":\"January 12, 2026\"},{\"label\":\"Applications deadline\",\"value\":\"February 5, 2026\"},{\"label\":\"Application results released\",\"value\":\"Week of February 16, 2026\"},{\"label\":\"Project start date\",\"value\":\"Week of March 2, 2026\"},{\"label\":\"Project end date\",\"value\":\"Week of April 20, 2026\"}],\"cycle_id\":\"ad606eee-63b5-4cb0-a043-f9303d6531d2\"},\"error\":\"$undefined\"}]\n"])</script></body></html>
