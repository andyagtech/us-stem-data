9QRwtuL4hrMD2RZGqb9eW7AtxES\",\"4420\",\"static/chunks/4420-baa8329e5076733c.js?dpl=dpl_A9QRwtuL4hrMD2RZGqb9eW7AtxES\",\"2169\",\"static/chunks/2169-1d13735e35f16c75.js?dpl=dpl_A9QRwtuL4hrMD2RZGqb9eW7AtxES\",\"419\",\"static/chunks/419-9f9e6d455ee0ae85.js?dpl=dpl_A9QRwtuL4hrMD2RZGqb9eW7AtxES\",\"5288\",\"static/chunks/5288-5d7819e0848b1b1a.js?dpl=dpl_A9QRwtuL4hrMD2RZGqb9eW7AtxES\",\"6874\",\"static/chunks/6874-67c719d6db2b17af.js?dpl=dpl_A9QRwtuL4hrMD2RZGqb9eW7AtxES\",\"6766\",\"static/chunks/6766-7fcc7eadc8fee52b.js?dpl=dpl_A9QRwtuL4hrMD2RZGqb9eW7AtxES\",\"9435\",\"static/chunks/9435-28f947009b0f7d38.js?dpl=dpl_A9QRwtuL4hrMD2RZGqb9eW7AtxES\",\"2206\",\"static/chunks/2206-42291f248e6bf19d.js?dpl=dpl_A9QRwtuL4hrMD2RZGqb9eW7AtxES\",\"5782\",\"static/chunks/5782-04eaa6c475f5c3f2.js?dpl=dpl_A9QRwtuL4hrMD2RZGqb9eW7AtxES\",\"8419\",\"static/chunks/app/projects/%5Bslug%5D/page-7f8129194c3557a1.js?dpl=dpl_A9QRwtuL4hrMD2RZGqb9eW7AtxES\"],\"default\"]\n"])</script><script>self.__next_f.push([1,"b:[\"$\",\"$L19\",null,{\"project\":{\"id\":\"3b5f5ae0-5163-4927-bb03-7a9e9b1fd18c\",\"title\":\"Practical Model Validation for Financial Risk\",\"slug\":\"practical-model-validation-for-financial-risk-1\",\"summary\":{\"type\":\"doc\",\"content\":[{\"type\":\"paragraph\",\"content\":[{\"text\":\"Learn and apply model validation concepts grounded in regulatory principles by building, testing, and presenting a credit scoring model using Python.\",\"type\":\"text\"}]}]},\"description\":{\"type\":\"doc\",\"content\":[{\"type\":\"paragraph\",\"content\":[{\"text\":\"Model validation is a critical function in the financial services industry, ensuring that the tools used for lending, risk assessment, and capital planning are accurate. In this Build Project, you will wear the hat of a model risk analyst to develop and validate a credit scoring model using real-world data and regulatory practices. Under the guidance of an industry expert, you will explore model performance, transparency, and fairness, while producing documentation that aligns with professional risk management standards. This hands-on experience will help you build skills in Python, data analysis, and regulatory compliance. Those are skills highly valued in today’s entry-level roles across fintech, banking, and data science teams such as data analyst, credit risk associate, and compliance analyst.\",\"type\":\"text\"}]}]},\"project_area\":[\"Data Science\",\"Finance\"],\"level\":\"Expert\",\"levelDescription\":\"Advanced experience required\",\"prerequisites\":{\"type\":\"doc\",\"content\":[{\"type\":\"paragraph\",\"content\":[{\"text\":\"Basic knowledge of Python (e.g., pandas, loops, conditions, matplotlib)\",\"type\":\"text\"}]},{\"type\":\"paragraph\",\"content\":[{\"text\":\"Some experience with Jupyter Notebooks and exposure to data visualization techniques (bar graphs, scatter plots, etc.)\",\"type\":\"text\"}]},{\"type\":\"paragraph\",\"content\":[{\"text\":\"Introductory understanding of predictive models (e.g., logistic regression)\",\"type\":\"text\"}]},{\"type\":\"paragraph\",\"content\":[{\"text\":\"Interest in the finance industry, financial data, and regulatory challenges\",\"type\":\"text\"}]},{\"type\":\"paragraph\",\"content\":[{\"text\":\"Motivation to critically analyze financial models and apply validation techniques\",\"type\":\"text\"}]}]},\"goals\":{\"type\":\"doc\",\"content\":[{\"type\":\"paragraph\",\"content\":[{\"text\":\"Explain the core components of model risk management, including conceptual soundness, outcomes analysis, and ongoing monitoring as defined in SR 11-7 Guidance on Model Risk Management\",\"type\":\"text\"}]},{\"type\":\"paragraph\",\"content\":[{\"text\":\"Build a simple credit scoring model using Python\",\"type\":\"text\"}]},{\"type\":\"paragraph\",\"content\":[{\"text\":\"Evaluate models performance\",\"type\":\"text\"}]},{\"type\":\"paragraph\",\"content\":[{\"text\":\"Assess model transparency and interpretability using packages such as PiML and SHAP\",\"type\":\"text\"}]},{\"type\":\"paragraph\",\"content\":[{\"text\":\"Test models under stress and identify bias or misuses\",\"type\":\"text\"}]}]},\"schedule\":\"Thursdays, 5:00 P.M. ET / 2:00 P.M. PT\",\"status\":\"archived\",\"duration\":\"8 weeks, 2-3 hours per week\",\"workshops\":{\"sessions\":[{\"name\":\"Introduction to Model Risk and Setup\",\"order\":1,\"description\":{\"type\":\"doc\",\"content\":[{\"type\":\"paragraph\",\"content\":[{\"text\":\"Learn what model risk is, why validation is critical, and how SR 11-7 frames the process. Ask questions about the project requirements, and define the project scope.\",\"type\":\"text\"}]}]}},{\"name\":\"Designing a Conceptually Sound Model\",\"order\":2,\"description\":{\"type\":\"doc\",\"content\":[{\"type\":\"paragraph\",\"content\":[{\"text\":\"Perform exploratory data analysis, clean inputs, and justify feature selection and model choice.\",\"type\":\"text\"}]}]}},{\"name\":\"Model Training and Performance Testing\",\"order\":3,\"description\":{\"type\":\"doc\",\"content\":[{\"type\":\"paragraph\",\"content\":[{\"text\":\"Train the first model(s) and evaluate in-sample performance. Visualize results (ROC curve, confusion matrix) and interpret metrics to assess predictive power\",\"type\":\"text\"}]}]}},{\"name\":\"Model Validation and Overfitting Analysis\",\"order\":4,\"description\":{\"type\":\"doc\",\"content\":[{\"type\":\"paragraph\",\"content\":[{\"text\":\"Validate the model on holdout data, compare in-sample vs out-of-sample results, and discuss robustness, back-testing, and overfitting\",\"type\":\"text\"}]}]}},{\"name\":\"Stress Testing and Sensitivity Checks\",\"order\":5,\"description\":{\"type\":\"doc\",\"content\":[{\"type\":\"paragraph\",\"content\":[{\"text\":\"Apply stress scenarios and sensitivity analyses to evaluate model stability under alternative inputs\",\"type\":\"text\"}]}]}},{\"name\":\"Model Interpretability with SHAP/PiML\",\"order\":6,\"description\":{\"type\":\"doc\",\"content\":[{\"type\":\"paragraph\",\"content\":[{\"text\":\"Use SHAP or PiML to explain predictions, analyze feature importance, and connect interpretability insights to regulatory expectations\",\"type\":\"text\"}]}]}},{\"name\":\"Bias and Fairness Testing\",\"order\":7,\"description\":{\"type\":\"doc\",\"content\":[{\"type\":\"paragraph\",\"content\":[{\"text\":\"Evaluate fairness across demographic groups using standard metrics. Document limitations, recommend controls\",\"type\":\"text\"}]}]}},{\"name\":\"Final Validation Report and Presentation\",\"order\":8,\"description\":{\"type\":\"doc\",\"content\":[{\"type\":\"paragraph\",\"content\":[{\"text\":\"Compile a polished Jupyter notebooks as a validation report, and deliver a PowerPoint presentation summarizing findings, risks, and recommendations\",\"type\":\"text\"}]}]}}]},\"fellows\":[{\"id\":\"cc4f75c6-7e3b-44e7-883d-9d0e11738b07\",\"name\":\"Nam Nguyen\",\"role\":\"Finance Fellow\",\"organization\":\"DREAM Venture Labs\",\"organizationLogoUrl\":\"/images/organizations/dv-logo.png\",\"photoUrl\":\"https://avgkrhojcamcagufngrr.supabase.co/storage/v1/object/public/fellow-headshots/cc4f75c6-7e3b-44e7-883d-9d0e11738b07.webp\",\"bio\":\"Nam Nguyen is a Finance Fellow at Dream Venture Labs, where he works with students leading projects in Finance and Model Risk Management. \\n\\nNam is a Model Risk Management Analyst at Wintrust Financial Corporation, focusing on independent validation of high-profile models across capital stress testing (CST), CECL, and customer due diligence/BSA-AML. His work includes building challenger models, designing performance and back-testing frameworks, authoring validation reports, and improving efficiency by automating reproducible reporting.\\n\\nHe holds a Ph.D. in Economics from the University of Wisconsin–Milwaukee and has over two years of experience in quantitative finance and model risk.\\n\\nNam is currently focused on improving validation tooling, automation of the model validation lifecycle, and robust governance for both traditional and AI/ML models.\",\"linkedinUrl\":\"https://www.linkedin.com/in/namnguyen7\"}],\"categories\":[\"Model Risk Management\",\"Python\",\"Regulatory Compliance\",\"Credit Scoring\"],\"applicationTimeline\":[{\"label\":\"Applications open\",\"value\":\"April 13, 2026\"},{\"label\":\"Applications deadline\",\"value\":\"May 20, 2026\"},{\"label\":\"Application results released\",\"value\":\"Week of May 26, 2026\"},{\"label\":\"Project start date\",\"value\":\"Week of June 8, 2026\"},{\"label\":\"Project end date\",\"value\":\"Week of July 27, 2026\"}],\"cycle_id\":\"ae26a648-44bc-4fab-bbb0-7f9c0f6b18d9\"},\"error\":\"$undefined\"}]\n"])</script></body></html>
