/54a60aa6-294bb7e111b509a4.js?dpl=dpl_A9QRwtuL4hrMD2RZGqb9eW7AtxES\",\"4420\",\"static/chunks/4420-baa8329e5076733c.js?dpl=dpl_A9QRwtuL4hrMD2RZGqb9eW7AtxES\",\"2169\",\"static/chunks/2169-1d13735e35f16c75.js?dpl=dpl_A9QRwtuL4hrMD2RZGqb9eW7AtxES\",\"419\",\"static/chunks/419-9f9e6d455ee0ae85.js?dpl=dpl_A9QRwtuL4hrMD2RZGqb9eW7AtxES\",\"5288\",\"static/chunks/5288-5d7819e0848b1b1a.js?dpl=dpl_A9QRwtuL4hrMD2RZGqb9eW7AtxES\",\"6874\",\"static/chunks/6874-67c719d6db2b17af.js?dpl=dpl_A9QRwtuL4hrMD2RZGqb9eW7AtxES\",\"6766\",\"static/chunks/6766-7fcc7eadc8fee52b.js?dpl=dpl_A9QRwtuL4hrMD2RZGqb9eW7AtxES\",\"9435\",\"static/chunks/9435-28f947009b0f7d38.js?dpl=dpl_A9QRwtuL4hrMD2RZGqb9eW7AtxES\",\"2206\",\"static/chunks/2206-42291f248e6bf19d.js?dpl=dpl_A9QRwtuL4hrMD2RZGqb9eW7AtxES\",\"5782\",\"static/chunks/5782-04eaa6c475f5c3f2.js?dpl=dpl_A9QRwtuL4hrMD2RZGqb9eW7AtxES\",\"8419\",\"static/chunks/app/projects/%5Bslug%5D/page-7f8129194c3557a1.js?dpl=dpl_A9QRwtuL4hrMD2RZGqb9eW7AtxES\"],\"default\"]\n"])</script><script>self.__next_f.push([1,"b:[\"$\",\"$L19\",null,{\"project\":{\"id\":\"bb32e7bf-0b84-4566-8b04-4816a0bba652\",\"title\":\"Bluebeam Revu: Facade Estimation in Construction Projects\",\"slug\":\"bluebeam-revu-facade-estimation-in-construction-projects-1-1\",\"summary\":{\"type\":\"doc\",\"content\":[{\"type\":\"paragraph\",\"content\":[{\"text\":\"Design a worksheet to estimate the cost of materials, labor, and equipment for building exterior envelopes using real-life projects.\",\"type\":\"text\"}]}]},\"description\":{\"type\":\"doc\",\"content\":[{\"type\":\"paragraph\",\"content\":[{\"text\":\"Accurate cost estimating for building exterior envelopes is a core responsibility in construction and preconstruction teams and is a common task assigned to entry-level estimators, project engineers, and preconstruction analysts across the industry. In this Build Project, you’ll step into the role of a Construction Estimator and develop a detailed facade cost estimating worksheet by performing digital quantity takeoffs and organizing material, labor, and equipment costs using real construction documents. Under the guidance of an experienced industry professional, students will actively measure drawings, apply unit pricing, and document estimating assumptions rather than passive learning concepts. Students will become comfortable using industry-standard tools and workflows such as Bluebeam Revu, quantity takeoff methods, and preconstruction cost analysis, all within a learning environment that mirrors the daily operations of a real construction preconstruction and estimating team.\",\"type\":\"text\"}]}]},\"project_area\":[\"Engineering\"],\"level\":\"Intermediate\",\"levelDescription\":\"Some experience recommended\",\"prerequisites\":{\"type\":\"doc\",\"content\":[{\"type\":\"paragraph\",\"content\":[{\"text\":\"Comfort reading construction drawings: You should be able to look at architectural drawings and understand basic things like exterior walls, dimensions, scales, and notes.\",\"type\":\"text\"}]},{\"type\":\"paragraph\",\"content\":[{\"text\":\"Basic spreadsheet skills (Excel or Google Sheets): You should feel comfortable creating tables, typing numbers, using simple formulas (like adding and multiplying), and organizing information in a spreadsheet. No advanced Excel skills are needed.\",\"type\":\"text\"}]},{\"type\":\"paragraph\",\"content\":[{\"text\":\"Willingness to pay attention to details: Estimating is all about accuracy. You don’t need to be perfect, but you should be willing to slow down, double-check your quantities, and fix small mistakes when you find them.\",\"type\":\"text\"}]}]},\"goals\":{\"type\":\"doc\",\"content\":[{\"type\":\"paragraph\",\"content\":[{\"text\":\"Perform digital quantity takeoffs using Bluebeam Revu\",\"type\":\"text\"}]},{\"type\":\"paragraph\",\"content\":[{\"text\":\"Develop structured cost estimates for exterior envelope systems\",\"type\":\"text\"}]},{\"type\":\"paragraph\",\"content\":[{\"text\":\"Apply real-world unit pricing and productivity rates\",\"type\":\"text\"}]},{\"type\":\"paragraph\",\"content\":[{\"text\":\"Analyze preconstruction cost impacts of design decisions\",\"type\":\"text\"}]},{\"type\":\"paragraph\",\"content\":[{\"text\":\"Communicate estimating assumptions and results clearly\",\"type\":\"text\"}]}]},\"schedule\":\"Tuesdays, 4:00 P.M. ET / 1:00 P.M. PT\",\"status\":\"applications_open\",\"duration\":\"8 weeks, 2-3 hours per week\",\"workshops\":{\"sessions\":[{\"name\":\"Introduction to Facade Estimating \u0026 Bluebeam Revu\",\"order\":1,\"description\":{\"type\":\"doc\",\"content\":[{\"type\":\"paragraph\",\"content\":[{\"text\":\"You’ll be introduced to the role of a construction estimator and why facade estimating is a critical part of preconstruction. We’ll walk through the basics of exterior envelope systems and get familiar with the Bluebeam Revu interface, so you feel comfortable navigating drawings digitally.\",\"type\":\"text\"}]}]}},{\"name\":\"Understanding Facade Systems from Drawings\",\"order\":2,\"description\":{\"type\":\"doc\",\"content\":[{\"type\":\"paragraph\",\"content\":[{\"text\":\"You’ll learn how to identify common facade components—such as curtain walls, cladding, glazing, and insulation—directly from architectural drawings. By the end of this session, you’ll be able to recognize what needs to be measured and estimated for exterior building systems.\",\"type\":\"text\"}]}]}},{\"name\":\"Setting Up Digital Quantity Takeoffs in Bluebeam\",\"order\":3,\"description\":{\"type\":\"doc\",\"content\":[{\"type\":\"paragraph\",\"content\":[{\"text\":\"You’ll start using Bluebeam Revu’s measurement tools to perform quantity takeoffs for facade areas, lengths, and counts. This workshop focuses on accuracy, scale setup, and organizing your measurements so they’re easy to use later in your estimate.\",\"type\":\"text\"}]}]}},{\"name\":\"Organizing Takeoff Data into an Estimating Worksheet\",\"order\":4,\"description\":{\"type\":\"doc\",\"content\":[{\"type\":\"paragraph\",\"content\":[{\"text\":\"You’ll transfer your Bluebeam takeoff quantities into a simple estimating worksheet using Excel or Google Sheets. This session focuses on organizing data clearly and building a structure that separates materials, labor, and equipment costs.\",\"type\":\"text\"}]}]}},{\"name\":\"Applying Unit Costs and Labor Assumptions\",\"order\":5,\"description\":{\"type\":\"doc\",\"content\":[{\"type\":\"paragraph\",\"content\":[{\"text\":\"You’ll learn how unit prices and labor assumptions are applied to your quantities to calculate total costs. We’ll discuss where costs come from, how assumptions are made, and how estimators document their decisions clearly and professionally.\",\"type\":\"text\"}]}]}},{\"name\":\"Reviewing, Checking, and Refining Your Estimate\",\"order\":6,\"description\":{\"type\":\"doc\",\"content\":[{\"type\":\"paragraph\",\"content\":[{\"text\":\"You’ll review your estimate for accuracy by checking quantities, formulas, and assumptions. This workshop mirrors how real preconstruction teams review estimates and helps you improve confidence in your numbers.\",\"type\":\"text\"}]}]}},{\"name\":\"Preparing Your Final Facade Estimate\",\"order\":7,\"description\":{\"type\":\"doc\",\"content\":[{\"type\":\"paragraph\",\"content\":[{\"text\":\"You’ll finalize your estimating worksheet and organize supporting visuals, such as Bluebeam screenshots and simple charts. The focus is on making your work easy to understand and ready to share in a professional setting.\",\"type\":\"text\"}]}]}},{\"name\":\"Presenting Your Estimate Like a Job Interview\",\"order\":8,\"description\":{\"type\":\"doc\",\"content\":[{\"type\":\"paragraph\",\"content\":[{\"text\":\"You’ll present your facade estimate through a short slide deck and a casual, interview-style walkthrough. You’ll practice explaining your approach, assumptions, and results the way you would to a hiring manager or preconstruction lead.\",\"type\":\"text\"}]}]}}]},\"fellows\":[{\"id\":\"71eb50f0-ffff-408a-a936-56a0f75c63a4\",\"name\":\"Antony Barraza\",\"role\":\"Project Management Fellow\",\"organization\":\"Open Avenues Foundation\",\"organizationLogoUrl\":\"/images/organizations/oaf-logo.png\",\"photoUrl\":\"https://avgkrhojcamcagufngrr.supabase.co/storage/v1/object/public/fellow-headshots/71eb50f0-ffff-408a-a936-56a0f75c63a4.webp\",\"bio\":\"Antony Barraza is a Project Management Build Fellow at Open Avenues Foundation, where he works with students leading projects in construction estimation.\\n\\nAntony is a project estimator at W\u0026W Glass, where he focuses on estimating multimillion dollar residential and high-rise commercial glazing projects. Capable to estimate materials, equipment and installation cost, as well as develop cost analyses and budgets, based on the project specifications and schedule.\\n\\nAntony has over 9 years of experience in the construction field. Prior to joining W\u0026W Glass, he worked in Structure Tech NY and ES Windows.\\n\\nHe holds a master’s degree in project management from Metropolitan College of New York.\\n\\nA fun fact about Antony: when the food is really good, he starts doing a little happy dance at the table—it’s his signature move of approval.\",\"linkedinUrl\":\"https://www.linkedin.com/in/adjbarraza/\"}],\"categories\":[\"Cost Estimating\",\"Exterior Envelope Systems\",\"Quantity Takeoff\",\"Preconstruction Analysis\"],\"applicationTimeline\":[{\"label\":\"Applications open\",\"value\":\"August 3, 2026\"},{\"label\":\"Applications deadline\",\"value\":\"September 3, 2026\"},{\"label\":\"Application results released\",\"value\":\"Week of September 14, 2026\"},{\"label\":\"Project start date\",\"value\":\"Week of September 28, 2026\"},{\"label\":\"Project end date\",\"value\":\"Week of November 16, 2026\"}],\"cycle_id\":\"6e8885e5-3870-4327-a19c-d88c867fa48f\"},\"error\":\"$undefined\"}]\n"])</script></body></html>
