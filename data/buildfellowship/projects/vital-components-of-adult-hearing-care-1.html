7AtxES\",\"4420\",\"static/chunks/4420-baa8329e5076733c.js?dpl=dpl_A9QRwtuL4hrMD2RZGqb9eW7AtxES\",\"2169\",\"static/chunks/2169-1d13735e35f16c75.js?dpl=dpl_A9QRwtuL4hrMD2RZGqb9eW7AtxES\",\"419\",\"static/chunks/419-9f9e6d455ee0ae85.js?dpl=dpl_A9QRwtuL4hrMD2RZGqb9eW7AtxES\",\"5288\",\"static/chunks/5288-5d7819e0848b1b1a.js?dpl=dpl_A9QRwtuL4hrMD2RZGqb9eW7AtxES\",\"6874\",\"static/chunks/6874-67c719d6db2b17af.js?dpl=dpl_A9QRwtuL4hrMD2RZGqb9eW7AtxES\",\"6766\",\"static/chunks/6766-7fcc7eadc8fee52b.js?dpl=dpl_A9QRwtuL4hrMD2RZGqb9eW7AtxES\",\"9435\",\"static/chunks/9435-28f947009b0f7d38.js?dpl=dpl_A9QRwtuL4hrMD2RZGqb9eW7AtxES\",\"2206\",\"static/chunks/2206-42291f248e6bf19d.js?dpl=dpl_A9QRwtuL4hrMD2RZGqb9eW7AtxES\",\"5782\",\"static/chunks/5782-04eaa6c475f5c3f2.js?dpl=dpl_A9QRwtuL4hrMD2RZGqb9eW7AtxES\",\"8419\",\"static/chunks/app/projects/%5Bslug%5D/page-7f8129194c3557a1.js?dpl=dpl_A9QRwtuL4hrMD2RZGqb9eW7AtxES\"],\"default\"]\n1a:T46f,Hearing loss is increasingly prevalent among adults, particularly older individuals. Research has highlighted its severe effects, including increased risk of falls, depression, cognitive decline, dementia, and higher rates of hospitalization. Despite these significant impacts, public awareness about the importance of adult hearing care remains low, with fewer than 20% of adults with hearing loss seeking treatment. \n\nIn this project, you will create an awareness overview resource aimed at educating the public on crucial aspects of adult hearing care. Your presentation will cover: the mechanisms and pathways of hearing, the pathologies and impacts of hearing loss, the characteristics and management of tinnitus, options for hearing devices, and strategies for hearing protection. Th"])</script><script>self.__next_f.push([1,"is project will not only immerse you in the field of audiology but also provide you with valuable experience in advocacy and research. Developing the ability to critically review research literature is essential for evidence-based practice. The skills and knowledge gained from this project will be vital for your success in the healthcare field."])</script><script>self.__next_f.push([1,"b:[\"$\",\"$L19\",null,{\"project\":{\"id\":\"6e7be0b2-ecd2-482c-bba7-ca05e6e917f3\",\"title\":\"Vital Components of Adult Hearing Care\",\"slug\":\"vital-components-of-adult-hearing-care-1\",\"summary\":{\"type\":\"doc\",\"content\":[{\"type\":\"paragraph\",\"content\":[{\"text\":\"Explore hearing loss mechanisms and use cutting-edge research to educate adults on its impact, treatment options, tinnitus management, and hearing protection.\",\"type\":\"text\"}]}]},\"description\":{\"type\":\"doc\",\"content\":[{\"type\":\"paragraph\",\"content\":[{\"text\":\"$1a\",\"type\":\"text\"}]}]},\"project_area\":[\"Biology \u0026 Healthcare\"],\"level\":\"Beginner\",\"levelDescription\":\"No prior experience required\",\"prerequisites\":{\"type\":\"doc\",\"content\":[{\"type\":\"paragraph\",\"content\":[{\"text\":\"Understanding the meaning of hearing impairment.\",\"type\":\"text\"}]},{\"type\":\"paragraph\",\"content\":[{\"text\":\"Familiarity with physical concepts of mass, elasticity, sound source, media, energy, work, frequency, sound intensity, density, sound waveforms.\",\"type\":\"text\"}]},{\"type\":\"paragraph\",\"content\":[{\"text\":\"Familiarity with concepts of transducer (e.g. headphones, microphones, speaker).\",\"type\":\"text\"}]},{\"type\":\"paragraph\",\"content\":[{\"text\":\"Memory in your cell phone to download and utilize designated applications.\",\"type\":\"text\"}]},{\"type\":\"paragraph\",\"content\":[{\"text\":\"Experience with Microsoft PowerPoint, Microsoft Word.\",\"type\":\"text\"}]}]},\"goals\":{\"type\":\"doc\",\"content\":[{\"type\":\"paragraph\",\"content\":[{\"text\":\"Elaborate on hearing pathways from peripheral to central level. Identify the anatomical regions of the ear, including outer ear, middle ear, and inner ear and explain each ear region’s function. Understand the function of the auditory nerve and how sound signals are delivered to the central brain level.\",\"type\":\"text\"}]},{\"type\":\"paragraph\",\"content\":[{\"text\":\"Classify 3 types of hearing loss and interpret hearing loss degree and configurations that are reflected on the audiograms. The 3 types of hearing loss include: Conductive, Sensorineural, and Mixed hearing loss. Learn the concepts of audiogram, frequency, hearing level in decibel, hearing thresholds, air conduction testing, bone conduction testing, and symbols to document results on audiogram.\",\"type\":\"text\"}]},{\"type\":\"paragraph\",\"content\":[{\"text\":\"Critically review research literatures that investigate the impact of hearing loss, especially on cognitive function.\",\"type\":\"text\"}]},{\"type\":\"paragraph\",\"content\":[{\"text\":\"Differentiate non-surgical and surgical hearing device options. Understand the differences regarding device working mechanism, suitable population, and the general process of device fitting.\",\"type\":\"text\"}]},{\"type\":\"paragraph\",\"content\":[{\"text\":\"Explain tinnitus definitions, correlation of tinnitus and hearing loss, and management options for tinnitus.\",\"type\":\"text\"}]}]},\"schedule\":\"Tuesdays, 11:30 A.M. ET / 8:30 A.M. PT\",\"status\":\"archived\",\"duration\":\"8 weeks, 2-3 hours per week\",\"workshops\":{\"sessions\":[{\"name\":\"Introductions\",\"order\":1,\"description\":{\"type\":\"doc\",\"content\":[{\"type\":\"paragraph\",\"content\":[{\"text\":\"Get to know the Build Fellow and other students, preview of future session topics to have a general understanding of hearing healthcare.\",\"type\":\"text\"}]}]}},{\"name\":\"Mechanism of Hearing Sounds\",\"order\":2,\"description\":{\"type\":\"doc\",\"content\":[{\"type\":\"paragraph\",\"content\":[{\"text\":\"Get familiar with anatomy and function of the ear: External ear, Middle ear, Inner ear. Understand the sound transmission and interpretation pathway from the ear level to the central brain level.\",\"type\":\"text\"}]}]}},{\"name\":\"Hearing Loss\",\"order\":3,\"description\":{\"type\":\"doc\",\"content\":[{\"type\":\"paragraph\",\"content\":[{\"text\":\"Interpreting the type and degree of hearing loss by reading audiograms.\",\"type\":\"text\"}]}]}},{\"name\":\"Literature Review and Hearing Loss Impact\",\"order\":4,\"description\":{\"type\":\"doc\",\"content\":[{\"type\":\"paragraph\",\"content\":[{\"text\":\"Critically review research literature that explains the general impact of hearing loss on quality of life, family, cognition, etc.\",\"type\":\"text\"}]}]}},{\"name\":\"Hearing Devices Selections\",\"order\":5,\"description\":{\"type\":\"doc\",\"content\":[{\"type\":\"paragraph\",\"content\":[{\"text\":\"Distinguish hearing device options for treating hearing loss and select corresponding ones based on patient’s individual needs.\\n\",\"type\":\"text\"}]}]}},{\"name\":\"Tinnitus Characteristics and Management\",\"order\":6,\"description\":{\"type\":\"doc\",\"content\":[{\"type\":\"paragraph\",\"content\":[{\"text\":\"Learn tinnitus definitions, assessment tools, and management techniques.\",\"type\":\"text\"}]}]}},{\"name\":\"Noise Induced Hearing Loss and Prevention\",\"order\":7,\"description\":{\"type\":\"doc\",\"content\":[{\"type\":\"paragraph\",\"content\":[{\"text\":\"Understand the prevalence of noise induced hearing loss, learn how to use phone app to measure noise level, and compare three types of hearing protection devices.\",\"type\":\"text\"}]}]}},{\"name\":\"Presentations\",\"order\":8,\"description\":{\"type\":\"doc\",\"content\":[{\"type\":\"paragraph\",\"content\":[{\"text\":\"Connect all of the topics in a coherent way and present both in slide deck and oral form, with the big themes of understanding hearing loss, treating hearing loss, and preventing hearing loss.\",\"type\":\"text\"}]}]}}]},\"fellows\":[{\"id\":\"298045ab-4f79-4ce7-a829-f2d3fc19cbeb\",\"name\":\"Ling Zhong\",\"role\":\"Audiology Fellow\",\"organization\":\"Open Avenues Foundation\",\"organizationLogoUrl\":\"/images/organizations/oaf-logo.png\",\"photoUrl\":\"https://avgkrhojcamcagufngrr.supabase.co/storage/v1/object/public/fellow-headshots/298045ab-4f79-4ce7-a829-f2d3fc19cbeb.webp\",\"bio\":\"Ling Zhong is an Audiology Fellow at Open Avenues Foundation (OAF), where she works closely with students and leads hearing healthcare projects. In addition to her role at the OAF, Ling practices as an audiologist at a private hearing clinic in the Bay Area. There, she specializes in diagnosing hearing loss, consulting on and fitting hearing aids, providing cerumen removal services, and managing tinnitus. Ling is also involved in conducting research projects related to hearing sciences at the clinic. She earned her Doctor of Audiology degree from Vanderbilt University. Outside of her professional life, Ling enjoys gathering with friends and exploring her surroundings.\",\"linkedinUrl\":\"NA\"}],\"categories\":[\"Healthcare Industry\",\"Private Practice\",\"Hearing Loss Treatment\",\"Hearing Protection\"],\"applicationTimeline\":[{\"label\":\"Applications open\",\"value\":\"January 12, 2026\"},{\"label\":\"Applications deadline\",\"value\":\"February 5, 2026\"},{\"label\":\"Application results released\",\"value\":\"Week of February 16, 2026\"},{\"label\":\"Project start date\",\"value\":\"Week of March 2, 2026\"},{\"label\":\"Project end date\",\"value\":\"Week of April 20, 2026\"}],\"cycle_id\":\"ad606eee-63b5-4cb0-a043-f9303d6531d2\"},\"error\":\"$undefined\"}]\n"])</script></body></html>
