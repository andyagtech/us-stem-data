tatic/chunks/54a60aa6-294bb7e111b509a4.js?dpl=dpl_A9QRwtuL4hrMD2RZGqb9eW7AtxES\",\"4420\",\"static/chunks/4420-baa8329e5076733c.js?dpl=dpl_A9QRwtuL4hrMD2RZGqb9eW7AtxES\",\"2169\",\"static/chunks/2169-1d13735e35f16c75.js?dpl=dpl_A9QRwtuL4hrMD2RZGqb9eW7AtxES\",\"419\",\"static/chunks/419-9f9e6d455ee0ae85.js?dpl=dpl_A9QRwtuL4hrMD2RZGqb9eW7AtxES\",\"5288\",\"static/chunks/5288-5d7819e0848b1b1a.js?dpl=dpl_A9QRwtuL4hrMD2RZGqb9eW7AtxES\",\"6874\",\"static/chunks/6874-67c719d6db2b17af.js?dpl=dpl_A9QRwtuL4hrMD2RZGqb9eW7AtxES\",\"6766\",\"static/chunks/6766-7fcc7eadc8fee52b.js?dpl=dpl_A9QRwtuL4hrMD2RZGqb9eW7AtxES\",\"9435\",\"static/chunks/9435-28f947009b0f7d38.js?dpl=dpl_A9QRwtuL4hrMD2RZGqb9eW7AtxES\",\"2206\",\"static/chunks/2206-42291f248e6bf19d.js?dpl=dpl_A9QRwtuL4hrMD2RZGqb9eW7AtxES\",\"5782\",\"static/chunks/5782-04eaa6c475f5c3f2.js?dpl=dpl_A9QRwtuL4hrMD2RZGqb9eW7AtxES\",\"8419\",\"static/chunks/app/projects/%5Bslug%5D/page-7f8129194c3557a1.js?dpl=dpl_A9QRwtuL4hrMD2RZGqb9eW7AtxES\"],\"default\"]\n"])</script><script>self.__next_f.push([1,"b:[\"$\",\"$L19\",null,{\"project\":{\"id\":\"24fb60fd-93c2-456a-899e-8b59c1651616\",\"title\":\"Event Insight: Summarizing Disasters with AI and Web Data\",\"slug\":\"event-insight-summarizing-disasters-with-ai-and-satellite-data-1\",\"summary\":{\"type\":\"doc\",\"content\":[{\"type\":\"paragraph\",\"content\":[{\"text\":\"Build an AI-powered 'situation brief' generator that combines real-time news analysis with web-sourced event images to help users understand the impact of natural disasters. \",\"type\":\"text\"}]}]},\"description\":{\"type\":\"doc\",\"content\":[{\"type\":\"paragraph\",\"content\":[{\"text\":\"Natural disasters such as earthquakes, floods, hurricanes, and wildfires generate fast-moving, high-volume information that can be difficult for the public, emergency responders, and decision-makers to interpret quickly. In this Build Project, you will take on the role of a Data Scientist and develop a tool that helps summarize and visualize the impact of these events in a clear and accessible way. \",\"type\":\"text\"}]},{\"type\":\"paragraph\",\"content\":[{\"text\":\"You will build an application that takes a natural disaster query from the user and automatically creates a \\\"situation brief\\\" — a concise, structured report that combines insights from web-searched news content with relevant event images. To achieve this, you will first build an intent clarification agent that interacts with the user to resolve any ambiguity in their query (for example: which flood, which year, or which region). The refined query is then passed to an event identification agent that uses Gemini's built-in Google Search capability to retrieve current news articles and structured event details. A summarization agent then processes those articles to produce a clear, readable summary of the event. \",\"type\":\"text\"}]},{\"type\":\"paragraph\",\"content\":[{\"text\":\"Guided by a Data Science Fellow, you will learn how to connect multiple AI agents into a single workflow, how to validate and test each agent's inputs and outputs to ensure reliability. By the end of the project, you will have built a functional multi-agent application capable of generating a structured, data-driven situation brief for any natural disaster, helping users better understand its scale and impact.\",\"type\":\"text\"}]}]},\"project_area\":[\"Computer Science\",\"Data Science\"],\"level\":\"Intermediate\",\"levelDescription\":\"Some experience recommended\",\"prerequisites\":{\"type\":\"doc\",\"content\":[{\"type\":\"paragraph\",\"content\":[{\"text\":\"Intermediate skills of programming in python. You should be able to write functions, classes, class attributes, for loops, if statements, break statements. Write modular code and be able to debug the code.\",\"type\":\"text\"}]},{\"type\":\"paragraph\",\"content\":[{\"text\":\"Understand the fundamentals of API calls, and response. You should be able to understand how to build and work with JSON objects.\",\"type\":\"text\"}]},{\"type\":\"paragraph\",\"content\":[{\"text\":\"You should be able to read through and understand documentation of different libraries, install and utilize them in your code.\",\"type\":\"text\"}]}]},\"goals\":{\"type\":\"doc\",\"content\":[{\"type\":\"paragraph\",\"content\":[{\"text\":\"Use APIs to extract, transform and leverage data from multiple sources\",\"type\":\"text\"}]},{\"type\":\"paragraph\",\"content\":[{\"text\":\"Use natural language processing models to generate summaries from large documents\",\"type\":\"text\"}]},{\"type\":\"paragraph\",\"content\":[{\"text\":\"Build conversational agents that clarify user intent through structured dialogue\",\"type\":\"text\"}]},{\"type\":\"paragraph\",\"content\":[{\"text\":\"Design and connect multiple AI agents into a single coherent pipeline\",\"type\":\"text\"}]}]},\"schedule\":\"Tuesdays, 7:00 P.M. ET / 4:00 P.M. PT\",\"status\":\"active\",\"duration\":\"8 weeks, 2-3 hours per week\",\"workshops\":{\"sessions\":[{\"name\":\"Introduction\",\"order\":1,\"description\":{\"type\":\"doc\",\"content\":[{\"type\":\"paragraph\",\"content\":[{\"text\":\"You will be introduced to the project \\\"Event Insight\\\", which combines Natural Language Processing, multi-agent AI systems, and web data extraction to produce an intelligent brief of a disaster event and its impact. You will also set up your development environment, gather and securely save the API tokens needed for the project, and get familiar with the project structure and tools you will be using.\",\"type\":\"text\"}]}]}},{\"name\":\"Intent Clarification Agent\",\"order\":2,\"description\":{\"type\":\"doc\",\"content\":[{\"type\":\"paragraph\",\"content\":[{\"text\":\"You will build a conversational agent that interacts with the user to resolve ambiguity in their initial query. The agent will ask targeted follow-up questions such as which event, which year, or which region and produce a refined, structured event query that will be used by the rest of the pipeline. \",\"type\":\"text\"}]}]}},{\"name\":\"Data Extraction - Event Identification and Articles Sourcing\",\"order\":3,\"description\":{\"type\":\"doc\",\"content\":[{\"type\":\"paragraph\",\"content\":[{\"text\":\"You will build an agent that takes the structured query produced by the Intent Clarification Agent and uses Gemini's built-in Google Search grounding to find current, relevant news articles about the event. The agent will return a structured JSON containing the event details and a list of sourced article URLs and summaries for downstream processing.\",\"type\":\"text\"}]}]}},{\"name\":\"Data Extraction - Event Image Collection \",\"order\":4,\"description\":{\"type\":\"doc\",\"content\":[{\"type\":\"paragraph\",\"content\":[{\"text\":\"You will use the Wikimedia API to search for and retrieve relevant images of the event based on the event details returned by the Event Identification Agent. You will write functions that query the API, filter results, and save the image URLs and metadata for inclusion in the final situation brief.\",\"type\":\"text\"}]}]}},{\"name\":\"Summarization Agent\",\"order\":5,\"description\":{\"type\":\"doc\",\"content\":[{\"type\":\"paragraph\",\"content\":[{\"text\":\"You will create an agent that takes the article content retrieved in Workshop 3 and generates a concise, structured summary of the event using Gemini. You will design the agent's output format to be consistent and informative, and integrate it into the current application flow. The summary will form the core of the final situation brief. \",\"type\":\"text\"}]}]}},{\"name\":\"Agent Validation and Testing\",\"order\":6,\"description\":{\"type\":\"doc\",\"content\":[{\"type\":\"paragraph\",\"content\":[{\"text\":\"You will write validation logic and tests for all the agents built so far. This includes defining expected input and output schemas for each agent, writing unit tests to verify correct behavior, and writing integration tests to confirm that agents work correctly when connected together. You will learn how to catch and handle malformed or unexpected outputs to make the pipeline robust. \",\"type\":\"text\"}]}]}},{\"name\":\"Interview Preparation\",\"order\":7,\"description\":{\"type\":\"doc\",\"content\":[{\"type\":\"paragraph\",\"content\":[{\"text\":\"With the project nearly complete, you will spend this session preparing to talk confidently about what you built. You will review the architecture and design decisions made throughout the project, practice explaining technical trade-offs, and work through mock interview questions related to the project including questions on multi-agent systems, NLP, API integration, and software testing. \",\"type\":\"text\"}]}]}},{\"name\":\"Final Presentations\",\"order\":8,\"description\":{\"type\":\"doc\",\"content\":[{\"type\":\"paragraph\",\"content\":[{\"text\":\"You will present your completed application, walking through the full pipeline from user query to situation brief. We will have discussions on what worked well, where there is room for improvement, and what new features could be implemented to make the application more robust and useful. \",\"type\":\"text\"}]}]}}]},\"fellows\":[{\"id\":\"aa3b3de9-2ff7-428c-b266-5e5c3c6b2bc4\",\"name\":\"Shubhashree Dash\",\"role\":\"Data Science Fellow\",\"organization\":\"Open Avenues Foundation\",\"organizationLogoUrl\":\"/images/organizations/oaf-logo.png\",\"photoUrl\":\"https://avgkrhojcamcagufngrr.supabase.co/storage/v1/object/public/fellow-headshots/aa3b3de9-2ff7-428c-b266-5e5c3c6b2bc4.webp\",\"bio\":\"Shubhashree Dash is a Data Science Build Fellow at Open Avenues Foundation, where she works with students leading projects in Data Science.\\nShubhashree is a Data Scientist at Rhombus Power Inc, where she focuses on building application which use AI for supporting decision making and predictions.\\nShubhashree has over 3 years of experience in the Data Science field. She holds a Master in Computer Science.\",\"linkedinUrl\":\"https://www.linkedin.com/in/shubhashreedash\"}],\"categories\":[\"GenAI Agents\",\"Natural Language Processing\",\"Data Extraction Pipelines\",\"Multi-Agent Systems\"],\"applicationTimeline\":[{\"label\":\"Applications open\",\"value\":\"May 11, 2026\"},{\"label\":\"Applications deadline\",\"value\":\"June 11, 2026\"},{\"label\":\"Application results released\",\"value\":\"Week of June 22, 2026\"},{\"label\":\"Project start date\",\"value\":\"Week of July 6, 2026\"},{\"label\":\"Project end date\",\"value\":\"Week of August 24, 2026\"}],\"cycle_id\":\"04780f7f-10bb-4b43-8480-8ef15da1b3cc\"},\"error\":\"$undefined\"}]\n"])</script></body></html>
