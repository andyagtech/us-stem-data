bc5d907b1f14.js?dpl=dpl_A9QRwtuL4hrMD2RZGqb9eW7AtxES\",\"277\",\"static/chunks/54a60aa6-294bb7e111b509a4.js?dpl=dpl_A9QRwtuL4hrMD2RZGqb9eW7AtxES\",\"4420\",\"static/chunks/4420-baa8329e5076733c.js?dpl=dpl_A9QRwtuL4hrMD2RZGqb9eW7AtxES\",\"2169\",\"static/chunks/2169-1d13735e35f16c75.js?dpl=dpl_A9QRwtuL4hrMD2RZGqb9eW7AtxES\",\"419\",\"static/chunks/419-9f9e6d455ee0ae85.js?dpl=dpl_A9QRwtuL4hrMD2RZGqb9eW7AtxES\",\"5288\",\"static/chunks/5288-5d7819e0848b1b1a.js?dpl=dpl_A9QRwtuL4hrMD2RZGqb9eW7AtxES\",\"6874\",\"static/chunks/6874-67c719d6db2b17af.js?dpl=dpl_A9QRwtuL4hrMD2RZGqb9eW7AtxES\",\"6766\",\"static/chunks/6766-7fcc7eadc8fee52b.js?dpl=dpl_A9QRwtuL4hrMD2RZGqb9eW7AtxES\",\"9435\",\"static/chunks/9435-28f947009b0f7d38.js?dpl=dpl_A9QRwtuL4hrMD2RZGqb9eW7AtxES\",\"2206\",\"static/chunks/2206-42291f248e6bf19d.js?dpl=dpl_A9QRwtuL4hrMD2RZGqb9eW7AtxES\",\"5782\",\"static/chunks/5782-04eaa6c475f5c3f2.js?dpl=dpl_A9QRwtuL4hrMD2RZGqb9eW7AtxES\",\"8419\",\"static/chunks/app/projects/%5Bslug%5D/page-7f8129194c3557a1.js?dpl=dpl_A9QRwtuL4hrMD2RZGqb9eW7AtxES\"],\"default\"]\n"])</script><script>self.__next_f.push([1,"b:[\"$\",\"$L19\",null,{\"project\":{\"id\":\"0cf791a2-161c-48f0-80fb-240168abb0f0\",\"title\":\"Cash Flow in Action: Stablize a Distressed Company by Financial Restructuring\",\"slug\":\"cash-flow-in-action-stabilizing-distressed-companies-through-financial-restructuring-1\",\"summary\":{\"type\":\"doc\",\"content\":[{\"type\":\"paragraph\",\"content\":[{\"text\":\"Build a dynamic, 13-week cash flow forecast that diagnoses a business crisis and guides strategic restructuring decisions for a financially distressed company in any industry.\",\"type\":\"text\"}]}]},\"description\":{\"type\":\"doc\",\"content\":[{\"type\":\"paragraph\",\"content\":[{\"text\":\"This Build Project puts you in the driver’s seat of financial restructuring. You’ll step into a small-to-medium-sized distressed company in the U.S. - playing the roles of restructuring analysts, project managers, and even interim CEOs. You will investigate the root causes of distress, test alternative scenarios, and recommend restructuring solutions while learning how to communicate complex information clearly and professionally to creditors, investors, and other key stakeholders. Along the way, you will develop critical skills in financial analysis, scenario modeling, and strategic decision-making, gaining hands-on experience that mirrors the genuine challenges faced by professionals in private equity, corporate finance, restructuring advisory, and financial operations - skills that are highly sought after in today’s U.S. workforce.\",\"type\":\"text\"}]}]},\"project_area\":[\"Business\",\"Finance\"],\"level\":\"Intermediate\",\"levelDescription\":\"Some experience recommended\",\"prerequisites\":{\"type\":\"doc\",\"content\":[{\"type\":\"paragraph\",\"content\":[{\"text\":\"Familiarity with the three core financial statements -  Income Statement, Balance Sheet, and Cash Flow Statement - and an introductory understanding of how they relate to a company’s financial position\",\"type\":\"text\"}]},{\"type\":\"paragraph\",\"content\":[{\"text\":\"Working knowledge of financial concepts such as cash flow management, valuation analysis, and drivers of financial distress.\",\"type\":\"text\"}]},{\"type\":\"paragraph\",\"content\":[{\"text\":\"Proficiency in Microsoft Excel, including the use of basic formulas and scenario modeling for financial analysis and forecasting\",\"type\":\"text\"}]},{\"type\":\"paragraph\",\"content\":[{\"text\":\"Proficiency in Microsoft Powerpoint and a willingness to explore effective communication and presentation strategies for summarizing complex financial and operational information for creditors, investors, and other stakeholders\",\"type\":\"text\"}]},{\"type\":\"paragraph\",\"content\":[{\"text\":\"Willingness to explore legal and stakeholder considerations in receivership, bankruptcy, and restructuring, and apply professional judgment in sensitive communication\",\"type\":\"text\"}]}]},\"goals\":{\"type\":\"doc\",\"content\":[{\"type\":\"paragraph\",\"content\":[{\"text\":\"Conduct a situational assessment of a distressed company - including operational, strategic, and financial analysis - and recommend the most appropriate restructuring remedy\",\"type\":\"text\"}]},{\"type\":\"paragraph\",\"content\":[{\"text\":\"Communicate case-administration updates clearly and sensitively to various stakeholders (creditors, investors, management) in the form of presentation decks\",\"type\":\"text\"}]},{\"type\":\"paragraph\",\"content\":[{\"text\":\"Summarize large amounts of data into presentations for secured creditors and potential buyers\",\"type\":\"text\"}]},{\"type\":\"paragraph\",\"content\":[{\"text\":\"Perform a high-level valuation analysis to inform restructuring options\",\"type\":\"text\"}]},{\"type\":\"paragraph\",\"content\":[{\"text\":\"Build a 13-week (quarterly) cash flow forecast to demonstrate stabilization and forward-looking planning\",\"type\":\"text\"}]}]},\"schedule\":\"Wednesdays, 4:00 P.M. ET / 1:00 P.M. PT\",\"status\":\"archived\",\"duration\":\"8 weeks, 2-3 hours per week\",\"workshops\":{\"sessions\":[{\"name\":\"Introduction to Restructuring\",\"order\":1,\"description\":{\"type\":\"doc\",\"content\":[{\"type\":\"paragraph\",\"content\":[{\"text\":\"Learn what financial distress looks like in real companies and explore the legal remedies available. You'll understand how tracking and forecasting cash flow becomes the central tool for stabilizing distressed businesses. We will review what you'll accomplish throughout this project and touch on how it can serve you professionally.\",\"type\":\"text\"}]}]}},{\"name\":\"Company Takeover Assessment\",\"order\":2,\"description\":{\"type\":\"doc\",\"content\":[{\"type\":\"paragraph\",\"content\":[{\"text\":\"Step into the shoes of a restructuring team taking over a struggling company. You'll analyze operational, strategic, and financial factors causing distress, and learn how to quickly assess risks and opportunities in high-pressure situations.\",\"type\":\"text\"}]}]}},{\"name\":\"Stakeholder Mapping\",\"order\":3,\"description\":{\"type\":\"doc\",\"content\":[{\"type\":\"paragraph\",\"content\":[{\"text\":\"Identify and prioritize key stakeholders - from secured creditors to business owners. You'll learn how to navigate conflicting interests and communicate financial realities sensitively in emotionally charged situations, including creating debt waterfall analyses.\",\"type\":\"text\"}]}]}},{\"name\":\"Create Stakeholder Presentations\",\"order\":4,\"description\":{\"type\":\"doc\",\"content\":[{\"type\":\"paragraph\",\"content\":[{\"text\":\"Condense complex financial data into clear, objective presentations for creditors and investors. You'll learn the fiduciary responsibility of maintaining neutrality while presenting difficult financial information and restructuring options professionally.\",\"type\":\"text\"}]}]}},{\"name\":\"Develop Restructuring Strategies\",\"order\":5,\"description\":{\"type\":\"doc\",\"content\":[{\"type\":\"paragraph\",\"content\":[{\"text\":\"Move from analysis to action by ideating 3-5 strategic options for stabilizing your distressed company. You'll evaluate cost reductions, operational fixes, and refinancing options, then prioritize strategies based on feasibility, impact, and stakeholder constraints.\",\"type\":\"text\"}]}]}},{\"name\":\"Build Cash Flow Forecast\",\"order\":6,\"description\":{\"type\":\"doc\",\"content\":[{\"type\":\"paragraph\",\"content\":[{\"text\":\"Construct your first draft of a 13-week cash flow model in Excel. You'll translate strategic decisions into financial inputs, linking operational realities like collections and payroll to cash inflows and outflows that demonstrate stabilization pathways.\",\"type\":\"text\"}]}]}},{\"name\":\"Adapt to Disruptions\",\"order\":7,\"description\":{\"type\":\"doc\",\"content\":[{\"type\":\"paragraph\",\"content\":[{\"text\":\"Update your cash flow forecast to handle unexpected operational and financial shocks. You'll perform variance analysis, adjust assumptions in real-time, and learn how restructuring professionals maintain vigilance and communicate changes transparently.\",\"type\":\"text\"}]}]}},{\"name\":\"Final Presentations\",\"order\":8,\"description\":{\"type\":\"doc\",\"content\":[{\"type\":\"paragraph\",\"content\":[{\"text\":\"Present your complete 13-week cash flow forecast and restructuring recommendations to simulated creditors and investors. You'll demonstrate your analytical rigor, strategic thinking, and ability to tell a compelling restructuring story while receiving career guidance for finance roles.\",\"type\":\"text\"}]}]}}]},\"fellows\":[{\"id\":\"902c4158-c23e-465b-92a4-dbc0035e344c\",\"name\":\"Thomas Stenz\",\"role\":\"Finance Fellow\",\"organization\":\"Open Avenues Foundation\",\"organizationLogoUrl\":\"/images/organizations/oaf-logo.png\",\"photoUrl\":\"https://avgkrhojcamcagufngrr.supabase.co/storage/v1/object/public/fellow-headshots/902c4158-c23e-465b-92a4-dbc0035e344c.webp\",\"bio\":\"Thomas Stenz is a Finance Build Fellow at Open Avenues Foundation, where he works with students leading projects in financial restructuring.\\n\\nThomas is a Senior Restructuring Associate at UnitedAMS, where he focuses on unlocking value from distressed companies by stabilizing their finances, operations, and strategy positioning them for growth as turnarounds, or maximizing value through strategic sales to investors or targeted asset liquidations.\\n\\nThomas has over a year of experience in the restructuring and asset management field. \\n\\nHe holds a Bachelors degree in Finance with Honors from Yeshiva University\\n\\nA fun fact about Thomas is that he is an avid guitarist (though his music career remains blissfully independent). \",\"linkedinUrl\":\"https://www.linkedin.com/in/thomas-stenz/\"}],\"categories\":[\"Strategy\",\"Management\",\"Finance\",\"Operations\"],\"applicationTimeline\":[{\"label\":\"Applications open\",\"value\":\"April 13, 2026\"},{\"label\":\"Applications deadline\",\"value\":\"May 20, 2026\"},{\"label\":\"Application results released\",\"value\":\"Week of May 26, 2026\"},{\"label\":\"Project start date\",\"value\":\"Week of June 8, 2026\"},{\"label\":\"Project end date\",\"value\":\"Week of July 27, 2026\"}],\"cycle_id\":\"ae26a648-44bc-4fab-bbb0-7f9c0f6b18d9\"},\"error\":\"$undefined\"}]\n"])</script></body></html>
