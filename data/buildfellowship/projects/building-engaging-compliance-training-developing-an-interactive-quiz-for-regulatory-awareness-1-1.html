4\",\"static/chunks/22747d63-b78dbc5d907b1f14.js?dpl=dpl_A9QRwtuL4hrMD2RZGqb9eW7AtxES\",\"277\",\"static/chunks/54a60aa6-294bb7e111b509a4.js?dpl=dpl_A9QRwtuL4hrMD2RZGqb9eW7AtxES\",\"4420\",\"static/chunks/4420-baa8329e5076733c.js?dpl=dpl_A9QRwtuL4hrMD2RZGqb9eW7AtxES\",\"2169\",\"static/chunks/2169-1d13735e35f16c75.js?dpl=dpl_A9QRwtuL4hrMD2RZGqb9eW7AtxES\",\"419\",\"static/chunks/419-9f9e6d455ee0ae85.js?dpl=dpl_A9QRwtuL4hrMD2RZGqb9eW7AtxES\",\"5288\",\"static/chunks/5288-5d7819e0848b1b1a.js?dpl=dpl_A9QRwtuL4hrMD2RZGqb9eW7AtxES\",\"6874\",\"static/chunks/6874-67c719d6db2b17af.js?dpl=dpl_A9QRwtuL4hrMD2RZGqb9eW7AtxES\",\"6766\",\"static/chunks/6766-7fcc7eadc8fee52b.js?dpl=dpl_A9QRwtuL4hrMD2RZGqb9eW7AtxES\",\"9435\",\"static/chunks/9435-28f947009b0f7d38.js?dpl=dpl_A9QRwtuL4hrMD2RZGqb9eW7AtxES\",\"2206\",\"static/chunks/2206-42291f248e6bf19d.js?dpl=dpl_A9QRwtuL4hrMD2RZGqb9eW7AtxES\",\"5782\",\"static/chunks/5782-04eaa6c475f5c3f2.js?dpl=dpl_A9QRwtuL4hrMD2RZGqb9eW7AtxES\",\"8419\",\"static/chunks/app/projects/%5Bslug%5D/page-7f8129194c3557a1.js?dpl=dpl_A9QRwtuL4hrMD2RZGqb9eW7AtxES\"],\"default\"]\n"])</script><script>self.__next_f.push([1,"b:[\"$\",\"$L19\",null,{\"project\":{\"id\":\"3572b4a5-3d0b-477b-a1d3-25148cef7782\",\"title\":\"Building Engaging Compliance Training: Developing an Interactive Quiz for Regulatory Awareness\",\"slug\":\"building-engaging-compliance-training-developing-an-interactive-quiz-for-regulatory-awareness-1-1\",\"summary\":{\"type\":\"doc\",\"content\":[{\"type\":\"paragraph\",\"content\":[{\"text\":\"This project focuses on developing a learning material to help employees understand and comply with key workplace regulations, including anti-harassment policies, data protection, and workplace safety.\",\"type\":\"text\"}]}]},\"description\":{\"type\":\"doc\",\"content\":[{\"type\":\"paragraph\",\"content\":[{\"text\":\"With workplace regulations increasingly under scrutiny, organizations are prioritizing compliance to protect both employees and the business. Understanding and adhering to policies around anti-harassment, data privacy, and safety are now essential components of a healthy workplace culture. This Build Project will guide you through the process of designing a compliance training tool, focusing on creating an interactive quiz that reinforces knowledge about critical workplace regulations such as anti-harassment policies, data privacy laws (e.g., GDPR), and safety standards.\",\"type\":\"text\"}]},{\"type\":\"paragraph\",\"content\":[{\"text\":\"Over the course of 8 weeks, you will work on developing content, building quiz questions, and incorporating learning design strategies to ensure the material is engaging and easy to retain. By the end of the project, you’ll gain practical experience in both compliance and training development, equipping you with skills to build effective, engaging learning materials that foster a safer and more compliant workplace.\",\"type\":\"text\"}]},{\"type\":\"paragraph\",\"content\":[{\"text\":\"By the end of the 8-weeks project, you will develop an interactive compliance quiz. The quiz will be designed to be completed by employees in a corporate setting and will reinforce understanding of key regulations.\",\"type\":\"text\"}]}]},\"project_area\":[\"Business\"],\"level\":\"Beginner\",\"levelDescription\":\"No prior experience required\",\"prerequisites\":{\"type\":\"doc\",\"content\":[{\"type\":\"paragraph\",\"content\":[{\"text\":\"Interest in Learning Design and Employee Training: You should have a foundational understanding of employee training principles, such as learner engagement and information retention. An interest in making complex topics accessible and engaging will be crucial for developing effective educational tools in this project.\",\"type\":\"text\"}]},{\"type\":\"paragraph\",\"content\":[{\"text\":\"Basic Knowledge of Workplace Compliance Topics: Familiarity with compliance issues, including anti-harassment policies, data privacy laws (e.g., GDPR), and workplace safety, will help you craft accurate, relevant quiz content that aligns with real-world standards.\",\"type\":\"text\"}]},{\"type\":\"paragraph\",\"content\":[{\"text\":\"Prior Experience with Training Content Creation: Previous exposure to designing or delivering training materials, such as creating presentation slides, writing quiz questions, or facilitating workshops, will aid you in developing engaging and understandable quiz content.\",\"type\":\"text\"}]},{\"type\":\"paragraph\",\"content\":[{\"text\":\"Critical Thinking and Problem-Solving Skills: You should be able to critically evaluate complex legal concepts and translate them into clear, practical quiz questions. The ability to create realistic scenarios or cases for compliance training will also be beneficial.\",\"type\":\"text\"}]}]},\"goals\":{\"type\":\"doc\",\"content\":[{\"type\":\"paragraph\",\"content\":[{\"text\":\"Develop a compliance quiz that assesses employees' understanding of key regulations, such as anti-harassment and data protection.\",\"type\":\"text\"}]},{\"type\":\"paragraph\",\"content\":[{\"text\":\"Learn how to create engaging and accessible learning materials to promote compliance in the workplace.\",\"type\":\"text\"}]},{\"type\":\"paragraph\",\"content\":[{\"text\":\"Understand the psychology behind how people learn and retain compliance-related information.\",\"type\":\"text\"}]},{\"type\":\"paragraph\",\"content\":[{\"text\":\"Gain experience designing and delivering training modules with tangible outcomes.\",\"type\":\"text\"}]}]},\"schedule\":\"Wednesdays, 2:00 P.M. ET / 11:00 A.M. PT\",\"status\":\"archived\",\"duration\":\"8 weeks, 2-3 hours per week\",\"workshops\":{\"sessions\":[{\"name\":\"Introduction to Workplace Compliance and Learning Design\",\"order\":1,\"description\":{\"type\":\"doc\",\"content\":[{\"type\":\"paragraph\",\"content\":[{\"text\":\"You will explore the importance of workplace compliance and the basics of effective learning design for corporate training.\",\"type\":\"text\"}]}]}},{\"name\":\"Anti-Harassment Policies and Case Studies\",\"order\":2,\"description\":{\"type\":\"doc\",\"content\":[{\"type\":\"paragraph\",\"content\":[{\"text\":\"This workshop will cover anti-harassment policies and include case studies to help develop quiz questions.\",\"type\":\"text\"}]}]}},{\"name\":\"Data Privacy and GDPR\",\"order\":3,\"description\":{\"type\":\"doc\",\"content\":[{\"type\":\"paragraph\",\"content\":[{\"text\":\"You will learn about data privacy regulations, including GDPR, and create relevant quiz questions.\",\"type\":\"text\"}]}]}},{\"name\":\"Workplace Safety Regulations\",\"order\":4,\"description\":{\"type\":\"doc\",\"content\":[{\"type\":\"paragraph\",\"content\":[{\"text\":\"Focus on workplace safety policies and standards, you will develop questions to reinforce these regulations.\",\"type\":\"text\"}]}]}},{\"name\":\"Quiz Design and Interactivity\",\"order\":5,\"description\":{\"type\":\"doc\",\"content\":[{\"type\":\"paragraph\",\"content\":[{\"text\":\"You will begin designing the structure of the quiz, ensuring it is engaging and interactive.\",\"type\":\"text\"}]}]}},{\"name\":\"Testing and Feedback\",\"order\":6,\"description\":{\"type\":\"doc\",\"content\":[{\"type\":\"paragraph\",\"content\":[{\"text\":\"You will test the quiz among peers, gathering feedback and improving the content.\",\"type\":\"text\"}]}]}},{\"name\":\"Final Touches on Quiz Content\",\"order\":7,\"description\":{\"type\":\"doc\",\"content\":[{\"type\":\"paragraph\",\"content\":[{\"text\":\"Final adjustments will be made to your quiz questions and layout, ensuring clarity and engagement.\",\"type\":\"text\"}]}]}},{\"name\":\"Launch and Review\",\"order\":8,\"description\":{\"type\":\"doc\",\"content\":[{\"type\":\"paragraph\",\"content\":[{\"text\":\"You will finalize your quiz present this in a mock pitch to a ‘HR Manager’ explaining the basis of your questions and how you would suggest integrating the quiz into a compliance training within a company.\",\"type\":\"text\"}]}]}}]},\"fellows\":[{\"id\":\"97b1c250-8566-4f01-8c60-41d945948d7a\",\"name\":\"Ruth Purcell\",\"role\":\"Business Human Resources Fellow\",\"organization\":\"Open Avenues Foundation\",\"organizationLogoUrl\":\"/images/organizations/oaf-logo.png\",\"photoUrl\":\"https://avgkrhojcamcagufngrr.supabase.co/storage/v1/object/public/fellow-headshots/97b1c250-8566-4f01-8c60-41d945948d7a.webp\",\"bio\":\"Ruth is a Human Resources Business Build fellow at Open Avenues Foundation, where she works with students leading projects in Learning and Development.\\n\\nRuth is a Learning and Development Coordinator at Arbella Insurance where she focuses on enhancing corporate training initiatives. This includes the design, implementation, and assessment of training programs that elevate employee skill sets and align with organizational goals. Working closely with cross-functional teams, Ruth ensures training materials are both relevant and engaging, promoting continuous learning and professional development. \\nRuth has over 3 years of experience in the Learning and Development field and holds a B.A. in Psychology and M.S in Business Psychology.\\n\\nOutside of work Ruth loves to travel and check out what food new cities have to offer.\\n\\n\",\"linkedinUrl\":\"https://www.linkedin.com/in/ruthpurcell98\"}],\"categories\":[\"Compliance\",\"Employee Training\",\"Learning and Development\",\"Workplace Safety\",\"GDPR\"],\"applicationTimeline\":[{\"label\":\"Applications open\",\"value\":\"January 12, 2026\"},{\"label\":\"Applications deadline\",\"value\":\"February 5, 2026\"},{\"label\":\"Application results released\",\"value\":\"Week of February 16, 2026\"},{\"label\":\"Project start date\",\"value\":\"Week of March 2, 2026\"},{\"label\":\"Project end date\",\"value\":\"Week of April 20, 2026\"}],\"cycle_id\":\"ad606eee-63b5-4cb0-a043-f9303d6531d2\"},\"error\":\"$undefined\"}]\n"])</script></body></html>
