l_A9QRwtuL4hrMD2RZGqb9eW7AtxES\",\"4420\",\"static/chunks/4420-baa8329e5076733c.js?dpl=dpl_A9QRwtuL4hrMD2RZGqb9eW7AtxES\",\"2169\",\"static/chunks/2169-1d13735e35f16c75.js?dpl=dpl_A9QRwtuL4hrMD2RZGqb9eW7AtxES\",\"419\",\"static/chunks/419-9f9e6d455ee0ae85.js?dpl=dpl_A9QRwtuL4hrMD2RZGqb9eW7AtxES\",\"5288\",\"static/chunks/5288-5d7819e0848b1b1a.js?dpl=dpl_A9QRwtuL4hrMD2RZGqb9eW7AtxES\",\"6874\",\"static/chunks/6874-67c719d6db2b17af.js?dpl=dpl_A9QRwtuL4hrMD2RZGqb9eW7AtxES\",\"6766\",\"static/chunks/6766-7fcc7eadc8fee52b.js?dpl=dpl_A9QRwtuL4hrMD2RZGqb9eW7AtxES\",\"9435\",\"static/chunks/9435-28f947009b0f7d38.js?dpl=dpl_A9QRwtuL4hrMD2RZGqb9eW7AtxES\",\"2206\",\"static/chunks/2206-42291f248e6bf19d.js?dpl=dpl_A9QRwtuL4hrMD2RZGqb9eW7AtxES\",\"5782\",\"static/chunks/5782-04eaa6c475f5c3f2.js?dpl=dpl_A9QRwtuL4hrMD2RZGqb9eW7AtxES\",\"8419\",\"static/chunks/app/projects/%5Bslug%5D/page-7f8129194c3557a1.js?dpl=dpl_A9QRwtuL4hrMD2RZGqb9eW7AtxES\"],\"default\"]\n"])</script><script>self.__next_f.push([1,"b:[\"$\",\"$L19\",null,{\"project\":{\"id\":\"bf908cc7-a30b-4e67-8bd7-d5cb56d44956\",\"title\":\"Control a Robot's Navigation Through a Warehouse\",\"slug\":\"control-a-robot-s-navigation-through-a-warehouse\",\"summary\":{\"type\":\"doc\",\"content\":[{\"type\":\"paragraph\",\"content\":[{\"text\":\"Use Python to plan and control paths for an autonomous mobile robot used to unload containers in a warehouse.\",\"type\":\"text\"}]}]},\"description\":{\"type\":\"doc\",\"content\":[{\"type\":\"paragraph\",\"content\":[{\"text\":\"Increasing efficiency of robot movements is a constant battle that people in Mechatronics are fighting daily. In this Build Project, you’ll wear the hat of Robotics Mechatronics Engineer and enable a robot to navigate autonomously at dock doors in a simulated warehouse. Under the supervision of an experienced Build Fellow, you'll use Python to implement trajectories planning and following algorithms to allow an autonomous mobile robot to navigate. You’ll become familiar with the state-of-the-art ROS2 (Robot Operating System 2) and testing in simulation. The implemented solution will reflect current industry best practices.\",\"type\":\"text\"}]}]},\"project_area\":[\"Engineering\"],\"level\":\"Intermediate\",\"levelDescription\":\"Some experience recommended\",\"prerequisites\":{\"type\":\"doc\",\"content\":[{\"type\":\"paragraph\",\"content\":[{\"text\":\"Commitment to start and finish the project, actively participate in all meetings, and work independently for ~2 hour/week.\",\"type\":\"text\"}]},{\"type\":\"paragraph\",\"content\":[{\"text\":\"Curiosity, willingness to learn, and proactive communication.\",\"type\":\"text\"}]},{\"type\":\"paragraph\",\"content\":[{\"text\":\"Intermediate knowledge of Python for scientific computing: you should have already contributed to a project with multiple files (i.e. be used to importing objects from other packages, modules or files), you should be able to use NumPy to perform array operations\",\"type\":\"text\"}]},{\"type\":\"paragraph\",\"content\":[{\"text\":\"Having taken an introductory class covering either robotics, control theory, mechanics or physics: you should be comfortable with the notion of derivatives (especially time derivatives)\",\"type\":\"text\"}]},{\"type\":\"paragraph\",\"content\":[{\"text\":\"Being comfortable with 2D geometry and the notion of frame: you should be comfortable using trigonometry in 2D\",\"type\":\"text\"}]},{\"type\":\"paragraph\",\"content\":[{\"text\":\"Interest in robotics and autonomous navigation, being keen to dive into the complexity of robotics software systems, being interested in working with complex industrial-grade solutions such as ROS2 and docker. \",\"type\":\"text\"}]}]},\"goals\":{\"type\":\"doc\",\"content\":[{\"type\":\"paragraph\",\"content\":[{\"text\":\"Leverage ROS2 to implement a multi-process navigation system.\",\"type\":\"text\"}]},{\"type\":\"paragraph\",\"content\":[{\"text\":\"Implement a basic 2D path planner.\",\"type\":\"text\"}]},{\"type\":\"paragraph\",\"content\":[{\"text\":\"How to generate a time-parametrized trajectory from a 2D Path.\",\"type\":\"text\"}]},{\"type\":\"paragraph\",\"content\":[{\"text\":\"Implement a controller allowing the mobile robots to track a trajectory.\",\"type\":\"text\"}]},{\"type\":\"paragraph\",\"content\":[{\"text\":\"Visualize your results using the gazebo simulator and rviz2.\",\"type\":\"text\"}]}]},\"schedule\":\"Tuesdays, 7:00 P.M. ET / 4:00 P.M. PT\",\"status\":\"archived\",\"duration\":\"8 weeks, 2-3 hours per week\",\"workshops\":{\"sessions\":[{\"name\":\"Introductions\",\"order\":1,\"description\":{\"type\":\"doc\",\"content\":[{\"type\":\"paragraph\",\"content\":[{\"text\":\"Get to know the Build Fellow and other students, ask questions about the project requirements, prepare your workspace. \",\"type\":\"text\"}]}]}},{\"name\":\"2D Path Planning\",\"order\":2,\"description\":{\"type\":\"doc\",\"content\":[{\"type\":\"paragraph\",\"content\":[{\"text\":\"You will implement a 2D path planner and validate its functionality using pytest.\",\"type\":\"text\"}]}]}},{\"name\":\"Planning in Simulation\",\"order\":3,\"description\":{\"type\":\"doc\",\"content\":[{\"type\":\"paragraph\",\"content\":[{\"text\":\"You will integrate the path planner into a ROS2 package and visualize its output using rviz2.\",\"type\":\"text\"}]}]}},{\"name\":\"2D Trajectory Planning\",\"order\":4,\"description\":{\"type\":\"doc\",\"content\":[{\"type\":\"paragraph\",\"content\":[{\"text\":\"You will integrate a provided smoother to generate time-parametrized trajectory from the planned path. You will validate the generated trajectory using provided simulation scenarios.\",\"type\":\"text\"}]}]}},{\"name\":\"Control the Robot\",\"order\":5,\"description\":{\"type\":\"doc\",\"content\":[{\"type\":\"paragraph\",\"content\":[{\"text\":\"You will implement controllers and package them into a ROS2 Package.\",\"type\":\"text\"}]}]}},{\"name\":\"Motion Planning and Control\",\"order\":6,\"description\":{\"type\":\"doc\",\"content\":[{\"type\":\"paragraph\",\"content\":[{\"text\":\"You will tune the controller to follow trajectories leveraging the simulation scenarios, your path planner and trajectory planner. \",\"type\":\"text\"}]}]}},{\"name\":\"Testing in Simulation\",\"order\":7,\"description\":{\"type\":\"doc\",\"content\":[{\"type\":\"paragraph\",\"content\":[{\"text\":\"You will learn how to contribute to an already established python module by adding one scenario to the simulation.\",\"type\":\"text\"}]}]}},{\"name\":\"Presentations\",\"order\":8,\"description\":{\"type\":\"doc\",\"content\":[{\"type\":\"paragraph\",\"content\":[{\"text\":\"You will learn how to contribute to an already established python module by adding one scenario to the simulation.\",\"type\":\"text\"}]}]}}]},\"fellows\":[{\"id\":\"ba21ef63-7b3d-4811-a659-09ef30e2414b\",\"name\":\"Noé Fontana\",\"role\":\"Mechatronics Engineering Fellow\",\"organization\":\"Open Avenues Foundation\",\"organizationLogoUrl\":\"/images/organizations/oaf-logo.png\",\"photoUrl\":\"https://avgkrhojcamcagufngrr.supabase.co/storage/v1/object/public/fellow-headshots/ba21ef63-7b3d-4811-a659-09ef30e2414b.webp\",\"bio\":\"Hi everyone! I am Noé Fontana, a Mechatronics Engineering Fellow at Open Avenues Fellow leading mechatronics and robotics projects. I am also an Applied AI Researcher at Pickle Robot where I solve Computer Vision and Perception problems. Before that, I worked on Navigation, Motion Planning and Control for autonomous Vehicles. I am excited to build with you on projects at the intersection of mechatronics, software developments and robotics.\\n\\nI did my undergraduate and graduate studies in France, studying a broad range of subjects and culminating in Masters in Mechatronics Engineering and Applied Mathematics. Professionnally, I am enthusiastic about applying mathematics to problems involving physical systems.\\n\\nOutside of work, some activities I enjoy are hiking, dancing and listening to live music.\",\"linkedinUrl\":\"\"}],\"categories\":[\"Robotics\",\"Mechatronics Engineering\",\"Software Development\",\"ROS2\",\"Python\"],\"applicationTimeline\":[{\"label\":\"Applications open\",\"value\":\"May 9, 2025\"},{\"label\":\"Applications deadline\",\"value\":\"June 8, 2025\"},{\"label\":\"Application results released\",\"value\":\"Week of June 23, 2025\"},{\"label\":\"Project start date\",\"value\":\"Week of July 7, 2025\"},{\"label\":\"Project end date\",\"value\":\"Week of August 25, 2025\"}],\"cycle_id\":\"77065a20-2032-46f1-b3cf-d435314c7011\"},\"error\":\"$undefined\"}]\n"])</script></body></html>
