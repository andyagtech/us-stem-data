Gqb9eW7AtxES\",\"4420\",\"static/chunks/4420-baa8329e5076733c.js?dpl=dpl_A9QRwtuL4hrMD2RZGqb9eW7AtxES\",\"2169\",\"static/chunks/2169-1d13735e35f16c75.js?dpl=dpl_A9QRwtuL4hrMD2RZGqb9eW7AtxES\",\"419\",\"static/chunks/419-9f9e6d455ee0ae85.js?dpl=dpl_A9QRwtuL4hrMD2RZGqb9eW7AtxES\",\"5288\",\"static/chunks/5288-5d7819e0848b1b1a.js?dpl=dpl_A9QRwtuL4hrMD2RZGqb9eW7AtxES\",\"6874\",\"static/chunks/6874-67c719d6db2b17af.js?dpl=dpl_A9QRwtuL4hrMD2RZGqb9eW7AtxES\",\"6766\",\"static/chunks/6766-7fcc7eadc8fee52b.js?dpl=dpl_A9QRwtuL4hrMD2RZGqb9eW7AtxES\",\"9435\",\"static/chunks/9435-28f947009b0f7d38.js?dpl=dpl_A9QRwtuL4hrMD2RZGqb9eW7AtxES\",\"2206\",\"static/chunks/2206-42291f248e6bf19d.js?dpl=dpl_A9QRwtuL4hrMD2RZGqb9eW7AtxES\",\"5782\",\"static/chunks/5782-04eaa6c475f5c3f2.js?dpl=dpl_A9QRwtuL4hrMD2RZGqb9eW7AtxES\",\"8419\",\"static/chunks/app/projects/%5Bslug%5D/page-7f8129194c3557a1.js?dpl=dpl_A9QRwtuL4hrMD2RZGqb9eW7AtxES\"],\"default\"]\n1a:T546,Embark on an exhilarating journey into healthcare data analysis. From identifying trends in disease outbreaks to forecasting future healthcare needs, this project will challenge you to navigate real-world data complexities while sharpening your analytical skills. \n\nYou will produce a comprehensive project report that details the entire data analysis process, from initial data collection and cleaning to advanced predictive modeling and result interpretation. Additionally, you will create a visually compelling presentation that highlights key insights, methodologies used, and implications for public health research and practice. These deliverables will not only demonstrate your mastery of data science techniques in the healthcare industry but also showcase your ability to effectiv"])</script><script>self.__next_f.push([1,"ely communicate complex findings—an essential skill for future roles in data-driven positions within healthcare and beyond. \n\nBy mastering techniques in data cleaning, exploratory analysis, and predictive modeling, you'll not only unlock valuable insights crucial for public health decision-making but also equip yourself with the indispensable skills sought after in entry-level roles across various sectors of the U.S. society, where data-driven decision-making is paramount for addressing pressing healthcare challenges and improving population well-being."])</script><script>self.__next_f.push([1,"b:[\"$\",\"$L19\",null,{\"project\":{\"id\":\"f6b91391-591d-4b82-a1ad-8b523a186303\",\"title\":\"Unveiling Health: Data Discovery Expedition\",\"slug\":\"unveiling-health-data-discovery-expedition\",\"summary\":{\"type\":\"doc\",\"content\":[{\"type\":\"paragraph\",\"content\":[{\"text\":\"Explore public health data to uncover hidden trends, emerging disease patterns, and critical insights that shape the future of healthcare. \",\"type\":\"text\"}]}]},\"description\":{\"type\":\"doc\",\"content\":[{\"type\":\"paragraph\",\"content\":[{\"text\":\"$1a\",\"type\":\"text\"}]}]},\"project_area\":[\"Computer Science\"],\"level\":\"Intermediate\",\"levelDescription\":\"Some experience recommended\",\"prerequisites\":{\"type\":\"doc\",\"content\":[{\"type\":\"paragraph\",\"content\":[{\"text\":\"For students to be successful in this project, you will need:\",\"type\":\"text\"}]},{\"type\":\"paragraph\",\"content\":[{\"text\":\"1. Access to ​​​​SPSS and Microsoft Excel. \",\"type\":\"text\"}]},{\"type\":\"paragraph\",\"content\":[{\"text\":\"2. Basic knowledge of data manipulation and cleaning techniques using tools like Excel and SPSS, including handling missing values, outliers, and inconsistencies to ensure data integrity for analysis. \",\"type\":\"text\"}]},{\"type\":\"paragraph\",\"content\":[{\"text\":\"3. Basic understanding of statistical analysis concepts such as descriptive statistics, hypothesis testing, and regression analysis, enabling you to derive meaningful insights from healthcare datasets and make informed decisions throughout the analysis process. \",\"type\":\"text\"}]}]},\"goals\":{\"type\":\"doc\",\"content\":[{\"type\":\"paragraph\",\"content\":[{\"text\":\"By the end of the project, you will be able to: \",\"type\":\"text\"}]},{\"type\":\"paragraph\",\"content\":[{\"text\":\"1. Conduct comprehensive data cleaning and preparation for healthcare datasets using tools like Excel and ​​SPSS, ensuring data integrity and suitability for analysis. \",\"type\":\"text\"}]},{\"type\":\"paragraph\",\"content\":[{\"text\":\"2. Perform exploratory data analysis (EDA) on public health datasets, utilizing descriptive statistics, data visualization techniques, and domain knowledge to uncover underlying patterns and trends. \",\"type\":\"text\"}]},{\"type\":\"paragraph\",\"content\":[{\"text\":\"3. Apply advanced feature selection and engineering techniques in the context of healthcare data analysis, integrating domain knowledge and insights gained from EDA to inform predictive modeling.\",\"type\":\"text\"}]}]},\"schedule\":\"Tuesdays, 3:00 P.M. ET / 12:00 P.M. PT\",\"status\":\"archived\",\"duration\":\"8 weeks, 2-3 hours per week\",\"workshops\":{\"sessions\":[{\"name\":\"Meet and Setup\",\"order\":1,\"description\":{\"type\":\"doc\",\"content\":[{\"type\":\"paragraph\",\"content\":[{\"text\":\"Meet the Build Fellow and fellow students, discuss project goals, ask questions, and set up your workspace. Get familiar with the project requirements and expectations.\",\"type\":\"text\"}]}]}},{\"name\":\"Collect and Clean Data\",\"order\":2,\"description\":{\"type\":\"doc\",\"content\":[{\"type\":\"paragraph\",\"content\":[{\"text\":\"Collect the health dataset, clean it using Excel or SPSS to handle missing values and inconsistencies, and ensure it is suitable for analysis.\",\"type\":\"text\"}]}]}},{\"name\":\"Explore the Data\",\"order\":3,\"description\":{\"type\":\"doc\",\"content\":[{\"type\":\"paragraph\",\"content\":[{\"text\":\"Conduct exploratory data analysis (EDA) to understand the structure and patterns in the dataset using descriptive statistics and visualizations.\",\"type\":\"text\"}]}]}},{\"name\":\"Select and Engineer Features\",\"order\":4,\"description\":{\"type\":\"doc\",\"content\":[{\"type\":\"paragraph\",\"content\":[{\"text\":\"Select relevant features for predictive modeling and engineer new features if necessary, using domain knowledge and EDA findings.\",\"type\":\"text\"}]}]}},{\"name\":\"Train Models\",\"order\":5,\"description\":{\"type\":\"doc\",\"content\":[{\"type\":\"paragraph\",\"content\":[{\"text\":\"Choose appropriate machine learning algorithms, train multiple models using the dataset, and evaluate their performance with techniques like cross-validation.\",\"type\":\"text\"}]}]}},{\"name\":\"Interpret and Validate Models\",\"order\":6,\"description\":{\"type\":\"doc\",\"content\":[{\"type\":\"paragraph\",\"content\":[{\"text\":\"Interpret trained models to understand prediction factors, visualize feature importance, and validate models using a test set to assess real-world performance. \",\"type\":\"text\"}]}]}},{\"name\":\"Prepare Report\",\"order\":7,\"description\":{\"type\":\"doc\",\"content\":[{\"type\":\"paragraph\",\"content\":[{\"text\":\"Prepare a comprehensive report summarizing the entire project, including data collection, cleaning, EDA, feature selection, model training, interpretation, and validation.\",\"type\":\"text\"}]}]}},{\"name\":\"Present Findings\",\"order\":8,\"description\":{\"type\":\"doc\",\"content\":[{\"type\":\"paragraph\",\"content\":[{\"text\":\"Prepare a comprehensive report summarizing the entire project, including data collection, cleaning, EDA, feature selection, model training, interpretation, and validation.\",\"type\":\"text\"}]}]}}]},\"fellows\":[{\"id\":\"35e102f2-7896-4f50-bcab-aa6d0d1804ce\",\"name\":\"Coaine Richards\",\"role\":\"Data Science Fellow\",\"organization\":\"Open Avenues Foundation\",\"organizationLogoUrl\":\"/images/organizations/oaf-logo.png\",\"photoUrl\":\"https://avgkrhojcamcagufngrr.supabase.co/storage/v1/object/public/fellow-headshots/35e102f2-7896-4f50-bcab-aa6d0d1804ce.webp\",\"bio\":\"Coaine Richards is a seasoned mathematics educator with 16 years of experience teaching at both high school and college levels. With a strong foundation in data science, stemming from his Bachelor of Science in Actuarial Science, Coaine seamlessly integrates real-world applications into his lessons, making complex mathematical concepts accessible and engaging for his students.\\nAs a Data Science Fellow, Coaine will collaborate with students on innovative data science projects, guiding them through the intricacies of data analysis and interpretation. His extensive teaching background and practical knowledge ensure that students gain valuable insights and hands-on experience in this rapidly evolving field.\\nIn his free time, Coaine enjoys relaxing at the beach and is always up for a long road trip, often volunteering to be the designated driver for the journey\",\"linkedinUrl\":\"https://www.linkedin.com/in/coaine-richards-589b711ab?utm_source=share\u0026utm_campaign=share_via\u0026utm_content=profile\u0026utm_medium=ios_app\"}],\"categories\":[\"Data Exploration\",\"Insights Discovery\",\"Statistical Modeling\",\"Trend Analysis\"],\"applicationTimeline\":[{\"label\":\"Applications open\",\"value\":\"May 9, 2025\"},{\"label\":\"Applications deadline\",\"value\":\"June 8, 2025\"},{\"label\":\"Application results released\",\"value\":\"Week of June 23, 2025\"},{\"label\":\"Project start date\",\"value\":\"Week of July 7, 2025\"},{\"label\":\"Project end date\",\"value\":\"Week of August 25, 2025\"}],\"cycle_id\":\"77065a20-2032-46f1-b3cf-d435314c7011\"},\"error\":\"$undefined\"}]\n"])</script></body></html>
