channel e-commerce capabilities, addressing the complex challenges faced by modern businesses in the digital marketplace.  \",\"type\":\"text\"}]},{\"type\":\"paragraph\",\"content\":[{\"text\":\"The current industry faces challenges such as disjointed operations, high pricing, and a lack of visibility on competitive suppliers, leading to a crisis in the supply chain, as witnessed during the recent pandemic. The objective of this project is to create a prototype that addresses these issues and provides end-to-end sourcing tracking capabilities for warehouse/logistics operations.  \",\"type\":\"text\"}]},{\"type\":\"paragraph\",\"content\":[{\"text\":\"The platform features a user-friendly interface that caters to B2B operations, supporting complex pricing structures, bulk order management, and sophisticated supplier collaboration tools. The platform's architecture is built on scalable, cloud-native technologies, utilizing AWS services such as Lambda, DynamoDB, and API Gateway to ensure high performance, security, and reliability. \",\"type\":\"text\"}]}]},\"project_area\":[\"Computer Science\"],\"level\":\"Intermediate\",\"levelDescription\":\"Some experience recommended\",\"prerequisites\":{\"type\":\"doc\",\"content\":[{\"type\":\"paragraph\",\"content\":[{\"text\":\"Business Research and analysis skills that apply to Retailing, E-Commerce, Warehouse, logistics and Supply Chain industry.\",\"type\":\"text\"}]},{\"type\":\"paragraph\",\"content\":[{\"text\":\"Understanding the basics of cloud management, including the concept of the cloud, servers, memory, and the ability to define server computation.\",\"type\":\"text\"}]},{\"type\":\"paragraph\",\"content\":[{\"text\":\"Basic knowledge of Restful Services and how they are secured.\",\"type\":\"text\"}]},{\"type\":\"paragraph\",\"content\":[{\"text\":\"Ability to use MS Word, MS Excel and MS PowerPoint.\",\"type\":\"text\"}]},{\"type\":\"paragraph\",\"content\":[{\"text\":\"Proficiency in using MS Paint to create rough sketches of UI screens tailored for customers and various application personas.\",\"type\":\"text\"}]},{\"type\":\"paragraph\",\"content\":[{\"text\":\"Strong oral and written communication skills, with a desire to discuss, debate, and share thoughts with others.\",\"type\":\"text\"}]}]},\"goals\":{\"type\":\"doc\",\"content\":[{\"type\":\"paragraph\",\"content\":[{\"text\":\"Understand E-commerce Platform Components for Warehouse/Logistics.\",\"type\":\"text\"}]},{\"type\":\"paragraph\",\"content\":[{\"text\":\"Design E-commerce Platform Prototype.\",\"type\":\"text\"}]},{\"type\":\"paragraph\",\"content\":[{\"text\":\"Create a Product Backlog for the platform, focusing on key features and high-priority user stories also termed as tasks/deliverables.\",\"type\":\"text\"}]},{\"type\":\"paragraph\",\"content\":[{\"text\":\"Prepare a detailed project plan and cover the various phases of SDLC (Software Development Lifecycle).\",\"type\":\"text\"}]},{\"type\":\"paragraph\",\"content\":[{\"text\":\"Design and architect a cloud-based solution for the platform.\",\"type\":\"text\"}]},{\"type\":\"paragraph\",\"content\":[{\"text\":\"Understand AWS services like AWS S3, AWS API Gateways and AWS DynamoDB.\",\"type\":\"text\"}]},{\"type\":\"paragraph\",\"content\":[{\"text\":\"Hands on training on Creating a Lambda, API Gateway, and integration with DynamoDB\",\"type\":\"text\"}]}]},\"schedule\":\"Thursdays, 6:00 P.M. ET / 3:00 P.M. PT\",\"status\":\"archived\",\"duration\":\"8 weeks, 2-3 hours per week\",\"workshops\":{\"sessions\":[{\"name\":\"Introductions and Prepping for Success\",\"order\":1,\"description\":{\"type\":\"doc\",\"content\":[{\"type\":\"paragraph\",\"content\":[{\"text\":\"Get to know the Build Fellow and other students, learn about rewarding careers in IT software development, ask questions about the project requirements, and get ready to 'start your own warehouse and logistic ecommerce and aggregator platform'!\",\"type\":\"text\"}]}]}},{\"name\":\"Learn Agile Project \u0026 Product Management Methodology\",\"order\":2,\"description\":{\"type\":\"doc\",\"content\":[{\"type\":\"paragraph\",\"content\":[{\"text\":\"Understand and learn Agile Project Management Methodology. Also, acquire skills to create product backlog, write epics, stories, prioritization techniques and Product Roadmap.\",\"type\":\"text\"}]}]}},{\"name\":\"Prepare Project scope and document Software requirement specifications\",\"order\":3,\"description\":{\"type\":\"doc\",\"content\":[{\"type\":\"paragraph\",\"content\":[{\"text\":\"Create the scope of work of this project and translate them into technical Software Requirements Specifications.\",\"type\":\"text\"}]}]}},{\"name\":\"Design web-based application architecture\",\"order\":4,\"description\":{\"type\":\"doc\",\"content\":[{\"type\":\"paragraph\",\"content\":[{\"text\":\"Learn the various components of web-based applications and design the architecture of the Aggregator platform.\",\"type\":\"text\"}]}]}},{\"name\":\"Learn SQL and design your database and ERD (Entity relationship diagram)\",\"order\":5,\"description\":{\"type\":\"doc\",\"content\":[{\"type\":\"paragraph\",\"content\":[{\"text\":\"Learn the basics of SQL, create database, table, data definitions and design entity relationships.\",\"type\":\"text\"}]}]}},{\"name\":\"Design UI Mockups for our Aggregator Warehouse Ecommerce platform\",\"order\":6,\"description\":{\"type\":\"doc\",\"content\":[{\"type\":\"paragraph\",\"content\":[{\"text\":\"Design the UI Mockups for the platform and how the users will interact and experience the system.\",\"type\":\"text\"}]}]}},{\"name\":\"Learn AWS Cloud and its services like S3, API Gateways, DynamoDB, Restful Services\",\"order\":7,\"description\":{\"type\":\"doc\",\"content\":[{\"type\":\"paragraph\",\"content\":[{\"text\":\"Learn AWS Services like S3, API Gateways, DynamoDB and Restful services. These would be helpful for you to become a Full Stack Developer.\",\"type\":\"text\"}]}]}},{\"name\":\"Final Business Presentations\",\"order\":8,\"description\":{\"type\":\"doc\",\"content\":[{\"type\":\"paragraph\",\"content\":[{\"text\":\"Learn AWS Services like S3, API Gateways, DynamoDB and Restful services. These would be helpful for you to become a Full Stack Developer.\",\"type\":\"text\"}]}]}}]},\"fellows\":[{\"id\":\"edecbc6e-3936-4659-94e3-a53ca188be12\",\"name\":\"Rajesh Francis\",\"role\":\"Computer Systems Fellow\",\"organization\":\"Open Avenues Foundation\",\"organizationLogoUrl\":\"/images/organizations/oaf-logo.png\",\"photoUrl\":\"https://avgkrhojcamcagufngrr.supabase.co/storage/v1/object/public/fellow-headshots/edecbc6e-3936-4659-94e3-a53ca188be12.webp\",\"bio\":\"\\\"Rajesh Francis is a Software development, Computer Fellow at Open Avenues, where he works with students leading projects in field of software development.\\n\\nRajesh is an IT Director at full-time employer at Eclipse Advantage. where he works on Defining the IT roadmap for the company and executing org level IT initiatives and architecting all IT Projects. Rajesh has 24 years of experience in Business Application development and delivery. He has extensive experience in developing business solutions for Retail, Finance, HR, Learning and logistic industry. He holds a degree in Bachelor of computer applications.\\n\\nA fun fact about Rajesh: He loves trekking and cycling.\\\"\",\"linkedinUrl\":\"https://www.linkedin.com/in/rajeshfrancis/\"}],\"categories\":[\"AWS CloudFormation\",\"E-commerce Strategy\",\"Aggregator\",\"Amazon API Gateway\"],\"applicationTimeline\":[{\"label\":\"Applications open\",\"value\":\"April 13, 2026\"},{\"label\":\"Applications deadline\",\"value\":\"May 20, 2026\"},{\"label\":\"Application results released\",\"value\":\"Week of May 26, 2026\"},{\"label\":\"Project start date\",\"value\":\"Week of June 8, 2026\"},{\"label\":\"Project end date\",\"value\":\"Week of July 27, 2026\"}],\"cycle_id\":\"ae26a648-44bc-4fab-bbb0-7f9c0f6b18d9\"},\"error\":\"$undefined\"}]\n"])</script></body></html>
