277\",\"static/chunks/54a60aa6-294bb7e111b509a4.js?dpl=dpl_A9QRwtuL4hrMD2RZGqb9eW7AtxES\",\"4420\",\"static/chunks/4420-baa8329e5076733c.js?dpl=dpl_A9QRwtuL4hrMD2RZGqb9eW7AtxES\",\"2169\",\"static/chunks/2169-1d13735e35f16c75.js?dpl=dpl_A9QRwtuL4hrMD2RZGqb9eW7AtxES\",\"419\",\"static/chunks/419-9f9e6d455ee0ae85.js?dpl=dpl_A9QRwtuL4hrMD2RZGqb9eW7AtxES\",\"5288\",\"static/chunks/5288-5d7819e0848b1b1a.js?dpl=dpl_A9QRwtuL4hrMD2RZGqb9eW7AtxES\",\"6874\",\"static/chunks/6874-67c719d6db2b17af.js?dpl=dpl_A9QRwtuL4hrMD2RZGqb9eW7AtxES\",\"6766\",\"static/chunks/6766-7fcc7eadc8fee52b.js?dpl=dpl_A9QRwtuL4hrMD2RZGqb9eW7AtxES\",\"9435\",\"static/chunks/9435-28f947009b0f7d38.js?dpl=dpl_A9QRwtuL4hrMD2RZGqb9eW7AtxES\",\"2206\",\"static/chunks/2206-42291f248e6bf19d.js?dpl=dpl_A9QRwtuL4hrMD2RZGqb9eW7AtxES\",\"5782\",\"static/chunks/5782-04eaa6c475f5c3f2.js?dpl=dpl_A9QRwtuL4hrMD2RZGqb9eW7AtxES\",\"8419\",\"static/chunks/app/projects/%5Bslug%5D/page-7f8129194c3557a1.js?dpl=dpl_A9QRwtuL4hrMD2RZGqb9eW7AtxES\"],\"default\"]\n"])</script><script>self.__next_f.push([1,"b:[\"$\",\"$L19\",null,{\"project\":{\"id\":\"57d996e0-7831-43a5-98da-26b17f124cef\",\"title\":\"Thinking in Data: Optimizing Decision-Making Through Databases, SQL, and AI\",\"slug\":\"fundamentals-and-practical-applications-of-databases-sql-and-ai-1-1\",\"summary\":{\"type\":\"doc\",\"content\":[{\"type\":\"paragraph\",\"content\":[{\"text\":\"Design relational databases, write and optimize SQL queries, and integrate artificial intelligence to solve real-world data challenges.\",\"type\":\"text\"}]}]},\"description\":{\"type\":\"doc\",\"content\":[{\"type\":\"paragraph\",\"content\":[{\"text\":\"In this 8-week project, you will explore the fundamentals of databases and SQL through practical, hands-on learning. You will design relational database schemas, write basic SQL queries to manipulate and retrieve data, and gain an introduction to AI concepts by preparing data for simple analysis. This Build Project is designed for beginners and focuses on building a strong foundation in database management and data analysis skills, preparing students for entry-level tasks in the field.\",\"type\":\"text\"}]},{\"type\":\"paragraph\",\"content\":[{\"text\":\"This Build Project goes far beyond simply learning how to manage databases and write SQL queries. Through a practical and strategic approach, you will discover how organizing and structuring information reflects a logical mindset that not only optimizes data management but also enhances decision-making and problem-solving in any field. You will learn to critically analyze information, design efficient solutions, and develop a structured way of thinking that will help you tackle complex challenges in technology, business, and everyday life. Because understanding databases is not just about managing information—it’s about learning to think logically and strategically in a data-driven world.\",\"type\":\"text\"}]}]},\"project_area\":[\"Computer Science\",\"Data Science\"],\"level\":\"Intermediate\",\"levelDescription\":\"Some experience recommended\",\"prerequisites\":{\"type\":\"doc\",\"content\":[{\"type\":\"paragraph\",\"content\":[{\"text\":\"Basic familiarity using spreadsheets or tabular data: Understanding how data is organized in rows and columns (e.g., Excel or Google Sheets).\",\"type\":\"text\"}]},{\"type\":\"paragraph\",\"content\":[{\"text\":\"Eagerness to learn new technical skills: No prior coding experience is required, but a willingness to learn SQL syntax and database concepts is essential.\",\"type\":\"text\"}]},{\"type\":\"paragraph\",\"content\":[{\"text\":\"Basic logical thinking and problem-solving: Ability to break down simple problems into smaller steps and follow structured instructions.\",\"type\":\"text\"}]},{\"type\":\"paragraph\",\"content\":[{\"text\":\"Basic understanding of data relationships: Familiarity with the concept of how items in one dataset might relate to items in another (e.g., customer orders linked to customer IDs).\",\"type\":\"text\"}]}]},\"goals\":{\"type\":\"doc\",\"content\":[{\"type\":\"paragraph\",\"content\":[{\"text\":\"Design and implement relational database schemas using tools like entity-relationship diagrams (ERDs) to model real-world scenarios.\",\"type\":\"text\"}]},{\"type\":\"paragraph\",\"content\":[{\"text\":\"Write, optimize, and troubleshoot SQL queries, including advanced techniques like joins, subqueries, and indexing.\",\"type\":\"text\"}]},{\"type\":\"paragraph\",\"content\":[{\"text\":\"Develop and execute stored procedures and triggers for database automation and event-driven operations.\",\"type\":\"text\"}]},{\"type\":\"paragraph\",\"content\":[{\"text\":\"Prepare and clean datasets using SQL to meet the requirements of machine learning models.\",\"type\":\"text\"}]},{\"type\":\"paragraph\",\"content\":[{\"text\":\"Integrate SQL with AI libraries to perform predictive analysis and solve industry\",\"type\":\"text\"}]}]},\"schedule\":\"Thursdays, 11:00 A.M. ET / 8:00 A.M. PT\",\"status\":\"applications_open\",\"duration\":\"8 weeks, 2-3 hours per week\",\"workshops\":{\"sessions\":[{\"name\":\"Introduction to Databases and SQL Fundamentals\",\"order\":1,\"description\":{\"type\":\"doc\",\"content\":[{\"type\":\"paragraph\",\"content\":[{\"text\":\"This workshop introduces key concepts such as tables, relationships, and the role of Database Management Systems (DBMS).  YOU will learn basic SQL commands (SELECT, INSERT, UPDATE, DELETE) and practice these skills using SQL Fiddle. The focus will be on understanding how databases function and their importance in real-world applications.\",\"type\":\"text\"}]}]}},{\"name\":\"Database Design and Normalization\",\"order\":2,\"description\":{\"type\":\"doc\",\"content\":[{\"type\":\"paragraph\",\"content\":[{\"text\":\"You will learn the basics of database design, including creating Entity-Relationship Diagrams (ERDs) and understanding primary and foreign keys. You will also be introduced to normalization principles up to the third normal form (3NF) to eliminate redundancy and ensure data integrity.\",\"type\":\"text\"}]}]}},{\"name\":\"Intermediate SQL Queries\",\"order\":3,\"description\":{\"type\":\"doc\",\"content\":[{\"type\":\"paragraph\",\"content\":[{\"text\":\"This session focuses on SQL commands such as SELECT, JOINs (INNER, LEFT), and basic subqueries. You will also learn to filter data using WHERE clauses and sort results with ORDER BY. Hands-on exercises will include combining data from multiple tables to solve practical problems.\",\"type\":\"text\"}]}]}},{\"name\":\"Query Optimization and Indexing\",\"order\":4,\"description\":{\"type\":\"doc\",\"content\":[{\"type\":\"paragraph\",\"content\":[{\"text\":\"You will explore query optimization techniques, such as using indexes to speed up data retrieval. You will learn to use the EXPLAIN command to evaluate query performance and implement indexing strategies in their queries. Practical exercises will focus on analyzing and improving query efficiency.\",\"type\":\"text\"}]}]}},{\"name\":\"Data Preparation for AI Using SQL\",\"order\":5,\"description\":{\"type\":\"doc\",\"content\":[{\"type\":\"paragraph\",\"content\":[{\"text\":\"This workshop focuses on data cleaning techniques, such as handling missing values, removing duplicates, and transforming data for basic AI models. You will learn to prepare datasets suitable for training machine learning algorithms, ensuring the data is accurate and well-structured.\",\"type\":\"text\"}]}]}},{\"name\":\"SQL Integration with AI\",\"order\":6,\"description\":{\"type\":\"doc\",\"content\":[{\"type\":\"paragraph\",\"content\":[{\"text\":\"You will learn how to extract, clean, and prepare data using SQL for use in Python-based AI tools, such as TensorFlow and scikit-learn. This workshop covers the basics of combining SQL queries with AI models to automate decision-making and perform predictive analysis.\",\"type\":\"text\"}]}]}},{\"name\":\"Real-World Applications of Databases and AI\",\"order\":7,\"description\":{\"type\":\"doc\",\"content\":[{\"type\":\"paragraph\",\"content\":[{\"text\":\"You will explore case studies from industries such as healthcare, finance, and retail, showcasing how databases and AI are integrated to address complex problems. You will work in groups to develop project proposals using databases and AI to solve practical challenges\",\"type\":\"text\"}]}]}},{\"name\":\"Final Project Presentation\",\"order\":8,\"description\":{\"type\":\"doc\",\"content\":[{\"type\":\"paragraph\",\"content\":[{\"text\":\"In this session, you will showcase your final projects, including database designs, SQL queries, and basic AI applications. Peer feedback and evaluations will be conducted to foster collaborative learning and improve the final output.\",\"type\":\"text\"}]}]}}]},\"fellows\":[{\"id\":\"baaebe7a-9b2b-48c2-9d1f-67689427e7c0\",\"name\":\"Jorge Herrera\",\"role\":\"Computer Science Fellow\",\"organization\":\"Open Avenues Foundation\",\"organizationLogoUrl\":\"/images/organizations/oaf-logo.png\",\"photoUrl\":\"https://avgkrhojcamcagufngrr.supabase.co/storage/v1/object/public/fellow-headshots/baaebe7a-9b2b-48c2-9d1f-67689427e7c0.webp\",\"bio\":\"Jorge Herrera is a Computer Engineer and data professional with over 15 years of experience across engineering, mechanics, and technology. A graduate of Universidad Atlántida Argentina (2005), he combines strong technical expertise with a lifelong passion for learning—reading 70–80 books a year across diverse fields.\\n\\nNow based in the United States, Jorge specializes in data engineering, database design, and AI integration, helping organizations transform information into intelligent decisions. His skills include SQL optimization, Python programming, ETL development, and the application of machine learning to structured data systems.\\n\\nDriven by curiosity and versatility, Jorge’s journey spans from construction and industrial mechanics to professional motocross racing—experiences that honed his focus, discipline, and problem-solving mindset. Today, he uses technology to create practical, data-driven solutions and believes that continuous learning and collaboration are the keys to innovation.\",\"linkedinUrl\":\"https://www.linkedin.com/in/jorge-herrera-27352639\"}],\"categories\":[\"Relational Database Design\",\"SQL (Programming Language)\",\"Applications of Artificial Intelligence\",\"Query Optimization\"],\"applicationTimeline\":[{\"label\":\"Applications open\",\"value\":\"August 3, 2026\"},{\"label\":\"Applications deadline\",\"value\":\"September 3, 2026\"},{\"label\":\"Application results released\",\"value\":\"Week of September 14, 2026\"},{\"label\":\"Project start date\",\"value\":\"Week of September 28, 2026\"},{\"label\":\"Project end date\",\"value\":\"Week of November 16, 2026\"}],\"cycle_id\":\"6e8885e5-3870-4327-a19c-d88c867fa48f\"},\"error\":\"$undefined\"}]\n"])</script></body></html>
