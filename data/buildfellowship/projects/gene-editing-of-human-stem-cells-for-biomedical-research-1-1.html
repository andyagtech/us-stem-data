/54a60aa6-294bb7e111b509a4.js?dpl=dpl_A9QRwtuL4hrMD2RZGqb9eW7AtxES\",\"4420\",\"static/chunks/4420-baa8329e5076733c.js?dpl=dpl_A9QRwtuL4hrMD2RZGqb9eW7AtxES\",\"2169\",\"static/chunks/2169-1d13735e35f16c75.js?dpl=dpl_A9QRwtuL4hrMD2RZGqb9eW7AtxES\",\"419\",\"static/chunks/419-9f9e6d455ee0ae85.js?dpl=dpl_A9QRwtuL4hrMD2RZGqb9eW7AtxES\",\"5288\",\"static/chunks/5288-5d7819e0848b1b1a.js?dpl=dpl_A9QRwtuL4hrMD2RZGqb9eW7AtxES\",\"6874\",\"static/chunks/6874-67c719d6db2b17af.js?dpl=dpl_A9QRwtuL4hrMD2RZGqb9eW7AtxES\",\"6766\",\"static/chunks/6766-7fcc7eadc8fee52b.js?dpl=dpl_A9QRwtuL4hrMD2RZGqb9eW7AtxES\",\"9435\",\"static/chunks/9435-28f947009b0f7d38.js?dpl=dpl_A9QRwtuL4hrMD2RZGqb9eW7AtxES\",\"2206\",\"static/chunks/2206-42291f248e6bf19d.js?dpl=dpl_A9QRwtuL4hrMD2RZGqb9eW7AtxES\",\"5782\",\"static/chunks/5782-04eaa6c475f5c3f2.js?dpl=dpl_A9QRwtuL4hrMD2RZGqb9eW7AtxES\",\"8419\",\"static/chunks/app/projects/%5Bslug%5D/page-7f8129194c3557a1.js?dpl=dpl_A9QRwtuL4hrMD2RZGqb9eW7AtxES\"],\"default\"]\n"])</script><script>self.__next_f.push([1,"b:[\"$\",\"$L19\",null,{\"project\":{\"id\":\"aaf16025-4aba-45a9-91f0-7ea97804685c\",\"title\":\"Editing Life’s Blueprint: Stem Cell Solutions for Human Disease\",\"slug\":\"gene-editing-of-human-stem-cells-for-biomedical-research-1-1\",\"summary\":{\"type\":\"doc\",\"content\":[{\"type\":\"paragraph\",\"content\":[{\"text\":\"Explore stem cell biology and genome engineering through the lens of human disease, crafting your own concept map linking gene expression, cell signaling pathways, and differentiation outcomes in clinically relevant cell types.\",\"type\":\"text\"}]}]},\"description\":{\"type\":\"doc\",\"content\":[{\"type\":\"paragraph\",\"content\":[{\"text\":\"The cause of most human diseases are born out of cellular malfunctions, which are directly linked to gene structure and function. This Build Project addresses the challenge of genetic manipulation of human stem cells to revolutionize regenerative medicine and cell-based therapies. You will learn how to integrate advanced genome engineering tools (CRISPR/Cas9, prime editing) with stem cell biology to, reprogram, differentiate, and genetically modify human induced pluripotent stem cells (iPSCs), enabling breakthroughs in disease modeling and therapeutic development.\",\"type\":\"text\"}]},{\"type\":\"paragraph\",\"content\":[{\"text\":\"By tackling key steps in this process, such as choosing the right gene-editing strategy for a given target, derivation of genetically modified iPSCs clones and the manipulation of cell signaling pathways to guide the production of specific cell types by in vitro iPSC differentiation, you will gain a solid understanding of the current biotechnological challenges for the creation of clinically relevant cells and tissues. By the end of the project, you will create a slide deck where you will design a concept map linking gene editing, gene expression, cell signaling pathways, and differentiation outcomes in clinically relevant cell types. This interdisciplinary training will empower you to design innovative genome engineering strategies, refine cell differentiation protocols, and develop the professional expertise needed to participate in cell therapy projects, addressing genetic disorders, cancer, and degenerative diseases.\",\"type\":\"text\"}]}]},\"project_area\":[\"Biology \u0026 Healthcare\"],\"level\":\"Intermediate\",\"levelDescription\":\"Some experience recommended\",\"prerequisites\":{\"type\":\"doc\",\"content\":[{\"type\":\"paragraph\",\"content\":[{\"text\":\"Basic knowledge of molecular biology, mainly the relationship between DNA, RNA and proteins: You must know how DNA is transcribed to RNA and translated to proteins. You should understand the structure and function of nucleic acids, the processes of replication, transcription, and translation, and how genes code for proteins.\",\"type\":\"text\"}]},{\"type\":\"paragraph\",\"content\":[{\"text\":\"A general understanding of embryonic development and cell differentiation: You should comprehend how a fertilized egg develops through stages (cleavage, gastrulation) and how unspecialized cells (stem cells) differentiate into specialized cell types.\",\"type\":\"text\"}]},{\"type\":\"paragraph\",\"content\":[{\"text\":\"Comprehension of molecular biology techniques, such as PCR, electrophoresis and DNA sequencing: You should understand the methods of PCR DNA amplification, nucleic acid separation by size and determining the nucleotide sequence. You must know how these techniques are applied in research and diagnostics.\",\"type\":\"text\"}]}]},\"goals\":{\"type\":\"doc\",\"content\":[{\"type\":\"paragraph\",\"content\":[{\"text\":\"Understand the biomedical capabilities of human stem cells and the fundamental concepts for the generation of adult human cell types through the process of human embryonic development.\",\"type\":\"text\"}]},{\"type\":\"paragraph\",\"content\":[{\"text\":\"Identify the key laboratory methods necessary for cell reprograming for the creation of induced pluripotent stem cells generation (iPSC).\",\"type\":\"text\"}]},{\"type\":\"paragraph\",\"content\":[{\"text\":\"Acquire the foundational knowledge required for working with iPSC for in vitro cell culture, as well as directed and guided cell differentiation.\",\"type\":\"text\"}]},{\"type\":\"paragraph\",\"content\":[{\"text\":\"Design CRISPR-Cas9 gene-editing workflows for the accurate and deliberate manipulation of genetic information, as a critical tool for biomedical research, gene therapy and cell therapy.\",\"type\":\"text\"}]}]},\"schedule\":\"Wednesdays, 5:00 P.M. ET / 2:00 P.M. PT\",\"status\":\"archived\",\"duration\":\"8 weeks, 2-3 hours per week\",\"workshops\":{\"sessions\":[{\"name\":\"Introduction and foundations of embryonic cell differentiation\",\"order\":1,\"description\":{\"type\":\"doc\",\"content\":[{\"type\":\"paragraph\",\"content\":[{\"text\":\"In our first workshop, I will introduce myself and invite you to do the same, helping us get to know each other and build a supportive environment. I'll then present the main idea of this Build Project, clearly outlining what you will be working on, what the final deliverable looks like, and the general timeline. A general overview of human embryonic development and differentiation of mature cell types will be presented.\",\"type\":\"text\"}]}]}},{\"name\":\"iPSC Generation and Cellular Reprogramming\",\"order\":2,\"description\":{\"type\":\"doc\",\"content\":[{\"type\":\"paragraph\",\"content\":[{\"text\":\"In our second workshop, you'll explore the mechanisms of cellular reprogramming to understand how specialized cells can revert to a pluripotent state. You'll identify key transcription factors—like Oct4, Sox2, Klf4, and c-Myc—that drive iPSC generation, and compare reprogramming methods such as viral vectors, RNA-based techniques, and small-molecule approaches to evaluate their efficiency and safety.\",\"type\":\"text\"}]}]}},{\"name\":\"Stem Cell Culture and Maintenance\",\"order\":3,\"description\":{\"type\":\"doc\",\"content\":[{\"type\":\"paragraph\",\"content\":[{\"text\":\"In this session, you'll learn essential stem cell culture techniques by exploring practical maintenance in vitro—focusing on media formulation, passaging, and cryopreservation. To apply this, you'll complete a virtual lab simulation via slide deck and develop a troubleshooting guide for common culture challenges.\",\"type\":\"text\"}]}]}},{\"name\":\"Cell Signaling and Gene Expression in Stem Cells and Cell Differentiation\",\"order\":4,\"description\":{\"type\":\"doc\",\"content\":[{\"type\":\"paragraph\",\"content\":[{\"text\":\"In our fourth workshop, you will analyze key signaling pathways—like Wnt, Notch, and BMP—that regulate gene expression and drive cell differentiation, while exploring epigenetic mechanisms that maintain stemness. You will also examine molecular tools such as RNA-seq and ChIP-seq for tracking gene expression changes.\",\"type\":\"text\"}]}]}},{\"name\":\"Introduction to CRISPR/Cas9 Genome Engineering\",\"order\":5,\"description\":{\"type\":\"doc\",\"content\":[{\"type\":\"paragraph\",\"content\":[{\"text\":\"In this workshop, we will explore the insides of CRISPR/Cas9 —including system components and mechanisms—while learning guide RNA design and DNA repair analysis. You will then apply this knowledge to design target-specific guide RNAs and evaluate potential off-target effects using bioinformatics tools, focusing on applications in stem cell research.\",\"type\":\"text\"}]}]}},{\"name\":\"Advanced Gene Editing Techniques\",\"order\":6,\"description\":{\"type\":\"doc\",\"content\":[{\"type\":\"paragraph\",\"content\":[{\"text\":\"In our sixth session, you will compare homology-directed and non-homologous end-join DNA repair pathways, understand prime and base editing mechanisms, and evaluate methods to assess editing efficiency. Focusing on precision-enhancing techniques like homology-directed repair and prime editing, you'll be able to design a complete gene knock-in strategy to correct a disease-causing mutation.\",\"type\":\"text\"}]}]}},{\"name\":\"Differentiation Protocols for Specific Cell Lineages\",\"order\":7,\"description\":{\"type\":\"doc\",\"content\":[{\"type\":\"paragraph\",\"content\":[{\"text\":\"In this workshop, you will learn about in vitro differentiation principles by comparing stem cell differentiation protocols for neuronal (ectoderm), muscle (mesoderm), and pancreatic (endoderm) cell fates. You will analyze key markers of successful differentiation and apply these strategies to design a step-by-step differentiation protocol flowchart for a therapeutically relevant cell type.\",\"type\":\"text\"}]}]}},{\"name\":\"Case studies presentations\",\"order\":8,\"description\":{\"type\":\"doc\",\"content\":[{\"type\":\"paragraph\",\"content\":[{\"text\":\"In our last session, you will present a structured slide deck case study outlining a step-by-step workflow for reprogramming iPSCs, CRISPR/Cas9 editing, and disease-specific differentiation. Your strategy will summarize key laboratory methods in stem cell engineering and include a concept map linking gene expression, signaling pathways, and differentiation outcomes in clinical cell types.\",\"type\":\"text\"}]}]}}]},\"fellows\":[{\"id\":\"7f60c447-9f5f-4994-b926-60064b100c51\",\"name\":\"Oscar Tarazona\",\"role\":\"Molecular Biology Fellow\",\"organization\":\"Open Avenues Foundation\",\"organizationLogoUrl\":\"/images/organizations/oaf-logo.png\",\"photoUrl\":\"https://avgkrhojcamcagufngrr.supabase.co/storage/v1/object/public/fellow-headshots/7f60c447-9f5f-4994-b926-60064b100c51.webp\",\"bio\":\"\\\"Oscar Tarazona is a Molecular Biology Build Fellow at Open Avenues, where he works with students leading projects in molecular biology.\\n\\nOscar is a Senior Cell scientist at Somite Therapeutics, where he focuses on the discovery and optimization of stem cell differentiation pathways for the use in regenerative medicine.\\n\\nOscar has over 7 years of experience in the stem cell biology and genome engineering field. He has led projects on genome-wide analysis of gene expression and epigenetic regulation during in vitro differentiation of human stem cells into mature cell types of the musculoskeletal system.\\n\\nHe holds a PhD in Zoology from the University of Florida.\\n\\nA fun fact about Oscar is that he is passionate about animal evolution and loves spending time in nature. He maintains an active lifestyle by biking an hour to work each day, and unwinds by reading traditional paper books and enjoying a good movie.\\n\\\"\",\"linkedinUrl\":\"https://www.linkedin.com/in/oscar-tarazona-50512a307/\"}],\"categories\":[\"CRISPR Gene Editing\",\"Stem Cell Biology\",\"Gene Therapy\",\"Regenerative Medicine\"],\"applicationTimeline\":[{\"label\":\"Applications open\",\"value\":\"April 13, 2026\"},{\"label\":\"Applications deadline\",\"value\":\"May 20, 2026\"},{\"label\":\"Application results released\",\"value\":\"Week of May 26, 2026\"},{\"label\":\"Project start date\",\"value\":\"Week of June 8, 2026\"},{\"label\":\"Project end date\",\"value\":\"Week of July 27, 2026\"}],\"cycle_id\":\"ae26a648-44bc-4fab-bbb0-7f9c0f6b18d9\"},\"error\":\"$undefined\"}]\n"])</script></body></html>
