\",\"static/chunks/54a60aa6-294bb7e111b509a4.js?dpl=dpl_A9QRwtuL4hrMD2RZGqb9eW7AtxES\",\"4420\",\"static/chunks/4420-baa8329e5076733c.js?dpl=dpl_A9QRwtuL4hrMD2RZGqb9eW7AtxES\",\"2169\",\"static/chunks/2169-1d13735e35f16c75.js?dpl=dpl_A9QRwtuL4hrMD2RZGqb9eW7AtxES\",\"419\",\"static/chunks/419-9f9e6d455ee0ae85.js?dpl=dpl_A9QRwtuL4hrMD2RZGqb9eW7AtxES\",\"5288\",\"static/chunks/5288-5d7819e0848b1b1a.js?dpl=dpl_A9QRwtuL4hrMD2RZGqb9eW7AtxES\",\"6874\",\"static/chunks/6874-67c719d6db2b17af.js?dpl=dpl_A9QRwtuL4hrMD2RZGqb9eW7AtxES\",\"6766\",\"static/chunks/6766-7fcc7eadc8fee52b.js?dpl=dpl_A9QRwtuL4hrMD2RZGqb9eW7AtxES\",\"9435\",\"static/chunks/9435-28f947009b0f7d38.js?dpl=dpl_A9QRwtuL4hrMD2RZGqb9eW7AtxES\",\"2206\",\"static/chunks/2206-42291f248e6bf19d.js?dpl=dpl_A9QRwtuL4hrMD2RZGqb9eW7AtxES\",\"5782\",\"static/chunks/5782-04eaa6c475f5c3f2.js?dpl=dpl_A9QRwtuL4hrMD2RZGqb9eW7AtxES\",\"8419\",\"static/chunks/app/projects/%5Bslug%5D/page-7f8129194c3557a1.js?dpl=dpl_A9QRwtuL4hrMD2RZGqb9eW7AtxES\"],\"default\"]\n"])</script><script>self.__next_f.push([1,"b:[\"$\",\"$L19\",null,{\"project\":{\"id\":\"227cec03-83ee-4d1e-a8b8-12af780d2b84\",\"title\":\"Alpha Lab: Building a Quant Strategy from Real-Time U.S. Equity Data\",\"slug\":\"alpha-lab-building-a-quant-strategy-from-real-time-u-s-equity-data\",\"summary\":{\"type\":\"doc\",\"content\":[{\"type\":\"paragraph\",\"content\":[{\"text\":\"Predict short-term price movements in U.S. equities by designing and implementing a quantitative model using real-time market data.\",\"type\":\"text\"}]}]},\"description\":{\"type\":\"doc\",\"content\":[{\"type\":\"paragraph\",\"content\":[{\"text\":\"Have you ever wondered how quantitative researchers and data scientists try to predict movements in the stock market? In this project, you will explore one of the most challenging and exciting problems in finance: predicting short-term price movements in U.S. equities. You’ll work with real-time U.S. equity market data, clean and analyze it using Python, and turn raw price and volume information into simple predictive features. From there, you’ll build and test short-term prediction models, evaluate their performance, and learn how professionals decide whether a model is genuinely useful—or just looks good on paper.\",\"type\":\"text\"}]},{\"type\":\"paragraph\",\"content\":[{\"text\":\"Along the way, you’ll encounter challenges that come up all the time in real finance and data science roles, such as imperfect data, overfitting, unstable model performance, and changing market behavior. By tackling these issues hands-on, you’ll build practical skills that translate directly to entry-level roles in quantitative finance, trading, fintech, and data science—while gaining a clearer picture of what working with financial data looks like day to day.\",\"type\":\"text\"}]}]},\"project_area\":[\"Finance\",\"Data Science\"],\"level\":\"Expert\",\"levelDescription\":\"Advanced experience required\",\"prerequisites\":{\"type\":\"doc\",\"content\":[{\"type\":\"paragraph\",\"content\":[{\"text\":\"Proficiency in Python for data analysis, including the ability to manipulate time-indexed, multi-indexed dataframe using Pandas, perform numerical operations with NumPy, visualize portfolio performance and structure multiple plots using Matplotlib, and write modular, reproducible research codes.\",\"type\":\"text\"}]},{\"type\":\"paragraph\",\"content\":[{\"text\":\"Foundational understanding of financial time series, returns, and order book data, including concepts such as log returns, volatility, autocorrelation, non-stationarity, and basic order book structure\",\"type\":\"text\"}]},{\"type\":\"paragraph\",\"content\":[{\"text\":\"Introductory understanding of statistical modeling principles, including Ordinary Least Squares (OLS) regression, bias-variance tradeoff, overfitting, regularization and importance of out-of-sample validation.\",\"type\":\"text\"}]},{\"type\":\"paragraph\",\"content\":[{\"text\":\"Ability to interpret model results via portfolio performance metrics, including why measures such as cumulative returns, Sharpe ratio, drawdowns, and turnover are more meaningful than raw prediction accuracy in trading contexts.\",\"type\":\"text\"}]}]},\"goals\":{\"type\":\"doc\",\"content\":[{\"type\":\"paragraph\",\"content\":[{\"text\":\"Explain how a quantitative trading strategy is developed from start to finish, and describe how U.S. equity markets work, including short-term price movements, trading volume, and basic order book behavior.\",\"type\":\"text\"}]},{\"type\":\"paragraph\",\"content\":[{\"text\":\"Collect, clean, and analyze real-time U.S. equity market data by building a simple and reliable data pipeline using Python, Pandas, NumPy, and market data APIs.\",\"type\":\"text\"}]},{\"type\":\"paragraph\",\"content\":[{\"text\":\"Create and evaluate quantitative features, such as returns, volatility, and order flow signals, and measure their usefulness using standard performance metrics like Information Coefficient (IC), factor returns, and Sharpe ratio.\",\"type\":\"text\"}]},{\"type\":\"paragraph\",\"content\":[{\"text\":\"Build and test short-term price prediction models using linear regression in Python, applying rolling-window training and walk-forward validation to reduce overfitting and look-ahead bias.\",\"type\":\"text\"}]},{\"type\":\"paragraph\",\"content\":[{\"text\":\"Evaluate and interpret trading model performance using risk-adjusted metrics (e.g., Sharpe ratio, drawdowns, turnover, and PnL after costs), and discuss key limitations, risks, and challenges of using these models in real-world trading.\",\"type\":\"text\"}]}]},\"schedule\":\"Fridays, 5:00 P.M. ET / 2:00 P.M. PT\",\"status\":\"active\",\"duration\":\"8 weeks, 2-3 hours per week\",\"workshops\":{\"sessions\":[{\"name\":\"Introduction to the U.S. Equity Markets \u0026 Quantitative Prediction\",\"order\":1,\"description\":{\"type\":\"doc\",\"content\":[{\"type\":\"paragraph\",\"content\":[{\"text\":\"Get a high-level overview of U.S. equity markets and the quantitative research process. You will also set up your Python environment and project repository, so you are ready for hands-on work.\",\"type\":\"text\"}]}]}},{\"name\":\"Market Data Acquisition \u0026 Data Analysis\",\"order\":2,\"description\":{\"type\":\"doc\",\"content\":[{\"type\":\"paragraph\",\"content\":[{\"text\":\"Learn how to load and inspect intraday market data, including prices, volume, and timestamps. You will clean up basic data issues and explore key patterns that will support later feature design.\",\"type\":\"text\"}]}]}},{\"name\":\"Feature Construction from Short-Term Market Signals\",\"order\":3,\"description\":{\"type\":\"doc\",\"content\":[{\"type\":\"paragraph\",\"content\":[{\"text\":\"Translate short-term market behaviors, such as price changes, volume spikes, and trade pressure, into simple quantitative features. You will implement these features in a reproducible Python workflow.\",\"type\":\"text\"}]}]}},{\"name\":\"Feature Evaluation, Statistical Testing \u0026 Refinement\",\"order\":4,\"description\":{\"type\":\"doc\",\"content\":[{\"type\":\"paragraph\",\"content\":[{\"text\":\"Evaluate whether your features are useful for predicting future returns. You will examine feature correlations, stability across time, and refine your feature set based on evidence.\",\"type\":\"text\"}]}]}},{\"name\":\"Linear Regression Modeling I: Model Setup \u0026 Interpretation\",\"order\":5,\"description\":{\"type\":\"doc\",\"content\":[{\"type\":\"paragraph\",\"content\":[{\"text\":\"Build a simple linear regression model using your selected features. You will learn how to interpret model outputs and understand why linear models are often used as baseline tools in quantitative research.\",\"type\":\"text\"}]}]}},{\"name\":\"Linear Regression Modeling II: Model Diagnostics \u0026 Improvement\",\"order\":6,\"description\":{\"type\":\"doc\",\"content\":[{\"type\":\"paragraph\",\"content\":[{\"text\":\"Test your model using walk-forward or rolling-window validation. You will evaluate out-of-sample performance, coefficient stability, and you will try to make simple improvements to the models.\",\"type\":\"text\"}]}]}},{\"name\":\"Back-testing \u0026 Risk-Adjusted Performance Evaluation\",\"order\":7,\"description\":{\"type\":\"doc\",\"content\":[{\"type\":\"paragraph\",\"content\":[{\"text\":\"Use your model generated signal in a simplified back-testing framework. You will evaluate strategy performance using risk-adjusted metrics, not just headline returns.\",\"type\":\"text\"}]}]}},{\"name\":\"Final Presentations, Review \u0026 Quantitative Research Discussion\",\"order\":8,\"description\":{\"type\":\"doc\",\"content\":[{\"type\":\"paragraph\",\"content\":[{\"text\":\"Present your end-to-end research process, including data cleaning, feature design, modeling, and back-test results. You will discuss assumptions and possible improvements in a buyside-research-style review.\",\"type\":\"text\"}]}]}}]},\"fellows\":[{\"id\":\"1bb42524-58d7-4c45-ba29-8646539c5601\",\"name\":\"Jieyu Zhang\",\"role\":\"Finance Fellow\",\"organization\":\"Open Avenues Foundation\",\"organizationLogoUrl\":\"/images/organizations/oaf-logo.png\",\"photoUrl\":\"https://avgkrhojcamcagufngrr.supabase.co/storage/v1/object/public/fellow-headshots/1bb42524-58d7-4c45-ba29-8646539c5601.webp\",\"bio\":\"Jieyu Zhang is a Finance Build Fellow at Open Avenue Foundation, where she works with students leading projects in Quantitative Finance and Systematic Investing.\\n\\nJieyu is a Quantitative Researcher at Citadel Securities, where she focuses on developing  highly automated quantitative trading strategies using sophisticated computational and statistical techniques.\\n\\nJieyu has over 3 years of experience in the Quantitative Research field, with expertise spanning alpha research, portfolio construction, and live trading.\\n\\nShe holds a Master of Financial Engineering degree from UC Berkeley, Prior to that, she graduated from Tsinghua University, with a major in Finance and a minor in Data Science and Technology.\\n\\nOutside of work, Jieyu is an avid table tennis enthusiast and is always happy to connect over a match.\",\"linkedinUrl\":\"https://www.linkedin.com/in/hestia-jieyu-zhang/\"}],\"categories\":[\"Quantitative Trading\",\"Data Analysis\",\"Statistical Modelling\",\"Python\"],\"applicationTimeline\":[{\"label\":\"Applications open\",\"value\":\"May 11, 2026\"},{\"label\":\"Applications deadline\",\"value\":\"June 11, 2026\"},{\"label\":\"Application results released\",\"value\":\"Week of June 22, 2026\"},{\"label\":\"Project start date\",\"value\":\"Week of July 6, 2026\"},{\"label\":\"Project end date\",\"value\":\"Week of August 24, 2026\"}],\"cycle_id\":\"04780f7f-10bb-4b43-8480-8ef15da1b3cc\"},\"error\":\"$undefined\"}]\n"])</script></body></html>
