\"4420\",\"static/chunks/4420-baa8329e5076733c.js?dpl=dpl_A9QRwtuL4hrMD2RZGqb9eW7AtxES\",\"2169\",\"static/chunks/2169-1d13735e35f16c75.js?dpl=dpl_A9QRwtuL4hrMD2RZGqb9eW7AtxES\",\"419\",\"static/chunks/419-9f9e6d455ee0ae85.js?dpl=dpl_A9QRwtuL4hrMD2RZGqb9eW7AtxES\",\"5288\",\"static/chunks/5288-5d7819e0848b1b1a.js?dpl=dpl_A9QRwtuL4hrMD2RZGqb9eW7AtxES\",\"6874\",\"static/chunks/6874-67c719d6db2b17af.js?dpl=dpl_A9QRwtuL4hrMD2RZGqb9eW7AtxES\",\"6766\",\"static/chunks/6766-7fcc7eadc8fee52b.js?dpl=dpl_A9QRwtuL4hrMD2RZGqb9eW7AtxES\",\"9435\",\"static/chunks/9435-28f947009b0f7d38.js?dpl=dpl_A9QRwtuL4hrMD2RZGqb9eW7AtxES\",\"2206\",\"static/chunks/2206-42291f248e6bf19d.js?dpl=dpl_A9QRwtuL4hrMD2RZGqb9eW7AtxES\",\"5782\",\"static/chunks/5782-04eaa6c475f5c3f2.js?dpl=dpl_A9QRwtuL4hrMD2RZGqb9eW7AtxES\",\"8419\",\"static/chunks/app/projects/%5Bslug%5D/page-7f8129194c3557a1.js?dpl=dpl_A9QRwtuL4hrMD2RZGqb9eW7AtxES\"],\"default\"]\n1a:T461,Human rights violations across the Americas continue to challenge governments, courts, and civil society. Understanding how to analyze these violations through regional legal frameworks and advocate effectively before international bodies is a critical skill for aspiring legal professionals and policy advocates. In this Build Project, you’ll wear the hat of a Human Rights Legal Advocate and develop a full legal case based on real-world violations, simulating proceedings before the Inter-American Commission or Court of Human Rights. Under the supervision of an experienced legal professional, you’ll examine facts, identify applicable legal norms, and conduct legal research on relevant treaties, jurisprudence, and comparative frameworks to build strong legal arguments. You’ll"])</script><script>self.__next_f.push([1," become familiar with tools and methodologies such as treaty interpretation, jurisprudential analysis, comparative legal reasoning, international legal writing skills, and oral advocacy strategy. All of this will take place in a collaborative environment that simulates the workflow of an international litigation and advocacy team.1b:T642,Pámmely is a Law Build Fellow at the Open Avenues Foundation, where she works with students leading projects in international law and human rights advocacy.\n\nPámmely is an International Lawyer at C\u0026E Abogados S.A.S, where she advises clients on complex legal matters—including international human rights law, administrative law, and constitutional claims—conducts legal research and prepares submissions for potential cases before international bodies such as the Inter-American Commission on Human Rights (IACHR), and collaborates with interdisciplinary teams to develop advocacy strategies for high-impact human rights cases.\n\nShe has over eight years of professional experience in the legal and policy field. She has worked as a criminal lawyer, legislative director, and human rights researcher. She has led advocacy projects on transitional justice, prison reform, and the rights of armed conflict victims in Colombia, and has contributed to international legal research and case preparation before bodies such as the IACHR.\n\nShe holds an LL.M. in International Legal Studies from New York University (NYU), a Specialization in Criminal and Criminological Sciences from Universidad Externado, and dual degrees in Law and Business Administration from Pontificia Universidad Javeriana.\n\nOutside of her legal work, Pámmely enjoys sharing her Colombian culture—especially through salsa dancing and inviting others to discover Colombian cuisine. She also loves traveling, trying new foods from different countries, and is currently learning Portuguese and teaching herself how to roller skate."])</script><script>self.__next_f.push([1,"b:[\"$\",\"$L19\",null,{\"project\":{\"id\":\"cd68b70d-c5c1-4aca-87ef-1fd5e1d90bdb\",\"title\":\"Building Legal Cases for Human Rights\",\"slug\":\"building-legal-cases-for-human-rights\",\"summary\":{\"type\":\"doc\",\"content\":[{\"type\":\"paragraph\",\"content\":[{\"text\":\"Investigate real-world human rights violations and simulate litigation before regional human rights bodies, developing legal arguments, briefs, and advocacy skills throughout the process.\",\"type\":\"text\"}]}]},\"description\":{\"type\":\"doc\",\"content\":[{\"type\":\"paragraph\",\"content\":[{\"text\":\"$1a\",\"type\":\"text\"}]}]},\"project_area\":[\"Business\"],\"level\":\"Beginner\",\"levelDescription\":\"No prior experience required\",\"prerequisites\":{\"type\":\"doc\",\"content\":[{\"type\":\"paragraph\",\"content\":[{\"text\":\"An interest in international human rights litigation or legal advocacy.\",\"type\":\"text\"}]},{\"type\":\"paragraph\",\"content\":[{\"text\":\"Comfort reading and processing complex, text-heavy materials, such as reports, decisions, or institutional documents.\",\"type\":\"text\"}]},{\"type\":\"paragraph\",\"content\":[{\"text\":\"Basic writing and communication skills, with a willingness to develop legal argumentation in both written and oral form.\",\"type\":\"text\"}]},{\"type\":\"paragraph\",\"content\":[{\"text\":\"Analytical thinking and logical reasoning, especially when working with case-based scenarios.\",\"type\":\"text\"}]},{\"type\":\"paragraph\",\"content\":[{\"text\":\"Strong reading comprehension and attention to detail.\",\"type\":\"text\"}]}]},\"goals\":{\"type\":\"doc\",\"content\":[{\"type\":\"paragraph\",\"content\":[{\"text\":\"Understand the foundations of public international law and international human rights law, including key treaties, institutions, and enforcement mechanisms.\",\"type\":\"text\"}]},{\"type\":\"paragraph\",\"content\":[{\"text\":\"Distinguish between universal and regional human rights systems, with a focus on the Inter-American Human Rights System.\",\"type\":\"text\"}]},{\"type\":\"paragraph\",\"content\":[{\"text\":\"Analyze human rights cases from the Inter-American Commission and Court, applying relevant legal norms and precedents.\",\"type\":\"text\"}]},{\"type\":\"paragraph\",\"content\":[{\"text\":\"Apply legal research techniques to identify relevant norms, precedents, and institutional mechanisms for regional accountability.\",\"type\":\"text\"}]},{\"type\":\"paragraph\",\"content\":[{\"text\":\"Draft legal advocacy documents — including a legal mapping worksheet, case brief, and written legal argument — consistent with the procedures and standards of the Inter-American Commission and Court of Human Rights.\",\"type\":\"text\"}]}]},\"schedule\":\"Wednesdays, 5:00 P.M. ET / 2:00 P.M. PT\",\"status\":\"archived\",\"duration\":\"8 weeks, 2-3 hours per week\",\"workshops\":{\"sessions\":[{\"name\":\"Explore Human Rights Systems\",\"order\":1,\"description\":{\"type\":\"doc\",\"content\":[{\"type\":\"paragraph\",\"content\":[{\"text\":\"You’ll learn the basics of international law and human rights systems, including how treaties work and where individuals can bring legal claims. This session will help you understand the legal mechanisms behind global accountability.\",\"type\":\"text\"}]}]}},{\"name\":\"Choose Your Case\",\"order\":2,\"description\":{\"type\":\"doc\",\"content\":[{\"type\":\"paragraph\",\"content\":[{\"text\":\"You’ll dive into the Inter-American Human Rights System, analyze past cases, and choose a track (Commission or Court). You’ll also select the issue or case that will guide your work throughout the project.\",\"type\":\"text\"}]}]}},{\"name\":\"Map the Legal Framework\",\"order\":3,\"description\":{\"type\":\"doc\",\"content\":[{\"type\":\"paragraph\",\"content\":[{\"text\":\"You’ll identify the treaties and rights relevant to your case and begin building your legal argument. You’ll connect facts to norms and cite precedent to support your claims using a legal mapping worksheet.\",\"type\":\"text\"}]}]}},{\"name\":\"Build Your Legal Strategy\",\"order\":4,\"description\":{\"type\":\"doc\",\"content\":[{\"type\":\"paragraph\",\"content\":[{\"text\":\"Using your legal mapping and precedent analysis, you’ll define your theory of the case. You’ll outline your core arguments, rights violations, and link them to international standards. This outline will guide your final brief.\",\"type\":\"text\"}]}]}},{\"name\":\"Draft the Legal Brief (Part I)\",\"order\":5,\"description\":{\"type\":\"doc\",\"content\":[{\"type\":\"paragraph\",\"content\":[{\"text\":\"You’ll begin drafting your legal advocacy memo, focusing on the statement of facts and legal arguments. You’ll receive feedback to strengthen clarity and structure.\",\"type\":\"text\"}]}]}},{\"name\":\"Prepare to Present\",\"order\":6,\"description\":{\"type\":\"doc\",\"content\":[{\"type\":\"paragraph\",\"content\":[{\"text\":\"You’ll build a visual case summary and outline your oral pitch. Learn how to communicate your legal arguments to different audiences clearly and persuasively.\",\"type\":\"text\"}]}]}},{\"name\":\"Finalize Your Brief\",\"order\":7,\"description\":{\"type\":\"doc\",\"content\":[{\"type\":\"paragraph\",\"content\":[{\"text\":\"You’ll refine and complete your legal advocacy memo based on feedback. You’ll also peer review a classmate’s draft and apply improvements to your own.\",\"type\":\"text\"}]}]}},{\"name\":\"Present Your Case\",\"order\":8,\"description\":{\"type\":\"doc\",\"content\":[{\"type\":\"paragraph\",\"content\":[{\"text\":\"You’ll deliver a short oral presentation using your visual summary and legal memo. Afterward, we’ll reflect on your growth and the skills you’ve developed through the project.\",\"type\":\"text\"}]}]}}]},\"fellows\":[{\"id\":\"916431e0-8453-4594-a548-e1ca2f1b36e3\",\"name\":\"Pammely Correa Florez\",\"role\":\"Law Fellow\",\"organization\":\"Open Avenues Foundation\",\"organizationLogoUrl\":\"/images/organizations/oaf-logo.png\",\"photoUrl\":\"https://avgkrhojcamcagufngrr.supabase.co/storage/v1/object/public/fellow-headshots/916431e0-8453-4594-a548-e1ca2f1b36e3.webp\",\"bio\":\"$1b\",\"linkedinUrl\":\"www.linkedin.com/in/pammelycorreaf\"}],\"categories\":[\"International Law\",\"Human Rights Law\",\"International Legal Advocacy\",\"Legal Research and Writing\",\"Strategic Litigation\"],\"applicationTimeline\":[{\"label\":\"Applications open\",\"value\":\"August 22, 2025\"},{\"label\":\"Applications deadline\",\"value\":\"September 14, 2025\"},{\"label\":\"Application results released\",\"value\":\"Week of September 22, 2025\"},{\"label\":\"Project start date\",\"value\":\"Week of October 6, 2025\"},{\"label\":\"Project end date\",\"value\":\"Week of November 24, 2025\"}],\"cycle_id\":\"d946e325-002e-4658-8923-05bdc47dc4a6\"},\"error\":\"$undefined\"}]\n"])</script></body></html>
