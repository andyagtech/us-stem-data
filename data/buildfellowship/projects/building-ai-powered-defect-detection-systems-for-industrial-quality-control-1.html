RwtuL4hrMD2RZGqb9eW7AtxES\",\"277\",\"static/chunks/54a60aa6-294bb7e111b509a4.js?dpl=dpl_A9QRwtuL4hrMD2RZGqb9eW7AtxES\",\"4420\",\"static/chunks/4420-baa8329e5076733c.js?dpl=dpl_A9QRwtuL4hrMD2RZGqb9eW7AtxES\",\"2169\",\"static/chunks/2169-1d13735e35f16c75.js?dpl=dpl_A9QRwtuL4hrMD2RZGqb9eW7AtxES\",\"419\",\"static/chunks/419-9f9e6d455ee0ae85.js?dpl=dpl_A9QRwtuL4hrMD2RZGqb9eW7AtxES\",\"5288\",\"static/chunks/5288-5d7819e0848b1b1a.js?dpl=dpl_A9QRwtuL4hrMD2RZGqb9eW7AtxES\",\"6874\",\"static/chunks/6874-67c719d6db2b17af.js?dpl=dpl_A9QRwtuL4hrMD2RZGqb9eW7AtxES\",\"6766\",\"static/chunks/6766-7fcc7eadc8fee52b.js?dpl=dpl_A9QRwtuL4hrMD2RZGqb9eW7AtxES\",\"9435\",\"static/chunks/9435-28f947009b0f7d38.js?dpl=dpl_A9QRwtuL4hrMD2RZGqb9eW7AtxES\",\"2206\",\"static/chunks/2206-42291f248e6bf19d.js?dpl=dpl_A9QRwtuL4hrMD2RZGqb9eW7AtxES\",\"5782\",\"static/chunks/5782-04eaa6c475f5c3f2.js?dpl=dpl_A9QRwtuL4hrMD2RZGqb9eW7AtxES\",\"8419\",\"static/chunks/app/projects/%5Bslug%5D/page-7f8129194c3557a1.js?dpl=dpl_A9QRwtuL4hrMD2RZGqb9eW7AtxES\"],\"default\"]\n1a:T574,Sri Chakra is a Data Science Build Fellow at Open Avenues Foundation, where he works with students leading projects in Data Science.\n\nSri Chakra is a Software/Image Processing Engineer at Infravis, where he focuses on building machine vision systems for railroad inspection and monitoring. He specializes in developing deep learning models, image processing algorithms, and building internal tools and agentic workflows that enhance productivity and operational efficiency.\n\nSri Chakra has over 8 years of experience in machine learning and computer vision across industrial automation and technology sectors. After his Bachelor's in Electrical \u0026 Electronics Engineering at BIT Mesra, he started his career at Tata Steel leading process improvement initiatives, then pursued dual Master's "])</script><script>self.__next_f.push([1,"degrees at Cornell Tech and Technion conducting research in Computer Vision \u0026 NLP. During his studies, he developed machine learning algorithms at Trimble Inc. and worked on real-time human volumetric reconstruction at Sony R\u0026D in Tokyo. Most recently, he served as a Machine Vision Engineer at Wabtec Corporation for nearly 3 years, where he was the lead developer for TruckView® and made significant contributions to CSCView®, TreadView®, and BrakeView® systems.\n\nFun fact, Sri is often found taking pictures with his mobile camera, drawn to the subtle beauty of nature, or teaching himself Japanese.\n"])</script><script>self.__next_f.push([1,"b:[\"$\",\"$L19\",null,{\"project\":{\"id\":\"82fc719e-8d2a-4a7f-96c1-b8e493bc96be\",\"title\":\"AI-Powered Industrial Quality Control: Build a Visual Defect Detection System\",\"slug\":\"building-ai-powered-defect-detection-systems-for-industrial-quality-control-1\",\"summary\":{\"type\":\"doc\",\"content\":[{\"type\":\"paragraph\",\"content\":[{\"text\":\"Build an end-to-end machine vision system that automatically detects surface defects in manufacturing environments using deep learning and computer vision techniques.\",\"type\":\"text\"}]}]},\"description\":{\"type\":\"doc\",\"content\":[{\"type\":\"paragraph\",\"content\":[{\"text\":\"Automated quality control is essential in manufacturing, automotive, electronics, and other industries, enabling real-time, high-precision inspection of products at scale using intelligent machine vision systems. By replacing or augmenting manual inspection with AI-powered defect detection, manufacturers can ensure uniform quality standards, detect minute surface anomalies, and reduce human error—especially in high-throughput environments.\",\"type\":\"text\"}]},{\"type\":\"paragraph\",\"content\":[{\"text\":\"In this Build Project, you'll wear the hat of a Machine Vision Engineer and develop a complete automated visual inspection system that mimics real-world manufacturing quality control processes. Under the supervision of an experienced industry expert, you'll learn how industrial cameras work, process defect datasets, train convolutional neural networks for defect classification, and deploy your model through an interactive web application. You'll become familiar with industry tools like PyTorch and techniques like transfer learning, model evaluation metrics, deployment frameworks like Streamlit, and DevOps practices including CI/CD pipelines. All this will happen in an environment that simulates the operations of a real machine vision engineering team.\",\"type\":\"text\"}]}]},\"project_area\":[\"Data Science\",\"Engineering\"],\"level\":\"Intermediate\",\"levelDescription\":\"Some experience recommended\",\"prerequisites\":{\"type\":\"doc\",\"content\":[{\"type\":\"paragraph\",\"content\":[{\"text\":\"Python programming experience: You should be comfortable writing functions, working with classes, and using libraries like NumPy and Pandas. This is essential for implementing data processing pipelines, training loops, and building the web application.\",\"type\":\"text\"}]},{\"type\":\"paragraph\",\"content\":[{\"text\":\"Basic command line usage: You need to know how to navigate directories (cd, ls), run Python scripts, and use basic Git commands (clone, commit, push). These skills are necessary for managing your project repository and running code.\",\"type\":\"text\"}]},{\"type\":\"paragraph\",\"content\":[{\"text\":\"Familiarity with installing Python packages: You should be able to use pip or similar package managers to install libraries and manage dependencies. This is needed to set up your development environment with PyTorch, Streamlit, and other tools.\",\"type\":\"text\"}]},{\"type\":\"paragraph\",\"content\":[{\"text\":\"Completed at least one Python programming course: Whether through coursework like CS101 or self-study, you should have foundational programming knowledge. This ensures you can follow along with code examples and implement solutions independently.\",\"type\":\"text\"}]},{\"type\":\"paragraph\",\"content\":[{\"text\":\"No prior machine learning or deep learning experience required: All computer vision and ML concepts will be taught from the ground up with hands-on examples, so beginners in AI are welcome.\",\"type\":\"text\"}]}]},\"goals\":{\"type\":\"doc\",\"content\":[{\"type\":\"paragraph\",\"content\":[{\"text\":\"Understand how industrial camera systems capture and process images for automated quality inspection\",\"type\":\"text\"}]},{\"type\":\"paragraph\",\"content\":[{\"text\":\"Build and train deep learning models for visual defect detection using transfer learning with PyTorch\",\"type\":\"text\"}]},{\"type\":\"paragraph\",\"content\":[{\"text\":\"Deploy trained models through web interfaces for real-time inference and visualization\",\"type\":\"text\"}]},{\"type\":\"paragraph\",\"content\":[{\"text\":\"Implement automated testing and continuous integration pipelines using GitHub Actions\",\"type\":\"text\"}]},{\"type\":\"paragraph\",\"content\":[{\"text\":\"Create professional project documentation and present technical work effectively\",\"type\":\"text\"}]}]},\"schedule\":\"Tuesdays, 7:00 P.M. ET / 4:00 P.M. PT\",\"status\":\"archived\",\"duration\":\"8 weeks, 2-3 hours per week\",\"workshops\":{\"sessions\":[{\"name\":\"Introduction to Machine Vision \u0026 Project Setup\",\"order\":1,\"description\":{\"type\":\"doc\",\"content\":[{\"type\":\"paragraph\",\"content\":[{\"text\":\"Who are we? What career paths exist in machine vision and AI? What will our project look like and what will you build? Set up your development environment including GitHub repository, Python with Poetry, and explore the project template. \",\"type\":\"text\"}]}]}},{\"name\":\"Image Acquisition Systems \u0026 Camera Simulation\",\"order\":2,\"description\":{\"type\":\"doc\",\"content\":[{\"type\":\"paragraph\",\"content\":[{\"text\":\"Learn how industrial cameras work, including sensors, lenses, lighting, and frame rates. Understand machine vision system architecture. Build a Python-based image acquisition simulator that mimics how cameras capture images in manufacturing lines. \",\"type\":\"text\"}]}]}},{\"name\":\"Data Exploration \u0026 Preprocessing\",\"order\":3,\"description\":{\"type\":\"doc\",\"content\":[{\"type\":\"paragraph\",\"content\":[{\"text\":\"Explore surface defect datasets and understand data quality requirements. Preprocess images including resizing, normalization, and augmentation techniques. Split data into training, validation, and test sets and prepare data loaders. \",\"type\":\"text\"}]}]}},{\"name\":\"Transfer Learning \u0026 Model Setup\",\"order\":4,\"description\":{\"type\":\"doc\",\"content\":[{\"type\":\"paragraph\",\"content\":[{\"text\":\"Learn machine learning fundamentals and convolutional neural network concepts. Understand transfer learning and why pre-trained models work. Load a pre-trained ResNet or EfficientNet model, modify it for defect classification, and start training. \",\"type\":\"text\"}]}]}},{\"name\":\"Model Evaluation \u0026 Fine-Tuning\",\"order\":5,\"description\":{\"type\":\"doc\",\"content\":[{\"type\":\"paragraph\",\"content\":[{\"text\":\"Review training results and learn evaluation metrics like accuracy, precision, recall, and confusion matrices. Evaluate your trained model, analyze where it succeeds and fails, and improve performance through hyperparameter tuning. \",\"type\":\"text\"}]}]}},{\"name\":\"Data-Centric Improvements \u0026 Model Deployment Using Streamlit\",\"order\":6,\"description\":{\"type\":\"doc\",\"content\":[{\"type\":\"paragraph\",\"content\":[{\"text\":\"Your model's failures are a diagnostic tool. Trace classification errors back to data quality issues and fix them: cleaning mislabels, rebalancing classes, tuning augmentation, mining hard negatives. Retrain and measure whether your changes actually helped, then deploy your improved model as an interactive Streamlit app. \",\"type\":\"text\"}]}]}},{\"name\":\"CI/CD \u0026 Automated Testing\",\"order\":7,\"description\":{\"type\":\"doc\",\"content\":[{\"type\":\"paragraph\",\"content\":[{\"text\":\"Understand continuous integration and deployment concepts. Set up GitHub Actions to automatically run tests when you push code. Write simple tests for your application to ensure code quality and reliability. \",\"type\":\"text\"}]}]}},{\"name\":\"Documentation \u0026 Project Presentations\",\"order\":8,\"description\":{\"type\":\"doc\",\"content\":[{\"type\":\"paragraph\",\"content\":[{\"text\":\"Create professional project documentation using MkDocs. Present your complete machine vision system, demonstrate its capabilities, share your learnings, and discuss potential improvements and next steps in your AI journey. \",\"type\":\"text\"}]}]}}]},\"fellows\":[{\"id\":\"37b0b756-5aa5-45bc-b9ed-9107555fedcd\",\"name\":\"Sri Chakra Kumar\",\"role\":\"Data Science Fellow\",\"organization\":\"Open Avenues Foundation\",\"organizationLogoUrl\":\"/images/organizations/oaf-logo.png\",\"photoUrl\":\"https://avgkrhojcamcagufngrr.supabase.co/storage/v1/object/public/fellow-headshots/37b0b756-5aa5-45bc-b9ed-9107555fedcd.webp\",\"bio\":\"$1a\",\"linkedinUrl\":\"https://www.linkedin.com/in/sri-chakra-kumar-616004b1/\"}],\"categories\":[\"Machine Vision\",\"Deep Learning\",\"Quality Control\",\"Python\"],\"applicationTimeline\":[{\"label\":\"Applications open\",\"value\":\"April 13, 2026\"},{\"label\":\"Applications deadline\",\"value\":\"May 20, 2026\"},{\"label\":\"Application results released\",\"value\":\"Week of May 26, 2026\"},{\"label\":\"Project start date\",\"value\":\"Week of June 8, 2026\"},{\"label\":\"Project end date\",\"value\":\"Week of July 27, 2026\"}],\"cycle_id\":\"ae26a648-44bc-4fab-bbb0-7f9c0f6b18d9\"},\"error\":\"$undefined\"}]\n"])</script></body></html>
