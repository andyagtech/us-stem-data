l_A9QRwtuL4hrMD2RZGqb9eW7AtxES\",\"4420\",\"static/chunks/4420-baa8329e5076733c.js?dpl=dpl_A9QRwtuL4hrMD2RZGqb9eW7AtxES\",\"2169\",\"static/chunks/2169-1d13735e35f16c75.js?dpl=dpl_A9QRwtuL4hrMD2RZGqb9eW7AtxES\",\"419\",\"static/chunks/419-9f9e6d455ee0ae85.js?dpl=dpl_A9QRwtuL4hrMD2RZGqb9eW7AtxES\",\"5288\",\"static/chunks/5288-5d7819e0848b1b1a.js?dpl=dpl_A9QRwtuL4hrMD2RZGqb9eW7AtxES\",\"6874\",\"static/chunks/6874-67c719d6db2b17af.js?dpl=dpl_A9QRwtuL4hrMD2RZGqb9eW7AtxES\",\"6766\",\"static/chunks/6766-7fcc7eadc8fee52b.js?dpl=dpl_A9QRwtuL4hrMD2RZGqb9eW7AtxES\",\"9435\",\"static/chunks/9435-28f947009b0f7d38.js?dpl=dpl_A9QRwtuL4hrMD2RZGqb9eW7AtxES\",\"2206\",\"static/chunks/2206-42291f248e6bf19d.js?dpl=dpl_A9QRwtuL4hrMD2RZGqb9eW7AtxES\",\"5782\",\"static/chunks/5782-04eaa6c475f5c3f2.js?dpl=dpl_A9QRwtuL4hrMD2RZGqb9eW7AtxES\",\"8419\",\"static/chunks/app/projects/%5Bslug%5D/page-7f8129194c3557a1.js?dpl=dpl_A9QRwtuL4hrMD2RZGqb9eW7AtxES\"],\"default\"]\n"])</script><script>self.__next_f.push([1,"b:[\"$\",\"$L19\",null,{\"project\":{\"id\":\"f5cbac4a-deab-4223-af90-3d82594f82ae\",\"title\":\"Portfolio Playbook: Cracking the Risk-Reward Code\",\"slug\":\"portfolio-playbook-cracking-the-risk-reward-code\",\"summary\":{\"type\":\"doc\",\"content\":[{\"type\":\"paragraph\",\"content\":[{\"text\":\"This project focuses on risk management models and tools and allows students to quantitatively measure and present the risk associated with financial portfolios.\",\"type\":\"text\"}]}]},\"description\":{\"type\":\"doc\",\"content\":[{\"type\":\"paragraph\",\"content\":[{\"text\":\"In this Build Project, you will dive into the dynamic world of financial markets, mastering the art of risk modeling and portfolio optimization. As budding quantitative analysts, you will use real-world data to build predictive models that gauge market risks and devise optimized investment portfolios. By applying statistical methods and computational tools, you'll predict market trends and develop strategies that balance risk against potential returns. This project is designed to be a thrilling challenge that will not only deepen your understanding of financial principles but also enhance your analytical process. Upon completion, you'll have gained invaluable mathematical, programming, and analytical skills—key competencies highly sought after in entry-level quantitative analyst roles across the financial sector today. These skills are your stepping stones to a robust career in finance, where the ability to interpret complex datasets and make informed decisions is paramount.\\n\",\"type\":\"text\"}]}]},\"project_area\":[\"Business\"],\"level\":\"Intermediate\",\"levelDescription\":\"Some experience recommended\",\"prerequisites\":{\"type\":\"doc\",\"content\":[{\"type\":\"paragraph\",\"content\":[{\"text\":\"For you to be successful in this project, you will need:\",\"type\":\"text\"}]},{\"type\":\"paragraph\",\"content\":[{\"text\":\" Understanding of basic statistics concepts such as mean, variance and standard deviation.\",\"type\":\"text\"}]},{\"type\":\"paragraph\",\"content\":[{\"text\":\"Programming skills in Python or R.\",\"type\":\"text\"}]},{\"type\":\"paragraph\",\"content\":[{\"text\":\"Interest in investment, portfolio building and risk management.\",\"type\":\"text\"}]}]},\"goals\":{\"type\":\"doc\",\"content\":[{\"type\":\"paragraph\",\"content\":[{\"text\":\"Make clear and insightful analyses when presented with a new financial dataset and change direction quickly as required by these analyses;\",\"type\":\"text\"}]},{\"type\":\"paragraph\",\"content\":[{\"text\":\"Use existing risk prediction models to inform decision making;\",\"type\":\"text\"}]},{\"type\":\"paragraph\",\"content\":[{\"text\":\"Identify the most appropriate tool for modeling a specific problem of decision making under uncertainty and risk;\",\"type\":\"text\"}]},{\"type\":\"paragraph\",\"content\":[{\"text\":\"Identify new opportunities, find better explanations, and discover and creatively solve problems using insights developed through data analyses;\",\"type\":\"text\"}]},{\"type\":\"paragraph\",\"content\":[{\"text\":\"Communicate clearly and persuasively to a variety of audiences.\",\"type\":\"text\"}]}]},\"schedule\":\"Sundays, 7:00 P.M. ET / 4:00 P.M. PT\",\"status\":\"archived\",\"duration\":\"8 weeks, 2-3 hours per week\",\"workshops\":{\"sessions\":[{\"name\":\"Introduction\",\"order\":1,\"description\":{\"type\":\"doc\",\"content\":[{\"type\":\"paragraph\",\"content\":[{\"text\":\"Get to know project leader and other student consultants; Ask questions about the project requirements; Prepare workspace and necessary tools and skills.\\n\",\"type\":\"text\"}]}]}},{\"name\":\"Financial Market and Instruments\",\"order\":2,\"description\":{\"type\":\"doc\",\"content\":[{\"type\":\"paragraph\",\"content\":[{\"text\":\"Understand the basic concepts of financial markets and various financial instruments. Explore the interactions between different financial asset classes.\\n\",\"type\":\"text\"}]}]}},{\"name\":\"Security Return Calculation\",\"order\":3,\"description\":{\"type\":\"doc\",\"content\":[{\"type\":\"paragraph\",\"content\":[{\"text\":\"Introduction to fundamental concepts in return calculation. You will learn to calculate simple returns, log returns, and understand their applications. The workshop will also cover how to compute portfolio returns using asset weights and how rebalancing affects return measurement.\",\"type\":\"text\"}]}]}},{\"name\":\"Portfolio Theory and Constructions\",\"order\":4,\"description\":{\"type\":\"doc\",\"content\":[{\"type\":\"paragraph\",\"content\":[{\"text\":\"Understand the principles of modern portfolio theory and how to construct a portfolio. Explore the concepts of diversification, asset allocation, and the efficient frontier.\",\"type\":\"text\"}]}]}},{\"name\":\"Fundamentals to Financial Risks (Part 1)\",\"order\":5,\"description\":{\"type\":\"doc\",\"content\":[{\"type\":\"paragraph\",\"content\":[{\"text\":\"Discuss various types of risk including market risk, credit risk, liquidity risk, and operational risk.\",\"type\":\"text\"}]}]}},{\"name\":\"Financial Risk Management (Part 2)\",\"order\":6,\"description\":{\"type\":\"doc\",\"content\":[{\"type\":\"paragraph\",\"content\":[{\"text\":\"Introduction to basic risk modeling concepts and techniques such as Value at Risk and Expected Shortfall\\n\",\"type\":\"text\"}]}]}},{\"name\":\"Portfolio Optimization\",\"order\":7,\"description\":{\"type\":\"doc\",\"content\":[{\"type\":\"paragraph\",\"content\":[{\"text\":\"Learn and apply techniques, such as Mean-Variance Optimization, minimum variance portfolio, and tangency portfolio for optimizing a financial portfolio.\\n\",\"type\":\"text\"}]}]}},{\"name\":\"Presentation and Evaluation\",\"order\":8,\"description\":{\"type\":\"doc\",\"content\":[{\"type\":\"paragraph\",\"content\":[{\"text\":\"Present the completed models and optimized portfolios to the class, discuss the rationale behind the output portfolio and insights derived from their models.\\n\",\"type\":\"text\"}]}]}}]},\"fellows\":[{\"id\":\"906973d7-26c7-4a35-aaaf-d6e36d91900b\",\"name\":\"Shirong Liu\",\"role\":\"Finance Fellow\",\"organization\":\"Open Avenues Foundation\",\"organizationLogoUrl\":\"/images/organizations/oaf-logo.png\",\"photoUrl\":\"https://avgkrhojcamcagufngrr.supabase.co/storage/v1/object/public/fellow-headshots/906973d7-26c7-4a35-aaaf-d6e36d91900b.webp\",\"bio\":\"Shirong Liu is a Finance Build Fellow at Open Avenues Foundation, where she works with students leading projects in Secondary Market Trading and Investing.\\n\\nShirong is a trader at Citadel Securities, where she focuses on market making in US Treasuries.\\n\\nShirong has over five years of experience in trading. She specializes in interest rate products and has worked with both cash and derivative products, such as Treasury bonds, interest rate swaps and inflation swaps. \\n\\nShe holds a BS in Mathematics and Economics from University of Chicago.\\n\\nA fun fact about Shirong is that she is a certified scuba diver.\\n\",\"linkedinUrl\":\"https://www.linkedin.com/in/shirong-liu/\"}],\"categories\":[\"Financial Modeling\",\"Portfolio Management\",\"Statistical Analysis\"],\"applicationTimeline\":[{\"label\":\"Applications open\",\"value\":\"May 9, 2025\"},{\"label\":\"Applications deadline\",\"value\":\"June 8, 2025\"},{\"label\":\"Application results released\",\"value\":\"Week of June 23, 2025\"},{\"label\":\"Project start date\",\"value\":\"Week of July 7, 2025\"},{\"label\":\"Project end date\",\"value\":\"Week of August 25, 2025\"}],\"cycle_id\":\"77065a20-2032-46f1-b3cf-d435314c7011\"},\"error\":\"$undefined\"}]\n"])</script></body></html>
