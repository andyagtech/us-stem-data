s.\",\"type\":\"text\"}]},{\"type\":\"paragraph\",\"content\":[{\"text\":\"In this Build Project, you will wear the hat of a credit analyst and develop an investment recommendation on the debt of a real-world company. Under the supervision of an experienced industry expert, you will dive deep into the company’s business model, financial performance, and capital structure with a focus on downside recovery. You will become familiar with industry tools like Excel to conduct financial modeling and valuation analysis and PowerPoint to craft investment memorandums. The understanding of credit markets and technical credit analysis skills gained from this project will help you become a more competitive candidate in the recruiting process for various roles in leveraged finance ranging from investment banking to buyside analyst.\",\"type\":\"text\"}]}]},\"project_area\":[\"Business\",\"Finance\"],\"level\":\"Intermediate\",\"levelDescription\":\"Some experience recommended\",\"prerequisites\":{\"type\":\"doc\",\"content\":[{\"type\":\"paragraph\",\"content\":[{\"text\":\"Basic knowledge of financial statements and core accounting concepts\",\"type\":\"text\"}]},{\"type\":\"paragraph\",\"content\":[{\"text\":\"Familiarity with Excel and PowerPoint\",\"type\":\"text\"}]},{\"type\":\"paragraph\",\"content\":[{\"text\":\"Basic understanding of business fundamentals such as revenue models and cost structures\",\"type\":\"text\"}]},{\"type\":\"paragraph\",\"content\":[{\"text\":\"Interest in leveraged finance, credit markets, and investment analysis\",\"type\":\"text\"}]},{\"type\":\"paragraph\",\"content\":[{\"text\":\"Willingness to learn technical concepts\",\"type\":\"text\"}]}]},\"goals\":{\"type\":\"doc\",\"content\":[{\"type\":\"paragraph\",\"content\":[{\"text\":\"Read and interpret company financial reporting through the lens of a corporate credit investor\",\"type\":\"text\"}]},{\"type\":\"paragraph\",\"content\":[{\"text\":\"Construct financial models in Microsoft Excel with a focus on downside analysis\",\"type\":\"text\"}]},{\"type\":\"paragraph\",\"content\":[{\"text\":\"Understand key financial and legal concepts in corporate credit, including leverage, loan-to-value, covenants, and bankruptcy\",\"type\":\"text\"}]},{\"type\":\"paragraph\",\"content\":[{\"text\":\"Craft investment memorandums in PowerPoint with detailed quantitative and qualitative analysis to support investment recommendations\",\"type\":\"text\"}]},{\"type\":\"paragraph\",\"content\":[{\"text\":\"Deliver clear and structured investment pitches\",\"type\":\"text\"}]}]},\"schedule\":\"Fridays, 2:00 P.M. ET / 11:00 A.M. PT\",\"status\":\"active\",\"duration\":\"8 weeks, 2-3 hours per week\",\"workshops\":{\"sessions\":[{\"name\":\"Introduction to Credit Markets\",\"order\":1,\"description\":{\"type\":\"doc\",\"content\":[{\"type\":\"paragraph\",\"content\":[{\"text\":\"How do credit markets work? How do companies borrow? Who do they borrow from? How does investing in corporate credit compare to equity? What does a credit analyst do? In this session, you will also choose your case study subject from a curated list of companies that you will work on and build upon throughout the sessions.\",\"type\":\"text\"}]}]}},{\"name\":\"Mastering the Essentials\",\"order\":2,\"description\":{\"type\":\"doc\",\"content\":[{\"type\":\"paragraph\",\"content\":[{\"text\":\"What do yield, spread, and leverage mean? Why do they matter? How do these metrics help analysts shape investment decisions?\",\"type\":\"text\"}]}]}},{\"name\":\"Decoding Business Models\",\"order\":3,\"description\":{\"type\":\"doc\",\"content\":[{\"type\":\"paragraph\",\"content\":[{\"text\":\"What makes a good business? What company do you think is the greatest business in the world? How do you analyze a company’s business model and identify key growth or risk factors? What are Porter’s Five Forces? What is SWOT analysis?\",\"type\":\"text\"}]}]}},{\"name\":\"Crunching the Numbers\",\"order\":4,\"description\":{\"type\":\"doc\",\"content\":[{\"type\":\"paragraph\",\"content\":[{\"text\":\"How do you read and interpret financial statements from the lens of a credit analyst? What metrics should you care about? You will learn to extract relevant data and create a financial backup.\",\"type\":\"text\"}]}]}},{\"name\":\"Time to Forecast\",\"order\":5,\"description\":{\"type\":\"doc\",\"content\":[{\"type\":\"paragraph\",\"content\":[{\"text\":\"How do you project where the Company will go in 5 years? What is the worst-case scenario you can imagine? What are the key factors that will drive the company’s performance? You will learn to create financial forecasts and stress-test them for downside risks.\",\"type\":\"text\"}]}]}},{\"name\":\"How Much Is It Worth?\",\"order\":6,\"description\":{\"type\":\"doc\",\"content\":[{\"type\":\"paragraph\",\"content\":[{\"text\":\"How do you value a company? How does that influence how much you are willing to lend to it? You will learn to apply valuation techniques like DCF and comparables as well as liquidation analysis and explore how they help you evaluate credit investments.\",\"type\":\"text\"}]}]}},{\"name\":\"Putting It On Paper\",\"order\":7,\"description\":{\"type\":\"doc\",\"content\":[{\"type\":\"paragraph\",\"content\":[{\"text\":\"What goes into the hundred-page credit agreements? How do they protect us as lenders? You will explore the legal side of credit and understand how robust documentation can safeguard against downside scenarios.\",\"type\":\"text\"}]}]}},{\"name\":\"Pitch the Perfect Investment\",\"order\":8,\"description\":{\"type\":\"doc\",\"content\":[{\"type\":\"paragraph\",\"content\":[{\"text\":\"It is time to put everything you have learned in this class together. Build on all the analysis done on the case study company of your choice from the prior sessions and come up with an investment recommendation. Synthesize everything from understanding the business to modeling out the financials and present your thesis to a mock investment committee.\",\"type\":\"text\"}]}]}}]},\"fellows\":[{\"id\":\"79c27d44-b2f5-4354-9ad9-4465532a0e5b\",\"name\":\"Yifei Xu\",\"role\":\"Finance Fellow\",\"organization\":\"DREAM Venture Labs\",\"organizationLogoUrl\":\"/images/organizations/dv-logo.png\",\"photoUrl\":\"https://avgkrhojcamcagufngrr.supabase.co/storage/v1/object/public/fellow-headshots/79c27d44-b2f5-4354-9ad9-4465532a0e5b.webp\",\"bio\":\"Yifei Xu is a Finance Build Fellow at DREAM Venture Labs, where he works with students leading projects in credit analysis.\\n\\nYifei is a senior associate at Eldridge Capital Management, where he focuses on the underwriting and management of opportunistic credit and equity investments.\\n\\nYifei has over three years of experience in the credit investing field. He has covered companies in media and entertainment, business services, and financial services industries. \\n\\nHe holds a Bachelor's degree in Mathematics and Philosophy from Bowdoin College. \\n\\nA fun fact about Yifei is that he loves skiing and playing tennis.\",\"linkedinUrl\":\"https://www.linkedin.com/in/yifei-xu-687229175/\"}],\"categories\":[\"Leveraged Finance\",\"Fundamental Analysis\",\"Financial Modeling\",\"Valuation\"],\"applicationTimeline\":[{\"label\":\"Applications open\",\"value\":\"May 11, 2026\"},{\"label\":\"Applications deadline\",\"value\":\"June 11, 2026\"},{\"label\":\"Application results released\",\"value\":\"Week of June 22, 2026\"},{\"label\":\"Project start date\",\"value\":\"Week of July 6, 2026\"},{\"label\":\"Project end date\",\"value\":\"Week of August 24, 2026\"}],\"cycle_id\":\"04780f7f-10bb-4b43-8480-8ef15da1b3cc\"},\"error\":\"$undefined\"}]\n"])</script></body></html>
