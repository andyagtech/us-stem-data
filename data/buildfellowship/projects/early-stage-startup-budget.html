8329e5076733c.js?dpl=dpl_A9QRwtuL4hrMD2RZGqb9eW7AtxES\",\"2169\",\"static/chunks/2169-1d13735e35f16c75.js?dpl=dpl_A9QRwtuL4hrMD2RZGqb9eW7AtxES\",\"419\",\"static/chunks/419-9f9e6d455ee0ae85.js?dpl=dpl_A9QRwtuL4hrMD2RZGqb9eW7AtxES\",\"5288\",\"static/chunks/5288-5d7819e0848b1b1a.js?dpl=dpl_A9QRwtuL4hrMD2RZGqb9eW7AtxES\",\"6874\",\"static/chunks/6874-67c719d6db2b17af.js?dpl=dpl_A9QRwtuL4hrMD2RZGqb9eW7AtxES\",\"6766\",\"static/chunks/6766-7fcc7eadc8fee52b.js?dpl=dpl_A9QRwtuL4hrMD2RZGqb9eW7AtxES\",\"9435\",\"static/chunks/9435-28f947009b0f7d38.js?dpl=dpl_A9QRwtuL4hrMD2RZGqb9eW7AtxES\",\"2206\",\"static/chunks/2206-42291f248e6bf19d.js?dpl=dpl_A9QRwtuL4hrMD2RZGqb9eW7AtxES\",\"5782\",\"static/chunks/5782-04eaa6c475f5c3f2.js?dpl=dpl_A9QRwtuL4hrMD2RZGqb9eW7AtxES\",\"8419\",\"static/chunks/app/projects/%5Bslug%5D/page-7f8129194c3557a1.js?dpl=dpl_A9QRwtuL4hrMD2RZGqb9eW7AtxES\"],\"default\"]\n"])</script><script>self.__next_f.push([1,"b:[\"$\",\"$L19\",null,{\"project\":{\"id\":\"b3afd5aa-1332-4503-912e-22575b6b86a1\",\"title\":\"Build a Budget for an Early-Stage Startup\",\"slug\":\"early-stage-startup-budget\",\"summary\":{\"type\":\"doc\",\"content\":[{\"type\":\"paragraph\",\"content\":[{\"text\":\"Learn how to build in Excel an operational and capital expenditure budget for a tech startup.\",\"type\":\"text\"}]}]},\"description\":{\"type\":\"doc\",\"content\":[{\"type\":\"paragraph\",\"content\":[{\"text\":\"Wise financial planning is crucial for the success of any business; it becomes especially important for startups that have ambitious growth goals and limited resources. In this Build Project, you'll wear the hat of a Financial Analyst and build a full-year budget that allows a fictional startup to understand its expenses and how much capital is needed to cover all business costs. You will create in Microsoft Excel a budget for employees’ salaries \u0026 benefits using dynamic formulas. Also, you’ll create a budget for professional service fees. Under the supervision of an experienced Build Fellow, you'll learn best practices in Financial Planning, specifics of operational and capital expenditure budgeting, and how to use Excel to create solid forecasting schedules. All this will happen in an environment that simulates the operations of a real Financial Planning \u0026 Analysis team.\",\"type\":\"text\"}]}]},\"project_area\":[\"Business\"],\"level\":\"Intermediate\",\"levelDescription\":\"Some experience recommended\",\"prerequisites\":{\"type\":\"doc\",\"content\":[{\"type\":\"paragraph\",\"content\":[{\"text\":\"Knowledge of generally accepted accounting principles and familiarity with corporate finance concepts: financial statement analysis, revenue recognition, accruals, working capital accounts, fixed asset depreciation and amortization methods, OpEx and CaPeX classification. Usually, these topics are covered in basic finance accounting and corporate finance courses.\",\"type\":\"text\"}]},{\"type\":\"paragraph\",\"content\":[{\"text\":\"Basic Excel skills: you should know how to format and sort data, use formulas, and create charts.\",\"type\":\"text\"}]},{\"type\":\"paragraph\",\"content\":[{\"text\":\"Other prerequisites: before the project starts, you'll need to have Microsoft Excel and Microsoft PowerPoint installed on your computer.\",\"type\":\"text\"}]}]},\"goals\":{\"type\":\"doc\",\"content\":[{\"type\":\"paragraph\",\"content\":[{\"text\":\"Design a Budget schedule for Overhead, Travel \u0026 Entertainment in Excel.\",\"type\":\"text\"}]},{\"type\":\"paragraph\",\"content\":[{\"text\":\"Develop a CapEx \u0026 Depreciation Budget in Excel.\",\"type\":\"text\"}]},{\"type\":\"paragraph\",\"content\":[{\"text\":\"Build a Venture debt amortization schedule in Excel.\",\"type\":\"text\"}]},{\"type\":\"paragraph\",\"content\":[{\"text\":\"Consolidate all your budgets into one monthly trend view in Excel.\",\"type\":\"text\"}]},{\"type\":\"paragraph\",\"content\":[{\"text\":\"Summarize your budget assumptions and conclusion in a power point deck format.\",\"type\":\"text\"}]}]},\"schedule\":\"Wednesdays, 8:00 P.M. ET / 5:00 P.M. PT\",\"status\":\"archived\",\"duration\":\"8 weeks, 2-3 hours per week\",\"workshops\":{\"sessions\":[{\"name\":\"Introductions\",\"order\":1,\"description\":{\"type\":\"doc\",\"content\":[{\"type\":\"paragraph\",\"content\":[{\"text\":\"Get to know the Build Fellow and other students, ask questions about the project requirements, prepare your workspace.\",\"type\":\"text\"}]}]}},{\"name\":\"Budget and file Organization in MS Excel\",\"order\":2,\"description\":{\"type\":\"doc\",\"content\":[{\"type\":\"paragraph\",\"content\":[{\"text\":\"Organize your budget template in MS Excel creating and arranging the tabs that will comprise the budget file.\",\"type\":\"text\"}]}]}},{\"name\":\"Salaries \u0026 Benefits budget in MS Excel\",\"order\":3,\"description\":{\"type\":\"doc\",\"content\":[{\"type\":\"paragraph\",\"content\":[{\"text\":\"Create in Excel a budget for employees’ salaries \u0026 benefits.\",\"type\":\"text\"}]}]}},{\"name\":\"Professional Service Fees budget in MS Excel\",\"order\":4,\"description\":{\"type\":\"doc\",\"content\":[{\"type\":\"paragraph\",\"content\":[{\"text\":\"Create in Excel a budget for professional service fees.\",\"type\":\"text\"}]}]}},{\"name\":\"Overhead, Venture debt and other budgets in MS Excel\",\"order\":5,\"description\":{\"type\":\"doc\",\"content\":[{\"type\":\"paragraph\",\"content\":[{\"text\":\"Design a Budget schedule for Overhead, Travel \u0026 Entertainment, and Venture Debt in MS Excel.\",\"type\":\"text\"}]}]}},{\"name\":\"CapEx \u0026 Depreciation budget in MS Excel\",\"order\":6,\"description\":{\"type\":\"doc\",\"content\":[{\"type\":\"paragraph\",\"content\":[{\"text\":\"Develop a CapEx \u0026 Depreciation Budget in Excel.\",\"type\":\"text\"}]}]}},{\"name\":\"Budget Consolidation in MS Excel\",\"order\":7,\"description\":{\"type\":\"doc\",\"content\":[{\"type\":\"paragraph\",\"content\":[{\"text\":\"Consolidate and review each budget schedule from your budget template in MS Excel.\",\"type\":\"text\"}]}]}},{\"name\":\"Presentations\",\"order\":8,\"description\":{\"type\":\"doc\",\"content\":[{\"type\":\"paragraph\",\"content\":[{\"text\":\"Consolidate and review each budget schedule from your budget template in MS Excel.\",\"type\":\"text\"}]}]}}]},\"fellows\":[{\"id\":\"b871ed73-33d0-46bb-96cf-069ebb0a810d\",\"name\":\"Fernando Lemus Garcia\",\"role\":\"Finance Fellow\",\"organization\":\"Open Avenues Foundation\",\"organizationLogoUrl\":\"/images/organizations/oaf-logo.png\",\"photoUrl\":\"https://avgkrhojcamcagufngrr.supabase.co/storage/v1/object/public/fellow-headshots/b871ed73-33d0-46bb-96cf-069ebb0a810d.webp\",\"bio\":\"Fernando Lemus is a Finance Global Talent Fellow at Open Avenues, where he works with students leading projects in Finance.\\n\\nFernando Lemus is a Finance Manager at Insight M Inc. where he works directing and implementing financial planning \u0026 analysis process, improving internal controls and accounting processes, managing the company's equity platform and leading the yearly external audit accounting process.\\n\\nFernando has over 9 years of experience in finance related positions: 6 years in investment banking and 3 years in corporate financial planning \u0026 analysis roles.\\n\\nHe holds a degree in Business Administration with a Major in Finance from the University of Texas at Austin.\\n\\nA fun fact about Fernando: he is currently training for his second Marathon.\",\"linkedinUrl\":\"https://www.linkedin.com/in/fernandolemus/\"}],\"categories\":[\"Finance\",\"Accounting\",\"Financial Planning\",\"Excel\"],\"applicationTimeline\":[{\"label\":\"Applications open\",\"value\":\"May 9, 2025\"},{\"label\":\"Applications deadline\",\"value\":\"June 8, 2025\"},{\"label\":\"Application results released\",\"value\":\"Week of June 23, 2025\"},{\"label\":\"Project start date\",\"value\":\"Week of July 7, 2025\"},{\"label\":\"Project end date\",\"value\":\"Week of August 25, 2025\"}],\"cycle_id\":\"77065a20-2032-46f1-b3cf-d435314c7011\"},\"error\":\"$undefined\"}]\n"])</script></body></html>
