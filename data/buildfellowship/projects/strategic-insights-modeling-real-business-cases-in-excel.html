  In 2024 Riwal was acquired by Boels which is the number 2 rental company in Europe where he become the Director of Fleet for the entire Boels Group.\n\nHe holds an Executive MBA degree at the Nyenrode Business University and Bachelor in Science of Accountancy.\n\nA fun fact about Glenn is that he used to be a co-founder of a Boardgame company which had a successful launch of the game via Kickstarter.\n"])</script><script>self.__next_f.push([1,"b:[\"$\",\"$L19\",null,{\"project\":{\"id\":\"f989e11c-0b46-4675-8756-9d29352b1122\",\"title\":\"Strategic Insights: Modeling Real Business Cases in Excel\",\"slug\":\"strategic-insights-modeling-real-business-cases-in-excel\",\"summary\":{\"type\":\"doc\",\"content\":[{\"type\":\"paragraph\",\"content\":[{\"text\":\"You’ll step into the role of a Business Intelligence Analyst, using Excel to transform raw data into insights that drive business strategy.\",\"type\":\"text\"}]}]},\"description\":{\"type\":\"doc\",\"content\":[{\"type\":\"paragraph\",\"content\":[{\"text\":\"This project integrates the foundational principles of business intelligence and data analytics with hands-on experience in Microsoft Excel. In this Build Project, you will step into the role of a Business Intelligence Analyst and explore how data-driven insights are used to make strategic and tactical decisions. You will explore key concepts like data transformation, data mining, and business analytics, applying them to real-world business cases. Under the supervision of an experienced industry expert, you’ll be guided in gathering, cleaning and transforming data using Microsoft Excel and developing reports that summarize key business metrics. Furthermore, it will introduce you into understanding and using Key Performance Indicators that are commonly used in business practices all over the world. By the end of the project, you will have a comprehensive understanding of how business/financial data can be analyzed and how these analyses are used to influence business strategy and decision-making.\",\"type\":\"text\"}]}]},\"project_area\":[\"Business\"],\"level\":\"Intermediate\",\"levelDescription\":\"Some experience recommended\",\"prerequisites\":{\"type\":\"doc\",\"content\":[{\"type\":\"paragraph\",\"content\":[{\"text\":\"Familiarity with Excel or a similar spreadsheet tool (no prior experience with databases required).\",\"type\":\"text\"}]},{\"type\":\"paragraph\",\"content\":[{\"text\":\"Critical thinking and problem-solving skills to help analyzing the data from real-world business scenarios.\",\"type\":\"text\"}]},{\"type\":\"paragraph\",\"content\":[{\"text\":\"An introductory knowledge of business processes, with an emphasis on how data and analytics can drive decision-making.\",\"type\":\"text\"}]},{\"type\":\"paragraph\",\"content\":[{\"text\":\"Willingness to explore open datasets and derive business insights\",\"type\":\"text\"}]}]},\"goals\":{\"type\":\"doc\",\"content\":[{\"type\":\"paragraph\",\"content\":[{\"text\":\"Analyze real life business cases/situations and prepare proposals/analysis for management in a company\",\"type\":\"text\"}]},{\"type\":\"paragraph\",\"content\":[{\"text\":\"Understand how to analyze large data sets and convert them into clear summaries for management and reporting purposes\",\"type\":\"text\"}]},{\"type\":\"paragraph\",\"content\":[{\"text\":\"Use Microsoft Excel in a practical way to analyze business data and get the most out of the tool in a practical and easy manner\",\"type\":\"text\"}]},{\"type\":\"paragraph\",\"content\":[{\"text\":\"Understand Key Performance Indicators/metrics that are used to make business decisions.\",\"type\":\"text\"}]}]},\"schedule\":\"Mondays, 7:00 P.M. ET / 4:00 P.M. PT\",\"status\":\"archived\",\"duration\":\"8 weeks, 2-3 hours per week\",\"workshops\":{\"sessions\":[{\"name\":\"Introduction to Business Intelligence and Business Data\",\"order\":1,\"description\":{\"type\":\"doc\",\"content\":[{\"type\":\"paragraph\",\"content\":[{\"text\":\"You will be introduced to the project and the role of Business Intelligence (BI) in areas like finance, operations, and strategy. You'll learn how structured data supports KPIs, dashboards, and reporting in business environments.\",\"type\":\"text\"}]}]}},{\"name\":\"Structuring and Cleaning Business Data\",\"order\":2,\"description\":{\"type\":\"doc\",\"content\":[{\"type\":\"paragraph\",\"content\":[{\"text\":\"You will clean and validate operational data. You’ll learn to ensure data integrity — a crucial step before any reliable business analysis or reporting.\",\"type\":\"text\"}]}]}},{\"name\":\"Business Logic with Excel Formulas\",\"order\":3,\"description\":{\"type\":\"doc\",\"content\":[{\"type\":\"paragraph\",\"content\":[{\"text\":\"You will learn and use different Excel formuIas to better understand and analyse data.\",\"type\":\"text\"}]}]}},{\"name\":\"Summarizing \u0026 Presenting Business Performance\",\"order\":4,\"description\":{\"type\":\"doc\",\"content\":[{\"type\":\"paragraph\",\"content\":[{\"text\":\"You will create pivot tables to analyze data and will learn how to build basic dashboards for use by finance or operations teams.\",\"type\":\"text\"}]}]}},{\"name\":\"Business Case Modeling \u0026 Investment Evaluation\",\"order\":5,\"description\":{\"type\":\"doc\",\"content\":[{\"type\":\"paragraph\",\"content\":[{\"text\":\"You will evaluate a proposed investment (e.g., new product, equipment, expansion) using financial modeling tools.\",\"type\":\"text\"}]}]}},{\"name\":\"Scenario Planning \u0026 Sensitivity Analysis\",\"order\":6,\"description\":{\"type\":\"doc\",\"content\":[{\"type\":\"paragraph\",\"content\":[{\"text\":\"You will create scenarios to simulate risks and shifts (e.g., sales drop, cost increase). They’ll test model sensitivity to key assumptions.\",\"type\":\"text\"}]}]}},{\"name\":\"Building a Strategic Business Intelligence Model\",\"order\":7,\"description\":{\"type\":\"doc\",\"content\":[{\"type\":\"paragraph\",\"content\":[{\"text\":\"You will build a final Excel-based tool or dashboard that communicates insights to a management audience\",\"type\":\"text\"}]}]}},{\"name\":\"Executive Presentations \u0026 Reflections\",\"order\":8,\"description\":{\"type\":\"doc\",\"content\":[{\"type\":\"paragraph\",\"content\":[{\"text\":\"You will present their models and recommendations, demonstrating how BI supports better decisions across business functions.\",\"type\":\"text\"}]}]}}]},\"fellows\":[{\"id\":\"2e2921c3-a8fd-4976-8f4a-1f889da57012\",\"name\":\"Glenn Verburg\",\"role\":\"Business Intelligence Fellow\",\"organization\":\"Open Avenues Foundation\",\"organizationLogoUrl\":\"/images/organizations/oaf-logo.png\",\"photoUrl\":\"https://avgkrhojcamcagufngrr.supabase.co/storage/v1/object/public/fellow-headshots/2e2921c3-a8fd-4976-8f4a-1f889da57012.webp\",\"bio\":\"$1a\",\"linkedinUrl\":\"https://www.linkedin.com/in/glenn-verburg-5a501b23/\"}],\"categories\":[\"Microsoft Excel\",\"Key Performance Indicators\",\"Business Cases\",\"Data Analytics\",\"Data Modeling\",\"Data Visualization\"],\"applicationTimeline\":[{\"label\":\"Applications open\",\"value\":\"December 1, 2025\"},{\"label\":\"Applications deadline\",\"value\":\"January 8, 2026\"},{\"label\":\"Application results released\",\"value\":\"Week of January 16, 2026\"},{\"label\":\"Project start date\",\"value\":\"Week of February 2, 2026\"},{\"label\":\"Project end date\",\"value\":\"Week of March 23, 2026\"}],\"cycle_id\":\"a76d2d1d-8f75-423e-aaec-d693bd0b4531\"},\"error\":\"$undefined\"}]\n"])</script></body></html>
