\"static/chunks/4420-baa8329e5076733c.js?dpl=dpl_A9QRwtuL4hrMD2RZGqb9eW7AtxES\",\"2169\",\"static/chunks/2169-1d13735e35f16c75.js?dpl=dpl_A9QRwtuL4hrMD2RZGqb9eW7AtxES\",\"419\",\"static/chunks/419-9f9e6d455ee0ae85.js?dpl=dpl_A9QRwtuL4hrMD2RZGqb9eW7AtxES\",\"5288\",\"static/chunks/5288-5d7819e0848b1b1a.js?dpl=dpl_A9QRwtuL4hrMD2RZGqb9eW7AtxES\",\"6874\",\"static/chunks/6874-67c719d6db2b17af.js?dpl=dpl_A9QRwtuL4hrMD2RZGqb9eW7AtxES\",\"6766\",\"static/chunks/6766-7fcc7eadc8fee52b.js?dpl=dpl_A9QRwtuL4hrMD2RZGqb9eW7AtxES\",\"9435\",\"static/chunks/9435-28f947009b0f7d38.js?dpl=dpl_A9QRwtuL4hrMD2RZGqb9eW7AtxES\",\"2206\",\"static/chunks/2206-42291f248e6bf19d.js?dpl=dpl_A9QRwtuL4hrMD2RZGqb9eW7AtxES\",\"5782\",\"static/chunks/5782-04eaa6c475f5c3f2.js?dpl=dpl_A9QRwtuL4hrMD2RZGqb9eW7AtxES\",\"8419\",\"static/chunks/app/projects/%5Bslug%5D/page-7f8129194c3557a1.js?dpl=dpl_A9QRwtuL4hrMD2RZGqb9eW7AtxES\"],\"default\"]\n"])</script><script>self.__next_f.push([1,"b:[\"$\",\"$L19\",null,{\"project\":{\"id\":\"9185494b-5c2f-4af4-8d7d-d8f60850d88b\",\"title\":\"Startup Growth Strategy Simulation\",\"slug\":\"startup-growth-strategy-simulation\",\"summary\":{\"type\":\"doc\",\"content\":[{\"type\":\"paragraph\",\"content\":[{\"text\":\"You will act as a consultant to help a fictional early-stage startup scale, where you analyze market conditions, evaluate funding options, identify growth channels, and propose a go-to-market strategy.\",\"type\":\"text\"}]}]},\"description\":{\"type\":\"doc\",\"content\":[{\"type\":\"paragraph\",\"content\":[{\"text\":\"Ever wondered how startups go from rough beginnings to billion-dollar success stories? In this Build Project, you will step into the shoes of a strategic advisor working with a fictional early-stage startup, challenged to chart a path for sustainable growth. Each week, you will build your consulting toolkit by analyzing business models, mapping customer journeys, identifying growth channels, and developing a go-to-market plan. The experience combines creativity, problem-solving, and real-world business strategy. Along the way, you’ll gain valuable skills in market research, strategic thinking, and business communication. You will learn critical capabilities for roles in consulting, product strategy, and business operations in today’s innovation-driven U.S. economy.\",\"type\":\"text\"}]}]},\"project_area\":[\"Business\"],\"level\":\"Beginner\",\"levelDescription\":\"No prior experience required\",\"prerequisites\":{\"type\":\"doc\",\"content\":[{\"type\":\"paragraph\",\"content\":[{\"text\":\"Knowledge of Business Model Components: You should understand how companies create, deliver, and capture value through elements like customer segments, value propositions, revenue streams, and cost structures, as taught in courses like Principles of Management and Global Strategy.\",\"type\":\"text\"}]},{\"type\":\"paragraph\",\"content\":[{\"text\":\"Familiarity with Market Research Methods: You should know how to collect and interpret customer and competitor data using tools such as surveys, SWOT analysis, and customer journey mapping, building on skills from Market Research \u0026 Consumer Behavior.\",\"type\":\"text\"}]},{\"type\":\"paragraph\",\"content\":[{\"text\":\"Basic Analytical and Quantitative Reasoning: You should be able to work with data to support decision-making, including setting and interpreting key performance indicators (KPIs), supported by coursework like Business Analytics and Quantitative Skills for Business.\",\"type\":\"text\"}]},{\"type\":\"paragraph\",\"content\":[{\"text\":\"Foundational Marketing and GTM Strategy Concepts: You should understand the basics of customer acquisition channels, segmentation, and brand positioning, relevant to Digital \u0026 Social Media Marketing and Principles of Marketing.\",\"type\":\"text\"}]},{\"type\":\"paragraph\",\"content\":[{\"text\":\"Teamwork and Business Communication Skills: You will be expected to work in groups, present findings, and communicate strategic recommendations clearly, which are skills emphasized in Project Management and Storytelling \u0026 Persuasion.\",\"type\":\"text\"}]}]},\"goals\":{\"type\":\"doc\",\"content\":[{\"type\":\"paragraph\",\"content\":[{\"text\":\"Analyze startup business models using frameworks such as the Business Model Canvas and Lean Startup methodology.\",\"type\":\"text\"}]},{\"type\":\"paragraph\",\"content\":[{\"text\":\"Develop a basic market analysis, including customer segmentation and competitive positioning.\",\"type\":\"text\"}]},{\"type\":\"paragraph\",\"content\":[{\"text\":\"Design a go-to-market (GTM) strategy tailored to a startup’s value proposition and industry.\",\"type\":\"text\"}]},{\"type\":\"paragraph\",\"content\":[{\"text\":\"Build and present a strategic growth plan with specific KPIs, funding needs, and marketing channels.\",\"type\":\"text\"}]},{\"type\":\"paragraph\",\"content\":[{\"text\":\"Strengthen communication, collaboration, and presentation skills through weekly check-ins and a final team pitch.\",\"type\":\"text\"}]}]},\"schedule\":\"Mondays, 7:00 P.M. ET / 4:00 P.M. PT\",\"status\":\"archived\",\"duration\":\"8 weeks, 2-3 hours per week\",\"workshops\":{\"sessions\":[{\"name\":\"Introduction to Startup Growth Strategy \u0026 Business Model Design\",\"order\":1,\"description\":{\"type\":\"doc\",\"content\":[{\"type\":\"paragraph\",\"content\":[{\"text\":\"In this workshop, you will be introduced to the overall project, including its structure, deliverables, and learning goals. You will explore how early-stage startups use the Business Model Canvas to define their value proposition, customer segments, and revenue models. You will then choose a fictional startup from a provided list or create one of your own to use as the foundation for the rest of the project.\",\"type\":\"text\"}]}]}},{\"name\":\"Customer Segments, Pain Points \u0026 Market Research\",\"order\":2,\"description\":{\"type\":\"doc\",\"content\":[{\"type\":\"paragraph\",\"content\":[{\"text\":\"This session focuses on helping you analyze your target customers more deeply. You will learn about customer segmentation strategies, pain point identification, and basic tools for market research. You’ll explore how startups use insights from customer behavior to shape their product or service offering. You will refine your own startup’s value proposition and customer segment assumptions based on this research.\",\"type\":\"text\"}]}]}},{\"name\":\"Competitive Landscape \u0026 Market Sizing\",\"order\":3,\"description\":{\"type\":\"doc\",\"content\":[{\"type\":\"paragraph\",\"content\":[{\"text\":\"Building on your customer insights, this session dives into the external environment that shapes a startup’s success. You will learn how to create a competitor matrix, evaluate industry forces (e.g., Porter’s Five Forces), and perform both top-down and bottom-up market sizing. By the end, you will have a clear picture of where your startup fits in the market and how large the opportunity really is.\",\"type\":\"text\"}]}]}},{\"name\":\"Go-To-Market Strategy \u0026 Channel Selection\",\"order\":4,\"description\":{\"type\":\"doc\",\"content\":[{\"type\":\"paragraph\",\"content\":[{\"text\":\"This session helps you transition from research to execution planning. You’ll learn what a go-to-market strategy looks like in practice, including how startups decide on launch tactics, marketing channels, and early customer outreach. You’ll evaluate paid, earned, and owned media options and begin outlining how your startup will enter and grow in the market.\",\"type\":\"text\"}]}]}},{\"name\":\"Financial Model Basics \u0026 Defining Key Metrics\",\"order\":5,\"description\":{\"type\":\"doc\",\"content\":[{\"type\":\"paragraph\",\"content\":[{\"text\":\"In this session, you’ll turn your strategy into numbers. You’ll be guided through a simplified financial model that helps estimate startup revenues, fixed and variable costs, and early-stage expenses. You’ll also learn to select relevant KPIs—such as CAC, LTV, MRR, churn, or breakeven point—to measure startup performance and communicate progress to potential stakeholders.\",\"type\":\"text\"}]}]}},{\"name\":\"Startup Risk Analysis \u0026 Scenario Planning\",\"order\":6,\"description\":{\"type\":\"doc\",\"content\":[{\"type\":\"paragraph\",\"content\":[{\"text\":\"Every startup operates under uncertainty, and successful founders are those who anticipate and plan for it. In this session, you’ll learn how to spot risks in your strategy—from competition and market shifts to resource constraints and team limitations. You’ll use risk matrices and scenario planning tools to build a simple mitigation strategy that prepares your startup for possible challenges and setbacks.\",\"type\":\"text\"}]}]}},{\"name\":\"Building the Strategic Growth Pitch\",\"order\":7,\"description\":{\"type\":\"doc\",\"content\":[{\"type\":\"paragraph\",\"content\":[{\"text\":\"With your foundational work completed, this session focuses on transforming your insights into a polished startup pitch. You’ll be guided through how to structure a strategic presentation that tells a cohesive growth story—one that could be used to attract co-founders, advisors, or potential investors. You’ll organize your findings into key slides and begin rehearsing how to communicate your startup’s value, differentiation, market potential, and business model in a confident, investor-ready format.\",\"type\":\"text\"}]}]}},{\"name\":\"Final Presentation and Reflection\",\"order\":8,\"description\":{\"type\":\"doc\",\"content\":[{\"type\":\"paragraph\",\"content\":[{\"text\":\"In this final session, you will present your complete Startup Growth Strategy to the class and instructor. Your goal is to communicate your startup’s value proposition, market opportunity, strategic plan, and financial projections as if pitching to early-stage investors or advisors. After your presentation, you’ll receive constructive feedback and complete a self-assessment to reflect on your individual progress and insights gained over the 8-week simulation.\",\"type\":\"text\"}]}]}}]},\"fellows\":[{\"id\":\"696b61ac-5721-47de-bbf3-f66c5720642b\",\"name\":\"Sofie Bertheussen\",\"role\":\"Business Management Fellow\",\"organization\":\"Open Avenues Foundation\",\"organizationLogoUrl\":\"/images/organizations/oaf-logo.png\",\"photoUrl\":\"https://avgkrhojcamcagufngrr.supabase.co/storage/v1/object/public/fellow-headshots/696b61ac-5721-47de-bbf3-f66c5720642b.webp\",\"bio\":\"Sofie Bertheussen is a Business Management Build Fellow at Open Avenues Foundation, where she works with students leading projects in Business Management.\\n\\nSofie is a Director of Commercial Strategy at Plant-A Insights Group, where she focuses on sales strategy, licensing partnerships, business development, and commercial growth initiatives with major media partners such as Newsweek and USA Today.\\n\\nSofie has over 3 years of experience in the Business Management field. She has experience in research, product development, and now sales. She currently leads a sales team of 15, while she supports strategy, partnerships, and commercial growth initiatives.\\n\\nShe holds a Bachelor’s in Business Administration, a Master’s in Entrepreneurial Leadership, and a Master’s in Project Management.\\n\\nA fun fact about Sofie is that she went to high school in eSwatini, and she can't stand cold temperatures despite being from Norway. \",\"linkedinUrl\":\"https://www.linkedin.com/in/sofie-bertheussen/\"}],\"categories\":[\"Startup Strategy\",\"Go-to-Market (GTM) Planning\",\"Business Model Development\"],\"applicationTimeline\":[{\"label\":\"Applications open\",\"value\":\"December 1, 2025\"},{\"label\":\"Applications deadline\",\"value\":\"January 8, 2026\"},{\"label\":\"Application results released\",\"value\":\"Week of January 16, 2026\"},{\"label\":\"Project start date\",\"value\":\"Week of February 2, 2026\"},{\"label\":\"Project end date\",\"value\":\"Week of March 23, 2026\"}],\"cycle_id\":\"a76d2d1d-8f75-423e-aaec-d693bd0b4531\"},\"error\":\"$undefined\"}]\n"])</script></body></html>
