\",\"4420\",\"static/chunks/4420-baa8329e5076733c.js?dpl=dpl_A9QRwtuL4hrMD2RZGqb9eW7AtxES\",\"2169\",\"static/chunks/2169-1d13735e35f16c75.js?dpl=dpl_A9QRwtuL4hrMD2RZGqb9eW7AtxES\",\"419\",\"static/chunks/419-9f9e6d455ee0ae85.js?dpl=dpl_A9QRwtuL4hrMD2RZGqb9eW7AtxES\",\"5288\",\"static/chunks/5288-5d7819e0848b1b1a.js?dpl=dpl_A9QRwtuL4hrMD2RZGqb9eW7AtxES\",\"6874\",\"static/chunks/6874-67c719d6db2b17af.js?dpl=dpl_A9QRwtuL4hrMD2RZGqb9eW7AtxES\",\"6766\",\"static/chunks/6766-7fcc7eadc8fee52b.js?dpl=dpl_A9QRwtuL4hrMD2RZGqb9eW7AtxES\",\"9435\",\"static/chunks/9435-28f947009b0f7d38.js?dpl=dpl_A9QRwtuL4hrMD2RZGqb9eW7AtxES\",\"2206\",\"static/chunks/2206-42291f248e6bf19d.js?dpl=dpl_A9QRwtuL4hrMD2RZGqb9eW7AtxES\",\"5782\",\"static/chunks/5782-04eaa6c475f5c3f2.js?dpl=dpl_A9QRwtuL4hrMD2RZGqb9eW7AtxES\",\"8419\",\"static/chunks/app/projects/%5Bslug%5D/page-7f8129194c3557a1.js?dpl=dpl_A9QRwtuL4hrMD2RZGqb9eW7AtxES\"],\"default\"]\n1a:T434,William Gao is a Data Science Build Fellow at OAF, where he works with students leading data science projects focused on artificial intelligence, emerging technology, and the Bay Area technology ecosystem.\n\nWilliam is Cofounder of a stealth startup, where he is building AI systems that learn from real-world human context, with a focus on world models. He leads the company’s research effort, data operations and business strategy.\n\nWilliam has over three years of professional experience spanning quantitative finance, artificial intelligence, and technology. Before founding the startup, he was a quantitative trader at Optiver, where he worked on large-scale high-frequency trading. His current work sits at the intersection of model research, data operation, physical AI, and entrep"])</script><script>self.__next_f.push([1,"reneurship.\n\nHe holds a Bachelor's degree in Mathematics from Harvard University.\n\nA fun fact about William is that he was the first student in Harvard's history to complete both Math 55, its famously rigorous mathematics course, and Hum 10, its intensive great-books humanities program."])</script><script>self.__next_f.push([1,"b:[\"$\",\"$L19\",null,{\"project\":{\"id\":\"e01631f4-46a1-4905-9a91-154285485f1f\",\"title\":\"Mapping the Bay Area AI Data Ecosystem\",\"slug\":\"mapping-the-bay-area-ai-data-ecosystem\",\"summary\":{\"type\":\"doc\",\"content\":[{\"type\":\"paragraph\",\"content\":[{\"text\":\"Analyze the Bay Area AI ecosystem through public information and simple data analysis, then build and present a focused investigation on a question you choose.\",\"type\":\"text\"}]}]},\"description\":{\"type\":\"doc\",\"content\":[{\"type\":\"paragraph\",\"content\":[{\"text\":\"Modern AI systems depend not only on models and compute, but also on data: how it is collected, structured, filtered, labeled, synthesized, and evaluated. In this Build Project, you will work as a data scientist and technology analyst to understand the Bay Area AI ecosystem, learn how frontier labs, startups, research communities, and data providers fit together, and then choose a narrow question of your own to investigate. You will turn public information into a small, structured dataset or evidence table, use a simple spreadsheet or Python-based analysis to identify patterns, and develop a clear point of view supported by data. Possible directions include mapping data-for-AI startups, comparing public datasets or benchmarks, analyzing recurring data skills in AI job postings, or studying how a selected AI domain obtains and evaluates data; the emphasis is on industry exposure, good data-science habits, and clear analytical communication rather than building a large or technically complex model.\",\"type\":\"text\"}]}]},\"project_area\":[\"Data Science\",\"Computer Science\"],\"level\":\"Intermediate\",\"levelDescription\":\"Some experience recommended\",\"prerequisites\":{\"type\":\"doc\",\"content\":[{\"type\":\"paragraph\",\"content\":[{\"text\":\"Basic quantitative reasoning: you should be comfortable working with percentages, averages, comparisons, and simple charts.\",\"type\":\"text\"}]},{\"type\":\"paragraph\",\"content\":[{\"text\":\"Experience with tabular data: you should be able to open a spreadsheet, understand rows and columns, and sort or filter a table; prior Python experience is helpful but not required.\",\"type\":\"text\"}]},{\"type\":\"paragraph\",\"content\":[{\"text\":\"Web research and source tracking: you should be able to find public information, summarize it in your own words, and record where each data point came from.\",\"type\":\"text\"}]},{\"type\":\"paragraph\",\"content\":[{\"text\":\"Clear written and verbal communication: you should be willing to explain what a chart shows, what it does not show, and what conclusion you draw from it.\",\"type\":\"text\"}]},{\"type\":\"paragraph\",\"content\":[{\"text\":\"Curiosity about technology and AI; no prior professional experience in the AI industry is expected.\",\"type\":\"text\"}]}]},\"goals\":{\"type\":\"doc\",\"content\":[{\"type\":\"paragraph\",\"content\":[{\"text\":\"Explain the major parts of the Bay Area AI ecosystem and where data science and data-for-AI work fit within it.\",\"type\":\"text\"}]},{\"type\":\"paragraph\",\"content\":[{\"text\":\"Distinguish common types of data used in modern AI, including training data, post-training data, evaluation data, human feedback, synthetic data, and multimodal data.\",\"type\":\"text\"}]},{\"type\":\"paragraph\",\"content\":[{\"text\":\"Turn public information into a small, structured dataset by defining variables, recording sources, and cleaning the data consistently.\",\"type\":\"text\"}]},{\"type\":\"paragraph\",\"content\":[{\"text\":\"Use descriptive statistics and simple visualizations to answer a focused question and identify meaningful patterns.\",\"type\":\"text\"}]},{\"type\":\"paragraph\",\"content\":[{\"text\":\"Communicate an evidence-backed conclusion, including limitations, through a concise professional presentation.\",\"type\":\"text\"}]}]},\"schedule\":\"Thursdays, 7:00 P.M. ET / 4:00 P.M. PT\",\"status\":\"applications_open\",\"duration\":\"8 weeks, 2-3 hours per week\",\"workshops\":{\"sessions\":[{\"name\":\"Navigate the AI Ecosystem\",\"order\":1,\"description\":{\"type\":\"doc\",\"content\":[{\"type\":\"paragraph\",\"content\":[{\"text\":\"Get oriented to the Bay Area technology and AI community, including major company types, research labs, startup communities, and the professional sources people use to follow the field. We will map where data science and data-for-AI teams fit and review the final project structure.\",\"type\":\"text\"}]}]}},{\"name\":\"Trace the Data Lifecycle\",\"order\":2,\"description\":{\"type\":\"doc\",\"content\":[{\"type\":\"paragraph\",\"content\":[{\"text\":\"Learn how data moves through modern AI development, from collection and curation to training, post-training, evaluation, feedback, and multimodal or synthetic data. You will practice classifying real examples into a simple data taxonomy.\",\"type\":\"text\"}]}]}},{\"name\":\"Define Your Question\",\"order\":3,\"description\":{\"type\":\"doc\",\"content\":[{\"type\":\"paragraph\",\"content\":[{\"text\":\"Choose a narrow project direction that interests you and turn it into a data-science question with a clear unit of analysis, variables, and scope. You will leave with a short project brief and data-collection plan.\",\"type\":\"text\"}]}]}},{\"name\":\"Build Your Dataset\",\"order\":4,\"description\":{\"type\":\"doc\",\"content\":[{\"type\":\"paragraph\",\"content\":[{\"text\":\"Collect a manageable set of public data points, record sources, and organize them into a consistent table. We will focus on data provenance, missing values, category definitions, and simple cleaning rather than large-scale scraping.\",\"type\":\"text\"}]}]}},{\"name\":\"Analyze the Data\",\"order\":5,\"description\":{\"type\":\"doc\",\"content\":[{\"type\":\"paragraph\",\"content\":[{\"text\":\"Use descriptive statistics, grouping, and simple visualizations to look for patterns in your dataset. You may work in Google Sheets, Excel, or Python depending on your comfort level, with the goal of producing 2-4 useful charts.\",\"type\":\"text\"}]}]}},{\"name\":\"Develop Your Thesis\",\"order\":6,\"description\":{\"type\":\"doc\",\"content\":[{\"type\":\"paragraph\",\"content\":[{\"text\":\"Interpret what your analysis does and does not support, identify limitations or possible bias, and form a concise evidence-backed conclusion. You will connect quantitative results with relevant qualitative context without overclaiming.\",\"type\":\"text\"}]}]}},{\"name\":\"Design the Presentation\",\"order\":7,\"description\":{\"type\":\"doc\",\"content\":[{\"type\":\"paragraph\",\"content\":[{\"text\":\"Turn your question, data, analysis, and conclusion into a professional 6-8 slide story. We will focus on chart clarity, slide structure, concise writing, and peer feedback so that the final presentation feels polished.\",\"type\":\"text\"}]}]}},{\"name\":\"Present Your Findings\",\"order\":8,\"description\":{\"type\":\"doc\",\"content\":[{\"type\":\"paragraph\",\"content\":[{\"text\":\"Present your analysis to the group, answer questions, and reflect on what you learned about data science, the Bay Area AI ecosystem, and data-for-AI work. You will finish with a portfolio-ready deck and a clearer view of possible directions to explore next.\",\"type\":\"text\"}]}]}}]},\"fellows\":[{\"id\":\"0c64effe-d3b0-47b3-9080-735fca037d7c\",\"name\":\"Yuan Gao\",\"role\":\"Data Science Fellow\",\"organization\":\"Open Avenues Foundation\",\"organizationLogoUrl\":\"/images/organizations/oaf-logo.png\",\"photoUrl\":\"https://avgkrhojcamcagufngrr.supabase.co/storage/v1/object/public/fellow-headshots/0c64effe-d3b0-47b3-9080-735fca037d7c.webp\",\"bio\":\"$1a\",\"linkedinUrl\":\"https://linkedin.com/in/williamgaoharvard\"}],\"categories\":[\"Data Science\",\"Artificial Intelligence\",\"AI Data \u0026 Evaluation\",\"Bay Area Technology Ecosystem\"],\"applicationTimeline\":[{\"label\":\"Applications open\",\"value\":\"August 3, 2026\"},{\"label\":\"Applications deadline\",\"value\":\"September 3, 2026\"},{\"label\":\"Application results released\",\"value\":\"Week of September 14, 2026\"},{\"label\":\"Project start date\",\"value\":\"Week of September 28, 2026\"},{\"label\":\"Project end date\",\"value\":\"Week of November 16, 2026\"}],\"cycle_id\":\"6e8885e5-3870-4327-a19c-d88c867fa48f\"},\"error\":\"$undefined\"}]\n"])</script></body></html>
