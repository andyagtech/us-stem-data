unication strategies to reach diverse audiences. By the end, you'll have the skills to become agents of change, promoting mental well-being and fostering stronger, more supportive communities.\",\"type\":\"text\"}]}]},\"project_area\":[\"Biology \u0026 Healthcare\"],\"level\":\"Intermediate\",\"levelDescription\":\"Some experience recommended\",\"prerequisites\":{\"type\":\"doc\",\"content\":[{\"type\":\"paragraph\",\"content\":[{\"text\":\"A fundamental understanding of mental health: Be familiar with common challenges, the impact of stigma, and the importance of seeking help.\",\"type\":\"text\"}]},{\"type\":\"paragraph\",\"content\":[{\"text\":\"Research and resourcefulness: Be able to effectively gather information from various sources, including online databases and community organizations.\",\"type\":\"text\"}]},{\"type\":\"paragraph\",\"content\":[{\"text\":\"Communication and empathy: Convey information clearly, tailor your message to diverse audiences, and demonstrate understanding and sensitivity towards mental health challenges.\",\"type\":\"text\"}]},{\"type\":\"paragraph\",\"content\":[{\"text\":\"Collaboration and teamwork: Work effectively in a team, valuing diverse perspectives and contributions.\",\"type\":\"text\"}]},{\"type\":\"paragraph\",\"content\":[{\"text\":\"Basic digital literacy: Use presentation software, online collaboration tools, and potentially explore social media platforms for campaign promotion.\",\"type\":\"text\"}]}]},\"goals\":{\"type\":\"doc\",\"content\":[{\"type\":\"paragraph\",\"content\":[{\"text\":\"Understand key mental health challenges and how to address them through community-focused interventions.\",\"type\":\"text\"}]},{\"type\":\"paragraph\",\"content\":[{\"text\":\"Develop effective outreach and communication strategies to connect diverse communities with mental health resources.\",\"type\":\"text\"}]},{\"type\":\"paragraph\",\"content\":[{\"text\":\"Create educational materials (e.g., presentations, posters, and social media content) that raise awareness and reduce stigma around mental health issues.\",\"type\":\"text\"}]},{\"type\":\"paragraph\",\"content\":[{\"text\":\"Conduct research and data analysis to evaluate the impact of mental health awareness campaigns.\",\"type\":\"text\"}]},{\"type\":\"paragraph\",\"content\":[{\"text\":\"Work collaboratively to design and execute a public health initiative that bridges gaps between mental health resources and communities.\",\"type\":\"text\"}]}]},\"schedule\":\"Thursdays, 11:00 A.M. ET / 8:00 A.M. PT\",\"status\":\"archived\",\"duration\":\"8 weeks, 2-3 hours per week\",\"workshops\":{\"sessions\":[{\"name\":\"Introduction and Overview of Mental Health Campaigns\",\"order\":1,\"description\":{\"type\":\"doc\",\"content\":[{\"type\":\"paragraph\",\"content\":[{\"text\":\"Kick off by exploring the critical role mental health awareness plays in communities. Brainstorm impactful campaign ideas that aim to connect people with essential mental health resources and create a lasting impact.\",\"type\":\"text\"}]}]}},{\"name\":\"Researching Community Mental Health Needs and Resources\",\"order\":2,\"description\":{\"type\":\"doc\",\"content\":[{\"type\":\"paragraph\",\"content\":[{\"text\":\"Focus on identifying gaps in mental health services by conducting research using surveys, academic sources, and community insights. Collect data to build a strong foundation for the campaign strategy.\",\"type\":\"text\"}]}]}},{\"name\":\"Designing the Mental Health Awareness Campaign\",\"order\":3,\"description\":{\"type\":\"doc\",\"content\":[{\"type\":\"paragraph\",\"content\":[{\"text\":\"Develop a high-level campaign plan by setting objectives, defining key messages, and outlining the strategy for effective outreach. This is the creative stage where the campaign’s vision comes together.\",\"type\":\"text\"}]}]}},{\"name\":\"Execution Planning and Defining Roles\",\"order\":4,\"description\":{\"type\":\"doc\",\"content\":[{\"type\":\"paragraph\",\"content\":[{\"text\":\"Plan the execution of the campaign by determining the timeline, platforms for outreach, and logistics. Assign roles and responsibilities within the team if you are working together to ensure everyone is prepared and ready to contribute effectively to the campaign's success. If you are working alone, you will need to organize a timeline to follow.\",\"type\":\"text\"}]}]}},{\"name\":\"Content Creation: Engaging the Audience\",\"order\":5,\"description\":{\"type\":\"doc\",\"content\":[{\"type\":\"paragraph\",\"content\":[{\"text\":\"Create educational materials such as posters, presentations, and social media content that will resonate with your target audience. Focus on producing engaging and accessible resources that effectively communicate key mental health messages.\",\"type\":\"text\"}]}]}},{\"name\":\"Campaign Implementation and Community Engagement\",\"order\":6,\"description\":{\"type\":\"doc\",\"content\":[{\"type\":\"paragraph\",\"content\":[{\"text\":\"Execute the campaign by distributing materials across selected platforms. Gather initial feedback from the community and track engagement to assess the campaign’s early impact.\",\"type\":\"text\"}]}]}},{\"name\":\"Analyzing Campaign Effectiveness\",\"order\":7,\"description\":{\"type\":\"doc\",\"content\":[{\"type\":\"paragraph\",\"content\":[{\"text\":\"Analyze the feedback and data collected from the campaign to evaluate its effectiveness. Focus on understanding the reach, engagement levels, and identifying areas for improvement.\",\"type\":\"text\"}]}]}},{\"name\":\"Final Presentation, Reflection, and Feedback\",\"order\":8,\"description\":{\"type\":\"doc\",\"content\":[{\"type\":\"paragraph\",\"content\":[{\"text\":\"Analyze the feedback and data collected from the campaign to evaluate its effectiveness. Focus on understanding the reach, engagement levels, and identifying areas for improvement.\",\"type\":\"text\"}]}]}}]},\"fellows\":[{\"id\":\"398370c2-0d55-476f-9de4-b9b522830846\",\"name\":\"Raneam Nageeb\",\"role\":\"Psychology Fellow\",\"organization\":\"Open Avenues Foundation\",\"organizationLogoUrl\":\"/images/organizations/oaf-logo.png\",\"photoUrl\":\"https://avgkrhojcamcagufngrr.supabase.co/storage/v1/object/public/fellow-headshots/398370c2-0d55-476f-9de4-b9b522830846.webp\",\"bio\":\"Raneam Nageeb is a Psychology Fellow at Open Avenues. Originally from Saudi Arabia and having lived in the US, she holds a B.Sc in Psychology from DePaul University, IL, and an MA in Counseling Psychology from The Chicago School of Professional Psychology. Raneem currently works as an Industrial-Organizational Psychologist, drawing on her previous experience as a student counselor and psychotherapist. She is deeply passionate about promoting mental well-being and enjoys painting in her free time.\",\"linkedinUrl\":\"https://www.linkedin.com/in/raneem-nageeb-abb2b7171/\"}],\"categories\":[\"Mental Health Awareness\",\"Community Outreach\",\"Public Health Campaigns\",\"Psychology Research\"],\"applicationTimeline\":[{\"label\":\"Applications open\",\"value\":\"December 1, 2025\"},{\"label\":\"Applications deadline\",\"value\":\"January 8, 2026\"},{\"label\":\"Application results released\",\"value\":\"Week of January 16, 2026\"},{\"label\":\"Project start date\",\"value\":\"Week of February 2, 2026\"},{\"label\":\"Project end date\",\"value\":\"Week of March 23, 2026\"}],\"cycle_id\":\"a76d2d1d-8f75-423e-aaec-d693bd0b4531\"},\"error\":\"$undefined\"}]\n"])</script></body></html>
