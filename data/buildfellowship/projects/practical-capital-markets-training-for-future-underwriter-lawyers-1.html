277\",\"static/chunks/54a60aa6-294bb7e111b509a4.js?dpl=dpl_A9QRwtuL4hrMD2RZGqb9eW7AtxES\",\"4420\",\"static/chunks/4420-baa8329e5076733c.js?dpl=dpl_A9QRwtuL4hrMD2RZGqb9eW7AtxES\",\"2169\",\"static/chunks/2169-1d13735e35f16c75.js?dpl=dpl_A9QRwtuL4hrMD2RZGqb9eW7AtxES\",\"419\",\"static/chunks/419-9f9e6d455ee0ae85.js?dpl=dpl_A9QRwtuL4hrMD2RZGqb9eW7AtxES\",\"5288\",\"static/chunks/5288-5d7819e0848b1b1a.js?dpl=dpl_A9QRwtuL4hrMD2RZGqb9eW7AtxES\",\"6874\",\"static/chunks/6874-67c719d6db2b17af.js?dpl=dpl_A9QRwtuL4hrMD2RZGqb9eW7AtxES\",\"6766\",\"static/chunks/6766-7fcc7eadc8fee52b.js?dpl=dpl_A9QRwtuL4hrMD2RZGqb9eW7AtxES\",\"9435\",\"static/chunks/9435-28f947009b0f7d38.js?dpl=dpl_A9QRwtuL4hrMD2RZGqb9eW7AtxES\",\"2206\",\"static/chunks/2206-42291f248e6bf19d.js?dpl=dpl_A9QRwtuL4hrMD2RZGqb9eW7AtxES\",\"5782\",\"static/chunks/5782-04eaa6c475f5c3f2.js?dpl=dpl_A9QRwtuL4hrMD2RZGqb9eW7AtxES\",\"8419\",\"static/chunks/app/projects/%5Bslug%5D/page-7f8129194c3557a1.js?dpl=dpl_A9QRwtuL4hrMD2RZGqb9eW7AtxES\"],\"default\"]\n"])</script><script>self.__next_f.push([1,"b:[\"$\",\"$L19\",null,{\"project\":{\"id\":\"be5a914e-fc58-49a0-a020-e04e62c80ce9\",\"title\":\"Build Real Deal Documents as an Underwriter Lawyer in Capital Markets\",\"slug\":\"practical-capital-markets-training-for-future-underwriter-lawyers-1\",\"summary\":{\"type\":\"doc\",\"content\":[{\"type\":\"paragraph\",\"content\":[{\"text\":\"Step into the role of underwriter counsel and build the full suite of deal documents while navigating SEC/FINRA compliance and post-IPO obligations used in real capital market transactions. \",\"type\":\"text\"}]}]},\"description\":{\"type\":\"doc\",\"content\":[{\"type\":\"paragraph\",\"content\":[{\"text\":\"This Build Project will immerse you in the real-world responsibilities of underwriter counsel in capital markets transactions. Through hands-on exercises using sample agreements, due diligence checklists, SEC filings, and regulatory comment letters, you will practice drafting, reviewing, and analyzing the documents and strategies essential to IPOs, follow-on offerings, PIPEs, and SPAC deals. Each session builds practical skills in legal research, contract drafting, regulatory compliance, and risk assessment, enabling you to produce tangible deliverables such as clause-level comments, due diligence requests, regulatory responses, closing checklists, and advisory memos. By the end of the program, you will have developed the analytical and drafting skills sought after by law firms, financial institutions, and corporate legal teams.\",\"type\":\"text\"}]}]},\"project_area\":[\"Law\",\"Finance\"],\"level\":\"Beginner\",\"levelDescription\":\"No prior experience required\",\"prerequisites\":{\"type\":\"doc\",\"content\":[{\"type\":\"paragraph\",\"content\":[{\"text\":\"Familiarity with U.S. securities laws and regulations, including the Securities Act of 1933, the Securities Exchange Act of 1934, and the roles of the SEC, FINRA, and Nasdaq/NYSE.\",\"type\":\"text\"}]},{\"type\":\"paragraph\",\"content\":[{\"text\":\"Understanding of key corporate and transactional law concepts, such as indemnification, disclosure obligations, due diligence, underwriting, and post-offering compliance.\",\"type\":\"text\"}]},{\"type\":\"paragraph\",\"content\":[{\"text\":\"Ability to analyze and extract issues from complex legal documents, including contracts, prospectuses, and regulatory comment letters.\",\"type\":\"text\"}]},{\"type\":\"paragraph\",\"content\":[{\"text\":\"Strong legal writing and communication skills to draft concise memos, comments, and checklists tailored for transactional practice.\",\"type\":\"text\"}]},{\"type\":\"paragraph\",\"content\":[{\"text\":\"Attention to detail and analytical thinking to identify legal risks, propose mitigation strategies, and understand how tasks fit into the broader capital markets transaction timeline.\",\"type\":\"text\"}]}]},\"goals\":{\"type\":\"doc\",\"content\":[{\"type\":\"paragraph\",\"content\":[{\"text\":\"Draft and comment on key provisions in underwriting agreements and engagement letters, applying contract negotiation and issue-spotting skills.\",\"type\":\"text\"}]},{\"type\":\"paragraph\",\"content\":[{\"text\":\"Create due diligence request lists and analyze company disclosures to identify red flags and assess transactional risks.\",\"type\":\"text\"}]},{\"type\":\"paragraph\",\"content\":[{\"text\":\"Review SEC registration statements and prospectuses (e.g., Form S-1/F-1) to evaluate disclosure adequacy and compliance.\",\"type\":\"text\"}]},{\"type\":\"paragraph\",\"content\":[{\"text\":\"Draft regulatory response letters to SEC/FINRA/Nasdaq comments, strengthening your ability to navigate compliance reviews.\",\"type\":\"text\"}]},{\"type\":\"paragraph\",\"content\":[{\"text\":\"Prepare closing checklists and post-IPO compliance reports, gaining practical tools used daily by underwriter counsel.\",\"type\":\"text\"}]}]},\"schedule\":\"Tuesdays, 12:00 P.M. ET / 9:00 A.M. PT\",\"status\":\"archived\",\"duration\":\"8 weeks, 2-3 hours per week\",\"workshops\":{\"sessions\":[{\"name\":\"Overview of Capital Markets Transactions and the Role of Underwriter Counsel\",\"order\":1,\"description\":{\"type\":\"doc\",\"content\":[{\"type\":\"paragraph\",\"content\":[{\"text\":\"Students will review a one-page overview of deal flow and underwriter responsibilities, then summarize the top legal risks underwriter counsel faces and how those risks are mitigated.\",\"type\":\"text\"}]}]}},{\"name\":\"Engagement Letters and Underwriting Agreements\",\"order\":2,\"description\":{\"type\":\"doc\",\"content\":[{\"type\":\"paragraph\",\"content\":[{\"text\":\"Students will review sample engagement letters and underwriting agreements, analyze key clauses, and draft comments proposing edits or negotiation points.\",\"type\":\"text\"}]}]}},{\"name\":\"Due Diligence and Information Gathering\",\"order\":3,\"description\":{\"type\":\"doc\",\"content\":[{\"type\":\"paragraph\",\"content\":[{\"text\":\"Students will examine a sample due diligence checklist and mock company disclosure, then prepare a supplemental request list targeting disclosure gaps and risk areas.\",\"type\":\"text\"}]}]}},{\"name\":\"Registration Statements and Prospectus Review\",\"order\":4,\"description\":{\"type\":\"doc\",\"content\":[{\"type\":\"paragraph\",\"content\":[{\"text\":\"Students will review sample prospectus sections (e.g., MD\u0026A, risk factors) and draft a short memo identifying one disclosure issue and explaining its significance.\",\"type\":\"text\"}]}]}},{\"name\":\"SEC, FINRA, and Exchange Compliance\",\"order\":5,\"description\":{\"type\":\"doc\",\"content\":[{\"type\":\"paragraph\",\"content\":[{\"text\":\"Students will review a sample SEC comment letter or FINRA inquiry and draft a short response on behalf of underwriter counsel addressing compliance concerns.\",\"type\":\"text\"}]}]}},{\"name\":\"Pricing, Allocation, and Closing Deliverables\",\"order\":6,\"description\":{\"type\":\"doc\",\"content\":[{\"type\":\"paragraph\",\"content\":[{\"text\":\"Students will analyze a sample closing agenda, identify key deliverables (legal opinions, comfort letters, certificates), and prepare an underwriter-focused closing checklist.\",\"type\":\"text\"}]}]}},{\"name\":\"Post-Closing Obligations and Ongoing Compliance\",\"order\":7,\"description\":{\"type\":\"doc\",\"content\":[{\"type\":\"paragraph\",\"content\":[{\"text\":\"Students will review a mock lock-up agreement and insider disclosure, then draft a short report assessing compliance with post-IPO obligations.\",\"type\":\"text\"}]}]}},{\"name\":\"Emerging Issues and Case Study Analysis\",\"order\":8,\"description\":{\"type\":\"doc\",\"content\":[{\"type\":\"paragraph\",\"content\":[{\"text\":\"Students will review a recent regulatory development or case study and draft an advisory memo recommending how underwriter counsel can mitigate related risks.\",\"type\":\"text\"}]}]}}]},\"fellows\":[{\"id\":\"f85cba13-5340-449d-b1af-e7234c234681\",\"name\":\"Yuqi Sun\",\"role\":\"Law Fellow\",\"organization\":\"Open Avenues Foundation\",\"organizationLogoUrl\":\"/images/organizations/oaf-logo.png\",\"photoUrl\":\"https://avgkrhojcamcagufngrr.supabase.co/storage/v1/object/public/fellow-headshots/f85cba13-5340-449d-b1af-e7234c234681.webp\",\"bio\":\"Yuqi Sun is a Securities Attorney Build Fellow at Open Avenues Foundation, where she works with students leading projects in Securities Law.\\nYuqi is an Associate Attorney at VCL Law LLP, where she focuses on corporate law and capital markets transactions, including initial public offerings of domestic and foreign companies in the United States, SEC regulatory compliance, and related due diligence.\\n\\nYuqi has over 1 year of professional experience in the corporate law and capital markets field. She has been involved in multiple cross-border IPOs and securities offerings, advising clients on SEC filings, disclosure requirements, and transaction structures.\\n\\nShe holds a J.D. from Georgetown University Law Center.\\n\\nA fun fact about Yuqi is that she is an animal lover.\",\"linkedinUrl\":\"https://www.linkedin.com/in/yuqisun521\"}],\"categories\":[\"Capital Markets\",\"Securities Law\",\"Underwriting Counsel\",\"Regulatory Compliance\"],\"applicationTimeline\":[{\"label\":\"Applications open\",\"value\":\"April 13, 2026\"},{\"label\":\"Applications deadline\",\"value\":\"May 20, 2026\"},{\"label\":\"Application results released\",\"value\":\"Week of May 26, 2026\"},{\"label\":\"Project start date\",\"value\":\"Week of June 8, 2026\"},{\"label\":\"Project end date\",\"value\":\"Week of July 27, 2026\"}],\"cycle_id\":\"ae26a648-44bc-4fab-bbb0-7f9c0f6b18d9\"},\"error\":\"$undefined\"}]\n"])</script></body></html>
