.js?dpl=dpl_A9QRwtuL4hrMD2RZGqb9eW7AtxES\",\"277\",\"static/chunks/54a60aa6-294bb7e111b509a4.js?dpl=dpl_A9QRwtuL4hrMD2RZGqb9eW7AtxES\",\"4420\",\"static/chunks/4420-baa8329e5076733c.js?dpl=dpl_A9QRwtuL4hrMD2RZGqb9eW7AtxES\",\"2169\",\"static/chunks/2169-1d13735e35f16c75.js?dpl=dpl_A9QRwtuL4hrMD2RZGqb9eW7AtxES\",\"419\",\"static/chunks/419-9f9e6d455ee0ae85.js?dpl=dpl_A9QRwtuL4hrMD2RZGqb9eW7AtxES\",\"5288\",\"static/chunks/5288-5d7819e0848b1b1a.js?dpl=dpl_A9QRwtuL4hrMD2RZGqb9eW7AtxES\",\"6874\",\"static/chunks/6874-67c719d6db2b17af.js?dpl=dpl_A9QRwtuL4hrMD2RZGqb9eW7AtxES\",\"6766\",\"static/chunks/6766-7fcc7eadc8fee52b.js?dpl=dpl_A9QRwtuL4hrMD2RZGqb9eW7AtxES\",\"9435\",\"static/chunks/9435-28f947009b0f7d38.js?dpl=dpl_A9QRwtuL4hrMD2RZGqb9eW7AtxES\",\"2206\",\"static/chunks/2206-42291f248e6bf19d.js?dpl=dpl_A9QRwtuL4hrMD2RZGqb9eW7AtxES\",\"5782\",\"static/chunks/5782-04eaa6c475f5c3f2.js?dpl=dpl_A9QRwtuL4hrMD2RZGqb9eW7AtxES\",\"8419\",\"static/chunks/app/projects/%5Bslug%5D/page-7f8129194c3557a1.js?dpl=dpl_A9QRwtuL4hrMD2RZGqb9eW7AtxES\"],\"default\"]\n1a:T48c,Allogenic hematopoietic stem cell transplant (HSCT) is the only cure for patients with blood, bone marrow and immune disorders. Understanding the underlying molecular biology behind HSC function, expansion, and differentiation is critical to improve cellular therapies for multiple diseases. In this Build Project, you will wear the hat of a Molecular Research Associate to perform RNA sequencing analysis and then identify relevant pathways and genes of interest in HSC functions. All this will happen in an environment that simulates the operations of a real Research team. \n\nBy the end of the 8-week project, students will develop deliverables for this project are focused on building artifacts that you can use to showcase your work in a job application. By the end of the micro-intern"])</script><script>self.__next_f.push([1,"ship, you'll review an RNAseq gene pathway from human hematopoietic stem cells, perform a comparative analysis between multiple conditions, and develop gene knockout and genotyping designs. In the final project session, you'll present your results to the Project Leader in a format that mimics a job interview (so you’re ready to discuss your work in real-life interviews)."])</script><script>self.__next_f.push([1,"b:[\"$\",\"$L19\",null,{\"project\":{\"id\":\"20b8f89d-0308-412b-bf41-c3258d352be1\",\"title\":\"Identify Gene Targets and Develop Gene Editing Strategies for Cellular Therapies\",\"slug\":\"identify-gene-targets-and-develop-gene-editing-strategies-for-cellular-therapies-1\",\"summary\":{\"type\":\"doc\",\"content\":[{\"type\":\"paragraph\",\"content\":[{\"text\":\"Use popular industry tools to analyze an RNAseq gene dataset and propose useable Crispr guides and primers for a gene knockout.\\n\",\"type\":\"text\"}]}]},\"description\":{\"type\":\"doc\",\"content\":[{\"type\":\"paragraph\",\"content\":[{\"text\":\"$1a\",\"type\":\"text\"}]}]},\"project_area\":[\"Biology \u0026 Healthcare\"],\"level\":\"Intermediate\",\"levelDescription\":\"Some experience recommended\",\"prerequisites\":{\"type\":\"doc\",\"content\":[{\"type\":\"paragraph\",\"content\":[{\"text\":\"- Commitment to start and finish the project, actively participate in all meetings, and work independently for 1 hour/week.  \",\"type\":\"text\"}]},{\"type\":\"paragraph\",\"content\":[{\"text\":\"- Basic understanding of cell biology (notions of different cell types, concept of cell differentiation)    \",\"type\":\"text\"}]},{\"type\":\"paragraph\",\"content\":[{\"text\":\"- Basic understanding of molecular biology (concept of RNA and DNA, PCR)    \",\"type\":\"text\"}]},{\"type\":\"paragraph\",\"content\":[{\"text\":\"- Intellectual curiosity about stem cells and blood formation    \",\"type\":\"text\"}]},{\"type\":\"paragraph\",\"content\":[{\"text\":\"- Attention to details  \",\"type\":\"text\"}]}]},\"goals\":{\"type\":\"doc\",\"content\":[{\"type\":\"paragraph\",\"content\":[{\"text\": :[{\"type\":\"paragraph\",\"content\":[{\"text\":\" Using a Gene analysis, identify Pathways and Genes of interest​ based on criteria of selection.\\n\",\"type\":\"text\"}]}]}},{\"name\":\"Crispr Case technology\",\"order\":6,\"description\":{\"type\":\"doc\",\"content\":[{\"type\":\"paragraph\",\"content\":[{\"text\":\"Design of CRISPR CAS9 guides for gene target.\\n\",\"type\":\"text\"}]}]}},{\"name\":\"Polymerase Chain Reaction (PCR)\",\"order\":7,\"description\":{\"type\":\"doc\",\"content\":[{\"type\":\"paragraph\",\"content\":[{\"text\":\"Design genotyping primers to confirm the presence of Genes of interest in HSCs.\\n\",\"type\":\"text\"}]}]}},{\"name\":\"Presentations\",\"order\":8,\"description\":{\"type\":\"doc\",\"content\":[{\"type\":\"paragraph\",\"content\":[{\"text\":\"Polish your project deliverables and present them to the Build Fellow and other students in the final group session.\\n\",\"type\":\"text\"}]}]}}]},\"fellows\":[{\"id\":\"02dd2c84-600a-4bbd-bad8-759fc49b00f4\",\"name\":\"Marie Goulard\",\"role\":\"Molecular Biology Fellow\",\"organization\":\"Open Avenues Foundation\",\"organizationLogoUrl\":\"/images/organizations/oaf-logo.png\",\"photoUrl\":\"https://avgkrhojcamcagufngrr.supabase.co/storage/v1/object/public/fellow-headshots/02dd2c84-600a-4bbd-bad8-759fc49b00f4.webp\",\"bio\":\"Marie Goulard is a Molecular Biology Build Fellow at Open Avenues, where she works with students leading projects in Biotechnology and Cell Therapies.\\n\\nMarie is a Director of Research and Development in Biotech, where she focuses on working across many therapeutic areas including Oncology, Hematology, and Cell Therapies.  \\n\\nMarie has over 10+ years of experience with Stem Cells and Cell therapies including in academia and in biotech company. [Add other details about your career]. She holds a Ph.D. in Oncology and Hematology from the University Paris Diderot, France.  \\n\\nA fun fact about Marie that she loves traveling to new countries to immerse herse
