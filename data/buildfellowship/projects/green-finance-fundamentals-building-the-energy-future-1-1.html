-294bb7e111b509a4.js?dpl=dpl_A9QRwtuL4hrMD2RZGqb9eW7AtxES\",\"4420\",\"static/chunks/4420-baa8329e5076733c.js?dpl=dpl_A9QRwtuL4hrMD2RZGqb9eW7AtxES\",\"2169\",\"static/chunks/2169-1d13735e35f16c75.js?dpl=dpl_A9QRwtuL4hrMD2RZGqb9eW7AtxES\",\"419\",\"static/chunks/419-9f9e6d455ee0ae85.js?dpl=dpl_A9QRwtuL4hrMD2RZGqb9eW7AtxES\",\"5288\",\"static/chunks/5288-5d7819e0848b1b1a.js?dpl=dpl_A9QRwtuL4hrMD2RZGqb9eW7AtxES\",\"6874\",\"static/chunks/6874-67c719d6db2b17af.js?dpl=dpl_A9QRwtuL4hrMD2RZGqb9eW7AtxES\",\"6766\",\"static/chunks/6766-7fcc7eadc8fee52b.js?dpl=dpl_A9QRwtuL4hrMD2RZGqb9eW7AtxES\",\"9435\",\"static/chunks/9435-28f947009b0f7d38.js?dpl=dpl_A9QRwtuL4hrMD2RZGqb9eW7AtxES\",\"2206\",\"static/chunks/2206-42291f248e6bf19d.js?dpl=dpl_A9QRwtuL4hrMD2RZGqb9eW7AtxES\",\"5782\",\"static/chunks/5782-04eaa6c475f5c3f2.js?dpl=dpl_A9QRwtuL4hrMD2RZGqb9eW7AtxES\",\"8419\",\"static/chunks/app/projects/%5Bslug%5D/page-7f8129194c3557a1.js?dpl=dpl_A9QRwtuL4hrMD2RZGqb9eW7AtxES\"],\"default\"]\n"])</script><script>self.__next_f.push([1,"b:[\"$\",\"$L19\",null,{\"project\":{\"id\":\"687ef7d9-7ef1-4321-bfec-7822f3cf2007\",\"title\":\"Build Renewable Energy Investment Models with Clarity and Confidence\",\"slug\":\"green-finance-fundamentals-building-the-energy-future-1-1\",\"summary\":{\"type\":\"doc\",\"content\":[{\"type\":\"paragraph\",\"content\":[{\"text\":\"Act as an investor evaluating a clean‑power project by analyzing revenues, costs, and financing assumptions in Excel, and communicating results through a concise investment memo.\",\"type\":\"text\"}]}]},\"description\":{\"type\":\"doc\",\"content\":[{\"type\":\"paragraph\",\"content\":[{\"text\":\"Financing renewable energy projects is one of the most common entry points for analysts and associates in the clean energy industry, making project finance skills essential for early-career professionals. In this Build Project, you'll wear the hat of a Renewable Energy Investor and build a project finance model while preparing an investment memo that reflects real industry practices. You'll learn to structure an underwriting model, model debt and tax equity financing, and forecast long-term revenues and costs. You’ll become familiar with Excel-based financial modeling, scenario testing, and compliance metrics like DSCR, all in an environment simulating the operations of a real renewable energy finance team.\",\"type\":\"text\"}]}]},\"project_area\":[\"Finance\"],\"level\":\"Intermediate\",\"levelDescription\":\"Some experience recommended\",\"prerequisites\":{\"type\":\"doc\",\"content\":[{\"type\":\"paragraph\",\"content\":[{\"text\":\"Math Fundamentals: Comfortable with percentages, ratios, and basic algebra; Basic understanding of loan (principal and interest calculations)\",\"type\":\"text\"}]},{\"type\":\"paragraph\",\"content\":[{\"text\":\"Basic Microsoft Word or Google Docs skills: write short memos and reports that summarize project findings\",\"type\":\"text\"}]},{\"type\":\"paragraph\",\"content\":[{\"text\":\"Presentation skills in PowerPoint or Google Slides: create clear slides to communicate results.\",\"type\":\"text\"}]},{\"type\":\"paragraph\",\"content\":[{\"text\":\"Basic understanding of core accounting statements (income statement, balance sheet, and cash flow), the time value of money (NPV, IRR, discounting), and the fundamentals of debt repayment (interest, principal, amortization)\",\"type\":\"text\"}]}]},\"goals\":{\"type\":\"doc\",\"content\":[{\"type\":\"paragraph\",\"content\":[{\"text\":\"Gain hands-on experience creating and interpreting simple financial models used by professionals in renewable energy and infrastructure private equity\",\"type\":\"text\"}]},{\"type\":\"paragraph\",\"content\":[{\"text\":\"Learn how money is raised, invested and repaid in solar and wind projects from lenders, investors, and developers.\",\"type\":\"text\"}]},{\"type\":\"paragraph\",\"content\":[{\"text\":\"Practice presenting project economics and investment risks clearly, the way fund managers, bankers, and asset managers do.\",\"type\":\"text\"}]}]},\"schedule\":\"Tuesdays, 7:00 P.M. ET / 4:00 P.M. PT\",\"status\":\"active\",\"duration\":\"8 weeks, 2-3 hours per week\",\"workshops\":{\"sessions\":[{\"name\":\"Why Renewable Energy Finance Matters\",\"order\":1,\"description\":{\"type\":\"doc\",\"content\":[{\"type\":\"paragraph\",\"content\":[{\"text\":\"Kick off the project by exploring how climate change and the electricity market are driving the growth of renewables. Discuss why renewable energy is not just important for sustainability, but also for creating jobs, attracting investment, and reshaping power markets. You will be introduced to the final project deliverables (Excel model, written memo, and presentation) and begin identifying what types of renewable projects or companies you might study.\",\"type\":\"text\"}]}]}},{\"name\":\"Research the Renewable Project or Company\",\"order\":2,\"description\":{\"type\":\"doc\",\"content\":[{\"type\":\"paragraph\",\"content\":[{\"text\":\"Dive into the basics of the project or company you will study. What type of renewable energy technology is it (solar, wind, storage)? How does it generate revenue (power purchase agreements, merchant sales, incentives, tax credits)? Who are the customers or off-takers, and why do they matter? What makes this project or company strategically interesting within the energy transition? You will document your findings in a short write-up that will become the first section of the investment memo.\",\"type\":\"text\"}]}]}},{\"name\":\"Understand the Market Landscape\",\"order\":3,\"description\":{\"type\":\"doc\",\"content\":[{\"type\":\"paragraph\",\"content\":[{\"text\":\"Investigate the broader renewable energy market where your project or company operates. Who are the main competitors like other developers, utilities, or technologies? What makes them different (cost, scale, technology, location, partnerships)? Which players are best positioned for long-term success, and why? How big is the potential market opportunity, and what trends (policy, technology, demand) are shaping it? You will summarize your market research in a short memo that will become the second section of the investment memo.\",\"type\":\"text\"}]}]}},{\"name\":\"Building the Model: Revenues \u0026 Costs\",\"order\":4,\"description\":{\"type\":\"doc\",\"content\":[{\"type\":\"paragraph\",\"content\":[{\"text\":\"Learn how renewable projects make money and what they cost to run. You will set up the first part of your Excel project finance model by inputting project assumptions (capacity, energy production, degradation) and calculating revenues (PPA price, merchant sales, incentives) and operating costs (O\u0026M, insurance, land lease). We will also learn some useful excel tips and tricks commonly used in finance.\",\"type\":\"text\"}]}]}},{\"name\":\"Building the Model: Financing Structure\",\"order\":5,\"description\":{\"type\":\"doc\",\"content\":[{\"type\":\"paragraph\",\"content\":[{\"text\":\"Add financing layers to the model. You will incorporate debt (loan terms, interest, amortization) and equity, and see how cash is distributed to each. This step introduces key finance concepts like DSCR and repayment schedules.\",\"type\":\"text\"}]}]}},{\"name\":\"Building the Model: Cash Flow \u0026 Returns\",\"order\":6,\"description\":{\"type\":\"doc\",\"content\":[{\"type\":\"paragraph\",\"content\":[{\"text\":\"Complete the model by combining revenues, costs, and financing to create a full project cash flow. You will calculate IRR, NPV, and other return metrics, and begin interpreting what these results say about the project’s financial viability.\",\"type\":\"text\"}]}]}},{\"name\":\"Writing the Investment Memo\",\"order\":7,\"description\":{\"type\":\"doc\",\"content\":[{\"type\":\"paragraph\",\"content\":[{\"text\":\"Translate the model into professional insights. You will draft a short investment memo that explains (1) the project/company, (2) the market opportunity, (3) the key risks, and (4) the financial results from your model. Emphasis is on writing clearly for decision-makers.\",\"type\":\"text\"}]}]}},{\"name\":\"Project Showcase\",\"order\":8,\"description\":{\"type\":\"doc\",\"content\":[{\"type\":\"paragraph\",\"content\":[{\"text\":\"You will present your completed project finance model and investment memo to the class, simulating how professionals pitch renewable energy projects to investors and fund managers.\",\"type\":\"text\"}]}]}}]},\"fellows\":[{\"id\":\"0b7046fc-4f12-432e-afe9-efeb3b620869\",\"name\":\"Tanishka Sachidanand\",\"role\":\"Finance Fellow\",\"organization\":\"Open Avenues Foundation\",\"organizationLogoUrl\":\"/images/organizations/oaf-logo.png\",\"photoUrl\":\"https://avgkrhojcamcagufngrr.supabase.co/storage/v1/object/public/fellow-headshots/0b7046fc-4f12-432e-afe9-efeb3b620869.webp\",\"bio\":\"Tanishka is a Finance Build Fellow at Open Avenues, where she works with students leading projects in renewable energy project finance.\\n\\nTanishka is a Fund Manager at Cypress Creek Renewables, where she focuses on financial structuring for utility-scale solar assets.\\n\\nTanishka has over 5 years of experience in the renewable energy finance field. She has worked across investment analysis and project structuring to support the growth and optimization of clean energy infrastructure.\\n\\nShe holds a MPA from Columbia University School of International and Public Affairs\\n\\nA fun fact about Tanishka is that she’s a part-time bookworm and full-time tennis fan \",\"linkedinUrl\":\"https://www.linkedin.com/in/tanishkasachi/\"}],\"categories\":[\"Energy\",\"Finance\",\"Structured Finance\",\"ESG\"],\"applicationTimeline\":[{\"label\":\"Applications open\",\"value\":\"May 11, 2026\"},{\"label\":\"Applications deadline\",\"value\":\"June 11, 2026\"},{\"label\":\"Application results released\",\"value\":\"Week of June 22, 2026\"},{\"label\":\"Project start date\",\"value\":\"Week of July 6, 2026\"},{\"label\":\"Project end date\",\"value\":\"Week of August 24, 2026\"}],\"cycle_id\":\"04780f7f-10bb-4b43-8480-8ef15da1b3cc\"},\"error\":\"$undefined\"}]\n"])</script></body></html>
