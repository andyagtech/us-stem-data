l_A9QRwtuL4hrMD2RZGqb9eW7AtxES\",\"4420\",\"static/chunks/4420-baa8329e5076733c.js?dpl=dpl_A9QRwtuL4hrMD2RZGqb9eW7AtxES\",\"2169\",\"static/chunks/2169-1d13735e35f16c75.js?dpl=dpl_A9QRwtuL4hrMD2RZGqb9eW7AtxES\",\"419\",\"static/chunks/419-9f9e6d455ee0ae85.js?dpl=dpl_A9QRwtuL4hrMD2RZGqb9eW7AtxES\",\"5288\",\"static/chunks/5288-5d7819e0848b1b1a.js?dpl=dpl_A9QRwtuL4hrMD2RZGqb9eW7AtxES\",\"6874\",\"static/chunks/6874-67c719d6db2b17af.js?dpl=dpl_A9QRwtuL4hrMD2RZGqb9eW7AtxES\",\"6766\",\"static/chunks/6766-7fcc7eadc8fee52b.js?dpl=dpl_A9QRwtuL4hrMD2RZGqb9eW7AtxES\",\"9435\",\"static/chunks/9435-28f947009b0f7d38.js?dpl=dpl_A9QRwtuL4hrMD2RZGqb9eW7AtxES\",\"2206\",\"static/chunks/2206-42291f248e6bf19d.js?dpl=dpl_A9QRwtuL4hrMD2RZGqb9eW7AtxES\",\"5782\",\"static/chunks/5782-04eaa6c475f5c3f2.js?dpl=dpl_A9QRwtuL4hrMD2RZGqb9eW7AtxES\",\"8419\",\"static/chunks/app/projects/%5Bslug%5D/page-7f8129194c3557a1.js?dpl=dpl_A9QRwtuL4hrMD2RZGqb9eW7AtxES\"],\"default\"]\n"])</script><script>self.__next_f.push([1,"b:[\"$\",\"$L19\",null,{\"project\":{\"id\":\"aaae0d88-132f-487a-9fa9-23e7f3e34799\",\"title\":\"Learn Graph Neural Network Through Real Examples\",\"slug\":\"learn-graph-neural-network-through-real-examples\",\"summary\":{\"type\":\"doc\",\"content\":[{\"type\":\"paragraph\",\"content\":[{\"text\":\"Learn how to use graph theory and deep learning on graphs and design entry-level applications to showcase your skills.\",\"type\":\"text\"}]}]},\"description\":{\"type\":\"doc\",\"content\":[{\"type\":\"paragraph\",\"content\":[{\"text\":\"Graphs are powerful data structures that can model complex relationships in various domains such as social networks, molecular structures, and citation networks. In this hands-on experience, you will refresh your knowledge of neural networks, learn the basics of graph theory, and dive deep into graph-based deep learning. We'll cover foundational concepts and progress to advanced topics such as Graph Attention Networks (GATs), Graph Convolutional Networks (GCNs), and GraphSAGE. You will apply your knowledge through three mini-projects: a course scheduler, model interactions in communities, molecular structure \u0026 citation networks. This will allow you to build a GitHub portfolio to showcase your skills to future employers.\",\"type\":\"text\"}]}]},\"project_area\":[\"Computer Science\"],\"level\":\"Intermediate\",\"levelDescription\":\"Some experience recommended\",\"prerequisites\":{\"type\":\"doc\",\"content\":[{\"type\":\"paragraph\",\"content\":[{\"text\":\"Intermediate skills of programming in Python: you should be able to write functions, classes, class attributes, for loops, if statements, break statements) \",\"type\":\"text\"}]},{\"type\":\"paragraph\",\"content\":[{\"text\":\"Some experience with neural networks and working with Pytorch library \",\"type\":\"text\"}]},{\"type\":\"paragraph\",\"content\":[{\"text\":\"Mathematics skills: you should understand concepts like differentiation, exponentiation, gradients\",\"type\":\"text\"}]}]},\"goals\":{\"type\":\"doc\",\"content\":[{\"type\":\"paragraph\",\"content\":[{\"text\":\"Theory behind Graph Neural Networks\",\"type\":\"text\"}]},{\"type\":\"paragraph\",\"content\":[{\"text\":\"Link prediction in citation networks\",\"type\":\"text\"}]},{\"type\":\"paragraph\",\"content\":[{\"text\":\"Graph classification on molecular data\",\"type\":\"text\"}]},{\"type\":\"paragraph\",\"content\":[{\"text\":\"Community detection in social networks\",\"type\":\"text\"}]},{\"type\":\"paragraph\",\"content\":[{\"text\":\"Depth-First Search for designing a university course scheduler\",\"type\":\"text\"}]}]},\"schedule\":\"Mondays, 5:00 P.M. ET / 2:00 P.M. PT\",\"status\":\"archived\",\"duration\":\"8 weeks, 2-3 hours per week\",\"workshops\":{\"sessions\":[{\"name\":\"What are Graph Neural Networks\",\"order\":1,\"description\":{\"type\":\"doc\",\"content\":[{\"type\":\"paragraph\",\"content\":[{\"text\":\"The project begins with an introduction to Graph Neural Networks, where you will learn what GNNs are, explore real-world examples of their use, and understand their main concepts through visual and intuitive explanations.\",\"type\":\"text\"}]}]}},{\"name\":\"Zero-to-hero crash course on neural networks\",\"order\":2,\"description\":{\"type\":\"doc\",\"content\":[{\"type\":\"paragraph\",\"content\":[{\"text\":\"GNNs rely on traditional neural networks as their backbone, the next segment is a zero-to-hero crash course on neural networks. In this workshop, you will revisit the fundamentals of forward passes, backpropagation, the stochastic gradient descent (SGD) optimizer, and different neural network structures.\",\"type\":\"text\"}]}]}},{\"name\":\"Build a neural network for scratch!\",\"order\":3,\"description\":{\"type\":\"doc\",\"content\":[{\"type\":\"paragraph\",\"content\":[{\"text\":\"Get hands-on training, where you will implement a basic training loop and experiment with various hyperparameters such as learning rate, layer sizes, and optimizers. This module encourages iteration and optimization, allowing you to observe how different changes affect model performance. At the end of this session, each student will briefly present their model choices and improvements, discussing the reasoning behind their decisions.\",\"type\":\"text\"}]}]}},{\"name\":\"Build a university course scheduler with Depth-First Search\",\"order\":4,\"description\":{\"type\":\"doc\",\"content\":[{\"type\":\"paragraph\",\"content\":[{\"text\":\"In the next workshop, you will learn about a classic graph traversal algorithm called Depth-First Search (DFS). You will use DFS to build a simple university course scheduler, illustrating how graph traversal can help in scheduling and dependency resolution tasks.\",\"type\":\"text\"}]}]}},{\"name\":\"Detect communities in local karate club\",\"order\":5,\"description\":{\"type\":\"doc\",\"content\":[{\"type\":\"paragraph\",\"content\":[{\"text\":\"In this workshop we will dive into the world of GNNs by looking at a simple graph-structured example, the well-known Zachary's karate club network. This graph describes a social network of members of a karate club and documents links between members who interacted outside the club. Here, we are interested in detecting communities that arise from the member's interaction.\",\"type\":\"text\"}]}]}},{\"name\":\"Classify links between citations\",\"order\":6,\"description\":{\"type\":\"doc\",\"content\":[{\"type\":\"paragraph\",\"content\":[{\"text\":\"In this session we will build a Graph Neural Networks to classify links between academic citations using the Cora dataset. In this dataset, nodes represent research papers described by bag-of-words feature vectors, and edges represent citation links. Your task will be to infer the category of each paper (out of seven possible categories), making use of both node features and graph structure.\",\"type\":\"text\"}]}]}},{\"name\":\"Predict Molecular properties prediction with graph neural networks\",\"order\":7,\"description\":{\"type\":\"doc\",\"content\":[{\"type\":\"paragraph\",\"content\":[{\"text\":\"In this class you will focus on molecular property prediction, a practical and impactful application of GNNs. Molecules are represented as graphs, where atoms are nodes and chemical bonds are edges. Your task will be to predict properties of molecules, such as whether a given molecule inhibits HIV virus replication. This module will demonstrate how graph-based learning can be applied in drug discovery and computational chemistry.\",\"type\":\"text\"}]}]}},{\"name\":\"Advanced topics: Graph Convolutional and Attention Networks, scaling graph with GraphSage, Graph DataBases\",\"order\":8,\"description\":{\"type\":\"doc\",\"content\":[{\"type\":\"paragraph\",\"content\":[{\"text\":\"To wrap up the project, you will be introduced to more advanced topics in the field. These include Graph Convolutional Networks (GCNs), Graph Attention Networks (GATs), and scaling techniques such as GraphSAGE for working with large graphs. Additionally, you will gain a brief overview of Graph Databases and their role in storing and querying large-scale graph data efficiently.\",\"type\":\"text\"}]}]}}]},\"fellows\":[{\"id\":\"7ff3275f-d523-4172-bb5f-94dc8f926d4b\",\"name\":\"Igor Sadalski\",\"role\":\"Mechanical Engineering Fellow\",\"organization\":\"Open Avenues Foundation\",\"organizationLogoUrl\":\"/images/organizations/oaf-logo.png\",\"photoUrl\":\"https://avgkrhojcamcagufngrr.supabase.co/storage/v1/object/public/fellow-headshots/7ff3275f-d523-4172-bb5f-94dc8f926d4b.webp\",\"bio\":\"\\\"Igor Sadalski is a Mechanical Engineering Build Fellow at Open Avenues, where he works with students leading projects in mechanical engineering, robotics and AI.\\n\\nIgor is an AI Data Scientist at Somite.ai, where he focuses on both theoretical and engineering aspects of building transformer based foundational models for biology.\\n\\nIgor has over 4 years of experience in the Engineering and Sciences field. Already in highschool, with his team, he won a silver medal for Poland in the international Young Physicist Tournament. During his undergraduate studies he twice received research scholarships from Caltech, where he worked on robotics and AI. Recently he was a visiting researcher at Harvard University working on efficient transformer based architectures.\\n\\nHe holds a Bachelor of Mechanical Engineering from Imperial College London.\\n\\nA fun fact about Igor is that the family on his mother's side has a small honey business in Poland!\\\"\",\"linkedinUrl\":\"www.linkedin.com/in/igorsadalski\"}],\"categories\":[\"Graph Neural Networks\",\"Molecular Data\",\"Social Networks\",\"Depth-First Search\"],\"applicationTimeline\":[{\"label\":\"Applications open\",\"value\":\"May 9, 2025\"},{\"label\":\"Applications deadline\",\"value\":\"June 8, 2025\"},{\"label\":\"Application results released\",\"value\":\"Week of June 23, 2025\"},{\"label\":\"Project start date\",\"value\":\"Week of July 7, 2025\"},{\"label\":\"Project end date\",\"value\":\"Week of August 25, 2025\"}],\"cycle_id\":\"77065a20-2032-46f1-b3cf-d435314c7011\"},\"error\":\"$undefined\"}]\n"])</script></body></html>
