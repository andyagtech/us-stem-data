nks/54a60aa6-294bb7e111b509a4.js?dpl=dpl_A9QRwtuL4hrMD2RZGqb9eW7AtxES\",\"4420\",\"static/chunks/4420-baa8329e5076733c.js?dpl=dpl_A9QRwtuL4hrMD2RZGqb9eW7AtxES\",\"2169\",\"static/chunks/2169-1d13735e35f16c75.js?dpl=dpl_A9QRwtuL4hrMD2RZGqb9eW7AtxES\",\"419\",\"static/chunks/419-9f9e6d455ee0ae85.js?dpl=dpl_A9QRwtuL4hrMD2RZGqb9eW7AtxES\",\"5288\",\"static/chunks/5288-5d7819e0848b1b1a.js?dpl=dpl_A9QRwtuL4hrMD2RZGqb9eW7AtxES\",\"6874\",\"static/chunks/6874-67c719d6db2b17af.js?dpl=dpl_A9QRwtuL4hrMD2RZGqb9eW7AtxES\",\"6766\",\"static/chunks/6766-7fcc7eadc8fee52b.js?dpl=dpl_A9QRwtuL4hrMD2RZGqb9eW7AtxES\",\"9435\",\"static/chunks/9435-28f947009b0f7d38.js?dpl=dpl_A9QRwtuL4hrMD2RZGqb9eW7AtxES\",\"2206\",\"static/chunks/2206-42291f248e6bf19d.js?dpl=dpl_A9QRwtuL4hrMD2RZGqb9eW7AtxES\",\"5782\",\"static/chunks/5782-04eaa6c475f5c3f2.js?dpl=dpl_A9QRwtuL4hrMD2RZGqb9eW7AtxES\",\"8419\",\"static/chunks/app/projects/%5Bslug%5D/page-7f8129194c3557a1.js?dpl=dpl_A9QRwtuL4hrMD2RZGqb9eW7AtxES\"],\"default\"]\n"])</script><script>self.__next_f.push([1,"b:[\"$\",\"$L19\",null,{\"project\":{\"id\":\"3aebd8d5-9ef5-456c-8c4b-e264422356d7\",\"title\":\"Driving Efficiency in Solar Cell Manufacturing through LEAN\",\"slug\":\"driving-efficiency-in-solar-cell-manufacturing-through-lean-1\",\"summary\":{\"type\":\"doc\",\"content\":[{\"type\":\"paragraph\",\"content\":[{\"text\":\"LEAN Operational Excellence is a management philosophy aimed at maximizing customer value by eliminating waste and enhancing efficiency across all aspects of an organization.    In this project, you will analyze and optimize the solar cell manufacturing process, identify areas of waste, and implement LEAN principles to enhance efficiency and quality, gaining practical experience in applying LEAN methodologies to real-world manufacturing challenges.\",\"type\":\"text\"}]}]},\"description\":{\"type\":\"doc\",\"content\":[{\"type\":\"paragraph\",\"content\":[{\"text\":\"Lean Operational Excellence methodologies focus on identifying and eliminating waste in manufacturing processes, improving workflow efficiency, and enhancing overall productivity. These practices involve continuous improvement techniques such as Kaizen, 5S, and Value Stream Mapping to optimize every aspect of production. By implementing these methodologies, you can create a more streamlined, cost-effective, and high-quality manufacturing operation. Through the eight workshops, you will develop a comprehensive understanding of how to create both a value stream map and a future state value stream map. These sessions will provide you with a solid foundation in understanding the solar cell process flow, enabling you to identify inefficiencies and problems within the process. Additionally, you will learn how to design actionable improvement plans to enhance efficiency and value delivery. These workshops aim to equip you with the skills and knowledge needed for effective process optimization.\",\"type\":\"text\"}]}]},\"project_area\":[\"Engineering\"],\"level\":\"Intermediate\",\"levelDescription\":\"Some experience recommended\",\"prerequisites\":{\"type\":\"doc\",\"content\":[{\"type\":\"paragraph\",\"content\":[{\"text\":\"Basic Lean Principles: Understanding of Lean Manufacturing concepts, such as waste reduction, continuous improvement, and value creation.\",\"type\":\"text\"}]},{\"type\":\"paragraph\",\"content\":[{\"text\":\"Process Mapping: Familiarity with process mapping techniques and tools to visualize workflows and identify bottlenecks.\",\"type\":\"text\"}]},{\"type\":\"paragraph\",\"content\":[{\"text\":\"Data Analysis: Basic skills in data collection and analysis, including the ability to interpret metrics related to process performance.\",\"type\":\"text\"}]}]},\"goals\":{\"type\":\"doc\",\"content\":[{\"type\":\"paragraph\",\"content\":[{\"text\":\"Learn how to streamline the processes and reduce waste, leading to higher productivity and efficiency in Solar Cell Fab.\",\"type\":\"text\"}]},{\"type\":\"paragraph\",\"content\":[{\"text\":\"Learn strategies to reduce costs by eliminating waste and optimizing the use of resources, thereby enhancing overall efficiency (Cost Minimization).\",\"type\":\"text\"}]},{\"type\":\"paragraph\",\"content\":[{\"text\":\"Develop strategies to identify and eliminate non-value-added activities, optimize workflow, and implement continuous improvement practices.\",\"type\":\"text\"}]}]},\"schedule\":\"Tuesdays, 7:00 P.M. ET / 4:00 P.M. PT\",\"status\":\"archived\",\"duration\":\"8 weeks, 2-3 hours per week\",\"workshops\":{\"sessions\":[{\"name\":\"Introduction to Lean \u0026 VSM Fundamentals\",\"order\":1,\"description\":{\"type\":\"doc\",\"content\":[{\"type\":\"paragraph\",\"content\":[{\"text\":\"You'll understand what Lean is and why it's useful, discover how VSM helps improve workflows, and see how it's applied in different areas like manufacturing to boost efficiency.\",\"type\":\"text\"}]}]}},{\"name\":\"Current State VSM – Data Collection\",\"order\":2,\"description\":{\"type\":\"doc\",\"content\":[{\"type\":\"paragraph\",\"content\":[{\"text\":\"You'll learn how to gather information about current processes. This includes understanding basic terms like how long tasks take (Cycle Time), the overall process duration (Lead Time), and the pace needed to meet demand (Takt Time). You'll also get familiar with the symbols used in Value Stream Mapping and learn how to list and describe each step in a process.\",\"type\":\"text\"}]}]}},{\"name\":\"Drawing the Current State Map\",\"order\":3,\"description\":{\"type\":\"doc\",\"content\":[{\"type\":\"paragraph\",\"content\":[{\"text\":\"You'll learn how to track the flow of materials and information and spot delays or inefficiencies in the workflow.\",\"type\":\"text\"}]}]}},{\"name\":\"Analyzing Waste in Current State\",\"order\":4,\"description\":{\"type\":\"doc\",\"content\":[{\"type\":\"paragraph\",\"content\":[{\"text\":\"You'll explore different types of waste in Lean and use the 5 Whys technique to uncover the root causes of inefficiencies.\",\"type\":\"text\"}]}]}},{\"name\":\"Future State VSM – Vision \u0026 Improvements\",\"order\":5,\"description\":{\"type\":\"doc\",\"content\":[{\"type\":\"paragraph\",\"content\":[{\"text\":\"You'll learn simple ways to improve workflows, like using tools such as Pull systems and Kanban, and figure out how to balance tasks to avoid slowdowns or backups.\",\"type\":\"text\"}]}]}},{\"name\":\"Creating the Future State Map\",\"order\":6,\"description\":{\"type\":\"doc\",\"content\":[{\"type\":\"paragraph\",\"content\":[{\"text\":\"You'll learn how to create a plan for a better process by mapping out improvements. You'll figure out how to make workflow smoothly and set practical goals to guide the changes.\",\"type\":\"text\"}]}]}},{\"name\":\"Action Plan \u0026 Implementation\",\"order\":7,\"description\":{\"type\":\"doc\",\"content\":[{\"type\":\"paragraph\",\"content\":[{\"text\":\"You'll focus on creating a plan to put improvements into action. You'll learn how to choose what changes to tackle first, like quick fixes versus bigger projects, and understand why it's important to see work in action (Gemba Walks) and get support from those involved.\",\"type\":\"text\"}]}]}},{\"name\":\"Final Presentation of the VSM\",\"order\":8,\"description\":{\"type\":\"doc\",\"content\":[{\"type\":\"paragraph\",\"content\":[{\"text\":\"You'll focus on presenting your final Value Stream Map. You'll learn how to clearly share your project, gather feedback to improve it, and show how the VSM concepts you've learned can be applied in real-life situations.\",\"type\":\"text\"}]}]}}]},\"fellows\":[{\"id\":\"9b74c7d6-3428-4917-83bd-b0833a55b40a\",\"name\":\"Wen Sonq Tai\",\"role\":\"Electronics Engineering Fellow\",\"organization\":\"Open Avenues Foundation\",\"organizationLogoUrl\":\"/images/organizations/oaf-logo.png\",\"photoUrl\":\"https://avgkrhojcamcagufngrr.supabase.co/storage/v1/object/public/fellow-headshots/9b74c7d6-3428-4917-83bd-b0833a55b40a.webp\",\"bio\":\"WS Tai is a Manufacturing and Engineering Build Fellow at Open Avenues, where he leads student projects in manufacturing and engineering. As General Manager at Solar Cell Manufacturing, WS Tai drives productivity and cost optimization through scalable processes and policies. His responsibilities include defining manufacturing objectives, developing plans for continuous improvement, and ensuring products meet customer requirements.\\nWith over 23 years of experience in the manufacturing and engineering field, WS Tai has held various leadership positions, including General Manager, Operations Director, and Manufacturing Director at MNC Manufacturing Company (Electronics Manufacturing Services, Semi-Conductor, and Solar Cell). His expertise in Lean Management and continuous improvement consistently delivers impactful results.\\nHe holds a Bachelor's Degree in Engineering. \\nA fun fact about WS Tai is that he participated in the 65th Shingijutsu Kaizen Workshop in Nagoya, Japan.\",\"linkedinUrl\":\"linkedin.com/in/ws-tai-030506ba\"}],\"categories\":[\"Value Stream Mapping (VSM)\",\"7 Waste\",\"Dynamic Kanban And ECRS Method\"],\"applicationTimeline\":[{\"label\":\"Applications open\",\"value\":\"December 1, 2025\"},{\"label\":\"Applications deadline\",\"value\":\"January 8, 2026\"},{\"label\":\"Application results released\",\"value\":\"Week of January 16, 2026\"},{\"label\":\"Project start date\",\"value\":\"Week of February 2, 2026\"},{\"label\":\"Project end date\",\"value\":\"Week of March 23, 2026\"}],\"cycle_id\":\"a76d2d1d-8f75-423e-aaec-d693bd0b4531\"},\"error\":\"$undefined\"}]\n"])</script></body></html>
