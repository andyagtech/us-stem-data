L4hrMD2RZGqb9eW7AtxES\",\"4420\",\"static/chunks/4420-baa8329e5076733c.js?dpl=dpl_A9QRwtuL4hrMD2RZGqb9eW7AtxES\",\"2169\",\"static/chunks/2169-1d13735e35f16c75.js?dpl=dpl_A9QRwtuL4hrMD2RZGqb9eW7AtxES\",\"419\",\"static/chunks/419-9f9e6d455ee0ae85.js?dpl=dpl_A9QRwtuL4hrMD2RZGqb9eW7AtxES\",\"5288\",\"static/chunks/5288-5d7819e0848b1b1a.js?dpl=dpl_A9QRwtuL4hrMD2RZGqb9eW7AtxES\",\"6874\",\"static/chunks/6874-67c719d6db2b17af.js?dpl=dpl_A9QRwtuL4hrMD2RZGqb9eW7AtxES\",\"6766\",\"static/chunks/6766-7fcc7eadc8fee52b.js?dpl=dpl_A9QRwtuL4hrMD2RZGqb9eW7AtxES\",\"9435\",\"static/chunks/9435-28f947009b0f7d38.js?dpl=dpl_A9QRwtuL4hrMD2RZGqb9eW7AtxES\",\"2206\",\"static/chunks/2206-42291f248e6bf19d.js?dpl=dpl_A9QRwtuL4hrMD2RZGqb9eW7AtxES\",\"5782\",\"static/chunks/5782-04eaa6c475f5c3f2.js?dpl=dpl_A9QRwtuL4hrMD2RZGqb9eW7AtxES\",\"8419\",\"static/chunks/app/projects/%5Bslug%5D/page-7f8129194c3557a1.js?dpl=dpl_A9QRwtuL4hrMD2RZGqb9eW7AtxES\"],\"default\"]\n"])</script><script>self.__next_f.push([1,"b:[\"$\",\"$L19\",null,{\"project\":{\"id\":\"bb9d04cc-60b8-45d4-a05a-2040fa7fc37d\",\"title\":\"Think Like a Fund Manager: Data‑Driven Asset Allocation in Python\",\"slug\":\"data-driven-asset-allocation-strategies-1-1-1\",\"summary\":{\"type\":\"doc\",\"content\":[{\"type\":\"paragraph\",\"content\":[{\"text\":\"Work hands‑on with market returns to compare portfolio approaches, validate results against benchmarks like the S\u0026P 500, and communicate conclusions through a presentation and Jupyter notebook analysis.\",\"type\":\"text\"}]}]},\"description\":{\"type\":\"doc\",\"content\":[{\"type\":\"paragraph\",\"content\":[{\"text\":\"Asset allocation is a foundational task in investment management and a core responsibility in entry-level roles across asset management, hedge funds, and quantitative finance teams. In this project, you will take on the role of a fund manager and design their own asset allocation strategy using real-world financial data. Under the guidance of an experienced finance professional, you will learn to formulate investment problems, apply quantitative models such as mean-variance optimization and factor-based approaches, and implement strategies using Python. Through rigorous backtesting and benchmarking against market benchmarks like the S\u0026P 500, you will assess performance, robustness, and practical viability. This hands-on experience will not only deepen you understanding of financial theory but also equip you with in-demand skills in data analysis, portfolio construction, and risk evaluation—key capabilities for launching a career in investment research, portfolio analytics, or quantitative finance.\",\"type\":\"text\"}]}]},\"project_area\":[\"Data Science\",\"Finance\"],\"level\":\"Intermediate\",\"levelDescription\":\"Some experience recommended\",\"prerequisites\":{\"type\":\"doc\",\"content\":[{\"type\":\"paragraph\",\"content\":[{\"text\":\"Experience with calculus, linear algebra, probability, and statistics\",\"type\":\"text\"}]},{\"type\":\"paragraph\",\"content\":[{\"text\":\"Experience with basic Python (loops, conditions, functions, libraries - numpy/pandas/matplotlib, simple algorithms) and Jupyter Notebook\",\"type\":\"text\"}]},{\"type\":\"paragraph\",\"content\":[{\"text\":\"Basic knowledge about corporate finance: you should understand the concepts of bond/stock valuations, market efficiency, risk valuation, and risk management.\",\"type\":\"text\"}]}]},\"goals\":{\"type\":\"doc\",\"content\":[{\"type\":\"paragraph\",\"content\":[{\"text\":\"Formulate real-world asset allocation problems and understand the intuition behind various investment criteria (e.g., risk-return tradeoff).\",\"type\":\"text\"}]},{\"type\":\"paragraph\",\"content\":[{\"text\":\"Solve classical and modern portfolio optimization models (e.g., mean-variance) using Python and numerical techniques.\",\"type\":\"text\"}]},{\"type\":\"paragraph\",\"content\":[{\"text\":\"Conduct robust backtesting of asset allocation strategies with real market data and compare them to standard benchmarks like equal-weight and market portfolios.\",\"type\":\"text\"}]},{\"type\":\"paragraph\",\"content\":[{\"text\":\"Interpret strategy performance using financial metrics (e.g., Sharpe ratio) and evaluate robustness across different market regimes.\",\"type\":\"text\"}]},{\"type\":\"paragraph\",\"content\":[{\"text\":\"Develop data-driven insights and clearly communicate the rationale and results of asset allocation decisions, bridging theory with investment practice.\",\"type\":\"text\"}]}]},\"schedule\":\"Fridays, 7:00 P.M. ET / 4:00 P.M. PT\",\"status\":\"applications_open\",\"duration\":\"8 weeks, 2-3 hours per week\",\"workshops\":{\"sessions\":[{\"name\":\"Introduction to Asset Allocation \u0026 Portfolio Basics\",\"order\":1,\"description\":{\"type\":\"doc\",\"content\":[{\"type\":\"paragraph\",\"content\":[{\"text\":\"What is asset allocation? Why does it matter in finance? How do we describe portfolios quantitatively using return, risk, and covariance? Set up tools, datasets, and coding environment. Deliverable: a Python notebook with return, standard deviation, and covariance calculations.\",\"type\":\"text\"}]}]}},{\"name\":\"Modern Portfolio Theory (MPT)\",\"order\":2,\"description\":{\"type\":\"doc\",\"content\":[{\"type\":\"paragraph\",\"content\":[{\"text\":\"What is the efficient frontier? How do we balance risk and return? Learn Markowitz’s mean-variance framework and use Python to construct the efficient frontier and optimal portfolio weights. Deliverable: a Python notebook implementing MPT optimization.\",\"type\":\"text\"}]}]}},{\"name\":\"Bayesian Allocation Methods\",\"order\":3,\"description\":{\"type\":\"doc\",\"content\":[{\"type\":\"paragraph\",\"content\":[{\"text\":\"Why use Bayesian statistics in portfolio construction? Learn Bayesian thinking, James-Stein estimator, and empirical Bayes. Compare Bayesian-adjusted results to classical estimates. Deliverable: a Python notebook implementing Bayesian return estimation and portfolio weights.\",\"type\":\"text\"}]}]}},{\"name\":\"Alternative Allocation Strategies\",\"order\":4,\"description\":{\"type\":\"doc\",\"content\":[{\"type\":\"paragraph\",\"content\":[{\"text\":\"What are other frameworks beyond MPT? Explore Kelly Criterion, Risk Parity, and Pair Trading. Compare risk/return tradeoffs to previous models. Deliverable: a Python notebook implementing Kelly Criterion, Risk Parity, and Pair Trading strategies.\",\"type\":\"text\"}]}]}},{\"name\":\"Asset Pricing Models (CAPM \u0026 Fama-French)\",\"order\":5,\"description\":{\"type\":\"doc\",\"content\":[{\"type\":\"paragraph\",\"content\":[{\"text\":\"How do we explain asset returns with pricing models? Implement CAPM to estimate market beta and extend to Fama-French factor models. Use factor loadings to inform allocation. Deliverable: a Python notebook calculating CAPM and Fama-French factor models.\",\"type\":\"text\"}]}]}},{\"name\":\"Portfolio Performance Analysis\",\"order\":6,\"description\":{\"type\":\"doc\",\"content\":[{\"type\":\"paragraph\",\"content\":[{\"text\":\"How do professionals evaluate portfolios? Compare results to benchmarks (e.g., S\u0026P 500) and calculate Sharpe, Sortino, and Max Drawdown ratios. Deliverable: a Python notebook evaluating portfolio performance.\",\"type\":\"text\"}]}]}},{\"name\":\"Build Portfolio \u0026 Draft Presentation\",\"order\":7,\"description\":{\"type\":\"doc\",\"content\":[{\"type\":\"paragraph\",\"content\":[{\"text\":\"How do we tell a clear story with data? Consolidate allocation models, backtests, and performance metrics. Draft project report and slides. Deliverable: near-final presentation draft and documented Python notebooks.\",\"type\":\"text\"}]}]}},{\"name\":\"Final Presentations\",\"order\":8,\"description\":{\"type\":\"doc\",\"content\":[{\"type\":\"paragraph\",\"content\":[{\"text\":\"Present your investment strategy, methods, and results in a professional format. Practice clear communication of quantitative insights, receive feedback, and reflect on learnings. Deliverable: executive presentation and final code submission.\",\"type\":\"text\"}]}]}}]},\"fellows\":[{\"id\":\"a37a4dfe-ce90-48a7-95ce-e4e48ef98945\",\"name\":\"Flora Li\",\"role\":\"Finance Fellow\",\"organization\":\"Open Avenues Foundation\",\"organizationLogoUrl\":\"/images/organizations/oaf-logo.png\",\"photoUrl\":\"https://avgkrhojcamcagufngrr.supabase.co/storage/v1/object/public/fellow-headshots/a37a4dfe-ce90-48a7-95ce-e4e48ef98945.webp\",\"bio\":\"Flora is a Finance Build Fellow at the Open Avenues Foundation, where she works with students on projects in quantitative finance and asset allocation.\\n\\nFlora has over 3 years of experience in the finance field, with a career spanning investments in cutting-edge enterprise software startups. Flora holds a B.S. in Operations Research and Financial Engineering from Columbia University.\\n\\nFlora loves to travel and explore new restaurants and cuisines.\",\"linkedinUrl\":\"https://www.linkedin.com/in/flora-li-015190149/\"}],\"categories\":[\"Quantitative Finance\",\"Portfolio Optimization\",\"Investment Strategy\",\"Risk Management\"],\"applicationTimeline\":[{\"label\":\"Applications open\",\"value\":\"August 3, 2026\"},{\"label\":\"Applications deadline\",\"value\":\"September 3, 2026\"},{\"label\":\"Application results released\",\"value\":\"Week of September 14, 2026\"},{\"label\":\"Project start date\",\"value\":\"Week of September 28, 2026\"},{\"label\":\"Project end date\",\"value\":\"Week of November 16, 2026\"}],\"cycle_id\":\"6e8885e5-3870-4327-a19c-d88c867fa48f\"},\"error\":\"$undefined\"}]\n"])</script></body></html>
