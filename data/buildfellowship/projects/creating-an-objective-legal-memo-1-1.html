420\",\"static/chunks/4420-baa8329e5076733c.js?dpl=dpl_A9QRwtuL4hrMD2RZGqb9eW7AtxES\",\"2169\",\"static/chunks/2169-1d13735e35f16c75.js?dpl=dpl_A9QRwtuL4hrMD2RZGqb9eW7AtxES\",\"419\",\"static/chunks/419-9f9e6d455ee0ae85.js?dpl=dpl_A9QRwtuL4hrMD2RZGqb9eW7AtxES\",\"5288\",\"static/chunks/5288-5d7819e0848b1b1a.js?dpl=dpl_A9QRwtuL4hrMD2RZGqb9eW7AtxES\",\"6874\",\"static/chunks/6874-67c719d6db2b17af.js?dpl=dpl_A9QRwtuL4hrMD2RZGqb9eW7AtxES\",\"6766\",\"static/chunks/6766-7fcc7eadc8fee52b.js?dpl=dpl_A9QRwtuL4hrMD2RZGqb9eW7AtxES\",\"9435\",\"static/chunks/9435-28f947009b0f7d38.js?dpl=dpl_A9QRwtuL4hrMD2RZGqb9eW7AtxES\",\"2206\",\"static/chunks/2206-42291f248e6bf19d.js?dpl=dpl_A9QRwtuL4hrMD2RZGqb9eW7AtxES\",\"5782\",\"static/chunks/5782-04eaa6c475f5c3f2.js?dpl=dpl_A9QRwtuL4hrMD2RZGqb9eW7AtxES\",\"8419\",\"static/chunks/app/projects/%5Bslug%5D/page-7f8129194c3557a1.js?dpl=dpl_A9QRwtuL4hrMD2RZGqb9eW7AtxES\"],\"default\"]\n"])</script><script>self.__next_f.push([1,"b:[\"$\",\"$L19\",null,{\"project\":{\"id\":\"d0365e12-4ce8-463d-bc5d-74df4592204d\",\"title\":\"Creating an Objective Legal Memo\",\"slug\":\"creating-an-objective-legal-memo-1-1\",\"summary\":{\"type\":\"doc\",\"content\":[{\"type\":\"paragraph\",\"content\":[{\"text\":\"Learn how to draft a legal memorandum like a lawyer, that showcases objective legal analysis and conclusions.\",\"type\":\"text\"}]}]},\"description\":{\"type\":\"doc\",\"content\":[{\"type\":\"paragraph\",\"content\":[{\"text\":\"There are two forms of writing most used within the legal industry: objective legal writing and persuasive legal writing. Whether in a law firm or in-house legal team, a necessary skill for all lawyers is the ability to draft an objective legal memorandum, in which a legal question is answered objectively, with all sides and possibilities looked at. In this Build Project, you will wear the hat of an entry level lawyer and will learn how to formulate a research strategy when presented with a legal question that needs answering, how to find and analyze the laws relevant to your search, and finally, how to write this analysis down for your legal or non-legal audience to understand.\",\"type\":\"text\"}]}]},\"project_area\":[\"Law\"],\"level\":\"Intermediate\",\"levelDescription\":\"Some experience recommended\",\"prerequisites\":{\"type\":\"doc\",\"content\":[{\"type\":\"paragraph\",\"content\":[{\"text\":\"Basic critical thinking skills.\",\"type\":\"text\"}]},{\"type\":\"paragraph\",\"content\":[{\"text\":\"Basic research and writing skills.\",\"type\":\"text\"}]},{\"type\":\"paragraph\",\"content\":[{\"text\":\"Ability to read long documents.\",\"type\":\"text\"}]},{\"type\":\"paragraph\",\"content\":[{\"text\":\"An interest in the legal industry.\",\"type\":\"text\"}]},{\"type\":\"paragraph\",\"content\":[{\"text\":\"Basic familiarity with Microsoft Word.\",\"type\":\"text\"}]}]},\"goals\":{\"type\":\"doc\",\"content\":[{\"type\":\"paragraph\",\"content\":[{\"text\":\"Create a generalized legal research strategy to use in any area of law.\",\"type\":\"text\"}]},{\"type\":\"paragraph\",\"content\":[{\"text\":\"Analyze laws and apply that analysis to form legal conclusions.\",\"type\":\"text\"}]},{\"type\":\"paragraph\",\"content\":[{\"text\":\"Write a formal legal memo.\",\"type\":\"text\"}]}]},\"schedule\":\"Fridays, 7:30 P.M. ET / 4:30 P.M. PT\",\"status\":\"active\",\"duration\":\"8 weeks, 2-3 hours per week\",\"workshops\":{\"sessions\":[{\"name\":\"Introduction to the US Legal System\",\"order\":1,\"description\":{\"type\":\"doc\",\"content\":[{\"type\":\"paragraph\",\"content\":[{\"text\":\"Through a broad overview, you will learn broadly how the country's legal system works. You will learn how Congress and federal and state courts interplay with each other within the system to create laws.\",\"type\":\"text\"}]}]}},{\"name\":\"Intro to Legal Research\",\"order\":2,\"description\":{\"type\":\"doc\",\"content\":[{\"type\":\"paragraph\",\"content\":[{\"text\":\"You will be taught how to navigate one or more of the standard legal databases used in the industry. You will also learn the basics of formulating a big-picture legal research strategy. Hypothetical facts will be given to you to use for the end of project work, the objective legal memo, as well as format requirements.\",\"type\":\"text\"}]}]}},{\"name\":\"Intro to Legal Research Part 2\",\"order\":3,\"description\":{\"type\":\"doc\",\"content\":[{\"type\":\"paragraph\",\"content\":[{\"text\":\"You will learn about the different sources of law and how to find them. You will also learn how to use these different sources in your own legal writing.\",\"type\":\"text\"}]}]}},{\"name\":\"Research Strategies - Analyzing Statutes\",\"order\":4,\"description\":{\"type\":\"doc\",\"content\":[{\"type\":\"paragraph\",\"content\":[{\"text\":\"You will learn how to find statutes relevant to your research and how to analyze them. You will also learn how to break the statute down into elements necessary for application.\",\"type\":\"text\"}]}]}},{\"name\":\"Research Strategies – Analyzing Cases\",\"order\":5,\"description\":{\"type\":\"doc\",\"content\":[{\"type\":\"paragraph\",\"content\":[{\"text\":\"You will learn how to locate court cases relevant to your research. You will also learn how to understand these cases and create rule statements out of them.\",\"type\":\"text\"}]}]}},{\"name\":\"Legal Writing\",\"order\":6,\"description\":{\"type\":\"doc\",\"content\":[{\"type\":\"paragraph\",\"content\":[{\"text\":\"You will learn how to compare cases as a reasoning tool in legal writing. You will also learn how to apply the law (cases and statutes) to the facts of a given hypothetical for the objective legal memo, as well as how to how to write for both a legal and non-legal audience.\",\"type\":\"text\"}]}]}},{\"name\":\"Other Memo Sections and Citations\",\"order\":7,\"description\":{\"type\":\"doc\",\"content\":[{\"type\":\"paragraph\",\"content\":[{\"text\":\"You will learn how to write other non-analysis sections of the objective memo. You will also be taught how to use the Bluebook to format citations for sources used in their memos and other legal writing. The objective legal memo final project document will be due after this session, but before session 8.\",\"type\":\"text\"}]}]}},{\"name\":\"Memo Writing Review and Presentations\",\"order\":8,\"description\":{\"type\":\"doc\",\"content\":[{\"type\":\"paragraph\",\"content\":[{\"text\":\"You will be given a general refresher of previous sessions' material on the US legal system, legal research and legal writing. You will present your final legal conclusions, as well as thoughts on the research and writing process.\",\"type\":\"text\"}]}]}}]},\"fellows\":[{\"id\":\"22a1e8ca-e44b-4540-aa84-cb57956d1037\",\"name\":\"Nkechi Nnachetta\",\"role\":\"Law Fellow\",\"organization\":\"Open Avenues Foundation\",\"organizationLogoUrl\":\"/images/organizations/oaf-logo.png\",\"photoUrl\":\"https://avgkrhojcamcagufngrr.supabase.co/storage/v1/object/public/fellow-headshots/22a1e8ca-e44b-4540-aa84-cb57956d1037.webp\",\"bio\":\"Nkechi Nnachetta is a Law Build Fellow at Open Avenues, where she works with students leading projects in the legal field.\\n\\nNkechi previously worked as a bankruptcy lawyer at Glast, Phillips \u0026 Murray, where she focused on conducting legal research and drafting pleadings for bankruptcy proceedings.\\n\\nNkechi has over a year of experience in the legal field.\\n\\nShe holds a Master of Laws (LL.M) in Bankruptcy from St. John’s University School of Law, a Juris Doctor (J.D..) degree from Georgetown University Law Center, and a Bachelor of Arts in International Relations and Political Science from the University of Indianapolis.\\n\\nA fun fact about Nkechi is that she is an avid crocheter.\",\"linkedinUrl\":\"www.linkedin.com/in/nkechi-nnachetta-ab7b71101\"}],\"categories\":[\"Legal research\",\"Legal analysis\",\"Case law\",\"Statutory application\"],\"applicationTimeline\":[{\"label\":\"Applications open\",\"value\":\"May 11, 2026\"},{\"label\":\"Applications deadline\",\"value\":\"June 11, 2026\"},{\"label\":\"Application results released\",\"value\":\"Week of June 22, 2026\"},{\"label\":\"Project start date\",\"value\":\"Week of July 6, 2026\"},{\"label\":\"Project end date\",\"value\":\"Week of August 24, 2026\"}],\"cycle_id\":\"04780f7f-10bb-4b43-8480-8ef15da1b3cc\"},\"error\":\"$undefined\"}]\n"])</script></body></html>
