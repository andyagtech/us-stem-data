,\"277\",\"static/chunks/54a60aa6-294bb7e111b509a4.js?dpl=dpl_A9QRwtuL4hrMD2RZGqb9eW7AtxES\",\"4420\",\"static/chunks/4420-baa8329e5076733c.js?dpl=dpl_A9QRwtuL4hrMD2RZGqb9eW7AtxES\",\"2169\",\"static/chunks/2169-1d13735e35f16c75.js?dpl=dpl_A9QRwtuL4hrMD2RZGqb9eW7AtxES\",\"419\",\"static/chunks/419-9f9e6d455ee0ae85.js?dpl=dpl_A9QRwtuL4hrMD2RZGqb9eW7AtxES\",\"5288\",\"static/chunks/5288-5d7819e0848b1b1a.js?dpl=dpl_A9QRwtuL4hrMD2RZGqb9eW7AtxES\",\"6874\",\"static/chunks/6874-67c719d6db2b17af.js?dpl=dpl_A9QRwtuL4hrMD2RZGqb9eW7AtxES\",\"6766\",\"static/chunks/6766-7fcc7eadc8fee52b.js?dpl=dpl_A9QRwtuL4hrMD2RZGqb9eW7AtxES\",\"9435\",\"static/chunks/9435-28f947009b0f7d38.js?dpl=dpl_A9QRwtuL4hrMD2RZGqb9eW7AtxES\",\"2206\",\"static/chunks/2206-42291f248e6bf19d.js?dpl=dpl_A9QRwtuL4hrMD2RZGqb9eW7AtxES\",\"5782\",\"static/chunks/5782-04eaa6c475f5c3f2.js?dpl=dpl_A9QRwtuL4hrMD2RZGqb9eW7AtxES\",\"8419\",\"static/chunks/app/projects/%5Bslug%5D/page-7f8129194c3557a1.js?dpl=dpl_A9QRwtuL4hrMD2RZGqb9eW7AtxES\"],\"default\"]\n1a:T52d,\"Ketan Lahurikar is a Civil Engineering Build Fellow at Open Avenues Foundation, where he works with students leading projects in Civil Engineering field.\n\nKetan is a Civil Engineer II at Cordoba Corporation, where he focuses on reviewing construction plans, managing project costs and overseeing comprehensive schedule reviews to ensure project timelines and specifications are met. He also manages and reviews change orders and maintains equipment database, ensuring all documentation and activities align with project goals and standards.\n\nKetan has over 7 years of experience in the Civil Engineering field. He excels in overseeing complex water infrastructure and utility projects, ensuring operational efficiency, managing risks, and coordinating diverse teams to achieve project goa"])</script><script>self.__next_f.push([1,"ls on time and within budget. His experience includes leading projects related to water treatment plants, transmission lines, corrective maintenance, and EPC methodologies, consistently delivering successful outcomes and driving continuous program improvements.\n\nHe holds a Master of Science in Civil Engineering from Texas A\u0026M University-Kingsville \u0026 Professional MBA from Campbellsville University.\n\nA fun fact about Ketan is: When not at work, you'll find him either playing sports, watching them on TV, or exploring national parks.\""])</script><script>self.__next_f.push([1,"b:[\"$\",\"$L19\",null,{\"project\":{\"id\":\"c32e76a3-4406-4c90-95f1-38a688adf348\",\"title\":\"Build Smarter: Construction Project Lifecycle \u0026 Tech Essentials\",\"slug\":\"build-smarter-construction-project-lifecycle-and-tech-essentials-1-1\",\"summary\":{\"type\":\"doc\",\"content\":[{\"type\":\"paragraph\",\"content\":[{\"text\":\"Create a beginner-friendly portfolio of real-world construction documents by defining scope, securing build scheduling permits, and exploring AI tools.\",\"type\":\"text\"}]}]},\"description\":{\"type\":\"doc\",\"content\":[{\"type\":\"paragraph\",\"content\":[{\"text\":\"From concept to close‑out, every civil project moves through a predictable set of milestones. In this Build Project you'll step into the shoes of a junior project engineer and walk a mock job through permits, RFIs, inspections, schedules, and earned‑value check‑ins—all while seeing where emerging AI tools can streamline the process. Each session you'll learn the key elements in executing a civil engineering project. By the end, you'll understand the key elements of project execution, know how to build and monitor a simple schedule, and see how new technology is reshaping the civil‑engineering workplace—insights you can showcase in your next internship or co‑op interview.\",\"type\":\"text\"}]}]},\"project_area\":[\"Engineering\"],\"level\":\"Beginner\",\"levelDescription\":\"No prior experience required\",\"prerequisites\":{\"type\":\"doc\",\"content\":[{\"type\":\"paragraph\",\"content\":[{\"text\":\"Spreadsheet proficiency: comfortable entering quantities, using simple formulas, and drawing quick Gantt bars in Google Sheets or Excel.\",\"type\":\"text\"}]},{\"type\":\"paragraph\",\"content\":[{\"text\":\"Basic scheduling concepts: understand that tasks have durations and depend on each other; we'll build a simple schedule together.\",\"type\":\"text\"}]},{\"type\":\"paragraph\",\"content\":[{\"text\":\"Plan-reading basics: recognize symbols/line types on a civil plan sheet; we'll decode a sample in class.\",\"type\":\"text\"}]},{\"type\":\"paragraph\",\"content\":[{\"text\":\"Permitting awareness: know that projects require ROW, environmental, and agency permits; we'll map the key approvals.\",\"type\":\"text\"}]},{\"type\":\"paragraph\",\"content\":[{\"text\":\"Project execution mindset: willingness to track progress, flag issues, and communicate clearly in a team setting.\",\"type\":\"text\"}]}]},\"goals\":{\"type\":\"doc\",\"content\":[{\"type\":\"paragraph\",\"content\":[{\"text\":\"Identify the three critical starts up elements for any civil project (scope, constraints, stakeholders).\",\"type\":\"text\"}]},{\"type\":\"paragraph\",\"content\":[{\"text\":\"Learn essential preconstruction approvals, including land acquisition, environmental, and permit clearances.\",\"type\":\"text\"}]},{\"type\":\"paragraph\",\"content\":[{\"text\":\"Understand what an RFI (request for information) and submittal are, and how to use them for clear project communication.\",\"type\":\"text\"}]},{\"type\":\"paragraph\",\"content\":[{\"text\":\"Create a draft project schedule \u0026 perform Earned Value Management (EVM) analysis.\",\"type\":\"text\"}]},{\"type\":\"paragraph\",\"content\":[{\"text\":\"Discover one emerging software or AI tool that civil engineers are beginning to use.\",\"type\":\"text\"}]},{\"type\":\"paragraph\",\"content\":[{\"text\":\"Present all of your work in a concise, 6-slide portfolio that shows your new skills.\",\"type\":\"text\"}]}]},\"schedule\":\"Tuesdays, 3:00 P.M. ET / 12:00 P.M. PT\",\"status\":\"archived\",\"duration\":\"8 weeks, 2-3 hours per week\",\"workshops\":{\"sessions\":[{\"name\":\"Project Kick-off \u0026 Civil Basics\",\"order\":1,\"description\":{\"type\":\"doc\",\"content\":[{\"type\":\"paragraph\",\"content\":[{\"text\":\"Explore what makes a project successful by examining scope, constraints and stakeholders, then draft a brief project overview to anchor the rest of the course.\",\"type\":\"text\"}]}]}},{\"name\":\"Contract Delivery Models \u0026 Project Selection\",\"order\":2,\"description\":{\"type\":\"doc\",\"content\":[{\"type\":\"paragraph\",\"content\":[{\"text\":\"Compare Design-Bid-Build, Design-Build, CMAR and EPC models, discuss their risk and cost trade-offs, and select the mock civil project that each student will carry through the remaining weeks.\",\"type\":\"text\"}]}]}},{\"name\":\"Permits, Land Acquisition \u0026 Environmental Clearances\",\"order\":3,\"description\":{\"type\":\"doc\",\"content\":[{\"type\":\"paragraph\",\"content\":[{\"text\":\"Identify the key permits, land-acquisition steps and environmental approvals required before construction begins and note the agencies and timelines that govern each one.\",\"type\":\"text\"}]}]}},{\"name\":\"RFIs, Submittals \u0026 Project Communication\",\"order\":4,\"description\":{\"type\":\"doc\",\"content\":[{\"type\":\"paragraph\",\"content\":[{\"text\":\"Learn how RFIs and submittals keep teams aligned; draft a sample RFI, start a submittal log and write a short clarification memo that could prompt a future change-order discussion.\",\"type\":\"text\"}]}]}},{\"name\":\"Inspections, QA/QC \u0026 Change Orders\",\"order\":5,\"description\":{\"type\":\"doc\",\"content\":[{\"type\":\"paragraph\",\"content\":[{\"text\":\"Outline an inspection-checklist framework, draft a daily field note and punch-list item, and sketch a concise change-order stub that would correct a discovered non-conformance.\",\"type\":\"text\"}]}]}},{\"name\":\"Scheduling \u0026 Earned-Value Basics\",\"order\":6,\"description\":{\"type\":\"doc\",\"content\":[{\"type\":\"paragraph\",\"content\":[{\"text\":\"Build a starter CPM/Gantt schedule in a spreadsheet and create a simple earned-value snapshot (PV, EV, variance) to see whether work is on time and on budget.\",\"type\":\"text\"}]}]}},{\"name\":\"Emerging Tools \u0026 AI for Civil Engineers\",\"order\":7,\"description\":{\"type\":\"doc\",\"content\":[{\"type\":\"paragraph\",\"content\":[{\"text\":\"Evaluate a modern BIM, drone-mapping or AI scheduling tool, summarize how it could benefit the chosen project and prepare a brief innovation note.\",\"type\":\"text\"}]}]}},{\"name\":\"Final Showcase \u0026 Career Reflection\",\"order\":8,\"description\":{\"type\":\"doc\",\"content\":[{\"type\":\"paragraph\",\"content\":[{\"text\":\"Present a concise eight-slide deck that stitches together the project brief, approvals map, communication docs, QA/QC tools, schedule and innovation insights, then share key take-aways and receive career guidance.\",\"type\":\"text\"}]}]}}]},\"fellows\":[{\"id\":\"88226e4a-220a-4bd3-9890-ff1305aa6fab\",\"name\":\"Ketan Sanjay Lahurikar\",\"role\":\"Civil Engineering Fellow\",\"organization\":\"Open Avenues Foundation\",\"organizationLogoUrl\":\"/images/organizations/oaf-logo.png\",\"photoUrl\":\"https://avgkrhojcamcagufngrr.supabase.co/storage/v1/object/public/fellow-headshots/88226e4a-220a-4bd3-9890-ff1305aa6fab.webp\",\"bio\":\"$1a\",\"linkedinUrl\":\"https://www.linkedin.com/in/ketanlahurikar/\"}],\"categories\":[\"Construction scheduling\",\"Construction planning \u0026 execution\",\"Project Lifecycle\"],\"applicationTimeline\":[{\"label\":\"Applications open\",\"value\":\"April 13, 2026\"},{\"label\":\"Applications deadline\",\"value\":\"May 20, 2026\"},{\"label\":\"Application results released\",\"value\":\"Week of May 26, 2026\"},{\"label\":\"Project start date\",\"value\":\"Week of June 8, 2026\"},{\"label\":\"Project end date\",\"value\":\"Week of July 27, 2026\"}],\"cycle_id\":\"ae26a648-44bc-4fab-bbb0-7f9c0f6b18d9\"},\"error\":\"$undefined\"}]\n"])</script></body></html>
