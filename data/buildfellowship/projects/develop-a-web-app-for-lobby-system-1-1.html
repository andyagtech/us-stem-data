\",\"4420\",\"static/chunks/4420-baa8329e5076733c.js?dpl=dpl_A9QRwtuL4hrMD2RZGqb9eW7AtxES\",\"2169\",\"static/chunks/2169-1d13735e35f16c75.js?dpl=dpl_A9QRwtuL4hrMD2RZGqb9eW7AtxES\",\"419\",\"static/chunks/419-9f9e6d455ee0ae85.js?dpl=dpl_A9QRwtuL4hrMD2RZGqb9eW7AtxES\",\"5288\",\"static/chunks/5288-5d7819e0848b1b1a.js?dpl=dpl_A9QRwtuL4hrMD2RZGqb9eW7AtxES\",\"6874\",\"static/chunks/6874-67c719d6db2b17af.js?dpl=dpl_A9QRwtuL4hrMD2RZGqb9eW7AtxES\",\"6766\",\"static/chunks/6766-7fcc7eadc8fee52b.js?dpl=dpl_A9QRwtuL4hrMD2RZGqb9eW7AtxES\",\"9435\",\"static/chunks/9435-28f947009b0f7d38.js?dpl=dpl_A9QRwtuL4hrMD2RZGqb9eW7AtxES\",\"2206\",\"static/chunks/2206-42291f248e6bf19d.js?dpl=dpl_A9QRwtuL4hrMD2RZGqb9eW7AtxES\",\"5782\",\"static/chunks/5782-04eaa6c475f5c3f2.js?dpl=dpl_A9QRwtuL4hrMD2RZGqb9eW7AtxES\",\"8419\",\"static/chunks/app/projects/%5Bslug%5D/page-7f8129194c3557a1.js?dpl=dpl_A9QRwtuL4hrMD2RZGqb9eW7AtxES\"],\"default\"]\n"])</script><script>self.__next_f.push([1,"b:[\"$\",\"$L19\",null,{\"project\":{\"id\":\"1a74228e-83d4-4a95-8ca0-77aee547659e\",\"title\":\"Build A Multiplayer Lobby System\",\"slug\":\"develop-a-web-app-for-lobby-system-1-1\",\"summary\":{\"type\":\"doc\",\"content\":[{\"type\":\"paragraph\",\"content\":[{\"text\":\"Build a web app from scratch: create a lobby system for hosting multi-player events of your own choice.\",\"type\":\"text\"}]}]},\"description\":{\"type\":\"doc\",\"content\":[{\"type\":\"paragraph\",\"content\":[{\"text\":\"Are you looking for entry-level software development experience with a wholistic vision? In this Build Project, you'll wear the hat of Full-stack Software Developer and analyze the user needs, prepare necessary programming knowledge, plan stepwise approach for UI, API implementations and conduct the software development from scratch to support users playing tic-tac-toe using virtual web lobby to join or create the event. Under the supervision of an experienced industry expert, you'll develop a full-stack web app using React, REST API using Node JS and Express framework and version control your code in a repository. You'll become familiar with full-stack software development like React, HTML, CSS, Node JS by following the Object-Oriented Principles. All this will happen in an environment that simulates the operations of a real software development team.\",\"type\":\"text\"}]}]},\"project_area\":[\"Computer Science\"],\"level\":\"Intermediate\",\"levelDescription\":\"Some experience recommended\",\"prerequisites\":{\"type\":\"doc\",\"content\":[{\"type\":\"paragraph\",\"content\":[{\"text\":\"Curiosity to learn new things and find out different options to achieve a same goal.\",\"type\":\"text\"}]},{\"type\":\"paragraph\",\"content\":[{\"text\":\"Grasp of computer science skills such as being familiar with data structure, sorting algorithms, functional programming.\",\"type\":\"text\"}]},{\"type\":\"paragraph\",\"content\":[{\"text\":\"Proficiency with Node JS(or proficiency in another language). You should be comfortable working on a full-stack project and be able to learn and work with NPM libraries.\",\"type\":\"text\"}]},{\"type\":\"paragraph\",\"content\":[{\"text\":\"Readiness to stick to professional communication practices: give regular and timely updates about your progress, openly discuss difficulties you encounter before they affect project deadlines.\",\"type\":\"text\"}]}]},\"goals\":{\"type\":\"doc\",\"content\":[{\"type\":\"paragraph\",\"content\":[{\"text\":\"Conduct a Software Development from scratch that supports user to use lobby system to host events for others to join.\",\"type\":\"text\"}]},{\"type\":\"paragraph\",\"content\":[{\"text\":\"Development of REST API from scratch using Node JS and Express.\",\"type\":\"text\"}]},{\"type\":\"paragraph\",\"content\":[{\"text\":\"Full-stack Web Development vision and experience.\",\"type\":\"text\"}]},{\"type\":\"paragraph\",\"content\":[{\"text\":\"Version control, repositories using Github.\",\"type\":\"text\"}]}]},\"schedule\":\"Tuesdays, 9:00 A.M. ET / 6:00 A.M. PT\",\"status\":\"active\",\"duration\":\"8 weeks, 2-3 hours per week\",\"workshops\":{\"sessions\":[{\"name\":\"Introduction and warm-up for something awesome upcoming\",\"order\":1,\"description\":{\"type\":\"doc\",\"content\":[{\"type\":\"paragraph\",\"content\":[{\"text\":\"Get to know the Build Fellow and other students, ask questions about the project requirements, prepare your workspace. Demo of a sample project that supports the engagements.\",\"type\":\"text\"}]}]}},{\"name\":\"Development journey kicks off\",\"order\":2,\"description\":{\"type\":\"doc\",\"content\":[{\"type\":\"paragraph\",\"content\":[{\"text\":\"Understand project requirements, setup GitHub, Initialize React frontend projects. Real-time experience and best-practice sharing.\",\"type\":\"text\"}]}]}},{\"name\":\"Frontend development round 2\",\"order\":3,\"description\":{\"type\":\"doc\",\"content\":[{\"type\":\"paragraph\",\"content\":[{\"text\":\"Continue and finish the development of React frontend projects to support tic-tac-toe event. Interactive group participation of solving browser riddles that will weave in necessary frontend debugging knowledge through the progress.\",\"type\":\"text\"}]}]}},{\"name\":\"Rest API development adventure starts\",\"order\":4,\"description\":{\"type\":\"doc\",\"content\":[{\"type\":\"paragraph\",\"content\":[{\"text\":\"Development start of REST API using Node JS, Express, using NPM to install necessary libraries, understand the role of those libraries playing in the projects. Introduction of the pros and cons of mono repo, code organization, high level vision of this project.\",\"type\":\"text\"}]}]}},{\"name\":\"Rest API development round 2 with Socket programming\",\"order\":5,\"description\":{\"type\":\"doc\",\"content\":[{\"type\":\"paragraph\",\"content\":[{\"text\":\"Add in socket I.O library to the project and implement the API to support selected event and connect back to Frontend React App with the API endpoints. Best practices introduced in express. \",\"type\":\"text\"}]}]}},{\"name\":\"Database kicks in / React connection continued\",\"order\":6,\"description\":{\"type\":\"doc\",\"content\":[{\"type\":\"paragraph\",\"content\":[{\"text\":\"Setup database structure and connect necessary business logics with database operations or continued React connection with REST API Socket programming. Q\u0026A for final session of demoing project final deliverable.\",\"type\":\"text\"}]}]}},{\"name\":\"Tidy up and march as far as you can\",\"order\":7,\"description\":{\"type\":\"doc\",\"content\":[{\"type\":\"paragraph\",\"content\":[{\"text\":\"Finish all the API implementations and support connection between API and React frontend, refactor code and make UI presentable. Continued Q\u0026A.\",\"type\":\"text\"}]}]}},{\"name\":\"Showcase time\",\"order\":8,\"description\":{\"type\":\"doc\",\"content\":[{\"type\":\"paragraph\",\"content\":[{\"text\":\"Polish your project deliverables and present them to the Build Fellow and other students in the final group session.\",\"type\":\"text\"}]}]}}]},\"fellows\":[{\"id\":\"d20ae9f8-d870-421e-adc4-56853c6a85ee\",\"name\":\"Richard Wu\",\"role\":\"Computer Science Fellow\",\"organization\":\"Open Avenues Foundation\",\"organizationLogoUrl\":\"/images/organizations/oaf-logo.png\",\"photoUrl\":\"https://avgkrhojcamcagufngrr.supabase.co/storage/v1/object/public/fellow-headshots/d20ae9f8-d870-421e-adc4-56853c6a85ee.webp\",\"bio\":\"My name is Ruicheng Wu, with a close English pronunciation, I go with Richard for my first name. I am a Computer Science Fellow with OAF, I enjoy bicycle riding, swimming, alpine skiing, watching anime, board gaming, and playing guitar as part of my favorite indoor activities.\",\"linkedinUrl\":\"https://www.linkedin.com/\"}],\"categories\":[\"Web development\",\"REST API\",\"Full-stack development\",\"React\"],\"applicationTimeline\":[{\"label\":\"Applications open\",\"value\":\"May 11, 2026\"},{\"label\":\"Applications deadline\",\"value\":\"June 11, 2026\"},{\"label\":\"Application results released\",\"value\":\"Week of June 22, 2026\"},{\"label\":\"Project start date\",\"value\":\"Week of July 6, 2026\"},{\"label\":\"Project end date\",\"value\":\"Week of August 24, 2026\"}],\"cycle_id\":\"04780f7f-10bb-4b43-8480-8ef15da1b3cc\"},\"error\":\"$undefined\"}]\n"])</script></body></html>
