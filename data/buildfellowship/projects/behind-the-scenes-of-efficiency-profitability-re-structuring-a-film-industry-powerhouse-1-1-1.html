/chunks/22747d63-b78dbc5d907b1f14.js?dpl=dpl_A9QRwtuL4hrMD2RZGqb9eW7AtxES\",\"277\",\"static/chunks/54a60aa6-294bb7e111b509a4.js?dpl=dpl_A9QRwtuL4hrMD2RZGqb9eW7AtxES\",\"4420\",\"static/chunks/4420-baa8329e5076733c.js?dpl=dpl_A9QRwtuL4hrMD2RZGqb9eW7AtxES\",\"2169\",\"static/chunks/2169-1d13735e35f16c75.js?dpl=dpl_A9QRwtuL4hrMD2RZGqb9eW7AtxES\",\"419\",\"static/chunks/419-9f9e6d455ee0ae85.js?dpl=dpl_A9QRwtuL4hrMD2RZGqb9eW7AtxES\",\"5288\",\"static/chunks/5288-5d7819e0848b1b1a.js?dpl=dpl_A9QRwtuL4hrMD2RZGqb9eW7AtxES\",\"6874\",\"static/chunks/6874-67c719d6db2b17af.js?dpl=dpl_A9QRwtuL4hrMD2RZGqb9eW7AtxES\",\"6766\",\"static/chunks/6766-7fcc7eadc8fee52b.js?dpl=dpl_A9QRwtuL4hrMD2RZGqb9eW7AtxES\",\"9435\",\"static/chunks/9435-28f947009b0f7d38.js?dpl=dpl_A9QRwtuL4hrMD2RZGqb9eW7AtxES\",\"2206\",\"static/chunks/2206-42291f248e6bf19d.js?dpl=dpl_A9QRwtuL4hrMD2RZGqb9eW7AtxES\",\"5782\",\"static/chunks/5782-04eaa6c475f5c3f2.js?dpl=dpl_A9QRwtuL4hrMD2RZGqb9eW7AtxES\",\"8419\",\"static/chunks/app/projects/%5Bslug%5D/page-7f8129194c3557a1.js?dpl=dpl_A9QRwtuL4hrMD2RZGqb9eW7AtxES\"],\"default\"]\n1a:T452,Luigi Spitaleri is a seasoned executive specializing in business development, strategy, and capital markets within the film and entertainment sectors. \n\nAs VP of Business Development \u0026 Strategy at Ashland Hill Media Finance, Luigi has plays a pivotal role in leading corporate fundraising efforts and closing film finance transactions. Over his career, he has secured over $500M in private credit facilities and closed over $200M in film transactions. His expertise spans operational optimization, portfolio management, and designing bespoke credit risk models tailored for the media industry.\n\nLuigi brings a unique, practical perspective on organizational restructuring, having streamlined processes for deal origination, financial reporting, and portfolio analytics, significantly impro"])</script><script>self.__next_f.push([1,"ving operational efficiency and portfolio returns. A graduate of Hult International Business School with honors in Business Administration, Luigi blends his financial expertise and management acumen to drive sustainable growth strategies and high-performing teams within creative and capital-intensive environments.\n\n"])</script><script>self.__next_f.push([1,"b:[\"$\",\"$L19\",null,{\"project\":{\"id\":\"015d0902-2b1a-4b3b-96f8-81a0a11c1994\",\"title\":\"Behind the Scenes of Efficiency \u0026 Profitability: (Re)Structuring a Film Industry Powerhouse\",\"slug\":\"behind-the-scenes-of-efficiency-profitability-re-structuring-a-film-industry-powerhouse-1-1-1\",\"summary\":{\"type\":\"doc\",\"content\":[{\"type\":\"paragraph\",\"content\":[{\"text\":\"Develop a data-driven organizational restructuring plan that enhances efficiency, boosts profitability, and establishes a scalable foundation for rapid growth, maximizing the value of limited resources.  \\n\",\"type\":\"text\"}]}]},\"description\":{\"type\":\"doc\",\"content\":[{\"type\":\"paragraph\",\"content\":[{\"text\":\"Films are a high-risk, high-reward asset class—and while investing is easy, getting repaid isn’t. To succeed, institutional investors must build private credit funds with world-class operations that maximize efficiency, productivity, and profitability in a fast-paced, resource-constrained industry.      \",\"type\":\"text\"}]},{\"type\":\"paragraph\",\"content\":[{\"text\":\"In this Build Project, you’ll take on the role of a senior operations manager at a private credit fund focused on film finance. You’ll assess the organization’s internal workflows, identify inefficiencies, and design a data-driven restructuring plan to improve efficiency, productivity, and scalability. Guided by an industry expert, you’ll use KPIs to evaluate operations and propose practical solutions in a fast-paced, resource-constrained environment. Along the way, you’ll explore how film deals are structured and how institutional funds operate in the entertainment space. You’ll apply change management frameworks—like Kotter’s and Lewin’s change models—to a real-world business case study to build the implementation plan for your restructuring strategy. \",\"type\":\"text\"}]},{\"type\":\"paragraph\",\"content\":[{\"text\":\"Working collaboratively as a single team, you and your peers will assign roles, define responsibilities, and build internal systems and workflows. All deliverables will be produced collectively, and your performance will be evaluated as a group.  By the end, you will build and pitch your C-suite-ready pitch deck to present your re-organizational plan.     \",\"type\":\"text\"}]}]},\"project_area\":[\"Business\",\"Finance\"],\"level\":\"Intermediate\",\"levelDescription\":\"Some experience recommended\",\"prerequisites\":{\"type\":\"doc\",\"content\":[{\"type\":\"paragraph\",\"content\":[{\"text\":\"Fundamentals of Debt Financing: A basic understanding of debt financing principles, including key financial concepts such as collateral, loan-to-value ratios, principal, and interest. You should be comfortable discussing financial structures and evaluating lending risks. \",\"type\":\"text\"}]},{\"type\":\"paragraph\",\"content\":[{\"text\":\"Business and Operations Management: Beginner/Intermediate knowledge of business management, including principles of operations, resource allocation, organizational psychology, and change management. You should understand how to assess and optimize business workflows for efficiency and scalability. \",\"type\":\"text\"}]},{\"type\":\"paragraph\",\"content\":[{\"text\":\"Film Industry Fundamentals: A basic, general foundational understanding of the macroeconomics and mechanics of the film industry, along with a willingness to develop deeper insights into the broader Media \u0026 Entertainment sector. This includes familiarity with financing models, market dynamics, and industry hierarchy/politics. \",\"type\":\"text\"}]},{\"type\":\"paragraph\",\"content\":[{\"text\":\"Presentation and Visual Communication: Proficiency in presentation tools such as PowerPoint, Keynote, or Canva to create compelling and visually effective slide decks. Students should be able to structure information clearly and design engaging presentations that effectively convey key insights. \",\"type\":\"text\"}]},{\"type\":\"paragraph\",\"content\":[{\"text\":\"Effective Communication and Persuasion: Strong verbal and written communication skills to articulate ideas clearly and persuasively. This includes the ability to pitch concepts, present findings confidently, and secure stakeholder buy-in through compelling storytelling and structured argumentation. \",\"type\":\"text\"}]},{\"type\":\"paragraph\",\"content\":[{\"text\":\"Beginner knowledge of data analytics with practical experience applying KPIs in business environments to back proposed management solutions.\",\"type\":\"text\"}]}]},\"goals\":{\"type\":\"doc\",\"content\":[{\"type\":\"paragraph\",\"content\":[{\"text\":\"Develop in-depth knowledge of the core operations and processes commonly found in finance-based, fund-like organizations, including Private Credit, Venture Capital, and Private Equity firms.   \",\"type\":\"text\"}]},{\"type\":\"paragraph\",\"content\":[{\"text\":\"Build a film finance model by structuring its collateral pool to enable access to private credit-type funds demonstrating practical application of financial structuring in the entertainment industry.\",\"type\":\"text\"}]},{\"type\":\"paragraph\",\"content\":[{\"text\":\"Identify and break down a business’s core operations and processes across all departments and functions, establishing a clear understanding of its workflow and interdependencies.\",\"type\":\"text\"}]},{\"type\":\"paragraph\",\"content\":[{\"text\":\"Conduct data-driven analysis using department- and function-specific KPIs to assess, evaluate, and rank operational efficiency, productivity, and profitability.\",\"type\":\"text\"}]},{\"type\":\"paragraph\",\"content\":[{\"text\":\"Design 360-degree, actionable solutions to address inefficiencies through process automation, team restructuring, resource management, and cost-cutting strategies.\",\"type\":\"text\"}]},{\"type\":\"paragraph\",\"content\":[{\"text\":\"Package, present, and deliver comprehensive company-wide restructuring plans, ensuring stakeholder buy-in and effective implementation through structured change management processes.   \",\"type\":\"text\"}]}]},\"schedule\":\"Fridays, 1:00 P.M. ET / 10:00 A.M. PT\",\"status\":\"applications_open\",\"duration\":\"8 weeks, 2-3 hours per week\",\"workshops\":{\"sessions\":[{\"name\":\"Operations Management \u0026 the Film Industry\",\"order\":1,\"description\":{\"type\":\"doc\",\"content\":[{\"type\":\"paragraph\",\"content\":[{\"text\":\"An introduction to the core principles of Operations Management and the macroeconomic mechanics of the film industry. Students develop a foundational understanding of how film functions as a specialised asset class, covering key players, financial structures, and the operational challenges unique to this sector.\",\"type\":\"text\"}]}]}},{\"name\":\"Film Finance \u0026 Private Credit Fundamentals\",\"order\":2,\"description\":{\"type\":\"doc\",\"content\":[{\"type\":\"paragraph\",\"content\":[{\"text\":\"A deep dive into debt-based film financing and the operational structure of private credit funds — from deal sourcing and underwriting to risk assessment. \",\"type\":\"text\"}]}]}},{\"name\":\"Case Study Kick-Off: Mapping Departments, Functions \u0026 Processes\",\"order\":3,\"description\":{\"type\":\"doc\",\"content\":[{\"type\":\"paragraph\",\"content\":[{\"text\":\"Introduction to the Alpha Film Credit Partners case study. Students map all existing processes, systems, and workflows across Alpha's operations, identify interdependencies, and establish the restructuring objectives that will guide the remainder of the programme.\",\"type\":\"text\"}]}]}},{\"name\":\"Operations Assessment: Data-Driven Scoring \u0026 Ranking\",\"order\":4,\"description\":{\"type\":\"doc\",\"content\":[{\"type\":\"paragraph\",\"content\":[{\"text\":\"Students design a custom evaluation framework to assess and rank Alpha's operational processes using a combination of quantitative KPIs and qualitative intelligence, including real C-suite interview extracts.\",\"type\":\"text\"}]}]}},{\"name\":\"Operations Review: Inefficiencies, Automation \u0026 Cost Centres\",\"order\":5,\"description\":{\"type\":\"doc\",\"content\":[{\"type\":\"paragraph\",\"content\":[{\"text\":\"Students conduct a detailed operational review to pinpoint inefficiencies, redundancies, and cost-heavy centres across Alpha's business.\",\"type\":\"text\"}]}]}},{\"name\":\"Change Management: Frameworks \u0026 Underlying\",\"order\":6,\"description\":{\"type\":\"doc\",\"content\":[{\"type\":\"paragraph\",\"content\":[{\"text\":\"An examination of the leading Change Management models — including Kotter's 8-Step Process and Lewin's Change Management Model — and how they apply to real organisational transformation. Students analyse case studies and develop a working understanding of the structural and human dynamics that determine whether change initiatives succeed or fail.\",\"type\":\"text\"}]}]}},{\"name\":\"Integrating Operations \u0026 Change Management: Building the Restructuring Plan\",\"order\":7,\"description\":{\"type\":\"doc\",\"content\":[{\"type\":\"paragraph\",\"content\":[{\"text\":\"Students synthesise their operational findings and change management knowledge into a sequenced, actionable restructuring plan for Alpha. The plan is packaged into a C-suite-level presentation designed to secure executive buy-in, with coaching on senior business communication, persuasion, and structured argumentation.\",\"type\":\"text\"}]}]}},{\"name\":\"Final Presentation: A Film Private Credit Fund Re-Imagined\",\"order\":8,\"description\":{\"type\":\"doc\",\"content\":[{\"type\":\"paragraph\",\"content\":[{\"text\":\"The team deliver their full organisational restructuring plans in a formal presentation followed by a live Q\u0026A. Students are assessed on the quality of their analysis, the rigour of their recommendations, and their ability to defend strategic decisions under questioning. The session concludes with structured self and peer assessment.\",\"type\":\"text\"}]}]}}]},\"fellows\":[{\"id\":\"2880be00-7bf0-4604-a3a1-7ea1581f947f\",\"name\":\"Luigi Spitaleri\",\"role\":\"Business Management Fellow\",\"organization\":\"Open Avenues Foundation\",\"organizationLogoUrl\":\"/images/organizations/oaf-logo.png\",\"photoUrl\":\"https://avgkrhojcamcagufngrr.supabase.co/storage/v1/object/public/fellow-headshots/2880be00-7bf0-4604-a3a1-7ea1581f947f.webp\",\"bio\":\"$1a\",\"linkedinUrl\":\"https://www.linkedin.com/in/luigispitaleri/\"}],\"categories\":[\"Operations Management\",\"Change Management\",\"Business Strategy\",\"Film Finance (Private Credit)\"],\"applicationTimeline\":[{\"label\":\"Applications open\",\"value\":\"August 3, 2026\"},{\"label\":\"Applications deadline\",\"value\":\"September 3, 2026\"},{\"label\":\"Application results released\",\"value\":\"Week of September 14, 2026\"},{\"label\":\"Project start date\",\"value\":\"Week of September 28, 2026\"},{\"label\":\"Project end date\",\"value\":\"Week of November 16, 2026\"}],\"cycle_id\":\"6e8885e5-3870-4327-a19c-d88c867fa48f\"},\"error\":\"$undefined\"}]\n"])</script></body></html>
