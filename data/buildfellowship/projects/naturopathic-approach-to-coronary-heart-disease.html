eventive of coronary heart disease in the context of this widespread epidemic.\",\"type\":\"text\"}]},{\"type\":\"paragraph\",\"content\":[{\"text\":\"Through this 8-weeks project you will gain a foundational understanding of medicine and will work on a case study and propose an assessment, intervention, or prevention recommendation.\",\"type\":\"text\"}]}]},\"project_area\":[\"Biology \u0026 Healthcare\"],\"level\":\"Intermediate\",\"levelDescription\":\"Some experience recommended\",\"prerequisites\":{\"type\":\"doc\",\"content\":[{\"type\":\"paragraph\",\"content\":[{\"text\":\"A fundamental grasp of naturopathic medicine's core principles and treatment methods.\",\"type\":\"text\"}]},{\"type\":\"paragraph\",\"content\":[{\"text\":\"A foundational understanding of human anatomy and physiology, with a particular emphasis on the cardiovascular and circulatory systems.\",\"type\":\"text\"}]},{\"type\":\"paragraph\",\"content\":[{\"text\":\"The capacity to learn novel information and relate treatment strategies to the underlying causes of disease.\",\"type\":\"text\"}]}]},\"goals\":{\"type\":\"doc\",\"content\":[{\"type\":\"paragraph\",\"content\":[{\"text\":\"Develop a deeper understanding of the cardiovascular system and risk factors associated with coronary heart disease.\",\"type\":\"text\"}]},{\"type\":\"paragraph\",\"content\":[{\"text\":\"Develop a holistic understanding of comprehensive heart health screening and monitoring.\",\"type\":\"text\"}]},{\"type\":\"paragraph\",\"content\":[{\"text\":\"Understand naturopathic medicine principles and therapeutic approaches for the diagnosis, treatment, and prevention of coronary heart disease.\",\"type\":\"text\"}]}]},\"schedule\":\"Thursdays, 4:00 P.M. ET / 1:00 P.M. PT\",\"status\":\"archived\",\"duration\":\"8 weeks, 2-3 hours per week\",\"workshops\":{\"sessions\":[{\"name\":\"Introduction to the Project\",\"order\":1,\"description\":{\"type\":\"doc\",\"content\":[{\"type\":\"paragraph\",\"content\":[{\"text\":\"The first workshop introduces the project's content and expectations. You will learn about the coronary heart disease epidemic and the basic principles of naturopathic medicine.\",\"type\":\"text\"}]}]}},{\"name\":\"The Anatomy, Physiology, and Pathology of Coronary Heart Disease\",\"order\":2,\"description\":{\"type\":\"doc\",\"content\":[{\"type\":\"paragraph\",\"content\":[{\"text\":\"This workshop will introduce you to the fundamental aspects of coronary anatomy and physiology, as well as the pathology of coronary artery disease.\",\"type\":\"text\"}]}]}},{\"name\":\"Heart Health Screening and Monitoring\",\"order\":3,\"description\":{\"type\":\"doc\",\"content\":[{\"type\":\"paragraph\",\"content\":[{\"text\":\"This workshop will cover cardiac biomarkers, including fundamental and advanced screening methods, as well as specialized diagnostic tests for coronary artery disease.\",\"type\":\"text\"}]}]}},{\"name\":\"Identify and Treat The Cause\",\"order\":4,\"description\":{\"type\":\"doc\",\"content\":[{\"type\":\"paragraph\",\"content\":[{\"text\":\"This week's workshop focuses on naturopathic medicine's approach in treating and managing coronary heart disease.\",\"type\":\"text\"}]}]}},{\"name\":\"Treat the Whole Person\",\"order\":5,\"description\":{\"type\":\"doc\",\"content\":[{\"type\":\"paragraph\",\"content\":[{\"text\":\"This workshop emphasizes the significance of treating the whole person and its connection to improved coronary health outcomes.\",\"type\":\"text\"}]}]}},{\"name\":\"Preventive Measures\",\"order\":6,\"description\":{\"type\":\"doc\",\"content\":[{\"type\":\"paragraph\",\"content\":[{\"text\":\"This week's workshop is dedicated to providing comprehensive information and practical strategies focused on the crucial topic of preventing and mitigating the risks associated with coronary heart disease.\",\"type\":\"text\"}]}]}},{\"name\":\"COVID 19’s Impact on Heart Health\",\"order\":7,\"description\":{\"type\":\"doc\",\"content\":[{\"type\":\"paragraph\",\"content\":[{\"text\":\"This week's workshop will examine the increased risk factors for coronary heart disease resulting from the COVID-19 pandemic. The body's inflammatory reaction to the virus has direct effects on the cardiac system. Additionally, psychological stress associated with the pandemic significantly contributes to this medical condition.\",\"type\":\"text\"}]}]}},{\"name\":\"Project deliverables, reflection, and Q\u0026A\",\"order\":8,\"description\":{\"type\":\"doc\",\"content\":[{\"type\":\"paragraph\",\"content\":[{\"text\":\"This concluding workshop serves to summarize the project. Students will present their learnings and reflect on the experience throughout the project.\",\"type\":\"text\"}]}]}}]},\"fellows\":[{\"id\":\"9aa32d26-8336-4f8b-8969-832da8076753\",\"name\":\"Vy Huynh\",\"role\":\"Medical Sciences Fellow\",\"organization\":\"DREAM Venture Labs\",\"organizationLogoUrl\":\"/images/organizations/dv-logo.png\",\"photoUrl\":\"https://avgkrhojcamcagufngrr.supabase.co/storage/v1/object/public/fellow-headshots/9aa32d26-8336-4f8b-8969-832da8076753.webp\",\"bio\":\"Dr. Vy Huynh is a Medical Science Fellow at DREAM Venture Labs where she works with students leading projects in Medical Science.\\n\\nDr. Vy Huynh is a Naturopathic Physician at West Valley Naturopathic Center where she brings a wealth of knowledge and a compassionate approach to patient care. Dr. Huynh has over three years of experience in the naturopathic medicine field. She employs a patient-centered approach based on the six core principles of naturopathic medicine. These principles include The Healing Power of Nature, Identify and Treat the Causes, First Do No Harm, Doctor As Teacher, Treat the Whole Person, and Prevention. Her focus is on addressing the whole person, preventing illness, and fostering a collaborative relationship with patients to achieve optimal health outcomes.\\n\\nShe holds a Doctorate’s degree in Naturopathic Medicine and a Bachelor’s degree in Biology.\",\"linkedinUrl\":\"www.linkedin.com/in/vy-huynh-26775b336\"}],\"categories\":[\"Naturopathic medicine\",\"Identity and treat the cause\",\"Clinical nutrition\",\"Coronary heart disease\"],\"applicationTimeline\":[{\"label\":\"Applications open\",\"value\":\"July 15, 2025\"},{\"label\":\"Applications deadline\",\"value\":\"August 10, 2025\"},{\"label\":\"Application results released\",\"value\":\"Week of August 25, 2025\"},{\"label\":\"Project start date\",\"value\":\"Week of September 8, 2025\"},{\"label\":\"Project end date\",\"value\":\"Week of October 27, 2025\"}],\"cycle_id\":\"edaee5d1-0a25-4398-8a57-8b642ce5330b\"},\"error\":\"$undefined\"}]\n"])</script></body></html>
