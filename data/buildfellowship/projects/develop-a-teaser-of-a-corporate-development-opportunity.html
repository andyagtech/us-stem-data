7e111b509a4.js?dpl=dpl_A9QRwtuL4hrMD2RZGqb9eW7AtxES\",\"4420\",\"static/chunks/4420-baa8329e5076733c.js?dpl=dpl_A9QRwtuL4hrMD2RZGqb9eW7AtxES\",\"2169\",\"static/chunks/2169-1d13735e35f16c75.js?dpl=dpl_A9QRwtuL4hrMD2RZGqb9eW7AtxES\",\"419\",\"static/chunks/419-9f9e6d455ee0ae85.js?dpl=dpl_A9QRwtuL4hrMD2RZGqb9eW7AtxES\",\"5288\",\"static/chunks/5288-5d7819e0848b1b1a.js?dpl=dpl_A9QRwtuL4hrMD2RZGqb9eW7AtxES\",\"6874\",\"static/chunks/6874-67c719d6db2b17af.js?dpl=dpl_A9QRwtuL4hrMD2RZGqb9eW7AtxES\",\"6766\",\"static/chunks/6766-7fcc7eadc8fee52b.js?dpl=dpl_A9QRwtuL4hrMD2RZGqb9eW7AtxES\",\"9435\",\"static/chunks/9435-28f947009b0f7d38.js?dpl=dpl_A9QRwtuL4hrMD2RZGqb9eW7AtxES\",\"2206\",\"static/chunks/2206-42291f248e6bf19d.js?dpl=dpl_A9QRwtuL4hrMD2RZGqb9eW7AtxES\",\"5782\",\"static/chunks/5782-04eaa6c475f5c3f2.js?dpl=dpl_A9QRwtuL4hrMD2RZGqb9eW7AtxES\",\"8419\",\"static/chunks/app/projects/%5Bslug%5D/page-7f8129194c3557a1.js?dpl=dpl_A9QRwtuL4hrMD2RZGqb9eW7AtxES\"],\"default\"]\n"])</script><script>self.__next_f.push([1,"b:[\"$\",\"$L19\",null,{\"project\":{\"id\":\"d3bb0333-376c-417e-9edb-b0793d0a4fd5\",\"title\":\"Develop a Teaser of a Corporate Development Opportunity\",\"slug\":\"develop-a-teaser-of-a-corporate-development-opportunity\",\"summary\":{\"type\":\"doc\",\"content\":[{\"type\":\"paragraph\",\"content\":[{\"text\":\"Research the market, analyze financial reports, perform an indicative valuation and prepare a slide deck to present a target company for a potential investment/divestment.\",\"type\":\"text\"}]}]},\"description\":{\"type\":\"doc\",\"content\":[{\"type\":\"paragraph\",\"content\":[{\"text\":\"To stay relevant and profitable, companies need to constantly review their growth strategy and identify new market opportunities. Specialists who can do this work effectively are always in demand, so it's a valuable skillset to acquire. In this Build Project, you'll wear the hat of a Corporate Development Analyst and come up with a potential acquisition target (company) to analyze and present. Under the supervision of an experienced Build Fellow, you'll perform market research, financial analysis and build a dynamic valuation model in Excel. You'll become familiar with valuation methodologies like DCF, NPV and WACC. All this will happen in an environment that simulates the operations of a real Corporate Development team.\",\"type\":\"text\"}]}]},\"project_area\":[\"Business\"],\"level\":\"Beginner\",\"levelDescription\":\"No prior experience required\",\"prerequisites\":{\"type\":\"doc\",\"content\":[{\"type\":\"paragraph\",\"content\":[{\"text\":\"Commitment to start and finish the project, actively participate in all meetings, and work independently for 2 hours/week.\",\"type\":\"text\"}]},{\"type\":\"paragraph\",\"content\":[{\"text\":\"Basic knowledge of business operations: you should understand concepts of one-time/recurring revenue, gross/net income, profit margins, market share \u0026 market positioning.\",\"type\":\"text\"}]},{\"type\":\"paragraph\",\"content\":[{\"text\":\"Basic knowledge of financial reports: you should be able to read a company’s financial report, including Balance Sheet, Income Statement and Statement of Cash Flow.\",\"type\":\"text\"}]},{\"type\":\"paragraph\",\"content\":[{\"text\":\"Basic knowledge of Microsoft Excel: you should be able to use formulas and create simple visualizations.\",\"type\":\"text\"}]}]},\"goals\":{\"type\":\"doc\",\"content\":[{\"type\":\"paragraph\",\"content\":[{\"text\":\"What to look for in a company’s financial reports\",\"type\":\"text\"}]},{\"type\":\"paragraph\",\"content\":[{\"text\":\"How to calculate a WACC\",\"type\":\"text\"}]},{\"type\":\"paragraph\",\"content\":[{\"text\":\"How to perform an indicative valuation\",\"type\":\"text\"}]},{\"type\":\"paragraph\",\"content\":[{\"text\":\"What is important for a potential investor\",\"type\":\"text\"}]},{\"type\":\"paragraph\",\"content\":[{\"text\":\"How to present an investment opportunity\",\"type\":\"text\"}]}]},\"schedule\":\"Thursdays, 5:00 P.M. ET / 2:00 P.M. PT\",\"status\":\"archived\",\"duration\":\"8 weeks, 2-3 hours per week\",\"workshops\":{\"sessions\":[{\"name\":\"Introductions\",\"order\":1,\"description\":{\"type\":\"doc\",\"content\":[{\"type\":\"paragraph\",\"content\":[{\"text\":\"Get to know the Build Fellow and other students, ask questions about the project requirements, prepare your workspace.\",\"type\":\"text\"}]}]}},{\"name\":\"Company Overview\",\"order\":2,\"description\":{\"type\":\"doc\",\"content\":[{\"type\":\"paragraph\",\"content\":[{\"text\":\"Attend a session where the Build Fellow presents a Company overview; including market/industry presentation, review of financial report and annual results, as well as a brief review of the market/industry it operates in. Assignment: Select a publicly traded company as the Project’s Target and prepare a basic highlights-based overview of the Target.\",\"type\":\"text\"}]}]}},{\"name\":\"Market Research\",\"order\":3,\"description\":{\"type\":\"doc\",\"content\":[{\"type\":\"paragraph\",\"content\":[{\"text\":\"Work with the Build Fellow to breakdown the presentation from the previous workshop, understand which market/industry insights are most likely to catch an investor’s attention. Assignment: perform market research for your Target.\",\"type\":\"text\"}]}]}},{\"name\":\"Financial Reports\",\"order\":4,\"description\":{\"type\":\"doc\",\"content\":[{\"type\":\"paragraph\",\"content\":[{\"text\":\"Work with the Build Fellow to review and breakdown the key highlights in a company’s financial reports. What would a potential investor look for? Session to start with a presentation of last session’s assignment +feedback. Assignment: review and summarize your Target’s financial reports; list main highlights and insights you found.\",\"type\":\"text\"}]}]}},{\"name\":\"Evaluation \u0026 Modeling\",\"order\":5,\"description\":{\"type\":\"doc\",\"content\":[{\"type\":\"paragraph\",\"content\":[{\"text\":\"Discuss with the Build Fellow the concepts of Enterprise Value Analysis, including a detailed DCF model. Session to start with a presentation of last session’s assignment + feedback.\",\"type\":\"text\"}]}]}},{\"name\":\"DCF Model\",\"order\":6,\"description\":{\"type\":\"doc\",\"content\":[{\"type\":\"paragraph\",\"content\":[{\"text\":\"Present a DCF model + comparables for your Target, receive feedback.\",\"type\":\"text\"}]}]}},{\"name\":\"Creation of a Teaser\",\"order\":7,\"description\":{\"type\":\"doc\",\"content\":[{\"type\":\"paragraph\",\"content\":[{\"text\":\"Discuss with the Build Fellow concepts of market research, deriving insights and key points for a Corporate Development Teaser.\",\"type\":\"text\"}]}]}},{\"name\":\"Presentations\",\"order\":8,\"description\":{\"type\":\"doc\",\"content\":[{\"type\":\"paragraph\",\"content\":[{\"text\":\"Polish your project deliverables and present them to the Build Fellow and other students in the final group session.\",\"type\":\"text\"}]}]}}]},\"fellows\":[{\"id\":\"0f8540c8-d7cc-4d37-bfd0-0ce3119cca06\",\"name\":\"Roi Bejerano\",\"role\":\"Finance Fellow\",\"organization\":\"Open Avenues Foundation\",\"organizationLogoUrl\":\"/images/organizations/oaf-logo.png\",\"photoUrl\":\"https://avgkrhojcamcagufngrr.supabase.co/storage/v1/object/public/fellow-headshots/0f8540c8-d7cc-4d37-bfd0-0ce3119cca06.webp\",\"bio\":\"Roi Bejerano is a Business \u0026 Finance Global Talent Fellow at Open Avenues, where he works with students leading projects in Corporate Finance. \\nRoi is a Sr. Contract Specialist at Orca Security where he leads the company's legal and business efforts in its US expansion.\\nRoi has more than a decade of experience in business, finance and legal work, supporting different organizations' growth efforts.\\nDuring his career, Roi worked for KPMG Advisory division as a Sr. Associated, where we advised multinational companies in various industries on their corporate development and expansion efforts in Europe \u0026 the Middle East.\\nHe holds an MBA in Business Administration, as well as an LL.B. in Law and BA in Business Administration. Roi is also a licensed attorney in Israel, where he worked on M\u0026A transactions for some of the largest law firms.\",\"linkedinUrl\":\"https://www.linkedin.com/in/rbejerano/\"}],\"categories\":[\"Corporate Finance\",\"Investment Banking\",\"Corporate Development\"],\"applicationTimeline\":[{\"label\":\"Applications open\",\"value\":\"August 22, 2025\"},{\"label\":\"Applications deadline\",\"value\":\"September 14, 2025\"},{\"label\":\"Application results released\",\"value\":\"Week of September 22, 2025\"},{\"label\":\"Project start date\",\"value\":\"Week of October 6, 2025\"},{\"label\":\"Project end date\",\"value\":\"Week of November 24, 2025\"}],\"cycle_id\":\"d946e325-002e-4658-8923-05bdc47dc4a6\"},\"error\":\"$undefined\"}]\n"])</script></body></html>
