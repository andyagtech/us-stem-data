a60aa6-294bb7e111b509a4.js?dpl=dpl_A9QRwtuL4hrMD2RZGqb9eW7AtxES\",\"4420\",\"static/chunks/4420-baa8329e5076733c.js?dpl=dpl_A9QRwtuL4hrMD2RZGqb9eW7AtxES\",\"2169\",\"static/chunks/2169-1d13735e35f16c75.js?dpl=dpl_A9QRwtuL4hrMD2RZGqb9eW7AtxES\",\"419\",\"static/chunks/419-9f9e6d455ee0ae85.js?dpl=dpl_A9QRwtuL4hrMD2RZGqb9eW7AtxES\",\"5288\",\"static/chunks/5288-5d7819e0848b1b1a.js?dpl=dpl_A9QRwtuL4hrMD2RZGqb9eW7AtxES\",\"6874\",\"static/chunks/6874-67c719d6db2b17af.js?dpl=dpl_A9QRwtuL4hrMD2RZGqb9eW7AtxES\",\"6766\",\"static/chunks/6766-7fcc7eadc8fee52b.js?dpl=dpl_A9QRwtuL4hrMD2RZGqb9eW7AtxES\",\"9435\",\"static/chunks/9435-28f947009b0f7d38.js?dpl=dpl_A9QRwtuL4hrMD2RZGqb9eW7AtxES\",\"2206\",\"static/chunks/2206-42291f248e6bf19d.js?dpl=dpl_A9QRwtuL4hrMD2RZGqb9eW7AtxES\",\"5782\",\"static/chunks/5782-04eaa6c475f5c3f2.js?dpl=dpl_A9QRwtuL4hrMD2RZGqb9eW7AtxES\",\"8419\",\"static/chunks/app/projects/%5Bslug%5D/page-7f8129194c3557a1.js?dpl=dpl_A9QRwtuL4hrMD2RZGqb9eW7AtxES\"],\"default\"]\n"])</script><script>self.__next_f.push([1,"b:[\"$\",\"$L19\",null,{\"project\":{\"id\":\"954503ae-2a5d-44ac-a721-f737b89ac39d\",\"title\":\"Risk \u0026 Return: Making Investments in Equity Securities\",\"slug\":\"risk-and-return-making-investments-in-equity-securities-1-1\",\"summary\":{\"type\":\"doc\",\"content\":[{\"type\":\"paragraph\",\"content\":[{\"text\":\"Learn how professional investors evaluate, model, and discuss investment opportunities.\",\"type\":\"text\"}]}]},\"description\":{\"type\":\"doc\",\"content\":[{\"type\":\"paragraph\",\"content\":[{\"text\":\"Pensions, colleges, and nations across the world rely on investment firms to generate financial returns to support the long-term needs of their retirees, students, and citizens. In this Build Project, you'll learn how investors decide to invest in businesses by donning the hat of an analyst entering an investment firm that is in the process of acquiring a public company. Under the guidance of an experienced industry expert, you will identify a potential investment opportunity, analyze the company's performance, and build an Excel financial model to value it. You'll synthesize your findings to create your own investment memo in PowerPoint—skills critical to succeeding in entry-level roles across financial planning, accounting, banking, investment management and consulting. Entry-level roles in such fields typically pay upwards of $60-80K per year.\",\"type\":\"text\"}]}]},\"project_area\":[\"Business\",\"Finance\"],\"level\":\"Intermediate\",\"levelDescription\":\"Some experience recommended\",\"prerequisites\":{\"type\":\"doc\",\"content\":[{\"type\":\"paragraph\",\"content\":[{\"text\":\"A basic understanding of accounting principles (e.g., revenue, cost of goods sold, EBITDA) and finance concepts (e.g., equity, debt).\",\"type\":\"text\"}]},{\"type\":\"paragraph\",\"content\":[{\"text\":\"Some existing exposure to basic statistical concepts (mean, median, mode, quartiles, etc.) and data visualization techniques (bar graphs, bubble plots, etc.).\",\"type\":\"text\"}]},{\"type\":\"paragraph\",\"content\":[{\"text\":\"Past experience using Microsoft Excel or Google Sheets (experience performing basic sums, products, etc.).\",\"type\":\"text\"}]},{\"type\":\"paragraph\",\"content\":[{\"text\":\"An interest in financial markets, and a desire to develop the “investor toolkit” and learn how professional investors evaluate investment opportunities.\",\"type\":\"text\"}]},{\"type\":\"paragraph\",\"content\":[{\"text\":\"Strong oral and written communication skills, with a desire to discuss, debate, and share your thoughts with others.\",\"type\":\"text\"}]}]},\"goals\":{\"type\":\"doc\",\"content\":[{\"type\":\"paragraph\",\"content\":[{\"text\":\"Understand and calculate the key financial metrics investors use to evaluate businesses, using a variety of data sources.\",\"type\":\"text\"}]},{\"type\":\"paragraph\",\"content\":[{\"text\":\"Build forecasts and financial models in Microsoft Excel to help value businesses and investments.\",\"type\":\"text\"}]},{\"type\":\"paragraph\",\"content\":[{\"text\":\"Prepare and present investment memorandums to describe and support potential investment opportunities.\",\"type\":\"text\"}]}]},\"schedule\":\"Fridays, 12:00 P.M. ET / 9:00 A.M. PT\",\"status\":\"active\",\"duration\":\"8 weeks, 2-3 hours per week\",\"workshops\":{\"sessions\":[{\"name\":\"Introductions and Prepping for Success\",\"order\":1,\"description\":{\"type\":\"doc\",\"content\":[{\"type\":\"paragraph\",\"content\":[{\"text\":\"Get to know the Build Fellow and other students, learn about rewarding careers in finance, ask questions about the project requirements, and get ready to \\\"buy a company\\\"!\",\"type\":\"text\"}]}]}},{\"name\":\"Company Capitalization and Investment\",\"order\":2,\"description\":{\"type\":\"doc\",\"content\":[{\"type\":\"paragraph\",\"content\":[{\"text\":\"Understand how companies acquire funding to support their growth by raising debt and equity. Calculate the valuation of the company we will be bidding to acquire.\",\"type\":\"text\"}]}]}},{\"name\":\"Valuation Techniques\",\"order\":3,\"description\":{\"type\":\"doc\",\"content\":[{\"type\":\"paragraph\",\"content\":[{\"text\":\"We know how much the \\\"market\\\" thinks our company is worth. Is that a fair price? Learn to calculate valuation metrics for our target company in Microsoft Excel.\",\"type\":\"text\"}]}]}},{\"name\":\"Investment Thesis Development\",\"order\":4,\"description\":{\"type\":\"doc\",\"content\":[{\"type\":\"paragraph\",\"content\":[{\"text\":\"Why is the market wrong? Why should our target company be worth something else? Build a hypothesis that will form the basis for our future research by consulting public data (e.g., FRED).\",\"type\":\"text\"}]}]}},{\"name\":\"Comparable Public Company Analysis\",\"order\":5,\"description\":{\"type\":\"doc\",\"content\":[{\"type\":\"paragraph\",\"content\":[{\"text\":\"Who are the company's competitors? How are they different? Use public data to compare metrics and contrast them with our target's.\",\"type\":\"text\"}]}]}},{\"name\":\"Introductory Financial Modeling\",\"order\":6,\"description\":{\"type\":\"doc\",\"content\":[{\"type\":\"paragraph\",\"content\":[{\"text\":\"All models are wrong, some are useful. Learn how to project our target company's financial performance in Microsoft Excel.\",\"type\":\"text\"}]}]}},{\"name\":\"Intermediate Financial Modeling\",\"order\":7,\"description\":{\"type\":\"doc\",\"content\":[{\"type\":\"paragraph\",\"content\":[{\"text\":\"Now that we have a view on the outlook for the company, let's decide what we would pay for it. Develop a discounted cash flow analysis in Microsoft Excel.\",\"type\":\"text\"}]}]}},{\"name\":\"Investment Committee Presentations\",\"order\":8,\"description\":{\"type\":\"doc\",\"content\":[{\"type\":\"paragraph\",\"content\":[{\"text\":\"Integrate your findings into an investment presentation and present them to the Build Fellow and other students in the final group session.\",\"type\":\"text\"}]}]}}]},\"fellows\":[{\"id\":\"ac942cb7-52ba-4791-b8a3-2000b00b1cd3\",\"name\":\"Chirag Tarun Malkani Malkani\",\"role\":\"Finance Fellow\",\"organization\":\"Open Avenues Foundation\",\"organizationLogoUrl\":\"/images/organizations/oaf-logo.png\",\"photoUrl\":\"https://avgkrhojcamcagufngrr.supabase.co/storage/v1/object/public/fellow-headshots/ac942cb7-52ba-4791-b8a3-2000b00b1cd3.webp\",\"bio\":\"Chirag is a Vice President at AVALT, a private equity investment firm, where he works on the sourcing, due diligence, and execution of transactions across services businesses. Prior to joining AVALT, Chirag was an Associate Consultant at Bain \u0026 Company, where he supported clients across private equity, retail, and software on key strategic issues. Chirag graduated Phi Beta Kappa, from Amherst College with a BA in Mathematics and Tau Beta Pi from Dartmouth College, with a BE in Electrical Engineering.\",\"linkedinUrl\":\"https://www.linkedin.com/in/cmalkani/\"}],\"categories\":[\"Finance\",\"Accounting\",\"Due Diligence\",\"Private Equity\",\"Equity Research\",\"Investment Banking\"],\"applicationTimeline\":[{\"label\":\"Applications open\",\"value\":\"May 11, 2026\"},{\"label\":\"Applications deadline\",\"value\":\"June 11, 2026\"},{\"label\":\"Application results released\",\"value\":\"Week of June 22, 2026\"},{\"label\":\"Project start date\",\"value\":\"Week of July 6, 2026\"},{\"label\":\"Project end date\",\"value\":\"Week of August 24, 2026\"}],\"cycle_id\":\"04780f7f-10bb-4b43-8480-8ef15da1b3cc\"},\"error\":\"$undefined\"}]\n"])</script></body></html>
