txES\",\"277\",\"static/chunks/54a60aa6-294bb7e111b509a4.js?dpl=dpl_A9QRwtuL4hrMD2RZGqb9eW7AtxES\",\"4420\",\"static/chunks/4420-baa8329e5076733c.js?dpl=dpl_A9QRwtuL4hrMD2RZGqb9eW7AtxES\",\"2169\",\"static/chunks/2169-1d13735e35f16c75.js?dpl=dpl_A9QRwtuL4hrMD2RZGqb9eW7AtxES\",\"419\",\"static/chunks/419-9f9e6d455ee0ae85.js?dpl=dpl_A9QRwtuL4hrMD2RZGqb9eW7AtxES\",\"5288\",\"static/chunks/5288-5d7819e0848b1b1a.js?dpl=dpl_A9QRwtuL4hrMD2RZGqb9eW7AtxES\",\"6874\",\"static/chunks/6874-67c719d6db2b17af.js?dpl=dpl_A9QRwtuL4hrMD2RZGqb9eW7AtxES\",\"6766\",\"static/chunks/6766-7fcc7eadc8fee52b.js?dpl=dpl_A9QRwtuL4hrMD2RZGqb9eW7AtxES\",\"9435\",\"static/chunks/9435-28f947009b0f7d38.js?dpl=dpl_A9QRwtuL4hrMD2RZGqb9eW7AtxES\",\"2206\",\"static/chunks/2206-42291f248e6bf19d.js?dpl=dpl_A9QRwtuL4hrMD2RZGqb9eW7AtxES\",\"5782\",\"static/chunks/5782-04eaa6c475f5c3f2.js?dpl=dpl_A9QRwtuL4hrMD2RZGqb9eW7AtxES\",\"8419\",\"static/chunks/app/projects/%5Bslug%5D/page-7f8129194c3557a1.js?dpl=dpl_A9QRwtuL4hrMD2RZGqb9eW7AtxES\"],\"default\"]\n"])</script><script>self.__next_f.push([1,"b:[\"$\",\"$L19\",null,{\"project\":{\"id\":\"92223201-aa47-4575-963c-4f21ae18bc4e\",\"title\":\"Structural Design Optimization for Metal Additive Manufacturing (DFAM)\",\"slug\":\"structural-design-optimization-for-metal-additive-manufacturing-dfam-1\",\"summary\":{\"type\":\"doc\",\"content\":[{\"type\":\"paragraph\",\"content\":[{\"text\":\"Learn how to design and optimize a lightweight metal component using CAD, topology optimization, and basic simulation, following real-world additive manufacturing practices.\",\"type\":\"text\"}]}]},\"description\":{\"type\":\"doc\",\"content\":[{\"type\":\"paragraph\",\"content\":[{\"text\":\"In this 8-week Build Project, you will learn how engineers design lightweight, high‑performance metal parts for additive manufacturing. Starting with a simple design problem, you will create a CAD model, apply Design for Additive Manufacturing (DFAM) principles, and use topology optimization to reduce material while maintaining strength. The project also introduces basic structural simulation to verify design performance and simple cost and manufacturability considerations. By the end of the project, you will complete and present a fully optimized metal AM component, gaining hands‑on experience with tools and workflows used in modern mechanical design and advanced manufacturing roles.\",\"type\":\"text\"}]}]},\"project_area\":[\"Engineering\"],\"level\":\"Intermediate\",\"levelDescription\":\"Some experience recommended\",\"prerequisites\":{\"type\":\"doc\",\"content\":[{\"type\":\"paragraph\",\"content\":[{\"text\":\"Ability to create basic 3D parts using CAD software such as SolidWorks or Fusion 360.\",\"type\":\"text\"}]},{\"type\":\"paragraph\",\"content\":[{\"text\":\"Understanding of basic mechanical concepts such as force, stress, and material stiffness.\",\"type\":\"text\"}]},{\"type\":\"paragraph\",\"content\":[{\"text\":\"Familiarity with simple constraints like fixed supports and applied loads.\",\"type\":\"text\"}]},{\"type\":\"paragraph\",\"content\":[{\"text\":\"Comfort working with computer software and following step‑by‑step technical instructions.\",\"type\":\"text\"}]}]},\"goals\":{\"type\":\"doc\",\"content\":[{\"type\":\"paragraph\",\"content\":[{\"text\":\"Develop a foundational understanding of Design for Additive Manufacturing (DFAM) principles and metal additive manufacturing constraints.  \",\"type\":\"text\"}]},{\"type\":\"paragraph\",\"content\":[{\"text\":\"Construct a parametric CAD model with clearly defined design and non-design spaces for optimization.  \",\"type\":\"text\"}]},{\"type\":\"paragraph\",\"content\":[{\"text\":\"Establish complex boundary conditions and perform multi-scenario FEA analysis to identify governing load cases.  \",\"type\":\"text\"}]},{\"type\":\"paragraph\",\"content\":[{\"text\":\"Perform iterative topology optimization to maximize the stiffness-to-weight ratio while achieving significant mass reduction.  \",\"type\":\"text\"}]},{\"type\":\"paragraph\",\"content\":[{\"text\":\"Conduct cross-solver structural validation to ensure design integrity and consistency between Altair and SolidWorks.  \",\"type\":\"text\"}]},{\"type\":\"paragraph\",\"content\":[{\"text\":\"Transform organic optimization results into watertight, manufacturable solids using PolyNURBS-based geometry reconstruction.  \",\"type\":\"text\"}]}]},\"schedule\":\"Tuesdays, 8:00 P.M. ET / 5:00 P.M. PT\",\"status\":\"active\",\"duration\":\"8 weeks, 2-3 hours per week\",\"workshops\":{\"sessions\":[{\"name\":\"Introduction to DFAM \u0026 Project Overview\",\"order\":1,\"description\":{\"type\":\"doc\",\"content\":[{\"type\":\"paragraph\",\"content\":[{\"text\":\"Introduction to the fundamentals of metal additive manufacturing and the overall project workflow. You will select a project model such as an aircraft bracket, medical prosthesis, EV bike crank, or a model of their choice and define the engineering objectives for the project. \",\"type\":\"text\"}]}]}},{\"name\":\"CAD Modeling for Additive Manufacturing\",\"order\":2,\"description\":{\"type\":\"doc\",\"content\":[{\"type\":\"paragraph\",\"content\":[{\"text\":\"Development of parametric CAD models prepared for simulation and optimization. You will learn how to define design spaces for material optimization and preserve non-designed regions such as boltholes, mounting faces, and functional interfaces. \",\"type\":\"text\"}]}]}},{\"name\":\"Loads, Supports, and Materials\",\"order\":3,\"description\":{\"type\":\"doc\",\"content\":[{\"type\":\"paragraph\",\"content\":[{\"text\":\"Introduction to structural simulation using realistic fixtures, constraints, and loading conditions. You will perform a baseline Finite Element Analysis (FEA) to evaluate stress distribution, identify critical regions, and compare material options for metal additive manufacturing. \",\"type\":\"text\"}]}]}},{\"name\":\"Topology Optimization Basics\",\"order\":4,\"description\":{\"type\":\"doc\",\"content\":[{\"type\":\"paragraph\",\"content\":[{\"text\":\"Application of topology optimization to reduce unnecessary material while maintaining structural performance. You will analyze optimization results to understand efficient load paths and improve stiffness to weight performance. \",\"type\":\"text\"}]}]}},{\"name\":\"Structural Validation with FEA\",\"order\":5,\"description\":{\"type\":\"doc\",\"content\":[{\"type\":\"paragraph\",\"content\":[{\"text\":\"Validation of optimized designs through additional structural simulations and performance checks. You will compare results between Altair Inspire and SolidWorks Simulation to confirm design reliability and engineering accuracy. \",\"type\":\"text\"}]}]}},{\"name\":\"Design Refinement for Manufacturability\",\"order\":6,\"description\":{\"type\":\"doc\",\"content\":[{\"type\":\"paragraph\",\"content\":[{\"text\":\"Conversion of topology optimization results into smooth and manufacturable CAD geometry. You will use the PolyNURBS workflow, including Wrap, Fit, and Bridge tools, to create watertight solid models suitable for production. \",\"type\":\"text\"}]}]}},{\"name\":\"Cost and Manufacturability Review\",\"order\":7,\"description\":{\"type\":\"doc\",\"content\":[{\"type\":\"paragraph\",\"content\":[{\"text\":\"Evaluation of manufacturing feasibility for metal additive manufacturing processes. You will review build orientation, support strategies, and production considerations while completing a basic cost and manufacturability assessment. \",\"type\":\"text\"}]}]}},{\"name\":\"Final Presentation \u0026 Design Review\",\"order\":8,\"description\":{\"type\":\"doc\",\"content\":[{\"type\":\"paragraph\",\"content\":[{\"text\":\"Final engineering presentation and technical design review. You will present their optimized component, simulation results, and design decisions while comparing baseline and optimized performance outcomes. \",\"type\":\"text\"}]}]}}]},\"fellows\":[{\"id\":\"037d9089-85af-42c6-9385-837305a59ec9\",\"name\":\"Bhavik Vashi\",\"role\":\"Mechanical Engineering Fellow\",\"organization\":\"Open Avenues Foundation\",\"organizationLogoUrl\":\"/images/organizations/oaf-logo.png\",\"photoUrl\":\"https://avgkrhojcamcagufngrr.supabase.co/storage/v1/object/public/fellow-headshots/037d9089-85af-42c6-9385-837305a59ec9.webp\",\"bio\":\"Bhavik is a Mechanical Engineering Build Fellow at Open Avenues, where he works with students leading projects in mechanical engineering.\\n\\nBhavik is a Mechanical Design Engineer at Meyer Made, where he focuses on end-to-end product development for industrial equipment. His responsibilities include concept development, detailed CAD design, engineering analysis, design for manufacturability, prototyping, supplier coordination, and support through manufacturing release and production.\\n\\nBhavik has over five years of experience in the mechanical engineering and product development field. His career spans industrial equipment, vacuum systems, and electromechanical products, with hands-on involvement across the full product lifecycle and close collaboration with cross-functional engineering and manufacturing teams.\\n\\nHe holds a Master’s degree in Mechanical Engineering.\\n\\nA fun fact about Bhavik is that he enjoys product rendering, hiking and running, and exploring different coffee notes from around the world.\",\"linkedinUrl\":\"https://www.linkedin.com/in/bhavik-vashi-a99a777b/\"}],\"categories\":[\"Topology Optimization\",\"CAD Modeling\",\"Design For Additive Manufacturing\",\"Finite Element Analysis (FEA)\"],\"applicationTimeline\":[{\"label\":\"Applications open\",\"value\":\"May 11, 2026\"},{\"label\":\"Applications deadline\",\"value\":\"June 11, 2026\"},{\"label\":\"Application results released\",\"value\":\"Week of June 22, 2026\"},{\"label\":\"Project start date\",\"value\":\"Week of July 6, 2026\"},{\"label\":\"Project end date\",\"value\":\"Week of August 24, 2026\"}],\"cycle_id\":\"04780f7f-10bb-4b43-8480-8ef15da1b3cc\"},\"error\":\"$undefined\"}]\n"])</script></body></html>
