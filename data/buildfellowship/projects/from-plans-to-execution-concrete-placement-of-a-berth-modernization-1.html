S\",\"277\",\"static/chunks/54a60aa6-294bb7e111b509a4.js?dpl=dpl_A9QRwtuL4hrMD2RZGqb9eW7AtxES\",\"4420\",\"static/chunks/4420-baa8329e5076733c.js?dpl=dpl_A9QRwtuL4hrMD2RZGqb9eW7AtxES\",\"2169\",\"static/chunks/2169-1d13735e35f16c75.js?dpl=dpl_A9QRwtuL4hrMD2RZGqb9eW7AtxES\",\"419\",\"static/chunks/419-9f9e6d455ee0ae85.js?dpl=dpl_A9QRwtuL4hrMD2RZGqb9eW7AtxES\",\"5288\",\"static/chunks/5288-5d7819e0848b1b1a.js?dpl=dpl_A9QRwtuL4hrMD2RZGqb9eW7AtxES\",\"6874\",\"static/chunks/6874-67c719d6db2b17af.js?dpl=dpl_A9QRwtuL4hrMD2RZGqb9eW7AtxES\",\"6766\",\"static/chunks/6766-7fcc7eadc8fee52b.js?dpl=dpl_A9QRwtuL4hrMD2RZGqb9eW7AtxES\",\"9435\",\"static/chunks/9435-28f947009b0f7d38.js?dpl=dpl_A9QRwtuL4hrMD2RZGqb9eW7AtxES\",\"2206\",\"static/chunks/2206-42291f248e6bf19d.js?dpl=dpl_A9QRwtuL4hrMD2RZGqb9eW7AtxES\",\"5782\",\"static/chunks/5782-04eaa6c475f5c3f2.js?dpl=dpl_A9QRwtuL4hrMD2RZGqb9eW7AtxES\",\"8419\",\"static/chunks/app/projects/%5Bslug%5D/page-7f8129194c3557a1.js?dpl=dpl_A9QRwtuL4hrMD2RZGqb9eW7AtxES\"],\"default\"]\n1a:T5a2,Sara Rodriguez is a Civil Engineer Build Fellow at Dream Venture Labs, where she works with students leading projects in marine construction, including the construction and modernization of port berths and other critical marine infrastructure.\n\nSara is a Project Engineer at Orion Marine Construction, where she focuses on managing large-scale projects such as berth rehabilitations and bridge replacements. Her responsibilities include cost estimation, project scheduling, structural analysis, and overseeing the installation of key components like combiwalls, fenders, and utilities.\n\nSara has over five years of experience in the Project and Construction Management field, specializing in marine and heavy civil construction. She has worked on high-profile projects such as the Port Can"])</script><script>self.__next_f.push([1,"averal NCB4 Rehabilitation and Modernization and the Berth 268 Rehabilitation at Port Tampa Bay. Her expertise spans from geotechnical analysis and structural engineering to project budgeting and risk assessment.\nShe holds a Bachelor of Science in Civil Engineering from the University of South Florida and will complete her Master’s in Project Management from Harrisburg University of Science and Technology in December 2024. Additionally, she holds certifications such as OSHA 30-Hour Construction and Advanced Maintenance of Traffic.\n\nA fun fact about Sara Rodriguez is that she loves to exercise and cry as an excellent method to release emotions!"])</script><script>self.__next_f.push([1,"b:[\"$\",\"$L19\",null,{\"project\":{\"id\":\"3373252f-6af7-4c1f-b083-9c7051d5809d\",\"title\":\"From Plans to Execution: Concrete Placement of a Berth Modernization\",\"slug\":\"from-plans-to-execution-concrete-placement-of-a-berth-modernization-1\",\"summary\":{\"type\":\"doc\",\"content\":[{\"type\":\"paragraph\",\"content\":[{\"text\":\"Design and execute a comprehensive plan for the construction and modernization of a berth, mastering concrete placement techniques from interpreting plans to ensuring durability and safety on real-world construction sites.\",\"type\":\"text\"}]}]},\"description\":{\"type\":\"doc\",\"content\":[{\"type\":\"paragraph\",\"content\":[{\"text\":\"Concrete placement is one of the most fundamental processes in civil and marine construction, where precision and quality are key. In this Build Project, you'll step into the role of a field engineer, learning to prepare and execute concrete pours with a focus on safety and efficiency. Under the guidance of an experienced professional, you’ll gain hands-on experience tackling challenges such as managing environmental conditions and ensuring material quality. You will also explore the importance of curing methods and quality assurance practices. By working on real-world scenarios, this project equips you with industry-relevant skills critical for success in construction.\",\"type\":\"text\"}]}]},\"project_area\":[\"Engineering\"],\"level\":\"Intermediate\",\"levelDescription\":\"Some experience recommended\",\"prerequisites\":{\"type\":\"doc\",\"content\":[{\"type\":\"paragraph\",\"content\":[{\"text\":\"Basic knowledge of construction materials: Understand the composition of concrete and its properties.\",\"type\":\"text\"}]},{\"type\":\"paragraph\",\"content\":[{\"text\":\"Familiarity with construction plans: Be able to interpret structural and placement drawings.\",\"type\":\"text\"}]},{\"type\":\"paragraph\",\"content\":[{\"text\":\"Problem-solving mindset: Be prepared to address common challenges in placement scenarios.\",\"type\":\"text\"}]},{\"type\":\"paragraph\",\"content\":[{\"text\":\"Effective communication skills: Present and explain your plan and findings clearly.\",\"type\":\"text\"}]}]},\"goals\":{\"type\":\"doc\",\"content\":[{\"type\":\"paragraph\",\"content\":[{\"text\":\"Interpret and analyze concrete placement plans for various construction scenarios.\",\"type\":\"text\"}]},{\"type\":\"paragraph\",\"content\":[{\"text\":\"Prepare and execute safe and efficient concrete pours while managing site conditions.\",\"type\":\"text\"}]},{\"type\":\"paragraph\",\"content\":[{\"text\":\"Apply techniques to address challenges such as temperature variations, material consistency, and environmental factors.\",\"type\":\"text\"}]},{\"type\":\"paragraph\",\"content\":[{\"text\":\"Implement quality control measures to ensure compliance with construction standards.\",\"type\":\"text\"}]},{\"type\":\"paragraph\",\"content\":[{\"text\":\"Understand the role of curing in concrete durability and long-term performance.\",\"type\":\"text\"}]}]},\"schedule\":\"Fridays, 6:00 P.M. ET / 3:00 P.M. PT\",\"status\":\"archived\",\"duration\":\"8 weeks, 2-3 hours per week\",\"workshops\":{\"sessions\":[{\"name\":\"Introduction and Overview\",\"order\":1,\"description\":{\"type\":\"doc\",\"content\":[{\"type\":\"paragraph\",\"content\":[{\"text\":\"Meet your peers and Build Fellow, explore career interests, and gain an overview of concrete placement in berth modernization. Learn what the project entails and what the final deliverable looks like.\",\"type\":\"text\"}]}]}},{\"name\":\"Reading Concrete Placement Plans\",\"order\":2,\"description\":{\"type\":\"doc\",\"content\":[{\"type\":\"paragraph\",\"content\":[{\"text\":\"Learn to interpret concrete placement plans and identify key details such as dimensions, placement zones, and specifications. Discuss the role of plans in project success.\",\"type\":\"text\"}]}]}},{\"name\":\"Concrete Material Takeoff\",\"order\":3,\"description\":{\"type\":\"doc\",\"content\":[{\"type\":\"paragraph\",\"content\":[{\"text\":\"Learn how to calculate material quantities for a concrete placement project, including volume, reinforcement, and formwork needs. Understand the importance of accurate takeoffs for cost estimation and resource planning.\",\"type\":\"text\"}]}]}},{\"name\":\"Preparing for Placement\",\"order\":4,\"description\":{\"type\":\"doc\",\"content\":[{\"type\":\"paragraph\",\"content\":[{\"text\":\"Explore site preparation and logistics, including environmental considerations, equipment setup, and materials management. Develop strategies to address potential challenges.\",\"type\":\"text\"}]}]}},{\"name\":\"Execution of Placement\",\"order\":5,\"description\":{\"type\":\"doc\",\"content\":[{\"type\":\"paragraph\",\"content\":[{\"text\":\"Simulate a concrete placement operation, focusing on timing, teamwork, and safety protocols. Review best practices for effective placement in challenging conditions.\",\"type\":\"text\"}]}]}},{\"name\":\"Quality Control and Curing\",\"order\":6,\"description\":{\"type\":\"doc\",\"content\":[{\"type\":\"paragraph\",\"content\":[{\"text\":\"Discuss quality assurance measures, curing methods, and how to ensure long-term durability. Analyze real-world examples of common challenges and solutions.\",\"type\":\"text\"}]}]}},{\"name\":\"Final Project Preparation\",\"order\":7,\"description\":{\"type\":\"doc\",\"content\":[{\"type\":\"paragraph\",\"content\":[{\"text\":\"Compile your learnings and create your final deliverable. Refine your PDF report and prepare for your presentation. Collaborate with peers to polish your outputs.\",\"type\":\"text\"}]}]}},{\"name\":\"Final Presentation and Reflection\",\"order\":8,\"description\":{\"type\":\"doc\",\"content\":[{\"type\":\"paragraph\",\"content\":[{\"text\":\"Present your final report and showcase your concrete placement plan. Reflect on your learning experience and discuss how it applies to real-world construction projects.\",\"type\":\"text\"}]}]}}]},\"fellows\":[{\"id\":\"39b6a8db-3a03-4b7f-9684-cf7bf7b16665\",\"name\":\"Sara Rodriguez\",\"role\":\"Civil Engineering Fellow\",\"organization\":\"DREAM Venture Labs\",\"organizationLogoUrl\":\"/images/organizations/dv-logo.png\",\"photoUrl\":\"https://avgkrhojcamcagufngrr.supabase.co/storage/v1/object/public/fellow-headshots/39b6a8db-3a03-4b7f-9684-cf7bf7b16665.webp\",\"bio\":\"$1a\",\"linkedinUrl\":\"https://www.linkedin.com/in/sara-rodriguez-0310\"}],\"categories\":[\"Concrete Placement\",\"Civil Engineering\",\"Marine Construction\",\"Quality Control\"],\"applicationTimeline\":[{\"label\":\"Applications open\",\"value\":\"August 22, 2025\"},{\"label\":\"Applications deadline\",\"value\":\"September 14, 2025\"},{\"label\":\"Application results released\",\"value\":\"Week of September 22, 2025\"},{\"label\":\"Project start date\",\"value\":\"Week of October 6, 2025\"},{\"label\":\"Project end date\",\"value\":\"Week of November 24, 2025\"}],\"cycle_id\":\"d946e325-002e-4658-8923-05bdc47dc4a6\"},\"error\":\"$undefined\"}]\n"])</script></body></html>
