s?dpl=dpl_A9QRwtuL4hrMD2RZGqb9eW7AtxES\",\"2169\",\"static/chunks/2169-1d13735e35f16c75.js?dpl=dpl_A9QRwtuL4hrMD2RZGqb9eW7AtxES\",\"419\",\"static/chunks/419-9f9e6d455ee0ae85.js?dpl=dpl_A9QRwtuL4hrMD2RZGqb9eW7AtxES\",\"5288\",\"static/chunks/5288-5d7819e0848b1b1a.js?dpl=dpl_A9QRwtuL4hrMD2RZGqb9eW7AtxES\",\"6874\",\"static/chunks/6874-67c719d6db2b17af.js?dpl=dpl_A9QRwtuL4hrMD2RZGqb9eW7AtxES\",\"6766\",\"static/chunks/6766-7fcc7eadc8fee52b.js?dpl=dpl_A9QRwtuL4hrMD2RZGqb9eW7AtxES\",\"9435\",\"static/chunks/9435-28f947009b0f7d38.js?dpl=dpl_A9QRwtuL4hrMD2RZGqb9eW7AtxES\",\"2206\",\"static/chunks/2206-42291f248e6bf19d.js?dpl=dpl_A9QRwtuL4hrMD2RZGqb9eW7AtxES\",\"5782\",\"static/chunks/5782-04eaa6c475f5c3f2.js?dpl=dpl_A9QRwtuL4hrMD2RZGqb9eW7AtxES\",\"8419\",\"static/chunks/app/projects/%5Bslug%5D/page-7f8129194c3557a1.js?dpl=dpl_A9QRwtuL4hrMD2RZGqb9eW7AtxES\"],\"default\"]\n"])</script><script>self.__next_f.push([1,"b:[\"$\",\"$L19\",null,{\"project\":{\"id\":\"ebc59709-01c9-4022-bbd4-ed227b1422ff\",\"title\":\"Identify the Next IPO\",\"slug\":\"identify-the-next-ipo\",\"summary\":{\"type\":\"doc\",\"content\":[{\"type\":\"paragraph\",\"content\":[{\"text\":\"Choose a real-world company you admire and craft the “Business” section of an SEC registration statement. You’ll learn how companies position themselves when preparing to go public.\",\"type\":\"text\"}]}]},\"description\":{\"type\":\"doc\",\"content\":[{\"type\":\"paragraph\",\"content\":[{\"text\":\"In the fast-paced world of corporate finance and securities law, understanding how companies go public is a critical skill for legal and business professionals alike. In this Build Project, you’ll wear the hat of a U.S. securities attorney and prepare the Business section of an SEC registration statement for a company you believe is ready to go public. Under the guidance of an experienced industry expert, you’ll analyze a company’s business model, market opportunity, and competitive landscape to draft clear, compliant disclosure. You’ll become familiar with SEC disclosure frameworks, IPO documentation standards, and legal writing techniques used by corporate law firms. All this will happen in an environment that mirrors the workflow of a real capital markets legal team preparing a company for its initial public offering.\",\"type\":\"text\"}]}]},\"project_area\":[\"Business\"],\"level\":\"Beginner\",\"levelDescription\":\"No prior experience required\",\"prerequisites\":{\"type\":\"doc\",\"content\":[{\"type\":\"paragraph\",\"content\":[{\"text\":\"Introductory knowledge in business management, finance, operations, public relations, or who have a general understanding of in how companies operate.\",\"type\":\"text\"}]},{\"type\":\"paragraph\",\"content\":[{\"text\":\"Passion or genuine interest in the company you select: You’ll be most successful if you’re excited to explore your chosen company’s story, industry, and growth potential, and motivated to present it as a strong IPO candidate.\",\"type\":\"text\"}]},{\"type\":\"paragraph\",\"content\":[{\"text\":\"Written communication skills: You should be comfortable organizing information clearly and writing in a professional, concise, and objective tone.\",\"type\":\"text\"}]},{\"type\":\"paragraph\",\"content\":[{\"text\":\"Analytical thinking: You should be able to evaluate how a company positions itself in the market and identify what makes it appealing to investors.\",\"type\":\"text\"}]},{\"type\":\"paragraph\",\"content\":[{\"text\":\"You don’t need prior experience with law, securities offering, or SEC filings, but some familiarity with corporate strategy, financial statements, or market analysis will help you engage more deeply with the material.\",\"type\":\"text\"}]},{\"type\":\"paragraph\",\"content\":[{\"text\":\"It’s ideal for upper-level undergraduates or early master’s students who are curious about IPOs, investment banking, or corporate law and want to apply classroom concepts to a real-world, hands-on project.\",\"type\":\"text\"}]}]},\"goals\":{\"type\":\"doc\",\"content\":[{\"type\":\"paragraph\",\"content\":[{\"text\":\"Evaluate key factors that make a company an attractive IPO candidate, including market opportunity and growth strategy.\",\"type\":\"text\"}]},{\"type\":\"paragraph\",\"content\":[{\"text\":\"Apply legal and financial reasoning to describe a company’s operations, risk factors, and competitive advantages.\",\"type\":\"text\"}]},{\"type\":\"paragraph\",\"content\":[{\"text\":\"Communicate complex business and regulatory information in precise, professional language suitable for SEC filings.\",\"type\":\"text\"}]},{\"type\":\"paragraph\",\"content\":[{\"text\":\"Review and analyze precedent examples of other companies’ “Business” sections to understand how to capture and present information that is relevant and important to investors.\",\"type\":\"text\"}]},{\"type\":\"paragraph\",\"content\":[{\"text\":\"Become familiar with the structure and typical outline of the different headings and subheadings used in a Business section.\",\"type\":\"text\"}]},{\"type\":\"paragraph\",\"content\":[{\"text\":\"Learn about different industries and different business models.\",\"type\":\"text\"}]},{\"type\":\"paragraph\",\"content\":[{\"text\":\"Compare and contrast different companies that have similar business models. Learn how similar companies are able to compete and stand out in their respective industries.\",\"type\":\"text\"}]}]},\"schedule\":\"Saturdays, 4:00 P.M. ET / 1:00 P.M. PT\",\"status\":\"archived\",\"duration\":\"8 weeks, 2-3 hours per week\",\"workshops\":{\"sessions\":[{\"name\":\"Explore IPO Foundations\",\"order\":1,\"description\":{\"type\":\"doc\",\"content\":[{\"type\":\"paragraph\",\"content\":[{\"text\":\"You’ll get introduced to the SEC registration process and the structure of a registration statement, focusing on the “Business” and “Risk Factors” sections. You’ll choose a private company you believe could go public and explain why it has IPO potential.\",\"type\":\"text\"}]}]}},{\"name\":\"Analyze Real Filings\",\"order\":2,\"description\":{\"type\":\"doc\",\"content\":[{\"type\":\"paragraph\",\"content\":[{\"text\":\"You’ll review and annotate the “Business” sections from real SEC filings, studying how successful companies describe their operations and risks, and identifying formats relevant to your chosen company.\",\"type\":\"text\"}]}]}},{\"name\":\"Outline Your Business Section\",\"order\":3,\"description\":{\"type\":\"doc\",\"content\":[{\"type\":\"paragraph\",\"content\":[{\"text\":\"You’ll create a detailed outline for your company’s “Business” section, organizing it into clear subsections that highlight key business aspects and industry positioning.\",\"type\":\"text\"}]}]}},{\"name\":\"Draft Operations and Products\",\"order\":4,\"description\":{\"type\":\"doc\",\"content\":[{\"type\":\"paragraph\",\"content\":[{\"text\":\"You’ll expand your draft by describing your company’s products, services, and operations, incorporating industry analysis and relevant SEC disclosure standards.\",\"type\":\"text\"}]}]}},{\"name\":\"Understand and Identify Risks\",\"order\":5,\"description\":{\"type\":\"doc\",\"content\":[{\"type\":\"paragraph\",\"content\":[{\"text\":\"You’ll explore how public companies disclose risks, identify categories of potential risks for your company, and prepare an initial list of tailored risk factors.\",\"type\":\"text\"}]}]}},{\"name\":\"Write the Risk Factors Section\",\"order\":6,\"description\":{\"type\":\"doc\",\"content\":[{\"type\":\"paragraph\",\"content\":[{\"text\":\"You’ll draft five material risks specific to your company, applying principles of tone, materiality, and disclosure clarity to meet SEC expectations.\",\"type\":\"text\"}]}]}},{\"name\":\"Peer Review and Refine\",\"order\":7,\"description\":{\"type\":\"doc\",\"content\":[{\"type\":\"paragraph\",\"content\":[{\"text\":\"You’ll exchange drafts with peers, provide and receive structured feedback, and revise your “Business” and “Risk Factors” sections for accuracy, clarity, and completeness.\",\"type\":\"text\"}]}]}},{\"name\":\"Finalize and Reflect\",\"order\":8,\"description\":{\"type\":\"doc\",\"content\":[{\"type\":\"paragraph\",\"content\":[{\"text\":\"You’ll compile your final submission—your completed “Business” and “Risk Factors” sections—and reflect on how securities lawyers craft disclosure and manage IPO processes in real practice. You will also provide a 5 minutes presentation section to highlight the strengths and growth potentials of the company, structured as if delivering the company’s fundraising narrative to potential IPO investors at a roadshow.\",\"type\":\"text\"}]}]}}]},\"fellows\":[{\"id\":\"120c6118-155c-4c47-91be-494421bafc9d\",\"name\":\"Zixuan Guo\",\"role\":\"Law Fellow\",\"organization\":\"Open Avenues Foundation\",\"organizationLogoUrl\":\"/images/organizations/oaf-logo.png\",\"photoUrl\":\"https://avgkrhojcamcagufngrr.supabase.co/storage/v1/object/public/fellow-headshots/120c6118-155c-4c47-91be-494421bafc9d.webp\",\"bio\":\"Zixuan is a Law Build Fellow, where she works with students leading projects in securities laws and regulations.\\n\\nZixuan is an Associate at VCL Law LLP, where she focuses on capital markets and corporate transactions, including IPOs, SPACs, de-SPAC mergers, and PIPE offerings.\\n\\nZixuan has over three years of experience in capital markets. She advises issuers, underwriters, and investors on U.S. securities laws, cross-border corporate structuring, and exchange listing requirements.\\n\\nShe holds a J.D. degree from George Washington University Law School.\\n\\nA fun fact about Zixuan is that she enjoys growing plants at home. She cares for more than thirty pots, ranging from large leafy greens and succulents to carnivorous varieties.\",\"linkedinUrl\":\"https://www.linkedin.com/in/zixuan-guo\"}],\"categories\":[\"Securities Offering\",\"Business Analysis\",\"Legal Drafting\",\"Investor Communication\",\"IPO\"],\"applicationTimeline\":[{\"label\":\"Applications open\",\"value\":\"January 12, 2026\"},{\"label\":\"Applications deadline\",\"value\":\"February 5, 2026\"},{\"label\":\"Application results released\",\"value\":\"Week of February 16, 2026\"},{\"label\":\"Project start date\",\"value\":\"Week of March 2, 2026\"},{\"label\":\"Project end date\",\"value\":\"Week of April 20, 2026\"}],\"cycle_id\":\"ad606eee-63b5-4cb0-a043-f9303d6531d2\"},\"error\":\"$undefined\"}]\n"])</script></body></html>
