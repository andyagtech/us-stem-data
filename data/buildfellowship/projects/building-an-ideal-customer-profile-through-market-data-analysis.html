ic/chunks/54a60aa6-294bb7e111b509a4.js?dpl=dpl_A9QRwtuL4hrMD2RZGqb9eW7AtxES\",\"4420\",\"static/chunks/4420-baa8329e5076733c.js?dpl=dpl_A9QRwtuL4hrMD2RZGqb9eW7AtxES\",\"2169\",\"static/chunks/2169-1d13735e35f16c75.js?dpl=dpl_A9QRwtuL4hrMD2RZGqb9eW7AtxES\",\"419\",\"static/chunks/419-9f9e6d455ee0ae85.js?dpl=dpl_A9QRwtuL4hrMD2RZGqb9eW7AtxES\",\"5288\",\"static/chunks/5288-5d7819e0848b1b1a.js?dpl=dpl_A9QRwtuL4hrMD2RZGqb9eW7AtxES\",\"6874\",\"static/chunks/6874-67c719d6db2b17af.js?dpl=dpl_A9QRwtuL4hrMD2RZGqb9eW7AtxES\",\"6766\",\"static/chunks/6766-7fcc7eadc8fee52b.js?dpl=dpl_A9QRwtuL4hrMD2RZGqb9eW7AtxES\",\"9435\",\"static/chunks/9435-28f947009b0f7d38.js?dpl=dpl_A9QRwtuL4hrMD2RZGqb9eW7AtxES\",\"2206\",\"static/chunks/2206-42291f248e6bf19d.js?dpl=dpl_A9QRwtuL4hrMD2RZGqb9eW7AtxES\",\"5782\",\"static/chunks/5782-04eaa6c475f5c3f2.js?dpl=dpl_A9QRwtuL4hrMD2RZGqb9eW7AtxES\",\"8419\",\"static/chunks/app/projects/%5Bslug%5D/page-7f8129194c3557a1.js?dpl=dpl_A9QRwtuL4hrMD2RZGqb9eW7AtxES\"],\"default\"]\n"])</script><script>self.__next_f.push([1,"b:[\"$\",\"$L19\",null,{\"project\":{\"id\":\"34e9936c-71ac-4572-a59c-ef4968fedff0\",\"title\":\"Building an Ideal Customer Profile through Market Data Analysis\",\"slug\":\"building-an-ideal-customer-profile-through-market-data-analysis\",\"summary\":{\"type\":\"doc\",\"content\":[{\"type\":\"paragraph\",\"content\":[{\"text\":\"Develop a data-driven Ideal Customer Profile (ICP) by analyzing customer, market, and performance data to inform B2B SaaS go-to-market strategy.\",\"type\":\"text\"}]}]},\"description\":{\"type\":\"doc\",\"content\":[{\"type\":\"paragraph\",\"content\":[{\"text\":\"Every software company lives or dies by one question: who are our best customers, and how do we find more of them? In this Build Project, you'll wear the hat of a Market Research Analyst at a B2B SaaS company and dig into real-world-style data to answer it. Working from a prebuilt customer dataset we provide, and under the guidance of an experienced industry professional, you'll spot patterns across industries, company sizes, and buying behaviors, build a segmentation model, and define an Ideal Customer Profile (ICP) that pinpoints exactly who the business should target. You'll do all of your analysis in familiar, free tools like Excel or Google Sheets, in an environment that simulates how a real SaaS go-to-market team operates.\",\"type\":\"text\"}]}]},\"project_area\":[\"Business\",\"Data Science\"],\"level\":\"Beginner\",\"levelDescription\":\"No prior experience required\",\"prerequisites\":{\"type\":\"doc\",\"content\":[{\"type\":\"paragraph\",\"content\":[{\"text\":\"Comfortable working with structured data in a spreadsheet such as Excel or Google Sheets (sorting, filtering, and simple formulas). No prior CRM or data-tool experience is required.\",\"type\":\"text\"}]},{\"type\":\"paragraph\",\"content\":[{\"text\":\"Ability to interpret core business metrics such as conversion rate, revenue, and customer lifecycle stages.\",\"type\":\"text\"}]},{\"type\":\"paragraph\",\"content\":[{\"text\":\"Analytical thinking: ability to identify patterns, trends, and relationships in structured datasets\",\"type\":\"text\"}]},{\"type\":\"paragraph\",\"content\":[{\"text\":\"Communication skills: ability to clearly present insights in written and visual formats\",\"type\":\"text\"}]},{\"type\":\"paragraph\",\"content\":[{\"text\":\"Interest in market research, business strategy, and data-driven decision making\",\"type\":\"text\"}]}]},\"goals\":{\"type\":\"doc\",\"content\":[{\"type\":\"paragraph\",\"content\":[{\"text\":\"Analyze structured datasets to identify high-value customer segments\",\"type\":\"text\"}]},{\"type\":\"paragraph\",\"content\":[{\"text\":\"Develop a data-driven Ideal Customer Profile (ICP) using firmographic and behavioral variables\",\"type\":\"text\"}]},{\"type\":\"paragraph\",\"content\":[{\"text\":\"Evaluate segment performance using metrics such as conversion rates, deal size, and win rates\",\"type\":\"text\"}]},{\"type\":\"paragraph\",\"content\":[{\"text\":\"Apply competitive and market analysis frameworks to refine targeting strategy\",\"type\":\"text\"}]},{\"type\":\"paragraph\",\"content\":[{\"text\":\"Present insights and recommendations using data visualization and executive-level storytelling\",\"type\":\"text\"}]}]},\"schedule\":\"Fridays, 12:00 P.M. ET / 9:00 A.M. PT\",\"status\":\"applications_open\",\"duration\":\"8 weeks, 2-3 hours per week\",\"workshops\":{\"sessions\":[{\"name\":\"Introduction to Market Research \u0026 Segmentation\",\"order\":1,\"description\":{\"type\":\"doc\",\"content\":[{\"type\":\"paragraph\",\"content\":[{\"text\":\"Understand the role of market research in B2B SaaS and define the core concepts (segmentation, ICP, go-to-market) and business metrics.\",\"type\":\"text\"}]}]}},{\"name\":\"Data Cleaning and Preparation\",\"order\":2,\"description\":{\"type\":\"doc\",\"content\":[{\"type\":\"paragraph\",\"content\":[{\"text\":\"Extract, clean, and structure raw customer data from a CRM and prepare it for segmentation analysis.\",\"type\":\"text\"}]}]}},{\"name\":\"Segmentation Analysis\",\"order\":3,\"description\":{\"type\":\"doc\",\"content\":[{\"type\":\"paragraph\",\"content\":[{\"text\":\"Group customers into meaningful segments using firmographic and behavioral variables and build an initial segmentation model.\",\"type\":\"text\"}]}]}},{\"name\":\"Performance Analysis by Segment\",\"order\":4,\"description\":{\"type\":\"doc\",\"content\":[{\"type\":\"paragraph\",\"content\":[{\"text\":\"Evaluate and compare segment performance using metrics such as conversion rate, deal size, and sales cycle length.\",\"type\":\"text\"}]}]}},{\"name\":\"ICP Development\",\"order\":5,\"description\":{\"type\":\"doc\",\"content\":[{\"type\":\"paragraph\",\"content\":[{\"text\":\"Synthesize segmentation and performance findings into a structured, data-backed Ideal Customer Profile.\",\"type\":\"text\"}]}]}},{\"name\":\"Market and Competitive Context\",\"order\":6,\"description\":{\"type\":\"doc\",\"content\":[{\"type\":\"paragraph\",\"content\":[{\"text\":\"Add external market and competitive analysis (SWOT, positioning) and refine the ICP.\",\"type\":\"text\"}]}]}},{\"name\":\"Visualization and Storytelling\",\"order\":7,\"description\":{\"type\":\"doc\",\"content\":[{\"type\":\"paragraph\",\"content\":[{\"text\":\"Turn insights into clear dashboards and an executive-ready narrative.\",\"type\":\"text\"}]}]}},{\"name\":\"Final Presentation and Recommendations\",\"order\":8,\"description\":{\"type\":\"doc\",\"content\":[{\"type\":\"paragraph\",\"content\":[{\"text\":\"Present the segmentation model, ICP, and go-to-market recommendations and defend the strategy with data.\",\"type\":\"text\"}]}]}}]},\"fellows\":[{\"id\":\"0523bb8b-7085-4ab2-af28-a5351fbc0ea5\",\"name\":\"Albin Olander\",\"role\":\"Market Research Fellow\",\"organization\":\"Open Avenues Foundation\",\"organizationLogoUrl\":\"/images/organizations/oaf-logo.png\",\"photoUrl\":\"https://avgkrhojcamcagufngrr.supabase.co/storage/v1/object/public/fellow-headshots/0523bb8b-7085-4ab2-af28-a5351fbc0ea5.webp\",\"bio\":\"Albin Olander is a Market Research Fellow at Open Avenues, where he works with students leading projects in market research, customer segmentation, and go-to-market strategy.\\n\\nAlbin is the Head of Sales \u0026 business development at Manifest, an immigration technology company, where he leads both sales and marketing and shapes the go-to-market strategy and team behind the company's growth.\\n\\nAlbin has over 7 years of experience in B2B SaaS sales and go-to-market, most of it at HiBob, an HR technology company, where he built and grew customer relationships across international markets before joining Manifest. Turning raw data about customers into a clear picture of who to target and how is the core of his day job, and it is exactly what he now guides students through.\\n\\nA fun fact about Albin: He used to live in South Africa and work as a field/safari guide. \",\"linkedinUrl\":\"https://www.linkedin.com/in/albinolander/\"}],\"categories\":[\"Market Research\",\"Customer Segmentation\",\"B2B SaaS\",\"Data Analysis\"],\"applicationTimeline\":[{\"label\":\"Applications open\",\"value\":\"August 3, 2026\"},{\"label\":\"Applications deadline\",\"value\":\"September 3, 2026\"},{\"label\":\"Application results released\",\"value\":\"Week of September 14, 2026\"},{\"label\":\"Project start date\",\"value\":\"Week of September 28, 2026\"},{\"label\":\"Project end date\",\"value\":\"Week of November 16, 2026\"}],\"cycle_id\":\"6e8885e5-3870-4327-a19c-d88c867fa48f\"},\"error\":\"$undefined\"}]\n"])</script></body></html>
