a4.js?dpl=dpl_A9QRwtuL4hrMD2RZGqb9eW7AtxES\",\"4420\",\"static/chunks/4420-baa8329e5076733c.js?dpl=dpl_A9QRwtuL4hrMD2RZGqb9eW7AtxES\",\"2169\",\"static/chunks/2169-1d13735e35f16c75.js?dpl=dpl_A9QRwtuL4hrMD2RZGqb9eW7AtxES\",\"419\",\"static/chunks/419-9f9e6d455ee0ae85.js?dpl=dpl_A9QRwtuL4hrMD2RZGqb9eW7AtxES\",\"5288\",\"static/chunks/5288-5d7819e0848b1b1a.js?dpl=dpl_A9QRwtuL4hrMD2RZGqb9eW7AtxES\",\"6874\",\"static/chunks/6874-67c719d6db2b17af.js?dpl=dpl_A9QRwtuL4hrMD2RZGqb9eW7AtxES\",\"6766\",\"static/chunks/6766-7fcc7eadc8fee52b.js?dpl=dpl_A9QRwtuL4hrMD2RZGqb9eW7AtxES\",\"9435\",\"static/chunks/9435-28f947009b0f7d38.js?dpl=dpl_A9QRwtuL4hrMD2RZGqb9eW7AtxES\",\"2206\",\"static/chunks/2206-42291f248e6bf19d.js?dpl=dpl_A9QRwtuL4hrMD2RZGqb9eW7AtxES\",\"5782\",\"static/chunks/5782-04eaa6c475f5c3f2.js?dpl=dpl_A9QRwtuL4hrMD2RZGqb9eW7AtxES\",\"8419\",\"static/chunks/app/projects/%5Bslug%5D/page-7f8129194c3557a1.js?dpl=dpl_A9QRwtuL4hrMD2RZGqb9eW7AtxES\"],\"default\"]\n1a:T4ee,In the field of data science, the issue of data equity is an ongoing movement that aims to promote responsible data work. The current problem with major data practices is not that the data we have is insufficient, but that it doesn’t not accurately reflect the realities of women and non-binary people. For example, the gender binary (male/female) classification system in data collection will result in omission errors that make certain people’s experiences invisible. In this Build Project, you'll wear the hat of a Data Analyst and audit data cycle practices with a gender lens. Based on it, you'll produce a data visualization project that incorporates standard visualization frameworks and gender data best practices. Under the supervision of an experienced Build Fellow, you'll u"])</script><script>self.__next_f.push([1,"ncover the flaws in current research methodologies that have led to inaccurate and incomplete data on the status of women and non-binary persons. You'll explore marginal changes that can be made to the way that we collect, analyze, and visualize gender data. You’ll become familiar with data visualization frameworks such as Tufte’s rules, Junk Chart’s trifecta, and Schwabish’s core principles, as well as such ubiquitous industry tools as Excel, R, or Tableau. "])</script><script>self.__next_f.push([1,"b:[\"$\",\"$L19\",null,{\"project\":{\"id\":\"170618ef-160f-4efa-8f0d-f88ada1d25a4\",\"title\":\"Analyze a Dataset from a Critical Gender Perspective\",\"slug\":\"analyze-a-dataset-from-a-critical-gender-perspective\",\"summary\":{\"type\":\"doc\",\"content\":[{\"type\":\"paragraph\",\"content\":[{\"text\":\"Learn gender data best practices and audit a dataset of your choice and create an improved version of the dataset analysis.\",\"type\":\"text\"}]}]},\"description\":{\"type\":\"doc\",\"content\":[{\"type\":\"paragraph\",\"content\":[{\"text\":\"$1a\",\"type\":\"text\"}]}]},\"project_area\":[\"Computer Science\"],\"level\":\"Intermediate\",\"levelDescription\":\"Some experience recommended\",\"prerequisites\":{\"type\":\"doc\",\"content\":[{\"type\":\"paragraph\",\"content\":[{\"text\":\"Basic experience working with data: you should know how to read a dataset, clean data, and create a visual. \",\"type\":\"text\"}]},{\"type\":\"paragraph\",\"content\":[{\"text\":\"Basic knowledge of one of data visualization tools (such as Excel, R, Tableau): you should know how to navigate this tool, be able to use a dataset to create and format different visuals.\",\"type\":\"text\"}]},{\"type\":\"paragraph\",\"content\":[{\"text\":\"Other prerequisites: before the project starts, you'll need to have Excel and the data visualization tool of your choice installed on your computer.\",\"type\":\"text\"}]}]},\"goals\":{\"type\":\"doc\",\"content\":[{\"type\":\"paragraph\",\"content\":[{\"text\":\"Produce visuals that improve comprehension patterns for sex disaggregated data using standard visualization frameworks and gender data visualization best practices .\",\"type\":\"text\"}]},{\"type\":\"paragraph\",\"content\":[{\"text\":\"Audit data analysis projects using a gender lens and provide practical recommendations from learned best practices of gender data collection, analysis, and visualization .\",\"type\":\"text\"}]},{\"type\":\"paragraph\",\"content\":[{\"text\":\"Develop a data visualization critique and recommend improvements to make gender data visuals more compelling, digestible, ethical, simple, and accurate.\",\"type\":\"text\"}]}]},\"schedule\":\"Thursdays, 4:00 P.M. ET / 1:00 P.M. PT\",\"status\":\"archived\",\"duration\":\"8 weeks, 2-3 hours per week\",\"workshops\":{\"sessions\":[{\"name\":\"Introductions\",\"order\":1,\"description\":{\"type\":\"doc\",\"content\":[{\"type\":\"paragraph\",\"content\":[{\"text\":\"Get to know the Build Fellow and other students, ask questions about the project requirements, receive first reading materials\",\"type\":\"text\"}]}]}},{\"name\":\"Gender Data Basics\",\"order\":2,\"description\":{\"type\":\"doc\",\"content\":[{\"type\":\"paragraph\",\"content\":[{\"text\":\"Go over gender data basics and discuss reflection answers with the group\",\"type\":\"text\"}]}]}},{\"name\":\"Data Collection \u0026 Processing\",\"order\":3,\"description\":{\"type\":\"doc\",\"content\":[{\"type\":\"paragraph\",\"content\":[{\"text\":\"Go through one of the case studies and discuss biases in data collection \u0026 processing\",\"type\":\"text\"}]}]}},{\"name\":\"Data Analysis\",\"order\":4,\"description\":{\"type\":\"doc\",\"content\":[{\"type\":\"paragraph\",\"content\":[{\"text\":\"Discuss gender data analysis best practices and spot biases with the group based on the readings provided by the Build Fellow\",\"type\":\"text\"}]}]}},{\"name\":\"Data Visualization\",\"order\":5,\"description\":{\"type\":\"doc\",\"content\":[{\"type\":\"paragraph\",\"content\":[{\"text\":\"Students will discuss their reflections on visualization frameworks and answer questions during the workshop\",\"type\":\"text\"}]}]}},{\"name\":\"Data Visualization Cont'd\",\"order\":6,\"description\":{\"type\":\"doc\",\"content\":[{\"type\":\"paragraph\",\"content\":[{\"text\":\"Cont’d visualization frameworks and design best practices\",\"type\":\"text\"}]}]}},{\"name\":\"Final Deliverables\",\"order\":7,\"description\":{\"type\":\"doc\",\"content\":[{\"type\":\"paragraph\",\"content\":[{\"text\":\"Go over project deliverable expectations \u0026 progress and Q\u0026A\",\"type\":\"text\"}]}]}},{\"name\":\"Presentations\",\"order\":8,\"description\":{\"type\":\"doc\",\"content\":[{\"type\":\"paragraph\",\"content\":[{\"text\":\"Go over project deliverable expectations \u0026 progress and Q\u0026A\",\"type\":\"text\"}]}]}}]},\"fellows\":[{\"id\":\"48f3e6a7-a9f1-4c9f-9a7d-a0288168e935\",\"name\":\"Belise Bwiza\",\"role\":\"Data Science Fellow\",\"organization\":\"Open Avenues Foundation\",\"organizationLogoUrl\":\"/images/organizations/oaf-logo.png\",\"photoUrl\":\"https://avgkrhojcamcagufngrr.supabase.co/storage/v1/object/public/fellow-headshots/48f3e6a7-a9f1-4c9f-9a7d-a0288168e935.webp\",\"bio\":\"Belise Bwiza is a Data Science Global Talent Fellow at Open Avenues, where she works with students leading projects in Data Science.\\n\\nBelise is a Research Analyst at GRA, Incorporated, where focuses on analyzing the economics of improving aviation sustainability in the face of climate change, evaluating business cases for new applications of aviation, and forecasting traffic and revenue on potential new airline routes.\\n\\nBelise has over four years of experience in the research and data field. Prior to joining GRA, Incorporated, she conducted research and data analysis across various sectors, including international development, technology, and aviation markets in Africa.\\n\\nShe holds a bachelor’s degree in quantitative economics.\\n\\nA fun fact about Belise is that she interned in three continents before graduating College. \",\"linkedinUrl\":\"\"}],\"categories\":[\"Data Science\",\"Gender D
