a4.js?dpl=dpl_A9QRwtuL4hrMD2RZGqb9eW7AtxES\",\"4420\",\"static/chunks/4420-baa8329e5076733c.js?dpl=dpl_A9QRwtuL4hrMD2RZGqb9eW7AtxES\",\"2169\",\"static/chunks/2169-1d13735e35f16c75.js?dpl=dpl_A9QRwtuL4hrMD2RZGqb9eW7AtxES\",\"419\",\"static/chunks/419-9f9e6d455ee0ae85.js?dpl=dpl_A9QRwtuL4hrMD2RZGqb9eW7AtxES\",\"5288\",\"static/chunks/5288-5d7819e0848b1b1a.js?dpl=dpl_A9QRwtuL4hrMD2RZGqb9eW7AtxES\",\"6874\",\"static/chunks/6874-67c719d6db2b17af.js?dpl=dpl_A9QRwtuL4hrMD2RZGqb9eW7AtxES\",\"6766\",\"static/chunks/6766-7fcc7eadc8fee52b.js?dpl=dpl_A9QRwtuL4hrMD2RZGqb9eW7AtxES\",\"9435\",\"static/chunks/9435-28f947009b0f7d38.js?dpl=dpl_A9QRwtuL4hrMD2RZGqb9eW7AtxES\",\"2206\",\"static/chunks/2206-42291f248e6bf19d.js?dpl=dpl_A9QRwtuL4hrMD2RZGqb9eW7AtxES\",\"5782\",\"static/chunks/5782-04eaa6c475f5c3f2.js?dpl=dpl_A9QRwtuL4hrMD2RZGqb9eW7AtxES\",\"8419\",\"static/chunks/app/projects/%5Bslug%5D/page-7f8129194c3557a1.js?dpl=dpl_A9QRwtuL4hrMD2RZGqb9eW7AtxES\"],\"default\"]\n"])</script><script>self.__next_f.push([1,"b:[\"$\",\"$L19\",null,{\"project\":{\"id\":\"ab3ac6da-9e2a-4360-909b-28260ea2bffd\",\"title\":\"Lawyer for a Day: Build a Legal Case and Argue It in a Mock Trial\",\"slug\":\"lawyering-101-think-talk-and-write-like-a-lawyer-1-1\",\"summary\":{\"type\":\"doc\",\"content\":[{\"type\":\"paragraph\",\"content\":[{\"text\":\"You will step into the role of a lawyer as you analyze a fictional dispute, draft a persuasive legal brief, and argue your case in a live mock trial simulation.\",\"type\":\"text\"}]}]},\"description\":{\"type\":\"doc\",\"content\":[{\"type\":\"paragraph\",\"content\":[{\"text\":\"Think of this Project as a day in the life (likely a month) of a lawyer. You will learn the basics of how the US Legal system operates, how laws are interpreted, how to analyze decisions of different US courts and how to apply this law to factual circumstances. You will acquire skills vital for a career in the legal profession such as analysis, research, legal writing and oral advocacy. You will then apply these skills to a fictional legal dispute and draft a legal brief. These skills are helpful for those of you contemplating taking the LSATs. These skills would also benefit those of you considering careers in fields such as communications, business management and consultancy.\",\"type\":\"text\"}]}]},\"project_area\":[\"Law\",\"Business\"],\"level\":\"Beginner\",\"levelDescription\":\"No prior experience required\",\"prerequisites\":{\"type\":\"doc\",\"content\":[{\"type\":\"paragraph\",\"content\":[{\"text\":\"Strong English communication (writing + speaking): to draft clear briefs and present arguments during the mock trial.\",\"type\":\"text\"}]},{\"type\":\"paragraph\",\"content\":[{\"text\":\"Critical thinking \u0026 analytical reasoning: to identify key issues in the fact pattern, evaluate both sides, and build logical arguments from evidence and rules.\",\"type\":\"text\"}]},{\"type\":\"paragraph\",\"content\":[{\"text\":\"Basic legal reading/research literacy: comfort reading simplified statutes/cases and pulling out the rule/holding to apply to the fictional dispute.\",\"type\":\"text\"}]}]},\"goals\":{\"type\":\"doc\",\"content\":[{\"type\":\"paragraph\",\"content\":[{\"text\":\"Analyse a dispute and determine whether a legal claim can be made\",\"type\":\"text\"}]},{\"type\":\"paragraph\",\"content\":[{\"text\":\"Understand the nuances of the US legal system\",\"type\":\"text\"}]},{\"type\":\"paragraph\",\"content\":[{\"text\":\"Marshal facts and present them in the most persuasive manner\",\"type\":\"text\"}]},{\"type\":\"paragraph\",\"content\":[{\"text\":\"Analyse a legal decision and present legal arguments in a trial simulation\",\"type\":\"text\"}]}]},\"schedule\":\"Thursdays, 6:00 P.M. ET / 3:00 P.M. PT\",\"status\":\"active\",\"duration\":\"8 weeks, 2-3 hours per week\",\"workshops\":{\"sessions\":[{\"name\":\"Introduction\",\"order\":1,\"description\":{\"type\":\"doc\",\"content\":[{\"type\":\"paragraph\",\"content\":[{\"text\":\"In this workshop you will get acquainted with each other and your Build Law Fellow. Then, we will introduce the project and discuss the deliverables. You will also learn the basics about the US legal system.\",\"type\":\"text\"}]}]}},{\"name\":\"Reading the Law\",\"order\":2,\"description\":{\"type\":\"doc\",\"content\":[{\"type\":\"paragraph\",\"content\":[{\"text\":\"You will learn the skill of reading a legal document including a law passed by the legislature and legal decisions issued by different US courts.\",\"type\":\"text\"}]}]}},{\"name\":\"What is a Legal Conflict?\",\"order\":3,\"description\":{\"type\":\"doc\",\"content\":[{\"type\":\"paragraph\",\"content\":[{\"text\":\"You will learn about the genesis of a legal conflict, how such conflicts arise and discuss the different types of legal conflicts.\",\"type\":\"text\"}]}]}},{\"name\":\"Introduction to the Legal Dispute\",\"order\":4,\"description\":{\"type\":\"doc\",\"content\":[{\"type\":\"paragraph\",\"content\":[{\"text\":\"You will be introduced to the fictional legal dispute which will form the basis of the remaining sessions.\",\"type\":\"text\"}]}]}},{\"name\":\"Legal Strategy \u0026 Argument Part I\",\"order\":5,\"description\":{\"type\":\"doc\",\"content\":[{\"type\":\"paragraph\",\"content\":[{\"text\":\"You will analyse the dispute along with the Build Law Fellow from different perspectives and try to develop legal arguments.\",\"type\":\"text\"}]}]}},{\"name\":\"Legal Strategy \u0026 Argument Part II\",\"order\":6,\"description\":{\"type\":\"doc\",\"content\":[{\"type\":\"paragraph\",\"content\":[{\"text\":\"You will structure the arguments developed in the previous session into a compelling narrative and then use these arguments to draft a legal brief with the help of the Build Law Fellow.\",\"type\":\"text\"}]}]}},{\"name\":\"Trial Simulation\",\"order\":7,\"description\":{\"type\":\"doc\",\"content\":[{\"type\":\"paragraph\",\"content\":[{\"text\":\"You will be assigned sides in the dispute and you will then argue your positions before the Build Law Fellow who will act as the judge.\",\"type\":\"text\"}]}]}},{\"name\":\"Closing Session with Guest Speakers\",\"order\":8,\"description\":{\"type\":\"doc\",\"content\":[{\"type\":\"paragraph\",\"content\":[{\"text\":\"You will meet with lawyers practicing different types of law and will have the opportunity to learn more about the legal field and the guest speakers individual career paths. \",\"type\":\"text\"}]}]}}]},\"fellows\":[{\"id\":\"0b43d3ee-2ccc-4f91-b364-caae33dda980\",\"name\":\"Arshiya Sharda\",\"role\":\"Law Fellow\",\"organization\":\"Open Avenues Foundation\",\"organizationLogoUrl\":\"/images/organizations/oaf-logo.png\",\"photoUrl\":\"https://avgkrhojcamcagufngrr.supabase.co/storage/v1/object/public/fellow-headshots/0b43d3ee-2ccc-4f91-b364-caae33dda980.webp\",\"bio\":\"Arshiya is a Law Build Fellow at the Open Avenues Foundation, where she works with students leading projects in law. \\n Arshiya is an associate at Harris St. Laurent Wechsler LLP, where she focuses on commercial and employment litigation. \\n Arshiya has over six years of experience in the legal field. She previously clerked for the Honorable Andrea Masley, J.S.C. at the New York State Supreme Court (Civil Branch, Commercial Division). She also practiced as a commercial litigator in India for three years and worked with the capital markets practice of a leading Indian law firm for two years.\\n Arshiya holds a LL.M. from Columbia Law School and a B.A. LL.B. from the National Academy of Legal Studies and Research University of Law in India. She is a dual-qualified lawyer, admitted to practice in New York and India.\\n In her free time, Arshiya enjoys dancing, baking and learning new languages.\",\"linkedinUrl\":\"https://www.linkedin.com/in/arshiya-sharda-41099689/\"}],\"categories\":[\"Analytical Thinking\",\"Legal Research And Writing\",\"Oral Advocacy\"],\"applicationTimeline\":[{\"label\":\"Applications open\",\"value\":\"May 11, 2026\"},{\"label\":\"Applications deadline\",\"value\":\"June 11, 2026\"},{\"label\":\"Application results released\",\"value\":\"Week of June 22, 2026\"},{\"label\":\"Project start date\",\"value\":\"Week of July 6, 2026\"},{\"label\":\"Project end date\",\"value\":\"Week of August 24, 2026\"}],\"cycle_id\":\"04780f7f-10bb-4b43-8480-8ef15da1b3cc\"},\"error\":\"$undefined\"}]\n"])</script></body></html>
