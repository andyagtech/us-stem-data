a4.js?dpl=dpl_A9QRwtuL4hrMD2RZGqb9eW7AtxES\",\"4420\",\"static/chunks/4420-baa8329e5076733c.js?dpl=dpl_A9QRwtuL4hrMD2RZGqb9eW7AtxES\",\"2169\",\"static/chunks/2169-1d13735e35f16c75.js?dpl=dpl_A9QRwtuL4hrMD2RZGqb9eW7AtxES\",\"419\",\"static/chunks/419-9f9e6d455ee0ae85.js?dpl=dpl_A9QRwtuL4hrMD2RZGqb9eW7AtxES\",\"5288\",\"static/chunks/5288-5d7819e0848b1b1a.js?dpl=dpl_A9QRwtuL4hrMD2RZGqb9eW7AtxES\",\"6874\",\"static/chunks/6874-67c719d6db2b17af.js?dpl=dpl_A9QRwtuL4hrMD2RZGqb9eW7AtxES\",\"6766\",\"static/chunks/6766-7fcc7eadc8fee52b.js?dpl=dpl_A9QRwtuL4hrMD2RZGqb9eW7AtxES\",\"9435\",\"static/chunks/9435-28f947009b0f7d38.js?dpl=dpl_A9QRwtuL4hrMD2RZGqb9eW7AtxES\",\"2206\",\"static/chunks/2206-42291f248e6bf19d.js?dpl=dpl_A9QRwtuL4hrMD2RZGqb9eW7AtxES\",\"5782\",\"static/chunks/5782-04eaa6c475f5c3f2.js?dpl=dpl_A9QRwtuL4hrMD2RZGqb9eW7AtxES\",\"8419\",\"static/chunks/app/projects/%5Bslug%5D/page-7f8129194c3557a1.js?dpl=dpl_A9QRwtuL4hrMD2RZGqb9eW7AtxES\"],\"default\"]\n1a:T44b,Rui is an Information Systems Fellow at Open Avenues Foundation, where she works with students leading projects in digital health, product development, and user experience design.\n\nRui is a co-founder and CEO at Truffle Health, a healthcare technology startup that identifies and explains medical billing errors. She focuses on building patient-centered tools, leading cross-functional teams, and using data to drive product decisions.\n\nRui has over 6 years of experience in the healthcare and technology fields. She has worked at the World Health Organization and Weill Cornell Medicine, and has developed AI-powered tools and digital products at the intersection of public health and information systems.\n\nShe holds a Bachelor’s in Global Public Health Sciences and a Master’s in App"])</script><script>self.__next_f.push([1,"lied Information Science from Cornell University, as well as a Master’s in Information Systems from Technion – Israel Institute of Technology.\n\nA fun fact about Rui is that she hosts Renaissance-inspired tea salons in a secret mansion, where guests explore topics like wave mechanics, beauty, and meaning.\n"])</script><script>self.__next_f.push([1,"b:[\"$\",\"$L19\",null,{\"project\":{\"id\":\"66b58d0f-5943-49d2-9f92-67477112ade0\",\"title\":\"Founder Studio: Step Into the Role of a Founder\",\"slug\":\"startup-studio-step-into-the-role-of-a-founder-1-1-1\",\"summary\":{\"type\":\"doc\",\"content\":[{\"type\":\"paragraph\",\"content\":[{\"text\":\"Step into the role of a founder, learning how to identify a real problem, validate market demand, design a solution, and develop a go-to-market plan, culminating in a professional startup pitch deck.\",\"type\":\"text\"}]}]},\"description\":{\"type\":\"doc\",\"content\":[{\"type\":\"paragraph\",\"content\":[{\"text\":\"Bring a business idea to life in a fast-paced, eight-week mini startup incubator. You’ll step into the role of a founder, taking your idea from concept to a polished pitch deck ready for investors or competitions. Along the way, you’ll learn how to spot a real market need, validate your idea with research, design a compelling solution, and plan your go-to-market strategy. Using tools like the Lean Canvas, Google Slides, and AI assistants, you’ll work like an entrepreneur:  building, refining, and finally pitching your startup.\",\"type\":\"text\"}]}]},\"project_area\":[\"Business\"],\"level\":\"Beginner\",\"levelDescription\":\"No prior experience required\",\"prerequisites\":{\"type\":\"doc\",\"content\":[{\"type\":\"paragraph\",\"content\":[{\"text\":\"Curiosity about solving real-world problems and an openness to exploring creative, unconventional solutions.\",\"type\":\"text\"}]},{\"type\":\"paragraph\",\"content\":[{\"text\":\"Willingness to collaborate in small teams, contribute ideas, and present in front of others.\",\"type\":\"text\"}]},{\"type\":\"paragraph\",\"content\":[{\"text\":\"Comfort using basic online tools such as Google Slides, Google Docs, or Canva to create and present materials.\",\"type\":\"text\"}]},{\"type\":\"paragraph\",\"content\":[{\"text\":\"An interest in researching markets and customers, including finding and interpreting data from online sources.\",\"type\":\"text\"}]}]},\"goals\":{\"type\":\"doc\",\"content\":[{\"type\":\"paragraph\",\"content\":[{\"text\":\"Create a professional startup pitch deck in Google Slides or Canva, following an investor-ready structure.\",\"type\":\"text\"}]},{\"type\":\"paragraph\",\"content\":[{\"text\":\"Complete a one-page business model canvas using the Lean Canvas framework to define value proposition, revenue streams, and customer segments.\",\"type\":\"text\"}]},{\"type\":\"paragraph\",\"content\":[{\"text\":\"Develop a go-to-market strategy outline that identifies initial customer acquisition channels and launch tactics.\",\"type\":\"text\"}]},{\"type\":\"paragraph\",\"content\":[{\"text\":\"Produce a simple market research brief summarizing target audience, competitive landscape, and market size using tools like Google Trends, Statista, and AI research assistants.\",\"type\":\"text\"}]},{\"type\":\"paragraph\",\"content\":[{\"text\":\"Communicate and pitch your idea to an audience using storytelling and clear, structured delivery.\",\"type\":\"text\"}]}]},\"schedule\":\"Wednesdays, 9:00 P.M. ET / 6:00 P.M. PT\",\"status\":\"applications_open\",\"duration\":\"8 weeks, 2-3 hours per week\",\"workshops\":{\"sessions\":[{\"name\":\"Welcome to the Founder’s Seat\",\"order\":1,\"description\":{\"type\":\"doc\",\"content\":[{\"type\":\"paragraph\",\"content\":[{\"text\":\"Step into the role of a startup founder. Learn the number one reason startups fail and how to avoid it. Through interactive brainstorming, identify 2-3 problems worth solving and choose one to explore over the course.\",\"type\":\"text\"}]}]}},{\"name\":\"Know Your Market \u0026 Audience\",\"order\":2,\"description\":{\"type\":\"doc\",\"content\":[{\"type\":\"paragraph\",\"content\":[{\"text\":\"Discover who your customers really are and what they need. Learn how to create simple customer personas and validate market demand. Work with your team to define your target audience and start your market research.\",\"type\":\"text\"}]}]}},{\"name\":\"Designing Your Solution\",\"order\":3,\"description\":{\"type\":\"doc\",\"content\":[{\"type\":\"paragraph\",\"content\":[{\"text\":\"Turn your problem into a compelling solution. Explore brainstorming techniques and AI-powered ideation tools to generate and refine your startup concept. Leave with a clear description of your product or service.\",\"type\":\"text\"}]}]}},{\"name\":\"Mapping the Competitive Landscape\",\"order\":4,\"description\":{\"type\":\"doc\",\"content\":[{\"type\":\"paragraph\",\"content\":[{\"text\":\"Learn how to research competitors and spot opportunities in the market. Identify what already exists, where the gaps are, and how your solution stands out. Begin compiling your competitive analysis for your pitch deck.\",\"type\":\"text\"}]}]}},{\"name\":\"Your Go-To-Market Game Plan\",\"order\":5,\"description\":{\"type\":\"doc\",\"content\":[{\"type\":\"paragraph\",\"content\":[{\"text\":\"Explore how startups get their first customers. Learn about different customer acquisition channels and choose the best ones for your idea. Draft your go-to-market strategy, focusing on your first 100 customers.\",\"type\":\"text\"}]}]}},{\"name\":\"Designing the Business Model\",\"order\":6,\"description\":{\"type\":\"doc\",\"content\":[{\"type\":\"paragraph\",\"content\":[{\"text\":\"Understand how startups make money and deliver value. Use the Lean Canvas framework to outline your business model, including revenue streams, key activities, and value proposition.\",\"type\":\"text\"}]}]}},{\"name\":\"Crafting Your Pitch\",\"order\":7,\"description\":{\"type\":\"doc\",\"content\":[{\"type\":\"paragraph\",\"content\":[{\"text\":\"Learn the art of storytelling for startups. Structure your pitch to take your audience from the problem to the solution, market, business model, and go-to-market plan. Build the first draft of your pitch deck slides.\",\"type\":\"text\"}]}]}},{\"name\":\"Pitch Demo Day\",\"order\":8,\"description\":{\"type\":\"doc\",\"content\":[{\"type\":\"paragraph\",\"content\":[{\"text\":\"Present your startup to the class in a pitch session. Share your 5-7 slide deck, answer audience questions, and celebrate completing your founder journey.\",\"type\":\"text\"}]}]}}]},\"fellows\":[{\"id\":\"235ba152-6abb-4403-a353-7736d0177c06\",\"name\":\"Rui Maki\",\"role\":\"Information Systems Fellow\",\"organization\":\"Open Avenues Foundation\",\"organizationLogoUrl\":\"/images/organizations/oaf-logo.png\",\"photoUrl\":\"https://avgkrhojcamcagufngrr.supabase.co/storage/v1/object/public/fellow-headshots/235ba152-6abb-4403-a353-7736d0177c06.webp\",\"bio\":\"$1a\",\"linkedinUrl\":\"https://www.linkedin.com/in/rui-maki/\"}],\"categories\":[\"Entrepreneurship\",\"Go-to-Market Strategy\",\"Market Research\",\"Pitching\"],\"applicationTimeline\":[{\"label\":\"Applications open\",\"value\":\"August 3, 2026\"},{\"label\":\"Applications deadline\",\"value\":\"September 3, 2026\"},{\"label\":\"Application results released\",\"value\":\"Week of September 14, 2026\"},{\"label\":\"Project start date\",\"value\":\"Week of September 28, 2026\"},{\"label\":\"Project end date\",\"value\":\"Week of November 16, 2026\"}],\"cycle_id\":\"6e8885e5-3870-4327-a19c-d88c867fa48f\"},\"error\":\"$undefined\"}]\n"])</script></body></html>
