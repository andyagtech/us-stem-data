ys exploring mystery and thriller movies and audiobooks in his free time."])</script><script>self.__next_f.push([1,"b:[\"$\",\"$L19\",null,{\"project\":{\"id\":\"798bef72-86ba-46f8-9d2a-a52a020f482c\",\"title\":\"Skin Cancer Detection with Deep Learning\",\"slug\":\"skin-cancer-detection-with-deep-learning\",\"summary\":{\"type\":\"doc\",\"content\":[{\"type\":\"paragraph\",\"content\":[{\"text\":\"Build and train deep learning models to classify skin cancer images accurately using Convolutional Neural Networks (CNNs).\",\"type\":\"text\"}]}]},\"description\":{\"type\":\"doc\",\"content\":[{\"type\":\"paragraph\",\"content\":[{\"text\":\"This project combines artificial intelligence with healthcare, equipping you to solve real-world challenges through machine learning. You will gain foundational knowledge in machine learning and explore deep learning methodologies for image classification. Using Convolutional Neural Networks (CNNs), you will develop models capable of analyzing and categorizing skin cancer images with precision. The hands-on nature of this project provides you with experience in data preprocessing, model training, and evaluation, ensuring you are prepared for entry-level roles in AI and machine learning.\",\"type\":\"text\"}]}]},\"project_area\":[\"Computer Science\"],\"level\":\"Intermediate\",\"levelDescription\":\"Some experience recommended\",\"prerequisites\":{\"type\":\"doc\",\"content\":[{\"type\":\"paragraph\",\"content\":[{\"text\":\"Basic Python programming knowledge, including syntax and functions.\",\"type\":\"text\"}]},{\"type\":\"paragraph\",\"content\":[{\"text\":\"Familiarity with linear algebra concepts like matrices and vector operations.\",\"type\":\"text\"}]},{\"type\":\"paragraph\",\"content\":[{\"text\":\"A basic understanding of data preprocessing and visualization techniques.\",\"type\":\"text\"}]}]},\"goals\":{\"type\":\"doc\",\"content\":[{\"type\":\"paragraph\",\"content\":[{\"text\":\"By the end of the project, you will be able to:\",\"type\":\"text\"}]},{\"type\":\"paragraph\",\"content\":[{\"text\":\"Execute Python code effectively on Google Colab.\",\"type\":\"text\"}]},{\"type\":\"paragraph\",\"content\":[{\"text\":\"Build foundational machine learning models using linear and logistic regression.\",\"type\":\"text\"}]},{\"type\":\"paragraph\",\"content\":[{\"text\":\"Develop neural networks and apply deep learning techniques for image classification.\",\"type\":\"text\"}]},{\"type\":\"paragraph\",\"content\":[{\"text\":\"Design and implement Convolutional Neural Networks (CNNs) for detecting skin cancer.\",\"type\":\"text\"}]},{\"type\":\"paragraph\",\"content\":[{\"text\":\"Work with advanced architectures like ResNet-50 for higher classification accuracy.\",\"type\":\"text\"}]}]},\"schedule\":\"Tuesdays, 7:00 P.M. ET / 4:00 P.M. PT\",\"status\":\"archived\",\"duration\":\"8 weeks, 2-3 hours per week\",\"workshops\":{\"sessions\":[{\"name\":\"Introduction to ML and Google Colab\",\"order\":1,\"description\":{\"type\":\"doc\",\"content\":[{\"type\":\"paragraph\",\"content\":[{\"text\":\"Learn the basics of machine learning and set up Google Colab for development.\",\"type\":\"text\"}]}]}},{\"name\":\"Linear Algebra and Introduction to NumPy \u0026 Pandas\",\"order\":2,\"description\":{\"type\":\"doc\",\"content\":[{\"type\":\"paragraph\",\"content\":[{\"text\":\"Understand key concepts in linear algebra and learn to use NumPy and Pandas for data manipulation.\",\"type\":\"text\"}]}]}},{\"name\":\"Data Preprocessing and Visualization with Matplotlib\",\"order\":3,\"description\":{\"type\":\"doc\",\"content\":[{\"type\":\"paragraph\",\"content\":[{\"text\":\"Explore data preprocessing techniques and create insightful visualizations using Matplotlib.\",\"type\":\"text\"}]}]}},{\"name\":\"Linear Regression\",\"order\":4,\"description\":{\"type\":\"doc\",\"content\":[{\"type\":\"paragraph\",\"content\":[{\"text\":\"Understand and implement a simple linear regression model for predictive analysis.\",\"type\":\"text\"}]}]}},{\"name\":\"Logistic Regression\",\"order\":5,\"description\":{\"type\":\"doc\",\"content\":[{\"type\":\"paragraph\",\"content\":[{\"text\":\"Dive into logistic regression for binary classification and evaluate its performance.\",\"type\":\"text\"}]}]}},{\"name\":\"Building Neural Networks\",\"order\":6,\"description\":{\"type\":\"doc\",\"content\":[{\"type\":\"paragraph\",\"content\":[{\"text\":\"Learn the fundamentals of neural networks and implement a basic model.\",\"type\":\"text\"}]}]}},{\"name\":\"Implementing CNNs and Introduction to ResNet-50\",\"order\":7,\"description\":{\"type\":\"doc\",\"content\":[{\"type\":\"paragraph\",\"content\":[{\"text\":\"Understand and implement a Convolutional Neural Network (CNN) for image classification, followed by a brief introduction to ResNet-50 and its key concepts.\",\"type\":\"text\"}]}]}},{\"name\":\"Final Presentation\",\"order\":8,\"description\":{\"type\":\"doc\",\"content\":[{\"type\":\"paragraph\",\"content\":[{\"text\":\"Understand and implement a Convolutional Neural Network (CNN) for image classification, followed by a brief introduction to ResNet-50 and its key concepts.\",\"type\":\"text\"}]}]}}]},\"fellows\":[{\"id\":\"b595bbbe-7688-40c8-b4ea-9c46b4f91e1a\",\"name\":\"Sehaj Grover\",\"role\":\"Software Development Fellow\",\"organization\":\"Open Avenues Foundation\",\"organizationLogoUrl\":\"/images/organizations/oaf-logo.png\",\"photoUrl\":\"https://avgkrhojcamcagufngrr.supabase.co/storage/v1/object/public/fellow-headshots/b595bbbe-7688-40c8-b4ea-9c46b4f91e1a.webp\",\"bio\":\"$1a\",\"linkedinUrl\":\"https://www.linkedin.com/in/sehaj-grover/\"}],\"categories\":[\"Python\",\"Machine Learning\",\"Deep Learning\",\"Image Classification\"],\"applicationTimeline\":[{\"label\":\"Applications open\",\"value\":\"May 9, 2025\"},{\"label\":\"Applications deadline\",\"value\":\"June 8, 2025\"},{\"label\":\"Application results released\",\"value\":\"Week of June 23, 2025\"},{\"l
