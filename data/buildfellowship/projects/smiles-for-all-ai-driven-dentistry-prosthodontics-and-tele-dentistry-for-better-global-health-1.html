static/chunks/22747d63-b78dbc5d907b1f14.js?dpl=dpl_A9QRwtuL4hrMD2RZGqb9eW7AtxES\",\"277\",\"static/chunks/54a60aa6-294bb7e111b509a4.js?dpl=dpl_A9QRwtuL4hrMD2RZGqb9eW7AtxES\",\"4420\",\"static/chunks/4420-baa8329e5076733c.js?dpl=dpl_A9QRwtuL4hrMD2RZGqb9eW7AtxES\",\"2169\",\"static/chunks/2169-1d13735e35f16c75.js?dpl=dpl_A9QRwtuL4hrMD2RZGqb9eW7AtxES\",\"419\",\"static/chunks/419-9f9e6d455ee0ae85.js?dpl=dpl_A9QRwtuL4hrMD2RZGqb9eW7AtxES\",\"5288\",\"static/chunks/5288-5d7819e0848b1b1a.js?dpl=dpl_A9QRwtuL4hrMD2RZGqb9eW7AtxES\",\"6874\",\"static/chunks/6874-67c719d6db2b17af.js?dpl=dpl_A9QRwtuL4hrMD2RZGqb9eW7AtxES\",\"6766\",\"static/chunks/6766-7fcc7eadc8fee52b.js?dpl=dpl_A9QRwtuL4hrMD2RZGqb9eW7AtxES\",\"9435\",\"static/chunks/9435-28f947009b0f7d38.js?dpl=dpl_A9QRwtuL4hrMD2RZGqb9eW7AtxES\",\"2206\",\"static/chunks/2206-42291f248e6bf19d.js?dpl=dpl_A9QRwtuL4hrMD2RZGqb9eW7AtxES\",\"5782\",\"static/chunks/5782-04eaa6c475f5c3f2.js?dpl=dpl_A9QRwtuL4hrMD2RZGqb9eW7AtxES\",\"8419\",\"static/chunks/app/projects/%5Bslug%5D/page-7f8129194c3557a1.js?dpl=dpl_A9QRwtuL4hrMD2RZGqb9eW7AtxES\"],\"default\"]\n1a:T548,Sandeep is a Medical Sciences Global Talent Fellow at Open Avenues, where he works with students leading projects in AI-driven dentistry, teledentistry, and healthcare innovation. His fellowship introduces undergraduate students to careers in healthcare and dentistry by exploring how artificial intelligence can improve patient education, diagnostic tools, and access to care — especially in underserved communities.\n\nSandeep currently serves as Dentist in Richmond, where he manages clinical operations, mentors dental teams, and provides advanced restorative and prosthodontic treatments, including implant rehabilitation and digital dentistry workflows.\n\nSandeep has over 15 years of experience in dentistry, including a decade as a Dental Officer in the Indian Army, where he provid"])</script><script>self.__next_f.push([1,"ed comprehensive dental care to military personnel and organized numerous outreach programs and oral cancer screening camps in rural and high-altitude regions.\n\nHe holds a Master’s degree and Certificate in Prosthodontics from Columbia University, School of Dental Medicine, New York, and a Bachelor of Dental Surgery (BDS) degree from, India.\n\nA fun fact about Sandeep is that he is an adventure sports enthusiast, certified in scuba diving, paragliding, and hot air ballooning, and enjoys pushing himself to take on exciting challenges outside of the clinic.\n"])</script><script>self.__next_f.push([1,"b:[\"$\",\"$L19\",null,{\"project\":{\"id\":\"28dbbe82-cbd2-42ad-8d21-c9ff9da96d05\",\"title\":\"Smiles for All: Improving Global Oral Health Through AI and Teledentistry\",\"slug\":\"smiles-for-all-ai-driven-dentistry-prosthodontics-and-tele-dentistry-for-better-global-health-1\",\"summary\":{\"type\":\"doc\",\"content\":[{\"type\":\"paragraph\",\"content\":[{\"text\":\"Investigate access gaps in dental services and propose creative solutions through technology by writing your own tele dentistry plan and ethics reflection. \",\"type\":\"text\"}]}]},\"description\":{\"type\":\"doc\",\"content\":[{\"type\":\"paragraph\",\"content\":[{\"text\":\"How can AI help dentists thrive in their duties? This project will help you understand and connect oral health equity and human-AI collaboration.\",\"type\":\"text\"}]},{\"type\":\"paragraph\",\"content\":[{\"text\":\"This Build Project is for those of you who are starting your journey in healthcare, dentistry, or science. You will learn how AI tools can read dental X-rays, suggest treatments, or even help design replacement teeth. You’ll also explore tele dentistry, which allows dentists to provide advice and checkups online. Under the supervision of an industry expert, you will think about how these tools can help underserved communities while also discussing their limits and ethical issues. By the end of the project, you’ll create a tele dentistry plan, write an infographic/white paper, and write an ethics reflection.\",\"type\":\"text\"}]}]},\"project_area\":[\"Biology \u0026 Healthcare\"],\"level\":\"Beginner\",\"levelDescription\":\"No prior experience required\",\"prerequisites\":{\"type\":\"doc\",\"content\":[{\"type\":\"paragraph\",\"content\":[{\"text\":\"Interest in healthcare, dentistry, or technology.\",\"type\":\"text\"}]},{\"type\":\"paragraph\",\"content\":[{\"text\":\"Curiosity about how new tools can improve care.\",\"type\":\"text\"}]},{\"type\":\"paragraph\",\"content\":[{\"text\":\"Basic teamwork and communication skills.\",\"type\":\"text\"}]},{\"type\":\"paragraph\",\"content\":[{\"text\":\"Willingness to research and share ideas.\",\"type\":\"text\"}]},{\"type\":\"paragraph\",\"content\":[{\"text\":\"No coding or dental background is required.\",\"type\":\"text\"}]}]},\"goals\":{\"type\":\"doc\",\"content\":[{\"type\":\"paragraph\",\"content\":[{\"text\":\"Learn the basics of AI and how it can help dentists.\",\"type\":\"text\"}]},{\"type\":\"paragraph\",\"content\":[{\"text\":\"Understand why access to dental care is unequal across the world.\",\"type\":\"text\"}]},{\"type\":\"paragraph\",\"content\":[{\"text\":\"Get introduced to tele dentistry (online dental care).\",\"type\":\"text\"}]},{\"type\":\"paragraph\",\"content\":[{\"text\":\"Explore how dentists and AI can work together safely and ethically.\",\"type\":\"text\"}]},{\"type\":\"paragraph\",\"content\":[{\"text\":\"Work in teams to design ideas for improving dental care in real communities.\",\"type\":\"text\"}]},{\"type\":\"paragraph\",\"content\":[{\"text\":\"Practice presenting ideas clearly in simple, professional formats.\",\"type\":\"text\"}]}]},\"schedule\":\"Fridays, 3:00 P.M. ET / 12:00 P.M. PT\",\"status\":\"archived\",\"duration\":\"8 weeks, 2-3 hours per week\",\"workshops\":{\"sessions\":[{\"name\":\"Orientation \u0026 Getting Started\",\"order\":1,\"description\":{\"type\":\"doc\",\"content\":[{\"type\":\"paragraph\",\"content\":[{\"text\":\"Welcome session to introduce you all to the project, meet each other, and share personal journeys. You will learn what the 8-week project will look like and reflect on what you hope to gain.\",\"type\":\"text\"}]}]}},{\"name\":\"What is AI? A Beginner’s Guide to AI in Healthcare\",\"order\":2,\"description\":{\"type\":\"doc\",\"content\":[{\"type\":\"paragraph\",\"content\":[{\"text\":\"Introduction to artificial intelligence basics with examples from everyday life and healthcare. You see how AI helps in fields like radiology and dentistry and create a simple infographic connecting AI to real-world uses.\",\"type\":\"text\"}]}]}},{\"name\":\"Oral Health Around the World\",\"order\":3,\"description\":{\"type\":\"doc\",\"content\":[{\"type\":\"paragraph\",\"content\":[{\"text\":\"You explore global oral health challenges and how culture, economics, and infrastructure affect access to care. You'll collaborate on a poster or slide that highlights one key challenge and brainstorm possible solutions.\",\"type\":\"text\"}]}]}},{\"name\":\"Tele dentistry \u0026 Remote Care Models\",\"order\":4,\"description\":{\"type\":\"doc\",\"content\":[{\"type\":\"paragraph\",\"content\":[{\"text\":\"You learn how tele dentistry works, explore its benefits and limitations, and role-play a virtual consultation. They design a basic flowchart showing how a remote care visit could work. Support participants as they develop their content further — identifying sources, visuals, or data relevant to their chosen deliverable. Discuss ethical implications and examples of AI errors in healthcare that may inform their project.\",\"type\":\"text\"}]}]}},{\"name\":\"The Role of Humans in AI-Driven Care\",\"order\":5,\"description\":{\"type\":\"doc\",\"content\":[{\"type\":\"paragraph\",\"content\":[{\"text\":\"You analyze the risks and limitations of AI in healthcare and discuss why human oversight is critical. Through examples and debate, they consider what decisions AI should make and what decisions require humans. Deepen project development by incorporating practical, professional, or clinical applications. Encourage participants to integrate design, structure, and evidence into their deliverable. Introduce digital dentistry tools and their relation to AI-assisted care.\",\"type\":\"text\"}]}]}},{\"name\":\"Introduction to Digital Dentistry \u0026 AI Tools\",\"order\":6,\"description\":{\"type\":\"doc\",\"content\":[{\"type\":\"paragraph\",\"content\":[{\"text\":\"A beginner-friendly introduction to digital dentistry. You review demos of AI-assisted workflows (screenshots/videos) and create a simple group slide deck summarizing how AI supports dental care. Continue refinement and visual or written polish. Offer individualized feedback and short peer reviews. Participants should have near-final drafts that combine both creative and analytical thinking.\",\"type\":\"text\"}]}]}},{\"name\":\"Planning for Equitable Access to Dental Care\",\"order\":7,\"description\":{\"type\":\"doc\",\"content\":[{\"type\":\"paragraph\",\"content\":[{\"text\":\"You learn about equity in healthcare and brainstorm how to expand AI and tele dentistry to underserved communities. They draft a one-page plan with key stakeholders, barriers, and strategies. Conduct a peer and Fellow feedback workshop. Participants share near-final deliverables, receive critique, and make last adjustments before the final submission.\",\"type\":\"text\"}]}]}},{\"name\":\"Final Presentations \u0026 Reflection\",\"order\":8,\"description\":{\"type\":\"doc\",\"content\":[{\"type\":\"paragraph\",\"content\":[{\"text\":\"You bring together their work from previous weeks into a final presentation. They reflect on their learning journey, share insights, and celebrate their progress with peers and the Fellow.\",\"type\":\"text\"}]}]}}]},\"fellows\":[{\"id\":\"5057a309-b1ac-4305-9138-a02025758608\",\"name\":\"Sandeep Bhardwaj\",\"role\":\"Medical Sciences Fellow\",\"organization\":\"Open Avenues Foundation\",\"organizationLogoUrl\":\"/images/organizations/oaf-logo.png\",\"photoUrl\":\"https://avgkrhojcamcagufngrr.supabase.co/storage/v1/object/public/fellow-headshots/5057a309-b1ac-4305-9138-a02025758608.webp\",\"bio\":\"$1a\",\"linkedinUrl\":\"https://www.linkedin.com/in/sandeep-bhardwaj-/\"}],\"categories\":[\"Applications of Artificial Intelligence\",\"Dental Technology\",\"Health Equity\",\"Telehealth\"],\"applicationTimeline\":[{\"label\":\"Applications open\",\"value\":\"April 13, 2026\"},{\"label\":\"Applications deadline\",\"value\":\"May 20, 2026\"},{\"label\":\"Application results released\",\"value\":\"Week of May 26, 2026\"},{\"label\":\"Project start date\",\"value\":\"Week of June 8, 2026\"},{\"label\":\"Project end date\",\"value\":\"Week of July 27, 2026\"}],\"cycle_id\":\"ae26a648-44bc-4fab-bbb0-7f9c0f6b18d9\"},\"error\":\"$undefined\"}]\n"])</script></body></html>
