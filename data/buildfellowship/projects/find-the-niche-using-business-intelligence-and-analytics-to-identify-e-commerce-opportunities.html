maginary fast-growing e-commerce company and explore how data-driven insights can inform strategic decisions. Guided by an experienced professional, you will analyze sales data and public product reviews to uncover business opportunities. By the end of the project, you’ll develop a published Jupyter notebook documenting all the analytical processes and comments and a 1-page written report with the insights derived and the market entry proposal\",\"type\":\"text\"}]},{\"type\":\"paragraph\",\"content\":[{\"text\":\"You will use industry-standard tools to clean and process data, perform statistical analysis and create visualizations. This Build Project will help you gain hands-on experience in data science, market analysis, and strategic planning—skills highly sought after in today's data-driven industries.\",\"type\":\"text\"}]}]},\"project_area\":[\"Computer Science\"],\"level\":\"Intermediate\",\"levelDescription\":\"Some experience recommended\",\"prerequisites\":{\"type\":\"doc\",\"content\":[{\"type\":\"paragraph\",\"content\":[{\"text\":\"Experience with basic Python programming, including pandas, numpy, matplotlib, and basic data manipulations.\",\"type\":\"text\"}]},{\"type\":\"paragraph\",\"content\":[{\"text\":\"Familiarity with basic statistics, including descriptive statistics and probability.\",\"type\":\"text\"}]},{\"type\":\"paragraph\",\"content\":[{\"text\":\"Interest in data analytics or data science.\",\"type\":\"text\"}]},{\"type\":\"paragraph\",\"content\":[{\"text\":\"Interest in market analysis or entry planning.\",\"type\":\"text\"}]}]},\"goals\":{\"type\":\"doc\",\"content\":[{\"type\":\"paragraph\",\"content\":[{\"text\":\"Utilize python to clean, process, explore, and visualize datasets.\",\"type\":\"text\"}]},{\"type\":\"paragraph\",\"content\":[{\"text\":\"Utilize statistical methods to spot trends and opportunities in quantitative datasets.\",\"type\":\"text\"}]},{\"type\":\"paragraph\",\"content\":[{\"text\":\"Utilize natural language processing models to interpret free text and drive insights.\",\"type\":\"text\"}]},{\"type\":\"paragraph\",\"content\":[{\"text\":\"Synthesize results from research to draft market analysis and derive market entry plan.\",\"type\":\"text\"}]}]},\"schedule\":\"Fridays, 6:00 P.M. ET / 3:00 P.M. PT\",\"status\":\"archived\",\"duration\":\"8 weeks, 2-3 hours per week\",\"workshops\":{\"sessions\":[{\"name\":\"Introduction to E-commerce Data Analytics\",\"order\":1,\"description\":{\"type\":\"doc\",\"content\":[{\"type\":\"paragraph\",\"content\":[{\"text\":\"In this session, you will set up your python and jupyter notebook environment, get familiarized with helium 10, and get introduced to how analytics will play a crucial role in today’s e-commerce world.\",\"type\":\"text\"}]}]}},{\"name\":\"Find Your Keyword\",\"order\":2,\"description\":{\"type\":\"doc\",\"content\":[{\"type\":\"paragraph\",\"content\":[{\"text\":\"In this session, you will be learning how to pick their e-commerce keyword and how to verify its trending potential through google trends. You will also learn how to use the proper tools to scrape sales and public review data from amazon.com.\",\"type\":\"text\"}]}]}},{\"name\":\"Preparing Your Data\",\"order\":3,\"description\":{\"type\":\"doc\",\"content\":[{\"type\":\"paragraph\",\"content\":[{\"text\":\"Through a live code demo, you will learn how to explore, clean, and prepare their datasets into analytics-ready form.\",\"type\":\"text\"}]}]}},{\"name\":\"Sales Data Analysis\",\"order\":4,\"description\":{\"type\":\"doc\",\"content\":[{\"type\":\"paragraph\",\"content\":[{\"text\":\"In a live demo, you will learn various visualization tools and methods, plus the techniques to analyze data from multiple angles.\",\"type\":\"text\"}]}]}},{\"name\":\"Public Review Analysis\",\"order\":5,\"description\":{\"type\":\"doc\",\"content\":[{\"type\":\"paragraph\",\"content\":[{\"text\":\"Through a live demo, you will learn how to analyze free text data to add an extra perspective to your market analysis and entry planning.\",\"type\":\"text\"}]}]}},{\"name\":\"Develop Your Market Entry Plan\",\"order\":6,\"description\":{\"type\":\"doc\",\"content\":[{\"type\":\"paragraph\",\"content\":[{\"text\":\"Through live business case reviews and concept walkthroughs, you will learn how to synthesize your previous learnings into a written report, plus how to find business opportunities for your market entry draft.\",\"type\":\"text\"}]}]}},{\"name\":\"Project Management 101 \u0026 Finalizing Deliverables\",\"order\":7,\"description\":{\"type\":\"doc\",\"content\":[{\"type\":\"paragraph\",\"content\":[{\"text\":\"You will be learning how to manage your market entry timeline by creating your own gantt charts. You will also be discussing and refining your visualizations, insights, and market entry proposals with instructor.\",\"type\":\"text\"}]}]}},{\"name\":\"Project Presentation and Feedbacks\",\"order\":8,\"description\":{\"type\":\"doc\",\"content\":[{\"type\":\"paragraph\",\"content\":[{\"text\":\"You will be presenting your analytical findings and your written report(optional) in a powerpoint format, and getting feedbacks from your peers and instructor.\",\"type\":\"text\"}]}]}}]},\"fellows\":[{\"id\":\"b2a104f7-aaf3-43c0-b9d0-86b8d0de10f1\",\"name\":\"Wenxing Li\",\"role\":\"Business Intelligence Fellow\",\"organization\":\"DREAM Venture Labs\",\"organizationLogoUrl\":\"/images/organizations/dv-logo.png\",\"photoUrl\":\"https://avgkrhojcamcagufngrr.supabase.co/storage/v1/object/public/fellow-headshots/b2a104f7-aaf3-43c0-b9d0-86b8d0de10f1.webp\",\"bio\":\"Wenxing is a Business Intelligence Build Fellow at Dream Venture Labs, where he works with students leading projects in Business Analytics\\nWenxing is a Business Data Analyst at Intus Care, Inc., where he creates and maintains business intelligence reports, data models, and analytical tools to support the business development teams. He provides essential metrics and reporting platforms for tracking and managing client program business and care outcomes, and conduct complex analysis of large datasets to derive actionable insights.\\nWenxing has over 3 years of experience in the Business/Data Analytics field. \\nHe holds a Master’s Degree in Innovation Management.\\nA fun fact about Wenxing – He loves playing pool and is currently in the APA league!\\n\",\"linkedinUrl\":\"https://www.linkedin.com/in/wenxingli/\"}],\"categories\":[\"Data Analytics\",\"Statistics\",\"Data Visualizations\",\"Market Research\",\"Corporate Strategy\",\"Project Management\",\"E-Commerce\"],\"applicationTimeline\":[{\"label\":\"Applications open\",\"value\":\"April 14, 2025\"},{\"label\":\"Applications deadline\",\"value\":\"May 8, 2025\"},{\"label\":\"Application results released\",\"value\":\"Week of May 26, 2025\"},{\"label\":\"Project start date\",\"value\":\"Week of June 9, 2025\"},{\"label\":\"Project end date\",\"value\":\"Week of July 28, 2025\"}],\"cycle_id\":\"df5723b5-8bf2-4c66-9f51-20935009dba6\"},\"error\":\"$undefined\"}]\n"])</script></body></html>
