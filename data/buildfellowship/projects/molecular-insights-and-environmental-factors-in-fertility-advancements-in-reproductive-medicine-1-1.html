,\"1194\",\"static/chunks/22747d63-b78dbc5d907b1f14.js?dpl=dpl_A9QRwtuL4hrMD2RZGqb9eW7AtxES\",\"277\",\"static/chunks/54a60aa6-294bb7e111b509a4.js?dpl=dpl_A9QRwtuL4hrMD2RZGqb9eW7AtxES\",\"4420\",\"static/chunks/4420-baa8329e5076733c.js?dpl=dpl_A9QRwtuL4hrMD2RZGqb9eW7AtxES\",\"2169\",\"static/chunks/2169-1d13735e35f16c75.js?dpl=dpl_A9QRwtuL4hrMD2RZGqb9eW7AtxES\",\"419\",\"static/chunks/419-9f9e6d455ee0ae85.js?dpl=dpl_A9QRwtuL4hrMD2RZGqb9eW7AtxES\",\"5288\",\"static/chunks/5288-5d7819e0848b1b1a.js?dpl=dpl_A9QRwtuL4hrMD2RZGqb9eW7AtxES\",\"6874\",\"static/chunks/6874-67c719d6db2b17af.js?dpl=dpl_A9QRwtuL4hrMD2RZGqb9eW7AtxES\",\"6766\",\"static/chunks/6766-7fcc7eadc8fee52b.js?dpl=dpl_A9QRwtuL4hrMD2RZGqb9eW7AtxES\",\"9435\",\"static/chunks/9435-28f947009b0f7d38.js?dpl=dpl_A9QRwtuL4hrMD2RZGqb9eW7AtxES\",\"2206\",\"static/chunks/2206-42291f248e6bf19d.js?dpl=dpl_A9QRwtuL4hrMD2RZGqb9eW7AtxES\",\"5782\",\"static/chunks/5782-04eaa6c475f5c3f2.js?dpl=dpl_A9QRwtuL4hrMD2RZGqb9eW7AtxES\",\"8419\",\"static/chunks/app/projects/%5Bslug%5D/page-7f8129194c3557a1.js?dpl=dpl_A9QRwtuL4hrMD2RZGqb9eW7AtxES\"],\"default\"]\n1a:T43d,Molecular Biology\n\nSahil Sanghvi is a Senior Clinical Embryologist Build Fellow at Dream Venture Labs, where he works with students leading projects in Molecular Biology and Reproductive Medicine.\n\nSahil is a Senior Clinical Embryologist specializing in advanced assisted reproductive technologies (ART) at Nevada Fertility Institute, where he focuses on optimizing embryo culture, micromanipulation techniques, and improving patient outcomes. His work integrates molecular insights and environmental factors to advance fertility treatments. Sahil also leads research on differentiating Day 3 and Day 5 embryos using machine learning models.\n\nSahil has over 8 years of experience in the embryology field. With extensive expertise, he has contributed to enhancing laboratory protocols, impr"])</script><script>self.__next_f.push([1,"oving embryo viability, and applying innovative technologies in reproductive medicine.\n\nHe holds a a postgraduate degree in Medical Clinical Embryology.\n\nA fun fact about Sahil is that he has a deep passion for embryo and gamete photography, capturing the intricate beauty of early life stages.\n\n"])</script><script>self.__next_f.push([1,"b:[\"$\",\"$L19\",null,{\"project\":{\"id\":\"b5b9480f-f0f5-4a7c-96f4-8587e5675f26\",\"title\":\"Molecular Insights and Environmental Factors in Fertility: Advancements in Reproductive Medicine\",\"slug\":\"molecular-insights-and-environmental-factors-in-fertility-advancements-in-reproductive-medicine-1-1\",\"summary\":{\"type\":\"doc\",\"content\":[{\"type\":\"paragraph\",\"content\":[{\"text\":\"This project examines the molecular and environmental factors affecting fertility, focusing on advancements in clinical embryology and assisted reproductive technologies (ART) to improve reproductive success.\",\"type\":\"text\"}]}]},\"description\":{\"type\":\"doc\",\"content\":[{\"type\":\"paragraph\",\"content\":[{\"text\":\"This project provides an immersive experience in the field of clinical embryology and fertility research. Students will delve into the science of human reproduction and in vitro fertilization (IVF) and its techniques, exploring how lifestyle modifications can improve treatment outcomes. Through research and analysis, participants will address real-world challenges in fertility treatments, such as patient education and evidence-based interventions.\",\"type\":\"text\"}]},{\"type\":\"paragraph\",\"content\":[{\"text\":\"Recent data from the Centers for Disease Control and Prevention (CDC) and other public health sources indicate that approximately 10–15% of couples experience infertility, with both male and female factors contributing significantly to reproductive challenges. Male infertility factors account for approximately 30–35% of infertility cases. These statistics underscore the growing need for advancements in fertility research, accessible treatment options, and increased public awareness of reproductive health.\",\"type\":\"text\"}]},{\"type\":\"paragraph\",\"content\":[{\"text\":\"The growing demand for fertility services has led to a booming fertility clinic industry, with the U.S. market projected to reach $14 billion by 2030 (Grand View Research). This surge reflects not only increased awareness and technological advancements but also a shift in societal trends, such as delayed parenthood and rising infertility rates.\",\"type\":\"text\"}]},{\"type\":\"paragraph\",\"content\":[{\"text\":\"By the end of the project, students will have developed foundational knowledge in clinical embryology, IVF laboratory principles, and fertility-related research methodologies applicable to careers in reproductive medicine and public health.\",\"type\":\"text\"}]}]},\"project_area\":[\"Biology \u0026 Healthcare\"],\"level\":\"Intermediate\",\"levelDescription\":\"Some experience recommended\",\"prerequisites\":{\"type\":\"doc\",\"content\":[{\"type\":\"paragraph\",\"content\":[{\"text\":\"Basic Understanding of Biology and Reproductive Science\",\"type\":\"text\"}]},{\"type\":\"paragraph\",\"content\":[{\"text\":\"Research and Analytical Skills\",\"type\":\"text\"}]},{\"type\":\"paragraph\",\"content\":[{\"text\":\"Critical Thinking\",\"type\":\"text\"}]},{\"type\":\"paragraph\",\"content\":[{\"text\":\"Scientific Writing and Communication\",\"type\":\"text\"}]},{\"type\":\"paragraph\",\"content\":[{\"text\":\"Knowledge of Laboratory Techniques (Optional but Preferred)\",\"type\":\"text\"}]},{\"type\":\"paragraph\",\"content\":[{\"text\":\"Interest in Fertility and Public Health\",\"type\":\"text\"}]},{\"type\":\"paragraph\",\"content\":[{\"text\":\"Technical Proficiency\",\"type\":\"text\"}]}]},\"goals\":{\"type\":\"doc\",\"content\":[{\"type\":\"paragraph\",\"content\":[{\"text\":\"Understand the molecular and environmental factors influencing fertility and embryonic development.\",\"type\":\"text\"}]},{\"type\":\"paragraph\",\"content\":[{\"text\":\"Gain proficiency in research methodologies specific to reproductive sciences\",\"type\":\"text\"}]},{\"type\":\"paragraph\",\"content\":[{\"text\":\"Develop critical thinking and problem-solving skills to address challenges in fertility treatments\",\"type\":\"text\"}]},{\"type\":\"paragraph\",\"content\":[{\"text\":\"Create data-driven recommendations to improve outcomes in reproductive medicine\",\"type\":\"text\"}]},{\"type\":\"paragraph\",\"content\":[{\"text\":\"Analyze molecular, environmental, and clinical factors influencing fertility and IVF outcomes.\",\"type\":\"text\"}]}]},\"schedule\":\"Fridays, 6:00 P.M. ET / 3:00 P.M. PT\",\"status\":\"active\",\"duration\":\"8 weeks, 2-3 hours per week\",\"workshops\":{\"sessions\":[{\"name\":\"Foundations of Molecular Embryology \u0026 Fertility\",\"order\":1,\"description\":{\"type\":\"doc\",\"content\":[{\"type\":\"paragraph\",\"content\":[{\"text\":\"Participants will gain foundational knowledge of reproductive molecular biology and its role in fertility. Key topics include cellular structure, molecular signaling in gametogenesis. Epigenetic regulation during embryonic development and clinical practices like in vitro fertilization (IVF), embryo cryopreservation, and preimplantation genetic testing (PGT).  Students will engage with data-driven facts and interactive visualizations.\",\"type\":\"text\"}]}]}},{\"name\":\"Advances in Preimplantation Genetic Testing (PGT)\",\"order\":2,\"description\":{\"type\":\"doc\",\"content\":[{\"type\":\"paragraph\",\"content\":[{\"text\":\"This session focuses on the principles and clinical applications of Preimplantation Genetic Testing (PGT) in assisted reproductive technologies. Participants will explore embryo biopsy techniques, chromosomal screening, monogenic disorder testing, and structural rearrangement analysis. Students will also examine ethical considerations, limitations of genetic testing, and the impact of PGT on embryo selection and IVF outcomes. \",\"type\":\"text\"}]}]}},{\"name\":\"Assisted Reproductive Technologies (ART) \u0026 Molecular Advances\",\"order\":3,\"description\":{\"type\":\"doc\",\"content\":[{\"type\":\"paragraph\",\"content\":[{\"text\":\"This session provides an in-depth exploration of the biological and clinical relationship between infertility and its management through assisted reproductive technologies. \",\"type\":\"text\"}]},{\"type\":\"paragraph\",\"content\":[{\"text\":\"It focuses on evidence-based advancements in IVF laboratories and highlights how cutting-edge scientific techniques contribute to improved treatment outcomes.\",\"type\":\"text\"}]},{\"type\":\"paragraph\",\"content\":[{\"text\":\"Participants will examine the physiological and molecular mechanisms underlying infertility and gain insight into how modern reproductive technologies intervene at various stages of gamete handling, fertilization, and embryo development.\",\"type\":\"text\"}]},{\"type\":\"paragraph\",\"content\":[{\"text\":\"The course integrates theoretical understanding with practical applications used in IVF laboratories, including IVF and ICSI techniques, embryology workflows, and emerging molecular diagnostic tools.\",\"type\":\"text\"}]}]}},{\"name\":\"Environmental Influences on Fertility \u0026 Embryo Development\",\"order\":4,\"description\":{\"type\":\"doc\",\"content\":[{\"type\":\"paragraph\",\"content\":[{\"text\":\"This session involves a structured group discussion on environmental influences on fertility. Participants will explore how external factors such as pollution, diet, endocrine-disrupting chemicals, and psychological stress impact reproductive function. The discussion integrates scientific literature and clinical perspectives to understand effects on gamete quality, embryo development, and ART outcomes.\",\"type\":\"text\"}]}]}},{\"name\":\"Laboratory Techniques in Clinical Embryology\",\"order\":5,\"description\":{\"type\":\"doc\",\"content\":[{\"type\":\"paragraph\",\"content\":[{\"text\":\"Participants will engage in an in-depth exploration of essential embryology laboratory techniques that contribute to embryo development and viability in ART cycles. The session focuses on the scientific principles behind embryo culture systems, cryopreservation (vitrification and warming), and embryo grading/selection strategies used in IVF laboratories.\",\"type\":\"text\"}]},{\"type\":\"paragraph\",\"content\":[{\"text\":\"In addition, participants will be introduced to molecular diagnostic approaches applied in reproductive medicine, including genetic screening technologies used during preimplantation stages. The session integrates both theoretical and applied perspectives to demonstrate how laboratory optimization directly influences clinical outcomes in fertility treatment.\",\"type\":\"text\"}]}]}},{\"name\":\"Embryo Viability and Selection in Assisted Reproductive Technology (ART)\",\"order\":6,\"description\":{\"type\":\"doc\",\"content\":[{\"type\":\"paragraph\",\"content\":[{\"text\":\"Participants will learn how molecular, genetic, and environmental factors affect embryo development and viability. They will also explore how these factors are used in selecting embryos during ART procedures to improve success rates\",\"type\":\"text\"}]}]}},{\"name\":\"Advances in Vitrification Techniques for Gametes and Embryos\",\"order\":7,\"description\":{\"type\":\"doc\",\"content\":[{\"type\":\"paragraph\",\"content\":[{\"text\":\"Participants will learn about the vitrification process, factors affecting cryosurvival rates, and recent technological innovations. The session will include real-world case discussions to understand the clinical implications of vitrification in IVF success.\",\"type\":\"text\"}]}]}},{\"name\":\"Thawing Techniques in Embryology\",\"order\":8,\"description\":{\"type\":\"doc\",\"content\":[{\"type\":\"paragraph\",\"content\":[{\"text\":\"This session provides a step-by-step overview of thawing vitrified gametes and embryos, common laboratory challenges, and evidence-based strategies to optimize post-thaw survival and embryo viability\",\"type\":\"text\"}]}]}}]},\"fellows\":[{\"id\":\"762fe90c-addf-47ba-9d73-2b7b5ae50ed6\",\"name\":\"Sahil Sanghvi\",\"role\":\"Molecular Biology Fellow\",\"organization\":\"DREAM Venture Labs\",\"organizationLogoUrl\":\"/images/organizations/dv-logo.png\",\"photoUrl\":\"https://avgkrhojcamcagufngrr.supabase.co/storage/v1/object/public/fellow-headshots/762fe90c-addf-47ba-9d73-2b7b5ae50ed6.webp\",\"bio\":\"$1a\",\"linkedinUrl\":\"https://www.linkedin.com/in/sahil-sanghvi-275499138\"}],\"categories\":[\"Molecular Embryology\",\"Reproductive Biology\",\"Assisted Reproductive Technologies (ART)\",\"IVF Laboratory Techniques\",\"Human Reproduction\"],\"applicationTimeline\":[{\"label\":\"Applications open\",\"value\":\"May 11, 2026\"},{\"label\":\"Applications deadline\",\"value\":\"June 11, 2026\"},{\"label\":\"Application results released\",\"value\":\"Week of June 22, 2026\"},{\"label\":\"Project start date\",\"value\":\"Week of July 6, 2026\"},{\"label\":\"Project end date\",\"value\":\"Week of August 24, 2026\"}],\"cycle_id\":\"04780f7f-10bb-4b43-8480-8ef15da1b3cc\"},\"error\":\"$undefined\"}]\n"])</script></body></html>
