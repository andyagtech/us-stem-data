4bb7e111b509a4.js?dpl=dpl_A9QRwtuL4hrMD2RZGqb9eW7AtxES\",\"4420\",\"static/chunks/4420-baa8329e5076733c.js?dpl=dpl_A9QRwtuL4hrMD2RZGqb9eW7AtxES\",\"2169\",\"static/chunks/2169-1d13735e35f16c75.js?dpl=dpl_A9QRwtuL4hrMD2RZGqb9eW7AtxES\",\"419\",\"static/chunks/419-9f9e6d455ee0ae85.js?dpl=dpl_A9QRwtuL4hrMD2RZGqb9eW7AtxES\",\"5288\",\"static/chunks/5288-5d7819e0848b1b1a.js?dpl=dpl_A9QRwtuL4hrMD2RZGqb9eW7AtxES\",\"6874\",\"static/chunks/6874-67c719d6db2b17af.js?dpl=dpl_A9QRwtuL4hrMD2RZGqb9eW7AtxES\",\"6766\",\"static/chunks/6766-7fcc7eadc8fee52b.js?dpl=dpl_A9QRwtuL4hrMD2RZGqb9eW7AtxES\",\"9435\",\"static/chunks/9435-28f947009b0f7d38.js?dpl=dpl_A9QRwtuL4hrMD2RZGqb9eW7AtxES\",\"2206\",\"static/chunks/2206-42291f248e6bf19d.js?dpl=dpl_A9QRwtuL4hrMD2RZGqb9eW7AtxES\",\"5782\",\"static/chunks/5782-04eaa6c475f5c3f2.js?dpl=dpl_A9QRwtuL4hrMD2RZGqb9eW7AtxES\",\"8419\",\"static/chunks/app/projects/%5Bslug%5D/page-7f8129194c3557a1.js?dpl=dpl_A9QRwtuL4hrMD2RZGqb9eW7AtxES\"],\"default\"]\n"])</script><script>self.__next_f.push([1,"b:[\"$\",\"$L19\",null,{\"project\":{\"id\":\"0b46720c-6a74-4c97-b5c8-051815ce082e\",\"title\":\"Public Equity Investing in Artificial Intelligence\",\"slug\":\"public-equity-investing-in-artificial-intelligence-1-1-1\",\"summary\":{\"type\":\"doc\",\"content\":[{\"type\":\"paragraph\",\"content\":[{\"text\":\"Explore the dynamics of public equity investing in the artificial intelligence (AI) sector by analyzing key technology companies and financial statements, developing critical insights into AI's economic and investment potential.\",\"type\":\"text\"}]}]},\"description\":{\"type\":\"doc\",\"content\":[{\"type\":\"paragraph\",\"content\":[{\"text\":\"Artificial intelligence is transforming industries and markets, making it a hot topic for public equity investors. In this Build Project, you will assume the role of a public equity analyst, focusing on AI technology companies in the semiconductor, software, and internet sectors. You will gain a practical understanding of the tasks entry-level equity analysts perform, by developing skills in fundamental analysis, including business, financial, and qualitative analysis, to determine whether AI stocks represent a long-term growth opportunity or a speculative bubble. The workshops will be interactive with group activities to discuss whether an AI company is a good or bad business, hand-on valuation exercises, and watching videos of what experts have addressed to discuss the current state of AI developments.\",\"type\":\"text\"}]},{\"type\":\"paragraph\",\"content\":[{\"text\":\"By the end of the project, you will have produced a simple stock pitch and prepared for job interviews in the public equity space, with experience tackling the types of questions typically asked in interviews for analyst roles.\",\"type\":\"text\"}]}]},\"project_area\":[\"Finance\"],\"level\":\"Beginner\",\"levelDescription\":\"No prior experience required\",\"prerequisites\":{\"type\":\"doc\",\"content\":[{\"type\":\"paragraph\",\"content\":[{\"text\":\"Develop and present a stock pitch for an AI company, analyzing whether it is a long or short investment opportunity.\",\"type\":\"text\"}]},{\"type\":\"paragraph\",\"content\":[{\"text\":\"You will get to choose  their own company to present.\",\"type\":\"text\"}]},{\"type\":\"paragraph\",\"content\":[{\"text\":\"Produce a stock presentation slide deck detailing the business analysis, financial performance, qualitative assessment, and valuation of a selected AI-focused public company.\",\"type\":\"text\"}]}]},\"goals\":{\"type\":\"doc\",\"content\":[{\"type\":\"paragraph\",\"content\":[{\"text\":\"Learn how to conduct a fundamental equity research project and understand different investing styles.\",\"type\":\"text\"}]},{\"type\":\"paragraph\",\"content\":[{\"text\":\"Analyze financial statements and KPIs of AI-focused public companies.\",\"type\":\"text\"}]},{\"type\":\"paragraph\",\"content\":[{\"text\":\"Conduct qualitative analysis through earnings call reviews and competitive landscape evaluation.\",\"type\":\"text\"}]},{\"type\":\"paragraph\",\"content\":[{\"text\":\"Apply valuation methodologies to assess the investment potential of technology stocks.\",\"type\":\"text\"}]},{\"type\":\"paragraph\",\"content\":[{\"text\":\"Compare AI investment trends with historical bubbles like dot-com and cryptocurrencies.\",\"type\":\"text\"}]}]},\"schedule\":\"Mondays, 7:00 P.M. ET / 4:00 P.M. PT\",\"status\":\"applications_open\",\"duration\":\"8 weeks, 2-3 hours per week\",\"workshops\":{\"sessions\":[{\"name\":\"Overview of public equity investing and careers\",\"order\":1,\"description\":{\"type\":\"doc\",\"content\":[{\"type\":\"paragraph\",\"content\":[{\"text\":\"We will start with introductions to get to know each other. You will then learn the basics of public equity investing, including long-only, long/short, and activist investment strategies. You'll engage in discussions on the career paths available in public equity and what sets public equity roles apart from other investment roles. Lastly, this workshop will also introduce you to the course structure and expectations.\",\"type\":\"text\"}]}]}},{\"name\":\"Business analysis and AI scope\",\"order\":2,\"description\":{\"type\":\"doc\",\"content\":[{\"type\":\"paragraph\",\"content\":[{\"text\":\"You will dive into analyzing businesses by evaluating real-world AI companies through the case study of Nvidia and Microsoft. You will learn about leading AI firms in sectors such as semiconductors and software, identifying key commonalities that make a business strong or weak. This workshop also introduces AI's scope in public markets and explores the companies at the forefront of AI development and commercialization.\",\"type\":\"text\"}]}]}},{\"name\":\"Financial analysis\",\"order\":3,\"description\":{\"type\":\"doc\",\"content\":[{\"type\":\"paragraph\",\"content\":[{\"text\":\"In this workshop, you will study the three core financial statements—Income Statement, Balance Sheet, and Cash Flow Statement—focusing on the critical line items most relevant to technology companies. You will also learn about key performance indicators (KPIs) commonly used in AI and tech sectors, and how alternative data can influence public equity decisions.\",\"type\":\"text\"}]}]}},{\"name\":\"Qualitative and competition analysis\",\"order\":4,\"description\":{\"type\":\"doc\",\"content\":[{\"type\":\"paragraph\",\"content\":[{\"text\":\"You will review and analyze real-world earnings call transcripts for a company you choose for the final project. You will learn how to interpret management commentary, identify signals of competitive positioning, and assess market sentiment.\",\"type\":\"text\"}]}]}},{\"name\":\"Valuation methodologies\",\"order\":5,\"description\":{\"type\":\"doc\",\"content\":[{\"type\":\"paragraph\",\"content\":[{\"text\":\"You will explore valuation methods, including discounted cash flow (DCF) and comparable company analysis (comps), discussing their strengths and limitations. Through practical exercises, you will build valuation models for AI companies, considering the impact of macroeconomic factors on technology stock valuations.\",\"type\":\"text\"}]}]}},{\"name\":\"Is AI a bubble?\",\"order\":6,\"description\":{\"type\":\"doc\",\"content\":[{\"type\":\"paragraph\",\"content\":[{\"text\":\"This workshop will focus on whether AI investing is overhyped, drawing parallels with the dot-com bubble and the crypto boom. You will learn about the technology adoption curve, the hype cycle, and discuss how to identify speculative versus sustainable growth trends in AI.\",\"type\":\"text\"}]}]}},{\"name\":\"Final project preparation\",\"order\":7,\"description\":{\"type\":\"doc\",\"content\":[{\"type\":\"paragraph\",\"content\":[{\"text\":\"You will be guided on how to structure and deliver a compelling stock pitch. You'll receive feedback on your thesis statements, and practice Excel shortcuts and presentation skills, honing your ability to present complex financial analysis in a clear, concise manner. Common mistakes made by first-year analysts will also be covered to help you avoid pitfalls.\",\"type\":\"text\"}]}]}},{\"name\":\"Final presentation - AI stock pitch\",\"order\":8,\"description\":{\"type\":\"doc\",\"content\":[{\"type\":\"paragraph\",\"content\":[{\"text\":\"You will present their final stock pitches, either recommending the AI company as a long or short investment opportunity. You will defend your thesis with data-backed financial analysis, qualitative insights, and competitive landscape evaluations. The workshop will conclude with a group Q\u0026A where your field questions as if presenting to a portfolio manager.\",\"type\":\"text\"}]}]}}]},\"fellows\":[{\"id\":\"e3ec7e23-79ac-45c4-a53e-ae1083c0a797\",\"name\":\"Kyuhyung (Danielle) Kim\",\"role\":\"Finance Fellow\",\"organization\":\"DREAM Venture Labs\",\"organizationLogoUrl\":\"/images/organizations/dv-logo.png\",\"photoUrl\":\"https://avgkrhojcamcagufngrr.supabase.co/storage/v1/object/public/fellow-headshots/e3ec7e23-79ac-45c4-a53e-ae1083c0a797.webp\",\"bio\":\"Danielle Kim is a Build Fellow at Dream Ventures Lab, where she works with students leading projects in finance. \\n Danielle is an analyst at Analog century management, where she focuses on fundamental equity research for long short equity strategies.\\n  \\n Danielle has over 5 years of experience in the public equities investment field. She holds a Bachelor's Degree in Princeton University. \\n \\n A fun fact about Danielle is that she has travelled to more countries than provinces in my home country.\",\"linkedinUrl\":\"www.linkedin.com/in/kyuhyung-danielle-k-15b83212b\"}],\"categories\":[\"Public equity investing\",\"Fundamental and data analysis\",\"Artificial intelligence\",\"Technology sector valuation\"],\"applicationTimeline\":[{\"label\":\"Applications open\",\"value\":\"August 3, 2026\"},{\"label\":\"Applications deadline\",\"value\":\"September 3, 2026\"},{\"label\":\"Application results released\",\"value\":\"Week of September 14, 2026\"},{\"label\":\"Project start date\",\"value\":\"Week of September 28, 2026\"},{\"label\":\"Project end date\",\"value\":\"Week of November 16, 2026\"}],\"cycle_id\":\"6e8885e5-3870-4327-a19c-d88c867fa48f\"},\"error\":\"$undefined\"}]\n"])</script></body></html>
