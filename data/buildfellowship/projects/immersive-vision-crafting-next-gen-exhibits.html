2RZGqb9eW7AtxES\",\"4420\",\"static/chunks/4420-baa8329e5076733c.js?dpl=dpl_A9QRwtuL4hrMD2RZGqb9eW7AtxES\",\"2169\",\"static/chunks/2169-1d13735e35f16c75.js?dpl=dpl_A9QRwtuL4hrMD2RZGqb9eW7AtxES\",\"419\",\"static/chunks/419-9f9e6d455ee0ae85.js?dpl=dpl_A9QRwtuL4hrMD2RZGqb9eW7AtxES\",\"5288\",\"static/chunks/5288-5d7819e0848b1b1a.js?dpl=dpl_A9QRwtuL4hrMD2RZGqb9eW7AtxES\",\"6874\",\"static/chunks/6874-67c719d6db2b17af.js?dpl=dpl_A9QRwtuL4hrMD2RZGqb9eW7AtxES\",\"6766\",\"static/chunks/6766-7fcc7eadc8fee52b.js?dpl=dpl_A9QRwtuL4hrMD2RZGqb9eW7AtxES\",\"9435\",\"static/chunks/9435-28f947009b0f7d38.js?dpl=dpl_A9QRwtuL4hrMD2RZGqb9eW7AtxES\",\"2206\",\"static/chunks/2206-42291f248e6bf19d.js?dpl=dpl_A9QRwtuL4hrMD2RZGqb9eW7AtxES\",\"5782\",\"static/chunks/5782-04eaa6c475f5c3f2.js?dpl=dpl_A9QRwtuL4hrMD2RZGqb9eW7AtxES\",\"8419\",\"static/chunks/app/projects/%5Bslug%5D/page-7f8129194c3557a1.js?dpl=dpl_A9QRwtuL4hrMD2RZGqb9eW7AtxES\"],\"default\"]\n"])</script><script>self.__next_f.push([1,"b:[\"$\",\"$L19\",null,{\"project\":{\"id\":\"da6c62ea-89d4-437b-9daa-561e4934d1e5\",\"title\":\"Immersive Vision: Crafting Next-Gen Exhibits\",\"slug\":\"immersive-vision-crafting-next-gen-exhibits\",\"summary\":{\"type\":\"doc\",\"content\":[{\"type\":\"paragraph\",\"content\":[{\"text\":\"Design a fully immersive exhibition by learning and applying advanced concepts in set design using AI, VR, AR, XR, holograms, and 3D modeling, culminating in a professional final project 2D \u0026 3D concept and implementation.\",\"type\":\"text\"}]}]},\"description\":{\"type\":\"doc\",\"content\":[{\"type\":\"paragraph\",\"content\":[{\"text\":\"This Build Project provides an exciting opportunity to explore the world of immersive exhibition design. You will delve into cutting-edge technologies like Virtual Reality, Augmented reality, Extended Reality, and holograms, combining them with foundational skills in set design and creative concept development. Through hands-on workshops, you will learn how to bring an idea to life: from brainstorming with AI tools to building a 3D model and testing materials and lighting. By the end of the project, you will have gained technical and creative skills critical for entry-level roles in exhibition design, event production, and immersive experiences, fields in high demand in today's technology-driven world.\",\"type\":\"text\"}]}]},\"project_area\":[\"Computer Science\"],\"level\":\"Intermediate\",\"levelDescription\":\"Some experience recommended\",\"prerequisites\":{\"type\":\"doc\",\"content\":[{\"type\":\"paragraph\",\"content\":[{\"text\":\"Brand Strategy and Design – An understanding of branding principles, including typography, color theory, and visual hierarchy, to create a cohesive brand identity.\",\"type\":\"text\"}]},{\"type\":\"paragraph\",\"content\":[{\"text\":\"Art Analysis – The ability to interpret artworks to identify themes and narratives that inform exhibition branding.\",\"type\":\"text\"}]},{\"type\":\"paragraph\",\"content\":[{\"text\":\"Graphic Design Skills – Proficiency in design software like Adobe Illustrator and Photoshop to create logos, posters, and digital assets.\",\"type\":\"text\"}]},{\"type\":\"paragraph\",\"content\":[{\"text\":\"3D Modeling Basics – Foundational knowledge of 3D software (e.g., Blender or SketchUp), including shape creation and interface navigation.\",\"type\":\"text\"}]},{\"type\":\"paragraph\",\"content\":[{\"text\":\"Immersive Technologies Awareness – Familiarity with VR and AR concepts, user experience, and their application in interactive exhibition design.\",\"type\":\"text\"}]}]},\"goals\":{\"type\":\"doc\",\"content\":[{\"type\":\"paragraph\",\"content\":[{\"text\":\"Understand and differentiate between immersive technologies like VR, AR, XR, and holograms used in Exhibitions.\",\"type\":\"text\"}]},{\"type\":\"paragraph\",\"content\":[{\"text\":\"Develop a creative concept for an exhibition using AI tools.\",\"type\":\"text\"}]},{\"type\":\"paragraph\",\"content\":[{\"text\":\"Translate their concept into 3D models and realistic lighting studies.\",\"type\":\"text\"}]},{\"type\":\"paragraph\",\"content\":[{\"text\":\"Manage the transition from design to implementation, including material selection and site management.\",\"type\":\"text\"}]},{\"type\":\"paragraph\",\"content\":[{\"text\":\"Implement and showcase a final immersive exhibition design with sound, lighting, and interactive features.\",\"type\":\"text\"}]}]},\"schedule\":\"Saturdays, 1:00 P.M. ET / 10:00 A.M. PT\",\"status\":\"archived\",\"duration\":\"8 weeks, 2-3 hours per week\",\"workshops\":{\"sessions\":[{\"name\":\"Think of the Concept Like Masters with AI\",\"order\":1,\"description\":{\"type\":\"doc\",\"content\":[{\"type\":\"paragraph\",\"content\":[{\"text\":\"Kick off the project by exploring the evolution of exhibition design and how technology is reshaping creativity. You will use AI tools like MidJourney and Runway to brainstorm and visualize exhibition themes. The session focuses on developing a compelling narrative and concept using interactive activities and visual storytelling.\",\"type\":\"text\"}]}]}},{\"name\":\"Reality, VR, AR, XR, and Hologram Exhibitions\",\"order\":2,\"description\":{\"type\":\"doc\",\"content\":[{\"type\":\"paragraph\",\"content\":[{\"text\":\"Dive into the world of immersive technologies. You will differentiate between VR, AR, XR, and holograms, analyze their use in exhibitions, and explore how these tools elevate audience engagement. A virtual tour of a real immersive exhibit will inspire you to integrate tech into your own concepts.\",\"type\":\"text\"}]}]}},{\"name\":\"Convert Your Concept into a Dynamic 3D Scene\",\"order\":3,\"description\":{\"type\":\"doc\",\"content\":[{\"type\":\"paragraph\",\"content\":[{\"text\":\"Bring ideas to life by learning the basics of 3D modeling. You will translate your exhibition concept into 3D models using Blender or SketchUp, applying spatial design principles. The session includes guided tutorials, modeling exercises, and peer reviews to refine initial designs.\",\"type\":\"text\"}]}]}},{\"name\":\"Materials and Lighting Studies\",\"order\":4,\"description\":{\"type\":\"doc\",\"content\":[{\"type\":\"paragraph\",\"content\":[{\"text\":\"Refine 3D environments by experimenting with materials and lighting. You will learn how to create atmosphere and mood through realistic texturing and lighting using tools like Adobe Substance 3D and DIALux. This workshop enhances your ability to design emotionally engaging spaces.\",\"type\":\"text\"}]}]}},{\"name\":\"Crafting a Compelling Concept Presentation\",\"order\":5,\"description\":{\"type\":\"doc\",\"content\":[{\"type\":\"paragraph\",\"content\":[{\"text\":\"Transform technical work into a compelling visual story. You will compile your design process into a polished presentation using storytelling techniques and design templates. The goal is to communicate your vision clearly and professionally, ready for peer and mentor feedback.\",\"type\":\"text\"}]}]}},{\"name\":\"Bridging Design and Execution – Site Management Essentials\",\"order\":6,\"description\":{\"type\":\"doc\",\"content\":[{\"type\":\"paragraph\",\"content\":[{\"text\":\"Learn how to make ideas real. This workshop covers the transition from digital design to real-world execution, including material sourcing, budgeting, timeline creation, and team coordination. You will use tools like Trello or Asana to create a practical project plan.\",\"type\":\"text\"}]}]}},{\"name\":\"Sound System, Lighting, and Material Testing\",\"order\":7,\"description\":{\"type\":\"doc\",\"content\":[{\"type\":\"paragraph\",\"content\":[{\"text\":\"Integrate multisensory elements into the exhibition design. You will explore how sound systems, lighting, and materials work together to enhance the user experience. Testing procedures and documentation will guide refinements for maximum impact.\",\"type\":\"text\"}]}]}},{\"name\":\"Final Project Implementation\",\"order\":8,\"description\":{\"type\":\"doc\",\"content\":[{\"type\":\"paragraph\",\"content\":[{\"text\":\"Celebrate and present the final immersive exhibitions. You will showcase your work in a professional presentation format, demonstrating the concept, technical execution, and creative process. The session concludes with reflection, feedback, and next steps for future opportunities.\",\"type\":\"text\"}]}]}}]},\"fellows\":[{\"id\":\"b241427d-9199-438e-afc6-86117dea08c3\",\"name\":\"Kariman Almashharawi\",\"role\":\"Design Fellow\",\"organization\":\"Open Avenues Foundation\",\"organizationLogoUrl\":\"/images/organizations/oaf-logo.png\",\"photoUrl\":\"https://avgkrhojcamcagufngrr.supabase.co/storage/v1/object/public/fellow-headshots/b241427d-9199-438e-afc6-86117dea08c3.webp\",\"bio\":\"Kariman Al Mashharawi is a Design Build Fellow at Open Avenues, where she works with students leading projects in Immersive Exhibitions under the theme \\\"Immersive Vision: Crafting Next-Gen Exhibits.\\\"\\n\\nKariman is a Creative Director at SunBox, where she focuses on developing immersive digital experiences, leading creative strategy, and managing multidisciplinary teams to design both virtual and physical exhibition spaces that engage and inspire diverse audiences.\\n\\nShe has over 8 years of experience in the creative media, storytelling, and immersive design field. Her work bridges technology and emotion, with a strong focus on human-centered design and social impact—particularly through projects that support youth and marginalized communities.\\n\\nKariman holds a Bachelor’s degree in Architecture Engineering.\\n\\nA fun fact about Kariman is that she sometimes forgets whether a scene in her memory was a dream or reality — so she recreates it in 3D to figure it out.\",\"linkedinUrl\":\"https://www.linkedin.com/in/kariman-al-mashharawi/\"}],\"categories\":[\"2D \u0026 3D Immersive concept creation\",\"3D Spatial Design \u0026 Modeling\",\"AI-Powered Creative Tools\",\"Exhibition Lighting \u0026 Material Integration\"],\"applicationTimeline\":[{\"label\":\"Applications open\",\"value\":\"July 15, 2025\"},{\"label\":\"Applications deadline\",\"value\":\"August 10, 2025\"},{\"label\":\"Application results released\",\"value\":\"Week of August 25, 2025\"},{\"label\":\"Project start date\",\"value\":\"Week of September 8, 2025\"},{\"label\":\"Project end date\",\"value\":\"Week of October 27, 2025\"}],\"cycle_id\":\"edaee5d1-0a25-4398-8a57-8b642ce5330b\"},\"error\":\"$undefined\"}]\n"])</script></body></html>
