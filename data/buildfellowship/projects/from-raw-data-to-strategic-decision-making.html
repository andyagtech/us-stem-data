"}]},{\"type\":\"paragraph\",\"content\":[{\"text\":\"You’ll work in Python notebooks using industry-standard tools (pandas, NumPy, visualization, basic statistical inference, Linear Regression, Random Forests, and model evaluation). Each week is broken into manageable tasks, with guidance from an experienced data science professional, so you build confidence while practicing how real analytics teams document decisions, compare models, and translate results into a clear, actionable story.\",\"type\":\"text\"}]}]},\"project_area\":[\"Data Science\"],\"level\":\"Intermediate\",\"levelDescription\":\"Some experience recommended\",\"prerequisites\":{\"type\":\"doc\",\"content\":[{\"type\":\"paragraph\",\"content\":[{\"text\":\"Python programming: you should be comfortable writing variables, functions, loops, conditionals, and importing libraries.\",\"type\":\"text\"}]},{\"type\":\"paragraph\",\"content\":[{\"text\":\"Basic data handling: you should understand lists, dictionaries, tables, and the idea of rows and columns in a dataset.\",\"type\":\"text\"}]},{\"type\":\"paragraph\",\"content\":[{\"text\":\"Basic math and statistics: you should be familiar with mean, variance, distributions, correlation, and simple probability concepts.\",\"type\":\"text\"}]},{\"type\":\"paragraph\",\"content\":[{\"text\":\"Notebook workflow: you should be able to run code cells in Jupyter Notebook or a similar Python environment.\",\"type\":\"text\"}]},{\"type\":\"paragraph\",\"content\":[{\"text\":\"Visual interpretation: you should be comfortable reading basic charts such as histograms, scatterplots, and line plots.\",\"type\":\"text\"}]}]},\"goals\":{\"type\":\"doc\",\"content\":[{\"type\":\"paragraph\",\"content\":[{\"text\":\"Clean and preprocess messy real-world datasets using Python, pandas, and NumPy.\",\"type\":\"text\"}]},{\"type\":\"paragraph\",\"content\":[{\"text\":\"Explore data and create useful visualizations with matplotlib and seaborn.\",\"type\":\"text\"}]},{\"type\":\"paragraph\",\"content\":[{\"text\":\"Use statistical inference to test simple hypotheses and explain uncertainty in practical terms.\",\"type\":\"text\"}]},{\"type\":\"paragraph\",\"content\":[{\"text\":\"Build and evaluate supervised learning models, including Linear Regression and Random Forests, with scikit-learn.\",\"type\":\"text\"}]},{\"type\":\"paragraph\",\"content\":[{\"text\":\"Communicate technical findings through a concise notebook, report, and final presentation.\",\"type\":\"text\"}]}]},\"schedule\":\"Tuesdays, 5:00 P.M. ET / 2:00 P.M. PT\",\"status\":\"active\",\"duration\":\"8 weeks, 2-3 hours per week\",\"workshops\":{\"sessions\":[{\"name\":\"Orient and Set Up\",\"order\":1,\"description\":{\"type\":\"doc\",\"content\":[{\"type\":\"paragraph\",\"content\":[{\"text\":\"You will meet the group, review the final deliverable, understand the data science workflow, and set up Python, Jupyter Notebook, and key libraries.\",\"type\":\"text\"}]}]}},{\"name\":\"Clean and Explore\",\"order\":2,\"description\":{\"type\":\"doc\",\"content\":[{\"type\":\"paragraph\",\"content\":[{\"text\":\"You will clean a messy dataset, handle missing values and duplicates, create summary statistics, and produce first visualizations.\",\"type\":\"text\"}]}]}},{\"name\":\"Detect Anomalies\",\"order\":3,\"description\":{\"type\":\"doc\",\"content\":[{\"type\":\"paragraph\",\"content\":[{\"text\":\"You will identify outliers using Z-scores, IQR rules, and visual checks, then decide how those anomalies should be handled.\",\"type\":\"text\"}]}]}},{\"name\":\"Test a Claim\",\"order\":4,\"description\":{\"type\":\"doc\",\"content\":[{\"type\":\"paragraph\",\"content\":[{\"text\":\"You will turn a dataset question into a hypothesis test, compute uncertainty, and explain what the results mean in plain language.\",\"type\":\"text\"}]}]}},{\"name\":\"Build Baseline Models\",\"order\":5,\"description\":{\"type\":\"doc\",\"content\":[{\"type\":\"paragraph\",\"content\":[{\"text\":\"You will split data into training and testing sets, build simple supervised learning models, and evaluate their performance.\",\"type\":\"text\"}]}]}},{\"name\":\"Interpret Regression\",\"order\":6,\"description\":{\"type\":\"doc\",\"content\":[{\"type\":\"paragraph\",\"content\":[{\"text\":\"You will fit a Linear Regression model, interpret coefficients, examine residuals, and connect model output to the original question.\",\"type\":\"text\"}]}]}},{\"name\":\"Compare Random Forests\",\"order\":7,\"description\":{\"type\":\"doc\",\"content\":[{\"type\":\"paragraph\",\"content\":[{\"text\":\"You will train a Random Forest model, tune key parameters, compare it to regression, and choose the stronger model for your final story.\",\"type\":\"text\"}]}]}},{\"name\":\"Present the Project\",\"order\":8,\"description\":{\"type\":\"doc\",\"content\":[{\"type\":\"paragraph\",\"content\":[{\"text\":\"You will present your full case study, receive feedback, and reflect on how the project connects to entry-level data science work.\",\"type\":\"text\"}]}]}}]},\"fellows\":[{\"id\":\"c4290d03-be23-4ca7-92cf-dd21caf7cbee\",\"name\":\"Cagin Yunus\",\"role\":\"Data Scientist Fellow\",\"organization\":\"Open Avenues Foundation\",\"organizationLogoUrl\":\"/images/organizations/oaf-logo.png\",\"photoUrl\":\"https://avgkrhojcamcagufngrr.supabase.co/storage/v1/object/public/fellow-headshots/c4290d03-be23-4ca7-92cf-dd21caf7cbee.webp\",\"bio\":\"Cha is a Data Science Global Talent Fellow at Open Avenues, where he works with students leading projects in Data Science\\n\\nCha is a Quantitative Strategist at Virtu Financial, where he focuses on developing quantitative trading strategies.\\n\\nCha has 2  years of experience in the Data Science field. Before joining Virtu Financial he was a Quantitative Researcher at Balyasny Asset Management.\\n\\nHe holds a PhD in Physics, Statistics and Data Science from Massachusetts Institute of Technology.\\n\\nA fun fact about Cha is that he has loves to go for impossible shots in tennis.\",\"linkedinUrl\":\"https://www.linkedin.com/in/cagin-yunus/\"}],\"categories\":[\"Data Cleaning\",\"Statistical Inference\",\"Machine Learning\",\"Predictive Modeling\"],\"applicationTimeline\":[{\"label\":\"Applications open\",\"value\":\"May 11, 2026\"},{\"label\":\"Applications deadline\",\"value\":\"June 11, 2026\"},{\"label\":\"Application results released\",\"value\":\"Week of June 22, 2026\"},{\"label\":\"Project start date\",\"value\":\"Week of July 6, 2026\"},{\"label\":\"Project end date\",\"value\":\"Week of August 24, 2026\"}],\"cycle_id\":\"04780f7f-10bb-4b43-8480-8ef15da1b3cc\"},\"error\":\"$undefined\"}]\n"])</script></body></html>
