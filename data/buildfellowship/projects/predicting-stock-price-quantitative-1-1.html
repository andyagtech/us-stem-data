xES\",\"4420\",\"static/chunks/4420-baa8329e5076733c.js?dpl=dpl_A9QRwtuL4hrMD2RZGqb9eW7AtxES\",\"2169\",\"static/chunks/2169-1d13735e35f16c75.js?dpl=dpl_A9QRwtuL4hrMD2RZGqb9eW7AtxES\",\"419\",\"static/chunks/419-9f9e6d455ee0ae85.js?dpl=dpl_A9QRwtuL4hrMD2RZGqb9eW7AtxES\",\"5288\",\"static/chunks/5288-5d7819e0848b1b1a.js?dpl=dpl_A9QRwtuL4hrMD2RZGqb9eW7AtxES\",\"6874\",\"static/chunks/6874-67c719d6db2b17af.js?dpl=dpl_A9QRwtuL4hrMD2RZGqb9eW7AtxES\",\"6766\",\"static/chunks/6766-7fcc7eadc8fee52b.js?dpl=dpl_A9QRwtuL4hrMD2RZGqb9eW7AtxES\",\"9435\",\"static/chunks/9435-28f947009b0f7d38.js?dpl=dpl_A9QRwtuL4hrMD2RZGqb9eW7AtxES\",\"2206\",\"static/chunks/2206-42291f248e6bf19d.js?dpl=dpl_A9QRwtuL4hrMD2RZGqb9eW7AtxES\",\"5782\",\"static/chunks/5782-04eaa6c475f5c3f2.js?dpl=dpl_A9QRwtuL4hrMD2RZGqb9eW7AtxES\",\"8419\",\"static/chunks/app/projects/%5Bslug%5D/page-7f8129194c3557a1.js?dpl=dpl_A9QRwtuL4hrMD2RZGqb9eW7AtxES\"],\"default\"]\n"])</script><script>self.__next_f.push([1,"b:[\"$\",\"$L19\",null,{\"project\":{\"id\":\"a0ec6afe-2a7e-44e3-8966-e89d657cac5d\",\"title\":\"Design and Launch a Quantitative Stock Prediction Pipeline\",\"slug\":\"predicting-stock-price-quantitative-1-1\",\"summary\":{\"type\":\"doc\",\"content\":[{\"type\":\"paragraph\",\"content\":[{\"text\":\"Transform raw financial datasets into actionable insights using Python, ending with a shareable notebook that demonstrates modeling, evaluation, and portfolio risk analysis.\",\"type\":\"text\"}]}]},\"description\":{\"type\":\"doc\",\"content\":[{\"type\":\"paragraph\",\"content\":[{\"text\":\"What about let’s start to solve some real-world finance problems using computer science and math? Quantitative finance might sound unfamiliar to you, but in this Build Project, you’ll have an end-to-end experience of the quantitative investment process – using Python to do data mining and data cleaning, applying keyword detection statistical algorithms on earnings call data, implementing a linear regression model to generate stock price prediction, and building your own portfolio with risk control. By the end of the 8-weeks project, you will develop a published online notebook with code and text that includes a full pipeline of building up a portfolio in a quantitative way.\",\"type\":\"text\"}]}]},\"project_area\":[\"Data Science\",\"Finance\"],\"level\":\"Expert\",\"levelDescription\":\"Advanced experience required\",\"prerequisites\":{\"type\":\"doc\",\"content\":[{\"type\":\"paragraph\",\"content\":[{\"text\":\"Proficiency in python programming including using Numpy for data processing, using data structures like dictionary/dataframe to store processed regression features, using Scipy to build up a linear regression framework, and generating risk plots / reports via MatPlotLib.\",\"type\":\"text\"}]},{\"type\":\"paragraph\",\"content\":[{\"text\":\"Deep understanding of financial concepts such as volume and earnings call. This needs to be detail oriented such as understanding the difference between minutely volume and daily volume, and how the distribution of volume of stocks with different capital look like intraday, and how volume is correlated with price. For earnings calls, you need to know the key words for an earnings call (e.g beat expectation, below expectation) and understand the financial meaning of those key words and why they will affect stock price.\",\"type\":\"text\"}]},{\"type\":\"paragraph\",\"content\":[{\"text\":\"Full understanding of the logic and implementation of feature engineering and linear regression.\",\"type\":\"text\"}]},{\"type\":\"paragraph\",\"content\":[{\"text\":\"Ability to use the Python MatPlotLib package to build up visualizations for your portfolio. This will involve how to do multiple line plots in python, how to implement labeling and legends and how to structure the graphs so your research results could be easily digested by senior management from financial firms who might not have context of the research process.\",\"type\":\"text\"}]}]},\"goals\":{\"type\":\"doc\",\"content\":[{\"type\":\"paragraph\",\"content\":[{\"text\":\"Understand what quantitative investment is, why it is different from traditional investment, and how modern technologies like Python coding can help qualitative analysis.\",\"type\":\"text\"}]},{\"type\":\"paragraph\",\"content\":[{\"text\":\"Learn coding skills in Python for data mining, including how to process large excel/csv programmatically.\",\"type\":\"text\"}]},{\"type\":\"paragraph\",\"content\":[{\"text\":\"Apply statistical algorithms such as term-frequency-inverse-document-frequency to extract keywords from long paragraphs.\",\"type\":\"text\"}]},{\"type\":\"paragraph\",\"content\":[{\"text\":\"Implement an end-to-end stock price prediction model using linear regression in Python, with understanding of hyper parameter tuning, overfitting detection and accuracy measurement.\",\"type\":\"text\"}]},{\"type\":\"paragraph\",\"content\":[{\"text\":\"Build a portfolio based on stock prediction and measure the risk and sharpe ratio of your quantitative strategy.\",\"type\":\"text\"}]}]},\"schedule\":\"Fridays, 6:00 P.M. ET / 3:00 P.M. PT\",\"status\":\"archived\",\"duration\":\"8 weeks, 2-3 hours per week\",\"workshops\":{\"sessions\":[{\"name\":\"Introduction\",\"order\":1,\"description\":{\"type\":\"doc\",\"content\":[{\"type\":\"paragraph\",\"content\":[{\"text\":\"Get to know the Build Fellow and other students, learn about definition of quantitative finance, setup a python IDE and able to execute read csv function.\",\"type\":\"text\"}]}]}},{\"name\":\"Market Data mining and cleaning\",\"order\":2,\"description\":{\"type\":\"doc\",\"content\":[{\"type\":\"paragraph\",\"content\":[{\"text\":\"Understand why we need to clean data and what types of dirty data are. Use python and built-in package Feature Engine to clean a dataset provided by project leader.\",\"type\":\"text\"}]}]}},{\"name\":\"Earnings Call Data processing\",\"order\":3,\"description\":{\"type\":\"doc\",\"content\":[{\"type\":\"paragraph\",\"content\":[{\"text\":\"Understand what is earning call and why companies need to disclose their earnings. Use python to parse earning call data and extract key words that will affect the company’s stock price.\",\"type\":\"text\"}]}]}},{\"name\":\"Build Qualitative Term\",\"order\":4,\"description\":{\"type\":\"doc\",\"content\":[{\"type\":\"paragraph\",\"content\":[{\"text\":\"Understand what a finance Term is. Understand why Term is important in quantitative finance. Use Python to transform data collected from workshop 2 and 3 to create Terms.\",\"type\":\"text\"}]}]}},{\"name\":\"Linear Regression model using Terms (Part I, Training)\",\"order\":5,\"description\":{\"type\":\"doc\",\"content\":[{\"type\":\"paragraph\",\"content\":[{\"text\":\"Understand what linear regression is and why linear regression is powerful in quantiative finance industry. Learn the training process of a linear regression model.\",\"type\":\"text\"}]}]}},{\"name\":\"Linear Regression model using Terms (Part II, Inference, accuracy testing)\",\"order\":6,\"description\":{\"type\":\"doc\",\"content\":[{\"type\":\"paragraph\",\"content\":[{\"text\":\"Use python to do linear regression model inference. Looking at your price prediction, why is it accurate/inaccurate? How to measure accuracy? How can you improve the model?\",\"type\":\"text\"}]}]}},{\"name\":\"Portfolio construction and visualization\",\"order\":7,\"description\":{\"type\":\"doc\",\"content\":[{\"type\":\"paragraph\",\"content\":[{\"text\":\"In quantitative finance industry, presentation skills are important. Learn how to use matplotlib in python to generate plots to present your prediction results. Prepare the PowerPoint for final presentation.\",\"type\":\"text\"}]}]}},{\"name\":\"Presentation and feedback\",\"order\":8,\"description\":{\"type\":\"doc\",\"content\":[{\"type\":\"paragraph\",\"content\":[{\"text\":\"In quantitative finance industry, presentation skills are important. Learn how to use matplotlib in python to generate plots to present your prediction results. Prepare the PowerPoint for final presentation.\",\"type\":\"text\"}]}]}}]},\"fellows\":[{\"id\":\"535a75f5-e2b7-461a-b69f-b9a67cb7e6b3\",\"name\":\"Yue \\\"Mike\\\" Yao\",\"role\":\"Finance Fellow\",\"organization\":\"Open Avenues Foundation\",\"organizationLogoUrl\":\"/images/organizations/oaf-logo.png\",\"photoUrl\":\"https://avgkrhojcamcagufngrr.supabase.co/storage/v1/object/public/fellow-headshots/535a75f5-e2b7-461a-b69f-b9a67cb7e6b3.webp\",\"bio\":\"\\\"Mike is a Quantitative Finance Build Fellow at Open Avenues, where he works with students leading projects in quantitative finance.\\n\\nMike is a quantitative research analyst at Citadel, where he focuses on portfolio construction, portfolio optimization and data visualization.\\n\\nMike has over 4 years of experience in the quantitative finance field. He interned at Bank of America in 2018 as a software engineer and interned at Citadel in 2019 as a quantitative research engineer.\\n\\nHe holds a bachelor degree of science in computer science.\\n\\nA fun fact about Mike is that he knows to play 4 different kinds of musical instruments.\\\"\",\"linkedinUrl\":\"https://www.linkedin.com/in/yue-yao-50b97aa3/en\"}],\"categories\":[\"Statistical modeling\",\"Data mining\",\"Linear regression\",\"Python\"],\"applicationTimeline\":[{\"label\":\"Applications open\",\"value\":\"April 13, 2026\"},{\"label\":\"Applications deadline\",\"value\":\"May 20, 2026\"},{\"label\":\"Application results released\",\"value\":\"Week of May 26, 2026\"},{\"label\":\"Project start date\",\"value\":\"Week of June 8, 2026\"},{\"label\":\"Project end date\",\"value\":\"Week of July 27, 2026\"}],\"cycle_id\":\"ae26a648-44bc-4fab-bbb0-7f9c0f6b18d9\"},\"error\":\"$undefined\"}]\n"])</script></body></html>
