7e111b509a4.js?dpl=dpl_A9QRwtuL4hrMD2RZGqb9eW7AtxES\",\"4420\",\"static/chunks/4420-baa8329e5076733c.js?dpl=dpl_A9QRwtuL4hrMD2RZGqb9eW7AtxES\",\"2169\",\"static/chunks/2169-1d13735e35f16c75.js?dpl=dpl_A9QRwtuL4hrMD2RZGqb9eW7AtxES\",\"419\",\"static/chunks/419-9f9e6d455ee0ae85.js?dpl=dpl_A9QRwtuL4hrMD2RZGqb9eW7AtxES\",\"5288\",\"static/chunks/5288-5d7819e0848b1b1a.js?dpl=dpl_A9QRwtuL4hrMD2RZGqb9eW7AtxES\",\"6874\",\"static/chunks/6874-67c719d6db2b17af.js?dpl=dpl_A9QRwtuL4hrMD2RZGqb9eW7AtxES\",\"6766\",\"static/chunks/6766-7fcc7eadc8fee52b.js?dpl=dpl_A9QRwtuL4hrMD2RZGqb9eW7AtxES\",\"9435\",\"static/chunks/9435-28f947009b0f7d38.js?dpl=dpl_A9QRwtuL4hrMD2RZGqb9eW7AtxES\",\"2206\",\"static/chunks/2206-42291f248e6bf19d.js?dpl=dpl_A9QRwtuL4hrMD2RZGqb9eW7AtxES\",\"5782\",\"static/chunks/5782-04eaa6c475f5c3f2.js?dpl=dpl_A9QRwtuL4hrMD2RZGqb9eW7AtxES\",\"8419\",\"static/chunks/app/projects/%5Bslug%5D/page-7f8129194c3557a1.js?dpl=dpl_A9QRwtuL4hrMD2RZGqb9eW7AtxES\"],\"default\"]\n1a:T5e4,Web application vulnerabilities are among the most common and persistent security issues across modern software systems, and identifying them is a core responsibility in many entry-level cybersecurity and application security roles. In this Build Project, you will step into the role of a junior security analyst and actively analyze and document real-world web vulnerabilities by performing hands-on exploitation and risk assessment. Under the guidance of an experienced industry professional, you will work with intentionally vulnerable web applications to intercept traffic, manipulate inputs, construct proof-of-concept attacks, and clearly document how and why these weaknesses can be abused. Throughout the project, you will apply industry-standard tools and techniques such as Burp "])</script><script>self.__next_f.push([1,"Suite, browser developer tools, HTTP request analysis, and payload crafting to explore vulnerabilities including SQL injection, cross-site scripting, authentication flaws, Cross-Site Request Forgery, path traversal, and insecure Cross-Origin Resource Sharing configurations. All work will take place in a structured environment that mirrors the workflow of a real-world web security or penetration testing team, emphasizing professional documentation, ethical testing practices, and clear communication of security findings.\n\n🚨 This is a project exclusive for CCSF Cybersecurity students who are eligible for a stipend upon completion. For more information about this, please contact Steve Nelson at snelson@ccsf.edu"])</script><script>self.__next_f.push([1,"b:[\"$\",\"$L19\",null,{\"project\":{\"id\":\"12be9de8-2bd9-42b9-b011-5f1a51223b01\",\"title\":\"Web Security 101: Find and Secure Common Vulnerabilities\",\"slug\":\"web-security-101-find-and-secure-common-vulnerabilities\",\"summary\":{\"type\":\"doc\",\"content\":[{\"type\":\"paragraph\",\"content\":[{\"text\":\"Explore and exploit real-world web vulnerabilities through hands-on labs, learning how attackers break applications and how to defend them.\",\"type\":\"text\"}]}]},\"description\":{\"type\":\"doc\",\"content\":[{\"type\":\"paragraph\",\"content\":[{\"text\":\"$1a\",\"type\":\"text\"}]}]},\"project_area\":[\"Computer Science\"],\"level\":\"Intermediate\",\"levelDescription\":\"Some experience recommended\",\"prerequisites\":{\"type\":\"doc\",\"content\":[{\"type\":\"paragraph\",\"content\":[{\"text\":\"HTTP Concepts: Ability to describe and explain the concepts of requests, responses, parameters, and  cookies.\",\"type\":\"text\"}]},{\"type\":\"paragraph\",\"content\":[{\"text\":\"Web Browser Developer Tools: Ability to use the Network tab for inspecting web traffic (HTTP requests/responses) and the Console for debugging and interacting with scripts (e.g., logging variables, running simple JavaScript).\",\"type\":\"text\"}]},{\"type\":\"paragraph\",\"content\":[{\"text\":\"HTML \u0026 URLs: Knowledge of how data is transmitted via forms, parameters, and links.\",\"type\":\"text\"}]},{\"type\":\"paragraph\",\"content\":[{\"text\":\"SQL Fundamentals: Familiarity with basic database commands (e.g., SELECT, FROM, WHERE) to understand SQL Injection vulnerabilities.\",\"type\":\"text\"}]},{\"type\":\"paragraph\",\"content\":[{\"text\":\"Web Markup (HTML/JavaScript): Understanding how HTML renders content and how JavaScript executes within the browser (essential for comprehending XSS attacks).\",\"type\":\"text\"}]}]},\"goals\":{\"type\":\"doc\",\"content\":[{\"type\":\"paragraph\",\"content\":[{\"text\":\"Identify and exploit common web vulnerabilities such as SQL Injection, Authentication flaws, Path Traversal, Cross-Site Scripting (XSS), CSRF, and CORS misconfigurations.\",\"type\":\"text\"}]},{\"type\":\"paragraph\",\"content\":[{\"text\":\"Explore industry-standard tools including Burp Suite, browser developer tools, and basic scripting to analyze traffic, craft payloads, and test for security weaknesses.\",\"type\":\"text\"}]},{\"type\":\"paragraph\",\"content\":[{\"text\":\"Examine the browser security model (cookies, sessions, same-origin policy) and how attackers bypass it.\",\"type\":\"text\"}]},{\"type\":\"paragraph\",\"content\":[{\"text\":\"Propose and justify secure coding practices and configurations that prevent each vulnerability type.\",\"type\":\"text\"}]},{\"type\":\"paragraph\",\"content\":[{\"text\":\"Role-play and model the professional documenting strategies of an entry-level security analyst or penetration tester.\",\"type\":\"text\"}]}]},\"schedule\":\"Tuesdays, 6:00 P.M. ET / 3:00 P.M. PT\",\"status\":\"archived\",\"duration\":\"8 weeks, 2-3 hours per week\",\"workshops\":{\"sessions\":[{\"name\":\"Introduction, Web Security Foundations \u0026 Burp Suite Setup\",\"order\":1,\"description\":{\"type\":\"doc\",\"content\":[{\"type\":\"paragraph\",\"content\":[{\"text\":\"Who are we? What are our career interests? What does web security contain? What will our project look like? Get ready to start exploiting!\",\"type\":\"text\"}]}]}},{\"name\":\"SQL Injection\",\"order\":2,\"description\":{\"type\":\"doc\",\"content\":[{\"type\":\"paragraph\",\"content\":[{\"text\":\"Ready to hack a database? Learn how malicious input steals data and master the code fix that prevents the #1 web attack. Prevent SQLi attacks!\",\"type\":\"text\"}]}]}},{\"name\":\"Authentication\",\"order\":3,\"description\":{\"type\":\"doc\",\"content\":[{\"type\":\"paragraph\",\"content\":[{\"text\":\"What is the difference between who you are and what you can do? Exploit login flaws using session hacking and learn how to build unbreakable identity checks.\",\"type\":\"text\"}]}]}},{\"name\":\"Path Traversal\",\"order\":4,\"description\":{\"type\":\"doc\",\"content\":[{\"type\":\"paragraph\",\"content\":[{\"text\":\"Want to read the server's private files? Learn how directory sequence injection lets you bypass restrictions and see data you shouldn't!\",\"type\":\"text\"}]}]}},{\"name\":\"Cross-Site Scripting (XSS)\",\"order\":5,\"description\":{\"type\":\"doc\",\"content\":[{\"type\":\"paragraph\",\"content\":[{\"text\":\"Ready to pop an alert box? Master XSS to execute code in other users' browsers and learn about some defense strategies.\",\"type\":\"text\"}]}]}},{\"name\":\"Cross-Site Request Forgery (CSRF)\",\"order\":6,\"description\":{\"type\":\"doc\",\"content\":[{\"type\":\"paragraph\",\"content\":[{\"text\":\"How can a harmless image on one site make you change your password on another? Unmask CSRF and learn to exploit these vulnerabilities.\",\"type\":\"text\"}]}]}},{\"name\":\"Cross-Origin Resource Sharing (CORS)\",\"order\":7,\"description\":{\"type\":\"doc\",\"content\":[{\"type\":\"paragraph\",\"content\":[{\"text\":\"CORS is a complex defense. Learn how a simple server misconfiguration can expose user data to any website.\",\"type\":\"text\"}]}]}},{\"name\":\"Security Presentation \u0026 Course Wrap-Up\",\"order\":8,\"description\":{\"type\":\"doc\",\"content\":[{\"type\":\"paragraph\",\"content\":[{\"text\":\"Ready for your security debut? Deliver your professional vulnerability debrief and map your new skills to a career in cybersecurity.\",\"type\":\"text\"}]}]}}]},\"fellows\":[{\"id\":\"8e3f5189-1c22-4d6e-a9ca-dc8d6099e8ac\",\"name\":\"Saloni Shivdasani\",\"role\":\"Cybersecurity Fellow\",\"organization\":\"DREAM Venture Labs\",\"organizationLogoUrl\":\"/images/organizations/dv-logo.png\",\"photoUrl\":\"https://avgkrhojcamcagufngrr.supabase.co/storage/v1/object/public/fellow-headshots/8e3f5189-1c22-4d6e-a9ca-dc8d6099e8ac.webp\",\"bio\":\"Saloni is a Cybersecurity Build Fellow at Dream Venture Labs, where she works with students leading projects in web development security.\\n\\nSaloni is a software consultant at Zeal IT Consultants, where she focuses on designing and implementing scalable data engineering solutions, including building data pipelines, migrating enterprise data systems, and enabling analytics through tools like Snowflake, SQL, Datastage, and Looker.\\n\\nSaloni has over 5 years of experience in the software engineering field. She has worked across full-stack development, data engineering, and cloud-based systems, delivering high-impact solutions for enterprise clients in healthcare and finance. Her experience includes building mobile and web applications, improving system reliability and performance, and automating workflows to significantly reduce manual effort.\\n\\nShe holds a Masters of Science in Computer Science.\\n\\nA fun fact about Saloni is that she collects legos.\",\"linkedinUrl\":\"https://linkedin.com/in/saloni-s/\"}],\"categories\":[\"Web Application Security\",\"Vulnerability Analysis\",\"Offensive Security\",\"Defensive Coding\"],\"applicationTimeline\":[{\"label\":\"Applications open\",\"value\":\"April 13, 2026\"},{\"label\":\"Applications deadline\",\"value\":\"May 20, 2026\"},{\"label\":\"Application results released\",\"value\":\"Week of May 26, 2026\"},{\"label\":\"Project start date\",\"value\":\"Week of June 8, 2026\"},{\"label\":\"Project end date\",\"value\":\"Week of July 27, 2026\"}],\"cycle_id\":\"ae26a648-44bc-4fab-bbb0-7f9c0f6b18d9\"},\"error\":\"$undefined\"}]\n"])</script></body></html>
