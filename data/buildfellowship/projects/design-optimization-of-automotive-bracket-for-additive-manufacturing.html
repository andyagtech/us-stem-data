,\"277\",\"static/chunks/54a60aa6-294bb7e111b509a4.js?dpl=dpl_A9QRwtuL4hrMD2RZGqb9eW7AtxES\",\"4420\",\"static/chunks/4420-baa8329e5076733c.js?dpl=dpl_A9QRwtuL4hrMD2RZGqb9eW7AtxES\",\"2169\",\"static/chunks/2169-1d13735e35f16c75.js?dpl=dpl_A9QRwtuL4hrMD2RZGqb9eW7AtxES\",\"419\",\"static/chunks/419-9f9e6d455ee0ae85.js?dpl=dpl_A9QRwtuL4hrMD2RZGqb9eW7AtxES\",\"5288\",\"static/chunks/5288-5d7819e0848b1b1a.js?dpl=dpl_A9QRwtuL4hrMD2RZGqb9eW7AtxES\",\"6874\",\"static/chunks/6874-67c719d6db2b17af.js?dpl=dpl_A9QRwtuL4hrMD2RZGqb9eW7AtxES\",\"6766\",\"static/chunks/6766-7fcc7eadc8fee52b.js?dpl=dpl_A9QRwtuL4hrMD2RZGqb9eW7AtxES\",\"9435\",\"static/chunks/9435-28f947009b0f7d38.js?dpl=dpl_A9QRwtuL4hrMD2RZGqb9eW7AtxES\",\"2206\",\"static/chunks/2206-42291f248e6bf19d.js?dpl=dpl_A9QRwtuL4hrMD2RZGqb9eW7AtxES\",\"5782\",\"static/chunks/5782-04eaa6c475f5c3f2.js?dpl=dpl_A9QRwtuL4hrMD2RZGqb9eW7AtxES\",\"8419\",\"static/chunks/app/projects/%5Bslug%5D/page-7f8129194c3557a1.js?dpl=dpl_A9QRwtuL4hrMD2RZGqb9eW7AtxES\"],\"default\"]\n"])</script><script>self.__next_f.push([1,"b:[\"$\",\"$L19\",null,{\"project\":{\"id\":\"be5d8003-e0bd-48ec-abcb-ef8d33e66b02\",\"title\":\"Design Optimization of Automotive Bracket for Additive Manufacturing\",\"slug\":\"design-optimization-of-automotive-bracket-for-additive-manufacturing\",\"summary\":{\"type\":\"doc\",\"content\":[{\"type\":\"paragraph\",\"content\":[{\"text\":\"Optimize an automotive bracket using topology optimization and latticing for additive manufacturing.\",\"type\":\"text\"}]}]},\"description\":{\"type\":\"doc\",\"content\":[{\"type\":\"paragraph\",\"content\":[{\"text\":\"Optimize an automotive bracket using topology optimization and latticing for additive manufacturing.\",\"type\":\"text\"}]}]},\"project_area\":[\"Engineering\"],\"level\":\"Expert\",\"levelDescription\":\"Advanced experience required\",\"prerequisites\":{\"type\":\"doc\",\"content\":[{\"type\":\"paragraph\",\"content\":[{\"text\":\"Computer-Aided Design (CAD): Prior coursework or experience in Computer-Aided Design (CAD) tools such as SolidWorks, Autodesk Fusion, or nTop. Ability to create, modify, and analyze 3D models and assemblies. \",\"type\":\"text\"}]},{\"type\":\"paragraph\",\"content\":[{\"text\":\"Fundamental Mechanics: Knowledge from courses such as Statics, Dynamics, and Mechanics of Materials. Familiarity with concepts like force equilibrium, stress, strain, and material properties. \",\"type\":\"text\"}]},{\"type\":\"paragraph\",\"content\":[{\"text\":\"Static Structural Analysis: Experience with Finite Element Analysis (FEA) such as Ansys, Abaqus or similar methods to evaluate the structural integrity of designs. Ability to interpret analysis results to make informed design decisions. \",\"type\":\"text\"}]},{\"type\":\"paragraph\",\"content\":[{\"text\":\"Report Writing and Presentation Skills: Proficiency in using Microsoft Word or similar software to create detailed project reports. Ability to document design processes, analysis results, and conclusions clearly and concisely.\",\"type\":\"text\"}]}]},\"goals\":{\"type\":\"doc\",\"content\":[{\"type\":\"paragraph\",\"content\":[{\"text\":\"Latticing and Topology Optimization: Develop proficiency in using advanced computational design tools such as nTop for light-weighting. You will gain hands-on experience in topology optimization and lattice structure generation within the software. \",\"type\":\"text\"}]},{\"type\":\"paragraph\",\"content\":[{\"text\":\"FEA Simulation: Develop the ability to integrate your knowledge of mechanical principles, including material properties, structural analysis, and load conditions, with computational design techniques. You will apply static structural analysis to validate their computational design results, ensuring that their lightweight designs meet the required structural performance criteria. \",\"type\":\"text\"}]},{\"type\":\"paragraph\",\"content\":[{\"text\":\"Parameter Sweep/ Design of Experiments: Learn how parameter optimization and DOE techniques are employed in the automotive industry to select optimal lattice parameters for lightweight design. Through this process, students will develop skills in experimental design, data analysis, and optimization specific to automotive light-weighting applications. \",\"type\":\"text\"}]},{\"type\":\"paragraph\",\"content\":[{\"text\":\"Design for Additive Manufacturing: Understand additive manufacturing processes and their implications for lightweight design. You will learn about the capabilities and limitations of additive manufacturing techniques such as selective laser sintering (SLS) or fused deposition modeling (FDM) and how these processes influence design considerations. \",\"type\":\"text\"}]},{\"type\":\"paragraph\",\"content\":[{\"text\":\"Project Management: Develop project management and documentation skills. You will learn to plan and organize your workflow, manage project timelines and resources effectively, and document your design iterations, analysis results, and final recommendations in a comprehensive project report.\",\"type\":\"text\"}]}]},\"schedule\":\"Mondays, 5:00 P.M. ET / 2:00 P.M. PT\",\"status\":\"archived\",\"duration\":\"8 weeks, 2-3 hours per week\",\"workshops\":{\"sessions\":[{\"name\":\"Introduction to Design for Additive Manufacturing (DfAM) and Implicit Modelling\",\"order\":1,\"description\":{\"type\":\"doc\",\"content\":[{\"type\":\"paragraph\",\"content\":[{\"text\":\"Fundamentals of DfAM and Implicit Modelling. You will explore the nTop software's user interface and features, gaining familiarity with the software they will use throughout the course. \",\"type\":\"text\"}]}]}},{\"name\":\"Shelling and Intro to Latticing\",\"order\":2,\"description\":{\"type\":\"doc\",\"content\":[{\"type\":\"paragraph\",\"content\":[{\"text\":\"Learn concepts of variable shelling and basic latticing. You will learn how to apply these techniques to reduce material usage while maintaining structural integrity.\",\"type\":\"text\"}]}]}},{\"name\":\"Advanced Latticing Techniques\",\"order\":3,\"description\":{\"type\":\"doc\",\"content\":[{\"type\":\"paragraph\",\"content\":[{\"text\":\"You will learn Advanced latticing techniques and their applications. You will work on applying these techniques to a more complex model and vary the lattice parameters using a scalar field to improve the structural integrity, enhancing their understanding of lightweight design. \",\"type\":\"text\"}]}]}},{\"name\":\"Static Analysis\",\"order\":4,\"description\":{\"type\":\"doc\",\"content\":[{\"type\":\"paragraph\",\"content\":[{\"text\":\"You will learn how to perform static structural analysis on their models to ensure structural integrity based on different loading conditions.\",\"type\":\"text\"}]}]}},{\"name\":\"DOE for Lattice Parameters\",\"order\":5,\"description\":{\"type\":\"doc\",\"content\":[{\"type\":\"paragraph\",\"content\":[{\"text\":\"Learn the principles of DOE and how to apply them to optimize lattice parameters. You will set up a workflow, test various parameters, and analyze the results to identify the best configurations. \",\"type\":\"text\"}]}]}},{\"name\":\"Topology Optimization\",\"order\":6,\"description\":{\"type\":\"doc\",\"content\":[{\"type\":\"paragraph\",\"content\":[{\"text\":\"Introduction to the basics of topology optimization. They will learn how to set up and run topology optimization in nTop and analyze the results based on different optimization constraints to improve your designs.\",\"type\":\"text\"}]}]}},{\"name\":\"Integrating Latticing and Topology Optimization\",\"order\":7,\"description\":{\"type\":\"doc\",\"content\":[{\"type\":\"paragraph\",\"content\":[{\"text\":\"You will integrate their knowledge of latticing and topology optimization to create highly optimized designs. You will fine-tune their models and evaluate the combined impact on structural integrity and weight savings.\",\"type\":\"text\"}]}]}},{\"name\":\"Finalize and Present the Lightweight Project\",\"order\":8,\"description\":{\"type\":\"doc\",\"content\":[{\"type\":\"paragraph\",\"content\":[{\"text\":\"You will integrate their knowledge of latticing and topology optimization to create highly optimized designs. You will fine-tune their models and evaluate the combined impact on structural integrity and weight savings.\",\"type\":\"text\"}]}]}}]},\"fellows\":[{\"id\":\"e31026a8-a7bb-41be-83dd-ea32827f0a31\",\"name\":\"Ajay Prasad\",\"role\":\"Mechanical Engineering Fellow\",\"organization\":\"Open Avenues Foundation\",\"organizationLogoUrl\":\"/images/organizations/oaf-logo.png\",\"photoUrl\":\"https://avgkrhojcamcagufngrr.supabase.co/storage/v1/object/public/fellow-headshots/e31026a8-a7bb-41be-83dd-ea32827f0a31.webp\",\"bio\":\"Ajay Prasad is employed at a cutting-edge mechanical design software company, contributing to the development of next-generation design tools.\\n\\nWith a master's degree in mechanical engineering, Ajay Prasad brings a robust educational background and practical expertise to the table. During their undergraduate studies, he distinguished himself by participating in prestigious international competitions such as NASA Cansat and the European Rover Challenge.\\n\\nWith four years of professional experience, Ajay Prasad has developed a comprehensive skill set in mechanical engineering and design.\\n\\nA fun fact: Ajay has tried donuts in every state he has visited in the US.\",\"linkedinUrl\":\"\"}],\"categories\":[\"Additive Manufacturing\",\"Latticing\",\"Topology Optimization\",\"Optimization\",\"FEA\",\"Mechanical Design\",\"Computational Design\",\"DfAM\"],\"applicationTimeline\":[{\"label\":\"Applications open\",\"value\":\"May 9, 2025\"},{\"label\":\"Applications deadline\",\"value\":\"June 8, 2025\"},{\"label\":\"Application results released\",\"value\":\"Week of June 23, 2025\"},{\"label\":\"Project start date\",\"value\":\"Week of July 7, 2025\"},{\"label\":\"Project end date\",\"value\":\"Week of August 25, 2025\"}],\"cycle_id\":\"77065a20-2032-46f1-b3cf-d435314c7011\"},\"error\":\"$undefined\"}]\n"])</script></body></html>
