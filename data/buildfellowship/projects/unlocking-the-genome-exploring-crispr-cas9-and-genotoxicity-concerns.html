tional approaches to analyze genomic data and understand disease mechanisms at a molecular level. \n\nThrough this comprehensive exploration, this Build Project seeks to equip you with a deep understanding of the complexities and potentials of gene editing technologies in healthcare and biotechnology. You will produce a report about the evolution and current state of gene editing techniques, including a historical overview of gene therapy. It will also cover the mechanisms of genomic instability and off-target effects resulting from gene editing, providing insights into their implications for therapeutic safety and efficacy."])</script><script>self.__next_f.push([1,"b:[\"$\",\"$L19\",null,{\"project\":{\"id\":\"433c26d7-b3a7-4386-b0a1-9ee2075406ff\",\"title\":\"Unlocking the Genome: Exploring CRISPR-Cas9 and Genotoxicity Concerns\",\"slug\":\"unlocking-the-genome-exploring-crispr-cas9-and-genotoxicity-concerns\",\"summary\":{\"type\":\"doc\",\"content\":[{\"type\":\"paragraph\",\"content\":[{\"text\":\"Exploring Gene Therapy and Genome Editing Technologies with a Focus on CRISPR-Cas9 Mechanism, Ethical Considerations, and Genotoxicity Studies.\",\"type\":\"text\"}]}]},\"description\":{\"type\":\"doc\",\"content\":[{\"type\":\"paragraph\",\"content\":[{\"text\":\"$1a\",\"type\":\"text\"}]}]},\"project_area\":[\"Biology \u0026 Healthcare\"],\"level\":\"Intermediate\",\"levelDescription\":\"Some experience recommended\",\"prerequisites\":{\"type\":\"doc\",\"content\":[{\"type\":\"paragraph\",\"content\":[{\"text\":\"A Basic understanding of Gene Editing Techniques: Knowledge of how gene editing tools like CRISPR/Cas9 and TALENs work at a basic level, including the concept of targeted DNA modifications. \",\"type\":\"text\"}]},{\"type\":\"paragraph\",\"content\":[{\"text\":\"Familiarity with the significance of gene therapy, its purpose, and basic history, including key milestones such as the first gene therapy trials. \",\"type\":\"text\"}]},{\"type\":\"paragraph\",\"content\":[{\"text\":\"A Basic understanding of the principles of genomic stability and instability, including basic concepts of DNA structure, function, and repair mechanisms. \",\"type\":\"text\"}]},{\"type\":\"paragraph\",\"content\":[{\"text\":\"Familiarity with the basic purpose and function of bioinformatics tools, such as sequence alignment and variant calling. \",\"type\":\"text\"}]},{\"type\":\"paragraph\",\"content\":[{\"text\":\"Basic ability to navigate and use tools like CRISPResso2 for analyzing sequencing data and UCSC Genome Browser for visualizing genomic data. \",\"type\":\"text\"}]}]},\"goals\":{\"type\":\"doc\",\"content\":[{\"type\":\"paragraph\",\"content\":[{\"text\":\"Understand current gene editing techniques with an overview of the evolution and history of gene therapy.\",\"type\":\"text\"}]},{\"type\":\"paragraph\",\"content\":[{\"text\":\"Understand genomic instability and off-target mediated effects that occur as a result of gene editing.\",\"type\":\"text\"}]},{\"type\":\"paragraph\",\"content\":[{\"text\":\"Use Bioinformatics as an efficient tool to understand disease modalities.\",\"type\":\"text\"}]}]},\"schedule\":\"Thursdays, 6:00 P.M. ET / 3:00 P.M. PT\",\"status\":\"archived\",\"duration\":\"8 weeks, 2-3 hours per week\",\"workshops\":{\"sessions\":[{\"name\":\"Introduction and History of Gene Therapy\",\"order\":1,\"description\":{\"type\":\"doc\",\"content\":[{\"type\":\"paragraph\",\"content\":[{\"text\":\"Provide an overview of the course and introduce the history and evolution of gene therapy.\",\"type\":\"text\"}]}]}},{\"name\":\"Current Gene Editing Techniques – Part 1\",\"order\":2,\"description\":{\"type\":\"doc\",\"content\":[{\"type\":\"paragraph\",\"content\":[{\"text\":\"Introduce current gene editing technologies and their applications.\",\"type\":\"text\"}]}]}},{\"name\":\"Current Gene Editing Techniques – Part\",\"order\":3,\"description\":{\"type\":\"doc\",\"content\":[{\"type\":\"paragraph\",\"content\":[{\"text\":\"Deepen understanding of gene editing technologies and introduce practical applications.\",\"type\":\"text\"}]}]}},{\"name\":\"Off-Target Effects and Their Consequences\",\"order\":4,\"description\":{\"type\":\"doc\",\"content\":[{\"type\":\"paragraph\",\"content\":[{\"text\":\"Understand off-target effects in gene editing and their implications.\",\"type\":\"text\"}]}]}},{\"name\":\"On-Target Effects and Efficacy\",\"order\":5,\"description\":{\"type\":\"doc\",\"content\":[{\"type\":\"paragraph\",\"content\":[{\"text\":\"Explore on-target effects and their importance in gene editing.\",\"type\":\"text\"}]}]}},{\"name\":\"Genotoxicity and Safety Concerns\",\"order\":6,\"description\":{\"type\":\"doc\",\"content\":[{\"type\":\"paragraph\",\"content\":[{\"text\":\"Investigate the genotoxicity and safety concerns associated with gene editing.\",\"type\":\"text\"}]}]}},{\"name\":\"Ethical Considerations in Gene Editing\",\"order\":7,\"description\":{\"type\":\"doc\",\"content\":[{\"type\":\"paragraph\",\"content\":[{\"text\":\"Examine the ethical implications of gene editing technologies.\",\"type\":\"text\"}]}]}},{\"name\":\"Gene Editing – An overview\",\"order\":8,\"description\":{\"type\":\"doc\",\"content\":[{\"type\":\"paragraph\",\"content\":[{\"text\":\"Integrate knowledge and present findings on gene editing topics.\",\"type\":\"text\"}]}]}}]},\"fellows\":[{\"id\":\"9c90d7d4-bc68-4472-a1eb-bdc05e6fa8ec\",\"name\":\"Lavanya Venkatesan\",\"role\":\"Molecular Biology Fellow\",\"organization\":\"Open Avenues Foundation\",\"organizationLogoUrl\":\"/images/organizations/oaf-logo.png\",\"photoUrl\":\"https://avgkrhojcamcagufngrr.supabase.co/storage/v1/object/public/fellow-headshots/9c90d7d4-bc68-4472-a1eb-bdc05e6fa8ec.webp\",\"bio\":\"Throughout my life, I've realized that answering a question can sometimes take years of learning and understanding. From childhood queries about food and energy to finally comprehending the Krebs Cycle in high school, I've found immens
