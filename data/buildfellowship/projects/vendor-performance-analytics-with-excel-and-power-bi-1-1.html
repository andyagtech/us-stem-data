 \n\nHe holds an MBA from the University of North Texas G. Brint Ryan College of Business, a Fullstack Software Development Certificate from Emerging Digital Academy, and a B.A. in Biochemistry from Concordia College.  \n\nA fun fact about Clever: he loves hiking and has a goal to visit all the U.S. national parks."])</script><script>self.__next_f.push([1,"b:[\"$\",\"$L19\",null,{\"project\":{\"id\":\"9661153e-7922-47ed-bc68-e7a6aaca7b66\",\"title\":\"Vendor Performance Analytics with Excel and Power BI\",\"slug\":\"vendor-performance-analytics-with-excel-and-power-bi-1-1\",\"summary\":{\"type\":\"doc\",\"content\":[{\"type\":\"paragraph\",\"content\":[{\"text\":\"Use Excel and Power BI to turn quarterly sales data into simple, clear visuals to help with making decisions.\",\"type\":\"text\"}]}]},\"description\":{\"type\":\"doc\",\"content\":[{\"type\":\"paragraph\",\"content\":[{\"text\":\"Ready to help a tech reseller figure out how its vendors are doing? Use Excel and Power BI to turn quarterly sales data into simple, clear visuals. No experience needed—just a curiosity about how businesses use data to make decisions!\",\"type\":\"text\"}]},{\"type\":\"paragraph\",\"content\":[{\"text\":\"Tech resellers work with vendors to sell products like gadgets or software, but keeping track of who’s selling what can be a puzzle. In this Build Project, you’ll step into the role of a junior analyst for a fictional reseller. Starting with a spreadsheet, you’ll clean it up, add up the numbers, and create a dashboard to show which vendors are shining and which need a boost. Using Excel, you’ll tidy up quarterly sales and margin data, then use Power BI to make visuals that answer questions like “Which vendor is growing?” or “Where are profits slipping?” By the end, you’ll have a dashboard that could help a manager make smarter calls and proven skills that can kickstart your data analyst career!\",\"type\":\"text\"}]}]},\"project_area\":[\"Business\"],\"level\":\"Beginner\",\"levelDescription\":\"No prior experience required\",\"prerequisites\":{\"type\":\"doc\",\"content\":[{\"type\":\"paragraph\",\"content\":[{\"text\":\"Basic Excel skills (e.g., adding numbers, sorting a list).\",\"type\":\"text\"}]},{\"type\":\"paragraph\",\"content\":[{\"text\":\"Interest in how businesses track performance (no prior Power BI knowledge required).\",\"type\":\"text\"}]},{\"type\":\"paragraph\",\"content\":[{\"text\":\"Willingness to learn through hands-on practice.\",\"type\":\"text\"}]}]},\"goals\":{\"type\":\"doc\",\"content\":[{\"type\":\"paragraph\",\"content\":[{\"text\":\"Clean and organize vendor sales data in Excel. Calculate basic totals (like sales or margins) using Excel formulas. Create visuals in Power BI to show vendor performance over time. Share a simple idea about each vendor based on the data.\",\"type\":\"text\"}]},{\"type\":\"paragraph\",\"content\":[{\"text\":\"Calculate basic totals (like sales or margins) using Excel formulas.\",\"type\":\"text\"}]},{\"type\":\"paragraph\",\"content\":[{\"text\":\"Create visuals in Power BI to show vendor performance over time.\",\"type\":\"text\"}]},{\"type\":\"paragraph\",\"content\":[{\"text\":\"Share a simple idea about each vendor based on the data.\",\"type\":\"text\"}]}]},\"schedule\":\"Thursdays, 7:00 P.M. ET / 4:00 P.M. PT\",\"status\":\"archived\",\"duration\":\"8 weeks, 2-3 hours per week\",\"workshops\":{\"sessions\":[{\"name\":\"Kickoff with Excel\",\"order\":1,\"description\":{\"type\":\"doc\",\"content\":[{\"type\":\"paragraph\",\"content\":[{\"text\":\"Meet the team, learn why data matters, and start with Excel. Intro to the project and Excel basics—students load a sample dataset. \",\"type\":\"text\"}]}]}},{\"name\":\"Clean Up and Crunch Numbers in Excel\",\"order\":2,\"description\":{\"type\":\"doc\",\"content\":[{\"type\":\"paragraph\",\"content\":[{\"text\":\"Clean up vendor data so it’s ready to use. Remove blanks and errors in the vendor dataset. Use SUM and AVERAGE to summarize data. Add up sales and margins in Excel to see the big picture.\",\"type\":\"text\"}]}]}},{\"name\":\"Jump to Power BI\",\"order\":3,\"description\":{\"type\":\"doc\",\"content\":[{\"type\":\"paragraph\",\"content\":[{\"text\":\"Bring your data to Power BI and make your first chart. \",\"type\":\"text\"}]}]}},{\"name\":\"Add Visuals to Tell the Vendor Story\",\"order\":4,\"description\":{\"type\":\"doc\",\"content\":[{\"type\":\"paragraph\",\"content\":[{\"text\":\"Add visuals like a line graph for trends. Add more visuals to tell the vendor story.\",\"type\":\"text\"}]}]}},{\"name\":\"Build Your Dashboard\",\"order\":5,\"description\":{\"type\":\"doc\",\"content\":[{\"type\":\"paragraph\",\"content\":[{\"text\":\"Put it all together in a dashboard. Arrange visuals into one view with filters.\",\"type\":\"text\"}]}]}},{\"name\":\"Receive \u0026 Integrate Feedback\",\"order\":6,\"description\":{\"type\":\"doc\",\"content\":[{\"type\":\"paragraph\",\"content\":[{\"text\":\"Pick key findings and develop a 1-page report prior to this workshop (an example report will be provided for reference). Receive feedback directly from the Fellow to improve your final deliverable.\",\"type\":\"text\"}]}]}},{\"name\":\"Present Your Findings\",\"order\":7,\"description\":{\"type\":\"doc\",\"content\":[{\"type\":\"paragraph\",\"content\":[{\"text\":\"Share your dashboard with the group—show what you’ve learned!\",\"type\":\"text\"}]}]}},{\"name\":\"Career Planning \u0026 Reflection\",\"order\":8,\"description\":{\"type\":\"doc\",\"content\":[{\"type\":\"paragraph\",\"content\":[{\"text\":\"This session offers directed career consultation and planning, as well as an opportunity to reflect on the project experience. \",\"type\":\"text\"}]}]}}]},\"fellows\":[{\"id\":\"e750fd2b-f7d4-48e4-80b1-22696db58044\",\"name\":\"Clever Mukori\",\"role\":\"Business Intelligence Fellow\",\"organization\":\"DREAM Venture Labs\",\"organizationLogoUrl\":\"/images/organizations/dv-logo.png\",\"photoUr
