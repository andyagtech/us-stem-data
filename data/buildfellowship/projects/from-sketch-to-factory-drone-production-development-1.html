509a4.js?dpl=dpl_A9QRwtuL4hrMD2RZGqb9eW7AtxES\",\"4420\",\"static/chunks/4420-baa8329e5076733c.js?dpl=dpl_A9QRwtuL4hrMD2RZGqb9eW7AtxES\",\"2169\",\"static/chunks/2169-1d13735e35f16c75.js?dpl=dpl_A9QRwtuL4hrMD2RZGqb9eW7AtxES\",\"419\",\"static/chunks/419-9f9e6d455ee0ae85.js?dpl=dpl_A9QRwtuL4hrMD2RZGqb9eW7AtxES\",\"5288\",\"static/chunks/5288-5d7819e0848b1b1a.js?dpl=dpl_A9QRwtuL4hrMD2RZGqb9eW7AtxES\",\"6874\",\"static/chunks/6874-67c719d6db2b17af.js?dpl=dpl_A9QRwtuL4hrMD2RZGqb9eW7AtxES\",\"6766\",\"static/chunks/6766-7fcc7eadc8fee52b.js?dpl=dpl_A9QRwtuL4hrMD2RZGqb9eW7AtxES\",\"9435\",\"static/chunks/9435-28f947009b0f7d38.js?dpl=dpl_A9QRwtuL4hrMD2RZGqb9eW7AtxES\",\"2206\",\"static/chunks/2206-42291f248e6bf19d.js?dpl=dpl_A9QRwtuL4hrMD2RZGqb9eW7AtxES\",\"5782\",\"static/chunks/5782-04eaa6c475f5c3f2.js?dpl=dpl_A9QRwtuL4hrMD2RZGqb9eW7AtxES\",\"8419\",\"static/chunks/app/projects/%5Bslug%5D/page-7f8129194c3557a1.js?dpl=dpl_A9QRwtuL4hrMD2RZGqb9eW7AtxES\"],\"default\"]\n"])</script><script>self.__next_f.push([1,"b:[\"$\",\"$L19\",null,{\"project\":{\"id\":\"a4de551a-b4ea-4a2a-9484-fbc5fb474b0c\",\"title\":\"From Sketch to Factory: Heavy-Lift Drone Development\",\"slug\":\"from-sketch-to-factory-drone-production-development-1\",\"summary\":{\"type\":\"doc\",\"content\":[{\"type\":\"paragraph\",\"content\":[{\"text\":\"Develop a production-ready, high-strength, lightweight structural frame for a heavy-lift drone using parametric CAD workflows to automate design iterations, optimize for manufacturing (DFM), and ensure flight reliability.\",\"type\":\"text\"}]}]},\"description\":{\"type\":\"doc\",\"content\":[{\"type\":\"paragraph\",\"content\":[{\"text\":\"Most modern high-tech devices, are far too complex and time-consuming to be designed or manufactured by a single individual. Luckily, the industry leverages the power of teamwork, where every engineer acts as a vital part of a larger, coordinated machine.\",\"type\":\"text\"}]},{\"type\":\"paragraph\",\"content\":[{\"text\":\"In this Build Project, you will step into the role of the Lead Mechanical Engineer within a simulated R\u0026D team developing a heavy-lift autonomous delivery drone. While other specialized teams handle the flight electronics and software, you will own the structural integrity and manufacturing strategy of the Drone Arm Architecture.\",\"type\":\"text\"}]},{\"type\":\"paragraph\",\"content\":[{\"text\":\"The transition from conceptual 3D modeling to production-ready parts requires a deep understanding of parametric architecture, machine elements, material selection, and manufacturing constraints - skills that are essential across nearly all mechanical engineering specializations. In this professional environment, you will learn to justify your engineering decisions using simple calculations, tolerance stack-ups, and Design for Manufacturing (DFM) principles rather than \\\"out-of-the-blue\\\" modeling.\",\"type\":\"text\"}]},{\"type\":\"paragraph\",\"content\":[{\"text\":\"You will master industrial methodologies such as Top-Down Design in Fusion 360 and explore diverse manufacturing methods like additive manufacturing and CNC machining. This project environment is designed to simulate the operations of a real-world R\u0026D lab, providing you with a safe space to ask questions, learn from mistakes, and build the confidence needed to thrive in a professional STEM workspace.\",\"type\":\"text\"}]}]},\"project_area\":[\"Engineering\"],\"level\":\"Intermediate\",\"levelDescription\":\"Some experience recommended\",\"prerequisites\":{\"type\":\"doc\",\"content\":[{\"type\":\"paragraph\",\"content\":[{\"text\":\"Basic 3D CAD Proficiency: You should be comfortable navigating a 3D CAD environment (Fusion 360, SolidWorks, or similar). Specifically, you need to know how to create 2D sketches, fully constrain them and perform base operations like extrudes, revolves, and fillets. Note: If you have not used CAD software before, we provide weekly 30-minute refresher videos and training materials to help you catch up, but you must be willing to invest extra effort to master these fundamentals alongside the project work.\",\"type\":\"text\"}]},{\"type\":\"paragraph\",\"content\":[{\"text\":\"Basic Mechanical Physics: You don’t need to be an expert in complex math, but you should have a basic intuition for how objects react to force and understand why parts fail. You should be able to understand the difference between stress and strain, basic material properties, and intuitively grasp how forces transfer through a load path. If you have completed a standard \\\"Mechanics of Materials\\\" course, you are well-prepared.\",\"type\":\"text\"}]},{\"type\":\"paragraph\",\"content\":[{\"text\":\"3D Visualization \u0026 \\\"Blueprint\\\" Basics: You need to be able to visualize how 2D sketches translate into 3D volumes and vice versa. You need the ability to read and generate basic 2D orthographic projections (Top, Front, Side views) to clearly communicate your design intent to a manufacturer.\",\"type\":\"text\"}]},{\"type\":\"paragraph\",\"content\":[{\"text\":\"An Engineering Problem-Solver Mindset: You need the willingness to prioritize function over form. You should be prepared to iterate your designs based on calculation and physical requirements rather than aesthetic preference alone and be ready to adopt a structured design methodology.\",\"type\":\"text\"}]}]},\"goals\":{\"type\":\"doc\",\"content\":[{\"type\":\"paragraph\",\"content\":[{\"text\":\"Build stable, fully parametric CAD models for a heavy-lift drone arm assembly, using key dimensions (such as propeller clearance and arm length) so the design can be updated easily without breaking.\",\"type\":\"text\"}]},{\"type\":\"paragraph\",\"content\":[{\"text\":\"Create and manage multiple design versions from a single CAD model to handle different payload requirements or use cases efficiently.\",\"type\":\"text\"}]},{\"type\":\"paragraph\",\"content\":[{\"text\":\"Support your design decisions using basic mechanical calculations (such as motor thrust loads, bolt shear strength, and propeller tip clearance) to ensure your parts are safe, functional, and manufacturable.\",\"type\":\"text\"}]},{\"type\":\"paragraph\",\"content\":[{\"text\":\"Deliver a professional Technical Data Package that includes a 3D model, exploded views, and clear manufacturing drawings using basic GD\u0026T to show how parts fit and function together.\",\"type\":\"text\"}]}]},\"schedule\":\"Mondays, 5:00 P.M. ET / 2:00 P.M. PT\",\"status\":\"applications_open\",\"duration\":\"8 weeks, 2-3 hours per week\",\"workshops\":{\"sessions\":[{\"name\":\"Systems Thinking: Heavy-Lift Drone Project Kickoff \u0026 Lead Mechanical Engineer Role.\",\"order\":1,\"description\":{\"type\":\"doc\",\"content\":[{\"type\":\"paragraph\",\"content\":[{\"text\":\"You will step into the professional role, defining the engineering team dynamic and unpacking the product architecture to establish the project's functional foundation.\",\"type\":\"text\"}]}]}},{\"name\":\"Parametric Architecture: Building \\\"Flexible\\\" CAD.\",\"order\":2,\"description\":{\"type\":\"doc\",\"content\":[{\"type\":\"paragraph\",\"content\":[{\"text\":\"Moving beyond \\\"Direct Modeling,\\\" you will learn to build \\\"smart\\\" models where the arm length is a function of the propeller diameter, ensuring the assembly never \\\"breaks\\\" during updates.\",\"type\":\"text\"}]}]}},{\"name\":\"Machine Elements: Fasteners, Press-fits, and Vibrations.\",\"order\":3,\"description\":{\"type\":\"doc\",\"content\":[{\"type\":\"paragraph\",\"content\":[{\"text\":\"You will transition to engineering logic, using \\\"Napkin Math\\\" to size hardware and model the critical connection between the drone arm and the central chassis.\",\"type\":\"text\"}]}]}},{\"name\":\"DFM (Additive): Rapid Prototyping Constraints.\",\"order\":4,\"description\":{\"type\":\"doc\",\"content\":[{\"type\":\"paragraph\",\"content\":[{\"text\":\"An introduction to Design for Manufacturing (DFM) where you will optimize your design for FDM 3D printing, focusing on orientation and support structures.\",\"type\":\"text\"}]}]}},{\"name\":\"DFM (Subtractive): CNC Machining and Tool Access.\",\"order\":5,\"description\":{\"type\":\"doc\",\"content\":[{\"type\":\"paragraph\",\"content\":[{\"text\":\"You will adapt your parametric model for CNC milling, learning to manage tool radii and \\\"dog-bones\\\" to ensure the part is manufacturable in metal.\",\"type\":\"text\"}]}]}},{\"name\":\"The Design Review: Simulating an Industry \\\"Gate Review.\\\"\",\"order\":6,\"description\":{\"type\":\"doc\",\"content\":[{\"type\":\"paragraph\",\"content\":[{\"text\":\"A mid-project review where you will present your DFM justifications. A \\\"Real-World Curveball\\\" (like a payload change) tests the stability of your parametric setup.\",\"type\":\"text\"}]}]}},{\"name\":\"DFM Optimization \u0026 Technical Documentation.\",\"order\":7,\"description\":{\"type\":\"doc\",\"content\":[{\"type\":\"paragraph\",\"content\":[{\"text\":\"Refining the design for mass production. You will finalize your \\\"Technical Data Package,\\\" creating 2D manufacturing drawings with basic GD\u0026T.\",\"type\":\"text\"}]}]}},{\"name\":\"Portfolio Finale: Delivering the Technical Data Package.\",\"order\":8,\"description\":{\"type\":\"doc\",\"content\":[{\"type\":\"paragraph\",\"content\":[{\"text\":\"Final submission of the full professional package. You will present your \\\"flex\\\" and DFM improvements to gain a \\\"Hiring Manager\\\" perspective.\",\"type\":\"text\"}]}]}}]},\"fellows\":[{\"id\":\"f4af855e-f57c-4524-b889-066ca9a1d95e\",\"name\":\"Jerome Pascal Schmidiger\",\"role\":\"Mechanical Engineering Fellow\",\"organization\":\"Open Avenues Foundation\",\"organizationLogoUrl\":\"/images/organizations/oaf-logo.png\",\"photoUrl\":\"https://avgkrhojcamcagufngrr.supabase.co/storage/v1/object/public/fellow-headshots/f4af855e-f57c-4524-b889-066ca9a1d95e.webp\",\"bio\":\"Jerome is a Global Talent Fellow at Open Avenues Foundation, where he mentors students leading projects in engineering and product design.\\n\\nJerome is a Senior Mechanical Engineer and founding team member at SUTOL Bio, Inc. His role spans first-principles ideation and system architecture through experimental validation and translation into scalable, manufacturable medical devices used in clinical trials.\\n\\nJerome has over 4 years of experience in the mechanical engineering field, spanning early-stage research, product development, and fully automated medical device manufacturing.\\n\\nHe holds an MSc in Mechanical Engineering from ETH Zurich.\",\"linkedinUrl\":\"https://www.linkedin.com/in/jerome-schmidiger-b3b310210/\"}],\"categories\":[\"Fusion 360\",\"Parametric Modeling\",\"DFMA\",\"Stress Strain Analysis\",\"CAD\",\"Manufacturing\"],\"applicationTimeline\":[{\"label\":\"Applications open\",\"value\":\"August 3, 2026\"},{\"label\":\"Applications deadline\",\"value\":\"September 3, 2026\"},{\"label\":\"Application results released\",\"value\":\"Week of September 14, 2026\"},{\"label\":\"Project start date\",\"value\":\"Week of September 28, 2026\"},{\"label\":\"Project end date\",\"value\":\"Week of November 16, 2026\"}],\"cycle_id\":\"6e8885e5-3870-4327-a19c-d88c867fa48f\"},\"error\":\"$undefined\"}]\n"])</script></body></html>
