nks/54a60aa6-294bb7e111b509a4.js?dpl=dpl_A9QRwtuL4hrMD2RZGqb9eW7AtxES\",\"4420\",\"static/chunks/4420-baa8329e5076733c.js?dpl=dpl_A9QRwtuL4hrMD2RZGqb9eW7AtxES\",\"2169\",\"static/chunks/2169-1d13735e35f16c75.js?dpl=dpl_A9QRwtuL4hrMD2RZGqb9eW7AtxES\",\"419\",\"static/chunks/419-9f9e6d455ee0ae85.js?dpl=dpl_A9QRwtuL4hrMD2RZGqb9eW7AtxES\",\"5288\",\"static/chunks/5288-5d7819e0848b1b1a.js?dpl=dpl_A9QRwtuL4hrMD2RZGqb9eW7AtxES\",\"6874\",\"static/chunks/6874-67c719d6db2b17af.js?dpl=dpl_A9QRwtuL4hrMD2RZGqb9eW7AtxES\",\"6766\",\"static/chunks/6766-7fcc7eadc8fee52b.js?dpl=dpl_A9QRwtuL4hrMD2RZGqb9eW7AtxES\",\"9435\",\"static/chunks/9435-28f947009b0f7d38.js?dpl=dpl_A9QRwtuL4hrMD2RZGqb9eW7AtxES\",\"2206\",\"static/chunks/2206-42291f248e6bf19d.js?dpl=dpl_A9QRwtuL4hrMD2RZGqb9eW7AtxES\",\"5782\",\"static/chunks/5782-04eaa6c475f5c3f2.js?dpl=dpl_A9QRwtuL4hrMD2RZGqb9eW7AtxES\",\"8419\",\"static/chunks/app/projects/%5Bslug%5D/page-7f8129194c3557a1.js?dpl=dpl_A9QRwtuL4hrMD2RZGqb9eW7AtxES\"],\"default\"]\n"])</script><script>self.__next_f.push([1,"b:[\"$\",\"$L19\",null,{\"project\":{\"id\":\"99786c54-6a54-43c8-a3e5-f00d091cfefe\",\"title\":\"Develop a Risk Management Plan for a Mid-Size Company\",\"slug\":\"develop-a-risk-management-plan-for-a-mid-size-company-1-1-1-1\",\"summary\":{\"type\":\"doc\",\"content\":[{\"type\":\"paragraph\",\"content\":[{\"text\":\"Understand the operations and business exposures to provide business financial risk management solutions using the Risk Management Process.\",\"type\":\"text\"}]}]},\"description\":{\"type\":\"doc\",\"content\":[{\"type\":\"paragraph\",\"content\":[{\"text\":\"All enterprises, from small to large, must identify and manage their risk to ensure their survival and meet their goals. In this build project you'll wear the hat of a risk manager and develop a risk management assessment. Under the supervision of an experienced industry expert, you’ll quantify risk and perform financial and risk modeling. You will become familiar with the risk transfer mechanism, important regulations that apply to business, and financial forecasting. All this will happen in an environment that simulates the risk management team of an organization. \",\"type\":\"text\"}]}]},\"project_area\":[\"Business\",\"Finance\"],\"level\":\"Beginner\",\"levelDescription\":\"No prior experience required\",\"prerequisites\":{\"type\":\"doc\",\"content\":[{\"type\":\"paragraph\",\"content\":[{\"text\":\"Basic mathematical skills: you should know how to solve algebraic equations.\",\"type\":\"text\"}]},{\"type\":\"paragraph\",\"content\":[{\"text\":\"You should understand basic financial and accounting principles like the GAAP principles, relevant ratios and their meaning, and the main components of the income statement.\",\"type\":\"text\"}]},{\"type\":\"paragraph\",\"content\":[{\"text\":\"Good data collection, validation and data analysis aptitude: you should be able to understand what information within a data set is relevant based on the issue you are seeking to identify or resolve.\",\"type\":\"text\"}]},{\"type\":\"paragraph\",\"content\":[{\"text\":\"Basic knowledge of Excel: you should be able to sort data, create a pivot table, and use formulas like VLOOKUP.\",\"type\":\"text\"}]}]},\"goals\":{\"type\":\"doc\",\"content\":[{\"type\":\"paragraph\",\"content\":[{\"text\":\"Use Excel to manage organize and analyze large sets of data.\",\"type\":\"text\"}]},{\"type\":\"paragraph\",\"content\":[{\"text\":\"Understand the risk management process and risk treatments (retention, avoidance, mitigation and transfer).\",\"type\":\"text\"}]},{\"type\":\"paragraph\",\"content\":[{\"text\":\"Learn about the financial statements and how to use them to determine the health of an organization.\",\"type\":\"text\"}]}]},\"schedule\":\"Saturdays, 10:00 A.M. ET / 7:00 A.M. PT\",\"status\":\"applications_open\",\"duration\":\"8 weeks, 2-3 hours per week\",\"workshops\":{\"sessions\":[{\"name\":\"Introductions\",\"order\":1,\"description\":{\"type\":\"doc\",\"content\":[{\"type\":\"paragraph\",\"content\":[{\"text\":\"Get to know the Build Fellow and other students, ask questions about the project requirements, prepare your workspace.\",\"type\":\"text\"}]}]}},{\"name\":\"Risk Identification\",\"order\":2,\"description\":{\"type\":\"doc\",\"content\":[{\"type\":\"paragraph\",\"content\":[{\"text\":\"Identify risks and exposures based on case narrative.\",\"type\":\"text\"}]}]}},{\"name\":\"Risk Measurment\",\"order\":3,\"description\":{\"type\":\"doc\",\"content\":[{\"type\":\"paragraph\",\"content\":[{\"text\":\"Measure risk and exposures, develop a heat map, assign a risk measurement to each risk.\",\"type\":\"text\"}]}]}},{\"name\":\"Risk Treatment\",\"order\":4,\"description\":{\"type\":\"doc\",\"content\":[{\"type\":\"paragraph\",\"content\":[{\"text\":\"Assign a risk treatment technique to the identified risks.\",\"type\":\"text\"}]}]}},{\"name\":\"Risk Tolerance\",\"order\":5,\"description\":{\"type\":\"doc\",\"content\":[{\"type\":\"paragraph\",\"content\":[{\"text\":\"Study the company financial statements and create a ratio worksheet using Microsoft Excel.\",\"type\":\"text\"}]}]}},{\"name\":\"Loss Triangulation\",\"order\":6,\"description\":{\"type\":\"doc\",\"content\":[{\"type\":\"paragraph\",\"content\":[{\"text\":\"Loss triangulation and loss development calculation using Microsoft Excel and claims data.\",\"type\":\"text\"}]}]}},{\"name\":\"Risk Discovery\",\"order\":7,\"description\":{\"type\":\"doc\",\"content\":[{\"type\":\"paragraph\",\"content\":[{\"text\":\"Decide on the most important risks to face and how to resolve them.\",\"type\":\"text\"}]}]}},{\"name\":\"Presentations\",\"order\":8,\"description\":{\"type\":\"doc\",\"content\":[{\"type\":\"paragraph\",\"content\":[{\"text\":\"Polish your project deliverables and present them to the Build Fellow and other students in the final group session.\",\"type\":\"text\"}]}]}}]},\"fellows\":[{\"id\":\"b6d4a00f-ca38-495c-99b5-1015cb88c8eb\",\"name\":\"Luis Carlos Sarmiento Soane\",\"role\":\"Finance Fellow\",\"organization\":\"Open Avenues Foundation\",\"organizationLogoUrl\":\"/images/organizations/oaf-logo.png\",\"photoUrl\":\"https://avgkrhojcamcagufngrr.supabase.co/storage/v1/object/public/fellow-headshots/b6d4a00f-ca38-495c-99b5-1015cb88c8eb.webp\",\"bio\":\"Luis Sarmiento is a Finance Build Fellow at Open Avenues Foundation where he works with students leading projects in Finance.\\n\\nLuis Sarmiento is a Finance Analyst at Setnor Byer Insurance and Risk, a Risk Strategies Company, where he focuses on developing risk management policies and procedures, analyzing financial data to provide forecasting and guide financial transfer strategy, identifying trends to recommend and implement strategy and tracking and determining financial status by analyzing actual results in comparison with forecasts.\\n\\nLuis Sarmiento has over 5 years years of experience in the finance field. \\n\\nHe holds a master’s in Business Administration and an undergraduate degree in Risk Management and Insurance.\\n\\nA fun fact about Luis is that he is in the process of learning a new language - Portuguese.\",\"linkedinUrl\":\"https://www.linkedin.com/in/luiscarlosarmiento/\"}],\"categories\":[\"Risk Management\",\"Business Operations\",\"Risk Financing\"],\"applicationTimeline\":[{\"label\":\"Applications open\",\"value\":\"August 3, 2026\"},{\"label\":\"Applications deadline\",\"value\":\"September 3, 2026\"},{\"label\":\"Application results released\",\"value\":\"Week of September 14, 2026\"},{\"label\":\"Project start date\",\"value\":\"Week of September 28, 2026\"},{\"label\":\"Project end date\",\"value\":\"Week of November 16, 2026\"}],\"cycle_id\":\"6e8885e5-3870-4327-a19c-d88c867fa48f\"},\"error\":\"$undefined\"}]\n"])</script></body></html>
