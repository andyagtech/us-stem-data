tatic/chunks/54a60aa6-294bb7e111b509a4.js?dpl=dpl_A9QRwtuL4hrMD2RZGqb9eW7AtxES\",\"4420\",\"static/chunks/4420-baa8329e5076733c.js?dpl=dpl_A9QRwtuL4hrMD2RZGqb9eW7AtxES\",\"2169\",\"static/chunks/2169-1d13735e35f16c75.js?dpl=dpl_A9QRwtuL4hrMD2RZGqb9eW7AtxES\",\"419\",\"static/chunks/419-9f9e6d455ee0ae85.js?dpl=dpl_A9QRwtuL4hrMD2RZGqb9eW7AtxES\",\"5288\",\"static/chunks/5288-5d7819e0848b1b1a.js?dpl=dpl_A9QRwtuL4hrMD2RZGqb9eW7AtxES\",\"6874\",\"static/chunks/6874-67c719d6db2b17af.js?dpl=dpl_A9QRwtuL4hrMD2RZGqb9eW7AtxES\",\"6766\",\"static/chunks/6766-7fcc7eadc8fee52b.js?dpl=dpl_A9QRwtuL4hrMD2RZGqb9eW7AtxES\",\"9435\",\"static/chunks/9435-28f947009b0f7d38.js?dpl=dpl_A9QRwtuL4hrMD2RZGqb9eW7AtxES\",\"2206\",\"static/chunks/2206-42291f248e6bf19d.js?dpl=dpl_A9QRwtuL4hrMD2RZGqb9eW7AtxES\",\"5782\",\"static/chunks/5782-04eaa6c475f5c3f2.js?dpl=dpl_A9QRwtuL4hrMD2RZGqb9eW7AtxES\",\"8419\",\"static/chunks/app/projects/%5Bslug%5D/page-7f8129194c3557a1.js?dpl=dpl_A9QRwtuL4hrMD2RZGqb9eW7AtxES\"],\"default\"]\n"])</script><script>self.__next_f.push([1,"b:[\"$\",\"$L19\",null,{\"project\":{\"id\":\"a070ebcb-c5f7-4882-a916-2b1fdb1c05fe\",\"title\":\"Making an Investment Recommendation That You Will Not Regret\",\"slug\":\"making-an-investment-recommendation-that-you-will-not-regret-1-1\",\"summary\":{\"type\":\"doc\",\"content\":[{\"type\":\"paragraph\",\"content\":[{\"text\":\"Translate company and market analyses into a defensible investment memorandum\",\"type\":\"text\"}]}]},\"description\":{\"type\":\"doc\",\"content\":[{\"type\":\"paragraph\",\"content\":[{\"text\":\"In this Build Project, you'll take on the role of a young investment professional and prepare a recommendation for a senior committee responsible for allocating a limited amount of capital. Your recommendation will be a short written document that outlines your considerations and supports them with commercial data and analysis.\\n\\nDrafting investment papers is a highly valued skill for entry-level analysts, and like any writing discipline, it improves with practice. Under the guidance of an experienced industry expert, you'll select and review multiple sources to extract the most relevant data to support your arguments. You’ll also gain hands-on experience with essential analyst techniques such as top-down and bottom-up analysis, as well as market and company research.\\n\\nAll of this takes place in a setting designed to simulate the workflow of a real investment team.\",\"type\":\"text\"}]}]},\"project_area\":[\"Business\",\"Finance\"],\"level\":\"Intermediate\",\"levelDescription\":\"Some experience recommended\",\"prerequisites\":{\"type\":\"doc\",\"content\":[{\"type\":\"paragraph\",\"content\":[{\"text\":\"Awareness of different industries (e.g., healthcare, technology, retail) and an understanding of the trends and commercial dynamics affecting them. Example: Technology is becoming more pervasive in daily life, increasing demand for software products. However, the rise in software companies has made customer acquisition more competitive.\",\"type\":\"text\"}]},{\"type\":\"paragraph\",\"content\":[{\"text\":\"Interest in studying business models and the patience to analyze collected information in order to form a solid, objective viewpoint.\",\"type\":\"text\"}]},{\"type\":\"paragraph\",\"content\":[{\"text\":\"Basic understanding of commercial concepts such as supply chains and revenue models (e.g., subscription fees, advertising revenue).\",\"type\":\"text\"}]},{\"type\":\"paragraph\",\"content\":[{\"text\":\"Basic understanding of financial institutions, including the differences between entities like banks and private equity funds, and their roles in supporting businesses.\",\"type\":\"text\"}]},{\"type\":\"paragraph\",\"content\":[{\"text\":\"Familiarity with key financial metrics, such as revenue growth and EBITDA margin.\",\"type\":\"text\"}]}]},\"goals\":{\"type\":\"doc\",\"content\":[{\"type\":\"paragraph\",\"content\":[{\"text\":\"Understand which information must be collected, analyzed, and presented to support or challenge an investment decision.\",\"type\":\"text\"}]},{\"type\":\"paragraph\",\"content\":[{\"text\":\"Structure your hypothesis into a coherent and compelling document.\",\"type\":\"text\"}]},{\"type\":\"paragraph\",\"content\":[{\"text\":\"Choose the appropriate language and terminology based on the industry you're assessing, and tailor your writing to your audience.\",\"type\":\"text\"}]},{\"type\":\"paragraph\",\"content\":[{\"text\":\"Refine the way you look at businesses and the real economy around you.\",\"type\":\"text\"}]}]},\"schedule\":\"Thursdays, 4:00 P.M. ET / 1:00 P.M. PT\",\"status\":\"applications_open\",\"duration\":\"8 weeks, 2-3 hours per week\",\"workshops\":{\"sessions\":[{\"name\":\"INTRODUCTION\",\"order\":1,\"description\":{\"type\":\"doc\",\"content\":[{\"type\":\"paragraph\",\"content\":[{\"text\":\"Your introduction, expectations setting, individual pre-existing knowledge assessment, introductory explanation of how the investment process work in a financial institution, and alignment on what we will seek to achieve through this project. You will choose your target company from a subset of three options.\",\"type\":\"text\"}]}]}},{\"name\":\"STRUCTURING THE INVESTMENT MEMORANDUM\",\"order\":2,\"description\":{\"type\":\"doc\",\"content\":[{\"type\":\"paragraph\",\"content\":[{\"text\":\"Group discussion around what are the required areas of investigation to determine the soundness of an investment, to create a simplified framework that you will use to guide your own work on your target company.\",\"type\":\"text\"}]}]}},{\"name\":\"INDUSTRY LANDSCAPE\",\"order\":3,\"description\":{\"type\":\"doc\",\"content\":[{\"type\":\"paragraph\",\"content\":[{\"text\":\"As a class we discuss market trends, risks, and competition across the industries in question.\",\"type\":\"text\"}]}]}},{\"name\":\"TARGET COMPANY BUSINESS MODEL\",\"order\":4,\"description\":{\"type\":\"doc\",\"content\":[{\"type\":\"paragraph\",\"content\":[{\"text\":\"Group discussion around the different target companies' distribution channels, customer types, and marketing strategies, to assess strengths and weaknesses.\",\"type\":\"text\"}]}]}},{\"name\":\"VALUATION\",\"order\":5,\"description\":{\"type\":\"doc\",\"content\":[{\"type\":\"paragraph\",\"content\":[{\"text\":\"Discussion on valuation methodologies commonly used in financial analysis, and group discussion over what the fair pricing of the chosen companies might be.\",\"type\":\"text\"}]}]}},{\"name\":\"RISK ANALYSIS\",\"order\":6,\"description\":{\"type\":\"doc\",\"content\":[{\"type\":\"paragraph\",\"content\":[{\"text\":\"What can go wrong with this investment? Participative session during which you will challenge each other to find potential risks as well as mitigants.\",\"type\":\"text\"}]}]}},{\"name\":\"PREPARING FOR THE PRESENTATION\",\"order\":7,\"description\":{\"type\":\"doc\",\"content\":[{\"type\":\"paragraph\",\"content\":[{\"text\":\"Taking a step back, this session will support you in thinking critically about what you have written, how you have constructed your argument, and what other information or tools you would use if you had more time.\",\"type\":\"text\"}]}]}},{\"name\":\"MOCK INVESTMENT COMMITTEE\",\"order\":8,\"description\":{\"type\":\"doc\",\"content\":[{\"type\":\"paragraph\",\"content\":[{\"text\":\"You will do your presentations followed by Q\u0026A.\",\"type\":\"text\"}]}]}}]},\"fellows\":[{\"id\":\"a82897bc-53b2-4030-84de-6665038a2548\",\"name\":\"Giulia Roverato\",\"role\":\"Finance Fellow\",\"organization\":\"Open Avenues Foundation\",\"organizationLogoUrl\":\"/images/organizations/oaf-logo.png\",\"photoUrl\":\"https://avgkrhojcamcagufngrr.supabase.co/storage/v1/object/public/fellow-headshots//a82897bc-53b2-4030-84de-6665038a2548.webp\",\"bio\":\"Giulia is a Finance Build Fellow at the Open Avenues Foundation, where she works with students leading projects in private markets investing.\\n\\nGiulia is a Vice President at Wilshire, where she focuses on alternative assets.\\n\\nGiulia has over seven years of experience in the investment field. Prior to investing, she began her career in strategy consulting, where she focused on commercial due diligence projects for private equity firms.\\n\\nShe holds a bachelor’s degree in modern languages from the University of Oxford. She is an Italian, French and Portuguese speaker.\",\"linkedinUrl\":\"https://www.linkedin.com/in/roveratogiulia/\"}],\"categories\":[\"Industry Analysis\",\"Investment Presentation\",\"Business Writing\",\"Financial Roles\",\"Message development\",\"Briefing preparation\",\"Qualitative analysis\"],\"applicationTimeline\":[{\"label\":\"Applications open\",\"value\":\"August 3, 2026\"},{\"label\":\"Applications deadline\",\"value\":\"September 3, 2026\"},{\"label\":\"Application results released\",\"value\":\"Week of September 14, 2026\"},{\"label\":\"Project start date\",\"value\":\"Week of September 28, 2026\"},{\"label\":\"Project end date\",\"value\":\"Week of November 16, 2026\"}],\"cycle_id\":\"6e8885e5-3870-4327-a19c-d88c867fa48f\"},\"error\":\"$undefined\"}]\n"])</script></body></html>
