S\",\"1194\",\"static/chunks/22747d63-b78dbc5d907b1f14.js?dpl=dpl_A9QRwtuL4hrMD2RZGqb9eW7AtxES\",\"277\",\"static/chunks/54a60aa6-294bb7e111b509a4.js?dpl=dpl_A9QRwtuL4hrMD2RZGqb9eW7AtxES\",\"4420\",\"static/chunks/4420-baa8329e5076733c.js?dpl=dpl_A9QRwtuL4hrMD2RZGqb9eW7AtxES\",\"2169\",\"static/chunks/2169-1d13735e35f16c75.js?dpl=dpl_A9QRwtuL4hrMD2RZGqb9eW7AtxES\",\"419\",\"static/chunks/419-9f9e6d455ee0ae85.js?dpl=dpl_A9QRwtuL4hrMD2RZGqb9eW7AtxES\",\"5288\",\"static/chunks/5288-5d7819e0848b1b1a.js?dpl=dpl_A9QRwtuL4hrMD2RZGqb9eW7AtxES\",\"6874\",\"static/chunks/6874-67c719d6db2b17af.js?dpl=dpl_A9QRwtuL4hrMD2RZGqb9eW7AtxES\",\"6766\",\"static/chunks/6766-7fcc7eadc8fee52b.js?dpl=dpl_A9QRwtuL4hrMD2RZGqb9eW7AtxES\",\"9435\",\"static/chunks/9435-28f947009b0f7d38.js?dpl=dpl_A9QRwtuL4hrMD2RZGqb9eW7AtxES\",\"2206\",\"static/chunks/2206-42291f248e6bf19d.js?dpl=dpl_A9QRwtuL4hrMD2RZGqb9eW7AtxES\",\"5782\",\"static/chunks/5782-04eaa6c475f5c3f2.js?dpl=dpl_A9QRwtuL4hrMD2RZGqb9eW7AtxES\",\"8419\",\"static/chunks/app/projects/%5Bslug%5D/page-7f8129194c3557a1.js?dpl=dpl_A9QRwtuL4hrMD2RZGqb9eW7AtxES\"],\"default\"]\n1a:T59a,Jane O’Hare is an Education Fellow at Open Avenues, where she works with students leading projects in elementary education and education leadership.\n\nJane is a 4th to 8th grade leader at Star Academy for the Gifted and Talented in Boston, where she focuses on leading an extended middle school as well as teaching English. \nJane grew up in England and trained as a teacher there. Her interest in education began when as a young child, she went with her dad, who was a college principal, to his workplace during the school holidays. She developed her interest in teaching further when she began helping to coach younger children at tennis, as well as teaching younger students at the dance school she attended.\n\nJane has over twenty-five years of experience in the international education"])</script><script>self.__next_f.push([1," field. She has taught in seven different schools in four different countries and has a wealth of teaching experience. She has also been a leader in schools for many years, with experience varying from head of an upper elementary school to director of teaching and learning in a K-12 grade international school.\nShe holds a BA (hons) in Primary Education and Physical Education, a postgraduate certificate in education and an MA equivalent in education leadership.\n\nA fun fact about Jane is that she loves singing and often gets in trouble with her students for accidentally singing in the middle of lessons (without realizing she is doing it.)\n"])</script><script>self.__next_f.push([1,"b:[\"$\",\"$L19\",null,{\"project\":{\"id\":\"075efa3e-4acc-4ca9-8c11-371d583cfaab\",\"title\":\"Empowering Elementary Education Students to Emerge as Future Leaders\",\"slug\":\"empowering-elementary-education-students-to-emerge-as-professional-teachers-and-future-leaders-1-1-1\",\"summary\":{\"type\":\"doc\",\"content\":[{\"type\":\"paragraph\",\"content\":[{\"text\":\"Develop purposeful integration between subject, pedagogical, and theoretical knowledge of a teacher to produce your own curriculum for personalized learning.\",\"type\":\"text\"}]}]},\"description\":{\"type\":\"doc\",\"content\":[{\"type\":\"paragraph\",\"content\":[{\"text\":\"The aim of this Build Project is to discover methods to support curriculum development and teaching and learning best practices in any form and across all subject areas. You will learn to understand the importance of individualized and personalized learning, developmental goals, differentiation, cultural experiences and culturally responsive teaching, so that when you begin to work with children of all ages, gender and socio-economic backgrounds, you can effectively engage with and develop their love for learning with the idea they become lifelong learners.\",\"type\":\"text\"}]},{\"type\":\"paragraph\",\"content\":[{\"text\":\"Through correct pedagogy instruction and practice, you will develop your skills on how to support elementary students’ meta-cognitive skills and put this into practice in a classroom setting including the success criteria needed to do this. You will learn about, and adapt to, different methods of assessment so your students can acknowledge their own areas for improvement. You will learn about leadership in elementary schools and the experience and skills needed to progress into school leadership further on in your careers. Through guided instruction by an extremely experienced classroom teacher and school leader, you will know, use and apply micro-learning and asynchronous learning as well as write your own curriculum for personalized learning.\",\"type\":\"text\"}]}]},\"project_area\":[\"Business\"],\"level\":\"Beginner\",\"levelDescription\":\"No prior experience required\",\"prerequisites\":{\"type\":\"doc\",\"content\":[{\"type\":\"paragraph\",\"content\":[{\"text\":\"Knowledge of the elementary education curriculum and the impact great teaching can have on learning outcomes.\",\"type\":\"text\"}]},{\"type\":\"paragraph\",\"content\":[{\"text\":\"Be aware of statutory subject requirements in elementary schools of Math, ELA (English Language Arts), Social Studies and Science.\",\"type\":\"text\"}]},{\"type\":\"paragraph\",\"content\":[{\"text\":\"To understand the purpose and importance of PSHCE (Personal, Social, Health and Citizenship education) in schools and its impact on success.\",\"type\":\"text\"}]},{\"type\":\"paragraph\",\"content\":[{\"text\":\"Knowledge of the role of leaders and administrators in schools and the school-based experience needed to pursue these roles.\",\"type\":\"text\"}]},{\"type\":\"paragraph\",\"content\":[{\"text\":\"Understand that the curriculum, including use of texts and stimulation can prevent or support gender differences in schools.\",\"type\":\"text\"}]}]},\"goals\":{\"type\":\"doc\",\"content\":[{\"type\":\"paragraph\",\"content\":[{\"text\":\"Gain transferable approaches to aid in the organization, development and execution of teaching and learning\",\"type\":\"text\"}]},{\"type\":\"paragraph\",\"content\":[{\"text\":\"Learn how to utilize life experiences to help students develop academic and social skills.\",\"type\":\"text\"}]},{\"type\":\"paragraph\",\"content\":[{\"text\":\"Learn development of self, peer and teacher assessment, utilizing specific elementary educational techniques, to improve learning outcomes.\",\"type\":\"text\"}]},{\"type\":\"paragraph\",\"content\":[{\"text\":\"Use success criteria and understand the empowering impact of this approach.\",\"type\":\"text\"}]},{\"type\":\"paragraph\",\"content\":[{\"text\":\"Collect and utilize resources that will motivate and empower all students from varying socio-economic backgrounds\",\"type\":\"text\"}]},{\"type\":\"paragraph\",\"content\":[{\"text\":\"Develop teaching skills in a mock classroom setting.\",\"type\":\"text\"}]},{\"type\":\"paragraph\",\"content\":[{\"text\":\"Learn about the role of administrators in school and the different skills and experience needed for this.\",\"type\":\"text\"}]},{\"type\":\"paragraph\",\"content\":[{\"text\":\"Know and understand the expectations of educators in school from both a teaching and administration viewpoint.\",\"type\":\"text\"}]}]},\"schedule\":\"Wednesdays, 3:00 P.M. ET / 12:00 P.M. PT\",\"status\":\"archived\",\"duration\":\"8 weeks, 2-3 hours per week\",\"workshops\":{\"sessions\":[{\"name\":\"Outstanding teaching and learning, what is it and why is it important?\",\"order\":1,\"description\":{\"type\":\"doc\",\"content\":[{\"type\":\"paragraph\",\"content\":[{\"text\":\"You will learn about best practices in schools, as well as the importance of curriculum development to achieve outstanding outcomes for your students.\",\"type\":\"text\"}]}]}},{\"name\":\"Developing an outstanding elementary curriculum for modern schools - Part 1\",\"order\":2,\"description\":{\"type\":\"doc\",\"content\":[{\"type\":\"paragraph\",\"content\":[{\"text\":\"You will learn how to develop a comprehensive and effective school curriculum that fosters student learning and prepares you for future educational endeavors. This will include templates for units of work, lesson plans, assessment, core skills and cross curricular links.\",\"type\":\"text\"}]}]}},{\"name\":\"Developing an outstanding elementary curriculum for modern schools - Part 2\",\"order\":3,\"description\":{\"type\":\"doc\",\"content\":[{\"type\":\"paragraph\",\"content\":[{\"text\":\"You will learn about the various approaches to curriculum planning including: Analysis (need and task analysis), Design (objective design), Selecting (choosing appropriate learning / teaching and assessment methods), Formation (formation of the curriculum including a curriculum evaluation committee), Review (curriculum review after implementation).\",\"type\":\"text\"}]}]}},{\"name\":\"Why do boys struggle with writing and what outside influences may impact this?\",\"order\":4,\"description\":{\"type\":\"doc\",\"content\":[{\"type\":\"paragraph\",\"content\":[{\"text\":\"You will learn what factors are causing many boys to struggle with writing, including text and stimuli impacts. There will be a focus on ‘the tug of war’ research about boys' writing and how we can help overcome this in a classroom setting. You will also be looking at how we can change this for the best possible impact on learning outcomes by using published research and real-life teaching experience.\",\"type\":\"text\"}]}]}},{\"name\":\"How does health and fitness impact students' learning and can practical and theoretical Physical Education lessons help?\",\"order\":5,\"description\":{\"type\":\"doc\",\"content\":[{\"type\":\"paragraph\",\"content\":[{\"text\":\"PE has often been the undervalued - and often dismissed- subject of the school curriculum but recent studies have shown that a well rounded PE curriculum can improve everything from physical health to mental, social and cognitive capabilities.\",\"type\":\"text\"}]}]}},{\"name\":\"What is the role of school leaders and administrators in elementary education and how can they enable you to be better teachers? - Part 1\",\"order\":6,\"description\":{\"type\":\"doc\",\"content\":[{\"type\":\"paragraph\",\"content\":[{\"text\":\"This session will go into detail about the role of leaders / administrators in elementary schools and what they do behind the scenes to support students, faculty and parents. We will also be focusing on leaders in the classroom and how they can and should support recently qualified teachers.\",\"type\":\"text\"}]}]}},{\"name\":\"What is the role of school leaders and administrators in elementary education and how can they enable you to be better teachers? - Part 2\",\"order\":7,\"description\":{\"type\":\"doc\",\"content\":[{\"type\":\"paragraph\",\"content\":[{\"text\":\"This workshop will look in detail at the different roles of elementary school leaders and what experience is required to take on these roles. We will be focusing on steps teachers can make earlier in their careers to enable them to have the experience both in and out of the classroom to become a successful school leader / administrator.\",\"type\":\"text\"}]}]}},{\"name\":\"Summarize and give feedback on what makes an outstanding elementary educator.\",\"order\":8,\"description\":{\"type\":\"doc\",\"content\":[{\"type\":\"paragraph\",\"content\":[{\"text\":\"You will be sharing your projects (curriculums) with the group and the Build Fellow. Other students will give constructive feedback and ideas for use in the classroom.\",\"type\":\"text\"}]}]}}]},\"fellows\":[{\"id\":\"897c37e4-dcae-4d22-a27b-174e020cb029\",\"name\":\"Jane O'Hare\",\"role\":\"Elementary Education Fellow\",\"organization\":\"Open Avenues Foundation\",\"organizationLogoUrl\":\"/images/organizations/oaf-logo.png\",\"photoUrl\":\"https://avgkrhojcamcagufngrr.supabase.co/storage/v1/object/public/fellow-headshots/897c37e4-dcae-4d22-a27b-174e020cb029.webp\",\"bio\":\"$1a\",\"linkedinUrl\":\"https://www.linkedin.com/in/jane-o-hare-a2936996/\"}],\"categories\":[\"Differentiation\",\"developmental goals\",\"inclusion\",\"personalized learning\"],\"applicationTimeline\":[{\"label\":\"Applications open\",\"value\":\"April 13, 2026\"},{\"label\":\"Applications deadline\",\"value\":\"May 20, 2026\"},{\"label\":\"Application results released\",\"value\":\"Week of May 26, 2026\"},{\"label\":\"Project start date\",\"value\":\"Week of June 8, 2026\"},{\"label\":\"Project end date\",\"value\":\"Week of July 27, 2026\"}],\"cycle_id\":\"ae26a648-44bc-4fab-bbb0-7f9c0f6b18d9\"},\"error\":\"$undefined\"}]\n"])</script></body></html>
