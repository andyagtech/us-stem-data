ZGqb9eW7AtxES\",\"277\",\"static/chunks/54a60aa6-294bb7e111b509a4.js?dpl=dpl_A9QRwtuL4hrMD2RZGqb9eW7AtxES\",\"4420\",\"static/chunks/4420-baa8329e5076733c.js?dpl=dpl_A9QRwtuL4hrMD2RZGqb9eW7AtxES\",\"2169\",\"static/chunks/2169-1d13735e35f16c75.js?dpl=dpl_A9QRwtuL4hrMD2RZGqb9eW7AtxES\",\"419\",\"static/chunks/419-9f9e6d455ee0ae85.js?dpl=dpl_A9QRwtuL4hrMD2RZGqb9eW7AtxES\",\"5288\",\"static/chunks/5288-5d7819e0848b1b1a.js?dpl=dpl_A9QRwtuL4hrMD2RZGqb9eW7AtxES\",\"6874\",\"static/chunks/6874-67c719d6db2b17af.js?dpl=dpl_A9QRwtuL4hrMD2RZGqb9eW7AtxES\",\"6766\",\"static/chunks/6766-7fcc7eadc8fee52b.js?dpl=dpl_A9QRwtuL4hrMD2RZGqb9eW7AtxES\",\"9435\",\"static/chunks/9435-28f947009b0f7d38.js?dpl=dpl_A9QRwtuL4hrMD2RZGqb9eW7AtxES\",\"2206\",\"static/chunks/2206-42291f248e6bf19d.js?dpl=dpl_A9QRwtuL4hrMD2RZGqb9eW7AtxES\",\"5782\",\"static/chunks/5782-04eaa6c475f5c3f2.js?dpl=dpl_A9QRwtuL4hrMD2RZGqb9eW7AtxES\",\"8419\",\"static/chunks/app/projects/%5Bslug%5D/page-7f8129194c3557a1.js?dpl=dpl_A9QRwtuL4hrMD2RZGqb9eW7AtxES\"],\"default\"]\n"])</script><script>self.__next_f.push([1,"b:[\"$\",\"$L19\",null,{\"project\":{\"id\":\"90f5193a-66fc-4042-96d6-aa0e22668f06\",\"title\":\"The Art of Storytelling: Crafting Brand Stories with Market Insights\",\"slug\":\"the-art-of-storytelling-crafting-brand-stories-with-market-insights-1-1-1\",\"summary\":{\"type\":\"doc\",\"content\":[{\"type\":\"paragraph\",\"content\":[{\"text\":\"Learn to create compelling brand stories using market research, storytelling techniques, and modern AI creative tools to connect emotionally with your target audience and bring your ideas to life through visual content.\",\"type\":\"text\"}]}]},\"description\":{\"type\":\"doc\",\"content\":[{\"type\":\"paragraph\",\"content\":[{\"text\":\"Storytelling is one of the most powerful tools in marketing, and when it is supported by real customer research, it creates stronger emotional connections and more effective campaigns.\",\"type\":\"text\"}]},{\"type\":\"paragraph\",\"content\":[{\"text\":\"In this Build Project, you will learn how to transform market insights into compelling brand stories by using accessible research tools such as Google Trends, Reddit, customer reviews, and social media analysis. You'll discover how customer needs, behaviors, frustrations, and motivations shape successful marketing narratives.\",\"type\":\"text\"}]},{\"type\":\"paragraph\",\"content\":[{\"text\":\"Beyond building the story itself, you'll also explore how modern AI creative tools can help visualize and communicate that story. Students will receive an introduction to AI image generation and AI video generation as optional creative tools for producing marketing assets, social media content, advertisements, and presentation visuals.\",\"type\":\"text\"}]},{\"type\":\"paragraph\",\"content\":[{\"text\":\"The primary focus of the project remains creating a research-backed brand story. AI tools will be introduced as creative execution techniques that enhance storytelling rather than replace strategic thinking.\",\"type\":\"text\"}]}]},\"project_area\":[\"Business\"],\"level\":\"Beginner\",\"levelDescription\":\"No prior experience required\",\"prerequisites\":{\"type\":\"doc\",\"content\":[{\"type\":\"paragraph\",\"content\":[{\"text\":\"Basic understanding of brand storytelling techniques.\",\"type\":\"text\"}]},{\"type\":\"paragraph\",\"content\":[{\"text\":\"Basic market research skills, including how to find consumer data and insights from publicly available sources.\",\"type\":\"text\"}]},{\"type\":\"paragraph\",\"content\":[{\"text\":\"Creativity in applying research data to storytelling.\",\"type\":\"text\"}]},{\"type\":\"paragraph\",\"content\":[{\"text\":\"Basic familiarity with presentation tools such as PowerPoint, Canva, or Google Slides.\",\"type\":\"text\"}]},{\"type\":\"paragraph\",\"content\":[{\"text\":\"Interest in learning modern AI creative tools for marketing communication (no prior AI experience required).\",\"type\":\"text\"}]}]},\"goals\":{\"type\":\"doc\",\"content\":[{\"type\":\"paragraph\",\"content\":[{\"text\":\"Understand how market research can inform and enhance a brand story.\",\"type\":\"text\"}]},{\"type\":\"paragraph\",\"content\":[{\"text\":\"Identify key consumer insights and behaviors that help shape storytelling.\",\"type\":\"text\"}]},{\"type\":\"paragraph\",\"content\":[{\"text\":\"Develop a brand story using consumer research data to address the needs, desires, and pain points of the target audience.\",\"type\":\"text\"}]},{\"type\":\"paragraph\",\"content\":[{\"text\":\"Present a brand story creatively in a format that resonates with the target audience and is backed by research insights.\",\"type\":\"text\"}]},{\"type\":\"paragraph\",\"content\":[{\"text\":\"Create a complete research-backed brand story from customer insight to final presentation.\",\"type\":\"text\"}]},{\"type\":\"paragraph\",\"content\":[{\"text\":\"Learn how AI image and video generation can enhance brand storytelling and marketing communication.\",\"type\":\"text\"}]},{\"type\":\"paragraph\",\"content\":[{\"text\":\"Produce presentation-ready visual content that supports and strengthens a brand narrative.\",\"type\":\"text\"}]}]},\"schedule\":\"Tuesdays, 3:00 P.M. ET / 12:00 P.M. PT\",\"status\":\"applications_open\",\"duration\":\"8 weeks, 2-3 hours per week\",\"workshops\":{\"sessions\":[{\"name\":\"Introduction to Storytelling \u0026 Market Research\",\"order\":1,\"description\":{\"type\":\"doc\",\"content\":[{\"type\":\"paragraph\",\"content\":[{\"text\":\"Understand the fundamentals of storytelling and how consumer research shapes compelling brand narratives. Learn how customer insights become the foundation of marketing stories and discover how modern AI tools can help visualize and communicate those stories more effectively without replacing strategic thinking.\",\"type\":\"text\"}]}]}},{\"name\":\"Analyzing Successful Brand Stories Using Market Research\",\"order\":2,\"description\":{\"type\":\"doc\",\"content\":[{\"type\":\"paragraph\",\"content\":[{\"text\":\"Analyze successful brand campaigns by identifying the research and customer insights that influenced their development. Explore how leading brands combine storytelling with compelling visual content, and discuss how AI-generated images and videos can enhance—not replace—strong marketing narratives.\",\"type\":\"text\"}]}]}},{\"name\":\"Defining Your Product and Audience Using Market Research\",\"order\":3,\"description\":{\"type\":\"doc\",\"content\":[{\"type\":\"paragraph\",\"content\":[{\"text\":\"Develop a product or service idea and define its target audience, using basic market research tools such as surveys or Google Trends. You will identify the target audience for your brand story using research data.\",\"type\":\"text\"}]}]}},{\"name\":\"Building the Framework for a Brand Story\",\"order\":4,\"description\":{\"type\":\"doc\",\"content\":[{\"type\":\"paragraph\",\"content\":[{\"text\":\"Learn how to build a complete brand story using a proven storytelling framework consisting of a compelling hook, customer, problem, solution, proof, and emotional ending. Apply customer research to create a story that is persuasive, memorable, and ready for creative execution.\",\"type\":\"text\"}]}]}},{\"name\":\"Designing Story Delivery: What Format Will Work Best?\",\"order\":5,\"description\":{\"type\":\"doc\",\"content\":[{\"type\":\"paragraph\",\"content\":[{\"text\":\"Learn how to adapt your brand story for different marketing channels, including presentations, social media, advertisements, websites, blogs, short-form videos, and digital campaigns. Students will also receive an introduction to AI image generation and AI video generation as creative tools for transforming their brand stories into engaging visual marketing assets. The session emphasizes selecting the right format based on audience behavior and campaign objectives.\",\"type\":\"text\"}]}]}},{\"name\":\"Drafting Your Brand Story Based on Research\",\"order\":6,\"description\":{\"type\":\"doc\",\"content\":[{\"type\":\"paragraph\",\"content\":[{\"text\":\"Write the first complete draft of your research-backed brand story by combining customer insights with the storytelling framework. Develop both a written narrative and an accompanying creative concept that can later be visualized through presentations or AI-generated marketing content.\",\"type\":\"text\"}]}]}},{\"name\":\"Revising Your Brand Story Based on Feedback\",\"order\":7,\"description\":{\"type\":\"doc\",\"content\":[{\"type\":\"paragraph\",\"content\":[{\"text\":\"Refine your brand story based on instructor and peer feedback, improving clarity, emotional impact, customer relevance, and supporting evidence. Students will also polish their presentation visuals and, if desired, enhance them using AI-generated images or videos that reinforce the story.\",\"type\":\"text\"}]}]}},{\"name\":\"Final Presentation of the Brand Story\",\"order\":8,\"description\":{\"type\":\"doc\",\"content\":[{\"type\":\"paragraph\",\"content\":[{\"text\":\"Present your final research-backed brand story, demonstrating how customer insights informed your strategy and storytelling decisions. Students may also showcase optional AI-generated visual assets or short promotional videos that enhance their presentation and illustrate how the story could be executed in a real-world marketing campaign.\",\"type\":\"text\"}]}]}}]},\"fellows\":[{\"id\":\"12a585ef-9349-41dd-84d3-466284c5a4ce\",\"name\":\"Saud Tufail\",\"role\":\"Market Research Fellow\",\"organization\":\"Open Avenues Foundation\",\"organizationLogoUrl\":\"/images/organizations/oaf-logo.png\",\"photoUrl\":\"https://avgkrhojcamcagufngrr.supabase.co/storage/v1/object/public/fellow-headshots/12a585ef-9349-41dd-84d3-466284c5a4ce.webp\",\"bio\":\"Saud Tufail is a Market Research Build Fellow at Open Avenues Foundation, where he works with students leading projects in Market Research.\\n\\nSaud is an Global Trade Development Manager at SSR International LLC, where he focuses on managing international and global trade operations for the scrap metal export business.\\n\\nSaud has over 14 years of experience in the FMCG, market research, and brand management field. He has held diverse roles across industries, bringing both strategic insight and operational depth to every project he leads.\\n\\nHe holds a BBA and MBA.\\n\\nA fun fact about Saud is that he closely follows emerging tech trends and enjoys understanding how they shape consumer behavior and everyday life.\",\"linkedinUrl\":\"https://www.linkedin.com/in/saudtufail\"}],\"categories\":[\"Brand Strategy\",\"Consumer Insights\",\"Market Research\",\"Google Trends\"],\"applicationTimeline\":[{\"label\":\"Applications open\",\"value\":\"August 3, 2026\"},{\"label\":\"Applications deadline\",\"value\":\"September 3, 2026\"},{\"label\":\"Application results released\",\"value\":\"Week of September 14, 2026\"},{\"label\":\"Project start date\",\"value\":\"Week of September 28, 2026\"},{\"label\":\"Project end date\",\"value\":\"Week of November 16, 2026\"}],\"cycle_id\":\"6e8885e5-3870-4327-a19c-d88c867fa48f\"},\"error\":\"$undefined\"}]\n"])</script></body></html>
