h creating and refining prompts, connecting user questions to language model responses, and exploring how basic workflows can be built using LangChain’s chains.\",\"type\":\"text\"}]},{\"type\":\"paragraph\",\"content\":[{\"text\":\"The emphasis throughout is on building foundational understanding, enabling you to see how LLMs and LangChain integrate to create practical, real-world applications. By the end of the project, you will have gained practical experience in working with language models and LangChain, and you’ll be able to demonstrate your learning by building a simple, interactive application that showcases your new skills.\",\"type\":\"text\"}]}]},\"project_area\":[\"Computer Science\"],\"level\":\"Beginner\",\"levelDescription\":\"No prior experience required\",\"prerequisites\":{\"type\":\"doc\",\"content\":[{\"type\":\"paragraph\",\"content\":[{\"text\":\"Knowledge of Python programming.\",\"type\":\"text\"}]},{\"type\":\"paragraph\",\"content\":[{\"text\":\"Familiarity with large language models (LLMs).\",\"type\":\"text\"}]},{\"type\":\"paragraph\",\"content\":[{\"text\":\"Interest in AI Solutions.\",\"type\":\"text\"}]}]},\"goals\":{\"type\":\"doc\",\"content\":[{\"type\":\"paragraph\",\"content\":[{\"text\":\"Understand how to use LangChain to interact with language models.\",\"type\":\"text\"}]},{\"type\":\"paragraph\",\"content\":[{\"text\":\"Build simple LLM applications such as personal assistants and chatbots.\",\"type\":\"text\"}]},{\"type\":\"paragraph\",\"content\":[{\"text\":\"Apply LLMs to your proprietary data for specialized tasks.\",\"type\":\"text\"}]}]},\"schedule\":\"Thursdays, 7:00 P.M. ET / 4:00 P.M. PT\",\"status\":\"archived\",\"duration\":\"8 weeks, 2-3 hours per week\",\"workshops\":{\"sessions\":[{\"name\":\"Welcome and Getting Started\",\"order\":1,\"description\":{\"type\":\"doc\",\"content\":[{\"type\":\"paragraph\",\"content\":[{\"text\":\"Meet your instructor and project mates, learn about the workshop goals, and set up development environment or the project.\",\"type\":\"text\"}]}]}},{\"name\":\"Introduction to LangChain\",\"order\":2,\"description\":{\"type\":\"doc\",\"content\":[{\"type\":\"paragraph\",\"content\":[{\"text\":\"Find out what LangChain is and why it’s useful for working with language models. You’ll try out your very first prompts, see how to talk to a language model.\",\"type\":\"text\"}]}]}},{\"name\":\"Prompt Engineering\",\"order\":3,\"description\":{\"type\":\"doc\",\"content\":[{\"type\":\"paragraph\",\"content\":[{\"text\":\"Deepen your understanding of prompt engineering and explore various prompt templates.\",\"type\":\"text\"}]}]}},{\"name\":\"Chaining and Memory\",\"order\":4,\"description\":{\"type\":\"doc\",\"content\":[{\"type\":\"paragraph\",\"content\":[{\"text\":\"Explore how to connect multiple operations using LangChain chain And Memories to store conversations and context space.\",\"type\":\"text\"}]}]}},{\"name\":\"Building a LangChain Application\",\"order\":5,\"description\":{\"type\":\"doc\",\"content\":[{\"type\":\"paragraph\",\"content\":[{\"text\":\"In this session, you will bring together the concepts and skills learned so far to start building your own basic LangChain application. You’ll combine prompts, chains, and user input handling to create a simple, interactive app powered by a large language model.\",\"type\":\"text\"}]}]}},{\"name\":\"LLM Application Development – Core Features and Enhancements\",\"order\":6,\"description\":{\"type\":\"doc\",\"content\":[{\"type\":\"paragraph\",\"content\":[{\"text\":\"This session continues the development of your LangChain application focusing on features and enhancements.\",\"type\":\"text\"}]}]}},{\"name\":\"LLM Application Deployment\",\"order\":7,\"description\":{\"type\":\"doc\",\"content\":[{\"type\":\"paragraph\",\"content\":[{\"text\":\"In this session, you will learn how to deploy your LangChain-powered LLM application. The goal is to understand how to make your app accessible to users.\",\"type\":\"text\"}]}]}},{\"name\":\"Presentation\",\"order\":8,\"description\":{\"type\":\"doc\",\"content\":[{\"type\":\"paragraph\",\"content\":[{\"text\":\"Showcase your completed project and share your learnings with the group.\",\"type\":\"text\"}]}]}}]},\"fellows\":[{\"id\":\"8b14035c-8f38-4059-ad36-e2e5643bef08\",\"name\":\"Ujwal Gullapalli\",\"role\":\"Data Science Fellow\",\"organization\":\"Open Avenues Foundation\",\"organizationLogoUrl\":\"/images/organizations/oaf-logo.png\",\"photoUrl\":\"https://avgkrhojcamcagufngrr.supabase.co/storage/v1/object/public/fellow-headshots/8b14035c-8f38-4059-ad36-e2e5643bef08.webp\",\"bio\":\"Ujwal Gullapalli is a Data Science Build Fellow at Open Avenues Foundation, where he works with students leading projects in data science and engineering.\\n \\n Ujwal is a Data Engineer at Lightbeam Health Solutions, where he develops cutting-edge data solutions for population health analytics. He specializes in building data pipelines, interactive dashboards, and advanced analytics solutions that transform healthcare data into actionable insights, helping organizations make informed decisions to improve patient care outcomes.\\n \\n Ujwal has over 3 years of experience working across various roles as a data engineer, data scientist, and teaching assistant.\\n \\n He holds a Master's Degree in Information Technology.\\n \\n Outside of work, Ujwal loves playing cricket and enjoys competitive gaming sessions with friends.\",\"linkedinUrl\":\"https://www.linkedin.com/in/ujwal-gullapalli/\"}],\"categories\":[\"AI\",\"Data Science\",\"LLM\",\"Data\",\"Generative AI\"],\"applicationTimeline\":[{\"label\":\"Applications open\",\"value\":\"January 12, 2026\"},{\"label\":\"Applications deadline\",\"value\":\"February 5, 2026\"},{\"label\":\"Application results released\",\"value\":\"Week of February 16, 2026\"},{\"label\":\"Project start date\",\"value\":\"Week of March 2, 2026\"},{\"label\":\"Project end date\",\"value\":\"Week of April
