RwtuL4hrMD2RZGqb9eW7AtxES\",\"277\",\"static/chunks/54a60aa6-294bb7e111b509a4.js?dpl=dpl_A9QRwtuL4hrMD2RZGqb9eW7AtxES\",\"4420\",\"static/chunks/4420-baa8329e5076733c.js?dpl=dpl_A9QRwtuL4hrMD2RZGqb9eW7AtxES\",\"2169\",\"static/chunks/2169-1d13735e35f16c75.js?dpl=dpl_A9QRwtuL4hrMD2RZGqb9eW7AtxES\",\"419\",\"static/chunks/419-9f9e6d455ee0ae85.js?dpl=dpl_A9QRwtuL4hrMD2RZGqb9eW7AtxES\",\"5288\",\"static/chunks/5288-5d7819e0848b1b1a.js?dpl=dpl_A9QRwtuL4hrMD2RZGqb9eW7AtxES\",\"6874\",\"static/chunks/6874-67c719d6db2b17af.js?dpl=dpl_A9QRwtuL4hrMD2RZGqb9eW7AtxES\",\"6766\",\"static/chunks/6766-7fcc7eadc8fee52b.js?dpl=dpl_A9QRwtuL4hrMD2RZGqb9eW7AtxES\",\"9435\",\"static/chunks/9435-28f947009b0f7d38.js?dpl=dpl_A9QRwtuL4hrMD2RZGqb9eW7AtxES\",\"2206\",\"static/chunks/2206-42291f248e6bf19d.js?dpl=dpl_A9QRwtuL4hrMD2RZGqb9eW7AtxES\",\"5782\",\"static/chunks/5782-04eaa6c475f5c3f2.js?dpl=dpl_A9QRwtuL4hrMD2RZGqb9eW7AtxES\",\"8419\",\"static/chunks/app/projects/%5Bslug%5D/page-7f8129194c3557a1.js?dpl=dpl_A9QRwtuL4hrMD2RZGqb9eW7AtxES\"],\"default\"]\n"])</script><script>self.__next_f.push([1,"b:[\"$\",\"$L19\",null,{\"project\":{\"id\":\"914d1841-af73-4775-b011-fc4cbd5f34ea\",\"title\":\"Preparing Healthcare for the Long-Term Care at Home Pharmacy Revolution\",\"slug\":\"preparing-healthcare-for-the-long-term-care-at-home-pharmacy-revolution-1-1-1\",\"summary\":{\"type\":\"doc\",\"content\":[{\"type\":\"paragraph\",\"content\":[{\"text\":\"Explore the clinical, regulatory, and business foundations of Long-Term Care at Home pharmacy services, and gain the skills to lead innovative, home-based care for aging and chronically ill patients.\",\"type\":\"text\"}]}]},\"description\":{\"type\":\"doc\",\"content\":[{\"type\":\"paragraph\",\"content\":[{\"text\":\"This Build Project offers an immersive and comprehensive look into the emerging and rapidly expanding field of Long-Term Care at Home Pharmacy. Designed and taught by an experiences industry experts and practicing pharmacist from Centennial Pharmacy Services, the nation’s pioneer in LTCH, this Build Project explores the regulatory, clinical, and operational frameworks of delivering skilled pharmacy care in the home setting.\",\"type\":\"text\"}]},{\"type\":\"paragraph\",\"content\":[{\"text\":\"You will gain hands-on experience in patient management, compliance requirements, billing structures, care coordination, and packaging and dispensing strategies uniquely tailored to aging and chronically ill patients living independently. By the end of the project, you will be equipped with the skills and insights to practice or lead initiatives in home-based pharmacy services.\",\"type\":\"text\"}]},{\"type\":\"paragraph\",\"content\":[{\"text\":\"By the end of the 8-weeks project, you will have the opportunity to either design a comprehensive Long-Term Care at Home (LTCH) patient care plan (covering everything from patient qualification to monthly medication management) or develop an implementation roadmap for a traditional pharmacy to launch LTCH services.\",\"type\":\"text\"}]},{\"type\":\"paragraph\",\"content\":[{\"text\":\"This hands-on experience will prepare students to excel in real-world healthcare environments by equipping them with practical skills in care planning, service integration, and regulatory compliance. Students will gain expertise in navigating patient-centered models, optimizing medication management, and driving innovation across home-based long-term care settings, as well as community and institutional pharmacy environments.\",\"type\":\"text\"}]}]},\"project_area\":[\"Biology \u0026 Healthcare\"],\"level\":\"Intermediate\",\"levelDescription\":\"Some experience recommended\",\"prerequisites\":{\"type\":\"doc\",\"content\":[{\"type\":\"paragraph\",\"content\":[{\"text\":\"Basic pharmacy knowledge: understanding of medication therapy management (MTM) for chronic care and geriatric patients, knowledge of medication adherence strategies and compliance packaging.\",\"type\":\"text\"}]},{\"type\":\"paragraph\",\"content\":[{\"text\":\"Clinical expertise: comprehensive understanding of chronic disease management (e.g. diabetes, hypertension, COPD, etc.), understanding of polypharmacy management to reduce risks of adverse drug events and interactions.\",\"type\":\"text\"}]},{\"type\":\"paragraph\",\"content\":[{\"text\":\"Healthcare systems and regulations: insight of Medicare/Medicaid and other insurance policies, understanding of patient-centered and home-based care models, awareness of HIPAA compliance.\",\"type\":\"text\"}]},{\"type\":\"paragraph\",\"content\":[{\"text\":\"Communication and interpersonal skills: collaboration with interdisciplinary care teams (physicians, nurses, pharmacists, and social workers), effective patient communication and counseling skills for home-based care.\",\"type\":\"text\"}]},{\"type\":\"paragraph\",\"content\":[{\"text\":\"Technological proficiency: familiarity with Electronic Health Records (EHRs) and other pharmacy management software (Pioneer).\",\"type\":\"text\"}]}]},\"goals\":{\"type\":\"doc\",\"content\":[{\"type\":\"paragraph\",\"content\":[{\"text\":\"Bridge the academic gap by leading in a post-COVID, home-centered healthcare system.\",\"type\":\"text\"}]},{\"type\":\"paragraph\",\"content\":[{\"text\":\"Address national priorities on aging, chronic care, and value-based models.\",\"type\":\"text\"}]},{\"type\":\"paragraph\",\"content\":[{\"text\":\"Apply practical, hands-on learning from the country’s leading LTCH Pharmacy, Centennial Pharmacy Services.\",\"type\":\"text\"}]},{\"type\":\"paragraph\",\"content\":[{\"text\":\"Innovate in real-world scenarios, ensuring compliance, and improving patient outcomes.\",\"type\":\"text\"}]}]},\"schedule\":\"Thursdays, 2:00 P.M. ET / 11:00 A.M. PT\",\"status\":\"applications_open\",\"duration\":\"8 weeks, 2-3 hours per week\",\"workshops\":{\"sessions\":[{\"name\":\"Introduction to Long-Term Care at Home Pharmacy\",\"order\":1,\"description\":{\"type\":\"doc\",\"content\":[{\"type\":\"paragraph\",\"content\":[{\"text\":\"Introduction session for students to meet and learn about the fundamentals of long-term care at home pharmacy, its role in healthcare, and how it compares to other pharmacy models\",\"type\":\"text\"}]}]}},{\"name\":\"Patient Qualification \u0026 CMS Compliance\",\"order\":2,\"description\":{\"type\":\"doc\",\"content\":[{\"type\":\"paragraph\",\"content\":[{\"text\":\"Access LTCH eligibility and understand CMS compliance requirements\",\"type\":\"text\"}]}]}},{\"name\":\"CMS Service Sets\",\"order\":3,\"description\":{\"type\":\"doc\",\"content\":[{\"type\":\"paragraph\",\"content\":[{\"text\":\"Explore the full scope of LTCH pharmacy services based on the 11 service sets that are accepted by CMS\",\"type\":\"text\"}]}]}},{\"name\":\"Billing for Long-Term Care at Home Pharmacy Services\",\"order\":4,\"description\":{\"type\":\"doc\",\"content\":[{\"type\":\"paragraph\",\"content\":[{\"text\":\"Learn how to bill for LTCH services, exploring the NCPDP standards for pharmacy billing and its codes\",\"type\":\"text\"}]}]}},{\"name\":\"Operational Infrastructure \u0026 Workflow Design\",\"order\":5,\"description\":{\"type\":\"doc\",\"content\":[{\"type\":\"paragraph\",\"content\":[{\"text\":\"Map out LTCH pharmacy workflows and examine staffing, technology, packaging systems, and logistics used in real-world operations\",\"type\":\"text\"}]}]}},{\"name\":\"Quality, Risk Management, \u0026 Audits\",\"order\":6,\"description\":{\"type\":\"doc\",\"content\":[{\"type\":\"paragraph\",\"content\":[{\"text\":\"Understand the standards and compliance processes that apply to LTCH pharmacy and explore risk management tools to ensure compliance and service excellence\",\"type\":\"text\"}]}]}},{\"name\":\"Collaborative Care \u0026 Social Determinants of Health\",\"order\":7,\"description\":{\"type\":\"doc\",\"content\":[{\"type\":\"paragraph\",\"content\":[{\"text\":\"Learn to work with care teams, support caregivers, and address barriers to medication adherence related to social determinants of health\",\"type\":\"text\"}]}]}},{\"name\":\"Capstone Project Presentations \u0026 Future of LTCH\",\"order\":8,\"description\":{\"type\":\"doc\",\"content\":[{\"type\":\"paragraph\",\"content\":[{\"text\":\"Present a capstone project showcasing their ability to design an LTCH patient care plan\",\"type\":\"text\"}]}]}}]},\"fellows\":[{\"id\":\"22017b9c-59e1-4cda-90b1-31a01c8958ba\",\"name\":\"Jenny Ly\",\"role\":\"Pharmacy Fellow\",\"organization\":\"Open Avenues Foundation\",\"organizationLogoUrl\":\"/images/organizations/oaf-logo.png\",\"photoUrl\":\"https://avgkrhojcamcagufngrr.supabase.co/storage/v1/object/public/fellow-headshots/22017b9c-59e1-4cda-90b1-31a01c8958ba.webp\",\"bio\":\"Jenny is a Pharmacy Fellow at Open Avenues, where she works with students leading projects in Long-Term Care at Home (LTCH) Pharmacy Services.\\n\\nJenny is an Onboarding Pharmacist at Centennial Pharmacy Services where she focuses on the design, implementation, and management of the LTCH Pharmacy Services, emphasizing patient-centered care, medication safety, and effective healthcare integration.\\n\\nJenny has over 5 years of experience in the pharmacy field, with expertise in the fundamental principles of pharmacy practice as applied to clinical care, long-term care, and community pharmacy settings.\\n\\nShe holds a Doctor of Pharmacy (PharmD) degree.\\n\\nA fun fact about Jenny is that she enjoys writing short stories and spending her free time reading, often drawing inspiration from literature and everyday experiences.\",\"linkedinUrl\":\"www.linkedin.com/in/quynh-ly-pharmd-85388b257\"}],\"categories\":[\"Long-Term Care at Home Pharmacy\",\"Personalized Medication Management\",\"Transitional Care Management\",\"Compliance Packaging\"],\"applicationTimeline\":[{\"label\":\"Applications open\",\"value\":\"August 3, 2026\"},{\"label\":\"Applications deadline\",\"value\":\"September 3, 2026\"},{\"label\":\"Application results released\",\"value\":\"Week of September 14, 2026\"},{\"label\":\"Project start date\",\"value\":\"Week of September 28, 2026\"},{\"label\":\"Project end date\",\"value\":\"Week of November 16, 2026\"}],\"cycle_id\":\"6e8885e5-3870-4327-a19c-d88c867fa48f\"},\"error\":\"$undefined\"}]\n"])</script></body></html>
