-294bb7e111b509a4.js?dpl=dpl_A9QRwtuL4hrMD2RZGqb9eW7AtxES\",\"4420\",\"static/chunks/4420-baa8329e5076733c.js?dpl=dpl_A9QRwtuL4hrMD2RZGqb9eW7AtxES\",\"2169\",\"static/chunks/2169-1d13735e35f16c75.js?dpl=dpl_A9QRwtuL4hrMD2RZGqb9eW7AtxES\",\"419\",\"static/chunks/419-9f9e6d455ee0ae85.js?dpl=dpl_A9QRwtuL4hrMD2RZGqb9eW7AtxES\",\"5288\",\"static/chunks/5288-5d7819e0848b1b1a.js?dpl=dpl_A9QRwtuL4hrMD2RZGqb9eW7AtxES\",\"6874\",\"static/chunks/6874-67c719d6db2b17af.js?dpl=dpl_A9QRwtuL4hrMD2RZGqb9eW7AtxES\",\"6766\",\"static/chunks/6766-7fcc7eadc8fee52b.js?dpl=dpl_A9QRwtuL4hrMD2RZGqb9eW7AtxES\",\"9435\",\"static/chunks/9435-28f947009b0f7d38.js?dpl=dpl_A9QRwtuL4hrMD2RZGqb9eW7AtxES\",\"2206\",\"static/chunks/2206-42291f248e6bf19d.js?dpl=dpl_A9QRwtuL4hrMD2RZGqb9eW7AtxES\",\"5782\",\"static/chunks/5782-04eaa6c475f5c3f2.js?dpl=dpl_A9QRwtuL4hrMD2RZGqb9eW7AtxES\",\"8419\",\"static/chunks/app/projects/%5Bslug%5D/page-7f8129194c3557a1.js?dpl=dpl_A9QRwtuL4hrMD2RZGqb9eW7AtxES\"],\"default\"]\n1a:T408,Pratyush Kundu is a Data Science Build Fellow at Open Avenues, where he works with students leading projects in Data Science and Automation.\n\nPratyush is a Trading Operations Analyst at Virtu Financial , where he focuses on analyzing and improving operational efficiencies for the firm’s algorithmic trading infrastructure by dissecting data to derive actionable insights, writing scripts using Python and SQL to build processes and automate analyses and manage operational risk by implementing and improving monitoring tools.\n\nPratyush has over 3 years of experience in applying data science principles to drive business decisions. Prior to joining Virtu Financial, he stretched his wings at Natera and Citibank applying and honing his programming skills and analytical acumen in the di"])</script><script>self.__next_f.push([1,"sciplines of Biotechnology and Finance.\n\nHe holds a Bachelor’s Degree in Business with concentrations in Data Science and Statistics.\n\nA fun fact about Pratyush is that he knows all the good Vegan spots in NYC, even though he isn’t Vegan.\n"])</script><script>self.__next_f.push([1,"b:[\"$\",\"$L19\",null,{\"project\":{\"id\":\"518765f2-2318-450a-b20d-7c615315b76d\",\"title\":\"Data Alchemy: Crafting Actionable Insights from Raw Data\",\"slug\":\"data-alchemy-crafting-actionable-insights-from-raw-data-1\",\"summary\":{\"type\":\"doc\",\"content\":[{\"type\":\"paragraph\",\"content\":[{\"text\":\"Transform raw data into actionable insights and interactive dashboards, while mastering foundational data science techniques such as exploratory data analysis (EDA) \u0026 data visualization.\",\"type\":\"text\"}]}]},\"description\":{\"type\":\"doc\",\"content\":[{\"type\":\"paragraph\",\"content\":[{\"text\":\"In today's data-driven world, being able to transform raw data into valuable insights is a critical skill. In this Build Project, you’ll wear the hat of a Data Scientist and tackle the challenge of creating interactive dashboards that showcase business insights from raw data. Under the supervision of an experienced industry expert, you will develop essential skills in SQL, Python, machine learning, and data visualization. You’ll become familiar with industry-standard tools like sklearn and git, while applying these skills to a real-world data problem. This project provides a unique opportunity to experience the full data science lifecycle, from raw data to visualization, simulating the operations of a real data science team.\",\"type\":\"text\"}]}]},\"project_area\":[\"Computer Science\"],\"level\":\"Intermediate\",\"levelDescription\":\"Some experience recommended\",\"prerequisites\":{\"type\":\"doc\",\"content\":[{\"type\":\"paragraph\",\"content\":[{\"text\":\"Basic understanding of Python: You should be familiar with loops, functions, and libraries.\",\"type\":\"text\"}]},{\"type\":\"paragraph\",\"content\":[{\"text\":\"Experience with data analysis using libraries like Pandas.\",\"type\":\"text\"}]},{\"type\":\"paragraph\",\"content\":[{\"text\":\"Basic knowledge of SQL: You should know the basic syntax of an SQL query.\",\"type\":\"text\"}]},{\"type\":\"paragraph\",\"content\":[{\"text\":\"Willingness to learn new tools like Plotly, Streamlit, and Git.\",\"type\":\"text\"}]}]},\"goals\":{\"type\":\"doc\",\"content\":[{\"type\":\"paragraph\",\"content\":[{\"text\":\"Store and retrieve data efficiently using SQL.\",\"type\":\"text\"}]},{\"type\":\"paragraph\",\"content\":[{\"text\":\"Perform exploratory data analysis using Python.\",\"type\":\"text\"}]},{\"type\":\"paragraph\",\"content\":[{\"text\":\"Train and deploy machine learning models using sklearn.\",\"type\":\"text\"}]},{\"type\":\"paragraph\",\"content\":[{\"text\":\"Visualize data using Plotly and Streamlit.\",\"type\":\"text\"}]},{\"type\":\"paragraph\",\"content\":[{\"text\":\"Manage and version your project with Git.\",\"type\":\"text\"}]}]},\"schedule\":\"Tuesdays, 5:00 P.M. ET / 2:00 P.M. PT\",\"status\":\"archived\",\"duration\":\"8 weeks, 2-3 hours per week\",\"workshops\":{\"sessions\":[{\"name\":\"Introduction to Data Science and Git\",\"order\":1,\"description\":{\"type\":\"doc\",\"content\":[{\"type\":\"paragraph\",\"content\":[{\"text\":\"This workshop will introduce you to the project scope and goals. You will set up a development environment and learn the fundamentals of version control using Git. By the end of this session, you will be ready to collaborate and manage your project in a GitHub repository.\",\"type\":\"text\"}]}]}},{\"name\":\"Data Storage and Retrieval with SQL\",\"order\":2,\"description\":{\"type\":\"doc\",\"content\":[{\"type\":\"paragraph\",\"content\":[{\"text\":\"In this session, you will learn the basics of SQL for data storage and retrieval. You will work with databases, practicing how to create tables, insert data, and run queries to retrieve the information needed for analysis.\",\"type\":\"text\"}]}]}},{\"name\":\"Exploratory Data Analysis with Python\",\"order\":3,\"description\":{\"type\":\"doc\",\"content\":[{\"type\":\"paragraph\",\"content\":[{\"text\":\"This workshop will focus on exploratory data analysis (EDA) using Python libraries such as Pandas and Numpy. You will learn to clean and preprocess datasets, discover patterns, and generate descriptive statistics and visualizations that summarize the data.\",\"type\":\"text\"}]}]}},{\"name\":\"Introduction to Machine Learning with sklearn\",\"order\":4,\"description\":{\"type\":\"doc\",\"content\":[{\"type\":\"paragraph\",\"content\":[{\"text\":\"You will get an introduction to basic machine learning concepts and techniques. Using the sklearn library, you will build simple models such as linear regression and decision trees to gain insight from the dataset.\",\"type\":\"text\"}]}]}},{\"name\":\"Advanced Machine Learning and Model Optimization\",\"order\":5,\"description\":{\"type\":\"doc\",\"content\":[{\"type\":\"paragraph\",\"content\":[{\"text\":\"This workshop will dive deeper into advanced machine learning techniques, covering model evaluation and optimization. You will learn to fine-tune model performance using techniques such as cross-validation and hyperparameter tuning.\",\"type\":\"text\"}]}]}},{\"name\":\"Data Visualization with Plotly and Streamlit\",\"order\":6,\"description\":{\"type\":\"doc\",\"content\":[{\"type\":\"paragraph\",\"content\":[{\"text\":\"You will focus on creating interactive data visualizations using Plotly. Additionally, you’ll learn how to use Streamlit to turn data analysis and machine learning models into a shareable web application.\",\"type\":\"text\"}]}]}},{\"name\":\"Dashboard Refinement and Git Management\",\"order\":7,\"description\":{\"type\":\"doc\",\"content\":[{\"type\":\"paragraph\",\"content\":[{\"text\":\"You will refine the interactive dashboards and ensure project files are correctly versioned using Git. Additionally, you will receive feedback to improve the functionality and appearance of the dashboards.\",\"type\":\"text\"}]}]}},{\"name\":\"Final Presentations\",\"order\":8,\"description\":{\"type\":\"doc\",\"content\":[{\"type\":\"paragraph\",\"content\":[{\"text\":\"You will refine the interactive dashboards and ensure project files are correctly versioned using Git. Additionally, you will receive feedback to improve the functionality and appearance of the dashboards.\",\"type\":\"text\"}]}]}}]},\"fellows\":[{\"id\":\"067b909a-be26-4f6d-91a7-6b648897afc2\",\"name\":\"Pratyush Kundu\",\"role\":\"Data Science Fellow\",\"organization\":\"Open Avenues Foundation\",\"organizationLogoUrl\":\"/images/organizations/oaf-logo.png\",\"photoUrl\":\"https://avgkrhojcamcagufngrr.supabase.co/storage/v1/object/public/fellow-headshots/067b909a-be26-4f6d-91a7-6b648897afc2.webp\",\"bio\":\"$1a\",\"linkedinUrl\":\"https://www.linkedin.com/in/pratyush-kundu-7b9550192/\"}],\"categories\":[\"Data Science\",\"Data Visualization\",\"Python Programming\",\"Business Intelligence\"],\"applicationTimeline\":[{\"label\":\"Applications open\",\"value\":\"December 1, 2025\"},{\"label\":\"Applications deadline\",\"value\":\"January 8, 2026\"},{\"label\":\"Application results released\",\"value\":\"Week of January 16, 2026\"},{\"label\":\"Project start date\",\"value\":\"Week of February 2, 2026\"},{\"label\":\"Project end date\",\"value\":\"Week of March 23, 2026\"}],\"cycle_id\":\"a76d2d1d-8f75-423e-aaec-d693bd0b4531\"},\"error\":\"$undefined\"}]\n"])</script></body></html>
