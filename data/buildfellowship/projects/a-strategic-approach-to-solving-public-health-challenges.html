4bb7e111b509a4.js?dpl=dpl_A9QRwtuL4hrMD2RZGqb9eW7AtxES\",\"4420\",\"static/chunks/4420-baa8329e5076733c.js?dpl=dpl_A9QRwtuL4hrMD2RZGqb9eW7AtxES\",\"2169\",\"static/chunks/2169-1d13735e35f16c75.js?dpl=dpl_A9QRwtuL4hrMD2RZGqb9eW7AtxES\",\"419\",\"static/chunks/419-9f9e6d455ee0ae85.js?dpl=dpl_A9QRwtuL4hrMD2RZGqb9eW7AtxES\",\"5288\",\"static/chunks/5288-5d7819e0848b1b1a.js?dpl=dpl_A9QRwtuL4hrMD2RZGqb9eW7AtxES\",\"6874\",\"static/chunks/6874-67c719d6db2b17af.js?dpl=dpl_A9QRwtuL4hrMD2RZGqb9eW7AtxES\",\"6766\",\"static/chunks/6766-7fcc7eadc8fee52b.js?dpl=dpl_A9QRwtuL4hrMD2RZGqb9eW7AtxES\",\"9435\",\"static/chunks/9435-28f947009b0f7d38.js?dpl=dpl_A9QRwtuL4hrMD2RZGqb9eW7AtxES\",\"2206\",\"static/chunks/2206-42291f248e6bf19d.js?dpl=dpl_A9QRwtuL4hrMD2RZGqb9eW7AtxES\",\"5782\",\"static/chunks/5782-04eaa6c475f5c3f2.js?dpl=dpl_A9QRwtuL4hrMD2RZGqb9eW7AtxES\",\"8419\",\"static/chunks/app/projects/%5Bslug%5D/page-7f8129194c3557a1.js?dpl=dpl_A9QRwtuL4hrMD2RZGqb9eW7AtxES\"],\"default\"]\n1a:T425,Shreyasi is a Regulatory Affairs Build Fellow at DREAM Venture Labs, where she works with students leading projects in the Regulatory Affairs landscape.\n\nShreyasi is a Quality Improvement Specialist at WelbeHealth, where she focuses on the maintenance and implementation of the Quality Improvement program and monitors compliance with state and federal regulations\nShreyasi has over 8 years of experience in the Healthcare Administration, Public Health, Clinical Dentistry, and Research field. Throughout her experience, she has effectively managed patient care processes and streamlined workflows to ensure operational efficiency, deliver high-quality patient outcomes, and maintain compliance with healthcare regulations, demonstrating a strong foundation in public health and regulatory"])</script><script>self.__next_f.push([1," affairs within the healthcare landscape. She holds a Master’s degree in Public Health, a Master’s degree in Clinical Dentistry, and a Bachelor of Dental Surgery.\n\nA fun fact about Shreyasi is that she is a travel enthusiast and has traveled to more than 16 countries."])</script><script>self.__next_f.push([1,"b:[\"$\",\"$L19\",null,{\"project\":{\"id\":\"607beffe-b74c-4d2e-b7cc-56c5c1d289e2\",\"title\":\"A Strategic Approach to Solving Public Health Challenges\",\"slug\":\"a-strategic-approach-to-solving-public-health-challenges\",\"summary\":{\"type\":\"doc\",\"content\":[{\"type\":\"paragraph\",\"content\":[{\"text\":\"Design culturally sensitive public health strategies by integrating legal, ethical, and behavioral insights to address real-world health challenges.\",\"type\":\"text\"}]}]},\"description\":{\"type\":\"doc\",\"content\":[{\"type\":\"paragraph\",\"content\":[{\"text\":\"Public health policies often fall short when they fail to account for sociocultural and behavioral factors, resulting in interventions that lack equity and cultural sensitivity. In this Build Project, you’ll step into the role of a Public Health Policy Strategist to design culturally competent healthcare strategies. Under the supervision of an experienced healthcare professional, you’ll analyze real-world scenarios to develop actionable policy briefs, infographics, and presentations that integrate ethical, legal, and behavioral insights. You’ll gain hands-on experience in public health policy development, mastering tools and methodologies used to create impactful, equitable solutions. This project offers a unique opportunity to bridge theoretical knowledge with practical applications, preparing you for a meaningful career in public health and health policy.\",\"type\":\"text\"}]}]},\"project_area\":[\"Biology \u0026 Healthcare\"],\"level\":\"Beginner\",\"levelDescription\":\"No prior experience required\",\"prerequisites\":{\"type\":\"doc\",\"content\":[{\"type\":\"paragraph\",\"content\":[{\"text\":\"Basic knowledge of public health policy and management: You should understand the fundamentals of healthcare systems, public health initiatives, and health management principles.\",\"type\":\"text\"}]},{\"type\":\"paragraph\",\"content\":[{\"text\":\"Understanding of sociocultural and behavioral factors in healthcare: You should be able to analyze how culture, behavior, and social determinants impact health outcomes. This knowledge is crucial for developing effective, inclusive health strategies.\",\"type\":\"text\"}]},{\"type\":\"paragraph\",\"content\":[{\"text\":\"Communication and presentation skills: You will need to effectively convey your ideas through both written and oral presentations. This includes preparing reports, creating infographics, and delivering concise presentations with clear messaging.\",\"type\":\"text\"}]},{\"type\":\"paragraph\",\"content\":[{\"text\":\"Basic proficiency in data visualization tools: Familiarity with tools like PowerPoint, Canva, or similar software to create visually engaging slides and infographics to communicate your findings.\",\"type\":\"text\"}]},{\"type\":\"paragraph\",\"content\":[{\"text\":\"Critical thinking and problem-solving skills: You should be able to approach complex public health challenges with a solution-oriented mindset, integrating diverse perspectives into your analysis and recommendations.\",\"type\":\"text\"}]}]},\"goals\":{\"type\":\"doc\",\"content\":[{\"type\":\"paragraph\",\"content\":[{\"text\":\"Learn Core Public Health Concepts: Understand public health policy, law, ethics, and the role of sociocultural factors in shaping health outcomes.\",\"type\":\"text\"}]},{\"type\":\"paragraph\",\"content\":[{\"text\":\"Learn and Apply Research Methods: Practice entry-level research techniques to identify and analyze public health issues.\",\"type\":\"text\"}]},{\"type\":\"paragraph\",\"content\":[{\"text\":\"Draft Actionable Recommendations: Create simple, actionable proposals that reflect public health law, ethics, and community needs.\",\"type\":\"text\"}]},{\"type\":\"paragraph\",\"content\":[{\"text\":\"Communicate Effectively: Develop communication skills to explain public health strategies clearly to peers and stakeholders.\",\"type\":\"text\"}]}]},\"schedule\":\"Thursdays, 7:00 P.M. ET / 4:00 P.M. PT\",\"status\":\"archived\",\"duration\":\"8 weeks, 2-3 hours per week\",\"workshops\":{\"sessions\":[{\"name\":\"Understanding the Project and Key Concepts\",\"order\":1,\"description\":{\"type\":\"doc\",\"content\":[{\"type\":\"paragraph\",\"content\":[{\"text\":\"Kick off the project by meeting your peers and the Build Fellow, exploring project goals, and getting introduced to key concepts in public health policy, sociocultural influences, and ethical healthcare management.\",\"type\":\"text\"}]}]}},{\"name\":\"Identifying Public Health Challenges\",\"order\":2,\"description\":{\"type\":\"doc\",\"content\":[{\"type\":\"paragraph\",\"content\":[{\"text\":\"Analyze real-world public health scenarios to identify key challenges influenced by sociocultural and behavioral factors. You’ll brainstorm initial ideas for culturally competent healthcare interventions.\",\"type\":\"text\"}]}]}},{\"name\":\"Conducting Research\",\"order\":3,\"description\":{\"type\":\"doc\",\"content\":[{\"type\":\"paragraph\",\"content\":[{\"text\":\"Learn and apply entry-level research techniques to explore sociocultural, legal, and behavioral aspects of public health issues. This session will focus on gathering data to inform your strategy.\",\"type\":\"text\"}]}]}},{\"name\":\"Developing Policy Briefs\",\"order\":4,\"description\":{\"type\":\"doc\",\"content\":[{\"type\":\"paragraph\",\"content\":[{\"text\":\"Begin drafting a concise, actionable policy brief addressing your selected public health challenge. Incorporate legal, ethical, and behavioral insights into your recommendations.\",\"type\":\"text\"}]}]}},{\"name\":\"Designing Infographics\",\"order\":5,\"description\":{\"type\":\"doc\",\"content\":[{\"type\":\"paragraph\",\"content\":[{\"text\":\"Use tools like Canva or PowerPoint to create visually engaging infographics summarizing your findings and proposed strategies. Emphasis will be placed on clear and effective communication.\",\"type\":\"text\"}]}]}},{\"name\":\"Crafting Presentations\",\"order\":6,\"description\":{\"type\":\"doc\",\"content\":[{\"type\":\"paragraph\",\"content\":[{\"text\":\"Develop a slide deck to present your proposed public health strategy. Focus on organizing your ideas logically and incorporating impactful visuals.\",\"type\":\"text\"}]}]}},{\"name\":\"Refining and Practicing\",\"order\":7,\"description\":{\"type\":\"doc\",\"content\":[{\"type\":\"paragraph\",\"content\":[{\"text\":\"Review and refine your policy brief, infographic, and presentation. Practice presenting your work to peers and receive constructive feedback to polish your delivery.\",\"type\":\"text\"}]}]}},{\"name\":\"Final Presentations\",\"order\":8,\"description\":{\"type\":\"doc\",\"content\":[{\"type\":\"paragraph\",\"content\":[{\"text\":\"Review and refine your policy brief, infographic, and presentation. Practice presenting your work to peers and receive constructive feedback to polish your delivery.\",\"type\":\"text\"}]}]}}]},\"fellows\":[{\"id\":\"92fe8a04-00e9-409d-b5fb-4aad11e6fef5\",\"name\":\"Shreyasi Chakraborty\",\"role\":\"Regulatory Affairs Fellow\",\"organization\":\"DREAM Venture Labs\",\"organizationLogoUrl\":\"/images/organizations/dv-logo.png\",\"photoUrl\":\"https://avgkrhojcamcagufngrr.supabase.co/storage/v1/object/public/fellow-headshots//92fe8a04-00e9-409d-b5fb-4aad11e6fef5.webp\",\"bio\":\"$1a\",\"linkedinUrl\":\"https://www.linkedin.com/in/drshreyasi/\"}],\"categories\":[\"Public Health Policy\",\"Health Equity\",\"Social Determinants Of Health\",\"Policy Advocacy\"],\"applicationTimeline\":[{\"label\":\"Applications open\",\"value\":\"May 9, 2025\"},{\"label\":\"Applications deadline\",\"value\":\"June 8, 2025\"},{\"label\":\"Application results released\",\"value\":\"Week of June 23, 2025\"},{\"label\":\"Project start date\",\"value\":\"Week of July 7, 2025\"},{\"label\":\"Project end date\",\"value\":\"Week of August 25, 2025\"}],\"cycle_id\":\"77065a20-2032-46f1-b3cf-d435314c7011\"},\"error\":\"$undefined\"}]\n"])</script></body></html>
