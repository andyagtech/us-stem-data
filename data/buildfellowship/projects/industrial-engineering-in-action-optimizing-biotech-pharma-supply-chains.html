w timelines to deliver drug products to patients in high need. He holds a B.E. in mechanical engineering, an MSc in industrial engineering, and an MBA in executive engineering.\n\nA fun fact about Akshay is that he is left-handed and loves playing tennis and volleyball in his free time."])</script><script>self.__next_f.push([1,"b:[\"$\",\"$L19\",null,{\"project\":{\"id\":\"84327621-3990-4470-9aca-551dd5336f02\",\"title\":\"Industrial Engineering in Action: Optimizing Biotech Pharma Supply Chains\",\"slug\":\"industrial-engineering-in-action-optimizing-biotech-pharma-supply-chains\",\"summary\":{\"type\":\"doc\",\"content\":[{\"type\":\"paragraph\",\"content\":[{\"text\":\"Apply industrial engineering principles to tackle real-world challenges in biotech and pharmaceutical supply chains, focusing on efficiency, compliance, and risk management.\",\"type\":\"text\"}]}]},\"description\":{\"type\":\"doc\",\"content\":[{\"type\":\"paragraph\",\"content\":[{\"text\":\"Step into the world of biotech and pharma, where supply chains handle life-saving medicines under strict regulations and complex logistics. In this Build Project, you’ll act as an Industrial Engineer, solving real-world challenges with tools like Lean principles, Six Sigma, and data analytics. Guided by an industry expert, you’ll learn to optimize supply chains, tackle inefficiencies, and gain skills essential for today’s dynamic biotech field. Build your expertise, solve impactful problems, and prepare for a future in one of the fastest-growing industries. Let’s innovate together!\",\"type\":\"text\"}]}]},\"project_area\":[\"Engineering\"],\"level\":\"Beginner\",\"levelDescription\":\"No prior experience required\",\"prerequisites\":{\"type\":\"doc\",\"content\":[{\"type\":\"paragraph\",\"content\":[{\"text\":\"Basic knowledge of Industrial Engineering principles: Basic level of familiarity with process optimization (6 Sigma, Lean methods), statistical tools (Excel), and quantitative analysis (statistical knowledge of finding trends and analytic reasoning).\",\"type\":\"text\"}]},{\"type\":\"paragraph\",\"content\":[{\"text\":\"Willing to learn Lean and Six Sigma methodologies: Willingness to learn and apply these methodologies and identify waste and process variability.\",\"type\":\"text\"}]},{\"type\":\"paragraph\",\"content\":[{\"text\":\"Basic experience with data analysis: Academic basic learning familiarity with statistical software (Excel) and its commands for analyzing datasets (preferred but not mandatory).\",\"type\":\"text\"}]},{\"type\":\"paragraph\",\"content\":[{\"text\":\"Strong communication skills: Desire to be an excellent storyteller and present findings clearly through written and verbal formats.\",\"type\":\"text\"}]},{\"type\":\"paragraph\",\"content\":[{\"text\":\"Willingness to collaborate and learn: Proactive participation in discussions and activities.\",\"type\":\"text\"}]}]},\"goals\":{\"type\":\"doc\",\"content\":[{\"type\":\"paragraph\",\"content\":[{\"text\":\"Dive into real-world biotech/pharma challenges and optimize processes using industrial engineering techniques like lean principles, six-sigma methodologies, and simulation/optimization models.\",\"type\":\"text\"}]},{\"type\":\"paragraph\",\"content\":[{\"text\":\"Create strategies to handle the unique obstacles in delivering life-saving medicines.\",\"type\":\"text\"}]},{\"type\":\"paragraph\",\"content\":[{\"text\":\"Use Lean and Six Sigma to make systems faster, smarter, and more efficient.\",\"type\":\"text\"}]},{\"type\":\"paragraph\",\"content\":[{\"text\":\"Learn to analyze and visualize supply chain performance to drive better decisions.\",\"type\":\"text\"}]},{\"type\":\"paragraph\",\"content\":[{\"text\":\"Collaborate, design innovative solutions, and present them like a professional.\",\"type\":\"text\"}]}]},\"schedule\":\"Fridays, 6:00 P.M. ET / 3:00 P.M. PT\",\"status\":\"archived\",\"duration\":\"8 weeks, 2-3 hours per week\",\"workshops\":{\"sessions\":[{\"name\":\"Introductions\",\"order\":1,\"description\":{\"type\":\"doc\",\"content\":[{\"type\":\"paragraph\",\"content\":[{\"text\":\"Understand the scope of industrial engineering in biotech/pharma supply chains and outline career pathways in this field.\",\"type\":\"text\"}]}]}},{\"name\":\"Corporate Supply Chain\",\"order\":2,\"description\":{\"type\":\"doc\",\"content\":[{\"type\":\"paragraph\",\"content\":[{\"text\":\"Gain insights into corporate supply chain structures and strategies in biotech/pharma.\",\"type\":\"text\"}]}]}},{\"name\":\"Market Positioning\",\"order\":3,\"description\":{\"type\":\"doc\",\"content\":[{\"type\":\"paragraph\",\"content\":[{\"text\":\"Learn to evaluate market positioning and strategic differentiators in a competitive context.\",\"type\":\"text\"}]}]}},{\"name\":\"Data Collection\",\"order\":4,\"description\":{\"type\":\"doc\",\"content\":[{\"type\":\"paragraph\",\"content\":[{\"text\":\"Master data collection, organization, and visualization techniques relevant to supply chain analysis.\",\"type\":\"text\"}]}]}},{\"name\":\"Assess Supply Chain Performance\",\"order\":5,\"description\":{\"type\":\"doc\",\"content\":[{\"type\":\"paragraph\",\"content\":[{\"text\":\"Apply industrial engineering tools to assess supply chain performance and identify inefficiencies.\",\"type\":\"text\"}]}]}},{\"name\":\"Optimization\",\"order\":6,\"description\":{\"type\":\"doc\",\"content\":[{\"type\":\"paragraph\",\"content\":[{\"text\":\"Lean data-driven optimization strategies tailored to industry challenges.\",\"type\":\"text\"}]}]}},{\"name\":\"Final Report\",\"order\":7,\"description\":{\"type\":\"doc\",\"content\":[{\"type\":\"paragraph\",\"content\":[{\"text\":\"Develop professional communication skills by integrating technical findings into a cohesive report and presentation.\",\"type\":\"text\"}]}]}},{\"name\":\"Presentations and wrap-up\",\"order\":8,\"description\":{\"type\":\"doc\",\"content\":[{\"type\":\"paragraph\",\"content\":[{\"text\":\"Develo
