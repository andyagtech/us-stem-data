W7AtxES\",\"277\",\"static/chunks/54a60aa6-294bb7e111b509a4.js?dpl=dpl_A9QRwtuL4hrMD2RZGqb9eW7AtxES\",\"4420\",\"static/chunks/4420-baa8329e5076733c.js?dpl=dpl_A9QRwtuL4hrMD2RZGqb9eW7AtxES\",\"2169\",\"static/chunks/2169-1d13735e35f16c75.js?dpl=dpl_A9QRwtuL4hrMD2RZGqb9eW7AtxES\",\"419\",\"static/chunks/419-9f9e6d455ee0ae85.js?dpl=dpl_A9QRwtuL4hrMD2RZGqb9eW7AtxES\",\"5288\",\"static/chunks/5288-5d7819e0848b1b1a.js?dpl=dpl_A9QRwtuL4hrMD2RZGqb9eW7AtxES\",\"6874\",\"static/chunks/6874-67c719d6db2b17af.js?dpl=dpl_A9QRwtuL4hrMD2RZGqb9eW7AtxES\",\"6766\",\"static/chunks/6766-7fcc7eadc8fee52b.js?dpl=dpl_A9QRwtuL4hrMD2RZGqb9eW7AtxES\",\"9435\",\"static/chunks/9435-28f947009b0f7d38.js?dpl=dpl_A9QRwtuL4hrMD2RZGqb9eW7AtxES\",\"2206\",\"static/chunks/2206-42291f248e6bf19d.js?dpl=dpl_A9QRwtuL4hrMD2RZGqb9eW7AtxES\",\"5782\",\"static/chunks/5782-04eaa6c475f5c3f2.js?dpl=dpl_A9QRwtuL4hrMD2RZGqb9eW7AtxES\",\"8419\",\"static/chunks/app/projects/%5Bslug%5D/page-7f8129194c3557a1.js?dpl=dpl_A9QRwtuL4hrMD2RZGqb9eW7AtxES\"],\"default\"]\n1a:T42d,In this Build Project, you will learn how to identify soil microbes and understand their diversity using both visual and data-driven methods. You will explore their crucial role in releasing nutrients like nitrogen and phosphorus, improving soil structure, and protecting plants from pests and diseases. Through real-world examples from regenerative farming practices in diverse cropping systems such as oranges, almonds, and vegetable farming, you will learn how microbial bio-stimulants and biocontrol agents are transforming agriculture while reducing chemical inputs. By the end of the project, you will have the skills to assess soil microbial health, apply targeted microbial solutions, and design farm management strategies that enhance productivity, resilience, and environmental s"])</script><script>self.__next_f.push([1,"ustainability. You will summarize your learnings in a single integrated proposal that combines case study insights with a farm management plan for sustainable microbial solutions. You will either create a poster or PowerPoint presentation to share your work with the team members."])</script><script>self.__next_f.push([1,"b:[\"$\",\"$L19\",null,{\"project\":{\"id\":\"9968e888-e9d0-4479-b258-056c8034ddfb\",\"title\":\"Microbes in Action: Driving Soil Health for Regenerative Agriculture\",\"slug\":\"microbes-in-action-driving-soil-health-for-regenerative-agriculture-1-1\",\"summary\":{\"type\":\"doc\",\"content\":[{\"type\":\"paragraph\",\"content\":[{\"text\":\"Prepare a proposal/report on how to use microbial solutions to enhance soil health, boost crop productivity, and promote regenerative farming practices.\",\"type\":\"text\"}]}]},\"description\":{\"type\":\"doc\",\"content\":[{\"type\":\"paragraph\",\"content\":[{\"text\":\"Healthy soils are alive, teeming with billions of microbes that quietly power our food systems. These microscopic allies include bacteria, fungi, and other microscopic organisms. They are essential for nutrient cycling, plant health, and long-term soil regeneration.\",\"type\":\"text\"}]},{\"type\":\"paragraph\",\"content\":[{\"text\":\"$1a\",\"type\":\"text\"}]}]},\"project_area\":[\"Biology \u0026 Healthcare\"],\"level\":\"Intermediate\",\"levelDescription\":\"Some experience recommended\",\"prerequisites\":{\"type\":\"doc\",\"content\":[{\"type\":\"paragraph\",\"content\":[{\"text\":\"Basic microbiology: Understanding of microbial cell structure, metabolisms, symbiosis, and nutrient cycles (e.g., nitrogen, carbon).\",\"type\":\"text\"}]},{\"type\":\"paragraph\",\"content\":[{\"text\":\"Ecology/Agriculture: Basic awareness of soil health principles or farming practices (e.g., cover cropping, rotational grazing).\",\"type\":\"text\"}]},{\"type\":\"paragraph\",\"content\":[{\"text\":\"Soil: Basic knowledge regarding soil science (e.g., soil structure, organic matter, soil gradient)\",\"type\":\"text\"}]},{\"type\":\"paragraph\",\"content\":[{\"text\":\"Data Literacy: Ability to interpret graphs, tables, and basic statistical concepts (e.g., correlation, averages).\",\"type\":\"text\"}]},{\"type\":\"paragraph\",\"content\":[{\"text\":\"Critical Thinking: Ability to connect abstract concepts (e.g., linking microbial diversity to fertilizer use and crop yield).\",\"type\":\"text\"}]}]},\"goals\":{\"type\":\"doc\",\"content\":[{\"type\":\"paragraph\",\"content\":[{\"text\":\"Understand soil microbial diversity and roles in supporting regenerative farming systems.\",\"type\":\"text\"}]},{\"type\":\"paragraph\",\"content\":[{\"text\":\"Select and apply microbial bio-stimulants to enhance soil fertility, crop growth, and resilience.\",\"type\":\"text\"}]},{\"type\":\"paragraph\",\"content\":[{\"text\":\"Utilize beneficial microbes for pest and disease management to reduce reliance on chemical inputs.\",\"type\":\"text\"}]},{\"type\":\"paragraph\",\"content\":[{\"text\":\"Assess and monitor soil microbial diversity using practical and data-driven approaches.\",\"type\":\"text\"}]},{\"type\":\"paragraph\",\"content\":[{\"text\":\"Integrate microbial data and solutions into farm management plans for sustainable, regenerative agriculture.\",\"type\":\"text\"}]}]},\"schedule\":\"Mondays, 6:00 P.M. ET / 3:00 P.M. PT\",\"status\":\"active\",\"duration\":\"8 weeks, 2-3 hours per week\",\"workshops\":{\"sessions\":[{\"name\":\"Introduction to soil microbes and regenerative agriculture\",\"order\":1,\"description\":{\"type\":\"doc\",\"content\":[{\"type\":\"paragraph\",\"content\":[{\"text\":\"Explore the foundational concepts of soil microbiology and regenerative agriculture. You will prepare a short report on the beneficial ecological role of soil microbes in agriculture. This session will include a 5-10 minute career insight: \\\"Day in the Life of a Microbiology Fellow/R\u0026D Manager.\\\"\",\"type\":\"text\"}]}]}},{\"name\":\"Soil Microbial Diversity and Functions\",\"order\":2,\"description\":{\"type\":\"doc\",\"content\":[{\"type\":\"paragraph\",\"content\":[{\"text\":\"Learn about the major groups of soil microbes and their ecological roles, plus methods used to identify them. You will present advantages and limitations of methods used to study soil microbial communities and their functions.\",\"type\":\"text\"}]}]}},{\"name\":\"Plant - Microbe Interactions\",\"order\":3,\"description\":{\"type\":\"doc\",\"content\":[{\"type\":\"paragraph\",\"content\":[{\"text\":\"Investigate how microbes interact with plants to improve nutrient uptake and resilience. You will provide research-backed examples of microbe-plant interactions. Includes a 5-10 minute career insight: industry news and breakthroughs in plant-microbe research.\",\"type\":\"text\"}]}]}},{\"name\":\"Microbial Solutions for Nutrient Management\",\"order\":4,\"description\":{\"type\":\"doc\",\"content\":[{\"type\":\"paragraph\",\"content\":[{\"text\":\"Study how microbial biostimulants and biofertilizers enhance soil fertility and crop growth. You will draft a simple plan for applying microbial solutions to a selected crop system — this becomes a building block for your final proposal.\",\"type\":\"text\"}]}]}},{\"name\":\"Microbial-Based Pest and Disease Management\",\"order\":5,\"description\":{\"type\":\"doc\",\"content\":[{\"type\":\"paragraph\",\"content\":[{\"text\":\"Examine the use of beneficial microbes for controlling soil-borne pathogens and reducing chemical inputs. You will create a draft strategy for microbial pest and disease management. Includes a 5-10 minute career insight: Q\u0026A about the pathways into industry/academia.\",\"type\":\"text\"}]}]}},{\"name\":\"Compost, Biochar, and Microbial Amendments\",\"order\":6,\"description\":{\"type\":\"doc\",\"content\":[{\"type\":\"paragraph\",\"content\":[{\"text\":\"Learn how compost, biochar, and other microbial amendments support soil health and microbial activity. You will summarize practical applications and key concepts and begin assembling sections of the final proposal in a guided practice block.\",\"type\":\"text\"}]}]}},{\"name\":\"Field Applications and Case Studies\",\"order\":7,\"description\":{\"type\":\"doc\",\"content\":[{\"type\":\"paragraph\",\"content\":[{\"text\":\"Analyze real-world examples of regenerative agriculture using microbial solutions, then use a dedicated practice block to integrate case-study findings with earlier session outputs into a near-complete draft of your final proposal. Includes a 5-10 minute career insight: an invitation to schedule 1:1 session for resume review, mock interviews, or career guidance.\",\"type\":\"text\"}]}]}},{\"name\":\"Integration and Future Trends\",\"order\":8,\"description\":{\"type\":\"doc\",\"content\":[{\"type\":\"paragraph\",\"content\":[{\"text\":\"Fully dedicated to student presentations of the final \\\"Microbial Solutions Proposal,\\\" a brief reflective learning log, and closing career-path discussion. No new content is introduced. The final proposal and presentation are to be completed before this session.\",\"type\":\"text\"}]}]}}]},\"fellows\":[{\"id\":\"9d135e88-3158-44b4-91f8-7e6683fb7b43\",\"name\":\"Bikram Das\",\"role\":\"Microbiology Fellow\",\"organization\":\"Open Avenues Foundation\",\"organizationLogoUrl\":\"/images/organizations/oaf-logo.png\",\"photoUrl\":\"https://avgkrhojcamcagufngrr.supabase.co/storage/v1/object/public/fellow-headshots/9d135e88-3158-44b4-91f8-7e6683fb7b43.webp\",\"bio\":\"Bikram Kumar Das is a Training and Development Specialist at Open Avenues Foundation, where he works with students leading projects in Microbiology.\\n\\nBikram is a Microbiology Fellow at Open Avenues Foundation, where he focuses on designing and creating training manuals, online learning modules, and course materials.\\n\\nBikram has over 15 years of experience in the teaching/mentoring field. He has worked as a high-school teacher, Lecturer, Research assistant, post-doctorate research associate, and supervisor at an analytical laboratory.\\n\\nHe holds a doctorate degree in biological sciences.\\n\\nA fun fact about Bikram is that he was chosen as a student speaker at his graduate commencement ceremony.\\n\\n\",\"linkedinUrl\":\"https://www.linkedin.com/in/bikram-kumar-d-5b4a05167/\"}],\"categories\":[\"Microbes\",\"Soil Health\",\"Regenerative agriculture\",\"Sustainability\"],\"applicationTimeline\":[{\"label\":\"Applications open\",\"value\":\"May 11, 2026\"},{\"label\":\"Applications deadline\",\"value\":\"June 11, 2026\"},{\"label\":\"Application results released\",\"value\":\"Week of June 22, 2026\"},{\"label\":\"Project start date\",\"value\":\"Week of July 6, 2026\"},{\"label\":\"Project end date\",\"value\":\"Week of August 24, 2026\"}],\"cycle_id\":\"04780f7f-10bb-4b43-8480-8ef15da1b3cc\"},\"error\":\"$undefined\"}]\n"])</script></body></html>
