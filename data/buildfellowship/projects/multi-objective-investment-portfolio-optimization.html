estments effectively under real-world limitations. Throughout the project, you'll gain hands-on experience with factor models and optimization techniques, and create a Python notebook that solves the\",\"type\":\"text\"}]}]},\"project_area\":[\"Business\"],\"level\":\"Intermediate\",\"levelDescription\":\"Some experience recommended\",\"prerequisites\":{\"type\":\"doc\",\"content\":[{\"type\":\"paragraph\",\"content\":[{\"text\":\"Basic understanding of statistics and probability, including concepts like mean and variance of random variables.\",\"type\":\"text\"}]},{\"type\":\"paragraph\",\"content\":[{\"text\":\"Basic knowledge of linear algebra, particularly matrix operations such as inversion.\",\"type\":\"text\"}]},{\"type\":\"paragraph\",\"content\":[{\"text\":\"Intermediate-level Python skills with some experience using Pandas and other computational libraries.\",\"type\":\"text\"}]}]},\"goals\":{\"type\":\"doc\",\"content\":[{\"type\":\"paragraph\",\"content\":[{\"text\":\"Understand the factor model structure in the portfolio construction process.\",\"type\":\"text\"}]},{\"type\":\"paragraph\",\"content\":[{\"text\":\"Understand the integer constraint in real-world portfolio optimization.\",\"type\":\"text\"}]},{\"type\":\"paragraph\",\"content\":[{\"text\":\"Mathematically formulate the mixed integer quadratic portfolio optimization problem.\",\"type\":\"text\"}]},{\"type\":\"paragraph\",\"content\":[{\"text\":\"Use Python to numerically solve the multi-objective mixed integer optimization problem to build an efficient frontier.\",\"type\":\"text\"}]}]},\"schedule\":\"Thursdays, 3:00 P.M. ET / 12:00 P.M. PT\",\"status\":\"archived\",\"duration\":\"8 weeks, 2-3 hours per week\",\"workshops\":{\"sessions\":[{\"name\":\"Introduction to Quantitative Investment Management and Factor Models\",\"order\":1,\"description\":{\"type\":\"doc\",\"content\":[{\"type\":\"paragraph\",\"content\":[{\"text\":\"Introduce the concept of portfolio optimization. Develop the factor model (Market, HML, SMB) framework of asset characteristics.\",\"type\":\"text\"}]}]}},{\"name\":\"Introduction to Portfolio Optimization and Integer Constraint\",\"order\":2,\"description\":{\"type\":\"doc\",\"content\":[{\"type\":\"paragraph\",\"content\":[{\"text\":\"Explain integer constraints and why they matter in practice. Introduce examples like number of trades or avoiding small residual positions.\",\"type\":\"text\"}]}]}},{\"name\":\"Diving into Portfolio Optimization Objectives\",\"order\":3,\"description\":{\"type\":\"doc\",\"content\":[{\"type\":\"paragraph\",\"content\":[{\"text\":\"Introduce the multi-objectives: such as minimizing tracking error and the number of trades. Discuss how these objectives create a trade-off.\",\"type\":\"text\"}]}]}},{\"name\":\"Defining and Building the Mathematical Model\",\"order\":4,\"description\":{\"type\":\"doc\",\"content\":[{\"type\":\"paragraph\",\"content\":[{\"text\":\"Practice mathematically defining regular and integer constraints (e.g., sum of weights, trade sizes, and position limits, trading indicator) and combine these with the objectives to create a full quadratic optimization model.\",\"type\":\"text\"}]}]}},{\"name\":\"Implementing and Solving the Mixed-Integer Optimization in Python\",\"order\":5,\"description\":{\"type\":\"doc\",\"content\":[{\"type\":\"paragraph\",\"content\":[{\"text\":\"Guide you in coding the factor model, defining constraints and objectives, and solving the mixed-integer quadratic optimization problem using Python and Gurobi package (need trial license).\",\"type\":\"text\"}]}]}},{\"name\":\"Constructing and Interpreting the Efficient Frontier with Respect to Trading Limit\",\"order\":6,\"description\":{\"type\":\"doc\",\"content\":[{\"type\":\"paragraph\",\"content\":[{\"text\":\"Show how to iterate over different trade numbers to generate the efficient frontier, plot the results, and recognize the trade-offs between investment objectives.\",\"type\":\"text\"}]}]}},{\"name\":\"Refining Results and Analyzing Trade-Offs\",\"order\":7,\"description\":{\"type\":\"doc\",\"content\":[{\"type\":\"paragraph\",\"content\":[{\"text\":\"Encourage you to interpret trade-offs between objectives and consider alternative solutions.\",\"type\":\"text\"}]}]}},{\"name\":\"Deliverable Demonstration and Discussion\",\"order\":8,\"description\":{\"type\":\"doc\",\"content\":[{\"type\":\"paragraph\",\"content\":[{\"text\":\"Present results, including the efficient frontier, optimal portfolio weights, and code implementation. Facilitate a discussion on challenges faced, lessons learned, and potential extensions of the project.\",\"type\":\"text\"}]}]}}]},\"fellows\":[{\"id\":\"91c46b78-7c4d-4d1d-8437-0e0e4d859c4c\",\"name\":\"Ce Luo\",\"role\":\"Finance Fellow\",\"organization\":\"Open Avenues Foundation\",\"organizationLogoUrl\":\"/images/organizations/oaf-logo.png\",\"photoUrl\":\"https://avgkrhojcamcagufngrr.supabase.co/storage/v1/object/public/fellow-headshots/91c46b78-7c4d-4d1d-8437-0e0e4d859c4c.webp\",\"bio\":\"Ce Luo is a Finance Build Fellow at Open Avenues, where he works with students leading projects in portfolio optimization.\\n\\nCe is an Investment Processes Senior Associate at Arrowstreet Capital, where he focuses on automating investment decision-making and analyzing the resulting portfolio. Ce has over 3 years of experience in the quantitative investment management field. He holds a Master of Finance. \\n\\nA fun fact about Ce is that he plays Chinese bamboo flute.\\n\",\"linkedinUrl\":\"https://www.linkedin.com/in/ce-luo-085a49199/\"}],\"categories\":[\"Quantitative Modeling\",\"Mixed Integer Programming\",\"Factor Model\",\"Portfolio Optimization\"],\"applicationTimeline\":[{\"label\":\"Applications open\",\"value\":\"April 14, 2025\"},{\"label\":\"Applications deadline\",\"value\":\"May 8, 2025\"},{\"label\":\"Application results released\",\"value\":\"Week of May 26, 2025\"},{\"label\":\"Project start date\",\"value\":\"Week of June 9,
