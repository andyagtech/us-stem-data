509a4.js?dpl=dpl_A9QRwtuL4hrMD2RZGqb9eW7AtxES\",\"4420\",\"static/chunks/4420-baa8329e5076733c.js?dpl=dpl_A9QRwtuL4hrMD2RZGqb9eW7AtxES\",\"2169\",\"static/chunks/2169-1d13735e35f16c75.js?dpl=dpl_A9QRwtuL4hrMD2RZGqb9eW7AtxES\",\"419\",\"static/chunks/419-9f9e6d455ee0ae85.js?dpl=dpl_A9QRwtuL4hrMD2RZGqb9eW7AtxES\",\"5288\",\"static/chunks/5288-5d7819e0848b1b1a.js?dpl=dpl_A9QRwtuL4hrMD2RZGqb9eW7AtxES\",\"6874\",\"static/chunks/6874-67c719d6db2b17af.js?dpl=dpl_A9QRwtuL4hrMD2RZGqb9eW7AtxES\",\"6766\",\"static/chunks/6766-7fcc7eadc8fee52b.js?dpl=dpl_A9QRwtuL4hrMD2RZGqb9eW7AtxES\",\"9435\",\"static/chunks/9435-28f947009b0f7d38.js?dpl=dpl_A9QRwtuL4hrMD2RZGqb9eW7AtxES\",\"2206\",\"static/chunks/2206-42291f248e6bf19d.js?dpl=dpl_A9QRwtuL4hrMD2RZGqb9eW7AtxES\",\"5782\",\"static/chunks/5782-04eaa6c475f5c3f2.js?dpl=dpl_A9QRwtuL4hrMD2RZGqb9eW7AtxES\",\"8419\",\"static/chunks/app/projects/%5Bslug%5D/page-7f8129194c3557a1.js?dpl=dpl_A9QRwtuL4hrMD2RZGqb9eW7AtxES\"],\"default\"]\n"])</script><script>self.__next_f.push([1,"b:[\"$\",\"$L19\",null,{\"project\":{\"id\":\"930854ae-ab8d-4ea4-af6f-642a13b8eba2\",\"title\":\"Prepare an Investment Memo: Credit Analysis Using Real Company Data\",\"slug\":\"preparing-an-investment-memo-from-a-credit-analysis-1\",\"summary\":{\"type\":\"doc\",\"content\":[{\"type\":\"paragraph\",\"content\":[{\"text\":\"Evaluate and compare public companies by mining 10‑Ks, building SWOT insights, and organizing findings to deliver a polished, evidence‑backed recommendation to your peers.\",\"type\":\"text\"}]}]},\"description\":{\"type\":\"doc\",\"content\":[{\"type\":\"paragraph\",\"content\":[{\"text\":\"Ever wondered how real investors decide where to put millions—or when to walk away? In today’s markets, finance professionals must cut through massive company disclosures to answer a few critical questions: Is this business strong? Can it handle risk? And does the opportunity justify the downside?\",\"type\":\"text\"}]},{\"type\":\"paragraph\",\"content\":[{\"text\":\"In this Build Project, you'll wear the hat of a credit analyst and run an investment committee process of choosing a public company and analyzing it. Under the supervision of an experienced industry expert, you'll mine EDGAR and IR websites for 10-K/10-Q data, build a SWOT analysis of the companies, a comps table, culminating in you preparing an investment memo to use in your presentation to finish the project. All this will happen in an environment that simulates the operations of a real credit team.\",\"type\":\"text\"}]},{\"type\":\"paragraph\",\"content\":[{\"text\":\"This project is ideal for students considering careers in investment banking, credit or equity research, private credit, corporate finance, consulting, or strategy. \",\"type\":\"text\"}]}]},\"project_area\":[\"Finance\"],\"level\":\"Intermediate\",\"levelDescription\":\"Some experience recommended\",\"prerequisites\":{\"type\":\"doc\",\"content\":[{\"type\":\"paragraph\",\"content\":[{\"text\":\"An understanding of financial analysis and accounting principles (the 3 statements and how they are connected, basic GAAP vs. non-GAAP, etc.)\",\"type\":\"text\"}]},{\"type\":\"paragraph\",\"content\":[{\"text\":\"Previous experience with Microsoft Office (PowerPoint and Excel specifically)\",\"type\":\"text\"}]},{\"type\":\"paragraph\",\"content\":[{\"text\":\"Organizational and time-keeping skills to ensure that deadlines are hit and information is kept in easy to find folders\",\"type\":\"text\"}]},{\"type\":\"paragraph\",\"content\":[{\"text\":\"Presentation skills/public speaking ability to help with the final session, delivering their work in an IC style discussion\",\"type\":\"text\"}]},{\"type\":\"paragraph\",\"content\":[{\"text\":\"Ability to read the income statement, balance sheet, and cash flow and understand how they are connected/linked\",\"type\":\"text\"}]},{\"type\":\"paragraph\",\"content\":[{\"text\":\"Ability to interpret financial metrics like Gross/EBITDA margins, CAGR, EV/EBITDA and other\",\"type\":\"text\"}]}]},\"goals\":{\"type\":\"doc\",\"content\":[{\"type\":\"paragraph\",\"content\":[{\"text\":\"Read and interpret a company’s annual reports (10-K), focusing on the key sections which are the most relevant for investment analysis\",\"type\":\"text\"}]},{\"type\":\"paragraph\",\"content\":[{\"text\":\"Evaluate a company’s business model and competitive positioning\",\"type\":\"text\"}]},{\"type\":\"paragraph\",\"content\":[{\"text\":\"Conduct a SWOT analysis\",\"type\":\"text\"}]},{\"type\":\"paragraph\",\"content\":[{\"text\":\"Prepare an investment memo to support an investment recommendation presented to an investment committee\",\"type\":\"text\"}]}]},\"schedule\":\"Wednesdays, 7:00 P.M. ET / 4:00 P.M. PT\",\"status\":\"active\",\"duration\":\"8 weeks, 2-3 hours per week\",\"workshops\":{\"sessions\":[{\"name\":\"Introduction\",\"order\":1,\"description\":{\"type\":\"doc\",\"content\":[{\"type\":\"paragraph\",\"content\":[{\"text\":\"Who are we? What are your career interests? Which industries pull you in the most? What will this project look like from start to finish, and how can it serve you professionally? We’ll walk through the roadmap and what the final deliverable will look like.\",\"type\":\"text\"}]}]}},{\"name\":\"Initial Company Review\",\"order\":2,\"description\":{\"type\":\"doc\",\"content\":[{\"type\":\"paragraph\",\"content\":[{\"text\":\"Step into the mind of a credit analyst. Pick two companies in the same industry to analyze side-by-side. What do they do? Where are they based? What are the basic facts you need to know before you can form an opinion?\",\"type\":\"text\"}]}]}},{\"name\":\"Diving Deeper\",\"order\":3,\"description\":{\"type\":\"doc\",\"content\":[{\"type\":\"paragraph\",\"content\":[{\"text\":\"Now the real research begins. How do your companies make money? What makes each one strategically interesting? Who are their customers? Start building a structured Company Overview and Customer Overview for both companies, which becomes the foundation of your memo.\",\"type\":\"text\"}]}]}},{\"name\":\"Competitive Analysis\",\"order\":4,\"description\":{\"type\":\"doc\",\"content\":[{\"type\":\"paragraph\",\"content\":[{\"text\":\"Go find their competitors. Who are they fighting for customers with? What makes your companies different (and does it matter)? Which players are best positioned, and why? We’ll also look at the competitive landscape through a credit lens (i.e. what debt do competitors carry on their balance sheets?).\",\"type\":\"text\"}]}]}},{\"name\":\"Introduction to SWOT Analysis\",\"order\":5,\"description\":{\"type\":\"doc\",\"content\":[{\"type\":\"paragraph\",\"content\":[{\"text\":\"A classic framework, used the right way. What are the key strengths, weaknesses, opportunities, and threats for each company? Lay out the pros and cons clearly, and connect them back to the industry dynamics you’ve been learning.\",\"type\":\"text\"}]}]}},{\"name\":\"Forming a View\",\"order\":6,\"description\":{\"type\":\"doc\",\"content\":[{\"type\":\"paragraph\",\"content\":[{\"text\":\"Time to take a stance. Which company looks like the stronger credit investment, or are both questionable? What evidence actually supports your view? This is the culmination of the work you’ve built across the project, turning research into a defendable recommendation.\",\"type\":\"text\"}]}]}},{\"name\":\"Finishing Touches\",\"order\":7,\"description\":{\"type\":\"doc\",\"content\":[{\"type\":\"paragraph\",\"content\":[{\"text\":\"How can you convey your message as clearly and convincingly as possible? Finalize your PowerPoint memo, refine the story, and share for feedback so you’re ready to present with confidence the following week.\",\"type\":\"text\"}]}]}},{\"name\":\"Presentations and Feedback\",\"order\":8,\"description\":{\"type\":\"doc\",\"content\":[{\"type\":\"paragraph\",\"content\":[{\"text\":\"Present your findings and opinions to the group and Project Leader, both in written and oral form. Practice being concise, factual, and an effective communicator. Submit your final report, and share feedback on the project experience as a whole.\",\"type\":\"text\"}]}]}}]},\"fellows\":[{\"id\":\"03846d09-764c-4808-8a84-210743446d34\",\"name\":\"Louis O'Reilly\",\"role\":\"Finance Fellow\",\"organization\":\"Open Avenues Foundation\",\"organizationLogoUrl\":\"/images/organizations/oaf-logo.png\",\"photoUrl\":\"https://avgkrhojcamcagufngrr.supabase.co/storage/v1/object/public/fellow-headshots/03846d09-764c-4808-8a84-210743446d34.webp\",\"bio\":\"Louis is a Finance Global Talent Fellow at Open Avenues, where he works with students leading projects in finance and investment analysis.\\n\\nLouis is an investment associate at Eldridge, where he focuses on analyzing investment opportunities in both the liquid and illiquid credit markets, along with some equity opportunities. He also conducts ongoing reviews of portfolio companies, ensuring performance is in line with expectations.\\n\\nLouis has over two years of experience in the financial field, with one of those being with Eldridge, and the other with a small startup VC firm based out of Dublin. Louis also has experience with a private equity company based out of London, England, through an internship completed during his college years.\\n\\nHe holds a MSc in Finance from Trinity College Dublin and a BA in Business \u0026 Economics from Trinity College Dublin.\\n\\nA fun fact about Louis is that he played rugby for the oldest rugby club in continuous existence throughout his time at college.\\n\",\"linkedinUrl\":\"https://www.linkedin.com/in/oreillylouis/\"}],\"categories\":[\"Corporate Finance\",\"Ratio Analysis\",\"Credit\",\"Comparative Analysis\"],\"applicationTimeline\":[{\"label\":\"Applications open\",\"value\":\"May 11, 2026\"},{\"label\":\"Applications deadline\",\"value\":\"June 11, 2026\"},{\"label\":\"Application results released\",\"value\":\"Week of June 22, 2026\"},{\"label\":\"Project start date\",\"value\":\"Week of July 6, 2026\"},{\"label\":\"Project end date\",\"value\":\"Week of August 24, 2026\"}],\"cycle_id\":\"04780f7f-10bb-4b43-8480-8ef15da1b3cc\"},\"error\":\"$undefined\"}]\n"])</script></body></html>
