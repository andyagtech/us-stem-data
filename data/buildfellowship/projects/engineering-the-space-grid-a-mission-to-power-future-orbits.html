a60aa6-294bb7e111b509a4.js?dpl=dpl_A9QRwtuL4hrMD2RZGqb9eW7AtxES\",\"4420\",\"static/chunks/4420-baa8329e5076733c.js?dpl=dpl_A9QRwtuL4hrMD2RZGqb9eW7AtxES\",\"2169\",\"static/chunks/2169-1d13735e35f16c75.js?dpl=dpl_A9QRwtuL4hrMD2RZGqb9eW7AtxES\",\"419\",\"static/chunks/419-9f9e6d455ee0ae85.js?dpl=dpl_A9QRwtuL4hrMD2RZGqb9eW7AtxES\",\"5288\",\"static/chunks/5288-5d7819e0848b1b1a.js?dpl=dpl_A9QRwtuL4hrMD2RZGqb9eW7AtxES\",\"6874\",\"static/chunks/6874-67c719d6db2b17af.js?dpl=dpl_A9QRwtuL4hrMD2RZGqb9eW7AtxES\",\"6766\",\"static/chunks/6766-7fcc7eadc8fee52b.js?dpl=dpl_A9QRwtuL4hrMD2RZGqb9eW7AtxES\",\"9435\",\"static/chunks/9435-28f947009b0f7d38.js?dpl=dpl_A9QRwtuL4hrMD2RZGqb9eW7AtxES\",\"2206\",\"static/chunks/2206-42291f248e6bf19d.js?dpl=dpl_A9QRwtuL4hrMD2RZGqb9eW7AtxES\",\"5782\",\"static/chunks/5782-04eaa6c475f5c3f2.js?dpl=dpl_A9QRwtuL4hrMD2RZGqb9eW7AtxES\",\"8419\",\"static/chunks/app/projects/%5Bslug%5D/page-7f8129194c3557a1.js?dpl=dpl_A9QRwtuL4hrMD2RZGqb9eW7AtxES\"],\"default\"]\n1a:T473,Alejandro is an Aerospace Engineer Build Fellow at Open Avenues Foundation, where he works with students leading projects in aerospace engineering, specifically on CubeSat architecture and orbital energy transfer concepts.\n\nAlejandro is a Senior Systems Engineer at an electric hypercar startup, where he focuses on aligning requirements and integrating systems across all domains — from battery cell stack design, thermal management, and enclosure engineering to power electronics, embedded software, and interface systems. He is responsible for architecting the full process that ensures all systems work together seamlessly in high-performance EV applications.\n\nAlejandro has over 4 years of professional experience in the electromechanical, aerospace, and energy systems fields. His "])</script><script>self.__next_f.push([1,"career spans electric vehicle battery design, propulsion systems, and systems engineering leadership, with contributions ranging from hyper-fast charging architectures to multidisciplinary product development frameworks.\n\nHe holds a B.S. in Aerospace Engineering, an M.S. in Aerospace Engineering, and an M.S. in Mechanical and Aerospace Engineering."])</script><script>self.__next_f.push([1,"b:[\"$\",\"$L19\",null,{\"project\":{\"id\":\"e48b693e-d939-4329-937e-f3cae0f75fa0\",\"title\":\"Engineering the Space Grid: A Mission to Power Future Orbits\",\"slug\":\"engineering-the-space-grid-a-mission-to-power-future-orbits\",\"summary\":{\"type\":\"doc\",\"content\":[{\"type\":\"paragraph\",\"content\":[{\"text\":\"Apply aerospace engineering principles to design and simulate a CubeSat architecture that showcases advanced subsystem integration for precision orbital maneuvers.\",\"type\":\"text\"}]}]},\"description\":{\"type\":\"doc\",\"content\":[{\"type\":\"paragraph\",\"content\":[{\"text\":\"Small satellites called CubeSats are used everywhere in the aerospace industry — from Earth imaging to deep space research — and their design requires engineers who can think across multiple systems. In this Build Project, you’ll step into the role of an Aerospace Systems Engineer to develop a CubeSat mission concept that can perform a simple orbital maneuver.\",\"type\":\"text\"}]},{\"type\":\"paragraph\",\"content\":[{\"text\":\"You’ll start by defining a clear mission objective, then build a system overview that shows how key subsystems like power, communications, and propulsion connect. Along the way, you’ll practice trade-off thinking (weight vs. power, orbit vs. propulsion) and reflect on how risks and reliability shape real missions.\",\"type\":\"text\"}]},{\"type\":\"paragraph\",\"content\":[{\"text\":\"Under the guidance of an industry mentor, you’ll use practical frameworks like Design for Manufacturing \u0026 Assembly (DFMA) and basic orbital math to make your design more realistic. The project will wrap up with a short team pitch, where you’ll showcase your CubeSat concept, walk through your design choices, and highlight lessons learned.\",\"type\":\"text\"}]}]},\"project_area\":[\"Engineering\"],\"level\":\"Expert\",\"levelDescription\":\"Advanced experience required\",\"prerequisites\":{\"type\":\"doc\",\"content\":[{\"type\":\"paragraph\",\"content\":[{\"text\":\"Foundations of Aerospace Engineering: Understanding of key aerospace concepts such as orbital mechanic, Kepler’s laws, Newtonian dynamics and spacecraft subsystem architecture\",\"type\":\"text\"}]},{\"type\":\"paragraph\",\"content\":[{\"text\":\"CAD Design and Mechanical Layout Skills: Experience with 3D modeling tools like Onshape, Solidworks, or CATIA, with an ability to interpret and manipulate assembly files related to space-grade mechanical components\",\"type\":\"text\"}]},{\"type\":\"paragraph\",\"content\":[{\"text\":\"Circuit and PCB Design Fundamentals: A basic knowledge of schematic capture and PCB layout using tools like KiCad or Eagle, including component placement, net routing, and generating Gerber/STEP files.\",\"type\":\"text\"}]},{\"type\":\"paragraph\",\"content\":[{\"text\":\"Numerical and Analytical Problem Solving: Awareness of how to derive engineering requirements from mission goals and how they drive architecture-level design. Exposure to methods like the V-model or MAHD is a plus.\",\"type\":\"text\"}]},{\"type\":\"paragraph\",\"content\":[{\"text\":\"Project Documentation and Engineering Communication: Ability to create structured documents (e.g., risk assessments, test plans, CAD drawings, subsystem charts) and present technical information clearly in both verbal and visual formats.\",\"type\":\"text\"}]}]},\"goals\":{\"type\":\"doc\",\"content\":[{\"type\":\"paragraph\",\"content\":[{\"text\":\"Define clear mission objectives by translating a broad space challenge into measurable system-level requirements.\",\"type\":\"text\"}]},{\"type\":\"paragraph\",\"content\":[{\"text\":\"Outline a CubeSat system architecture by identifying key subsystems (e.g., power, communications, propulsion) and explaining how they connect.\",\"type\":\"text\"}]},{\"type\":\"paragraph\",\"content\":[{\"text\":\"Apply basic aerospace engineering math by performing basic calculations and creating a power budget to assess mission feasibility.\",\"type\":\"text\"}]},{\"type\":\"paragraph\",\"content\":[{\"text\":\"Recognize risks and reliability factors by identifying potential failure modes and considering basic mitigation strategies.\",\"type\":\"text\"}]},{\"type\":\"paragraph\",\"content\":[{\"text\":\"Communicate engineering concepts effectively by presenting a concise summary of mission goals, design decisions, and lessons learned.\",\"type\":\"text\"}]}]},\"schedule\":\"Mondays, 5:00 P.M. ET / 2:00 P.M. PT\",\"status\":\"archived\",\"duration\":\"8 weeks, 2-3 hours per week\",\"workshops\":{\"sessions\":[{\"name\":\"Mission Kickoff \u0026 Space Systems Basics\",\"order\":1,\"description\":{\"type\":\"doc\",\"content\":[{\"type\":\"paragraph\",\"content\":[{\"text\":\"Introduction to CubeSats, project goals, and how engineers define mission objectives. You will learn to translate user needs into clear mission requirements.\",\"type\":\"text\"}]}]}},{\"name\":\"Building the Mission Roadmap\",\"order\":2,\"description\":{\"type\":\"doc\",\"content\":[{\"type\":\"paragraph\",\"content\":[{\"text\":\"You will work on a Mission Requirements Document, outlining key goals, constraints, and performance targets for their CubeSat.\",\"type\":\"text\"}]}]}},{\"name\":\"Designing the System Architecture\",\"order\":3,\"description\":{\"type\":\"doc\",\"content\":[{\"type\":\"paragraph\",\"content\":[{\"text\":\"You will map out the CubeSat subsystems (power, propulsion, thermal, structure, comms, computer) and show how they connect in a block diagram.\",\"type\":\"text\"}]}]}},{\"name\":\"Subsystem Deep Dive\",\"order\":4,\"description\":{\"type\":\"doc\",\"content\":[{\"type\":\"paragraph\",\"content\":[{\"text\":\"You will select one or two subsystems (like power or structure) to explore in more detail. You’ll sketch or build simple CAD models and discuss design trade-offs.\",\"type\":\"text\"}]}]}},{\"name\":\"Designing for Build and Reliability\",\"order\":5,\"description\":{\"type\":\"doc\",\"content\":[{\"type\":\"paragraph\",\"content\":[{\"text\":\"Introduction to DFMA (Design for Manufacturing \u0026 Assembly) and DFMEA (Design Failure Mode \u0026 Effects Analysis). You will learn how to balance efficient manufacturing with risk awareness to strengthen their CubeSat subsystem designs.\",\"type\":\"text\"}]}]}},{\"name\":\"Risk \u0026 Reliability in Aerospace\",\"order\":6,\"description\":{\"type\":\"doc\",\"content\":[{\"type\":\"paragraph\",\"content\":[{\"text\":\"You will conduct a lightweight DFMEA (Failure Mode and Effects Analysis) to identify what could go wrong in their CubeSat and propose simple mitigations.\",\"type\":\"text\"}]}]}},{\"name\":\"Exploring Orbits \u0026 Maneuvers\",\"order\":7,\"description\":{\"type\":\"doc\",\"content\":[{\"type\":\"paragraph\",\"content\":[{\"text\":\"You will use accessible orbital simulation tools (like GMAT or online visualizers) to model a simple CubeSat maneuver, learning how propulsion links to mission objectives.\",\"type\":\"text\"}]}]}},{\"name\":\"Final Presentations \u0026 Reflection\",\"order\":8,\"description\":{\"type\":\"doc\",\"content\":[{\"type\":\"paragraph\",\"content\":[{\"text\":\"You will present your CubeSat mission concept, highlight design choices, and share lessons learned—building a professional portfolio piece.\",\"type\":\"text\"}]}]}}]},\"fellows\":[{\"id\":\"850f7d33-6477-4e5d-b8b5-bb6dbcc8c038\",\"name\":\"Alejandro Arias\",\"role\":\"Aerospace Engineering Fellow\",\"organization\":\"Open Avenues Foundation\",\"organizationLogoUrl\":\"/images/organizations/oaf-logo.png\",\"photoUrl\":\"https://avgkrhojcamcagufngrr.supabase.co/storage/v1/object/public/fellow-headshots/850f7d33-6477-4e5d-b8b5-bb6dbcc8c038.webp\",\"bio\":\"$1a\",\"linkedinUrl\":\"https://www.linkedin.com/in/aariasfelipe/\"}],\"categories\":[\"Requirements Engineering\",\"Systems Engineering Design\",\"Spacecraft Subsystem Integration\",\"CAD \u0026 Design for Space Applications\",\"Spacecraft Dynamics \u0026 Controls\",\"Failure Mode and Effects Analysis (FMEA)\"],\"applicationTimeline\":[{\"label\":\"Applications open\",\"value\":\"August 22, 2025\"},{\"label\":\"Applications deadline\",\"value\":\"September 14, 2025\"},{\"label\":\"Application results released\",\"value\":\"Week of September 22, 2025\"},{\"label\":\"Project start date\",\"value\":\"Week of October 6, 2025\"},{\"label\":\"Project end date\",\"value\":\"Week of November 24, 2025\"}],\"cycle_id\":\"d946e325-002e-4658-8923-05bdc47dc4a6\"},\"error\":\"$undefined\"}]\n"])</script></body></html>
