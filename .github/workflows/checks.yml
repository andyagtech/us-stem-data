name: checks

# Nothing ran these automatically, which is how a four-month-stale artifact
# and a site-wide broken link both survived. The offline suites need no
# credentials and no large data files, so they can run on every push.
on:
  push:
    branches: [main, assistant]
  pull_request:
  workflow_dispatch:

jobs:
  chat:
    name: chat handler (offline)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run the chat suite
        working-directory: cloud/chat
        # Stubs boto3 and hits no network. Covers the block contract, the
        # grounding ledger, prompt guardrails, the answer cache and the
        # realtime token route.
        run: python test_local.py

  contracts:
    name: model contracts and data catalog
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Model contracts
        # Artifacts derived from gitignored federal data are absent on a clean
        # checkout, so a missing file is expected here. What must always hold
        # is that the module imports, every contract is well formed, and every
        # declared source variant resolves.
        run: |
          python - <<'PY'
          import sys
          from pipeline import models as M

          assert M.CONTRACTS, "no contracts declared"
          for c in M.CONTRACTS:
              assert c.layer in ("source", "intermediate", "final"), c.name
              assert c.grain, f"{c.name} has no grain"
              assert c.columns, f"{c.name} has no columns"

          # Every declared variant must resolve at both ends of its range,
          # and the boundaries between vintages must not leave a gap.
          for v in M.SOURCE_VARIANTS:
              lo, hi = v.applies
              for y in (lo, min(hi, 2100)):
                  got = M.variant_for(v.source, y)
                  assert got.source == v.source, f"{v.source} {y} resolved wrong"

          for src in {v.source for v in M.SOURCE_VARIANTS}:
              spans = sorted((v.applies for v in M.SOURCE_VARIANTS
                              if v.source == src))
              for (a_lo, a_hi), (b_lo, b_hi) in zip(spans, spans[1:]):
                  assert b_lo == a_hi + 1, (
                      f"{src}: gap or overlap between {a_hi} and {b_lo}")

          # The award-level rule has one definition and callers delegate to it.
          assert M.award_level_basis(2009) == "aw09"
          assert M.award_level_basis(2010) == "aw17"

          # The two STEM sets must stay distinct; collapsing them is how a
          # 17-point disagreement went unnoticed.
          assert set(M.STEM_NARROW) < set(M.STEM_BROAD)
          assert M.HEADLINE_BASIS["cip_families"] == M.STEM_NARROW

          print(f"{len(M.CONTRACTS)} contracts, "
                f"{len(M.SOURCE_VARIANTS)} source variants: all well formed")
          PY

      - name: Data catalog is internally consistent
        run: |
          python - <<'PY'
          from pipeline import datasets as D
          assert D.CATALOG, "empty catalog"
          keys = [d.key for d in D.CATALOG]
          assert len(keys) == len(set(keys)), "duplicate dataset keys"
          # The catalog is declared in dependency order: nothing may consume
          # what a later entry produces.
          produced = set()
          for d in D.CATALOG:
              for need in d.consumes:
                  if any(need in o.produces for o in D.CATALOG):
                      assert need in produced, (
                          f"{d.key} consumes {need} before it is produced")
              produced.update(d.produces)
          print(f"{len(D.CATALOG)} datasets, dependency order holds")
          PY

  site:
    name: site structure and accessibility
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Site checks (offline)
        # site/ is a symlink into a private repo and is absent on a public
        # checkout, so this cannot always run. It used to end in `|| true`,
        # which made 120 assertions incapable of failing a build -- and made
        # ABSENT and BROKEN look identical. Now: skip loudly when the tree is
        # genuinely missing, run for real when it is there.
        run: |
          if [ ! -e site/index.html ]; then
            echo "::notice::site/ absent on this checkout (private). Skipping."
            exit 0
          fi
          python scripts/test_site.py --offline

      - name: Query page and Parquet exports
        run: |
          if [ ! -e site/query.html ]; then
            echo "::notice::site/ absent. Skipping query-page checks."
            exit 0
          fi
          pip install duckdb
          python scripts/test_query_page.py --local

  consistency:
    name: docs, catalog, atomic writes, dependency pins
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # Needs neither site/ nor federal data: checks the repo against itself.
      - name: Consistency checks
        run: python scripts/check_consistency.py

  units:
    name: unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: pytest
        # The chat integration suite is skipped unless RUN_CHAT_INTEGRATION=1:
        # it calls the live Lambda, costs model spend, and trips the rate
        # limiter. Leaving it in the default run kept tests/ permanently red.
        run: |
          pip install pytest
          python -m pytest tests/ -q
